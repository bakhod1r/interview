 har goroutine o'zi `ctx.Done()`ni yoki ctx'ni qabul qiluvchi chaqiruvlarni (DB, HTTP) tekshirishi kerak, aks holda ish davom etadi","Faqat `SetLimit` bilan","Panic bo'ladi"],"a":1,"e":"Go'da cancellation kooperativ: hech kim goroutine'ni majburan to'xtata olmaydi. Shuning uchun uzun tsikllarda `select { case <-ctx.Done(): return ctx.Err(); default: }` yoki I/O chaqiruvlariga ctx uzatish kerak. `errgroup.Wait` birinchi xatoni qaytaradi, lekin qolganlarini kutadi — leak shu yerdan chiqadi."},{"l":"S","t":"code","tp":"Sync","d":"go","id":30320,"n":"SN321","q":"Bu kodda qanday xato bor?","c":"type Counter struct {\n    mu sync.RWMutex\n    m  map[string]int\n}\n\nfunc (c *Counter) Inc(k string) {\n    c.mu.RLock()\n    defer c.mu.RUnlock()\n    c.m[k]++\n}","o":["`RWMutex` o'rniga `Mutex` kerak emas, kod to'g'ri","`RLock` yozuvni himoya qilmaydi — bir necha goroutine bir vaqtda `RLock` oladi va map'ga yozadi: `concurrent map writes` panic yoki buzilgan sanoq","`defer` sekin","`map` nil"],"a":1,"e":"`RLock` faqat o'qishlar uchun va ular o'zaro bloklanmaydi. Yozuvda `Lock` kerak. Bu bug yuk ostida tasodifiy panic beradi va testda chiqmaydi — shuning uchun CI'da `go test -race` majburiy. Yuqori konkurentlikda `atomic.Int64` yoki shardlangan hisoblagich mutex'dan tez bo'ladi."},{"l":"S","t":"mcq","tp":"Channels","d":"go","id":30321,"n":"SN322","q":"Worker pool'da natija kanali buferlanmagan va konsumer xato bo'lib chiqib ketdi. Nima bo'ladi?","o":["Hech narsa","Yozuvchi goroutine'lar abadiy bloklanadi — goroutine leak; shuning uchun yozish `select`da `ctx.Done()` bilan birga bo'lishi yoki konsumer kanalni oxirigacha drenaj qilishi kerak","Kanal avtomatik yopiladi","Xabarlar tashlanadi"],"a":1,"e":"Klassik leak: `results <- r` bloklangan, funksiya `return` qilmaydi, `wg.Wait()` ham abadiy kutadi. Naqsh: `select { case results <- r: case <-ctx.Done(): return }`. Qoida — kanalga yozish har doim bekor qilinishi mumkin bo'lgan operatsiya sifatida yozilsin; kanalni yopish esa faqat yozuvchi tomonning vazifasi."},{"l":"St","t":"mcq","tp":"Concurrency","d":"go","id":30322,"n":"SN323","q":"10k tashqi HTTP chaqiruvni parallel qilish kerak. To'g'ri yondashuv?","o":["10k goroutine bir vaqtda","Konkurentlikni cheklash: `errgroup` + `SetLimit(N)` yoki semaphore; N tashqi servis limitiga va o'z resursiga qarab tanlanadi, ustiga per-request timeout, retry budget va umumiy ctx deadline","`GOMAXPROCS`ni oshirish","Kanalsiz `sync.WaitGroup`"],"a":1,"e":"Goroutine arzon, lekin har biri TCP ulanish, xotira buferi va downstream yukini keltiradi — 10k parallel so'rov tashqi servisni yoki o'z FD limitini o'ldiradi. N ni empirik tanlash kerak (latency × N ≈ throughput, Little's law). Qo'shimcha: natijalarni tartibli yig'ish uchun indeksli slice, kanalga yozishdan ko'ra oddiyroq."},{"l":"S","t":"mcq","tp":"Sync","d":"go","id":30412,"n":"SN413","q":"`sync.Mutex` normal va starvation rejimlari nima?","o":["Faqat bitta rejim bor","Normal rejimda yangi kelgan goroutine navbatda kutganlarni ortda qoldirishi mumkin (throughput uchun); kutish 1 ms dan oshsa mutex starvation rejimiga o'tadi va qulf navbat bo'yicha beriladi — adolat ta'minlanadi, lekin throughput pasayadi","Faqat FIFO","Faqat spin"],"a":1,"e":"Bu gibrid dizayn: qisqa kritik bo'limlarda spin + darhol olish tez, lekin cheksiz starvation bo'lmasligi kafolatlanadi. Amaliy xulosa: mutex ostidagi ish qisqa bo'lishi kerak (I/O hech qachon qulf ostida emas); yuqori raqobatda `RWMutex` ham yordam bermasligi mumkin (o'quvchi hisoblagichi ham umumiy kesh qatori) — shardlash yoki `atomic`ga o'tiladi."},{"l":"S","t":"mcq","tp":"Sync","d":"go","id":30413,"n":"SN414","q":"`atomic.Value`/`atomic.Pointer` qaysi naqsh uchun ideal?","o":["Hisoblagich uchun","Kam o'zgaradigan, ko'p o'qiladigan konfiguratsiya/ma'lumot snapshot'i uchun: o'qish qulfsiz (copy-on-write — yangi nusxa tayyorlanib pointer atomik almashtiriladi), eski nusxani hali o'qiyotganlar xotirasi GC bilan tozalanadi","Kanal o'rniga","Faqat testda"],"a":1,"e":"Misollar: feature flag jadvali, routing jadvali, narx ro'yxati — sekundiga millionlab o'qish, daqiqada bir yangilanish. `RWMutex` bilan ham ishlaydi, lekin atomik pointer almashtirish nolga yaqin o'qish narxini beradi. Shart: saqlanayotgan struktura almashtirilgandan keyin o'zgartirilmasligi kerak (immutable)."},{"l":"S","t":"mcq","tp":"Context","d":"go","id":30414,"n":"SN415","q":"`context.WithValue` ni qanday to'g'ri ishlatiladi?","o":["Funksiya argumentlarini uzatish uchun","Faqat so'rov doirasidagi kesishuvchi ma'lumot uchun (trace ID, request ID, auth subject); kalit eksport qilinmagan maxsus tur bo'lishi kerak (kolliziya bo'lmasligi uchun), va majburiy biznes parametrlari kontekst orqali emas, aniq argument bilan uzatiladi","Har qanday ma'lumot uchun","Global holat uchun"],"a":1,"e":"Anti-pattern: kontekstga `userID` solib, chuqur qatlamda o'qish — kompilyator tekshirmaydi, yo'qolsa runtime'da bilinadi va testlash qiyin. Trace ID esa aynan mos keladi: u har qatlamga kerak lekin biznes mantiqiga tegishli emas. Kalit sifatida `type ctxKey struct{}` ishlatiladi, `string` emas."},{"l":"St","t":"mcq","tp":"Concurrency","d":"go","id":30415,"n":"SN416","q":"Fan-in/fan-out pipeline'da 'graceful' to'xtatish qanday quriladi?","o":["Kanallarni yopmasdan qoldirish","Har bosqich: yozuvchi tugagach o'z chiqish kanalini yopadi (faqat yozuvchi yopadi), o'quvchi `range` bilan tugaydi; bekor qilish uchun barcha bosqichda `ctx.Done()` bilan `select`; fan-in'da `sync.WaitGroup` tugagach birlashgan kanal yopiladi","Har bosqichda `panic`","Kanalni o'quvchi yopadi"],"a":1,"e":"Ikki qoida yetarli: (1) kanalni faqat unga yozuvchi yopadi, (2) har bloklanuvchi operatsiya `ctx.Done()` bilan birga `select`da. Aks holda erta chiqishda yozuvchilar abadiy bloklanadi (goroutine leak) yoki yopilgan kanalga yozib panic bo'ladi. Testda `goleak` bilan tekshiriladi."},{"l":"P","t":"mcq","tp":"Runtime","d":"go","id":19000,"n":"RT1","q":"Goroutine stack'i qanday o'sadi?","o":["~2 KB dan boshlanadi; funksiya prologidagi tekshiruv (morestack) yetishmasligini sezsa, ikki barobar katta stack ajratib butun stack'ni NUSXA ko'chiradi va pointer'larni tuzatadi; GC vaqtida qisqarishi ham mumkin","Fiksirlangan 8 MB, OS thread kabi","Heap'da bog'langan ro'yxat sifatida o'sadi","O'smaydi — chuqur rekursiya darhol crash beradi"],"a":0,"e":"Stack ko'chirilishi mumkin bo'lgani uchun Go'da stack'dagi obyektga tashqi (unsafe) pointer saqlash xavfli — runtime faqat o'zi biladigan pointer'larni tuzatadi. Maksimal stack default 1 GB (runtime/debug.SetMaxStack); cheksiz rekursiya 'goroutine stack exceeds' bilan tugaydi. Amaliy xulosa: goroutine arzon (~2 KB), lekin million goroutine baribir gigabayt demak.","src":"https://go.dev/doc/faq#goroutines"},{"l":"P","t":"mcq","tp":"Runtime","d":"go","id":19001,"n":"RT2","q":"Go 1.14 gacha `for {}` tight loop butun GC'ni to'xtatib qo'yardi. Nima o'zgardi?","o":["Asinxron preemption: runtime goroutine'ga signal (SIGURG) yuborib uni to'xtatadi — endi funksiya chaqiruvisiz loop ham preempt qilinadi","GC endi goroutine'larni kutmaydi","Kompilyator loop'ga chaqiruv qo'shadi","Hech narsa o'zgarmagan"],"a":0,"e":"Oldin preemption faqat kooperativ edi: chaqiruv nuqtasidagi stack tekshiruvida. Chaqiruvsiz hisob-kitob loop'i P ni ushlab turar, STW fazasi cheksiz kutardi. 1.14 dan signal asosidagi preemption bor. Baribir cgo chaqiruvi yoki uzoq syscall preempt qilinmaydi — sysmon 10 ms dan keyin P ni tortib oladi (handoff).","src":"https://go.dev/doc/go1.14#runtime"},{"l":"P","t":"mcq","tp":"Runtime","d":"go","id":19002,"n":"RT3","q":"Bloklovchi tarmoq o'qishi (conn.Read) OS thread'ni bloklaydimi?","o":["Yo'q — fayl deskriptori netpoller'ga (epoll/kqueue/IOCP) qo'yiladi, goroutine park qilinadi, M boshqa goroutine'ga o'tadi; tayyor bo'lganda goroutine runq'ga qaytariladi","Ha, har ulanish uchun bitta OS thread","Ha, lekin faqat TLS'da","Netpoller faqat Linux'da ishlaydi"],"a":0,"e":"Shuning uchun Go'da 'thread per connection' modeli sodda ko'rinib, ichkarida event loop bilan ishlaydi. Ammo fayl I/O va cgo chaqiruvi HAQIQIY bloklovchi syscall — u M ni bloklaydi va runtime yangi M yaratadi (thread soni o'sadi). Ko'p cgo yoki disk I/O bo'lgan servisda thread soni kutilmaganda o'sishining sababi shu; runtime/metrics bilan kuzatiladi."},{"l":"P","t":"mcq","tp":"Runtime","d":"go","id":19003,"n":"RT4","q":"Go scheduler'da work stealing nima?","o":["P o'z lokal runq'i bo'shasa, global navbatdan, netpoller'dan yoki boshqa P'ning navbatidan (yarmini) goroutine o'g'irlaydi — yuk avtomatik balanslanadi","Har goroutine o'z thread'ini oladi","OS scheduler bilan bir xil","Faqat GOMAXPROCS=1 da ishlaydi"],"a":0,"e":"GMP: G — goroutine, M — OS thread, P — bajarish konteksti (GOMAXPROCS ta). Lokal runq 256 ta, to'lgani global'ga tushadi. Adolat uchun har 61-planlashtirishda global navbatdan olinadi, yangi yaratilgan goroutine esa runnext slot'iga tushadi (lokallikni saqlash). Diagnostika: GODEBUG=schedtrace=1000 va `go tool trace`."},{"l":"P","t":"code","tp":"Runtime","d":"go","id":19004,"n":"RT5","q":"Bu struct necha bayt egallaydi (64-bit)?","c":"type A struct {\n    a bool   // 1\n    b int64  // 8\n    c bool   // 1\n}","o":["24 — alignment tufayli a dan keyin 7 bayt padding, oxirida ham 7 bayt; maydonlarni kattadan kichikka tartiblasa 16 bayt","10","16","24, lekin tartib hech narsani o'zgartirmaydi"],"a":0,"e":"Har maydon o'z alignment'iga (int64 uchun 8) moslanadi, struct hajmi esa eng katta alignment'ga karrali bo'ladi. Millionlab element bo'lgan slice'da bu jiddiy: 24 va 16 bayt orasidagi farq 33% xotira. Tekshirish: unsafe.Sizeof, `fieldalignment` linter (golangci-lint). Lekin mikro-optimizatsiya sifatida emas — faqat katta massivlar va hot struct'larda."},{"l":"P","t":"mcq","tp":"Runtime","d":"go","id":19005,"n":"RT6","q":"False sharing nima va Go'da qanday hal qilinadi?","o":["Turli goroutine'lar bir kesh qatoridagi (64 bayt) qo'shni o'zgaruvchilarni yangilasa, kesh qatori yadrolar orasida urishadi; yechim — counter'larni padding bilan alohida qatorga ajratish yoki shardlash","Bir o'zgaruvchiga parallel yozish — data race bilan bir xil","Faqat atomic bo'lmagan kodda bo'ladi","Go runtime buni o'zi hal qiladi"],"a":0,"e":"Tipik shakl: []int64 counter massivi, har worker o'z indeksini oshiradi — mantiqan race yo'q, lekin throughput keskin tushadi. Yechim: struct { v int64; _ [56]byte } yoki per-P/per-worker holat + oxirida yig'ish. Runtime o'zi ham shunday qiladi (masalan per-P kesh, mcache). Aniqlash: perf/pprof'da atomik operatsiyalarda kutilmagan vaqt."},{"l":"P","t":"mcq","tp":"Runtime","d":"go","id":19006,"n":"RT7","q":"Go memory model bo'yicha qaysi kafolat to'g'ri?","o":["Channel'ga yuborish, o'sha qiymatni qabul qilish tugashidan OLDIN sodir bo'ladi; yopilgan channel'dan o'qish close'dan keyin; Unlock keyingi Lock'dan oldin; Go 1.19 dan sync/atomic ketma-ket izchil (sequentially consistent)","Har yozuv darhol barcha goroutine'larga ko'rinadi","volatile kalit so'zi kerak","Faqat mutex sinxronizatsiya beradi"],"a":0,"e":"Sinxronizatsiyasiz parallel kirish — aniqlanmagan xatti-harakat, 'faqat bayroq o'zgaruvchisi' ham race. Amaliy xulosa: bayroqni bool bilan emas, atomic.Bool yoki channel bilan bering. Data race — bug, 'toqat qilinadigan' holat emas: kompilyator va CPU qayta tartiblashi mumkin.","src":"https://go.dev/ref/mem"},{"l":"P","t":"mcq","tp":"Runtime","d":"go","id":19007,"n":"RT8","q":"Map'ga bir vaqtda yozish nima bilan tugaydi?","o":["`fatal error: concurrent map writes` — bu panic emas, recover bilan ushlab bo'lmaydi va jarayon o'ladi; runtime buni ehtimollik bilan aniqlaydi","panic, recover bilan ushlanadi","Jimgina buzilgan ma'lumot","Hech narsa, map thread-safe"],"a":0,"e":"Runtime map'da yozuv bayrog'ini tekshiradi — aniqlangan holatda darhol throw qiladi (xotira buzilishidan ko'ra o'lish xavfsizroq). Aniqlash kafolatlangan emas, shuning uchun `-race` kerak. Yechim: mutex, sharded map, yoki sync.Map (faqat mos ssenariyda). Go 1.24 dan map ichki tuzilishi Swiss table — tezroq, lekin semantikasi o'zgarmagan."},{"l":"P","t":"mcq","tp":"Runtime","d":"go","id":19008,"n":"RT9","q":"`sync.Map` qachon oddiy map+RWMutex'dan yaxshi?","o":["Ikki ssenariy: (1) kalit bir marta yozilib ko'p marta o'qiladi, (2) turli goroutine'lar turli kalitlar bilan ishlaydi; aks holda mutex bilan oddiy map tezroq va tipli","Har doim yaxshiroq","Hech qachon ishlatilmaydi","Faqat kichik map'lar uchun"],"a":0,"e":"Ichkarida: atomik o'qiladigan `read` map + mutex bilan himoyalangan `dirty` map; o'qish ko'pincha lock'siz. Yozuv ko'p bo'lsa dirty doimiy qayta qurilib, sekinlashadi. Kamchiliklari: any tiplar (allokatsiya, tip xavfsizligi yo'q), Len yo'q. Go 1.24 da ichki implementatsiya HashTrieMap'ga almashtirildi. Tanlovni benchmark bilan tasdiqlang."},{"l":"P","t":"mcq","tp":"Runtime","d":"go","id":19009,"n":"RT10","q":"Go GC haqida qaysi ta'rif to'g'ri?","o":["Konkurent, uch rangli mark-sweep, kompaktlashtirmaydi; write barrier bilan ishlaydi; STW pauzalari juda qisqa (odatda <1 ms), lekin mark assist orqali allokatsiya qiluvchi goroutine GC ishining bir qismini bajaradi","Generatsion (young/old)","To'liq stop-the-world","Reference counting"],"a":0,"e":"Kompaktlashtirmagani uchun Go'da xotira fragmentatsiyasi bo'lishi mumkin, lekin pointer'lar barqaror (cgo uchun qulay). 'GC vaqti ko'p' muammosi odatda pauza emas, balki mark assist va yuqori allokatsiya tezligi: yechim — allokatsiyani kamaytirish (sync.Pool, oldindan Grow, pointer'siz tuzilmalar), GOGC/GOMEMLIMIT sozlash. Kuzatuv: GODEBUG=gctrace=1, /gc/ metrikalar, pprof allocs profili.","src":"https://go.dev/doc/gc-guide"},{"l":"P","t":"mcq","tp":"Runtime","d":"go","id":19010,"n":"RT11","q":"Pointer'siz tuzilma GC uchun nega muhim?","o":["GC faqat pointer saqlaydigan obyektlarni skanerlaydi — []int yoki []byte skanerlanmaydi, []*T esa har elementni skanerlaydi; katta map/slice'da bu GC vaqtini belgilaydi","GC hamma obyektni bir xil skanerlaydi","Pointer'siz tuzilma sekinroq","Faqat 32-bit tizimlarda farq qiladi"],"a":0,"e":"Amaliy naqsh: map[string]*Item o'rniga slice ichida indeks bilan ishlash (map[string]int32 + []Item) katta keshlarda GC vaqtini bir necha barobar kamaytiradi. Shu g'oya asosida freecache/bigcache kabi kutubxonalar ma'lumotni []byte arenalarda saqlaydi. String ham pointer saqlaydi — millionlab string kalitlar GC uchun qimmat."},{"l":"P","t":"mcq","tp":"Runtime","d":"go","id":19011,"n":"RT12","q":"`defer` narxi qanday?","o":["Go 1.14 dan ochiq kodlangan (open-coded) defer deyarli bepul; lekin LOOP ichidagi yoki shartli defer heap'ga tushib qimmatlashadi","Har doim juda qimmat, hot path'da ishlatilmaydi","Umuman narxi yo'q","Faqat panic bo'lsa ishlaydi"],"a":0,"e":"Kompilyator defer'lar soni statik ma'lum bo'lsa ularni to'g'ridan-to'g'ri funksiya oxiriga inline qiladi. Qo'shimcha: recover bo'lgan funksiya inline qilinmaydi. Qoida: mutex Unlock uchun defer'dan tortinmang (to'g'rilik muhimroq), lekin million marta aylanuvchi loop ichida defer o'rniga aniq chaqiruv yoki ichki funksiya ishlating.","src":"https://go.dev/doc/go1.14#runtime"},{"l":"P","t":"mcq","tp":"Runtime","d":"go","id":19012,"n":"RT13","q":"Interface orqali metod chaqirish nega konkret tipdan sekinroq?","o":["itab orqali dinamik dispatch — inline qilib bo'lmaydi va qiymat interface'ga solinganda ko'pincha heap allokatsiyasi (boxing) bo'ladi; PGO devirtualizatsiya bilan qisman yechadi","Sekinroq emas, bir xil","Har chaqiruvda reflection ishlatiladi","Interface metodlari sinxronizatsiya talab qiladi"],"a":0,"e":"Asosiy narx chaqiruvning o'zi emas, inline qilinmasligi va allokatsiya. Tipik misol: fmt.Println(x) — x interface{} ga boxing qilinadi va escape qiladi (shuning uchun hot path'da log qo'shish allokatsiyani oshiradi). Go 1.21+ PGO profil asosida eng ko'p uchraydigan konkret tipni topib devirtualize qiladi."},{"l":"P","t":"mcq","tp":"Runtime","d":"go","id":19013,"n":"RT14","q":"Generiklar Go'da qanday kompilyatsiya qilinadi?","o":["GC shape stenciling: bir xil 'shakl'dagi tiplar (barcha pointer tiplar) bitta instansiyani ulashadi va dictionary orqali metadata oladi; shuning uchun generic kod ba'zan qo'lda yozilgan konkret koddan sekinroq","Har tip uchun to'liq alohida kod (C++ kabi)","Runtime'da reflection bilan","Type erasure (Java kabi)"],"a":0,"e":"int, float64 kabi qiymat tiplari o'z stensilini oladi; barcha pointer tiplar bitta shaklni ulashadi va metod chaqiruvi dictionary orqali ketadi — bu inline'ni to'sadi. Xulosa: generiklar tip xavfsizligi va takrorlanishni kamaytirish uchun, avtomatik tezlik uchun emas — ishlash muhim bo'lsa benchmark qiling.","src":"https://go.dev/blog/intro-generics"},{"l":"P","t":"mcq","tp":"Runtime","d":"go","id":19018,"n":"RT19","q":"`runtime.SetFinalizer` nega tavsiya etilmaydi?","o":["Finalizer ishga tushishi kafolatlanmaydi, GC'ni kechiktiradi, tsikl hosil qilsa obyekt hech qachon ozod bo'lmaydi; resurslarni aniq Close/defer bilan yopish kerak (Go 1.24 dan AddCleanup va weak pointer'lar bor)","Finalizer determinstik ishlaydi va yaxshi usul","Faqat cgo'da ishlaydi","GC'ni tezlashtiradi"],"a":0,"e":"Go'da resurs boshqaruvi aniq: Close(), defer, context bilan bekor qilish. Finalizer faqat 'zaxira tarmoq' sifatida (masalan os.File unutilgan deskriptorni yopadi). Go 1.24 da runtime.AddCleanup finalizer'ning kamchiliklarini (obyektni tiriltirish, tsikllar) yopadi, weak.Pointer esa kesh uchun zaif havolalar beradi.","src":"https://pkg.go.dev/runtime#AddCleanup"},{"l":"P","t":"mcq","tp":"Runtime","d":"go","id":19020,"n":"RT21","q":"`time.After` ni loop ichida ishlatish nima uchun xavfli?","o":["Har chaqiruv yangi timer yaratadi va u ishlab bo'lgunicha ozod bo'lmaydi — uzoq davom etadigan select loop'da xotira va timer navbati o'sadi; time.NewTimer + Reset yoki context ishlatiladi","Timer umuman ishlamaydi","Timer GC tomonidan darhol tozalanadi va hodisa yo'qoladi","Faqat 1 soniyadan katta interval xavfli"],"a":0,"e":"Go 1.23 da timer implementatsiyasi qayta yozildi va ishlamagan timer endi tezroq yig'iladi, shuningdek Timer.Stop/Reset semantikasi soddalashdi (kanal buferi yo'q). Baribir to'g'ri naqsh: uzoq yashaydigan select'da bitta timer/ticker yaratib qayta ishlatish va defer t.Stop() qilish; bekor qilish uchun esa ctx.Done().","src":"https://go.dev/doc/go1.23#timer-changes"},{"l":"P","t":"mcq","tp":"Runtime","d":"go","id":19022,"n":"RT23","q":"GODEBUG nima uchun kerak va go.mod bilan qanday bog'liq?","o":["Runtime xatti-harakatini diagnostika va moslik uchun o'zgartiradi (gctrace, schedtrace, http2debug, x509 kabi); Go 1.21 dan mosliksiz o'zgarishlar GODEBUG bilan qaytariladi va go.mod'dagi `go` yo'nalishi default qiymatlarni belgilaydi","Faqat kompilyator bayrog'i","Production'da har doim yoqiladi","Test uchun kutubxona"],"a":0,"e":"Misollar: GODEBUG=gctrace=1 har GC bo'yicha qator; schedtrace=1000 scheduler holati; madvdontneed=1 xotirani OS'ga tezroq qaytarish. Moslik mexanizmi: Go versiyasini oshirganda xatti-harakat o'zgarsa, eski holatni GODEBUG=<name>=<val> bilan vaqtincha qaytarish mumkin — migratsiyani bosqichli qiladi.","src":"https://go.dev/doc/godebug"},{"l":"P","t":"mcq","tp":"Runtime","d":"go","id":30401,"n":"SN402","q":"G-M-P modelida `P` nima uchun kerak?","o":["P — protsessor yadrosi","P (processor) — rejalashtirish konteksti: mahalliy run queue va mahalliy xotira keshini (mcache) ushlaydi; `GOMAXPROCS` P sonini belgilaydi, shu bilan bir vaqtda bajariluvchi goroutine soni cheklanadi va global qulf kerak bo'lmaydi","P — goroutine","P — OS threadning boshqa nomi"],"a":1,"e":"P bo'lmasa har goroutine olish uchun global navbat qulfi kerak bo'lardi — bu miqyoslashmaydi. P bilan har thread o'z lokal navbatidan oladi (256 ta slot), bo'shasa boshqa P'dan yarmini o'g'irlaydi (work stealing) yoki global navbatdan oladi. `mcache` ham P'ga bog'langan — kichik ajratmalar qulfsiz bo'ladi."},{"l":"P","t":"mcq","tp":"Runtime","d":"go","id":30402,"n":"SN403","q":"Blokirovka qiluvchi syscall (masalan fayl o'qish) bajarilganda scheduler nima qiladi?","o":["Butun dastur to'xtaydi","M (thread) syscall'da bloklanadi, lekin `sysmon` uni sezib P'ni ajratib oladi va boshqa M'ga beradi — qolgan goroutine'lar ishlashda davom etadi; syscall tugagach goroutine yana P kutadi","Goroutine bekor qilinadi","Yangi P yaratiladi"],"a":1,"e":"Shu sabab `GOMAXPROCS=4` bo'lsa ham jarayonda o'nlab thread bo'lishi mumkin (`runtime/metrics` yoki `/debug/pprof/threadcreate` bilan ko'rinadi). Tarmoq I/O esa boshqacha: u netpoller (epoll/kqueue) orqali asinxron bo'ladi va thread bloklanmaydi — shuning uchun 100k tarmoq ulanishi arzon, 100k fayl o'qish esa emas. cgo chaqiruvi ham syscall kabi thread band qiladi."},{"l":"P","t":"mcq","tp":"Runtime","d":"go","id":30403,"n":"SN404","q":"Go GC tricolor marking'da write barrier nimaga kerak?","o":["Xotirani tezlashtirish","Konkurent marking paytida ilova pointerlarni o'zgartiradi — write barrier yangi havolalarni qayd qilib 'oq' obyekt qora obyektga ulanib yashirin qolib ketishini oldini oladi (strong/weak tricolor invariantini saqlaydi)","GC'ni to'xtatish","Stack o'sishi uchun"],"a":1,"e":"Barriersiz konkurent GC tirik obyektni o'chirib yuborishi mumkin. Go hybrid write barrier (Yuasa + Dijkstra) ishlatadi — bu stack'larni qayta skanerlash zaruratini yo'qotdi va STW pauzani mikrosekundlarga tushirdi (Go 1.8+). Narxi: har pointer yozuvida kichik qo'shimcha, shuning uchun pointer-og'ir strukturalar GC bosimini oshiradi (`[]*T` o'rniga `[]T` ko'pincha tezroq)."},{"l":"P","t":"mcq","tp":"Runtime","d":"go","id":30404,"n":"SN405","q":"Go'da GC qachon ishga tushadi va `GOGC` nimani boshqaradi?","o":["Har sekundda","Heap oldingi sikl oxiridagi tirik hajmdan `GOGC` foizga o'sganda (`GOGC=100` = ikki barobar); `GOMEMLIMIT` esa qattiq yuqori chegara — unga yaqinlashganda GC chastotasi oshadi. Ikkisi birga ishlatiladi","Faqat `runtime.GC()` bilan","Xotira tugaganda"],"a":1,"e":"Konteynerda tipik sozlama: `GOMEMLIMIT` limitdan ~10-20% past, `GOGC` esa o'rtacha holatda CPU/xotira balansi uchun (masalan 100 yoki 200). Faqat `GOGC=off` + `GOMEMLIMIT` kombinatsiyasi ham qo'llanadi: GC faqat limitga yaqinlashganda ishlaydi — bu latency-sezgir servislarda CPU'ni tejaydi, lekin xotira profilini yaxshi bilish kerak."},{"l":"P","t":"mcq","tp":"Runtime","d":"go","id":30405,"n":"SN406","q":"Goroutine preemption qanday ishlaydi (Go 1.14+)?","o":["Faqat funksiya chaqiruvida","Asinxron preemption: `sysmon` 10ms dan uzun ishlayotgan goroutine'ga signal (SIGURG) yuboradi va uni xavfsiz nuqtada to'xtatadi — shuning uchun tsikl ichida chaqiruvsiz `for {}` ham endi butun P'ni bloklamaydi","Preemption yo'q","OS o'zi qiladi"],"a":1,"e":"1.14 gacha preemption kooperativ edi: funksiya prologidagi stack tekshiruvi orqali. Shuning uchun `for i := 0; i < 1e10; i++ {}` kabi tsikl GC'ni ham to'xtatib qo'yardi (butun dastur qotib qolardi). Hozir bu muammo yo'q, lekin cgo chaqiruvi va ba'zi assembler bo'laklari hali ham preempt qilinmaydi."},{"l":"P","t":"mcq","tp":"Runtime","d":"go","id":30406,"n":"SN407","q":"Go xotira modeli (happens-before) nimani kafolatlaydi?","o":["Har yozuv darhol barcha goroutine'ga ko'rinadi","Faqat sinxronizatsiya orqali tartib: kanal yuborish/qabul qilish, mutex `Unlock`/`Lock`, `sync.Once`, `WaitGroup`, va `sync/atomic` operatsiyalari happens-before munosabatini o'rnatadi; ularsiz bir goroutine yozgan qiymatni boshqasi hech qachon ko'rmasligi ham mumkin","Volatile o'zgaruvchi kerak","Hamma narsa avtomatik sinxron"],"a":1,"e":"Amaliy natija: `done = true` va `data = x` ni oddiy o'zgaruvchi bilan sinxronlash noto'g'ri — kompilyator va CPU tartibni o'zgartirishi mumkin. To'g'ri: kanal, mutex yoki `atomic.Bool`/`atomic.Pointer`. Go 1.19'dan atomiklar sequentially consistent deb rasman hujjatlashtirilgan. `-race` aynan shu qoidalar buzilishini aniqlaydi."},{"l":"P","t":"mcq","tp":"Runtime","d":"go","id":30407,"n":"SN408","q":"Go'da map ichki tuzilishi qanday va nega iteratsiya tartibi tasodifiy?","o":["Qizil-qora daraxt","Bucket'lar massivi (har bucketda 8 kalit, tophash bilan tez solishtirish), kolliziyada overflow bucket; o'sishda incremental rehash (evacuation). Iteratsiya tasodifiy bucket'dan boshlanadi — bu ataylab, dasturchilar tartibga tayanmasligi uchun","Bog'langan ro'yxat","Ochiq adreslash, tartib doimiy"],"a":1,"e":"Nozik natijalar: map o'sishi amortizatsiyalangan lekin evacuation paytida yozuvlar biroz sekinroq; map elementi addressable emas (ko'chishi mumkin); katta map GC skan vaqtini oshiradi (agar kalit/qiymatda pointer bo'lsa — `map[int]int` pointersiz va arzonroq). Kutilgan hajm ma'lum bo'lsa `make(map[K]V, n)` rehash'ni oldini oladi."},{"l":"P","t":"mcq","tp":"Runtime","d":"go","id":30408,"n":"SN409","q":"Unbuffered kanal orqali yuborish ichkarida qanday bajariladi?","o":["Xotiraga yoziladi va keyin o'qiladi","Kutayotgan qabul qiluvchi bo'lsa — qiymat to'g'ridan-to'g'ri uning stack'iga ko'chiriladi va goroutine darhol ishga tayyor qilinadi (bufer yo'q); bo'lmasa yuboruvchi `sudog` sifatida navbatga qo'yilib parkga (uyquga) ketadi","OS pipe ishlatiladi","Har doim bloklanmaydi"],"a":1,"e":"Shuning uchun unbuffered kanal 'sinxronlash nuqtasi' deyiladi va happens-before beradi. Ishlash nuqtai nazaridan: kanal har operatsiyada `hchan` mutexini oladi — juda yuqori chastotali hisoblagich uchun kanal `atomic`dan sekinroq. Select esa bir necha kanalga navbatga turadi va tasodifiy tanlaydi (starvationni oldini olish uchun)."},{"l":"M","t":"mcq","tp":"Tooling","d":"go","id":18018,"n":"GR19","q":"`go mod tidy`, `go mod vendor`, `go.sum` — har biri nima qiladi?","o":["tidy — ishlatilmagan modullarni olib tashlab, yetishmayotganini qo'shadi; vendor — bog'liqliklarni repo ichidagi vendor/ ga nusxalaydi; go.sum — modul kontenti hash'lari (yaxlitlik tekshiruvi), versiya tanlash go.mod'da","go.sum versiyalarni tanlaydi","vendor kerak emas, tidy uni almashtiradi","tidy versiyalarni oxirgisiga yangilaydi"],"a":0,"e":"go.sum — qulf emas: versiyalar MVS bilan go.mod'dan aniqlanadi, go.sum faqat yuklangan kod o'zgarmaganini tasdiqlaydi. CI'da `go mod tidy -diff` (Go 1.23+) yoki tidy'dan keyin git diff bo'sh ekanini tekshirish odat. GOFLAGS=-mod=readonly (default) tasodifiy o'zgarishlarni to'xtatadi; GOPRIVATE/GONOSUMDB — ichki modullar uchun."},{"l":"S","t":"mcq","tp":"Tooling","d":"go","id":18019,"n":"GR20","q":"Kutubxonangizni v2 ga chiqaryapsiz. Nima qilish kerak?","o":["Modul yo'liga /v2 qo'shish (module example.com/lib/v2) — import yo'li ham o'zgaradi; aks holda go eski majorni oladi","Faqat tag qo'yish yetarli","go.mod'da major yozilmaydi","v2 uchun yangi repo shart"],"a":0,"e":"Semantic import versioning: turli major versiyalar — turli modullar, ular bir binary'da yonma-yon yashashi mumkin (bu diamond dependency muammosini yechadi). v0/v1 suffiks talab qilmaydi. Amalda: /v2 katalogi yoki asosiy shoxda go.mod yo'lini o'zgartirish + v2.0.0 tag.","src":"https://go.dev/blog/v2-go-modules"},{"l":"M","t":"mcq","tp":"Tooling","d":"go","id":18020,"n":"GR21","q":"Qaysi vositalar CI'da bo'lishi kerak va ular nimani topadi?","o":["go vet (shubhali konstruksiyalar: printf formati, copylocks, loopclosure), staticcheck (o'lik kod, noto'g'ri API ishlatish), golangci-lint (agregator), govulncheck (bog'liqliklardagi ma'lum CVE, chaqiruv grafiga qarab), gofmt/goimports","Faqat gofmt yetarli","golangci-lint go vet'ni almashtirmaydi va kerak emas","govulncheck — bu test vositasi"],"a":0,"e":"govulncheck muhim farqi: u nafaqat zaif versiyani, balki zaif FUNKSIYA chaqirilganini tekshiradi — shuning uchun shovqin kam. Minimal CI: gofmt -l, go vet, golangci-lint run, go test -race -cover, govulncheck ./..."},{"l":"S","t":"mcq","tp":"Tooling","d":"go","id":18021,"n":"GR22","q":"Build tag (constraint) nimaga kerak va qanday yoziladi?","o":["//go:build linux && amd64 — faylni faqat mos platformada kompilyatsiya qiladi; integration testlarni ajratish uchun ham ishlatiladi (//go:build integration + go test -tags=integration)","Kompilyatorga optimizatsiya ko'rsatmasi","Faqat cgo uchun","Runtime'da tekshiriladi"],"a":0,"e":"Eski `// +build` sintaksisi Go 1.17 dan `//go:build` bilan almashdi (gofmt ikkalasini sinxron tutadi). Fayl nomi bo'yicha implicit constraint ham bor: foo_linux.go, foo_windows_amd64.go, foo_test.go. Cross-compilation: GOOS=linux GOARCH=arm64 go build — cgo bo'lmasa qo'shimcha toolchain kerak emas (CGO_ENABLED=0)."},{"l":"M","t":"mcq","tp":"Tooling","d":"go","id":18022,"n":"GR23","q":"`go generate` nima qiladi?","o":["Kodni o'zi generatsiya qilmaydi — fayldagi //go:generate qatorlaridagi komandalarni ishga tushiradi; natija repo'ga commit qilinadi va build'ga bog'liq emas","Build vaqtida avtomatik ishlaydi","go build ning bir qismi","Faqat protobuf uchun"],"a":0,"e":"Tipik ishlatilishi: mockgen, stringer, sqlc, protoc, wire. Muhim: go build hech qachon go generate chaqirmaydi — CI'da generatsiya qayta ishga tushirilib, git diff bo'sh ekanini tekshirish kerak, aks holda generatsiya qilingan kod eskirib qoladi. Go 1.24 dan `tool` direktivasi bilan vositalar go.mod'da versiyalanadi."},{"l":"P","t":"mcq","tp":"Tooling","d":"go","id":18023,"n":"GR24","q":"Reflection va `unsafe` paketi haqida senior qarashi?","o":["Reflection — sekin va kompilyator tekshiruvini yo'qotadi, faqat chegaraviy kodda (serializatsiya, ORM, DI) o'rinli; unsafe — tip tizimini chetlab o'tadi, GC kafolatlarini buzishi mumkin, deyarli hech qachon ilova kodida kerak emas","Reflection tez, erkin ishlating","unsafe.Pointer oddiy pointer bilan bir xil","Generiklar reflection bilan bir xil ishlaydi"],"a":0,"e":"Generiklar ko'p holatda reflection'ni almashtiradi va kompilyatsiya vaqtida tekshiriladi. unsafe ishlatilsa qoidalar qat'iy (unsafe.Pointer konvertatsiyasining ruxsat etilgan shakllari) — buzilsa GC obyektni noto'g'ri ko'chirishi mumkin. `go vet` unsafeptr tekshiruvi va `-race`/`-d=checkptr` yordam beradi. Amalda unsafe faqat past darajali kutubxonalarda (masalan strings.Builder ichida) oqlanadi.","src":"https://pkg.go.dev/unsafe"},{"l":"S","t":"mcq","tp":"Tooling","d":"go","id":20000,"n":"GT1","q":"Ichki (private) modullarni qanday ulaysiz?","o":["GOPRIVATE=github.com/kompaniya/* — proxy va sumdb chetlab o'tiladi; git uchun SSH yoki token bilan insteadOf sozlanadi; CI'da ham xuddi shu muhit o'zgaruvchilari kerak","Vendor qilishdan boshqa yo'l yo'q","Modullar faqat ochiq bo'lishi mumkin","GOPROXY=off qilish yetarli"],"a":0,"e":"GOPRIVATE bir vaqtda GONOPROXY va GONOSUMDB ni belgilaydi. Kompaniya miqyosida yaxshiroq yechim — o'z proxy'ingiz (Athens, Artifactory): tashqi modullar keshlanadi (upstream o'chsa build buzilmaydi), audit va tezlik yaxshilanadi. GOFLAGS=-mod=readonly va commit qilingan go.sum bilan birga supply chain nazorati kuchayadi."},{"l":"S","t":"mcq","tp":"Tooling","d":"go","id":20001,"n":"GT2","q":"`go build` chiqargan binary'ga versiya ma'lumotini qanday joylaysiz?","o":["-ldflags \"-X main.version=$(git describe --tags) -X main.commit=$SHA\"; yoki Go 1.18+ da runtime/debug.ReadBuildInfo() VCS ma'lumotini o'zi beradi","Faqat konstanta sifatida qo'lda yozish","Environment variable orqali runtime'da","Binary versiya saqlay olmaydi"],"a":0,"e":"ReadBuildInfo() modul versiyalari, VCS commit va 'dirty' holatini qaytaradi — reproducible build va incident tekshiruvi uchun qimmatli. Hajmni kamaytirish uchun -ldflags=\"-s -w\" (debug simvollari olib tashlanadi, lekin panic stack'lari qoladi; profiling qiyinlashadi). `/healthz` yoki `--version` chiqishida versiya+commit ko'rsatish deploy tekshiruvini osonlashtiradi."},{"l":"St","t":"mcq","tp":"Tooling","d":"go","id":20002,"n":"GT3","q":"Monorepo'da ko'p Go servisi bor. Modul strategiyasi qanday bo'ladi?","o":["Odatda bitta modul (yagona go.mod) — bog'liqlik versiyalari bir xil, refaktoring oson; ko'p modul faqat alohida relizlanadigan public kutubxona uchun, va u holda go.work lokal ishlash uchun","Har servisga alohida modul — har doim to'g'ri","Modulsiz GOPATH rejimi","Har paketga go.mod"],"a":0,"e":"Ko'p modul narxi: har birida versiya ko'tarish, o'zaro replace/go.work, CI murakkabligi. Bitta modulda esa hamma bir versiyada yuradi ('diamond' muammosi yo'q) va katta refaktoring bir PR'da bo'ladi. Chegara qo'yish uchun modul emas, `internal/` kataloglari va import linteri (depguard) ishlatiladi. go.work faqat lokal ishlab chiqish uchun — go.work.sum va go.work odatda commit qilinmaydi (jamoa kelishuviga bog'liq)."},{"l":"S","t":"mcq","tp":"Tooling","d":"go","id":20003,"n":"GT4","q":"`internal/` katalogi nima qiladi?","o":["internal ostidagi paketlarni faqat uning ota-katalogidan pastdagi kod import qila oladi — kompilyator darajasida majburlangan chegara","Shunchaki kelishuv, kompilyator tekshirmaydi","Faqat testlar uchun","Kod generatsiyasi uchun"],"a":0,"e":"Bu Go'dagi yagona til darajasidagi paket ko'rinish chegarasi. Amaliy tuzilma: cmd/<servis>/main.go — ishga tushirish; internal/<bounded context>/{domain,app,adapters} — biznes; pkg/ faqat haqiqatan tashqariga beriladigan kod uchun (ko'p loyihada pkg/ umuman kerak emas). Katta loyihada import qoidalarini linter bilan (depguard, go-arch-lint) majburlash mumkin."},{"l":"P","t":"mcq","tp":"Tooling","d":"go","id":20004,"n":"GT5","q":"`go test` keshini va parallelizmni to'g'ri boshqarish?","o":["Natijalar kirish o'zgarmasa keshlanadi (-count=1 keshni chetlab o'tadi); paketlar parallel ishlaydi (-p), paket ICHIDA faqat t.Parallel() bilan; -shuffle=on tartibga yashirin bog'liqlikni ochadi","Kesh yo'q, har safar qayta ishlaydi","Testlar har doim parallel","t.Parallel() avtomatik yoqilgan"],"a":0,"e":"Kesh faqat 'sof' testlarda ishlaydi — tashqi fayl/tarmoqqa tegsa natija noto'g'ri keshlanishi mumkin, shuning uchun integration testlarda -count=1. -race bilan birga -timeout ni oshiring (sekinlashadi). Flaky testni topish: -race -shuffle=on -count=10."},{"l":"St","t":"open","tp":"Tooling","d":"go","id":20005,"n":"GT6","q":"Jamoada Go kod sifatini qanday standartlashtirasan?","m":"1) Avtomatlashtirish: gofmt/goimports (muhokamasiz), golangci-lint konfiguratsiyasi repo'da (errcheck, govet, staticcheck, revive, bodyclose, sqlclosecheck, depguard), CI'da majburiy; pre-commit hook ixtiyoriy. 2) Til darajasidagi chegaralar: internal/, kichik interfeyslar iste'molchi tomonda, har paket bir mas'uliyat. 3) Kod review: stil emas, dizayn va xato ishlov berish; stilni linter hal qiladi. 4) Yozma kelishuvlar: xato o'rash formati, log darajalari, context uzatish qoidasi, panic taqiqi, testda testcontainers vs mock. 5) Shablon: yangi servis uchun template repo (health, metrics, tracing, graceful shutdown, migration tayyor). 6) O'lchov: CI vaqti, flaky test foizi, review kutish vaqti — qoidalar odamlarni sekinlashtirmasligi kerak. 7) Effective Go va Google Go Style Guide'ni asos qilib, farqlarni qisqa hujjatda yozish.","e":"Kalit g'oya: qoidani odam emas, vosita majburlasin. Review odamning vaqti eng qimmat joyga — domen mantig'i, chegaralar va xato stsenariylariga sarflanishi kerak.","src":"https://google.github.io/styleguide/go/"},{"l":"S","t":"mcq","tp":"Tooling","d":"go","id":30184,"n":"SN185","q":"Bog'liqlik zanjiri xavfsizligi uchun Go'da nima ishlatiladi?","o":["Faqat `go get -u`","`go.sum` (hash tekshiruvi) + `GOFLAGS=-mod=readonly`, `go mod verify`, `govulncheck` CI'da, va yangilanishlarni nazorat bilan (Dependabot/Renovate) qilish; `GOPRIVATE`/proxy bilan ichki modullar","`vendor` papkasi yetarli","Hech narsa kerak emas"],"a":1,"e":"`go.sum` modul mazmunini qotirib qo'yadi — tasodifiy o'zgarishni aniqlaydi. `govulncheck` esa faqat haqiqatda chaqirilgan zaif funksiyalarni ko'rsatadi (shovqin kam). Qo'shimcha amaliyot: minimal bog'liqlik siyosati, `replace` direktivalarini productionda qoldirmaslik, va build reproducibility uchun `-trimpath` bilan qurish."},{"l":"S","t":"mcq","tp":"Tooling","d":"go","id":30270,"n":"SN271","q":"Git'da productionga ketgan buzuq commit'ni orqaga qaytarish uchun nima ishlatiladi?","o":["`git reset --hard` va force push","`git revert <sha>` — yangi commit bilan o'zgarishni bekor qiladi, tarix saqlanadi va boshqa ishlovchilar buzilmaydi; merge commit uchun `-m 1`. `reset --hard` + force push umumiy branch'da boshqalarning ishini yo'qotadi","`git rebase -i` bilan commit'ni o'chirish","Faqat yangi fix yozish"],"a":1,"e":"Qoida: umumiy (pushed) tarixni qayta yozmaslik. `revert` audit izini saqlaydi va CI/CD orqali normal deploy bo'ladi. Nozik joy: revert qilingan o'zgarishni keyin qaytarish uchun 'revert of revert' kerak bo'ladi; migratsiya bo'lgan relizda esa kod revert'i DB sxemasi bilan mos bo'lishini alohida tekshirish shart."},{"l":"S","t":"mcq","tp":"Tooling","d":"go","id":30271,"n":"SN272","q":"Regressiya qaysi commit'da paydo bo'lganini topish uchun?","o":["Qo'lda har commit'ni tekshirish","`git bisect` — binary search bilan log2(N) qadamda topadi; `git bisect run ./test.sh` bilan avtomatlashtiriladi (test skript exit kodi bilan yaxshi/yomon aniqlanadi)","`git log --grep`","`git blame` yetarli"],"a":1,"e":"1000 commit uchun ~10 tekshiruv. `git bisect run` bilan butun jarayon avtomatik bo'ladi — shuning uchun regressiyani takrorlaydigan minimal test yozish birinchi qadam. `git blame` faqat qator kimning qo'lidan chiqqanini ko'rsatadi, xatti-harakat o'zgarishini emas."},{"l":"S","t":"mcq","tp":"Tooling","d":"go","id":30334,"n":"SN335","q":"Bog'liqlik zanjiri xavfsizligi uchun Go'da nima ishlatiladi?","o":["Faqat `go get -u`","`go.sum` (hash tekshiruvi) + `GOFLAGS=-mod=readonly`, `go mod verify`, `govulncheck` CI'da, va yangilanishlarni nazorat bilan (Dependabot/Renovate) qilish; `GOPRIVATE`/proxy bilan ichki modullar","`vendor` papkasi yetarli","Hech narsa kerak emas"],"a":1,"e":"`go.sum` modul mazmunini qotirib qo'yadi — tasodifiy o'zgarishni aniqlaydi. `govulncheck` esa faqat haqiqatda chaqirilgan zaif funksiyalarni ko'rsatadi (shovqin kam). Qo'shimcha amaliyot: minimal bog'liqlik siyosati, `replace` direktivalarini productionda qoldirmaslik, va build reproducibility uchun `-trimpath` bilan qurish."},{"l":"M","t":"mcq","tp":"Stdlib","d":"go","id":18027,"n":"GR28","q":"Katta faylni satrma-satr o'qishda nima tuzoq?","o":["bufio.Scanner default 64 KB satr limitiga ega — uzun satrda `bufio.Scanner: token too long` beradi; Buffer() bilan kattalashtirish yoki bufio.Reader.ReadString ishlatish kerak","Scanner cheksiz satrni o'qiy oladi","os.ReadFile har doim to'g'ri yechim","ioutil hali ham tavsiya etiladi"],"a":0,"e":"os.ReadFile butun faylni xotiraga yuklaydi — katta faylda OOM. Oqim bilan ishlash: bufio.Scanner (qulay, limitga e'tibor bering) yoki bufio.Reader. Scanner xatoni jimgina yutadi — loop tugagach scanner.Err() ni ALBATTA tekshiring. io/ioutil Go 1.16 dan deprecated: os.ReadFile, io.ReadAll, os.CreateTemp."},{"l":"M","t":"mcq","tp":"Stdlib","d":"go","id":18028,"n":"GR29","q":"Go'da regexp haqida nimani bilish kerak?","o":["RE2 engine: backtracking yo'q, shuning uchun ReDoS xavfsiz, lekin backreference va lookahead qo'llab-quvvatlanmaydi; Regexp'ni bir marta MustCompile qilib qayta ishlatish kerak","Go regexp PCRE bilan bir xil","Har chaqiruvda Compile qilish normal","Lookahead ishlaydi"],"a":0,"e":"RE2 chiziqli vaqt kafolati beradi — foydalanuvchi bergan pattern'ni ham nisbatan xavfsiz ishlatish mumkin (boshqa tillarda bu ReDoS). Loop ichida regexp.MustCompile — sekinlikning tez-tez uchraydigan sababi; paket darajasida var re = regexp.MustCompile(...). Oddiy holatda strings.Contains/HasPrefix regexp'dan bir necha barobar tez."},{"l":"S","t":"mcq","tp":"Stdlib","d":"go","id":18029,"n":"GR30","q":"Go 1.21+ da loglash uchun to'g'ri yondashuv?","o":["log/slog: strukturaviy, kontekst bilan (slog.InfoContext), handler almashtiriladigan (JSON prod'da, text local'da), atributlar kalit-qiymat; zap/zerolog — tezroq alternativalar, lekin standart API kutubxonalar uchun afzal","fmt.Println yetarli","Faqat zap ishlatiladi","slog faqat matn formatida ishlaydi"],"a":0,"e":"Amaliy qoidalar: trace_id/request_id ni har logga qo'shish (slog.With bilan kontekstdan olingan logger'ni uzatish), PII va sirlarni loglamaslik, xatoni bir marta (eng yuqori darajada) loglash — har qatlamda takrorlamaslik, log darajalarini ataylab tanlash (Error — kimdir harakat qilishi kerak). Kutubxona kodida global logger emas, uzatilgan logger ishlatiladi.","src":"https://pkg.go.dev/log/slog"},{"l":"M","t":"mcq","tp":"Stdlib","d":"go","id":18030,"n":"GR31","q":"`go:embed` bilan nima qilish mumkin?","o":["Statik fayllarni binary ichiga joylash: //go:embed migrations/*.sql bilan embed.FS — deploy bitta faylga aylanadi, migratsiya va shablonlar yo'qolmaydi","Runtime'da fayl yuklaydi","Faqat matn fayllar uchun","Build vaqtini oshiradi va tavsiya etilmaydi"],"a":0,"e":"Cheklovlar: faqat paket katalogidagi yoki quyisidagi fayllar (.. yo'q), nuqta bilan boshlanuvchi va _ bilan boshlanuvchi fayllar `all:` prefiksisiz tushmaydi, simlink ishlamaydi. Tipik ishlatish: migrations (golang-migrate iofs), HTML shablon, OpenAPI spetsifikatsiyasi, tzdata (`import _ \"time/tzdata\"` scratch image uchun)."},{"l":"S","t":"mcq","tp":"Stdlib","d":"go","id":18031,"n":"GR32","q":"net/http (standart) o'rniga gin/echo/fiber qachon kerak?","o":["Go 1.22 dan ServeMux metod va path parametrlarini qo'llab-quvvatlaydi — ko'p servis uchun standart kutubxona yetarli; framework validatsiya, binding, middleware ekotizimi kerak bo'lganda tanlanadi (fiber net/http'ga mos emas — bu alohida qaror)","Framework har doim kerak","Standart kutubxonada routing umuman yo'q","Gin — standart kutubxonaning bir qismi"],"a":0,"e":"Go 1.22 ServeMux: mux.HandleFunc(\"GET /items/{id}\", h) va r.PathValue(\"id\"). Framework tanlashda mezon: net/http interfeyslariga (http.Handler, http.HandlerFunc) mosligi — middleware va testlarni qayta ishlatish imkonini beradi. fiber fasthttp ustida qurilgan, http.Handler ekotizimidan ajralib qoladi.","src":"https://go.dev/blog/routing-enhancements"},{"l":"S","t":"mcq","tp":"Stdlib","d":"go","id":18032,"n":"GR33","q":"ORM (GORM) va pgx/sqlc o'rtasida qanday tanlaysiz?","o":["GORM — tez start, lekin generatsiya qilinayotgan SQL yashirin (N+1, kutilmagan JOIN); pgx + sqlc — SQL aniq va kompilyatsiya vaqtida tipli; og'ir o'qish yuklari va murakkab query'lar uchun ikkinchisi afzal","ORM har doim yomon","database/sql pgx'dan tez","sqlc runtime'da reflection ishlatadi"],"a":0,"e":"pgx — Postgres uchun native drayver (binary protokol, COPY, LISTEN/NOTIFY, pgtype); database/sql orqali ham ishlaydi, lekin native rejimda tezroq. sqlc SQL fayldan tipli Go kodi generatsiya qiladi — reflection yo'q. Amaliy gibrid: oddiy CRUD uchun ORM yoki sqlc, og'ir hisobotlar uchun qo'lda yozilgan SQL. Qaysi biri bo'lmasin: EXPLAIN bilan tekshirish va query loglarini kuzatish majburiy."},{"l":"S","t":"code","tp":"Stdlib","d":"go","id":20006,"n":"GT7","q":"Bu middleware'da nima yetishmayapti?","c":"func Auth(next http.Handler) http.Handler {\n    return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n        u, err := verify(r.Header.Get(\"Authorization\"))\n        if err != nil { http.Error(w, \"unauthorized\", 401) }\n        next.ServeHTTP(w, r)\n    })\n}","o":["Xatodan keyin `return` yo'q — 401 yozilgandan keyin ham handler ishlaydi; foydalanuvchini kontekstga qo'yish (r = r.WithContext(...)) ham yetishmayapti","Xato yo'q","http.Error o'rniga panic kerak","Middleware imzosi noto'g'ri"],"a":0,"e":"http.Error javobni yozadi, lekin oqimni to'xtatmaydi — bu jimgina auth chetlab o'tishga olib keladi (haqiqiy xavfsizlik bug'i). To'g'ri: http.Error(...); return. Foydalanuvchini uzatish: ctx := context.WithValue(r.Context(), ctxKeyUser{}, u); next.ServeHTTP(w, r.WithContext(ctx)) — kalit sifatida unexported struct tipi ishlatiladi."},{"l":"S","t":"mcq","tp":"Stdlib","d":"go","id":20007,"n":"GT8","q":"JSON dekodlashda foydalanuvchi kirishini qanday himoyalaysiz?","o":["http.MaxBytesReader bilan hajmni cheklash, json.Decoder + DisallowUnknownFields, dekodlashdan keyin validatsiya; katta ro'yxatlar uchun stream bilan o'qish","json.Unmarshal(io.ReadAll(...)) yetarli","Faqat Content-Type tekshirish","Hajm cheklovini nginx hal qiladi"],"a":0,"e":"io.ReadAll cheklovsiz — bitta so'rov bilan xotirani to'ldirish mumkin (DoS). MaxBytesReader limitdan oshsa 'http: request body too large' beradi va ulanishni to'g'ri yopadi. DisallowUnknownFields client xatolarini erta ko'rsatadi, lekin API evolyutsiyasini qattiqlashtiradi — ommaviy API'da ehtiyot bo'ling. Dekodlashdan keyin ham biznes validatsiya shart (tip to'g'ri bo'lishi qiymat to'g'ri degani emas)."},{"l":"S","t":"mcq","tp":"Stdlib","d":"go","id":20008,"n":"GT9","q":"`context.WithValue` ni qanday ishlatish to'g'ri?","o":["Faqat so'rov doirasidagi metadata (trace ID, foydalanuvchi, lokal) uchun; kalit — unexported tip, funksiya argumentlarini almashtirish uchun emas","Har qanday bog'liqlikni uzatish uchun (DB, logger)","String kalit bilan","Konfiguratsiya uzatish uchun"],"a":0,"e":"String kalit — boshqa paket bilan to'qnashuv xavfi; shuning uchun `type ctxKey struct{}` yoki unexported tip. Context'da majburiy bog'liqlik uzatish — yashirin API: kompilyator tekshirmaydi, testda topilmaydi. DB, logger, konfiguratsiya — konstruktor orqali. Context birinchi argument bo'ladi va struct maydonida saqlanmaydi."},{"l":"S","t":"mcq","tp":"Stdlib","d":"go","id":20009,"n":"GT10","q":"Graceful shutdown'ning to'liq ketma-ketligi?","o":["SIGTERM'ni ushlash; readiness'ni false qilib LB'dan chiqishni kutish; srv.Shutdown(ctx) bilan yangi ulanishni to'xtatib, faollarini tugatish; worker va consumer'larni ctx orqali to'xtatish; DB pool va broker ulanishini yopish; timeout bilan cheklash","Darhol os.Exit(0)","Faqat srv.Close()","Kubernetes o'zi hal qiladi"],"a":0,"e":"Tartib muhim: readiness'ni oldin o'chirish (yoki preStop hook bilan bir necha soniya kutish) — aks holda LB hali trafik yuborayotgan paytda server yopiladi va 502 chiqadi. Shutdown hijacked va WebSocket ulanishlarini kutmaydi — ularni o'zingiz yopasiz. terminationGracePeriodSeconds shutdown timeout'idan katta bo'lsin."},{"l":"S","t":"mcq","tp":"Stdlib","d":"go","id":20010,"n":"GT11","q":"Fayl yuklash (upload) endpoint'ida stdlib bilan nimaga e'tibor berasiz?","o":["r.ParseMultipartForm xotirada limit qoldirib qolganini diskka yozadi — MaxBytesReader bilan umumiy hajmni cheklash, fayl turini mazmun bo'yicha (http.DetectContentType) tekshirish, nomni sanitizatsiya qilish va vaqtinchalik fayllarni tozalash","Content-Type header'iga ishonish yetarli","Fayl nomini foydalanuvchidan olib to'g'ridan-to'g'ri saqlash","Hajmni cheklash shart emas"],"a":0,"e":"Xavflar: DoS (katta fayl, zip bomb), path traversal (`../`), saqlangan XSS (HTML/SVG'ni o'sha domendan berish), executable yuklash. Amaliyot: alohida domen/bucket'dan berish, Content-Disposition: attachment va X-Content-Type-Options: nosniff, tasodifiy nom (foydalanuvchi nomini faqat metadata sifatida saqlash), antivirus/skan navbati. Katta fayllar uchun S3 presigned URL bilan to'g'ridan-to'g'ri yuklash — servis trafikdan chetda qoladi."},{"l":"P","t":"mcq","tp":"Stdlib","d":"go","id":20011,"n":"GT12","q":"Uzoq davom etadigan HTTP so'rovda client uzilib ketganini qanday bilasiz?","o":["r.Context() bekor qilinadi — uni DB query va tashqi chaqiruvlarga uzatsangiz, ish darhol to'xtaydi va resurs bo'shaydi","Buni bilish mumkin emas","Faqat TCP darajasida","Timeout tugashini kutish kerak"],"a":0,"e":"net/http ulanish yopilganda so'rov kontekstini bekor qiladi. Shuning uchun har og'ir operatsiya ctx qabul qilishi shart: db.QueryContext, http.NewRequestWithContext, redis kontekstli API. Ogohlantirish: yozuv operatsiyasini ctx bekor bo'lganda yarim yo'lda tashlab yuborish ma'lumot nomuvofiqligiga olib kelishi mumkin — kritik yozuvni context.WithoutCancel (Go 1.21) yoki outbox bilan oxirigacha yetkazish kerak."},{"l":"St","t":"open","tp":"Stdlib","d":"go","id":20012,"n":"GT13","q":"Yangi Go servisini noldan boshlayapsan. Birinchi kunda nimalar bo'lishi kerak?","m":"Minimal 'production-ready' skelet: (1) konfiguratsiya — muhit o'zgaruvchilari, ishga tushishda validatsiya, sirlar secret manager'dan; (2) strukturaviy log (slog) + trace_id; (3) /healthz (liveness, bog'liqliksiz) va /readyz (bog'liqliklar bilan); (4) metrikalar (RED: rate, errors, duration) va OpenTelemetry tracing; (5) graceful shutdown va barcha timeout'lar (server Read/Write/Idle, client Timeout, DB pool); (6) migratsiyalar (go:embed + golang-migrate) va ularni deploy'ning alohida qadami sifatida; (7) xato ishlov berish kelishuvi (sentinel + %w, HTTP mapping bir joyda); (8) testlar: domain uchun tez unit, adapter uchun testcontainers; (9) Dockerfile multi-stage + distroless, CI (fmt, vet, lint, test -race, govulncheck); (10) qatlamlar: cmd/, internal/<context>/{domain,app,adapters}.","e":"Bu ro'yxat 'keyin qo'shamiz' deyilganda deyarli hech qachon qo'shilmaydigan narsalar to'plami. Incident paytida eng ko'p kerak bo'ladigan uchtasi: trace_id bilan log, RED metrikalari va timeout'lar."},{"l":"S","t":"mcq","tp":"Stdlib","d":"go","id":30182,"n":"SN183","q":"`http.Server` productionda qanday sozlanadi?","o":["Default sozlamalar yetarli","`ReadHeaderTimeout`, `ReadTimeout`, `WriteTimeout`, `IdleTimeout` va `MaxHeaderBytes` aniq qo'yiladi (Slowloris va osilib qolgan ulanishlarga qarshi), `Handler`ga panic recovery va request ID middleware, `Shutdown` bilan graceful to'xtash","Faqat `ReadTimeout`","Faqat `Handler`"],"a":1,"e":"`http.Server{}` default timeout'lari yo'q: sekin client ulanishni cheksiz ushlab turadi va FD tugaydi. `ReadHeaderTimeout` eng muhimi (header o'qishni cheklaydi). Body hajmini `http.MaxBytesReader` bilan cheklash ham kerak — aks holda katta payload xotirani yeydi."},{"l":"S","t":"mcq","tp":"Stdlib","d":"go","id":30183,"n":"SN184","q":"`encoding/json` bilan katta javobni o'qishda qaysi yondashuv samarali?","o":["Har doim `io.ReadAll` + `Unmarshal`","Oqim bilan: `json.NewDecoder(r).Decode(&v)` — butun javobni xotiraga yig'maydi; juda katta massivda `Decoder.Token()` bilan element-element o'qish, va `MaxBytesReader` bilan hajm cheklovi","`Unmarshal` har doim tezroq","`json.RawMessage` ishlatmaslik"],"a":1,"e":"`ReadAll` + `Unmarshal` ikki nusxa (bayt + struct) va katta payloadda OOM xavfi. Decoder oqimda ishlaydi. Nozik nuqta: Decoder bir necha JSON qiymatini ketma-ket o'qiy oladi (NDJSON uchun qulay), lekin bitta obyekt kutilganda ortiqcha ma'lumotni tekshirish kerak. Eng tez variant kerak bo'lsa kod generatsiyasi (easyjson) yoki `jsoniter` o'lchanadi."},{"l":"S","t":"mcq","tp":"Stdlib","d":"go","id":30332,"n":"SN333","q":"`http.Server` productionda qanday sozlanadi?","o":["Default sozlamalar yetarli","`ReadHeaderTimeout`, `ReadTimeout`, `WriteTimeout`, `IdleTimeout` va `MaxHeaderBytes` aniq qo'yiladi (Slowloris va osilib qolgan ulanishlarga qarshi), `Handler`ga panic recovery va request ID middleware, `Shutdown` bilan graceful to'xtash","Faqat `ReadTimeout`","Faqat `Handler`"],"a":1,"e":"`http.Server{}` default timeout'lari yo'q: sekin client ulanishni cheksiz ushlab turadi va FD tugaydi. `ReadHeaderTimeout` eng muhimi (header o'qishni cheklaydi). Body hajmini `http.MaxBytesReader` bilan cheklash ham kerak — aks holda katta payload xotirani yeydi."},{"l":"S","t":"mcq","tp":"Stdlib","d":"go","id":30333,"n":"SN334","q":"`encoding/json` bilan katta javobni o'qishda qaysi yondashuv samarali?","o":["Har doim `io.ReadAll` + `Unmarshal`","Oqim bilan: `json.NewDecoder(r).Decode(&v)` — butun javobni xotiraga yig'maydi; juda katta massivda `Decoder.Token()` bilan element-element o'qish, va `MaxBytesReader` bilan hajm cheklovi","`Unmarshal` har doim tezroq","`json.RawMessage` ishlatmaslik"],"a":1,"e":"`ReadAll` + `Unmarshal` ikki nusxa (bayt + struct) va katta payloadda OOM xavfi. Decoder oqimda ishlaydi. Nozik nuqta: Decoder bir necha JSON qiymatini ketma-ket o'qiy oladi (NDJSON uchun qulay), lekin bitta obyekt kutilganda ortiqcha ma'lumotni tekshirish kerak. Eng tez variant kerak bo'lsa kod generatsiyasi (easyjson) yoki `jsoniter` o'lchanadi."},{"l":"S","t":"mcq","tp":"Stdlib","d":"go","id":30418,"n":"SN419","q":"`database/sql`da `Rows`ni yopmaslik nimaga olib keladi?","o":["Hech narsa, GC tozalaydi","Ulanish poolga qaytmaydi — pool tugaydi va barcha query'lar `WaitDuration`da osilib qoladi; shuningdek DB tomonida kursor/portal ochiq qoladi. `defer rows.Close()` va `rows.Err()` tekshiruvi majburiy","Faqat sekinlashadi","Xotira oshadi faqat"],"a":1,"e":"Nozik detal: `rows.Next()` oxirigacha o'qilsa `Rows` avtomatik yopiladi, lekin o'rtada `break` qilinsa — yo'q. Yana: `rows.Err()` tekshirilmasa iteratsiya o'rtasidagi tarmoq xatosi jim yo'qoladi va natija 'to'liq' deb qabul qilinadi. `QueryRow`da esa `Scan` xatosini tekshirish shart (`sql.ErrNoRows`)."},{"l":"S","t":"mcq","tp":"Memory","d":"go","id":3013,"n":"G14","q":"Katta slice'dan kichik bo'lak olib saqlansa (<code>small := big[:10]</code>) nima bo'ladi?","o":["Faqat 10 element memory'da qoladi","Butun asosiy massiv memory'da qoladi — slice header unga ishora qiladi, GC tozalay olmaydi; nusxa olish kerak: slices.Clone(big[:10]) yoki copy","GC avtomatik qisqartiradi","panic bo'ladi"],"a":1,"e":"Xuddi shunday: katta stringdan kichik substring (Go'da string bo'lagi ham asosiy baytlarga ishora qiladi). Fayl o'qib bir necha bayt saqlab qolish — 'memory sizishi' ko'rinishidagi klassik holat. Yechim — aniq nusxa olish."},{"l":"S","t":"mcq","tp":"Memory","d":"go","id":3015,"n":"G16","q":"Escape analysis nima qiladi?","o":["Kompilyatsiya xatolarini topadi","Kompilyator qiymat funksiyadan tashqariga 'qochadimi' (pointer qaytariladimi, interfeysga solinadimi, goroutine ushlaydimi) degan savolni hal qiladi: qochmasa — stack (arzon), qochsa — heap (GC yuki)","Memory'ni shifrlaydi","Goroutine'larni rejalashtiradi"],"a":1,"e":"Ko'rish: go build -gcflags='-m'. Amaliy natija: kichik struct'ni pointer bilan qaytarish har doim ham tez emas — heap allokatsiyasi va GC yuki qo'shiladi. Optimallashtirishdan oldin o'lchang: go test -bench -benchmem, keyin pprof. 'Aytganicha emas, o'lchanganicha' — Go'da muhim tamoyil."},{"l":"St","t":"mcq","tp":"Performance","d":"go","id":3017,"n":"G18","q":"Konteynerda (Kubernetes, CPU limit 1) Go ilovasi kutilganidan sekin va throttle bo'lyapti. Ehtimoliy sabab?","o":["Go konteynerda ishlamaydi","GOMAXPROCS host'dagi yadro soniga (masalan 64) qarab o'rnatiladi, cgroup CPU limitiga emas — ortiqcha parallellik context switch va CFS throttlingga olib keladi. Yechim: GOMAXPROCS ni limitga moslash (uber-go/automaxprocs yoki aniq qiymat)","GC ni o'chirish kerak","Konteynerga ko'proq memory berish kerak"],"a":1,"e":"Go 1.25 dan runtime cgroup CPU limitini hisobga oladigan bo'ldi, lekin eski versiyalarda automaxprocs standart yechim. Memory tomonida o'xshash muammo: GOMEMLIMIT (Go 1.19+) qo'yilmasa, GC konteyner limitini bilmay OOMKill'ga olib kelishi mumkin.","src":"https://github.com/uber-go/automaxprocs"},{"l":"M","t":"mcq","tp":"Testing","d":"go","id":3018,"n":"G19","q":"Go'da poyga holatlarini (race condition) qanday topasiz?","o":["Ko'z bilan kod o'qib","go test -race (yoki go run -race) — race detector ishlash vaqtida bir vaqtda sinxronizatsiyasiz kirishni aniqlaydi; CI'da doimiy ishlatish kerak","go vet bilan","Faqat production'da ko'rinadi"],"a":1,"e":"Race detector faqat haqiqatan bajarilgan kod yo'llarini ko'radi — shuning uchun parallel testlar va realga yaqin stsenariylar muhim. Narxi: ~2–10x sekin, ko'proq memory — shuning uchun prod'da emas, CI va yuk testlarida. Topilgan har race — real bug, 'kamdan-kam bo'ladi' degan bahona yo'q.","src":"https://go.dev/doc/articles/race_detector"},{"l":"S","t":"mcq","tp":"Performance","d":"go","id":13012,"n":"K13","q":"Go scheduler (GMP modeli) qanday ishlaydi?","o":["Har goroutine'ga bitta OS thread","G (goroutine) — bajarilish birligi, M (machine) — OS thread, P (processor) — bajarilish konteksti va lokal navbat; P soni GOMAXPROCS ga teng. Goroutine bloklansa M almashtiriladi, bo'sh P boshqa P navbatidan ish 'o'g'irlaydi' (work stealing)","Goroutine'lar navbat bilan bitta yadroda ishlaydi","Scheduler faqat kompilyatsiyada ishlaydi"],"a":1,"e":"Amaliy natijalar: bloklovchi syscall (fayl, cgo) M ni band qiladi va runtime yangi M yaratadi; tarmoq I/O esa netpoller orqali bloklamaydi. Go 1.14 dan preemption bor — cheksiz sikl endi boshqa goroutine'larni ochlikka qo'ymaydi. Konteynerda GOMAXPROCS ni CPU limitiga moslash muhim."},{"l":"S","t":"mcq","tp":"Memory","d":"go","id":13013,"n":"K14","q":"Go GC haqida qaysi to'g'ri?","o":["Reference counting ishlatadi","Concurrent, uch rangli (tri-color) mark & sweep: ilova bilan parallel ishlaydi, pauzalar odatda submillisekund; write barrier yordamida aniqlik saqlanadi. Tezligi GOGC (va Go 1.19+ GOMEMLIMIT) bilan boshqariladi","Ilova to'liq to'xtaydi (stop-the-world butun sikl davomida)","Xotirani siqadi (compaction)"],"a":1,"e":"Go GC compaction qilmaydi va generational emas — shuning uchun asosiy optimizatsiya yo'li allokatsiya tezligini kamaytirish: buferlarni qayta ishlatish (sync.Pool), pointer kam bo'lgan strukturalar, slice'ni oldindan make bilan sig'im berib yaratish. GOGC=100 default: heap ikki barobar o'sganda yig'ishtiradi.","src":"https://tip.golang.org/doc/gc-guide"},{"l":"S","t":"mcq","tp":"Memory","d":"go","id":13019,"n":"K20","q":"Go'da string haqida qaysi to'g'ri?","o":["String o'zgartirilishi mumkin","String o'zgarmas (immutable) — bayt ko'rinishi va uzunlikdan iborat; []byte(s) va string(b) konvertatsiyasi odatda NUSXA oladi (allokatsiya). Ko'p qo'shish (s += x) siklda qimmat — strings.Builder ishlatiladi","String har doim nusxasiz konvertatsiya qilinadi","String UTF-32 da saqlanadi"],"a":1,"e":"Kompilyator ba'zi holatlarda nusxani optimallashtiradi (masalan map[string(b)] qidiruvi), lekin bunga tayanmang. Substring esa nusxa olmaydi — asosiy baytlarni ushlab turadi, bu katta matnda xotira sizishiga olib keladi. Profil qilganda strings.Builder va oldindan Grow bilan sig'im berish sezilarli yutuq beradi."},{"l":"S","t":"code","tp":"Memory","d":"go","id":13020,"n":"K21","q":"Ikkala struct ham bir xil maydonlarga ega. Xotirada farqi bormi?","c":"type A struct { a bool; b int64; c bool }   // ?\ntype B struct { b int64; a bool; c bool }   // ?","o":["Farqi yo'q, ikkalasi 10 bayt","Bor: hizalash (alignment) tufayli A odatda 24 bayt, B esa 16 bayt — maydonlarni kattadan kichikka tartiblash padding'ni kamaytiradi","A kichikroq","Go padding qo'shmaydi"],"a":1,"e":"Tekshirish: unsafe.Sizeof(A{}) va fieldalignment linteri (go vet -vettool). Millionlab yozuv saqlanadigan strukturalarda bu sezilarli xotira tejaydi; oddiy servis kodida esa o'qilishi muhimroq — ustuvorlikni o'lchovga qarab tanlang."},{"l":"S","t":"mcq","tp":"Memory","d":"go","id":15000,"n":"GS1","q":"<code>sync.Pool</code> ni qachon ishlatish to'g'ri?","o":["Har qanday obyektni qayta ishlatish uchun, xotirani tejash maqsadida","Qisqa umrli, tez-tez yaratiladigan bir xil obyektlar uchun (masalan bufer, encoder): allokatsiya va GC bosimini kamaytiradi. Pool'dagi obyektlar GC paytida tozalanishi mumkin — kafolat yo'q, shuning uchun ulanish yoki holat saqlaydigan resurs uchun mos emas","Ulanishlar pool'i sifatida","Global kesh sifatida"],"a":1,"e":"Majburiy qoida: pool'dan olingan obyektni ishlatishdan oldin tozalash (buf.Reset()) — aks holda oldingi ma'lumot sizib chiqadi (xavfsizlik bug'i). Katta va turli o'lchamdagi buferlarni bitta pool'da saqlash xotirani ushlab qolishi mumkin. Foydani benchmark bilan isbotlang: ko'p holatda oddiy allokatsiya yetarlicha tez.","src":"https://pkg.go.dev/sync#Pool"},{"l":"S","t":"code","tp":"Performance","d":"go","id":15006,"n":"GS7","q":"Production HTTP serverida bu kodning xavfi nima?","c":"srv := &http.Server{Addr: \":8080\", Handler: mux}\nlog.Fatal(srv.ListenAndServe())","o":["Xavf yo'q","Timeout'lar qo'yilmagan: sekin yoki yomon niyatli client ulanishni cheksiz ushlab turishi mumkin (slowloris), fayl deskriptorlari va xotira tugaydi. Kamida ReadHeaderTimeout, ReadTimeout, WriteTimeout, IdleTimeout va MaxHeaderBytes qo'yiladi","Faqat TLS kerak","log.Fatal noto'g'ri"],"a":1,"e":"Go'ning default http.Server'ida timeout YO'Q — bu ataylab, lekin production uchun xavfli. Qo'shimcha: har handler'da context deadline, http.MaxBytesReader bilan body hajmini cheklash, va graceful shutdown. LB ortida bo'lsa IdleTimeout LB idle timeout'idan katta bo'lsin.","src":"https://pkg.go.dev/net/http#Server"},{"l":"S","t":"mcq","tp":"Performance","d":"go","id":15007,"n":"GS8","q":"<code>http.Client</code> bilan ishlashda senior darajadagi to'g'ri yondashuv?","o":["Har so'rovda yangi http.Client yaratish","Bitta umumiy Client (Transport bilan) — ulanishlar qayta ishlatiladi; Client.Timeout yoki so'rov context'i bilan deadline; Transport'da MaxIdleConnsPerHost va MaxConnsPerHost sozlanadi; resp.Body doim yopiladi","http.Get yetarli, sozlash shart emas","Timeout'ni cheksiz qoldirish"],"a":1,"e":"http.DefaultClient timeout'siz — osilib qolish manbai. Retry qo'shsangiz: faqat idempotent so'rovlar, exponential backoff + jitter, umumiy deadline va retry budget. Yuqori yukda MaxConnsPerHost bilan tashqi servisni bosib qo'ymaslik ham muhim."},{"l":"S","t":"mcq","tp":"Memory","d":"go","id":15008,"n":"GS9","q":"100 MB lik JSON javobni qanday qayta ishlaysiz?","o":["io.ReadAll bilan o'qib, json.Unmarshal qilish","json.Decoder bilan oqim sifatida (Decode ketma-ket, massiv elementlari uchun Token/More) — butun ma'lumot xotiraga yuklanmaydi; kirish hajmini ham cheklash kerak","Faqat ko'proq xotira berish","Base64 ga o'girish"],"a":1,"e":"ReadAll + Unmarshal ikki marta xotira oladi (xom bayt + struktura) va bitta katta so'rov pod'ni OOM qilishi mumkin. Server tomonda: http.MaxBytesReader bilan limit va 413 qaytarish. Juda katta ma'lumot uchun NDJSON (qatorma-qator) formati oqim ishlovini yanada soddalashtiradi."},{"l":"S","t":"mcq","tp":"Performance","d":"go","id":15013,"n":"GS14","q":"CPU profil muammoni ko'rsatmadi, lekin so'rovlar sekin. Qaysi vositaga murojaat qilasiz?","o":["Yana CPU profil olish","runtime/trace (go tool trace) — goroutine'lar qachon va nega kutayotganini ko'rsatadi: scheduler kechikishi, tarmoq kutishi, syscall, GC; qo'shimcha /debug/pprof/block va mutex profillari","Loglarni ko'paytirish","Xotira profili"],"a":1,"e":"Qoida: CPU profil — 'nima hisoblayapti', trace/block/mutex — 'nima kutyapti'. Sekin so'rovlarning ko'p qismi kutish (DB, lock, navbat) bo'ladi. Block va mutex profillari default o'chiq — runtime.SetBlockProfileRate va SetMutexProfileFraction bilan yoqiladi (kichik qiymat bilan).","src":"https://go.dev/blog/execution-traces-2024"},{"l":"S","t":"mcq","tp":"Performance","d":"go","id":15014,"n":"GS15","q":"Profile-guided optimization (PGO) nima beradi?","o":["Kodni avtomatik qayta yozadi","Production'dan olingan CPU profilni (default.pgo) build'ga berasiz — kompilyator issiq yo'llarni agressivroq inline qiladi va devirtualizatsiya qiladi; odatda bir necha foiz CPU yutug'i","Xotirani ikki barobar kamaytiradi","Faqat testda ishlaydi"],"a":1,"e":"Go 1.21 dan barqaror. Amaliy jarayon: prod'dan vakillik qiladigan profil yig'ish → repo'ga qo'yish → muntazam yangilab turish (eskirgan profil foyda bermaydi). Katta masshtabda bu sezilarli xarajat tejaydi, lekin avval algoritmik va I/O optimizatsiyalarini qiling.","src":"https://go.dev/doc/pgo"},{"l":"S","t":"mcq","tp":"Testing","d":"go","id":15018,"n":"GS19","q":"<code>t.Parallel()</code> bilan bog'liq eng ko'p uchraydigan xato?","o":["Parallel testlar umuman ishlatilmaydi","Umumiy holatni (global o'zgaruvchi, bitta DB sxemasi, bir xil port yoki fayl) bo'lishish — testlar bir-birini buzadi va flaky bo'ladi; har parallel test o'z izolyatsiyasiga (alohida sxema/tranzaksiya, t.TempDir, tasodifiy port) ega bo'lishi kerak","Parallel testlar sekinroq","t.Cleanup ishlamaydi"],"a":1,"e":"Qo'shimcha nozik nuqta: t.Parallel() chaqirilgan subtest ota test tanasi tugagach ishga tushadi — shuning uchun ota testdagi defer bilan tozalash erta bo'ladi; t.Cleanup ishlating. Go 1.22 dan sikl o'zgaruvchisi har iteratsiyada yangi, shuning uchun eski 'tt := tt' hiylasi endi shart emas."},{"l":"S","t":"mcq","tp":"Testing","d":"go","id":15019,"n":"GS20","q":"Katta natijalarni (JSON javob, generatsiya qilingan kod) qanday test qilasiz?","o":["Kutilgan natijani kodga yozib qo'yish","Golden file (testdata/ ichida) + -update bayrog'i bilan yangilash: farq diff sifatida ko'rinadi va katta natijalarni qo'lda yozish shart emas. Fayl repo'da versiyalanadi va o'zgarish review'da ko'rinadi","Natijani tekshirmaslik","Faqat uzunligini solishtirish"],"a":1,"e":"Ehtiyot bo'lish kerak: golden fayllarni o'ylamasdan -update bilan yangilab yuborish — bug'ni tasdiqlab qo'yish demak. Shuning uchun diff review'da diqqat bilan ko'riladi. Barqaror bo'lishi uchun natijadagi vaqt, UUID va tartibni normalizatsiya qiling."},{"l":"S","t":"mcq","tp":"Tracing","d":"go","id":15020,"n":"GS21","q":"Go servisini OpenTelemetry bilan qanday instrumentatsiya qilasiz?","o":["Har funksiyaga log qo'yish","otel SDK: HTTP/gRPC va DB uchun tayyor instrumentatsiya (otelhttp, otelgrpc, otelsql) + biznes muhim joylarda qo'lda span; context orqali trace propagatsiyasi; sampling va exporter (OTLP)","Faqat metrikalar yetarli","Tracing Go'da qo'llab-quvvatlanmaydi"],"a":1,"e":"Muhim tafsilotlar: span'larga kam kardinallikdagi atributlar (user_id — atribut sifatida ehtiyotkorlik bilan), log'ga trace_id qo'shish (slog bilan), va async ish uchun kontekstni qo'lda uzatish. Sampling: xatolar va sekin so'rovlarni doim saqlash (tail-based) — eng qimmatli signal o'sha."},{"l":"S","t":"mcq","tp":"Performance","d":"go","id":15021,"n":"GS22","q":"cgo chaqiruvi haqida qaysi to'g'ri?","o":["Oddiy funksiya chaqiruvi kabi arzon","Har cgo chaqiruvi qo'shimcha xarajatga ega (stack almashinuvi, scheduler bilan muvofiqlashtirish) va bloklovchi C kodi OS threadni band qiladi; shuningdek cross-compilation va statik build murakkablashadi","cgo Go'da mavjud emas","cgo tezroq ishlaydi"],"a":1,"e":"Amaliy maslahat: issiq siklda cgo chaqiruvini takrorlamang — ishni C tomonida batch qilib bajaring. Ko'p holatda sof Go alternativasi (masalan pure-Go drayver) afzal: CGO_ENABLED=0 bilan statik, kichik va portativ binar chiqadi (distroless/scratch image uchun ideal)."},{"l":"M","t":"code","tp":"Testing","d":"go","id":18024,"n":"GR25","q":"Table-driven test'da subtest nima beradi?","c":"for _, tc := range cases {\n    t.Run(tc.name, func(t *testing.T){\n        got := F(tc.in)\n        if got != tc.want { t.Errorf(\"F(%v) = %v, want %v\", tc.in, got, tc.want) }\n    })\n}","o":["Har case alohida nom bilan ishlaydi: yiqilganda qaysi case ekani ko'rinadi, `-run 'TestF/holat_x'` bilan bittasini ishga tushirish va t.Parallel() qo'yish mumkin","Faqat chiroyli chiqish","Testni tezlashtiradi","Subtest'lar ketma-ket ishlamaydi"],"a":0,"e":"Xabar formati muhim: got/want tartibida va kirish bilan. t.Fatalf — davom etish mantiqsiz bo'lganda (nil pointer bo'ladi), t.Errorf — qolgan tekshiruvlar foydali bo'lsa. Tozalash uchun t.Cleanup (defer'dan ko'ra ishonchliroq, subtest'lar bilan to'g'ri ishlaydi). t.Helper() yordamchi funksiyada qator raqamini to'g'ri ko'rsatadi."},{"l":"S","t":"code","tp":"Testing","d":"go","id":18025,"n":"GR26","q":"HTTP handler'ni qanday test qilasan?","c":"req := httptest.NewRequest(\"GET\", \"/users/42\", nil)\nw := httptest.NewRecorder()\nmux.ServeHTTP(w, req)\nres := w.Result()","o":["httptest.NewRecorder bilan handler'ni tarmoqsiz chaqirish; tashqi HTTP bog'liqlik uchun httptest.NewServer bilan soxta server ko'tarish","Haqiqiy portda server ishga tushirish shart","Faqat integration test bilan mumkin","net/http test'ni qo'llab-quvvatlamaydi"],"a":0,"e":"NewRequest — server tomonidagi so'rov yasaydi (RemoteAddr va Host to'ldirilgan). Router'ning o'zini (mux) chaqirish muhim — aks holda path parametrlari ishlamaydi. Tashqi API uchun httptest.NewServer(handler) real URL beradi va client konfiguratsiyasini ham test qiladi (timeout, retry). DB uchun esa testcontainers bilan haqiqiy Postgres — sqlmock SQL matnini qotirib qo'yadi."},{"l":"P","t":"mcq","tp":"Performance","d":"go","id":18026,"n":"GR27","q":"Benchmark'da eng ko'p uchraydigan xato?","o":["Natijani ishlatmaslik — kompilyator hisoblashni optimizatsiya qilib tashlaydi; paket darajasidagi o'zgaruvchiga yozish yoki Go 1.24 da `for b.Loop()` ishlatish kerak","b.N ni qo'lda o'rnatish","-benchmem qo'shish","Bir marta ishga tushirish yetarli"],"a":0,"e":"Klassik shakl: var sink T; ... sink = result. Yana: og'ir tayyorgarlikdan keyin b.ResetTimer(); har iteratsiyada allokatsiyani ko'rish uchun -benchmem; shovqinni kamaytirish uchun -count=10 va benchstat bilan statistik taqqoslash. Go 1.24 dagi `for b.Loop()` hisoblagichni ham, optimizatsiyaga qarshi himoyani ham o'zi bajaradi.","src":"https://pkg.go.dev/testing#B.Loop"},{"l":"P","t":"code","tp":"Performance","d":"go","id":19014,"n":"RT15","q":"Bu kod nega sekin va qanday tuzatiladi?","c":"var s string\nfor _, w := range words {\n    s += w + \" \"\n}","o":["Har `+=` yangi string allokatsiya qiladi (string o'zgarmas) — O(n²) nusxa; strings.Builder (Grow bilan) yoki strings.Join ishlatiladi","String o'zgaruvchan, muammo yo'q","bytes.Buffer ishlamaydi","Faqat juda uzun string'larda muammo"],"a":0,"e":"strings.Builder ichkarida []byte o'stiradi va oxirida unsafe orqali nusxasiz string qaytaradi. Kutilayotgan hajm ma'lum bo'lsa b.Grow(n) bilan qayta allokatsiyani yo'q qiling. Bilingan uzunlikdagi qo'shishlar uchun strings.Join eng sodda va tez. Xuddi shu qoida slice uchun: make([]T, 0, n) bilan cap'ni oldindan bering."},{"l":"P","t":"mcq","tp":"Performance","d":"go","id":19015,"n":"RT16","q":"`unsafe.String` / `unsafe.Slice` (Go 1.20) nimaga kerak?","o":["[]byte va string o'rtasida NUSXASIZ konvertatsiya — lekin natija asl baytlar o'zgarmasligiga bog'liq; string o'zgarmas deb qabul qilinadi, shuning uchun bufer keyin o'zgartirilsa xatti-harakat buziladi","Xavfsiz konvertatsiya, cheklovsiz ishlatiladi","GC'ni o'chiradi","Faqat testlarda ishlatiladi"],"a":0,"e":"Oddiy string(b) va []byte(s) nusxa oladi — bu xavfsiz va odatda to'g'ri tanlov. Nusxasiz variant faqat o'lchangan hot path'da (masalan parser, kalit qidirish) va bufer hayoti aniq nazorat qilinganda oqlanadi. Xatolik alomati: keyinroq 'string o'z-o'zidan o'zgardi' kabi tushunarsiz buglar."},{"l":"P","t":"mcq","tp":"Performance","d":"go","id":19016,"n":"RT17","q":"CPU profilda hech narsa ko'rinmayapti, lekin latency yuqori. Qaysi profillarni ochasan?","o":["block (channel/mutex kutishi) va mutex (contention) profillari — ular default o'chiq: runtime.SetBlockProfileRate va SetMutexProfileFraction bilan yoqiladi; hamda goroutine profili va execution trace","Faqat heap profil yetarli","CPU profilni uzunroq olish","Profil kerak emas, log yozish yetarli"],"a":0,"e":"CPU profil faqat ISHLAYOTGAN vaqtni ko'rsatadi; kutish (I/O, lock, navbat) unda yo'q. Blok profil kutish sabablarini, `go tool trace` esa vaqt o'qi bo'ylab goroutine holatlarini, GC va scheduler hodisalarini beradi — tail latency tahlili uchun eng kuchli vosita. Production'da rate'larni past qo'ying (sampling narxi bor).","src":"https://go.dev/blog/execution-traces-2024"},{"l":"P","t":"mcq","tp":"Performance","d":"go","id":19017,"n":"RT18","q":"pprof label nima beradi?","o":["pprof.Do bilan CPU profil namunalariga kontekst (endpoint, tenant, job turi) biriktiriladi — profilni shu o'lchov bo'yicha filtrlab, qaysi so'rov turi CPU yeyayotganini ko'rish mumkin","Metrikalarga teg qo'yadi","Log'ga teg qo'shadi","Trace ID generatsiya qiladi"],"a":0,"e":"Ko'p tenant yoki ko'p endpoint'li servisda oddiy profil hammasini aralashtiradi. pprof.Do(ctx, pprof.Labels(\"endpoint\", name), func(ctx){...}) bilan o'ralgan kod namunalari yorliqlanadi; label goroutine'lar bo'ylab meros bo'ladi. Eslatma: label'lar CPU va goroutine profillarida ishlaydi, heap profilida emas.","src":"https://pkg.go.dev/runtime/pprof#Do"},{"l":"P","t":"open","tp":"Performance","d":"go","id":19021,"n":"RT22","q":"Servisning allokatsiya tezligi juda yuqori. Qanday kamaytirasan?","m":"1) O'lchash: `go test -bench -benchmem` va production'dan heap profil (alloc_space — kim ko'p allokatsiya qilyapti; inuse_space — kim ushlab turibdi). 2) Eng tez-tez uchraydigan sabablar: slice/map cap oldindan berilmagan (make([]T,0,n), Grow); string konkatenatsiyasi; interface'ga boxing (fmt, log, any); har so'rovda katta bufer; json.Marshal ichida vaqtinchalik baytlar; kichik struct'ga pointer (escape). 3) Vositalar: -gcflags='-m' bilan escape sabablarini ko'rish; sync.Pool faqat o'lchangan hot path'da va Reset bilan; json uchun streaming Encoder yoki tezroq kodlovchi. 4) Sozlash: GOGC/GOMEMLIMIT — allokatsiyani kamaytirmaydi, faqat GC chastotasini o'zgartiradi. 5) Har o'zgarishdan keyin benchstat bilan taqqoslash va p99 latency'ga qarash — mikro-optimizatsiya ba'zan hech narsa bermaydi.","e":"Go'da GC narxi asosan allokatsiya TEZLIGIGA proporsional: kamroq allokatsiya — kamroq mark assist va kamroq CPU. Shuning uchun optimizatsiya tartibi: avval algoritm va I/O, keyin allokatsiya, oxirida GC sozlash."},{"l":"S","t":"mcq","tp":"Performance","d":"go","id":30176,"n":"SN177","q":"Profil olindi: `runtime.mallocgc` va GC vaqti yuqori. Birinchi qadam?","o":["`GOGC=off`","`go tool pprof -alloc_objects`/`-alloc_space` bilan eng ko'p ajratuvchi joyni topish: ko'pincha `[]byte`/string konversiyalari, slice/map oldindan hajm berilmagan (`make(..., n)`), interface boxing, va log formatlash — shuni kamaytirish GC bosimini tushiradi","Xotirani oshirish","Barcha joyda `sync.Pool`"],"a":1,"e":"Go'da GC tuning emas, allocation kamaytirish asosiy vosita. Tipik g'alabalar: `strings.Builder`, `make([]T, 0, n)`, `bytes.Buffer` qayta ishlatish, kichik struct'larni pointer emas value bilan uzatish (escape analysis), `fmt.Sprintf` o'rniga `strconv`. `GOGC` oshirish CPU'ni xotiraga almashtiradi — `GOMEMLIMIT` bilan birga qaraladi."},{"l":"S","t":"mcq","tp":"Testing","d":"go","id":30177,"n":"SN178","q":"Benchmark natijasi har ishga tushirishda 30% farq qiladi. Nima qilinadi?","o":["O'rtacha olib davom etish","Shovqinni kamaytirish: `-benchtime`/`-count` bilan bir necha o'lchov va `benchstat` orqali statistik solishtirish, CPU chastotasi/thermal va boshqa jarayonlarni nazarda tutish, `b.ReportAllocs()` va `b.ResetTimer()` to'g'ri qo'yilishi","Natijani e'tiborsiz qoldirish","`-race` bilan o'lchash"],"a":1,"e":"Bitta o'lchov hech narsa isbotlamaydi. Standart oqim: `go test -bench=X -count=10 > old.txt`, o'zgarishdan keyin `new.txt`, keyin `benchstat old.txt new.txt` — u p-value va farq foizini beradi. `-race` bilan o'lchash noto'g'ri (2-10x sekin). Kompilyator optimizatsiyasi natijani yo'q qilmasligi uchun natija global o'zgaruvchiga yoziladi."},{"l":"S","t":"mcq","tp":"Memory","d":"go","id":30178,"n":"SN179","q":"Escape analysis nima va nega muhim?","o":["GC algoritmi","Kompilyator o'zgaruvchi funksiyadan tashqariga 'qochadimi' deb aniqlaydi: qochmasa stack'da (arzon, GC'siz), qochsa heap'da ajratiladi. `go build -gcflags='-m'` bilan ko'riladi","Xotira siqish","Goroutine rejalashtirish"],"a":1,"e":"Tipik qochish sabablari: pointer qaytarish, interface'ga solish, closure'da ushlash, `fmt.Println`ga uzatish (interface{}), slice hajmi kompilyatsiya vaqtida noma'lum. Amaliy natija: kichik struct'ni value bilan uzatish ko'pincha pointer'dan tez, chunki heap ajratmasi va GC yuki bo'lmaydi."},{"l":"S","t":"mcq","tp":"Performance","d":"go","id":30326,"n":"SN327","q":"Profil olindi: `runtime.mallocgc` va GC vaqti yuqori. Birinchi qadam?","o":["`GOGC=off`","`go tool pprof -alloc_objects`/`-alloc_space` bilan eng ko'p ajratuvchi joyni topish: ko'pincha `[]byte`/string konversiyalari, slice/map oldindan hajm berilmagan (`make(..., n)`), interface boxing, va log formatlash — shuni kamaytirish GC bosimini tushiradi","Xotirani oshirish","Barcha joyda `sync.Pool`"],"a":1,"e":"Go'da GC tuning emas, allocation kamaytirish asosiy vosita. Tipik g'alabalar: `strings.Builder`, `make([]T, 0, n)`, `bytes.Buffer` qayta ishlatish, kichik struct'larni pointer emas value bilan uzatish (escape analysis), `fmt.Sprintf` o'rniga `strconv`. `GOGC` oshirish CPU'ni xotiraga almashtiradi — `GOMEMLIMIT` bilan birga qaraladi."},{"l":"S","t":"mcq","tp":"Testing","d":"go","id":30327,"n":"SN328","q":"Benchmark natijasi har ishga tushirishda 30% farq qiladi. Nima qilinadi?","o":["O'rtacha olib davom etish","Shovqinni kamaytirish: `-benchtime`/`-count` bilan bir necha o'lchov va `benchstat` orqali statistik solishtirish, CPU chastotasi/thermal va boshqa jarayonlarni nazarda tutish, `b.ReportAllocs()` va `b.ResetTimer()` to'g'ri qo'yilishi","Natijani e'tiborsiz qoldirish","`-race` bilan o'lchash"],"a":1,"e":"Bitta o'lchov hech narsa isbotlamaydi. Standart oqim: `go test -bench=X -count=10 > old.txt`, o'zgarishdan keyin `new.txt`, keyin `benchstat old.txt new.txt` — u p-value va farq foizini beradi. `-race` bilan o'lchash noto'g'ri (2-10x sekin). Kompilyator optimizatsiyasi natijani yo'q qilmasligi uchun natija global o'zgaruvchiga yoziladi."},{"l":"S","t":"mcq","tp":"Memory","d":"go","id":30328,"n":"SN329","q":"Escape analysis nima va nega muhim?","o":["GC algoritmi","Kompilyator o'zgaruvchi funksiyadan tashqariga 'qochadimi' deb aniqlaydi: qochmasa stack'da (arzon, GC'siz), qochsa heap'da ajratiladi. `go build -gcflags='-m'` bilan ko'riladi","Xotira siqish","Goroutine rejalashtirish"],"a":1,"e":"Tipik qochish sabablari: pointer qaytarish, interface'ga solish, closure'da ushlash, `fmt.Println`ga uzatish (interface{}), slice hajmi kompilyatsiya vaqtida noma'lum. Amaliy natija: kichik struct'ni value bilan uzatish ko'pincha pointer'dan tez, chunki heap ajratmasi va GC yuki bo'lmaydi."},{"l":"P","t":"mcq","tp":"Performance","d":"go","id":30409,"n":"SN410","q":"False sharing nima va Go'da qanday paydo bo'ladi?","o":["Ikki goroutine bir o'zgaruvchini o'zgartirishi","Turli yadrolardagi goroutine'lar bir xil kesh qatoriga (64 bayt) tushgan alohida o'zgaruvchilarni yozadi — kesh qatori yadrolar orasida sakraydi (cache line ping-pong) va ishlash keskin tushadi; yechim — padding yoki per-P/shardlangan hisoblagich","GC muammosi","Mutex ushlab qolish"],"a":1,"e":"Tipik misol: `counters := make([]int64, numWorkers)` va har worker o'z indeksini atomik oshiradi — massiv elementlari bitta kesh qatorida. Yechim: har elementni 64 baytga to'ldirish (`struct { v int64; _ [56]byte }`) yoki umuman mahalliy hisoblab oxirida yig'ish. Benchmark bilan o'lchanmasa bu muammo ko'rinmaydi."},{"l":"P","t":"mcq","tp":"Tracing","d":"go","id":30410,"n":"SN411","q":"`go tool trace` pprof'dan qanday farq qiladi va qachon kerak?","o":["Farqi yo'q","pprof — statistik namuna (qayerda vaqt ketyapti); trace — hodisalar vaqt chizig'i: goroutine holatlari, scheduler kechikishi, GC bosqichlari, syscall va network bloklanishlari. Latency spike'ning sababi 'kutish' bo'lsa trace kerak, CPU bo'lsa pprof","trace faqat testda","pprof ishlatilmaydi"],"a":1,"e":"Trace javob beradigan savollar: goroutine ishga tayyor bo'lgach qancha kutdi (scheduler latency), GC assist ilovadan qancha vaqt o'g'irladi, qaysi bloklanish zanjiri p99 ni ko'targan. Narxi — overhead va katta fayl, shuning uchun qisqa oyna (1-5 sekund) olinadi. Go 1.21+ da flight recorder bilan incident paytidagi oxirgi bir necha sekundni saqlash mumkin."},{"l":"S","t":"mcq","tp":"Memory","d":"go","id":30411,"n":"SN412","q":"`GOGC` va `GOMEMLIMIT` bilan ham RSS tushmayapti. Sabab?","o":["Leak bor, boshqa sabab yo'q","Go xotirani OS'ga qaytarishi kechikadi (`MADV_FREE`/`MADV_DONTNEED` xatti-harakati va `scavenger` sekin ishlaydi) — `runtime/metrics`da `HeapReleased` ko'rinadi; RSS yuqori bo'lsa ham xotira qayta ishlatilishi mumkin","GC o'chirilgan","Konteyner cheklovi"],"a":1,"e":"Ikki holatni ajratish kerak: haqiqiy leak (`HeapInuse` o'sib boradi) va OS'ga qaytarilmagan bo'sh xotira (`HeapIdle` katta, `HeapReleased` past). Linux'da `MADV_FREE` bilan sahifalar bosim bo'lmaguncha hisobda qoladi — bu normal. Konteyner limitiga yaqin bo'lsa `GOMEMLIMIT` GC'ni agressivlashtiradi va scavenger'ni ishga soladi."},{"l":"S","t":"open","tp":"Go case","d":"go","id":12000,"n":"GC1","q":"CASE: Go servisining xotirasi kun davomida asta o'sib boradi va kechga borib OOMKilled bo'ladi. Qanday tekshirasiz?","m":["Metri
