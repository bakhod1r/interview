 prefiksi (`v2:user:42`) — format o'zgarganda eski qiymatlarni bir zumda 'bekor qilish' imkonini beradi; tenant/locale kabi barcha kontekst kalitda bo'lishi (aks holda ma'lumot oqadi), va kalit kardinalligini nazorat qilish","Foydalanuvchi ID'sini qo'shmaslik","Kalitni hash qilish shart"],"a":1,"e":"Eng xavfli bug: kontekstni kalitga qo'shmaslik — bir tenant/til uchun keshlangan javob boshqasiga beriladi (ma'lumot oqishi). Versiyalash esa deploy paytida strukturasi o'zgargan qiymatlar bilan crash bo'lishini oldini oladi; alternativa — kesh qiymatida sxema versiyasini saqlab, mos kelmasa miss deb hisoblash."},{"l":"St","t":"mcq","tp":"Redis","d":"nosql","id":30226,"n":"SN227","q":"Redis'ni navbat (queue) sifatida ishlatish qachon to'g'ri, qachon yo'q?","o":["Har doim to'g'ri, Kafka keraksiz","Qisqa muddatli, yo'qotilishi mumkin bo'lgan ishlar uchun maqbul (`LPUSH`/`BRPOPLPUSH` yoki Streams consumer group bilan). Durability, uzun retention, qayta o'ynatish va ko'p consumer guruhi kerak bo'lsa — Kafka/RabbitMQ; Redis'da failover paytida ack qilinmagan ish yo'qolishi mumkin","Redis'da navbat yo'q","Faqat Streams bilan mumkin"],"a":1,"e":"Redis Streams (`XADD`/`XREADGROUP`/`XACK`) haqiqiy consumer group va pending list beradi — bu `LPUSH`/`RPOP` dan ancha ishonchli (ishlov berilayotgan xabar yo'qolmaydi). Lekin asinxron replikatsiya tufayli failover'da oxirgi yozuvlar yo'qolishi mumkin: pul yoki buyurtmaga tegishli ishni Redis navbatiga yolg'iz ishonib topshirmaslik kerak."},{"l":"S","t":"mcq","tp":"Redis","d":"nosql","id":30238,"n":"SN239","q":"RDB va AOF persistensiya farqi va productionda qaysi tanlanadi?","o":["RDB har doim yetarli","RDB — davriy snapshot (tez tiklanadi, oxirgi daqiqalar yo'qolishi mumkin); AOF — har yozuv komandasi jurnali (`appendfsync everysec` bilan ~1s yo'qotish, tiklanish sekinroq). Ko'p holatda ikkisi birga yoqiladi, muhim ma'lumotda AOF majburiy","AOF keraksiz","Faqat replika yetarli"],"a":1,"e":"`appendfsync always` durability beradi lekin throughputni keskin tushiradi; `everysec` — amaliy kelishuv. RDB `fork` qiladi, shuning uchun yozuv intensiv bo'lsa copy-on-write xotirasi oshadi (OOM xavfi). Redis 7'da multi-part AOF va RDB preamble bilan tiklanish tezlashgan. Eslatma: kesh vazifasida persistensiyani umuman o'chirish ham to'g'ri qaror."},{"l":"S","t":"mcq","tp":"Redis","d":"nosql","id":30239,"n":"SN240","q":"Redis Sentinel va Redis Cluster farqi?","o":["Bir xil narsa","Sentinel — yagona master bilan avtomatik failover (sig'im bitta node bilan cheklangan, sharding yo'q); Cluster — 16384 hash slot bo'yicha sharding + failover, lekin multi-key operatsiyalar faqat bir slot ichida (hash tag `{user:42}` kerak) va ba'zi komandalar cheklangan","Cluster failover qilmaydi","Sentinel shardlaydi"],"a":1,"e":"Tanlov: ma'lumot bitta node RAM'iga sig'sa — Sentinel (oddiyroq, tranzaksiya va Lua cheklovsiz); sig'masa yoki throughput yetmasa — Cluster. Cluster'da `MGET key1 key2` turli slotda bo'lsa xato beradi, shuning uchun kalit dizayni hash tag bilan oldindan rejalashtiriladi. Ikkisida ham replikatsiya asinxron — failover'da oxirgi yozuvlar yo'qolishi mumkin."},{"l":"S","t":"mcq","tp":"Redis","d":"nosql","id":30240,"n":"SN241","q":"Redlock (ko'p node'li Redis lock) tanqidi nimada?","o":["Juda sekin","GC pauza yoki tarmoq kechikishi bo'lsa qulf egasi TTL tugaganini bilmay yozishda davom etadi — fencing token'siz durability kafolati yo'q; kritik (pul) operatsiyalarda qulf o'rniga DB constraint yoki linearizable store (etcd/ZooKeeper) ishlatiladi","Redis'da lock qilinmaydi","Faqat Cluster'da ishlaydi"],"a":1,"e":"Martin Kleppmann tanqidining mohiyati: qulf 'mutual exclusion' uchun optimizatsiya sifatida (ishni ikki marta qilmaslik) yaxshi, lekin to'g'rilik kafolati sifatida yaroqsiz. Shuning uchun amaliy naqsh: Redis lock bilan takroriy ishni kamaytirish + DB'da unique constraint/versiya bilan yakuniy to'g'rilikni ta'minlash."},{"l":"S","t":"mcq","tp":"Redis","d":"nosql","id":30241,"n":"SN242","q":"HyperLogLog (`PFADD`/`PFCOUNT`) qachon ishlatiladi?","o":["Aniq sanoq kerak bo'lganda","Unikal elementlar sonini taxminiy (~0.81% xato) va doimiy ~12 KB xotirada hisoblashda — masalan kunlik unique visitor; `PFMERGE` bilan davrlarni birlashtirish mumkin, lekin alohida elementni tekshirib bo'lmaydi","Faqat kichik to'plamda","Set o'rniga har doim"],"a":1,"e":"Set bilan 10 mln unique IP saqlash yuzlab MB, HyperLogLog esa 12 KB. Almashinuv — aniqlik. `PFMERGE` assotsiativ va idempotent bo'lgani uchun kunlik HLL'larni haftalikka birlashtirish to'g'ri natija beradi (oddiy sanoqlarni qo'shish esa bermaydi, chunki bir xil foydalanuvchi ikki kunda bo'lishi mumkin)."},{"l":"S","t":"mcq","tp":"Redis","d":"nosql","id":30242,"n":"SN243","q":"Pipelining va Lua scripting orasidagi farq?","o":["Ikkisi bir xil","Pipelining — bir necha komandani bitta round-trip'da yuborish (latency tejaydi, atomiklik bermaydi); Lua/`MULTI` — server tomonda atomik bajarish (o'qib-qaror qilib-yozish naqshi uchun). Yuqori RPS'da ikkisi birga ishlatiladi","Lua sekinroq, ishlatilmaydi","Pipelining atomik"],"a":1,"e":"Tipik xato: `GET` qilib, ilovada tekshirib, `SET` qilish — orada boshqa client o'zgartiradi. Lua bir oqimda bajariladi (Redis single-threaded), shuning uchun atomik. Lekin Lua uzoq ishlasa butun serverni bloklaydi — skript qisqa bo'lishi va `KEYS` orqali kalitlarni e'lon qilishi kerak (Cluster'da shart)."},{"l":"S","t":"mcq","tp":"Cache","d":"nosql","id":30243,"n":"SN244","q":"Cache-aside, read-through, write-through, write-around — qisqa farqi?","o":["Faqat nom farqi","Cache-aside: ilova miss'da DB'dan o'qib keshga yozadi (eng ko'p ishlatiladi, moslashuvchan); read-through: kesh kutubxonasi o'zi yuklaydi; write-through: yozuv keshga va DB'ga birga (kesh doim yangi, yozuv sekinroq); write-around: yozuv faqat DB'ga, kesh keyin miss bilan to'ladi (kam o'qiladigan yozuvlar uchun)","Write-through ma'lumot yo'qotadi","Cache-aside atomik"],"a":1,"e":"Amaliy tanlov naqshi: ko'p o'qiladigan issiq ma'lumot — cache-aside + TTL + invalidatsiya; yozib darhol o'qiladigan ma'lumot — write-through; bir marta yozilib kam o'qiladigan ma'lumot — write-around (aks holda kesh keraksiz ma'lumot bilan to'ladi). Write-behind esa tez lekin durability'ni qurbon qiladi."},{"l":"St","t":"open","tp":"Cache","d":"nosql","id":30244,"n":"SN245","q":"Kesh hit ratio 60% ga tushdi, DB yuklamasi oshdi. Qanday tekshirasiz va tuzatasiz?","m":["O'lchash: `INFO stats` (keyspace_hits/misses), evicted_keys, expired_keys, used_memory va `maxmemory` — evict ko'p bo'lsa xotira yetmayapti, expired ko'p bo'lsa TTL juda qisqa","Kalit kardinalligini tekshirish: kalitga ortiqcha kontekst qo'shilgan bo'lsa (masalan timestamp yoki request ID) har so'rov yangi kalit yaratadi — hit bo'lmaydi","Hot/cold taqsimot: `--hotkeys` yoki sampling bilan eng ko'p so'ralgan kalitlar; Zipf taqsimotda kichik kesh ham yuqori hit beradi — agar bermasa kalit dizayni yoki TTL muammosi","Deploy bilan bog'liqlik: kesh versiya prefiksi o'zgargan (to'liq miss), yoki kod boshqa serializatsiyaga o'tib eski qiymatlarni o'qimayapti","Chora: TTL'ni uzaytirish + jitter, eviction policy `allkeys-lfu` (Zipf uchun LRU'dan yaxshi), xotirani oshirish, katta qiymatlarni siqish yoki bo'lish, stale-while-revalidate bilan DB'ni himoyalash","DB tomonini himoyalash: single-flight (bir kalit uchun bitta qayta hisoblash), negative caching, va kritik query'larga rate limit","Natijani tasdiqlash: hit ratio va DB QPS grafigi bilan, hamda p99 latency"],"e":"Intervyuda kutiladigan ketma-ketlik: metrikadan boshlash (`INFO stats`), sabab toifasini ajratish (evict/expire/kalit kardinalligi/deploy), keyin chora. LFU vs LRU tanlovini asoslash — kuchli detal."},{"l":"S","t":"mcq","tp":"Redis","d":"nosql","id":30245,"n":"SN246","q":"Redis single-threaded bo'lsa, nega bunday tez va qachon bu muammo?","o":["Ko'p oqimli, shuning uchun tez","Xotirada ishlaydi va qulf/kontekst almashinishi yo'q, I/O multiplexing (epoll) bilan yuz minglab operatsiya/sekund beradi; muammo — bitta sekin komanda (`KEYS`, katta `HGETALL`, uzun Lua) barcha clientni bloklaydi va CPU bo'yicha vertikal skale chegarasi bor","Har doim muammo","Faqat Cluster'da tez"],"a":1,"e":"Redis 6+ da I/O threads bor (tarmoq o'qish/yozish uchun), lekin komanda bajarilishi baribir bitta oqimda. Shu sabab operatsiyalar O(1) yoki O(log N) bo'lishi kerak; O(N) komandalar (`SMEMBERS`, `LRANGE 0 -1`) katta kolleksiyada latency spike beradi. CPU yetmasa — Cluster bilan shardlash yoki bir necha instansiya."},{"l":"S","t":"mcq","tp":"Redis","d":"nosql","id":30246,"n":"SN247","q":"Redis'da TTL qanday amalga oshiriladi (expiry mexanizmi)?","o":["Timer har kalit uchun","Ikki yo'l birga: lazy (kalit o'qilganda muddati tekshiriladi) va active (fon jarayoni tasodifiy namuna olib muddati o'tganlarni o'chiradi) — shuning uchun muddati o'tgan kalit birozdan keyin ham xotirada bo'lishi mumkin","Faqat restart'da","Faqat `DEL` bilan"],"a":1,"e":"Amaliy natijalar: `used_memory` muddati o'tgan kalitlarni darhol qaytarmaydi (xotira rejasida hisobga olinadi); replicada kalitlar mustaqil o'chirilmaydi — master `DEL` yuboradi (shuning uchun eski versiyalarda replicadan o'qishda stale qiymat muammosi bo'lgan); ko'p kalit bir vaqtda expire bo'lsa active cycle CPU spike beradi — TTL'ga jitter shuning uchun ham kerak."},{"l":"S","t":"mcq","tp":"Redis","d":"nosql","id":30374,"n":"SN375","q":"Redis'da eviction policy `noeviction` bo'lsa xotira tugaganda nima bo'ladi?","o":["Eng eski kalitlar o'chadi","Yozuv operatsiyalari xato qaytaradi (`OOM command not allowed`) — kesh sifatida ishlatilganda bu incident'ga olib keladi; kesh uchun `allkeys-lru`/`allkeys-lfu`, ma'lumot ombori sifatida esa `noeviction` + xotira nazorati to'g'ri","Redis qayta ishga tushadi","Diskka yoziladi"],"a":1,"e":"Qaror 'Redis nima vazifada' degan savoldan kelib chiqadi: kesh — yo'qotish mumkin, demak LRU/LFU; navbat yoki yagona holat ombori — yo'qotish mumkin emas, demak `noeviction`, `maxmemory` zapas bilan va alert. Ikkisini bir instansiyada aralashtirish klassik xato — kesh yozuvi muhim ma'lumotni evict qiladi."},{"l":"S","t":"mcq","tp":"Cache","d":"nosql","id":30375,"n":"SN376","q":"Kesh kaliti dizaynida nimalarga e'tibor beriladi?","o":["Faqat qisqa bo'lishi","Versiya/sxema prefiksi (`v2:user:42`) — format o'zgarganda eski qiymatlarni bir zumda 'bekor qilish' imkonini beradi; tenant/locale kabi barcha kontekst kalitda bo'lishi (aks holda ma'lumot oqadi), va kalit kardinalligini nazorat qilish","Foydalanuvchi ID'sini qo'shmaslik","Kalitni hash qilish shart"],"a":1,"e":"Eng xavfli bug: kontekstni kalitga qo'shmaslik — bir tenant/til uchun keshlangan javob boshqasiga beriladi (ma'lumot oqishi). Versiyalash esa deploy paytida strukturasi o'zgargan qiymatlar bilan crash bo'lishini oldini oladi; alternativa — kesh qiymatida sxema versiyasini saqlab, mos kelmasa miss deb hisoblash."},{"l":"St","t":"mcq","tp":"Redis","d":"nosql","id":30376,"n":"SN377","q":"Redis'ni navbat (queue) sifatida ishlatish qachon to'g'ri, qachon yo'q?","o":["Har doim to'g'ri, Kafka keraksiz","Qisqa muddatli, yo'qotilishi mumkin bo'lgan ishlar uchun maqbul (`LPUSH`/`BRPOPLPUSH` yoki Streams consumer group bilan). Durability, uzun retention, qayta o'ynatish va ko'p consumer guruhi kerak bo'lsa — Kafka/RabbitMQ; Redis'da failover paytida ack qilinmagan ish yo'qolishi mumkin","Redis'da navbat yo'q","Faqat Streams bilan mumkin"],"a":1,"e":"Redis Streams (`XADD`/`XREADGROUP`/`XACK`) haqiqiy consumer group va pending list beradi — bu `LPUSH`/`RPOP` dan ancha ishonchli (ishlov berilayotgan xabar yo'qolmaydi). Lekin asinxron replikatsiya tufayli failover'da oxirgi yozuvlar yo'qolishi mumkin: pul yoki buyurtmaga tegishli ishni Redis navbatiga yolg'iz ishonib topshirmaslik kerak."},{"l":"J","t":"mcq","tp":"MongoDB","d":"nosql","id":92,"n":93,"q":"MongoDB ma'lumotni qanday saqlaydi?","o":["Table va row'larda, qat'iy sxema bilan","Collection ichidagi hujjatlarda (BSON — binar JSON): sxema moslashuvchan, bitta collection'dagi hujjatlar turli maydonlarga ega bo'lishi mumkin","Faqat key-qiymat juftliklarida","Graf tugunlarida"],"a":1,"e":"'Sxema yo'q' emas — sxema ilovaga ko'chgan. Amalda sxema baribir bor, faqat uni DB tekshirmaydi; shuning uchun MongoDB'da schema validation (JSON Schema) yoqish tavsiya etiladi. Har hujjatda _id bor va unga avtomatik unique index yaratiladi."},{"l":"M","t":"mcq","tp":"MongoDB","d":"nosql","id":93,"n":94,"q":"Ma'lumotni embed qilish (ichiga joylash) yoki reference (havola) — qanday tanlanadi?","o":["Doim embed qilish kerak","Birga o'qiladigan, cheklangan hajmdagi va bola obyekt mustaqil yashamaydigan bo'lsa — embed (bitta o'qishda hammasi keladi). Ro'yxat cheksiz o'sadigan, mustaqil so'raladigan yoki ko'p joyda takrorlanadigan bo'lsa — reference","Doim reference","Farqi yo'q"],"a":1,"e":"MongoDB'da modellashtirish query shablonidan boshlanadi (normalizatsiyadan emas). Anti-pattern: cheksiz o'suvchi massiv (masalan postga barcha kommentlar) — hujjat 16MB limitiga urilади va har yangilanishda butun hujjat qayta yoziladi. Yechim: kommentlar alohida collection, postda oxirgi 5 tasi embed qilingan (gibrid).","src":"https://www.mongodb.com/docs/manual/data-modeling/"},{"l":"M","t":"mcq","tp":"MongoDB","d":"nosql","id":94,"n":95,"q":"Compound index <code>{a: 1, b: 1}</code> qaysi query'larni qo'llaydi?","o":["Faqat a va b birga ishlatilganini","Prefiks qoidasi (SQL'dagi kabi): {a}, {a,b} bo'yicha query'larni qo'llaydi; faqat {b} bo'yicha samarali emas. ESR qoidasi: Equality, Sort, Range tartibida column'larni joylash","Hamma query'ni","Faqat sort uchun ishlaydi"],"a":1,"e":"Tekshirish: explain(\"executionStats\") — totalKeysExamined va totalDocsExamined qaytarilgan hujjatlar soniga yaqin bo'lishi kerak; COLLSCAN ko'rinsa index yo'q. ESR: avval tenglik maydonlari, keyin sort maydoni, oxirida diapazon — bu Mongo hujjatidagi rasmiy tavsiya.","src":"https://www.mongodb.com/docs/manual/tutorial/equality-sort-range-guideline/"},{"l":"M","t":"mcq","tp":"MongoDB","d":"nosql","id":95,"n":96,"q":"<code>writeConcern: {w: 1}</code> va <code>{w: \"majority\"}</code> farqi?","o":["Farqi yo'q","w:1 — faqat primary tasdiqlaydi: primary yiqilsa, replikaga yetmagan yozuv yo'qolishi mumkin (rollback). w:\"majority\" — ko'pchilik a'zo yozgach tasdiq, failover'da saqlanadi (sekinroq)","w:1 ishonchliroq","majority faqat sharding bilan ishlaydi"],"a":1,"e":"To'lov va buyurtma uchun w:\"majority\" (va kerak bo'lsa journal: true). O'qish tomonida readConcern: \"majority\" — faqat ko'pchilik tasdiqlagan ma'lumotni ko'rsatadi. MongoDB 5.0 dan beri default write concern majority. Read preference secondary bo'lsa — eskirgan ma'lumot kelishi mumkin.","src":"https://www.mongodb.com/docs/manual/reference/write-concern/"},{"l":"S","t":"mcq","tp":"MongoDB","d":"nosql","id":96,"n":97,"q":"MongoDB'da transaction'lar haqida qaysi to'g'ri?","o":["Umuman yo'q","Bitta hujjatga yozish har doim atomik; ko'p hujjatli ACID transaction'lar 4.0 dan (replica set) va 4.2 dan (sharded klaster) mavjud, lekin qimmat — shuning uchun model ko'pincha 'bitta hujjat = bitta transaction chegarasi' bo'ladigan qilib quriladi","Faqat bitta collection ichida ishlaydi","Transaction tezroq ishlaydi"],"a":1,"e":"Transaction'larni doimiy ishlatish MongoDB'ning kuchli tomonini yo'qotadi. Dizayn maslahati: birga o'zgarishi kerak bo'lgan ma'lumotni bitta hujjatga joylang. Transaction kerak bo'lsa qisqa ushlang (default 60 soniya limiti bor) va TransientTransactionError uchun retry yozing."},{"l":"S","t":"mcq","tp":"MongoDB","d":"nosql","id":97,"n":98,"q":"Shard key tanlashda eng tipik xato?","o":["Juda ko'p maydon olish","Monoton o'suvchi key (ObjectId yoki timestamp) — barcha yangi yozuvlar bitta shardga tushadi (hot shard). Yechim: hashed shard key yoki yuqori kardinallikdagi tabiiy key (tenant_id, user_id) bilan kombinatsiya","Hashed key ishlatish","tenant_id ni ishlatish"],"a":1,"e":"Yaxshi shard key: yuqori kardinallik, tekis taqsimot, va ko'p query'larda mavjud (aks holda hamma shardga scatter-gather query ketadi). MongoDB 5.0+ da shard key'ni o'zgartirish (resharding) mumkin, lekin qimmat — oldindan to'g'ri tanlash arzonroq.","src":"https://www.mongodb.com/docs/manual/core/sharding-choose-a-shard-key/"},{"l":"S","t":"mcq","tp":"MongoDB","d":"nosql","id":98,"n":99,"q":"Aggregation pipeline'ni optimallashtirishning asosiy qoidasi?","o":["$lookup ni birinchi qo'yish","$match va $project ni imkon qadar boshiga qo'yish — hujjatlar soni va hajmi erta kamayadi va $match index'dan foydalana oladi; $sort katta natijada memory limitiga urilishi mumkin (allowDiskUse)","Bosqichlar tartibi ahamiyatsiz","Har doim $group bilan boshlash"],"a":1,"e":"$lookup — SQL JOIN emas: sharded muhitda va katta collectionlarda qimmat; ko'pincha ma'lumotni embed qilish yoki ilovada birlashtirish afzal. explain bilan pipeline rejasini ko'rish mumkin. Og'ir hisobotlar uchun analitik nusxa (secondary yoki data warehouse) ishlatiladi."},{"l":"M","t":"mcq","tp":"MongoDB","d":"nosql","id":99,"n":100,"q":"Replica set'da primary yiqilsa nima bo'ladi?","o":["Klaster to'xtaydi va qo'lda aralashuv kerak","A'zolar ovoz berib yangi primary saylaydi (odatda bir necha soniya); shu oraliqda yozish qabul qilinmaydi. Ko'pchilik bo'lmasa (masalan 3 tadan 2 tasi yo'qolsa) — primary saylanmaydi","Secondary avtomatik yozishni qabul qiladi","Ma'lumot butunlay yo'qoladi"],"a":1,"e":"Shuning uchun a'zolar soni toq bo'ladi (3, 5) yoki arbiter qo'shiladi (lekin arbiter ma'lumot saqlamaydi — majority write bilan birga muammo tug'dirishi mumkin, shuning uchun tavsiya etilmaydi). Client driver failover'ni o'zi kutadi — retryable writes yoqilgan bo'lsa yozuv qayta yuboriladi."},{"l":"S","t":"open","tp":"MongoDB","d":"nosql","id":100,"n":101,"q":"MongoDB'ni qachon tanlaysiz, qachon PostgreSQL (JSONB bilan)?","m":["MongoDB: hujjat tabiatli ma'lumot, tez o'zgaruvchan sxema, gorizontal sharding boshidanoq kerak, query'lar asosan bitta hujjat/agregat bo'yicha","PostgreSQL: bir nechta obyekt o'rtasida murakkab JOIN va transaction'lar, kuchli konsistentlik, ad-hoc analitik query'lar, hisobotlar","Postgres JSONB + GIN — moslashuvchan maydonlar uchun ko'p hollarda yetarli: bir tizimda ham relatsion, ham hujjat modeli","Jamoa tajribasi va operatsion narx (managed variantlar ikkalasida ham bor)","Amaliy yondashuv: default Postgres; MongoDB'ni aniq access pattern va masshtab talabi asoslaganda tanlash"],"e":"Intervyuda kuchli javob 'qaysi yaxshi' emas, 'qaysi access pattern uchun' tarzida bo'ladi. Ikkalasini ham noto'g'ri ishlatish mumkinligini aytish (Mongo'da JOIN qilishga urinish, Postgres'ni sxemasiz saqlash omboriga aylantirish) — yetuklik belgisi."},{"l":"S","t":"mcq","tp":"MongoDB","d":"nosql","id":30051,"n":"SN52","q":"MongoDB'da embed qilish va reference orasida qanday tanlanadi?","o":["Har doim embed","Kirish namunasi bo'yicha: birga o'qiladigan, cheklangan (bounded) va birga o'zgaradigan ma'lumot embed; cheksiz o'sadigan yoki mustaqil so'raladigan ma'lumot reference (16MB document limiti va yozuv konkurentligini hisobga olib)","Har doim reference","Ixtiyoriy, farqi yo'q"],"a":1,"e":"Anti-pattern: postga cheksiz kommentlarni embed qilish — document o'sib ko'chadi, 16MB'ga urinadi, bitta kommentga yozish butun documentga lock/oqim. Kompromis: eng yangi N'ni embed (extended reference), qolganini alohida kolleksiya. Modellash o'qish query'laridan boshlanadi, normal formalardan emas."},{"l":"S","t":"mcq","tp":"MongoDB","d":"nosql","id":30052,"n":"SN53","q":"Mongo'da `w:1` yozuv va primary failover bo'lganda nima yuz beradi?","o":["Ma'lumot kafolatlangan","Ack olingan yozuv replikatsiya qilinmagan bo'lsa rollback bo'lishi mumkin — durability uchun `w:\"majority\"` (va o'qishda `readConcern: majority`) kerak","Yozuv ikki marta qo'llanadi","Failover bo'lmaydi"],"a":1,"e":"`w:1` faqat primary xotirasidagi/jurnaldagi yozuvni tasdiqlaydi; yangi primary bu oplog yozuvini bilmasa, eski primary qaytganda rollback qiladi. Pul yoki buyurtmaga tegishli yozuvlarda `w:\"majority\", j:true`. Narxi — latency; shuning uchun kritik bo'lmagan telemetriya uchun `w:1` maqbul bo'lishi mumkin."},{"l":"S","t":"mcq","tp":"MongoDB","d":"nosql","id":30053,"n":"SN54","q":"Shard key tanlashda eng katta xato?","o":["Kompozit kalit olish","Monoton o'sadigan kalit (timestamp/ObjectId) — barcha yozuv oxirgi chunkga tushadi (hotspot); yoki low-cardinality kalit — jumbo chunk va cross-shard query","Hashed kalit ishlatish","Kalitni o'zgartirmaslik"],"a":1,"e":"Yaxshi shard key: yuqori cardinality, teng taqsimlanish, va eng ko'p query'lar shu kalitni o'z ichiga oladi (aks holda scatter-gather). Monoton kalitda `hashed` yoki kompozit (`tenant_id, ts`) qo'llanadi. Eslatma: shard keyni keyin o'zgartirish (resharding) qimmat operatsiya — dizaynda hal qilinadi."},{"l":"S","t":"mcq","tp":"MongoDB","d":"nosql","id":30247,"n":"SN248","q":"MongoDB'da tranzaksiyalar bor, lekin qachon ishlatmaslik kerak?","o":["Har doim ishlatish kerak","Multi-document tranzaksiya qimmat (oplog, lock, 60s default limit) — agar doimiy kerak bo'lsa, bu ko'pincha model xatosi: birga o'zgaradigan ma'lumot bitta documentda bo'lishi kerak (document darajasidagi atomiklik bepul)","Tranzaksiya yo'q","Faqat shardlangan klasterda"],"a":1,"e":"Mongo'da bitta documentga yozuv har doim atomik — shuning uchun agregat chegarasini to'g'ri tanlash tranzaksiya ehtiyojini yo'q qiladi. Tranzaksiya kerak bo'lgan haqiqiy holatlar: pul o'tkazish kabi ikki entity orasidagi invariant. Ular uchun `w:\"majority\"`, retryable write va konflikt retry mantiqi ham kerak."},{"l":"S","t":"mcq","tp":"MongoDB","d":"nosql","id":30510,"n":"SN511","q":"MongoDB'da `$lookup` (join) qachon muammo?","o":["Hech qachon","Katta kolleksiyalarda va indeks bo'lmasa juda qimmat — Mongo relyatsion join uchun optimallashtirilmagan; agar `$lookup` tez-tez kerak bo'lsa model noto'g'ri (denormalizatsiya yoki relyatsion DB kerak)","Faqat sharding'da","`$lookup` yo'q"],"a":1,"e":"Shardlangan klasterda `$lookup` cheklovlari va narxi yanada oshadi. Amaliy qoida: o'qish naqshiga qarab denormalizatsiya (kerakli maydonlarni nusxalash — 'extended reference'), nusxa ma'lumotni yangilash mantiqi bilan birga. Agar ma'lumot tabiatan relyatsion va ko'p join talab qilsa — bu Mongo tanlovining o'zi noto'g'ri degani."},{"l":"S","t":"mcq","tp":"MongoDB","d":"nosql","id":30511,"n":"SN512","q":"MongoDB'da indeks qanday tanlanadi va `ESR` qoidasi nima?","o":["Indeks avtomatik","ESR: Equality → Sort → Range — kompozit indeksda avval tenglik shartlari, keyin saralash maydoni, oxirida diapazon; shunda indeks ham filtr, ham sortni qoplaydi va `SORT` bosqichi (xotirada saralash, 32MB limiti) yo'qoladi","Faqat alifbo tartibida","Har maydonga alohida indeks"],"a":1,"e":"Tekshirish: `explain(\"executionStats\")` da `IXSCAN` bormi, `totalKeysExamined` va `nReturned` nisbati (katta farq — indeks samarasiz), va `SORT` bosqichi yo'qligi. Xotirada saralash 32MB dan oshsa query yiqiladi — bu productionda kutilmagan xato sifatida chiqadi."},{"l":"St","t":"mcq","tp":"MongoDB","d":"nosql","id":30512,"n":"SN513","q":"MongoDB change streams nima va cheklovlari?","o":["Oddiy polling","Oplog asosidagi o'zgarish oqimi (`watch`): resume token bilan uzilishdan keyin davom etish mumkin; cheklovlar — oplog oynasi (juda uzoq to'xtash resume tokenni yaroqsiz qiladi), replica set talabi, va katta hujjatlarda yuk","Faqat sharding'siz","Tranzaksiyalarni qo'llamaydi"],"a":1,"e":"Amaliy qo'llanish: kesh invalidatsiyasi, qidiruv indeksiga sinxronlash, event chiqarish (Kafka'ga ko'prik). Ishonchlilik uchun resume token doimiy saqlanadi va oplog oynasi tiklanish vaqtidan katta bo'lishi kerak — aks holda to'liq qayta sinxronlash rejasi bo'lishi shart."},{"l":"M","t":"mcq","tp":"Elasticsearch","d":"nosql","id":88,"n":89,"q":"Elasticsearch va Solr — ikkalasi ham Lucene ustida. Amalda qanday tanlanadi?","o":["Solr har doim tezroq","Ikkalasining yadro imkoniyatlari o'xshash (Lucene); tanlov ekotizim va operatsiyaga qarab: Elasticsearch — kengroq jamoa, Kibana/Beats bilan log analitikasi, bulutdagi managed variantlar; Solr — Apache ekotizimi, ZooKeeper bilan SolrCloud, mavjud tajriba bo'lsa","Solr JSON qo'llamaydi","Elasticsearch faqat loglar uchun"],"a":1,"e":"Intervyuda 'qaysi biri yaxshi' emas, 'nima uchun shu' javobi kutiladi: jamoa tajribasi, managed servis mavjudligi, litsenziya masalalari (Elastic litsenziya o'zgarishi va OpenSearch forki) va operatsion qo'llab-quvvatlash. Texnik farqlar ko'p hollarda hal qiluvchi emas."},{"l":"M","t":"mcq","tp":"Elasticsearch","d":"nosql","id":5009,"n":"V10","q":"Elasticsearch'da <code>text</code> va <code>keyword</code> tiplari farqi?","o":["Bir xil, faqat nomi boshqa","text — analiz qilinadi (tokenlarga bo'linadi, lowercase): to'liq matnli qidiruv uchun. keyword — analiz qilinmaydi, to'liq qiymat: aniq moslik, filtr, agregatsiya va saralash uchun","keyword faqat raqamlar uchun","text saralash uchun ishlatiladi"],"a":1,"e":"Tipik dizayn: bitta maydonni ikkala tipda saqlash (title va title.keyword — multi-field). Xato mapping keyin tuzatilmaydi — reindex kerak, shuning uchun index shablonini oldindan aniq yozish muhim. Agregatsiya va saralashni text maydonda qilish xato beradi (fielddata)."},{"l":"M","t":"mcq","tp":"Elasticsearch","d":"nosql","id":5010,"n":"V11","q":"Mahsulot katalogi PostgreSQL'da, qidiruv Elasticsearch'da. To'g'ri arxitektura?","o":["Ma'lumotni faqat Elasticsearch'da saqlash","PostgreSQL — source of truth; ES — hosila (derived) index: o'zgarishlar outbox/CDC (Debezium) yoki event orqali ES'ga sinxronlanadi, ES'ni istalgan paytda qayta qurish mumkin","ES'dan Postgres'ga yozish","Ikkalasiga ilovadan parallel yozish, sinxronizatsiyasiz"],"a":1,"e":"ES — qidiruv indeksi, tranzaksion DB emas (yaqin real vaqt, transaction yo'q). Ikkalasiga mustaqil yozish — dual write muammosi: biri yiqilsa ma'lumot farq qiladi. Reindex pipeline'i har doim tayyor turishi kerak: mapping o'zgarsa yoki ES buzilsa, Postgres'dan to'liq qayta qurish."},{"l":"S","t":"mcq","tp":"Elasticsearch","d":"nosql","id":5011,"n":"V12","q":"Hujjat indekslangach darhol qidiruvda topilmadi. Sabab?","o":["Xato bo'lgan","ES — near real-time: hujjat refresh (default 1s) dan keyin qidiruvda ko'rinadi. Katta bulk yuklashda refresh_interval'ni vaqtincha oshirish/o'chirish tezlikni oshiradi","Indeks buzilgan","Faqat qayta ishga tushirgandan keyin ko'rinadi"],"a":1,"e":"Kerak bo'lsa ?refresh=wait_for (query refresh'gacha kutadi) — lekin har yozishda refresh=true qilish juda qimmat. Bulk indekslash maslahatlari: bulk API, refresh_interval=-1, replica=0, tugagach qaytarish."},{"l":"S","t":"mcq","tp":"Elasticsearch","d":"nosql","id":5012,"n":"V13","q":"Chuqur pagination (<code>from=100000&size=10</code>) nega yomon va o'rniga nima ishlatiladi?","o":["Yomon emas","Har shard from+size hujjatni yig'ib koordinatorga yuboradi — memory va CPU portlaydi (default limit 10 000). O'rniga: search_after + Point In Time (PIT), yoki eksport uchun scroll/slice","size ni oshirish kerak","Faqat replica qo'shish kerak"],"a":1,"e":"Bu Postgres'dagi OFFSET muammosining aynan o'zi — yechim ham o'xshash: keyset (search_after) pagination, barqaror tartib uchun tie-breaker (_shard_doc yoki unikal id). Cheksiz scroll UI uchun search_after tabiiy mos."},{"l":"S","t":"open","tp":"Elasticsearch","d":"nosql","id":5013,"n":"V14","q":"Qidiruv natijalari sifatini qanday yaxshilaysiz?","m":["query (ball beradi, relevance) va filter (ball bermaydi, keshlanadi) kontekstini ajratish — kategoriya/narx filtrlari filterda","Analyzer sozlash: til uchun stemming, synonym, edge n-gram (autocomplete), xato yozuvga fuzziness","Maydonlarga og'irlik (title^3, description^1), BM25 parametrlari, function_score bilan biznes signali (mashhurlik, mavjudlik)","O'lchash: click-through, zero-result query'lar ro'yxati, A/B test","Sekin query'larni profil qilish (profile API), shard soni va mapping'ni qayta ko'rib chiqish"],"e":"Senior signal: relevance'ni his-tuyg'u bilan emas, o'lchov bilan sozlash va filter/query farqini bilish (cache va tezlik uchun muhim)."},{"l":"S","t":"mcq","tp":"Elasticsearch","d":"nosql","id":14017,"n":"SR18","q":"DB va qidiruv indeksi (Elasticsearch) o'rtasida ma'lumot mos kelmay qoldi. Eng ishonchli tuzilma qaysi?","o":["Ilovadan ikkalasiga parallel yozish","Bitta haqiqat manbai (DB) + outbox/CDC orqali indeksga bir tomonlama oqim; to'liq reindex skripti doim tayyor va davriy ishlatiladi; farqlarni aniqlaydigan tekshiruv (checksum/count) bilan","Har kecha ES'ni tozalab, qo'lda to'ldirish","ES'ni haqiqat manbai qilish"],"a":1,"e":"Dual write — mos kelmaslikning asosiy sababi. CDC bilan tartib va kafolat yaxshilanadi, lekin indeks sxemasi o'zgarganda reindex baribir kerak — shuning uchun u bir martalik skript emas, qo'llab-quvvatlanadigan vosita bo'lishi kerak."},{"l":"S","t":"mcq","tp":"Elasticsearch","d":"nosql","id":30054,"n":"SN55","q":"Elasticsearch'da qidiruv natijasi yozuvdan keyin darhol ko'rinmaydi. Nega?","o":["Indeks buzilgan","ES near-real-time: yozuv refresh (`refresh_interval`, default 1s) dan keyin qidirishga tushadi; `?refresh=wait_for` bilan kutish mumkin, lekin har yozuvda refresh qilish juda qimmat","Replica yo'q","Query xato"],"a":1,"e":"Yozuv avval in-memory buffer + translog'ga tushadi, refresh yangi segment yaratadi. Bulk indeksatsiya paytida `refresh_interval: -1` qilinadi va oxirida qaytariladi (tezlik bir necha barobar). `wait_for` faqat kam sonli 'read-your-write' holatlarda; aks holda app tomonda o'z keshidan ko'rsatiladi."},{"l":"S","t":"mcq","tp":"Elasticsearch","d":"nosql","id":30055,"n":"SN56","q":"`from: 10000, size: 10` pagination sekin va xato beradi. To'g'ri yechim?","o":["`size`ni oshirish","`search_after` (sort qiymati + tie-breaker) yoki PIT bilan kursor; chuqur `from` har shardda from+size natijani yig'adi — xotira va CPU portlaydi","`max_result_window`ni 1 mln qilish","Scroll'ni UI pagination uchun ishlatish"],"a":1,"e":"Deep paging koordinator nodeda 10010 × shard hujjatni saralashni talab qiladi. `search_after` holatsiz kursor beradi (foydalanuvchi pagination uchun ideal), `scroll` esa eksport uchun (snapshot ushlaydi, resursni band qiladi). UI'da ko'pincha 'keyingi sahifa' modeliga o'tish kerak."},{"l":"S","t":"mcq","tp":"Elasticsearch","d":"nosql","id":30056,"n":"SN57","q":"Mapping'da `text` va `keyword` farqi amalda nimaga ta'sir qiladi?","o":["Faqat hajmga","`text` analiz qilinadi (tokenlar, full-text match, aggregation/sort uchun yaroqsiz), `keyword` aynan saqlanadi (term query, agregatsiya, saralash) — shuning uchun ko'pincha multi-field ishlatiladi","`keyword` full-text qidiruv uchun","Farqi yo'q, ES o'zi tanlaydi"],"a":1,"e":"Klassik xato: `status` maydonini `text` qilib qo'yib, agregatsiya ishlamasligi yoki `term` query mos kelmasligi (analiz tufayli lowercase). Yechim: `\"status\": {\"type\":\"keyword\"}` yoki `text` + `.keyword` sub-field. Dinamik mapping productionda o'chiriladi (`strict`) — aks holda bitta noto'g'ri hujjat mapping'ni buzadi."},{"l":"St","t":"mcq","tp":"Elasticsearch","d":"nosql","id":30057,"n":"SN58","q":"ES klaster sekinlashdi: shardlar juda ko'p (30k). Nima muammo?","o":["Ko'p shard yaxshi, muammo emas","Har shard — alohida Lucene indeks: heap, fayl deskriptor, cluster state va query fan-out narxi. Kam sonli kattaroq shard (10-50GB) + ILM bilan rollover to'g'ri","Shard sonini yana oshirish kerak","Replicani 0 qilish yetarli"],"a":1,"e":"Har kunga alohida kichik indeks yaratish — eng ko'p uchraydigan sabab. Tavsiya: shard hajmi 10-50GB, 1GB heap'ga ~20 shard chegarasi, vaqt seriyali ma'lumot uchun ILM (rollover hajm bo'yicha, keyin shrink/forcemerge, so'ng cold/delete). Data stream'lar shu naqshni avtomatlashtiradi."},{"l":"S","t":"mcq","tp":"Elasticsearch","d":"nosql","id":30248,"n":"SN249","q":"Elasticsearch'da relevantlik (`_score`) qanday hisoblanadi va qanday boshqariladi?","o":["Tasodifiy","BM25: term chastotasi, teskari hujjat chastotasi va maydon uzunligi normalizatsiyasi; boshqarish — maydon `boost`, `function_score`/`rank_feature` (yangilik, mashhurlik), va `bool` ichida `should` bilan signal qo'shish","Faqat alifbo tartibi","Faqat yaratilgan vaqt"],"a":1,"e":"Amaliy muhandislik nuqtalari: biznes signallari (sotuv, reyting, yangilik) `rank_feature` yoki `function_score` bilan qo'shiladi; `explain: true` bilan nega shu tartib chiqqani tekshiriladi; `filter` konteksti skorga ta'sir qilmaydi va keshlanadi (shuning uchun aniq shartlar `filter`ga, matn qidiruvi `must`ga qo'yiladi)."},{"l":"St","t":"mcq","tp":"Elasticsearch","d":"nosql","id":30249,"n":"SN250","q":"PostgreSQL'dan Elasticsearch'ga ma'lumot sinxronlashning eng ishonchli yo'li?","o":["Har yozuvda ikkisiga parallel yozish","Bitta manba (PostgreSQL) + outbox/CDC orqali asinxron indeksatsiya: at-least-once, versiya (`_version`/external version) bilan eski yozuv yangisini bosib ketmasligi, va to'liq qayta indeksatsiya (reindex) skripti bo'lishi","Kunlik to'liq reindex yetarli","ES'ni asosiy baza qilish"],"a":1,"e":"Dual write ikki tizim orasida nomuvofiqlik keltiradi (biri yozildi, ikkinchisi yo'q). CDC/outbox bilan tartib va qayta o'ynatish imkoni bo'ladi. Muhim operatsion detal: mapping o'zgarganda joyida o'zgartirib bo'lmaydi — yangi indeks yaratib alias'ni atomik almashtirish (`_aliases` actions) standart naqsh."},{"l":"S","t":"mcq","tp":"Redis gotcha","d":"nosql","id":17010,"n":"E48","q":"Production Redis'da `KEYS user:*` chaqirilsa nima bo'ladi?","o":["Redis bir threadli — KEYS butun keyspace'ni skanerlaydi va shu vaqt davomida barcha komandalar bloklanadi; SCAN kursorli variantini ishlatish kerak","Tez ishlaydi, index bor","Faqat xotira sarflaydi","Avtomatik SCAN'ga aylanadi"],"a":0,"e":"KEYS O(N) va bloklovchi — millionlab kalitda sekundlab pauza, timeout to'lqini. SCAN kursor bilan porsiyalab yuradi (kafolat: skanerlash davomida mavjud bo'lgan kalit albatta qaytariladi, dublikat bo'lishi mumkin). Xuddi shunday xavfli: FLUSHALL, katta kolleksiyada SMEMBERS/HGETALL, DEL bilan katta obyektni o'chirish (UNLINK — asinxron variant)."},{"l":"P","t":"mcq","tp":"Redis gotcha","d":"nosql","id":17011,"n":"E49","q":"Redis'ni cache sifatida ishlatyapsiz. maxmemory-policy `noeviction` bo'lsa nima bo'ladi?","o":["Xotira to'lganda yozuv komandalar OOM xatosi bilan rad etiladi — cache o'rniga uzilish; cache uchun allkeys-lru yoki allkeys-lfu kerak","Eng eski kalitlar o'chadi","Redis avtomatik disk'ga yozadi","Hech narsa o'zgarmaydi"],"a":0,"e":"noeviction — default va durable store uchun to'g'ri; cache uchun xato. volatile-* siyosatlari faqat TTL qo'yilgan kalitlarni o'chiradi — TTL'siz kalitlar to'plansa baribir OOM bo'ladi. Amaliyot: cache instansiyasi va durable (queue, session) instansiyasini ajratish, chunki bitta siyosat ikkalasiga to'g'ri kelmaydi."},{"l":"P","t":"mcq","tp":"Redis gotcha","d":"nosql","id":17012,"n":"E50","q":"Cache-aside'da eng keng tarqalgan mos kelmaslik (inconsistency) manbai?","o":["Yozuvdan keyin cache'ni yangilash (write) o'rniga o'chirish (invalidate) kerak; parallel o'qish-yozishda eski qiymat cache'ga qaytib yozilib qolishi mumkin","TTL juda qisqa","Redis sekin","JSON serializatsiya"],"a":0,"e":"Klassik race: A o'qiydi (miss, DB'dan eski qiymat oladi), B yozadi va cache'ni o'chiradi, keyin A eski qiymatni cache'ga yozadi — eskilik TTL tugaguncha qoladi. Yumshatish: yozuvda invalidate + qisqa TTL; muhim joyda 'delete after commit' va ikkinchi kechiktirilgan delete (delayed double delete); yoki versiyalangan kalit (kalitga entity versiyasini qo'shish) bilan eski yozuv umuman ustidan yozmaydi."},{"l":"M","t":"mcq","tp":"Redis gotcha","d":"nosql","id":17013,"n":"E51","q":"`INCR` bilan rate limiter yozdingiz. Qaysi bug tipik?","o":["INCR va EXPIRE alohida yuborilsa, EXPIRE'gacha crash bo'lsa kalit abadiy qoladi va foydalanuvchi butunlay bloklanadi; ikkalasini Lua script yoki SET NX EX bilan atomik qilish kerak","INCR atomik emas","Redis'da counter ishlamaydi","EXPIRE kerak emas"],"a":0,"e":"Yana bir kamchilik: fixed window counter chegarada ikki barobar trafikka ruxsat beradi (oynaning oxiri va boshi). Aniqroq: sliding window log (ZSET, xotira qimmat) yoki sliding window counter, yoki token bucket (Lua script bilan atomik). Redis 7 da funksiyalar (FUNCTION) skriptlarni saqlashning zamonaviy yo'li."},{"l":"S","t":"mcq","tp":"Redis gotcha","d":"nosql","id":30100,"n":"SN101","q":"`SETEX lock ...` bilan qo'lda distributed lock yozildi. Qaysi xato eng xavfli?","o":["TTL juda uzun","Qulfni boshqa egasi o'chirib yuborishi: `DEL` qilishdan oldin qiymat (unique token) tekshirilmaydi — TTL tugagach ish davom etayotgan bo'lsa, boshqa jarayon qulfni oladi va birinchi jarayon uni o'chiradi","Redis sekin","Kalit nomi uzun"],"a":1,"e":"To'g'ri naqsh: `SET key <random-token> NX PX <ttl>`, bo'shatish Lua skript bilan atomik (`if redis.call('get',KEYS[1])==ARGV[1] then del end`). Yana ikki nuqta: TTL ishdan uzun bo'lishi yoki fencing token bilan himoya (qulf tugaganidan keyingi yozuvni rad etish), va Redis failover'da qulf kafolatlanmasligi — pul operatsiyasida qulfga emas, DB constraint'ga tayaniladi."},{"l":"S","t":"mcq","tp":"Redis gotcha","d":"nosql","id":30101,"n":"SN102","q":"Kesh uchun `KEYS user:*` ishlatilgan. Nima bo'ladi?","o":["Hech narsa, tez ishlaydi","Redis bitta oqimli — `KEYS` butun keyspace'ni skanerlaydi va butun serverni bloklaydi; `SCAN` (kursor) yoki to'g'ri ma'lumot strukturasi (set/hash bilan indeks) ishlatiladi","Faqat ozgina sekinlashadi","Replica'da muammo yo'q"],"a":1,"e":"Millionlab kalitda `KEYS` yuzlab millisekund-sekundlarga barcha mijozni to'xtatadi — latency spike va timeout to'lqini. Xuddi shu xavf: katta `HGETALL`, `SMEMBERS`, `DEL` bitta katta kalitga (`UNLINK` afzal), va `FLUSHALL`. Monitoringda `slowlog` va `latency doctor` shu holatni ko'rsatadi."},{"l":"St","t":"mcq","tp":"Redis gotcha","d":"nosql","id":30102,"n":"SN103","q":"Kesh TTL bir vaqtda tugab, DB yiqildi. Bu qanday nomlanadi va nima qilinadi?","o":["Cache penetration — validatsiya qo'shiladi","Cache stampede/avalanche: TTL'ga jitter, single-flight (bir kalit uchun bitta yangilash, qolganlar kutadi), eski qiymatni `stale-while-revalidate` bilan berish, va kritik kalitlarni oldindan warm qilish","Faqat kesh hajmini oshirish","Redis'ni o'chirish"],"a":1,"e":"Uch alohida naqsh farqlanadi: stampede (bir kalit muddati tugab, minglab parallel qayta hisoblash), avalanche (ko'p kalit bir vaqtda), penetration (mavjud bo'lmagan kalitga so'rovlar — negative caching yoki bloom filter). Go'da single-flight uchun `golang.org/x/sync/singleflight`."},{"l":"S","t":"mcq","tp":"Redis gotcha","d":"nosql","id":30492,"n":"SN493","q":"Redis'da `INCR` bilan rate limit yozildi, lekin limit ba'zan oshib ketadi. Nega?","o":["Redis atomik emas","`INCR` atomik, lekin `INCR` + `EXPIRE` ikki komanda — birinchi bajarilib ikkinchisi yiqilsa kalit muddatsiz qoladi yoki har so'rovda TTL yangilanib oyna cho'ziladi; Lua skript yoki `SET key 0 EX n NX` + `INCR` naqshi bilan atomik qilinadi","TTL ishlamaydi","Faqat Cluster'da"],"a":1,"e":"Ikkinchi sabab — fixed window chegarasi: oyna chetida ketma-ket ikki oynada limitgacha so'rov o'tib, amalda 2x burst bo'ladi. Aniqroq variant: sliding window interpolatsiyasi yoki token bucket, ikkalasi ham bitta Lua skriptda atomik bajariladi."},{"l":"St","t":"mcq","tp":"Redis gotcha","d":"nosql","id":30493,"n":"SN494","q":"Redis kesh 'thundering herd'dan himoyalandi, lekin deploy'dan keyin DB baribir yiqildi. Ehtimolli sabab?","o":["Kesh ishlamadi","Sovuq kesh: yangi instansiyalar (yoki kesh versiya prefiksi o'zgargani uchun) hammasi bir vaqtda miss bo'ladi — single-flight bir kalit uchun ishlaydi, lekin million turli kalit bir vaqtda kelsa DB baribir to'yinadi. Chora: bosqichli rollout, kesh warm-up, va DB'ga kiruvchi konkurentlikni cheklash (bulkhead)","Redis o'chib qolgan","TTL uzun"],"a":1,"e":"Shu sabab kesh versiyasini o'zgartirish (`v2:`) — bu deploy emas, incident xavfi bo'lgan operatsiya: bosqichma-bosqich (dual-read: yangi kalit yo'q bo'lsa eskisidan o'qish) qilinadi. DB tomonida esa konkurentlik limiti oxirgi himoya bo'lib qoladi."},{"l":"M","t":"mcq","tp":"Kafka","d":"msg","id":5000,"n":"V1","q":"Kafka'da xabarlar tartibi qay level'da kafolatlanadi?","o":["Butun topic bo'yicha global tartib","Faqat bitta partition ichida tartib kafolatlanadi; bir xil key'li xabarlar bir partitionga tushgani uchun key bo'yicha tartib saqlanadi","Hech qanday tartib yo'q","Consumer group bo'yicha"],"a":1,"e":"Partition — parallellik va tartib birligi. Agar order_id ni key qilsangiz, o'sha buyurtmaning hamma hodisalari bitta partitionda va tartibda bo'ladi. Global tartib kerak bo'lsa — bitta partition, lekin u throughput'ni cheklaydi. Partition sonini keyin oshirish key→partition taqsimotini o'zgartiradi — tartib kafolati buziladi, shuning uchun oldindan rejalashtiriladi.","src":"https://kafka.apache.org/documentation/#intro_concepts"},{"l":"M","t":"mcq","tp":"Kafka","d":"msg","id":5001,"n":"V2","q":"Consumer group va partition munosabati?","o":["Har consumer hamma partitiondan o'qiydi","Bitta group ichida har partitionni faqat bitta consumer o'qiydi — shuning uchun parallellik partition soni bilan cheklangan (10 partition = maksimal 10 ta ishchi consumer)","Partition soni consumer sonidan kichik bo'lishi shart","Group'lar bir-birining offsetini bo'lishadi"],"a":1,"e":"Consumer qo'shsangiz ham partitiondan ko'p bo'lsa, ortiqchalari bo'sh turadi. Turli group'lar bir xil xabarlarni mustaqil o'qiydi (fan-out). Consumer qo'shilishi/chiqishi rebalance'ga olib keladi — bu paytda iste'mol to'xtaydi; uzoq ishlov (max.poll.interval.ms dan oshsa) consumer'ni group'dan chiqarib yuboradi va cheksiz rebalance sikli boshlanadi."},{"l":"S","t":"mcq","tp":"Kafka","d":"msg","id":5002,"n":"V3","q":"Producer'da <code>acks=1</code> va <code>acks=all</code> farqi?","o":["Farqi faqat tezlikda, ma'lumot yo'qolmaydi","acks=1 — faqat leader yozganini tasdiqlaydi: leader yiqilsa, replikaga yetmagan xabar yo'qoladi. acks=all + min.insync.replicas=2 — kamida ikki nusxa yozilgach tasdiq, ishonchli lekin sekinroq","acks=all xabarni ikki marta yuboradi","acks=0 eng ishonchli"],"a":1,"e":"To'lov/buyurtma hodisalari uchun: acks=all, min.insync.replicas=2, replication.factor=3, enable.idempotence=true (takror yozishni oldini oladi va retry xavfsiz bo'ladi). Analitika/telemetriya uchun acks=1 maqbul. Yana: retries + max.in.flight.requests.per.connection idempotence bilan birga tartibni saqlaydi.","src":"https://kafka.apache.org/documentation/#producerconfigs"},{"l":"S","t":"mcq","tp":"Kafka","d":"msg","id":5003,"n":"V4","q":"Consumer'da auto-commit yoqilgan (<code>enable.auto.commit=true</code>). Qanday xavf bor?","o":["Hech qanday","Offset ishlov tugashidan oldin commit bo'lishi mumkin — crash bo'lsa xabar qayta o'qilmaydi va yo'qoladi; to'g'ri yo'l: ishlov tugagach qo'lda commit qilish (at-least-once) va consumer'ni idempotent qilish","Xabarlar ikki marta commit bo'ladi","Offsetlar umuman saqlanmaydi"],"a":1,"e":"Tartib muhim: o'qish → ishlov → commit. Bu at-least-once beradi (crash bo'lsa takror), shuning uchun dedup kerak: message_id yoki biznes key'i bo'yicha unique constraint. Teskarisi (avval commit) at-most-once — yo'qotishga yo'l qo'yadi. 'Exactly-once' faqat Kafka ichidagi transaction'larda, tashqi DB uchun idempotentlik zarur."},{"l":"S","t":"open","tp":"Kafka","d":"msg","id":5004,"n":"V5","q":"Consumer lag o'sib ketdi (millionlab xabar orqada). Sabablarni va yechimlarni ayting.","m":["O'lchash: lag qaysi partitionlarda? Hammasidami yoki bir nechtasidami (skew — issiq key)","Sabab 1: consumer sekin — tashqi API yoki DB kutish, N+1, batch'siz yozish; profil qilib tuzatish","Sabab 2: parallellik yetmaydi — partition soni cheklab qo'ygan; partition va consumer sonini oshirish","Sabab 3: rebalance sikli (uzoq ishlov, max.poll.interval.ms), yoki poyson xabar qayta-qayta retry bo'lyapti — DLQ kerak","Vaqtinchalik chora: og'ir ishni ajratib, faqat qabul qilib boshqa topicga yozish; keraksiz xabarlarni filtrlash","Oldini olish: lag bo'yicha alert (SLO), yuk testi, batch ishlov va connection pool'ini sozlash"],"e":"Intervyuda kutiladi: avval o'lchash va sababni ajratish, keyin chora. 'Consumer sonini oshiraman' — partition soni yetmasa foyda bermaydi."},{"l":"S","t":"mcq","tp":"Kafka","d":"msg","id":5005,"n":"V6","q":"Log compaction (<code>cleanup.policy=compact</code>) nima qiladi?","o":["Xabarlarni siqib diskni tejaydi","Har key uchun oxirgi qiymatni saqlaydi, eskilarini o'chiradi — topic 'joriy holat table'i' bo'lib qoladi (masalan user profili oxirgi holati)","Xabarlarni arxivga ko'chiradi","Faqat vaqt bo'yicha o'chiradi"],"a":1,"e":"Oddiy retention (delete) — vaqt yoki hajm bo'yicha o'chiradi. Compact — CDC/state uchun: yangi consumer topicni boshidan o'qib joriy holatni tiklay oladi. O'chirish uchun tombstone (key bilan null qiymat) yoziladi. Ikkalasini birga ishlatish ham mumkin (compact,delete)."},{"l":"S","t":"mcq","tp":"Kafka","d":"msg","id":30065,"n":"SN66","q":"Kafka'da 'exactly-once' amalda nimani bildiradi?","o":["Xabar hech qachon takrorlanmaydi, tarmoq ham buzilmaydi","Kafka ichida (read-process-write) transactional producer + `isolation.level=read_committed` bilan atomik offset commit; tashqi tizimga yozishda esa idempotent consumer (dedupe kaliti) kerak","Faqat `acks=all` qo'yish yetarli","Consumer group avtomatik ta'minlaydi"],"a":1,"e":"Kafka EOS Kafka→Kafka oqimida ishlaydi: producer idempotent (PID + sequence), transaksiya offset commit bilan bir atomikada. DB yoki tashqi API'ga yozganda transaksiya Kafka'dan tashqariga chiqmaydi — shuning uchun consumer o'zi idempotent bo'ladi: `unique(message_id)` yoki `ON CONFLICT DO NOTHING`, yoki outbox/inbox jadval. Amaliy formulasi: at-least-once + idempotent handler."},{"l":"S","t":"mcq","tp":"Kafka","d":"msg","id":30066,"n":"SN67","q":"Consumer group doimiy rebalance qilyapti (`Rebalancing` loop), lag o'syapti. Sabab?","o":["Partition soni kam","Handler `max.poll.interval.ms`dan uzun ishlaydi — broker consumer'ni o'lik deb hisoblaydi va guruhni qayta taqsimlaydi","Replikatsiya faktori 1","`acks=0`"],"a":1,"e":"`session.timeout.ms` heartbeat uchun (alohida thread), `max.poll.interval.ms` esa ishlov berish vaqti uchun. Sekin handler — klassik sabab. Choralar: `max.poll.records`ni kamaytirish, ishni background worker'ga berib poll'ni bo'shatish (offset faqat tugagach commit qilinadi), timeoutni realga moslash, cooperative sticky assignor bilan rebalance narxini pasaytirish."},{"l":"S","t":"mcq","tp":"Kafka","d":"msg","id":30067,"n":"SN68","q":"Xabarlar tartibi qanday kafolatlanadi va nima uni buzadi?","o":["Kafka global tartib beradi","Tartib faqat bitta partition ichida; kalit bo'yicha partitionlash (masalan `order_id`) tartibni saqlaydi. Buzadi: kalitsiz yuborish, partition sonini o'zgartirish, retry bilan `max.in.flight>1` idempotentsiz, va parallel handler","Consumer soni tartibni belgilaydi","Tartib har doim yo'qoladi"],"a":1,"e":"Partition sonini oshirish kalit→partition moslashuvini o'zgartiradi — bir entity eventlari ikki partitionda qoladi va tartib buziladi (shu sabab oldindan zapas partition olinadi). Consumer tomonda tartib kerak bo'lsa parallelizm partition darajasida bo'ladi yoki entity kaliti bo'yicha in-order worker (key-based queue)."},{"l":"S","t":"mcq","tp":"Kafka","d":"msg","id":30068,"n":"SN69","q":"`acks=all` bilan ham ma'lumot yo'qolishi mumkin bo'lgan holat?","o":["Yo'q, mumkin emas","`min.insync.replicas=1` bo'lsa: 'all' bitta replica (leader) degani bo'lib qoladi va leader yo'qolsa yozuv yo'qoladi. Shuningdek `unclean.leader.election.enable=true` bo'lsa eskirgan replica leader bo'lib ma'lumot kesiladi","Faqat disk to'lsa","Producer buffer kichik bo'lsa"],"a":1,"e":"Durability uchun uchlik birga sozlanadi: `replication.factor=3`, `min.insync.replicas=2`, `acks=all`, `unclean.leader.election.enable=false`, va producer'da `enable.idempotence=true` + cheksiz retry. Aks holda konfiguratsiya 'kafolat bordek' ko'rinadi, lekin yo'q."},{"l":"St","t":"mcq","tp":"Kafka","d":"msg","id":30069,"n":"SN70","q":"Poison message (parse bo'lmaydigan xabar) partitionni to'sib qo'ydi. To'g'ri strategiya?","o":["Offsetni qo'lda o'tkazib yuborish va unutish","Retry cheklangan marta (backoff bilan), keyin DLQ topikka original xabar + xato konteksti (headerlar, offset, sabab) bilan ko'chirish; DLQ kuzatiladi va qayta o'ynatish vositasi bo'ladi","Cheksiz retry","Topikni o'chirish"],"a":1,"e":"Bitta xabar butun partitionni to'xtatib qo'yishi — Kafka'ning eng ko'p uchraydigan operatsion muammosi. DLQ'dan tashqari kerak: alert (DLQ hajmi), replay skripti (tuzatilgandan keyin), va xabar sxemasini oldinga/orqaga mos qilish (schema registry, compatibility qoidalari) — poison ko'pincha sxema o'zgarishidan keladi."},{"l":"S","t":"mcq","tp":"Kafka","d":"msg","id":30070,"n":"SN71","q":"Consumer lag 10 mln xabarga chiqdi. Qanday tiklaysiz?","o":["Consumer sonini 100 ga chiqarish","Diagnoz: lag bir partitionda yoki hammasida; handler latency va tashqi dependency; keyin — parallelizm partition chegarasida, batch ishlov berish, tashqi chaqiruvni batch/async qilish, kerak bo'lsa vaqtincha kritik bo'lmagan ishni o'tkazib yuborish","Retentionni 1 soatga tushirish","Topikni yangisiga ko'chirish"],"a":1,"e":"Birinchi savol — bottleneck qayerda: bir partition hot (kalit taqsimoti yomon) yoki handler sekin (N+1 DB query, sinxron HTTP). Consumer'ni partitiondan ko'p qo'yish foyda bermaydi. Tez g'alaba ko'pincha batching (DB'ga bitta `COPY`/bulk insert) va kerak bo'lmagan sinxron chaqiruvni olib tashlash."},{"l":"St","t":"open","tp":"Kafka","d":"msg","id":30071,"n":"SN72","q":"Servisda DB yozuvi va Kafka'ga event yuborish atomik bo'lishi kerak. Qanday qilasiz?","m":["Muammo: dual write — DB commit bo'lib, Kafka publish yiqilsa (yoki teskari) tizim nomuvofiq qoladi","Transactional outbox: bir transaksiyada biznes yozuvi + `outbox` jadvaliga event; alohida publisher (poller yoki CDC/Debezium) outbox'ni o'qib Kafka'ga yuboradi va belgilaydi","Yetkazib berish at-least-once bo'ladi — consumer idempotent (event_id bo'yicha dedupe / inbox jadval)","Tartib: outbox'da `aggregate_id` bo'yicha ketma-ketlik va Kafka kaliti aynan shu aggregate_id","Alternativalar: listen-to-yourself (avval eventni yozib, holatni consumer'da qurish) yoki CDC to'g'ridan-to'g'ri jadvaldan — lekin CDC ichki sxemani tashqariga oqizadi","Kuzatuv: outbox lag (eng qadimgi yuborilmagan yozuv yoshi) — alert shu metrikaga"],"e":"Intervyuda 'distributed transaction/2PC' javobi kutilmaydi — outbox amaliy standart. Muhim nuqta: atomiklik DB ichida hal qilinadi, tashqarida esa idempotentlik bilan."},{"l":"S","t":"mcq","tp":"Kafka","d":"msg","id":30072,"n":"SN73","q":"Log compaction qachon ishlatiladi?","o":["Disk tejash uchun har doim","Kalit bo'yicha oxirgi holat kerak bo'lganda (masalan `user_id -> profile` snapshot, konfiguratsiya, materiallashgan view manbasi) — compaction har kalitning oxirgi qiymatini saqlaydi, `null` value tombstone bilan o'chirish","Event tarixini saqlash uchun","Faqat test muhitida"],"a":1,"e":"Compacted topic — cheksiz holat jurnali: yangi consumer noldan o'qib to'liq joriy holatni qurishi mumkin (Kafka Streams KTable shunga tayanadi). Cheklov: tarix yo'qoladi (audit uchun yaroqsiz), tombstone `delete.retention.ms` davomida saqlanadi, va compaction fon jarayoni — darhol bo'lmaydi."},{"l":"S","t":"open","tp":"Kafka","d":"msg","id":30250,"n":"SN251","q":"Real-time event distribution (yengil pub/sub) tizimini loyihalang — miqyos va ishonchlilikka fokus.","m":["Talablar: eventlar/sekund, iste'molchilar soni, yetkazib berish kafolati (at-least-once?), tartib talabi, latency maqsadi (ms yoki sekund), retention","Ingest: gateway faqat validatsiya va tenant aniqlash, so'ng Kafka topikka yozish; kalit — tartib kerak bo'lgan entity (`aggregate_id`), partition soni oldindan zapas bilan","Distribution: consumer group'lar mustaqil (har iste'molchi o'z offseti bilan), fan-out uchun topic-per-event-type yoki bitta topic + filtrlash; tashqi iste'molchilarga webhook yoki WebSocket gateway orqali","Ishonchlilik: `acks=all` + `min.insync.replicas=2`, idempotent producer, consumer tomonda idempotent handler (event_id dedupe), DLQ va retry topiklari","Backpressure: sekin iste'molchi butun tizimni to'xtatmasligi kerak — har iste'molchi o'z lag'i bilan ketadi (log modelining asosiy afzalligi); WebSocket qatlamida esa per-client bufer va sekin clientni uzish siyosati","Sxema: registry + backward compatibility, faqat qo'shimcha maydon; `occurred_at` va versiya har eventda","Miqyos: partition bo'yicha parallel consumer, KEDA bilan lag asosida skale; hot kalit bo'lsa kalitni sub-shardlash","Kuzatuv: end-to-end latency (produce→consume), lag per group, DLQ hajmi, dublikat nisbati","Cheklovlarni aytish: qat'iy global tartib yo'q (faqat partition ichida), exactly-once faqat Kafka ichida — tashqariga idempotentlik bilan"],"e":"Bu savol senior intervyularda aynan shu shaklda so'raladi. Kutiladigan signal — talabni aniqlash, kalit/partition tanlovi, kafolatlar konfiguratsiyasi (acks/min.insync/idempotent), sekin iste'molchi muammosi va cheklovlarni oshkora aytish."},{"l":"S","t":"mcq","tp":"Kafka","d":"msg","id":30251,"n":"SN252","q":"Kafka'da `retention.ms` va `log.retention.bytes` tugaganda nima bo'ladi va bu qanday xatarni keltiradi?","o":["Eski xabarlar arxivga ko'chadi","Segmentlar o'chiriladi — hali o'qimagan consumer offseti yo'qolib `OFFSET_OUT_OF_RANGE` oladi va `auto.offset.reset` bo'yicha boshidan yoki oxiridan boshlaydi (ya'ni ma'lumot jim tashlanadi)","Producer bloklanadi","Hech narsa o'chmaydi"],"a":1,"e":"Bu incident ko'rinishi: consumer bir kecha to'xtab qolgan, retention 24 soat — uyg'onganda `latest` bilan boshlab o'rtadagi eventlarni yo'qotadi. Himoya: retention'ni tiklanish vaqtidan katta qo'yish, lag'ga alert (nafaqat xato), `auto.offset.reset=earliest` bilan ehtiyot (dublikat yaxshi, yo'qotishdan), va muhim ma'lumotni ombor/S3 ga arxivlash."},{"l":"St","t":"mcq","tp":"Kafka","d":"msg","id":30252,"n":"SN253","q":"Kafka Streams/consumer'da stateful agregatsiya kerak (5 daqiqali oyna). Holat qayerda saqlanadi?","o":["Ilova xotirasida, restartda yo'qolsa qaytadan hisoblanadi","Mahalliy state store (RocksDB) + changelog topikka backup — instansiya yiqilsa boshqa joyda changelog'dan tiklanadi; kechikkan eventlar uchun grace period va oyna semantikasi (tumbling/hopping/session) aniq belgilanadi","Faqat Redis'da","DB'da har event uchun UPDATE"],"a":1,"e":"Changelog compacted topic bo'ladi, shuning uchun tiklash oxirgi holatdan boshlanadi. Muhim detallar: standby replica bilan tiklash vaqtini qisqartirish, event-time vs processing-time farqi (kechikkan eventlar `grace` ichida hisobga olinadi), va rebalance paytida state ko'chishi qimmat — `static membership` bu narxni kamaytiradi."},{"l":"P","t":"mcq","tp":"Kafka","d":"msg","id":30443,"n":"SN444","q":"Kafka'da ISR va high watermark nima?","o":["Consumer offseti","ISR — leader bilan yetarlicha sinxron replikalar to'plami; high watermark — barcha ISR tomonidan replikatsiya qilingan oxirgi offset. Consumer faqat high watermark'gacha o'qiy oladi — shu bilan 'commit bo'lmagan' ma'lumot ko'rinmaydi va leader almashsa tartib buzilmaydi","Partition soni","Retention chegarasi"],"a":1,"e":"`replica.lag.time.max.ms` dan orqada qolgan replica ISR'dan chiqariladi — shundan keyin `min.insync.replicas` shartini buzsa producer `acks=all` bilan xato oladi (bu himoya, nosozlik emas). Leader almashganda yangi leader ISR'dan tanlanadi; `unclean.leader.election` yoqilgan bo'lsa ISR'dan tashqaridagi replica ham leader bo'lib ma'lumot kesilishi mumkin."},{"l":"St","t":"mcq","tp":"Kafka","d":"msg","id":30444,"n":"SN445","q":"Consumer rebalance protokollari: eager, cooperative, static membership — farqi?","o":["Farqi yo'q","Eager: barcha consumer barcha partitionni qo'yib yuboradi va qayta taqsimlanadi (stop-the-world); cooperative (incremental): faqat ko'chadigan partitionlar qo'yiladi — pauza minimal; static membership (`group.instance.id`): restart/deploy paytida a'zolik saqlanadi va rebalance umuman bo'lmaydi (session timeout ichida)","Static eskirgan","Cooperative faqat Streams'da"],"a":1,"e":"Amaliy tavsiya: `CooperativeStickyAssignor` + static membership — deploy paytidagi lag sakrashini deyarli yo'qotadi. Static membership'da diqqat: instansiya haqiqatan o'lsa ham session timeout tugaguncha uning partitionlari qayta taqsimlanmaydi, shuning uchun timeout deploy vaqtiga moslanadi."},{"l":"St","t":"mcq","tp":"Kafka","d":"msg","id":30445,"n":"SN446","q":"Kafka transactional producer ichkarida qanday ishlaydi?","o":["DB tranzaksiyasi kabi","Transaction coordinator (ichki `__transaction_state` topic) `transactional.id` bo'yicha holat yuritadi: producer epoch bilan zombi instansiyalar bloklanadi (fencing), yozuvlar commit/abort markerlari bilan belgilanadi, va `read_committed` consumer abort qilingan yozuvlarni o'tkazib yuboradi","2PC bilan DB'ga ulanadi","Faqat bitta partitionda"],"a":1,"e":"Muhim cheklov: atomiklik faqat Kafka ichida (bir necha partition/topic + consumer offset). Tashqi DB bilan atomiklik yo'q — shuning uchun outbox yoki idempotent consumer kerak. Narxi: latency oshadi (markerlar, coordinator round-trip) va `transactional.id` har instansiya uchun barqaror bo'lishi kerak, aks holda fencing ishlamaydi."},{"l":"S","t":"mcq","tp":"Queue","d":"msg","id":1014,"n":"B15","q":"Queue at-least-once yetkazib beradi. Consumer uchun to'g'ri yondashuv?","o":["Takrorlar bo'lmaydi deb hisoblash","Consumer'ni idempotent qilish: message_id bo'yicha dedup (processed table, unique constraint) yoki tabiatan idempotent operatsiyalar","Ack'ni ishlovdan oldin yuborish","Faqat bitta consumer ishlatish"],"a":1,"e":"Ishlovdan oldin ack — at-most-once (xabar yo'qolishi mumkin). Keyin ack — at-least-once (crash bo'lsa takror). Takrorga chidash — idempotentlik. Zaharli xabar uchun max retry + DLQ (dead letter queue)."},{"l":"St","t":"mcq","tp":"Queue","d":"msg","id":1019,"n":"B20","q":"'Kafka exactly-once' haqida to'g'ri gap?","o":["Har qanday tizimda end-to-end exactly-once kafolatlanadi","Kafka EOS faqat Kafka ichida (read-process-write transaction'lar) ishlaydi; tashqi DB/API'ga side effect uchun baribir idempotentlik yoki outbox kerak","Exactly-once imkonsiz, shuning uchun Kafka faqat at-most-once","Consumer group buni avtomatik hal qiladi"],"a":1,"e":"Network'da yetkazib berish — at-least-once; 'exactly-once' amalda 'effectively-once processing' = at-least-once + idempotentlik. Intervyuda bu farqni aniq aytish kuchli signal."},{"l":"M","t":"mcq","tp":"RabbitMQ","d":"msg","id":5007,"n":"V8","q":"Kafka va RabbitMQ o'rtasidagi asosiy farq?","o":["Farqi yo'q, ikkalasi ham queue","Kafka — saqlanadigan log: xabar o'qilgach ham qoladi, qayta o'qish (replay) va ko'p consumer group mumkin. RabbitMQ — klassik broker: xabar ack qilingach queue'dan o'chadi, kuchli routing (exchange, binding), per-message TTL va prioritet bor","RabbitMQ tezroq va replay qiladi","Kafka routing uchun mo'ljallangan"],"a":1,"e":"Tanlov: event streaming, replay, katta throughput, event sourcing → Kafka. Vazifa queue'i (task queue), murakkab marshrutlash, per-message prioritet/TTL, kichik-o'rta yuk → RabbitMQ. Vakansiyada ikkalasi ham bor — farqni aniq aytish kutiladi."},{"l":"S","t":"mcq","tp":"RabbitMQ","d":"msg","id":5008,"n":"V9","q":"RabbitMQ'da <code>prefetch</code> (QoS) nima uchun kerak?","o":["Xabarlarni siqish uchun","Consumer bir vaqtda nechta ack qilinmagan xabar olishini cheklaydi — cheklanmasa bitta consumer hamma xabarni tortib olib, yukni notekis taqsimlaydi va memory'ni to'ldiradi","Xabar tartibini kafolatlaydi","Queue'ni o'chiradi"],"a":1,"e":"prefetch=1 — eng adolatli taqsimot (sekin ishlov uchun), lekin round-trip ko'p. Odatda 10–100 orasida sozlanadi. Bog'liq mavzular: manual ack (ishlov tugagach), nack/requeue va cheksiz retry sikli xavfi, Dead Letter Exchange (DLX) va TTL bilan kechiktirilgan retry."},{"l":"J","t":"mcq","tp":"RabbitMQ","d":"msg","id":5033,"n":"V34","q":"RabbitMQ'da xabar qayerga yuboriladi?","o":["To'g'ridan-to'g'ri queue'ga","Producer xabarni exchange'ga yuboradi; exchange binding qoidalari bo'yicha uni bir yoki bir nechta queue'ga yo'naltiradi; consumer queue'dan o'qiydi","Consumer'ga to'g'ridan-to'g'ri","Broker o'zi tasodifiy tanlaydi"],"a":1,"e":"Exchange turlari: direct (routing key aynan mos kelsa), topic (order.*.created kabi shablon), fanout (hamma bog'langan queue'ga nusxa), headers (header qiymatlari bo'yicha). Bu Kafka'dan asosiy farq: marshrutlash mantig'i brokerda, consumer'da emas. Hech qaysi queue'ga tushmagan xabar yo'qoladi — agar alternate exchange yoki mandatory bayrog'i qo'yilmagan bo'lsa."},{"l":"M","t":"mcq","tp":"RabbitMQ","d":"msg","id":5034,"n":"V35","q":"Consumer xabarni oldi va ishlov paytida crash bo'ldi. Xabar nima bo'ladi?","o":["Yo'qoladi","Agar manual ack ishlatilsa (autoAck=false) va ack yuborilmagan bo'lsa — connection uzilganda xabar queue'ga qaytadi (requeue) va boshqa consumer'ga beriladi. autoAck=true bo'lsa yetkazilishi bilan o'chgan bo'ladi — yo'qoladi","Broker uni o'chiradi","Producer'ga qaytadi"],"a":1,"e":"Qoida: ishlov tugagach ack. Lekin cheksiz sikl xavfi bor — xato xabar qayta-qayta requeue bo'lib aylanaveradi. Shuning uchun basic.nack(requeue=false) bilan Dead Letter Exchange'ga yuborish va urinishlar sonini header'da sanash kerak."},{"l":"M","t":"mcq","tp":"RabbitMQ","d":"msg","id":5035,"n":"V36","q":"Broker qayta ishga tushganda xabarlar saqlanib qolishi uchun nima kerak?","o":["Hech narsa, hammasi avtomatik saqlanadi","Uch shart birga: queue durable, xabar persistent (delivery_mode=2) va ideal holda publisher confirms yoqilgan — aks holda xabar faqat memory'da bo'ladi","Faqat queue'ni durable qilish yetarli","Faqat xabarni persistent qilish yetarli"],"a":1,"e":"Publisher confirms — broker xabarni qabul qilganini tasdiqlaydi; tasdiqsiz 'yubordim' degan ishonch yolg'on bo'lishi mumkin. Eslatma: persistent xabar ham diskka yozilgunga qadar qisqa oyna bor — mutlaq kafolat uchun quorum queue va confirms birga ishlatiladi. Persistence tezlikni pasaytiradi — ongli tanlov."},{"l":"S","t":"mcq","tp":"RabbitMQ","d":"msg","id":5036,"n":"V37","q":"Dead Letter Exchange (DLX) qachon ishga tushadi?","o":["Faqat broker yiqilganda","Xabar rad etilganda (nack/reject, requeue=false), TTL tugaganda yoki queue uzunligi limitidan oshganda — xabar DLX orqali boshqa queue'ga o'tadi","Har xabar uchun","Consumer sekin bo'lganda"],"a":1,"e":"DLX ikki ishda qo'llaniladi: 1) zaharli xabarlarni tekshirish uchun ajratish; 2) kechiktirilgan retry: xabarni TTL li 'retry' queue'ga yuborib, TTL tugagach DLX orqali asosiy queue'ga qaytarish (exponential backoff uchun bir nechta TTL queue'i). Kuzatuv: DLQ o'lchami bo'yicha alert qo'yish shart."},{"l":"S","t":"mcq","tp":"RabbitMQ","d":"msg","id":5037,"n":"V38","q":"Klassik mirrored queue o'rniga hozir nima tavsiya etiladi?","o":["Hech narsa, mirrored queue standart","Quorum queue — Raft konsensusiga asoslangan, ko'pchilik tasdig'i bilan ishonchli replikatsiya; klassik mirrored queue eskirgan va RabbitMQ 4.0 da olib tashlangan","Faqat bitta node ishlatish","Stream queue faqat"],"a":1,"e":"Quorum queue: yuqori ishonchlilik, xabarni yo'qotmaslikka urg'u; narxi — ko'proq disk/memory va biroz sekinroq. Stream — Kafka'ga o'xshash append-only log (replay va ko'p consumer uchun). Tanlov: vazifa queue'i → quorum queue; hodisalar oqimi va qayta o'qish → stream yoki Kafka.","src":"https://www.rabbitmq.com/docs/quorum-queues"},{"l":"S","t":"open","tp":"RabbitMQ","d":"msg","id":5038,"n":"V39","q":"RabbitMQ'da queue uzunligi doim o'sib boryapti. Nima qilasiz?","m":["O'lchash: qaysi queue, publish va deliver tezligi (rate), unacked xabarlar soni","Consumer sekinmi (tashqi API, DB) yoki consumer soni kammi — prefetch va parallel consumer sonini sozlash","Xabarlar qayta-qayta requeue bo'lyaptimi (xato xabar sikli) — DLX va urinish limiti","Backpressure: max-length yoki max-length-bytes bilan queue'ni cheklash — to'lganda eski xabar DLX'ga ketadi yoki publish rad etiladi","Broker tomoni: flow control (memory/disk alarm) yoqilganmi — publisher'lar sekinlashtirilgan bo'lishi mumkin","Arxitektura: og'ir ishni bo'lish, batch qilish, kerak bo'lsa Kafka'ga o'tish (juda katta oqim uchun)"],"e":"Muhim tushuncha: RabbitMQ queue'i uzoq saqlash uchun emas — u yetkazib berish uchun. Uzun queue memory'ni yeydi va butun brokerni sekinlashtiradi; shuning uchun cheklov va alert kerak."},{"l":"S","t":"mcq","tp":"RabbitMQ","d":"msg","id":5039,"n":"V40","q":"Bir nechta consumer bo'lsa, xabarlar tartibi kafolatlanadimi?","o":["Ha, doim","Bitta queue va bitta consumer bo'lsa tartib saqlanadi; bir nechta consumer parallel ishlaganda tartib buziladi (requeue ham tartibni buzadi). Tartib kerak bo'lsa: key bo'yicha alohida queue (consistent hash exchange) yoki bitta consumer","Faqat quorum queue'da","Xabar tartibi hech qachon saqlanmaydi"],"a":1,"e":"Bu Kafka bilan taqqoslash uchun muhim: Kafka'da tartib partition ichida kafolatlanadi va parallellik partition bo'yicha bo'ladi; RabbitMQ'da parallellik consumer bo'yicha — tartibni o'zingiz loyihalashingiz kerak. Ko'pincha to'g'ri yechim: tartibga tayanmaydigan, idempotent ishlov."},{"l":"M","t":"mcq","tp":"Queue","d":"msg","id":13005,"n":"K6","q":"Message queue (point-to-point) va pub/sub farqi?","o":["Bir xil","Queue — bitta xabarni faqat bitta consumer oladi (ish taqsimoti, competing consumers). Pub/Sub — bitta xabar barcha obunachilarga yetadi (fan-out, bir necha mustaqil iste'molchi)","Pub/Sub xabarni saqlaydi, queue saqlamaydi","Queue faqat Kafka'da bor"],"a":1,"e":"Kafka ikkalasini birlashtiradi: bitta consumer group ichida — queue (partition bitta consumer'ga), turli group'lar uchun — pub/sub (har group hammasini o'qiydi). Dizayn savoli: 'bu hodisani kim iste'mol qiladi va kelajakda yana kim qo'shiladi' — javob fan-out kerakligini aniqlaydi."},{"l":"S","t":"mcq","tp":"Queue","d":"msg","id":30227,"n":"SN228","q":"PostgreSQL'ni navbat sifatida ishlatish (`SELECT ... FOR UPDATE SKIP LOCKED`) qachon oqlanadi?","o":["Hech qachon","O'rtacha yuklamada (minglab ish/daqiqa) va ish biznes ma'lumoti bilan bir tranzaksiyada bo'lishi kerak bo'lganda — bitta tizim, tranzaksion kafolat, oson kuzatuv va SQL bilan inspektsiya; juda yuqori throughput yoki fan-out kerak bo'lsa broker afzal","Har doim, broker keraksiz","Faqat testda"],"a":1,"e":"Afzalliklari amaliy: outbox bilan tabiiy birlashadi, 'qaysi ish qotib qoldi' savoliga `SELECT` bilan javob beriladi, alohida infra saqlash kerak emas. Cheklovlari: yuqori RPS'da vacuum va bloat (tez o'chirish yoki partition bilan hal qilinadi), pub/sub fan-out yo'q, va uzoq ishlar uchun lease/`visibility timeout` ni o'zingiz yozasiz."},{"l":"S","t":"mcq","tp":"RabbitMQ","d":"msg","id":30228,"n":"SN229","q":"RabbitMQ va Kafka o'rtasidagi asosiy model farqi?","o":["Faqat tezlik","RabbitMQ — broker xabarni consumer'ga yetkazadi va ack'dan keyin o'chiradi (smart broker, marshrutlash exchange orqali, per-message ack, prioritet); Kafka — o'zgarmas log, consumer offsetni o'zi boshqaradi, qayta o'ynatish va ko'p mustaqil consumer guruhi tabiiy","Kafka'da ack yo'q","RabbitMQ log saqlaydi"],"a":1,"e":"Tanlov mezoni: murakkab marshrutlash, per-task ack, prioritet va kechiktirilgan yetkazib berish kerak bo'lsa — RabbitMQ; eventlarni saqlash, replay, stream processing va juda yuqori throughput kerak bo'lsa — Kafka. Ko'p tizimda ikkisi birga yashaydi: Kafka — event backbone, RabbitMQ yoki DB navbati — task queue."},{"l":"S","t":"mcq","tp":"Queue","d":"msg","id":30377,"n":"SN378","q":"PostgreSQL'ni navbat sifatida ishlatish (`SELECT ... FOR UPDATE SKIP LOCKED`) qachon oqlanadi?","o":["Hech qachon","O'rtacha yuklamada (minglab ish/daqiqa) va ish biznes ma'lumoti bilan bir tranzaksiyada bo'lishi kerak bo'lganda — bitta tizim, tranzaksion kafolat, oson kuzatuv va SQL bilan inspektsiya; juda yuqori throughput yoki fan-out kerak bo'lsa broker afzal","Har doim, broker keraksiz","Faqat testda"],"a":1,"e":"Afzalliklari amaliy: outbox bilan tabiiy birlashadi, 'qaysi ish qotib qoldi' savoliga `SELECT` bilan javob beriladi, alohida infra saqlash kerak emas. Cheklovlari: yuqori RPS'da vacuum va bloat (tez o'chirish yoki partition bilan hal qilinadi), pub/sub fan-out yo'q, va uzoq ishlar uchun lease/`visibility timeout` ni o'zingiz yozasiz."},{"l":"S","t":"mcq","tp":"RabbitMQ","d":"msg","id":30378,"n":"SN379","q":"RabbitMQ va Kafka o'rtasidagi asosiy model farqi?","o":["Faqat tezlik","RabbitMQ — broker xabarni consumer'ga yetkazadi va ack'dan keyin o'chiradi (smart broker, marshrutlash exchange orqali, per-message ack, prioritet); Kafka — o'zgarmas log, consumer offsetni o'zi boshqaradi, qayta o'ynatish va ko'p mustaqil consumer guruhi tabiiy","Kafka'da ack yo'q","RabbitMQ log saqlaydi"],"a":1,"e":"Tanlov mezoni: murakkab marshrutlash, per-task ack, prioritet va kechiktirilgan yetkazib berish kerak bo'lsa — RabbitMQ; eventlarni saqlash, replay, stream processing va juda yuqori throughput kerak bo'lsa — Kafka. Ko'p tizimda ikkisi birga yashaydi: Kafka — event backbone, RabbitMQ yoki DB navbati — task queue."},{"l":"S","t":"mcq","tp":"Queue","d":"msg","id":30446,"n":"SN447","q":"RabbitMQ quorum queue va classic mirrored queue farqi?","o":["Bir xil","Quorum queue Raft asosida: kvorum bilan durability, bashorat qilinadigan failover, va poison message uchun `delivery-limit`; classic mirrored queue eskirgan (deprecated) — sinxronizatsiya muammolari va split-brain xatti-harakati bilan mashhur edi","Classic tezroq va tavsiya etiladi","Quorum faqat testda"],"a":1,"e":"Yangi tizimlarda quorum queue standart tanlov (durable, replicated). Cheklovlari: xotira/disk sarfi kattaroq, lazy rejim va juda uzun navbatlar uchun `stream` turi mos; prioritet navbat va ba'zi funksiyalar qo'llanmaydi. Tanlashda: vazifa navbati — quorum queue; katta event oqimi va replay — RabbitMQ Streams yoki Kafka."},{"l":"St","t":"mcq","tp":"Integration","d":"msg","id":41,"n":42,"q":"Servis DBga order yozadi va Kafka'ga event yuboradi. Biri success'li, ikkinchisi yiqilishi mumkin. Qaysi pattern buni hal qiladi?","o":["Two-phase commit har doim","Transactional outbox: event ham shu DB transaction'sida outbox table'iga yoziladi, relay (polling yoki CDC) keyin Kafka'ga yuboradi","Kafka'ga avval, keyin DB'ga yozish","Retry bilan ikkalasiga ketma-ket yozish"],"a":1,"e":"Dual-write muammosi. Outbox atomiklikni DB transaction'siga keltiradi. Kafolat — at-least-once, shuning uchun consumer'lar idempotent bo'lishi kerak (event_id bo'yicha dedup). 2PC Kafka bilan amalda qo'llanmaydi va availability'ni tushiradi."},{"l":"St","t":"mcq","tp":"CDC","d":"msg","id":43,"n":44,"q":"Debezium kabi CDC toollari Postgres'dan o'zgarishlarni qanday oladi?","o":["Har soniyada table'ni polling qiladi","Triggerlar orqali","WAL'ni logical decoding (replication slot) orqali o'qiydi","Ilova loglarini parse qiladi"],"a":2,"e":"Logical replication slot WAL'ni consumer o'qiguncha saqlaydi. Xavf: consumer to'xtasa slot WAL'ni ushlab turadi va disk to'lib, primary yiqiladi — slot lag monitoringi va max_slot_wal_keep_size majburiy. Afzallik: ilovaga o'zgarish kerak emas, commit tartibi saqlanadi."},{"l":"St","t":"open","tp":"EDA","d":"msg","id":5006,"n":"V7","q":"Event'lar sxemasi vaqt o'tib o'zgaradi. Buni qanday boshqarasiz?","m":["Sxema registry (Avro/Protobuf/JSON Schema) va mosligi tekshiruvi CI'da","Backward compatible o'zgarishlar: ixtiyoriy maydon qo'shish, default bilan; maydon o'chirish/nomini o'zgartirish — buzadi","Consumer noma'lum maydonlarni e'tiborsiz qoldirsin (tolerant reader)","Buzuvchi o'zgarish kerak bo'lsa: yangi versiyali topic yoki event turi, ikkalasi parallel, migratsiya muddati bilan","Event — bu kontrakt: ichki DB modelini to'g'ridan-to'g'ri event qilib chiqarmaslik","Eventlar uzoq saqlanadi — eski versiyani o'qiy olish (upcasting) kerak"],"e":"Staff signal: event'ni public API kabi ko'rish va compatibility'ni avtomatik tekshirish. Ko'p jamoa aynan shu yerda og'riq oladi."},{"l":"S","t":"mcq","tp":"EDA","d":"msg","id":30073,"n":"SN74","q":"Event dizaynida 'event notification' va 'event-carried state transfer' farqi va tanlovi?","o":["Farqi yo'q","Notification faqat ID yuboradi (consumer callback qilib to'liq ma'lumot oladi) — kichik, lekin chaqiruv va coupling qoladi; state transfer to'liq holatni yuboradi — consumer mustaqil ishlaydi, lekin payload katta va versiyalash qiyinroq","Notification har doim yaxshi","State transfer faqat CQRS'da"],"a":1,"e":"Amaliy tanlov: ichki, tez o'zgaradigan va katta ma'lumotda notification + callback; consumer autonomiyasi muhim (tashqi jamoa, offline ishlash) bo'lsa state transfer. Ikkinchisida eventda versiya va `occurred_at` bo'lishi shart, chunki tartib buzilishi mumkin — consumer eski eventni yangi holat ustiga qo'llamasligi kerak."},{"l":"S","t":"mcq","tp":"EDA","d":"msg","id":30074,"n":"SN75","q":"Saga'da compensation nima va nega 'rollback' emas?","o":["Bir xil narsa","Sagada har qadam alohida commit bo'lgan — teskari qaytarish uchun biznes darajasidagi qarama-qarshi amal bajariladi (to'lovni qaytarish, rezervni bo'shatish); ular ham fail bo'lishi mumkin, shuning uchun retriable va idempotent bo'lishi kerak","Compensation faqat log yozadi","2PC bilan bir xil"],"a":1,"e":"Muhim detallar: compensation har doim to'liq qaytarmaydi (yuborilgan email qaytmaydi — shuning uchun 'semantik' compensation, masalan bekor qilish xabari). Kerak: har qadam holati saqlanadigan saga log (orchestrator yoki state machine), timeout bo'yicha compensation, va pivot qadam tushunchasi — undan keyin faqat oldinga borish mumkin."},{"l":"S","t":"mcq","tp":"EDA","d":"msg","id":30075,"n":"SN76","q":"Orchestration va choreography orasida qanday tanlanadi?","o":["Choreography har doim zamonaviyroq","Orchestration: markazda jarayon holati — kuzatish, timeout va compensation oson, lekin markaziy coupling; choreography: servislar eventga reaksiya qiladi — bo'sh bog'lanish, lekin jarayonni tushunish va debug qilish qiyin (implicit workflow)","Orchestration monolitda faqat","Farqi texnik emas"],"a":1,"e":"Amaliy qoida: murakkab, pul yoki SLA'ga bog'liq, ko'p qadamli va compensation talab qiladigan jarayon — orchestration (Temporal/Camunda yoki o'z state machine). Oddiy reaktiv ta'sirlar (email yuborish, analitika, kesh invalidatsiyasi) — choreography. Ko'pincha ikkisi birga: yadro jarayon orkestrlangan, yon effektlar event orqali."},{"l":"St","t":"mcq","tp":"CDC","d":"msg","id":30076,"n":"SN77","q":"Debezium bilan CDC joriy qilishda asosiy xatarlar?","o":["Faqat sekinlik","Ichki DB sxemasi tashqi kontraktga aylanib qoladi (har ALTER consumer'ni buzadi); PostgreSQL'da replication slot iste'mol qilinmasa WAL to'planib diskni to'ldiradi; snapshot bosqichi og'ir; DDL va TOAST maydonlar alohida ehtiyot talab qiladi","CDC event tartibini buzadi","CDC faqat MySQL'da"],"a":1,"e":"Eng xavfli operatsion nuqta — to'xtagan slot: `pg_replication_slots.restart_lsn` orqada qolsa WAL o'chmaydi va primary disk to'ladi (alert shart). Coupling muammosining yechimi — CDC'ni to'g'ridan-to'g'ri iste'molchiga bermay, anti-corruption qatlamda public eventga aylantirish (yoki outbox jadvalini CDC qilish — sxema o'zingiz nazoratidagi kontrakt)."},{"l":"S","t":"mcq","tp":"Integration","d":"msg","id":30077,"n":"SN78","q":"Tashqi provayder webhook yuboradi. Ishonchli qabul qilish uchun minimal talablar?","o":["Endpointni ochib qo'yish yetarli","Imzo tekshirish (HMAC, timestamp bilan replay oynasi), tez 2xx qaytarib ishni asinxron qilish, `event_id` bo'yicha idempotentlik, tartib kafolatlanmagani uchun versiya/`occurred_at` bo'yicha tekshirish, va qayta o'ynatish uchun raw payloadni saqlash","Faqat IP allowlist","Har webhookni sinxron ishlov berish"],"a":1,"e":"Provayder retry qiladi — dublikat kafolatlangan. Sinxron og'ir ishlov timeout keltiradi va provayder yana yuboradi (ish ikki marta bajariladi). Shuning uchun: raw saqlash → 200 → queue → idempotent handler. Imzoda vaqt oynasi (masalan 5 daqiqa) replay hujumini cheklaydi, tekshiruv `hmac.Equal` bilan constant-time bo'lishi kerak."},{"l":"S","t":"mcq","tp":"EDA","d":"msg","id":30078,"n":"SN79","q":"Event sxemasini o'zgartirish kerak: `amount` (int) → `money {amount, currency}`. Qanday?","o":["Darhol o'zgartirib deploy qilish","Yangi maydonni qo'shib, ikkisini ham to'ldirish (dual write) → consumer'lar yangisiga o'tadi → metrikada eski maydon o'qilmasligi tasdiqlanadi → eski maydon olib tashlanadi","Yangi topik yaratib eskisini tashlab yuborish","Schema registry'ni o'chirish"],"a":1,"e":"Event — kontrakt, deploy tartibi noma'lum: consumer'lar sizdan keyin ham eski kodda bo'lishi mumkin va retention tufayli eski eventlar qayta o'qiladi. Shuning uchun faqat qo'shimcha o'zgarish (backward compatible), migratsiya bosqichli, va schema registry'da compatibility rejimi (BACKWARD) majburiy. Eski maydonni o'chirish uchun retention oynasini ham kutish kerak."},{"l":"St","t":"mcq","tp":"EDA","d":"msg","id":30470,"n":"SN471","q":"Event sourcing'da snapshot va projection nima uchun kerak?","o":["Faqat tezlik uchun","Snapshot — agregat holatini N-eventdan keyin saqlash (yuklash butun tarixni o'qimasin); projection — o'qish modellari (read model) event oqimidan quriladi va mustaqil qayta qurilishi mumkin. Ikkisi ham event log'ni haqiqat manbasi sifatida saqlab, o'qishni amaliy qiladi","Snapshot eventlarni o'chiradi","Projection yozuv uchun"],"a":1,"e":"Operatsion nozikliklar: projection eventual consistent — UI 'yozdim lekin ro'yxatda yo'q' holatini boshqarishi kerak (o'z yozuvini optimistik ko'rsatish yoki kutish); projection'ni noldan qayta qurish vaqti o'lchanadi va reja bo'lishi kerak; event sxemasi versiyalanadi, chunki eski eventlar abadiy o'qiladi (upcasting)."},{"l":"S","t":"mcq","tp":"Integration","d":"msg","id":30471,"n":"SN472","q":"Tashqi tizimga integratsiyada anti-corruption layer (ACL) nima beradi?","o":["Xavfsizlik qatlami","Tashqi model va atamalarni o'z domen modeliga tarjima qiluvchi adapter: tashqi API o'zgarsa ta'sir bitta joyda qoladi, domain esa begona tushunchalar bilan ifloslanmaydi; test uchun ham chegarani beradi","Faqat kesh","API gateway bilan bir xil"],"a":1,"e":"Belgisi: agar domen kodida PSP yoki CRM maydonlari nomlari paydo bo'lsa (`stripe_customer_id` domen entity'sida) — ACL yo'q. To'g'ri: adapter tashqi javobni domen qiymat obyektlariga aylantiradi, xatolarni domen xatolariga xaritalaydi, va tashqi tizim o'zgarganda faqat adapter va uning testlari o'zgaradi."},{"l":"S","t":"mcq","tp":"EDA","d":"msg","id":30522,"n":"SN523","q":"Eventda qancha ma'lumot bo'lishi kerak — minimal yoki to'liq?","o":["Har doim minimal ID","Iste'molchi ehtiyojiga qarab, lekin qoida: event o'zi tushunarli bo'lsin (nima sodir bo'ldi, qachon, qaysi agregat, versiya) va ichki implementatsiya detallarini oqizmasin; to'liq holat yuborish consumer autonomiyasini oshiradi, lekin kontraktni kattalashtiradi va PII oqishi xavfini keltiradi","Butun DB qatorini yuborish","Faqat jadval nomi"],"a":1,"e":"Amaliy mezon: 'consumer bu eventni qayta ishlash uchun sizga qayta murojaat qilishi kerakmi?' — ha bo'lsa, ehtimol ma'lumot yetishmayapti. Lekin DB qatorini shundoq yuborish (CDC'ni public event sifatida) eng yomon variant: ichki sxema tashqi kontraktga aylanadi. O'rta yo'l — aniq loyihalangan domen eventi."},{"l":"St","t":"mcq","tp":"Integration","d":"msg","id":30523,"n":"SN524","q":"Uchinchi tomon API'si kuniga 10k so'rov limiti bor, sizga 50k kerak. Qanday hal qilasiz?","o":["Limitni e'tiborsiz qoldirish","Talabni kamaytirish: keshlash (TTL biznes talabiga qarab), batch endpointlar, faqat o'zgarganini so'rash (delta/webhook), prioritetlash (kritik so'rovlar limit ichida); qolganini navbatga qo'yib tekis taqsimlash (token bucket) va kerak bo'lsa shartnomani kengaytirish","Ko'p akkaunt ochish","Parallel so'rov yuborish"],"a":1,"e":"Texnik yechim ketma-ketligi: (1) so'rovlar profilini o'lchash — ko'pincha 70% takroriy; (2) kesh va dedupe (single-flight); (3) webhook/push bilan pull'ni almashtirish; (4) qolganini rate limiter bilan tekislash va navbat kutish vaqtini SLA sifatida ko'rsatish. Ko'p akkaunt — shartnoma buzilishi, texnik yechim emas."},{"l":"P","t"
