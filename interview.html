"JSON'da `PATCH` bilan maydonni `null` ga o'rnatish va maydonni yubormaslikni qanday ajratasiz (Go)?","o":["Ajratish kerak emas","Pointer (`*string`) yoki `json.RawMessage`/maxsus `Optional[T]` tur — `nil` pointer 'yuborilmagan', `pointer to nil`/mavjud kalit 'null ga o'rnat' degani; yoki JSON Merge Patch semantikasini aniq hujjatlashtirish","`omitempty` hal qiladi","Har doim to'liq PUT ishlatish"],"a":1,"e":"Oddiy struct bilan `\"\"` va 'yubormadi' farqlanmaydi — natijada PATCH tasodifan maydonni tozalaydi. Amaliy yechimlar: pointerlar, `map[string]json.RawMessage` bilan mavjud kalitlar to'plamini olish, yoki JSON Patch (RFC 6902) ishlatish. `omitempty` faqat serializatsiyaga ta'sir qiladi, deserializatsiyaga emas."},{"l":"S","t":"mcq","tp":"API gotcha","d":"api","id":30159,"n":"SN160","q":"Go'da JSON'ga katta `int64` ID yuborilgan, frontendda qiymat buzildi. Nega?","o":["Go bug'i","JavaScript `Number` — IEEE 754 double: 2^53 dan katta butun sonlar aniqligini yo'qotadi; ID'lar string sifatida yuborilishi kerak","JSON `int64`ni qo'llamaydi","Encoding muammosi"],"a":1,"e":"Snowflake uslubidagi 64-bit ID'lar aynan shu chegaradan oshadi va oxirgi raqamlar o'zgaradi — jim bug (noto'g'ri yozuv ochiladi). Shuning uchun API kontraktida ID string (`\"id\": \"7231...\"`), yoki `json:\",string\"` tegi. Xuddi shu muammo pul miqdorini float bilan yuborishda ham chiqadi."},{"l":"S","t":"mcq","tp":"API gotcha","d":"api","id":30160,"n":"SN161","q":"Go'da `json.Unmarshal` bilan validatsiya qilinmagan payload qanday xatarga olib keladi?","o":["Faqat xato qaytadi","Mass assignment: kutilmagan maydonlar (`is_admin`, `balance`) struct'ga tushadi va keyin DB'ga yoziladi; yechim — alohida DTO (faqat ruxsat etilgan maydonlar), `DisallowUnknownFields`, va domain darajasidagi validatsiya","Panic","Xotira oshadi faqat"],"a":1,"e":"ORM entity'sini to'g'ridan-to'g'ri request body'ga bind qilish — OWASP API ro'yxatidagi klassik zaiflik. To'g'ri qatlamlar: request DTO → validatsiya → domain obyektiga aniq maydonlar bilan o'girish. Bonus: `DisallowUnknownFields` client xatolarini erta ko'rsatadi, lekin forward compatibility'ni cheklaydi — public API'da ehtiyotkorlik bilan."},{"l":"S","t":"mcq","tp":"API gotcha","d":"api","id":30308,"n":"SN309","q":"JSON'da `PATCH` bilan maydonni `null` ga o'rnatish va maydonni yubormaslikni qanday ajratasiz (Go)?","o":["Ajratish kerak emas","Pointer (`*string`) yoki `json.RawMessage`/maxsus `Optional[T]` tur — `nil` pointer 'yuborilmagan', `pointer to nil`/mavjud kalit 'null ga o'rnat' degani; yoki JSON Merge Patch semantikasini aniq hujjatlashtirish","`omitempty` hal qiladi","Har doim to'liq PUT ishlatish"],"a":1,"e":"Oddiy struct bilan `\"\"` va 'yubormadi' farqlanmaydi — natijada PATCH tasodifan maydonni tozalaydi. Amaliy yechimlar: pointerlar, `map[string]json.RawMessage` bilan mavjud kalitlar to'plamini olish, yoki JSON Patch (RFC 6902) ishlatish. `omitempty` faqat serializatsiyaga ta'sir qiladi, deserializatsiyaga emas."},{"l":"S","t":"mcq","tp":"API gotcha","d":"api","id":30309,"n":"SN310","q":"Go'da JSON'ga katta `int64` ID yuborilgan, frontendda qiymat buzildi. Nega?","o":["Go bug'i","JavaScript `Number` — IEEE 754 double: 2^53 dan katta butun sonlar aniqligini yo'qotadi; ID'lar string sifatida yuborilishi kerak","JSON `int64`ni qo'llamaydi","Encoding muammosi"],"a":1,"e":"Snowflake uslubidagi 64-bit ID'lar aynan shu chegaradan oshadi va oxirgi raqamlar o'zgaradi — jim bug (noto'g'ri yozuv ochiladi). Shuning uchun API kontraktida ID string (`\"id\": \"7231...\"`), yoki `json:\",string\"` tegi. Xuddi shu muammo pul miqdorini float bilan yuborishda ham chiqadi."},{"l":"S","t":"mcq","tp":"API gotcha","d":"api","id":30310,"n":"SN311","q":"Go'da `json.Unmarshal` bilan validatsiya qilinmagan payload qanday xatarga olib keladi?","o":["Faqat xato qaytadi","Mass assignment: kutilmagan maydonlar (`is_admin`, `balance`) struct'ga tushadi va keyin DB'ga yoziladi; yechim — alohida DTO (faqat ruxsat etilgan maydonlar), `DisallowUnknownFields`, va domain darajasidagi validatsiya","Panic","Xotira oshadi faqat"],"a":1,"e":"ORM entity'sini to'g'ridan-to'g'ri request body'ga bind qilish — OWASP API ro'yxatidagi klassik zaiflik. To'g'ri qatlamlar: request DTO → validatsiya → domain obyektiga aniq maydonlar bilan o'girish. Bonus: `DisallowUnknownFields` client xatolarini erta ko'rsatadi, lekin forward compatibility'ni cheklaydi — public API'da ehtiyotkorlik bilan."},{"l":"S","t":"mcq","tp":"API gotcha","d":"api","id":30498,"n":"SN499","q":"Go'da `http.Get` bilan 404 kelganda `err` nil. Nega va nima qilish kerak?","o":["Bug","`err` faqat tarmoq/transport xatolarida to'ladi; HTTP status alohida tekshiriladi (`resp.StatusCode`). Ko'p kod 4xx/5xx ni muvaffaqiyat deb qabul qiladi va bo'sh/xato javobni parse qiladi","404 xato emas","`err` har doim to'ladi"],"a":1,"e":"To'g'ri client naqshi: status tekshirish, xato holatida body'ni o'qib (cheklangan hajmda) xato modeliga xaritalash, `defer resp.Body.Close()` va body'ni oxirigacha o'qib (yoki `io.Copy(io.Discard, ...)`) ulanishni poolga qaytarish. Retry qarori ham status bo'yicha: 5xx/429 — ha, 4xx — yo'q."},{"l":"S","t":"mcq","tp":"API gotcha","d":"api","id":30499,"n":"SN500","q":"REST API'da `PUT` bilan qisman yangilash qilinmoqda. Muammo?","o":["Muammo yo'q","`PUT` — to'liq almashtirish semantikasi: yuborilmagan maydonlar nolga tushishi kerak. Qisman yangilash `PATCH` bilan qilinadi; aralashtirilsa mijozlar maydonlarni tasodifan tozalaydi va idempotentlik kutilmasi buziladi","`PATCH` eskirgan","`PUT` faqat yaratish uchun"],"a":1,"e":"Amalda ko'p jamoa `PUT`ni 'merge' semantikasi bilan yozadi va buni hujjatlashtirmaydi — natijada eski clientlar yangi maydonlarni bilmay yuborishdan tashlab qo'yadi va ma'lumot yo'qoladi. Yechim: aniq semantika tanlash, hujjatlashtirish, va PATCH uchun JSON Merge Patch yoki JSON Patch standartini ishlatish."},{"l":"J","t":"mcq","tp":"Docker","d":"infra","id":2006,"n":"I7","q":"Konteyner va virtual mashina farqi?","o":["Konteyner o'z operatsion tizim yadrosini yuklaydi","Konteyner host yadrosini bo'lishadi va faqat jarayonni izolyatsiya qiladi (namespace, cgroup) — soniyalarda ishga tushadi, kam resurs; VM to'liq OS va yadro bilan, kuchliroq izolyatsiya","VM tezroq ishga tushadi","Farqi yo'q"],"a":1,"e":"Konteyner — o'ralgan jarayon, 'kichik VM' emas. Oqibatlari: yadro umumiy (security chegarasi zaifroq — shuning uchun ko'p tenantli muhitda gVisor/Firecracker), host yadrosiga bog'liqlik (Linux image Windows yadrosida ishlamaydi). Image — qatlamli fayl tizimi, konteyner esa shu image'dan ishga tushgan jarayon."},{"l":"J","t":"code","tp":"Docker","d":"infra","id":2007,"n":"I8","q":"Nega har kod o'zgarishida build 5 daqiqa ketadi? Tuzatish?","c":"FROM node:20\nWORKDIR /app\nCOPY . .\nRUN npm ci\nRUN npm run build\nCMD [\"node\", \"dist/main.js\"]","o":["npm sekin, chora yo'q","COPY . . hamma faylni oldin nusxalaydi — har o'zgarishda keyingi qatlamlar cache'dan tushadi. Avval package*.json ni COPY qilib npm ci ni bajarish, keyin qolgan kodni COPY qilish kerak","FROM ni o'zgartirish kerak","CMD ni ENTRYPOINT qilish kerak"],"a":1,"e":"Docker qatlamlarni keshlaydi: qatlam inputi o'zgarmasa qayta bajarilmaydi. To'g'ri tartib: kam o'zgaradigan narsa yuqorida. Yana: .dockerignore (node_modules, .git), multi-stage build bilan yakuniy image'da faqat dist va production bog'liqliklar, root bo'lmagan user, aniq versiyali base image (node:20.11-alpine, latest emas)."},{"l":"M","t":"mcq","tp":"Docker","d":"infra","id":2008,"n":"I9","q":"Production image hajmini kamaytirishning eng samarali yo'li?","o":["Fayllarni gzip qilish","Multi-stage build: builder bosqichida kompilyatsiya, yakuniy bosqichga faqat artefakt ko'chiriladi (build toollari, dev bog'liqliklar, cache qolmaydi)","RUN buyruqlarini ko'paytirish","Image'ni tez-tez qayta build qilish"],"a":1,"e":"Katta image — sekin deploy, sekin autoscaling, katta hujum yuzasi. Qo'shimcha: slim/alpine yoki distroless base, RUN'larni birlashtirib cache'ni o'chirish (apt-get clean), .dockerignore. Go uchun yakuniy image scratch/distroless'da bir necha MB bo'lishi mumkin."},{"l":"M","t":"mcq","tp":"Kubernetes","d":"infra","id":2009,"n":"I10","q":"Liveness va readiness probe farqi?","o":["Bir xil, ikkita nom","Readiness — pod trafik qabul qilishga tayyormi (tayyor bo'lmasa Service'dan chiqariladi); Liveness — jarayon osilib qolganmi (fail bo'lsa konteyner qayta ishga tushiriladi)","Liveness faqat startda ishlaydi","Readiness podni o'chiradi"],"a":1,"e":"Tipik xato: liveness probe'ni DB'ga bog'lash — DB bir daqiqa sekinlashса, Kubernetes hamma podlarni restart qilib incidentni kuchaytiradi. Qoida: liveness faqat 'jarayon tirikmi' (yengil, bog'liqliksiz), readiness bog'liqliklarni tekshirishi mumkin. Sekin startlar uchun startupProbe."},{"l":"M","t":"code","tp":"Kubernetes","d":"infra","id":2010,"n":"I11","q":"Pod tez-tez OOMKilled bo'lyapti va latency sakrayapti. Bu manifestda nima muammo?","c":"resources:\n  requests:\n    cpu: \"2\"\n    memory: \"2Gi\"\n  limits:\n    cpu: \"2\"\n    memory: \"256Mi\"","o":["Hech qanday muammo yo'q","memory limit (256Mi) request'dan (2Gi) kichik — konteyner limitga yetib OOMKill bo'ladi; CPU limit = request bo'lsa ham throttling bo'lishi mumkin. Memory limit ≈ request qilib real o'lchangan qiymatga qo'yish kerak","CPU juda kam","requests olib tashlash kerak"],"a":1,"e":"CPU — siqiladigan resurs: limitdan oshsa throttle (sekinlashadi). Memory — siqilmaydi: limitdan oshsa OOMKill. Amaliyot: memory request = limit (Guaranteed QoS), CPU request qo'yib limitni ko'pincha qo'ymaslik (throttling'dan qochish). Qiymatlarni taxmin emas, real profil (VPA yoki metrika) asosida."},{"l":"S","t":"mcq","tp":"Kubernetes","d":"infra","id":2011,"n":"I12","q":"Rolling update paytida qisqa uzilishlar bo'lyapti. Qaysi to'plam buni yopadi?","o":["replicas sonini oshirish","readinessProbe (tayyor bo'lmaguncha trafik yo'q) + preStop hook va graceful shutdown (SIGTERM'da joriy query'larni tugatish) + maxUnavailable: 0 + PodDisruptionBudget","Faqat maxSurge: 5","livenessProbe'ni o'chirish"],"a":1,"e":"Uzilishning ikki sababi: 1) yangi pod tayyor bo'lmasdan trafik oldi (readiness yo'q), 2) eski pod query o'rtasida o'ldirildi (graceful shutdown yo'q). PDB node drain/cluster upgrade paytida bir vaqtda qancha pod yo'qolishini cheklaydi. terminationGracePeriodSeconds shutdown vaqtidan katta bo'lsin."},{"l":"S","t":"open","tp":"Kubernetes","d":"infra","id":2012,"n":"I13","q":"Deployment va StatefulSet farqi? Postgres'ni Kubernetes'da ishlatasizmi?","m":["Deployment — o'zaro almashinadigan (stateless) podlar, tasodifiy nom, umumiy yoki hech qanday volume","StatefulSet — barqaror nom (db-0, db-1), har podga o'z PersistentVolume'i, tartibli ishga tushish/o'chish","Stateful workload: storage tezligi, failover, backup, versiya yangilash — hammasi o'zingizda","Amaliy qaror: jamoada Kubernetes operator tajribasi bo'lmasa — managed DB (RDS/Cloud SQL)","Ishlatilsa — yetuk operator (CloudNativePG, Zalando), tekshirilgan backup va failover mashqlari"],"e":"Senior javob: 'mumkin, lekin kerakmi?' Konteyner DB'ni sekinlashtirmaydi — murakkablik operatsiyada. Test/dev muhit uchun — bemalol."},{"l":"S","t":"mcq","tp":"Kubernetes","d":"infra","id":30025,"n":"SN26","q":"Go servis podda deploy paytida 5xx beradi, keyin tinchiydi. Eng ehtimolli sabab va yechim?","o":["CPU limit kichik","Pod Service endpoint'iga qo'shilgan, lekin `readinessProbe` hali tayyor emasligini bildirmaydi; yoki eski pod SIGTERM olgach darhol yopilib, LB hali uni ro'yxatdan chiqarmagan","Image juda katta","DNS ishlamayapti"],"a":1,"e":"Ikki tomonli muammo: (1) start — readiness probe haqiqiy dependency tayyorligini (DB pool, migratsiya, kesh warm) tekshirishi kerak; (2) stop — `preStop` sleep (5-15s) + graceful shutdown: SIGTERM'da yangi ulanish qabul qilinmaydi, mavjudlari tugatiladi, `terminationGracePeriodSeconds` shundan katta. Endpoint propagatsiyasi asinxron — shuning uchun sleep kerak."},{"l":"S","t":"mcq","tp":"Kubernetes","d":"infra","id":30026,"n":"SN27","q":"Go servisga `limits.memory: 512Mi` qo'yilgan, OOMKilled bo'lyapti. To'g'ri chora?","o":["Limitni ikki barobar oshirish va tinchlanish","`GOMEMLIMIT` (yoki GC tuning) limitdan ~20% pastga qo'yish — GC heap o'sishini cheklaydi; bundan tashqari haqiqiy profil (pprof heap) bilan leak/ katta bufferlarni tekshirish","GOGC=off","GC'ni qo'lda `runtime.GC()` chaqirish"],"a":1,"e":"Go GC default soft limitni bilmaydi: heap 2x o'sib limitdan oshadi va cgroup OOM killer o'ldiradi (Go panic ham bermaydi). `GOMEMLIMIT=400MiB` soft limit — GC agressivlashadi. `GOGC` bilan birga ishlatiladi. Ustiga `GOMAXPROCS` CPU limitga moslanishi kerak (automaxprocs), aks holda throttling va latency."},{"l":"S","t":"mcq","tp":"Kubernetes","d":"infra","id":30027,"n":"SN28","q":"CPU `limits` qo'yilgan podda p99 latency portlaydi, CPU ishlatish esa 40%. Sabab?","o":["Node sekin","CFS quota throttling: 100ms period ichida kvota tugab, qolgan vaqt pod to'xtatiladi (burst yuklamada). `cpu.throttled` metrikasi ko'rsatadi","Memory yetishmaydi","Network MTU"],"a":1,"e":"O'rtacha ishlatish past bo'lishi mumkin, lekin burst paytda kvota tugaydi. Yechimlar: limitni oshirish yoki latency-sezgir servisda CPU limitni olib tashlash (faqat `requests` + to'g'ri sizing), GOMAXPROCS'ni kvotaga moslash, goroutine parallelizmini kamaytirish. `container_cpu_cfs_throttled_seconds_total` — asosiy dalil."},{"l":"St","t":"mcq","tp":"Kubernetes","d":"infra","id":30028,"n":"SN29","q":"HPA CPU bo'yicha skale qiladi, lekin Kafka consumer lag o'sib ketyapti. To'g'ri yondashuv?","o":["CPU target'ni 30% qilish","Custom/external metrika bo'yicha skale (KEDA — consumer group lag); parallelizm partition soni bilan cheklanganini hisobga olish","Replicani qo'lda 50 ga chiqarish","HPA'ni o'chirib qo'yish"],"a":1,"e":"Consumer I/O'ga bog'liq bo'lishi mumkin — CPU signal bermaydi. KEDA lag'ni to'g'ridan-to'g'ri o'qib skale qiladi. Muhim cheklov: consumer'lar soni partition sonidan oshsa foyda yo'q (ortiqchasi bo'sh turadi) — demak partition soni oldindan rejalashtiriladi va rebalance narxi (stop-the-world) hisobga olinadi."},{"l":"S","t":"mcq","tp":"Docker","d":"infra","id":30029,"n":"SN30","q":"Go servis uchun production image: qaysi qurilish to'g'ri?","o":["`FROM golang:1.22` va shu image'da ishga tushirish","Multi-stage: build stage'da kompilyatsiya (`CGO_ENABLED=0`, `-trimpath`, ldflags bilan versiya), runtime — `distroless`/`scratch`, nonroot user, read-only rootfs","Alpine + `apk add` barcha vositalar","Ubuntu + kompilyator qoldirish"],"a":1,"e":"Toolchain'li image: 1GB+ hajm, ko'p CVE, ichida kompilyator va shell — hujum yuzasi. Distroless/scratch bilan bir necha o'n MB. Eslatmalar: `scratch`da TLS uchun `ca-certificates` va zone ma'lumotlari ko'chiriladi, `CGO_ENABLED=0` static bo'lishi uchun, layer keshi uchun `go mod download` alohida qatlamda."},{"l":"S","t":"mcq","tp":"Kubernetes","d":"infra","id":30261,"n":"SN262","q":"`requests` va `limits` farqi va QoS klasslariga ta'siri?","o":["Bir xil narsa","`requests` — rejalashtirish uchun kafolatlangan minimal (scheduler shunga qaraydi), `limits` — maksimal chegara (CPU'da throttling, xotirada OOMKill). Guaranteed (requests=limits) eviction'da oxirgi, Burstable o'rtada, BestEffort (hech narsa qo'yilmagan) birinchi chiqariladi","`limits` rejalashtiradi","QoS yo'q"],"a":1,"e":"Amaliy siyosat: xotirada `requests = limits` (Guaranteed) — chunki xotira siqilmaydigan resurs va OOM keladi; CPU'da `requests` aniq, `limits` ehtiyotkorlik bilan (latency-sezgir servisda throttling zarar qiladi). Klaster sig'imini rejalashtirishda `requests` yig'indisi muhim, `limits` esa overcommit darajasini belgilaydi."},{"l":"S","t":"mcq","tp":"Kubernetes","d":"infra","id":30262,"n":"SN263","q":"`livenessProbe` va `readinessProbe` ni noto'g'ri sozlash qanday incident keltiradi?","o":["Hech qanday","Liveness DB'ga bog'liq qilinsa: DB sekinlashganda barcha podlar qayta ishga tushadi va vaziyat yomonlashadi (restart bo'roni). Readiness esa dependency'ga bog'liq bo'lishi mumkin — pod trafikdan chiqadi lekin o'ldirilmaydi","Probe'lar keraksiz","Faqat startup muhim"],"a":1,"e":"Qoida: liveness — 'jarayon o'zini tiklay olmaydigan holatda qotib qoldimi' (deadlock) uchun, faqat mahalliy tekshiruv; readiness — 'hozir trafik qabul qila olamanmi'; startupProbe — sekin ishga tushish uchun (liveness'ni erta o'ldirmasligi uchun). `failureThreshold` va `periodSeconds` real ish vaqtiga moslanadi."},{"l":"St","t":"mcq","tp":"Kubernetes","d":"infra","id":30263,"n":"SN264","q":"Deploy paytida 100% mavjudlikni saqlash uchun qaysi obyektlar birga kerak?","o":["Faqat `Deployment` yetarli","RollingUpdate strategiyasi (`maxUnavailable: 0`, `maxSurge`), to'g'ri readiness probe, `preStop` + graceful shutdown, `PodDisruptionBudget` (node drain'da), bir necha replica va `topologySpreadConstraints` (AZ/node bo'ylab)","Faqat PDB","Faqat replica soni"],"a":1,"e":"PDB ayniqsa muhim: klaster avtoskaler yoki node yangilanishi bir vaqtda ko'p podni chiqarib tashlamasligi uchun. `maxUnavailable: 0` bilan yangi pod tayyor bo'lgach eskisi o'chadi. Bularsiz 'rolling update' amalda qisqa downtime yoki 5xx to'lqini beradi — eng ko'p uchraydigan 'sababsiz xatolar' manbasi."},{"l":"St","t":"mcq","tp":"Kubernetes","d":"infra","id":30447,"n":"SN448","q":"Service trafikni podlarga qanday yetkazadi (kube-proxy)?","o":["DNS orqali to'g'ridan-to'g'ri","iptables rejimida har Service uchun NAT qoidalari yoziladi va tasodifiy pod tanlanadi (qoidalar soni o'sganda yangilanish sekinlashadi); IPVS rejimida yadro ichidagi yuk balansirovkasi (O(1) qidiruv, bir necha algoritm); eBPF (Cilium) esa kube-proxy'ni butunlay almashtiradi","Faqat Ingress orqali","Har so'rov API serverga boradi"],"a":1,"e":"Amaliy oqibatlar: iptables rejimida minglab Service bo'lsa qoidalarni yangilash sekundlarga cho'ziladi (endpoint o'zgarishi kech yetadi — deploy paytida 5xx); IPVS/eBPF kattaroq klasterlarda barqarorroq. Balansirovka L4 darajasida — HTTP/2/gRPC uchun yetarli emas (ulanish darajasida taqsimlanadi), shuning uchun client-side LB yoki mesh kerak."},{"l":"S","t":"mcq","tp":"Kubernetes","d":"infra","id":30448,"n":"SN449","q":"Service mesh (sidecar) qanday narxga ega va qachon oqlanadi?","o":["Narxsiz, har doim kerak","Har podda qo'shimcha proxy: latency (~0.5-2ms har hop), CPU/xotira, va operatsion murakkablik (versiya, sertifikat, debugging); oqlanadi — mTLS, yagona retry/timeout/circuit breaker siyosati, L7 balansirovka va batafsil telemetriya ko'p tilli o'nlab servislarda kerak bo'lsa","Faqat Istio bilan","Mesh latency'ni kamaytiradi"],"a":1,"e":"Kichik tizimda (3-5 servis, bitta til) kutubxona darajasidagi yechim (gRPC interceptor + OTel) arzonroq va shaffofroq. Mesh'ning haqiqiy qiymati — siyosatni koddan ajratish va ko'p jamoada bir xil xatti-harakat. Sidecarsiz variantlar (ambient mesh, eBPF) narxni kamaytiradi, lekin yetuklik darajasi tekshirilishi kerak."},{"l":"J","t":"mcq","tp":"CI/CD","d":"infra","id":2013,"n":"I14","q":"Continuous Integration nimani anglatadi?","o":["Kodni haftada bir marta merge qilish","Har commit/PR avtomatik build va testdan o'tadi, kod tez-tez (kuniga) asosiy branchga qo'shiladi — integratsiya muammolari kechikmaydi","Serverga avtomatik deploy","Faqat testlarni yozish"],"a":1,"e":"CI — branch uzoq yashamasligi haqida. CD ikki ma'noda: Continuous Delivery (har build deploy qilishga tayyor, tugma bosiladi) va Continuous Deployment (avtomatik production'ga). Uzoq feature branch — merge do'zaxi; yechim: kichik PR + feature flag."},{"l":"M","t":"mcq","tp":"Deploy","d":"infra","id":2014,"n":"I15","q":"Blue-green va canary deploy farqi?","o":["Bir xil","Blue-green: ikkita to'liq muhit, trafik bir zumda yangisiga o'tadi (rollback — tezda qaytarish). Canary: yangi versiyaga trafikning kichik qismi (1–5%) beriladi, metrikalar kuzatilib asta oshiriladi","Canary faqat test muhitida","Blue-green rollback imkonsiz"],"a":1,"e":"Blue-green: tez rollback, lekin xato hamma userga birdan tegadi; ikki barobar resurs. Canary: xato ta'siri kichik, lekin trafik bo'lish mexanizmi va avtomatik metrika tahlili kerak; ikki versiya birga ishlaydi — DB sxemasi ikkalasiga mos bo'lishi shart (expand-contract). Uchinchisi — rolling update (Kubernetes default)."},{"l":"M","t":"open","tp":"Secrets","d":"infra","id":2015,"n":"I16","q":"Parol, API key va sertifikatlarni qanday boshqarasiz?","m":["Git'da hech qachon — hatto private repoda ham (tarixda qoladi); .gitignore + pre-commit scanner (gitleaks)","Markazlashgan secret store: Vault, AWS Secrets Manager, GCP Secret Manager","Kubernetes Secret — default'da faqat base64, shifrlanmagan: etcd encryption yoki External Secrets operator","Ilovaga yetkazish: env yoki mount; CI logida chop etilmasligi","Rotatsiya: muddat, avtomatik yangilash, sizib chiqqanda revoke tartibi (runbook)","Har muhit (dev/stage/prod) uchun alohida key; eng kam huquq prinsipi"],"e":"Amaliy signal: 'git'ga tushib qolsa nima qilasiz?' — javob: darhol revoke/rotate, keyin tarixni tozalash (tozalash yetarli emas, key allaqachon ochiq)."},{"l":"S","t":"mcq","tp":"Deploy","d":"infra","id":2016,"n":"I17","q":"Qaysi yondashuv to'g'ri: artefakt va muhitlar haqida?","o":["Har muhit uchun alohida build qilish (dev, stage, prod)","Bir marta build qilib, o'sha immutable artefaktni (image digest bilan) hamma muhitdan o'tkazish; farq faqat konfiguratsiyada (env, secret)","Production'da to'g'ridan-to'g'ri kompilyatsiya qilish","latest tegidan foydalanish"],"a":1,"e":"Build once, deploy many: stage'da test qilingan narsa aynan prod'ga boradi. latest — aniqlikni yo'qotadi (qaysi kod ishlayotgani noma'lum, rollback qiyin); digest yoki semantik versiya bilan teglang. Konfiguratsiya image ichida emas, tashqarida (12-factor)."},{"l":"S","t":"open","tp":"Deploy","d":"infra","id":2017,"n":"I18","q":"DB migratsiyasi deploy pipeline'ining qaysi qadamida bajarilishi kerak?","m":["Migratsiya deploy'dan oldin, orqaga mos (backward compatible) holda — eski kod ham ishlashi kerak","Ikki versiya deploy vaqtida birga ishlaydi (rolling, canary) — bu asosiy cheklov","Expand-contract: column qo'shish → ikkala kod ishlaydi → eski kod chiqib ketgach tozalash (alohida release)","Uzoq migratsiya (backfill, index) deploy'dan ajratilgan job sifatida, batch va throttling bilan","Har migratsiyaga rollback rejasi; ma'lumot o'chiradigan qadamni kechiktirish","lock_timeout va statement_timeout qo'yish"],"e":"Senior signal: 'migratsiya va kod deploy'i bir atomik qadam emas' degan tushuncha. Ma'lumot o'chirish (DROP COLUMN) odatda bir necha kun/hafta keyin, kuzatuvdan so'ng."},{"l":"St","t":"mcq","tp":"CI/CD","d":"infra","id":2018,"n":"I19","q":"Katta feature'ni uzoq branchda emas, feature flag bilan qilishning asosiy afzalligi?","o":["Kod tozaroq bo'ladi","Kod kichik bo'laklarda main'ga tushadi (merge konflikt kam), release deploy'dan ajraladi: yoqish/o'chirish bir zumda, canary va A/B imkoniyati","Testlar kerak emas","Rollback kerak emas"],"a":1,"e":"Narxi: flaglar texnik qarz — muddati o'tganini o'chirish tartibi bo'lishi kerak, aks holda kodda o'nlab shart qoladi. Kill switch sifatida ham qimmatli: incidentda deploy'siz o'chirish. Flag holati kuzatiladigan va audit qilinadigan bo'lsin."},{"l":"St","t":"open","tp":"Deploy","d":"infra","id":14018,"n":"SR19","q":"Feature flag tizimini va bosqichli rollout jarayonini loyihalang.","m":["Flag turlari: release (vaqtinchalik), operatsion (kill switch), eksperiment (A/B), ruxsat (entitlement)","Baholash: client SDK lokal keshda, markaziy konfiguratsiya push/pull bilan; baholash determinantik (user id hash) bo'lsin","Bosqichlar: ichki → 1% → 10% → 50% → 100%, har bosqichda metrikani kuzatish va avtomatik to'xtash","Xavfsizlik: flag o'zgarishi audit qilinadi, prod uchun ruxsat cheklangan, kill switch tezda ishlaydi","Texnik qarz: har flagga muddat va egasi; eskirganlarini o'chirish jarayoni","Test: ikkala holat uchun ham test; flaglar kombinatsiyasi portlamasligi uchun ularni kam tutish"],"e":"Staff signal: flagni release vositasi sifatida emas, xavfni boshqarish tizimi sifatida ko'rish va texnik qarzni boshqarish rejasini aytish."},{"l":"S","t":"mcq","tp":"Deploy","d":"infra","id":30030,"n":"SN31","q":"Sxema o'zgarishi bo'lgan relizni zero-downtime chiqarish tartibi?","o":["Migratsiya va kodni bir vaqtda deploy qilish","Expand-contract: (1) qo'shimcha qo'shish (nullable kolonka, yangi index concurrently), (2) kod ikki formatni ham o'qiy/yoza oladigan holatda deploy, (3) backfill, (4) keyingi relizda eski ustunni olib tashlash","Avval eski kolonkani o'chirib keyin kod chiqarish","Downtime oynasi olish har doim"],"a":1,"e":"Rolling deploy paytida eski va yangi kod bir vaqtda ishlaydi — sxema ikkisiga ham mos bo'lishi shart (backward + forward compatible). PostgreSQL detallari: `CREATE INDEX CONCURRENTLY`, `ADD COLUMN` default bilan 11+ da tez, `NOT NULL`ni bosqichma-bosqich (CHECK NOT VALID → VALIDATE), uzun migratsiyalarga `lock_timeout` qo'yish."},{"l":"S","t":"mcq","tp":"CI/CD","d":"infra","id":30031,"n":"SN32","q":"Canary deploy qachon avtomatik rollback qilinishi kerak?","o":["Faqat pod crash bo'lsa","Canary va baseline'ni bir vaqtda solishtiruvchi SLO signal (xato nisbati, p99 latency, biznes metrika) belgilangan chegaradan oshsa — avtomatik abort","Muhandis qo'lda qaraganida","Bir soatdan keyin"],"a":1,"e":"To'g'ri canary — statistik taqqoslash (baseline vs canary bir xil trafik shartida), mutlaq threshold emas. Argo Rollouts/Flagger shu analizni qiladi. Shart: metrikalar versiya yorlig'i bilan ajratilgan bo'lishi, qaror oynasi yetarli trafik yig'ishi, va rollback yo'li migratsiya bilan ham xavfsiz (shu sabab expand-contract)."},{"l":"S","t":"mcq","tp":"CI/CD","d":"infra","id":30032,"n":"SN33","q":"Feature flag va deploy ajratilishi nimani beradi?","o":["Hech narsa, faqat kod murakkablashadi","Deploy (kod chiqishi) va release (foydalanuvchiga yoqilishi) alohida bo'ladi: rollback sekundda, progressiv yoyish, A/B, va kill switch incident paytida","Testni almashtiradi","Migratsiyani keraksiz qiladi"],"a":1,"e":"Trunk-based development'ning kaliti. Narxi: flag qarzi — har flag uchun ega, muddat va tozalash rejasi kerak, aks holda kod branch portlashiga aylanadi. Kritik yo'nalishlarda flag o'qish default xavfsiz qiymat bilan (provider ishlamasa ham servis ishlaydi) va flag holati log/trace'ga yozilishi kerak."},{"l":"S","t":"mcq","tp":"Secrets","d":"infra","id":30033,"n":"SN34","q":"Kubernetes'da sirlar: qaysi variant eng mustahkam?","o":["`Secret` obyektida base64, git'ga commit","Tashqi secret manager (Vault/KMS) + qisqa TTL dinamik credential yoki CSI driver bilan mount; git'da faqat shifrlangan (SOPS/sealed-secrets) ma'lumot","ConfigMap'da saqlash","Env'ga Dockerfile'da yozish"],"a":1,"e":"K8s `Secret` default holatda etcd'da faqat base64 (shifrlanmagan, agar encryption-at-rest yoqilmagan bo'lsa) va RBAC noto'g'ri bo'lsa o'qiladi. Eng yaxshisi: DB uchun dinamik, qisqa muddatli credential (Vault) — leak bo'lsa ham tez o'lik; aks holda KMS bilan shifrlash, avtomatik rotation, va audit. Sirlar log'da va crash dump'da chiqmasligi tekshiriladi."},{"l":"St","t":"open","tp":"CI/CD","d":"infra","id":30034,"n":"SN35","q":"CI 40 daqiqa ketadi, jamoa relizdan qo'rqadi. Qanday tuzatasiz?","m":["O'lchash: qaysi step qancha vaqt oladi (build, test, image, e2e) — taxmin emas, timing hisoboti","Test piramidasi: ko'p unit (parallel, tez), kamroq integration (testcontainers), juda kam e2e (faqat kritik yo'l)","Keshlash: Go build cache va modul kesh, Docker layer kesh (buildkit + registry cache), o'zgarmagan modul testini o'tkazib yuborish (affected-only, monorepo'da)","Parallellik: test shardlari, `go test -p`, flaky testlarni ajratib karantin qilish (flaky = ishonchsizlik = qo'rquv)","Pipeline bosqichlari: PR'da tez signal (lint+unit ~5 min), merge'dan keyin uzunlari; deploy alohida","Natijani kuzatish: DORA metrikalari — lead time, deploy chastotasi, change failure rate"],"e":"Relizdan qo'rqish odatda sekin CI + flaky test + og'riqli rollback kombinatsiyasi. Uchtasi ham alohida hal qilinadi; faqat CI tezlashtirish yetmaydi."},{"l":"S","t":"mcq","tp":"Deploy","d":"infra","id":30264,"n":"SN265","q":"Blue-green va canary orasidagi tanlov nimaga bog'liq?","o":["Faqat narxga","Blue-green: to'liq ikkinchi muhit, bir zumda almashtirish va tez rollback — lekin ikki barobar resurs va DB sxemasi ikkisiga mos bo'lishi kerak; canary: trafikning kichik ulushi bilan real signal yig'ish — sekinroq, lekin xatarni ancha kamaytiradi va metrika asosida avtomatlashtiriladi","Blue-green har doim yaxshi","Canary rollback qilmaydi"],"a":1,"e":"Amalda ko'pincha canary tanlanadi, chunki bug faqat real trafikda ko'rinadi. Ikkisida ham asosiy cheklov — ma'lumot qatlami: sxema o'zgarishi expand-contract bilan qilinmasa rollback imkonsiz bo'ladi. Stateful servislarda (navbat consumer'lari) trafikni bo'lish qiyin, shuning uchun feature flag bilan boshqarish afzal."},{"l":"S","t":"mcq","tp":"Secrets","d":"infra","id":30265,"n":"SN266","q":"CI pipeline'da sirlar bilan ishlashda nima majburiy?","o":["Repo'dagi `.env` fayl","Qisqa muddatli credential (OIDC bilan cloud'ga federatsiya — statik kalit yo'q), sirlarni faqat kerakli step'da ko'rsatish, log'da maskalash, fork PR'lardan sirlarni yashirish, va secret scanning (pre-commit + CI)","Faqat maskalash","Sirlarni env'ga global qo'yish"],"a":1,"e":"OIDC federatsiyasi (GitHub Actions → AWS/GCP) eng katta yutuq: uzoq yashovchi kalit umuman bo'lmaydi. Qo'shimcha xatarlar: PR'dan kelgan kod sirni chiqarib yuborishi (`pull_request_target` tuzog'i), artefaktlarda qolgan sirlar, va build log'lari. Sir aniqlansa rotation protsedurasi oldindan yozilgan bo'lishi kerak."},{"l":"St","t":"mcq","tp":"CI/CD","d":"infra","id":30477,"n":"SN478","q":"Build reproducibility (takrorlanuvchanlik) nega muhim?","o":["Faqat akademik masala","Bir xil manba bir xil artefakt bersa: keshlash ishonchli, supply chain hujumini aniqlash mumkin (qayta qurib solishtirish), va 'productionda qaysi kod ishlayapti' savoliga aniq javob bo'ladi. Go'da `-trimpath`, qotirilgan versiyalar, va build metadata shu maqsadda","Faqat Nix'da mumkin","Docker o'zi ta'minlaydi"],"a":1,"e":"Amaliy minimum: image tag sifatida commit SHA (mutable `latest` emas), `go.sum` bilan qotirilgan bog'liqliklar, bazaviy image digest bo'yicha (`@sha256:...`), va artefakt imzosi (cosign) + SBOM. Shunda incident paytida 'qaysi kod, qaysi bog'liqliklar' savoli sekundlarda javob topadi."},{"l":"P","t":"mcq","tp":"SRE","d":"infra","id":1025,"n":"B26","q":"SLO 99.9% (oylik), error budget tugadi. Yetuk tashkilot nima qiladi?","o":["SLOni 99% ga tushiradi","Oldindan kelishilgan siyosat bo'yicha: yangi feature release'lar muzlatiladi, jamoa reliability ishiga o'tadi, budget tiklangach davom etadi","Hech narsa — SLO shunchaki raqam","On-call muhandisni jazolaydi"],"a":1,"e":"99.9% ≈ oyiga 43 daqiqa. Error budget — tezlik va ishonchlilik o'rtasidagi kelishuv; ma'no faqat oqibat bo'lganda. SLO userga ko'rinadigan SLI'ga (success'li query'lar %, p99 latency) asoslanadi, CPU'ga emas."},{"l":"P","t":"open","tp":"SRE","d":"infra","id":1028,"n":"B29","q":"Tashkilot bo'ylab backend servislar sifatini qanday oshirasiz (50+ jamoa)?","m":["Paved road: standart servis shabloni — logging, tracing, metrikalar, health check, graceful shutdown tayyor","Production readiness checklist va avtomatik tekshiruvlar (CI)","SLO va on-call egalik har jamoada; blameless postmortem, takrorlanuvchi sabablar tahlili","Platforma jamoasi mahsulot sifatida — ichki mijozlar fikri","Metrikalar: DORA (deploy chastotasi, lead time, change failure rate, MTTR)"],"e":"Principal javob — texnologiya emas, tizim: to'g'ri yo'lni eng oson yo'lga aylantirish va natijani o'lchash."},{"l":"J","t":"mcq","tp":"Logging","d":"infra","id":2019,"n":"I20","q":"Log, metrika va trace farqi?","o":["Uchalasi bir xil ma'lumot","Log — alohida hodisa yozuvi (nima bo'ldi, kontekst bilan); metrika — vaqt bo'yicha agregat son (RPS, latency, xatolar %); trace — bitta query'ning servislar bo'ylab yo'li va har qadamning vaqti","Metrika faqat CPU uchun","Trace — bu log fayli"],"a":1,"e":"Ishlatish tartibi: metrika 'muammo bor va qayerda' (alert), trace 'qaysi qadam sekin', log 'aniq nima bo'ldi'. Metrika arzon va agregat; log qimmat (hajm); trace odatda sampling bilan. Uchalasini bog'lovchi element — trace_id."},{"l":"M","t":"mcq","tp":"Logging","d":"infra","id":2020,"n":"I21","q":"Mikroservislarda loglarni tekshirishni haqiqatan osonlashtiradigan narsa?","o":["Har servisda o'z fayl formatida yozish","Strukturaviy (JSON) log + har query'ga trace_id/correlation_id berib, uni hamma servisga header orqali uzatish; markaziy log tizimi","Ko'proq log yozish","Faqat xatolarni loglash"],"a":1,"e":"Bitta query 6 ta servisdan o'tadi — trace_id'siz ularni bog'lab bo'lmaydi. Har logda: trace_id, service, level, user/tenant id (PII'siz), xabar. Qo'shimcha: sampling va log level'si (debugni prodda yoqmaslik), maxfiy ma'lumotni maskalash, saqlash muddati va narxi."},{"l":"M","t":"code","tp":"Tracing","d":"infra","id":2021,"n":"I22","q":"Trace servis chegarasida uzilib qolyapti (har servis alohida trace ko'rsatadi). Sabab?","c":"// A servis\nspan = tracer.start_span(\"call_b\")\nresp = http.get(\"http://b/api/items\")   # header yo'q\nspan.end()","o":["B servisda tracing yoqilmagan","Trace konteksti (traceparent header) uzatilmagan — HTTP client'ga propagation qo'shish kerak (instrumented client yoki inject(headers))","Span nomi noto'g'ri","Sampling 0 ga teng"],"a":1,"e":"Distributed tracing — kontekstni uzatishga asoslangan (W3C traceparent). OpenTelemetry auto-instrumentation buni ko'pincha o'zi qiladi, lekin qo'lda yozilgan client, message queue (headerni xabar atributiga qo'yish) va async ish (goroutine/thread) — tipik uzilish nuqtalari."},{"l":"S","t":"mcq","tp":"Metrics","d":"infra","id":2022,"n":"I23","q":"Servis uchun qaysi to'plam asosiy metrika sifatida eng foydali (RED metodikasi)?","o":["CPU, RAM, disk","Rate (query/s), Errors (xato %), Duration (latency taqsimoti: p50/p95/p99)","Faqat o'rtacha javob vaqti","Log row'lari soni"],"a":1,"e":"RED — servis uchun (userga ko'rinadigan), USE (Utilization, Saturation, Errors) — resurs uchun. O'rtacha latency yashiradi: 100 ta query'dan 99 tasi 10ms, bittasi 5s bo'lsa o'rtacha 60ms — 'yaxshi', lekin p99 5s. Shuning uchun persentil va histogram; SLO ham persentilga qo'yiladi."},{"l":"S","t":"open","tp":"Alerting","d":"infra","id":2023,"n":"I24","q":"Alertlar juda ko'p, jamoa ularga e'tibor bermay qo'ydi. Nima qilasiz?","m":["Symptom-based alert: user his qiladigan narsa (xato %, latency, SLO burn rate) — sabab-based (CPU 80%) emas","Har alert harakat talab qilishi shart: harakat yo'q bo'lsa — dashboard yoki ticket, page emas","SLO va error budget burn rate bo'yicha ko'p tezlikli alert (tez yonish — darhol, sekin — ish vaqtida)","Shovqinlarni o'lchash: har alert bo'yicha 'foydali/bekor' statistikasi, muntazam tozalash","Har page uchun runbook havolasi; takrorlanuvchi alertlarni avtomatlashtirish","O'chirish/ta'mirlash oynasi (maintenance window), flapping uchun 'for' davri"],"e":"Senior/Staff signal: alert charchashi — texnik emas, jarayon muammosi. O'lchov: haftada nechta page, nechtasi harakatga olib keldi."},{"l":"St","t":"open","tp":"Metrics","d":"infra","id":2024,"n":"I25","q":"Metrika tizimi hisobi keskin oshdi (kardinallik portlashi). Sabab va yechim?","m":["Har label kombinatsiyasi — alohida vaqt row'i; user_id, email, URL yo'li, trace_id kabi labellar millionlab row yaratadi","Yechim: yuqori kardinallikdagi labellarni olib tashlash yoki bucketlash (/users/123 → /users/:id)","Bunday tafsilot metrikada emas, log/trace'da (exemplar bilan bog'lash)","Saqlash muddati va agregatsiya (downsampling) siyosati","Kardinallik limiti va monitoring: eng ko'p row yaratayotgan metrikani kuzatish"],"e":"Staff signal: observability xarajatini mahsulot xarajati sifatida boshqarish — qaysi signal qancha turadi va qancha qiymat beradi."},{"l":"S","t":"mcq","tp":"Logging","d":"infra","id":14029,"n":"SR30","q":"Go 1.21+ da strukturaviy loglash uchun nima ishlatiladi?","o":["fmt.Println","log/slog — standart kutubxonadagi strukturaviy logger: JSON yoki matn handler, daraja, atributlar va context bilan ishlaydi (slog.InfoContext)","Faqat uchinchi tomon kutubxonalari","panic bilan loglash"],"a":1,"e":"Amaliy qoidalar: har logda trace_id va so'rov konteksti (handler orqali), maxfiy ma'lumotni maskalash, daraja siyosati (debug prodda o'chiq), va xatoni bir marta — eng yuqori qatlamda loglash. slog handler'ini almashtirib, chiqish formatini muhitga qarab o'zgartirish mumkin.","src":"https://pkg.go.dev/log/slog"},{"l":"S","t":"mcq","tp":"Tracing","d":"infra","id":30035,"n":"SN36","q":"Distributed tracing joriy qilindi, lekin sekin so'rovlar trace'da ko'rinmaydi. Sabab?","o":["Jaeger buzilgan","Head-based sampling 1% — sekin so'rovlar tasodifan tushmaydi; tail-based sampling yoki latency/xato bo'yicha majburiy sampling kerak","Trace ID yo'q","Log yetarli emas"],"a":1,"e":"Head sampling qarorni boshida qabul qiladi — natija noma'lum. Tail-based sampling (OTel Collector) butun trace'ni yig'ib, keyin 'sekin yoki xato bo'lsa saqla' qaroriga keladi. Amalda aralash: 1% baseline + 100% xato/p99 ustidagi. Shuningdek context propagation (traceparent) har hop va queue orqali o'tishi kerak, aks holda trace uzilib qoladi."},{"l":"S","t":"mcq","tp":"Metrics","d":"infra","id":30036,"n":"SN37","q":"Prometheus'da p99 latency'ni to'g'ri o'lchash uchun?","o":["`avg(response_time)` yetarli","Histogram (`_bucket`) + `histogram_quantile` — bucket chegaralari SLO atrofida tanlanadi; oldindan hisoblangan summary quantile'lari agregatlanmaydi","Gauge'da oxirgi qiymat","Counter'ni ikkiga bo'lish"],"a":1,"e":"Summary quantile instansiyalar bo'ylab qo'shib bo'lmaydi (p99'lar o'rtachasi p99 emas) — histogram esa bucket'lar yig'indisi orqali agregatlanadi. Kamchiligi: aniqlik bucket'ga bog'liq, shuning uchun SLO chegarasi (masalan 300ms) bucket bo'lishi kerak. Cardinality: label'da user ID/URL ID qo'yilmaydi — TSDB portlaydi."},{"l":"S","t":"mcq","tp":"Alerting","d":"infra","id":30037,"n":"SN38","q":"Alert shovqini ko'p, dejurlik charchagan. To'g'ri qayta qurish?","o":["Alert chegarasini oshirish","Symptom-based alerting: SLO va error budget burn rate bo'yicha (tez va sekin burn uchun ikki oyna); sabab-metrikalar (CPU, disk) dashboardda qoladi, page qilmaydi","Barcha alertni Slack'ga ko'chirish","Alertlarni o'chirish"],"a":1,"e":"Foydalanuvchi ta'sirini ko'rsatadigan signal page qiladi: 'checkout xato nisbati budjetni 14x tezlikda yeyapti'. Sabab metrikasi (CPU 90%) o'z-o'zidan muammo emas. Multi-window burn rate: tez oyna (5m/1h) darhol page, sekin oyna (6h) ticket. Har alertda runbook havolasi va aniq harakat bo'lishi shart."},{"l":"S","t":"mcq","tp":"Logging","d":"infra","id":30038,"n":"SN39","q":"Yuqori RPS'li servisda log xarajati portladi. Nima qilinadi?","o":["Log'ni butunlay o'chirish","Strukturaviy log + darajalar, kritik yo'lda per-request log o'rniga metrika/trace; sampling (masalan bir xil xatoni 1/100), va uzoq saqlash faqat audit uchun","Har so'rovni DEBUG bilan yozish","Faqat stdout'ga yozmaslik"],"a":1,"e":"Log qimmat va qidirish sekin; metrika agregat uchun, trace sababni topish uchun arzonroq. Amaliy chora: request log'ni faqat xato/sekin holatlarda to'liq yozish, `trace_id`ni har log qatoriga qo'yish (log↔trace bog'lanadi), PII maskalash, retention siyosati (7 kun hot, 90 kun arxiv)."},{"l":"St","t":"open","tp":"SRE","d":"infra","id":30039,"n":"SN40","q":"Yangi servis uchun SLO'ni qanday belgilaysiz va error budget bilan nima qilasiz?","m":["Foydalanuvchi yo'nalishini (critical user journey) aniqlash: masalan 'checkout POST /orders'","SLI aniq ta'rifi: muvaffaqiyatli so'rov = 5xx emas VA p99 < 500ms, o'lchash joyi — LB yoki client tomoni","Maqsad biznesga asoslangan va 100% emas: 99.9% / 28 kun oynasi. Error budget = 0.1% ≈ 43 daqiqa/oy","Budget policy: budjet tugasa — yangi feature to'xtaydi, ishonchlilik ishiga o'tiladi; budjet ko'p bo'lsa — tezroq chiqarish, chaos test","Burn rate alert (tez/sekin), dashboardda qolgan budjet","Dependency SLO'lari bilan solishtirish: siz 99.99% bera olmaysiz agar DB 99.9% bo'lsa (yoki degradatsiya yo'li kerak)"],"e":"Senior'dan kutiladigan asosiy g'oya: SLO — muhandislik qarorlarini boshqaradigan budjet, shunchaki grafik emas. Va o'lchash foydalanuvchi ko'rgan joyda bo'lishi kerak."},{"l":"S","t":"mcq","tp":"Metrics","d":"infra","id":30266,"n":"SN267","q":"RED va USE metodikalari nimani anglatadi?","o":["Alert nomlari","RED (servis uchun): Rate, Errors, Duration — foydalanuvchi ko'rgan holat; USE (resurs uchun): Utilization, Saturation, Errors — bo'g'izni topish. Ikkisi birga: RED bilan muammo borligini bilamiz, USE bilan qayerda ekanini","Faqat Prometheus'da","Log formatlari"],"a":1,"e":"Amaliy qo'llash: har servisda standart RED dashboard (va alert faqat shunga), har resursda (CPU, pool, disk, navbat) USE paneli. Saturation eng ko'p e'tibordan qoladigan signal: DB pool navbati, goroutine kutishi, Kafka lag — utilization 100% ga yetmasa ham saturation muammoni ko'rsatadi."},{"l":"S","t":"mcq","tp":"SRE","d":"infra","id":30267,"n":"SN268","q":"Postmortem 'blameless' bo'lishi nima uchun texnik jihatdan muhim?","o":["Faqat xushmuomalalik uchun","Ayblash bo'lsa odamlar ma'lumotni yashiradi va haqiqiy sabab (tizimdagi zaiflik) topilmaydi — natijada bir xil incident takrorlanadi; maqsad — kim emas, qanday shart-sharoit xatoni mumkin qilgani va qanday tizimli to'siq qo'yish","Xatolarni yashirish uchun","Hujjat talabi uchun"],"a":1,"e":"Yaxshi postmortem tarkibi: vaqt chizig'i (aniq timestamp bilan), ta'sir (foydalanuvchi va biznes raqamda), aniqlash vaqti (nega tezroq bilmadik — monitoring bo'shlig'i), tiklanish qadamlari, va action item'lar egasi/muddati bilan. Eng qadrli qism — 'nega bu xato mumkin edi' (guardrail yo'qligi), 'kim bosdi' emas."},{"l":"S","t":"mcq","tp":"Tracing","d":"infra","id":30449,"n":"SN450","q":"OpenTelemetry'da span, trace va context propagation qanday bog'lanadi?","o":["Har servis o'z trace ID sini yaratadi","Trace — bitta so'rov bo'ylab spanlar daraxti; har span parent span ID bilan bog'lanadi; `traceparent` headeri (W3C) hop'lar orasida uzatiladi — HTTP, gRPC metadata va xabar broker headerlari orqali ham qo'lda propagate qilinishi kerak","Log orqali bog'lanadi","Faqat sinxron chaqiruvlarda ishlaydi"],"a":1,"e":"Eng ko'p uchraydigan bo'shliq — asinxron chegara: Kafka'ga yozishda `traceparent` xabar headeriga solinmasa trace uziladi va 'ish qayerda sekinlashdi' savoliga javob yo'qoladi. Ikkinchi bo'shliq: log va trace bog'lanmagan (`trace_id` log maydoni sifatida yozilishi kerak). Span atributlari kardinalligi ham nazorat qilinadi."},{"l":"St","t":"mcq","tp":"Metrics","d":"infra","id":30450,"n":"SN451","q":"Prometheus'da yuqori kardinallik nega xavfli va qanday nazorat qilinadi?","o":["Xavfli emas","Har unikal label kombinatsiyasi alohida time series — user_id/URL/trace_id label sifatida qo'yilsa seriyalar millionlab bo'lib xotira va query vaqti portlaydi (OOM). Nazorat: label allowlist, `metric_relabel_configs` bilan tashlash, kardinallik alertlari va yuqori kardinallikni log/trace'ga o'tkazish","Faqat disk oshadi","Faqat eski versiyalarda"],"a":1,"e":"Qoida: metrika — agregat (nima bo'lyapti), trace/log — individual (qaysi so'rovda). Foydali label'lar: servis, endpoint shabloni (`/users/:id`, konkret ID emas), status klassi, metod. Kardinallikni kuzatish uchun `topk(10, count by (__name__)({__name__=~\".+\"}))` kabi so'rovlar va scrape darajasidagi limitlar (`sample_limit`) ishlatiladi."},{"l":"M","t":"mcq","tp":"Network","d":"infra","id":73,"n":74,"q":"CDN nima qiladi va qanday sozlanadi?","o":["Faqat rasmlarni siqadi","Kontentni foydalanuvchiga yaqin edge serverlarda keshlaydi: latency va origin yuki kamayadi. Boshqaruv Cache-Control/ETag headerlari, cache key'i (URL + tanlangan header) va invalidatsiya (purge yoki versiyalangan URL) orqali","Faqat statik saytlar uchun","DNS o'rnini bosadi"],"a":1,"e":"Amaliy qoidalar: o'zgarmas fayllarga uzoq max-age va fayl nomida hash (app.9f2a.js), HTML'ga qisqa yoki no-cache; dinamik javoblarni ham qisqa TTL bilan keshlash mumkin (stale-while-revalidate). Ehtiyot: shaxsiy ma'lumotli javoblar cache'ga tushmasin (Cache-Control: private, Vary: Authorization)."},{"l":"M","t":"mcq","tp":"Network","d":"infra","id":74,"n":75,"q":"Forward proxy va reverse proxy farqi?","o":["Bir xil","Forward proxy — client tomonida (chiquvchi trafikni boshqarish, filtrlash, anonimlik). Reverse proxy — server oldida (nginx, Envoy): TLS termination, marshrutlash, keshlash, rate limiting, yuk taqsimlash","Reverse proxy client tomonda bo'ladi","Proxy faqat VPN uchun"],"a":1,"e":"Reverse proxy backend'ni tashqi dunyodan yashiradi va cross-cutting vazifalarni ilovadan oladi. Tipik zanjir: CDN → LB → reverse proxy → ilova. Muhim tafsilot: client IP ni X-Forwarded-For orqali uzatish va ilovada uni to'g'ri o'qish (rate limit va audit uchun)."},{"l":"J","t":"mcq","tp":"Network","d":"infra","id":2025,"n":"I26","q":"L4 va L7 load balancer farqi?","o":["L4 tezroq, chunki ko'proq ish qiladi","L4 — TCP/UDP level'ida (IP va port bo'yicha), kontentni ko'rmaydi, juda tez; L7 — HTTP level'ida: URL yo'li, header, cookie bo'yicha marshrutlash, TLS termination, retry","L7 faqat ichki network'da ishlaydi","Farqi faqat narxda"],"a":1,"e":"L7 kerak bo'lgan holat: /api → servis A, /admin → servis B, canary uchun header bo'yicha bo'lish. L4 — oddiy TCP servis (DB proxy, gRPC stream) yoki maksimal throughput. Kubernetes'da Service (L4) va Ingress/Gateway (L7)."},{"l":"M","t":"mcq","tp":"Network","d":"infra","id":2026,"n":"I27","q":"Failover'ni faqat DNS o'zgartirish bilan qilishning muammosi?","o":["DNS o'zgarishi bir zumda tarqaladi","Cache: resolver va clientlar TTL tugaguncha (ba'zi client'lar undan ham uzoq — JVM, brauzer, connection pool) eski IP'ni ishlatadi — uzilish cho'ziladi","DNS failover uchun ishlatilmaydi","TTL ni 0 qilib qo'yish hamma muammoni yechadi"],"a":1,"e":"Rejalashtirilgan o'tishdan oldin TTL'ni pasaytirish (60s) — standart amaliyot, lekin hamma resolver hurmat qilmaydi. Tezroq yechimlar: anycast IP, LB level'ida qayta yo'naltirish, health check bilan avtomatik target o'zgarishi. Uzoq yashaydigan TCP connection'lar DNS o'zgarishini umuman sezmaydi — ularni uzish kerak."},{"l":"M","t":"mcq","tp":"Network","d":"infra","id":2027,"n":"I28","q":"mTLS (mutual TLS) oddiy TLS'dan nimasi bilan farq qiladi?","o":["Shifrlash kuchliroq","Ikki tomon ham sertifikat bilan o'zini tanitadi — server clientni ham tekshiradi; servis-servis autentifikatsiyasi uchun ishlatiladi","Faqat ichki network'da shifrlaydi","Sertifikat kerak emas"],"a":1,"e":"Oddiy TLS'da faqat server o'zini tanitadi (brauzer stsenariysi). Ichki network'da 'network ichida bo'lsa ishonamiz' — eskirgan model (zero trust). mTLS servis identifikatsiyasini beradi, lekin sertifikat rotatsiyasi kerak — service mesh yoki SPIFFE buni avtomatlashtiradi."},{"l":"S","t":"mcq","tp":"Network","d":"infra","id":2028,"n":"I29","q":"A → B → C zanjiri. A timeout 10s, B timeout 10s, C sekinlashdi. Nima bo'ladi?","o":["Hammasi yaxshi ishlaydi","A 10s kutadi, B ham 10s — A ning butun byudjeti B ga ketadi; connection va thread'lar band bo'lib, yuqori oqimda tugaydi. To'g'ri: deadline propagation — har qadam qolgan vaqtni uzatadi, ichki timeout tashqisidan kichik bo'ladi","C avtomatik o'chiriladi","Retry muammoni hal qiladi"],"a":1,"e":"Timeout'lar ichma-ich kamayib borishi kerak (10s → 3s → 1s), aks holda cascading failure. Retry bilan birga bo'lsa yanada yomon: har qadam 3 marta urinsa, 3 qadamda 27 ta query — retry amplification. Yechim: deadline (gRPC'da bor), retry budget, circuit breaker."},{"l":"J","t":"mcq","tp":"TCP/IP","d":"infra","id":6000,"n":"F1","q":"TCP va UDP farqi?","o":["UDP ishonchliroq","TCP — connection'ga asoslangan: tartib, qayta yuborish, oqim va tirbandlik nazorati; UDP — datagram: kafolat yo'q, lekin yengil va kechikish kam","TCP tez, UDP sekin","Ikkalasi bir xil, faqat port raqami boshqa"],"a":1,"e":"UDP mos keladigan joylar: video/ovozli qo'ng'iroq (eski paket keraksiz), DNS, o'yin, QUIC (HTTP/3 ham UDP ustida — ishonchlilikni o'zi amalga oshiradi). TCP'da 'ishonchlilik' latency narxiga keladi: paket yo'qolsa qayta yuborish kutiladi va butun oqim to'xtaydi (head-of-line blocking)."},{"l":"J","t":"mcq","tp":"TCP/IP","d":"infra","id":6001,"n":"F2","q":"TCP connection qanday o'rnatiladi?","o":["Bitta paket yuborish bilan","Uch qadamli qo'l berish: SYN → SYN-ACK → ACK; yopilish esa FIN/ACK almashinuvi bilan (va TIME_WAIT holati bilan)","Faqat server boshlaydi","DNS orqali"],"a":1,"e":"Har yangi connection kamida bitta round-trip (RTT) — TLS bo'lsa yana qo'shiladi. Shuning uchun keep-alive va connection pool'i muhim: har query'ga yangi connection ochish uzoq masofada juda qimmat. Serverda TIME_WAIT ko'payishi va ephemeral port tugashi — yuqori yukdagi klassik muammo."},{"l":"M","t":"mcq","tp":"TLS","d":"infra","id":6003,"n":"F4","q":"TLS qo'l berishda (handshake) nima sodir bo'ladi?","o":["Parol almashinadi","Server sertifikatini beradi (client uni ishonchli CA zanjiri, muddati va domen nomi bo'yicha tekshiradi), tomonlar key almashinuvi (ECDHE) orqali seans key'ini hosil qiladi va keyin simmetrik shifrlashga o'tadi","Butun trafik ochiq matn qoladi","Faqat parol shifrlanadi"],"a":1,"e":"TLS 1.3 qo'l berishni 1-RTT ga qisqartirdi (0-RTT ham bor, lekin replay xavfi tufayli ehtiyotkorlik talab qiladi). Asimmetrik kriptografiya faqat key kelishuvi uchun — qolgani simmetrik (tez). Forward secrecy: ECDHE tufayli server key'i keyin sizib chiqsa ham eski trafik ochilmaydi. mTLS'da client ham sertifikat beradi."},{"l":"S","t":"mcq","tp":"TCP/IP","d":"infra","id":30040,"n":"SN41","q":"Servis ko'p chiquvchi ulanish qiladi va `connect: cannot assign requested address` xatosi keladi. Sabab?","o":["DNS ishlamayapti","Ephemeral port tugagan — ko'p qisqa muddatli ulanish, TIME_WAIT'da to'planish; connection reuse (keep-alive/pool) yo'q","TLS handshake xatosi","MTU kichik"],"a":1,"e":"Har ulanish (src IP, src port, dst IP, dst port) to'rtligi bilan aniqlanadi; bir xil dst uchun ~28k ephemeral port. Yechim tartibi: (1) HTTP client'da `Transport` qayta ishlatish va `MaxIdleConnsPerHost` oshirish — Go'da har request'da yangi client yaratish klassik xato, (2) keep-alive, (3) port diapazonini kengaytirish, (4) NAT'da SNAT pool. `tw_reuse` — palliativ."},{"l":"S","t":"mcq","tp":"Network","d":"infra","id":30041,"n":"SN42","q":"Kubernetes'da DNS so'rovlar sekin va ba'zan 5s kechikadi. Klassik sabab?","o":["CoreDNS podida CPU limit","`ndots:5` + search domenlari tufayli har nom uchun bir necha so'rov, va conntrack/UDP race (parallel A/AAAA) — 5s = resolver retry timeout","Node DNS server yo'q","Service IP yetmaydi"],"a":1,"e":"Tashqi domenga (`api.stripe.com`) so'rov avval `.svc.cluster.local` variantlari bilan sinaladi — ortiqcha yuk. Yechimlar: `dnsConfig` bilan `ndots:1`, FQDN ishlatish (nuqta bilan tugash), NodeLocal DNSCache, resolver keshi. 5 sekundli kechikish deyarli har doim DNS retry timeoutning izi."},{"l":"S","t":"mcq","tp":"TLS","d":"infra","id":30042,"n":"SN43","q":"TLS handshake narxini kamaytirish uchun eng samarali choralar?","o":["Sertifikatni o'chirish","Ulanishni qayta ishlatish (keep-alive), TLS 1.3 (1-RTT, 0-RTT ehtiyotkorlik bilan), session resumption, ECDSA sertifikat, OCSP stapling","Faqat RSA 4096 ishlatish","Har request'da yangi ulanish"],"a":1,"e":"Eng katta g'alaba — handshake'ni umuman qilmaslik (pool). TLS 1.3 to'liq handshake'ni 1-RTT ga tushiradi; 0-RTT replay xavfi bor, faqat idempotent GET uchun. ECDSA P-256 RSA-2048 dan tez imzo tekshiruvi beradi. OCSP stapling client tomonidagi qo'shimcha so'rovni yo'qotadi."},{"l":"S","t":"mcq","tp":"Network","d":"infra","id":30043,"n":"SN44","q":"Ma'lumot markazlar orasida throughput past, latency 80ms. Kanal keng. Sabab?","o":["Paket yo'qolishi bo'lishi shart","Bandwidth-delay product: TCP oynasi (va app buffer) yetmaydi — yuqori RTT'da bitta oqim kanalni to'ldirmaydi; parallel oqim yoki buffer/oyna kattalashtirish kerak","MTU 1500 juda katta","DNS sekin"],"a":1,"e":"BDP = bandwidth × RTT: 1 Gbit/s × 80ms ≈ 10 MB 'uchishda' bo'lishi kerak. Oyna kichik bo'lsa oqim ACK kutib turadi. Choralar: window scaling va socket buffer'lar, bir nechta parallel oqim, BBR congestion control (loss-based emas), yoki ma'lumotni siqish/yaqinga ko'chirish. Ozgina loss ham yuqori RTT'da throughputni keskin tushiradi."},{"l":"S","t":"mcq","tp":"TCP/IP","d":"infra","id":30204,"n":"SN205","q":"TCP va UDP orasidagi tanlov qachon UDP tomonga o'tadi?","o":["UDP har doim tezroq, doim tanlanadi","Yo'qolishga bardoshli va latency muhim bo'lgan oqimlarda (video/ovoz, o'yin holati, metrikalar/statsd, DNS) yoki o'z ustiga ishonchlilik qurganda (QUIC) — TCP head-of-line blocking va retransmit kechikishini olib tashlash uchun","Faqat lokal tarmoqda","UDP'da tartib kafolatlangan"],"a":1,"e":"TCP bitta paket yo'qolsa keyingi kelgan ma'lumotni ham kutishga majbur qiladi (head-of-line) — real-time uchun yomon. QUIC (HTTP/3) UDP ustida oqimlarni mustaqil qilib shu muammoni yechadi va handshake'ni 1-RTT/0-RTT ga tushiradi. UDP tanlansa: retransmit, tartib, congestion control kimning zimmasida — aniq javob bo'lishi kerak."},{"l":"S","t":"mcq","tp":"Network","d":"infra","id":30205,"n":"SN206","q":"`ss -s` da `Recv-Q` katta. Bu nimani ko'rsatadi?","o":["Tarmoq sekin","Ilova socket'dan yetarlicha tez o'qimayapti — accept/read qatlamida bo'g'iz (goroutine yetmaydi, handler bloklangan); `Send-Q` katta bo'lsa teskarisi — qabul qiluvchi yoki tarmoq sekin","Paket yo'qolgan","MTU kichik"],"a":1,"e":"Diagnostika juftligi: `Recv-Q` — kernel buferida o'qilmagan ma'lumot (server ilovasi sekin), `Send-Q` — yuborilib ack olinmagan ma'lumot (tarmoq/peer sekin). Bunga qo'shimcha: `netstat -s` da retransmit va `listen queue overflow` (`somaxconn`/backlog to'lgani) — yuqori yuk incidentlarida birinchi qaraladigan signallar."},{"l":"S","t":"mcq","tp":"TCP/IP","d":"infra","id":30354,"n":"SN355","q":"TCP va UDP orasidagi tanlov qachon UDP tomonga o'tadi?","o":["UDP har doim tezroq, doim tanlanadi","Yo'qolishga bardoshli va latency muhim bo'lgan oqimlarda (video/ovoz, o'yin holati, metrikalar/statsd, DNS) yoki o'z ustiga ishonchlilik qurganda (QUIC) — TCP head-of-line blocking va retransmit kechikishini olib tashlash uchun","Faqat lokal tarmoqda","UDP'da tartib kafolatlangan"],"a":1,"e":"TCP bitta paket yo'qolsa keyingi kelgan ma'lumotni ham kutishga majbur qiladi (head-of-line) — real-time uchun yomon. QUIC (HTTP/3) UDP ustida oqimlarni mustaqil qilib shu muammoni yechadi va handshake'ni 1-RTT/0-RTT ga tushiradi. UDP tanlansa: retransmit, tartib, congestion control kimning zimmasida — aniq javob bo'lishi kerak."},{"l":"S","t":"mcq","tp":"Network","d":"infra","id":30355,"n":"SN356","q":"`ss -s` da `Recv-Q` katta. Bu nimani ko'rsatadi?","o":["Tarmoq sekin","Ilova socket'dan yetarlicha tez o'qimayapti — accept/read qatlamida bo'g'iz (goroutine yetmaydi, handler bloklangan); `Send-Q` katta bo'lsa teskarisi — qabul qiluvchi yoki tarmoq sekin","Paket yo'qolgan","MTU kichik"],"a":1,"e":"Diagnostika juftligi: `Recv-Q` — kernel buferida o'qilmagan ma'lumot (server ilovasi sekin), `Send-Q` — yuborilib ack olinmagan ma'lumot (tarmoq/peer sekin). Bunga qo'shimcha: `netstat -s` da retransmit va `listen queue overflow` (`somaxconn`/backlog to'lgani) — yuqori yuk incidentlarida birinchi qaraladigan signallar."},{"l":"S","t":"mcq","tp":"Network","d":"infra","id":30437,"n":"SN438","q":"HTTP/1.1 keep-alive, HTTP/2 multiplexing va HTTP/3 farqi nimada?","o":["Faqat tezlik","HTTP/1.1: bitta ulanishda navbat bilan (head-of-line blocking so'rov darajasida, shuning uchun brauzer 6 ulanish ochadi); HTTP/2: bitta TCP'da parallel oqimlar + HPACK header siqish, lekin TCP darajasida HOL qoladi (bitta paket yo'qolsa hamma oqim kutadi); HTTP/3: QUIC (UDP) bilan oqimlar mustaqil, 1-RTT handshake va ulanish migratsiyasi","HTTP/2 UDP ishlatadi","HTTP/3 eskirgan"],"a":1,"e":"Backend uchun amaliy oqibatlar: HTTP/2 bilan bitta ulanish — L4 balansirovka yuklamani tarqatmaydi (gRPC muammosi), va server tomonda `MaxConcurrentStreams` bo'g'iz bo'lishi mumkin. Yuqori paket yo'qotishli mobil tarmoqlarda HTTP/3 sezilarli yutuq beradi; ma'lumot markazi ichida esa farq kam."},{"l":"S","t":"mcq","tp":"TLS","d":"infra","id":30438,"n":"SN439","q":"mTLS'da sertifikat rotatsiyasi qanday tashkil qilinadi?","o":["Yiliga bir marta qo'lda","Qisqa muddatli sertifikatlar (soatlar/kunlar) avtomatik chiqariladi (SPIFFE/cert-manager/mesh agent), ilova sertifikatni diskdan/SDS orqali qayta yuklaydi (restart shart emas), CA ishonch zanjiri esa uzoqroq muddatli va alohida rotatsiya rejasi bilan","Sertifikat muddatsiz bo'lishi kerak","Faqat TLS termination'da"],"a":1,"e":"Nozik joylar: ilova sertifikatni ishga tushganda bir marta o'qisa — muddati tugagach barcha ulanish yiqiladi (klassik yarim tunlik incident); `tls.Config.GetCertificate`/`GetClientCertificate` bilan har handshake'da yangisi olinadi. CA rotatsiyasida ikki CA bir vaqtda ishonchli bo'lishi kerak (overlap), aks holda hamma yoqda uzilish."},{"l":"S","t":"mcq","tp":"TLS","d":"infra","id":30439,"n":"SN440","q":"TLS 1.3 handshake'da nima o'zgardi va 0-RTT xavfi nimada?","o":["Hech nima o'zgarmadi","1-RTT: client birinchi xabarda kalit almashinuv ulushini yuboradi; eskirgan shifrlar (RSA key exchange, CBC, RC4) olib tashlandi va forward secrecy majburiy. 0-RTT esa qayta ulanishda darhol ma'lumot yuborishga ruxsat beradi — lekin replay hujumiga ochiq, shuning uchun faqat idempotent so'rovlar uchun","TLS 1.3 sekinroq","0-RTT xavfsiz"],"a":1,"e":"0-RTT ma'lumotini hujumchi yozib olib qayta yuborishi mumkin — `POST /transfer` bo'lsa ikki marta o'tkazma bo'lishi mumkin. Shuning uchun CDN/proxy'da 0-RTT faqat `GET`/idempotent yo'llarga ruxsat etiladi yoki umuman o'chiriladi. Forward secrecy: kalit o'g'irlansa ham o'tmishdagi trafikni ochib bo'lmaydi."},{"l":"M","t":"mcq","tp":"OS","d":"infra","id":81,"n":82,"q":"Process va thread farqi (backend nuqtai nazaridan)?","o":["Farqi yo'q","Process — o'z memory maydoniga ega, izolyatsiya kuchli, aloqa IPC orqali. Thread — bitta process ichida, memory'ni bo'lishadi: almashinuv arzon, lekin umumiy holat uchun sinxronizatsiya kerak (race, deadlock)","Thread alohida memory oladi","Process har doim tezroq"],"a":1,"e":"Go'da bunga qo'shimcha qatlam bor: goroutine'lar runtime tomonidan OS threadlarga taqsimlanadi. Konteynerda resurs cheklovlari (cgroup) aynan process level'ida qo'llanadi. Nginx/Postgres kabi tizimlar turli modellarni tanlagan: Postgres — har connection'ga process, shuning uchun connection'lar qimmat."},{"l":"M","t":"mcq","tp":"OS","d":"infra","id":82,"n":83,"q":"UTF-8 haqida qaysi to'g'ri?","o":["Har belgi 1 bayt","O'zgaruvchan uzunlikdagi kodlash: ASCII 1 bayt, boshqa belgilar 2–4 bayt. Shuning uchun 'uzunlik' bayt, rune (kod nuqtasi) yoki foydalanuvchi ko'radigan grafема bo'lishi mumkin — ular teng emas","Har belgi 2 bayt","UTF-8 faqat ingliz tili uchun"],"a":1,"e":"Go'da: len(s) — baytlar soni, []rune(s) — kod nuqtalari, emoji yoki diakritik belgilar esa bir necha kod nuqtasidan iborat bo'lishi mumkin. Amaliy oqibatlar: DB'da VARCHAR(n) uzunligi (Postgres'da belgi bo'yicha), string kesish (yarim belgi qolmasin), qidiruvda normalizatsiya (NFC) va katta-kichik harf qoidalari tilga bog'liq."},{"l":"S","t":"open","tp":"Ops","d":"infra","id":1017,"n":"B18","q":"Kubernetes'da servisni deploy qilganda query'lar yo'qolmasligi uchun graceful shutdown qanday qilinadi?","m":["SIGTERM kelganda yangi query'larni qabul qilishni to'xtatish (readiness → fail)","Endpoint'dan chiqarilishini kutish — qisqa preStop sleep","Joriy query'larni tugatish (deadline bilan), keyin DB/queue connection'larini yopish","Queue consumer: yangi xabar olmaslik, joriyni ack qilib chiqish","terminationGracePeriodSeconds shutdown vaqtidan katta bo'lishi"],"e":"Ko'p jamoa buni unutadi va har deployda 502 lar. Readiness va liveness probe farqini ham aytish kerak: liveness faqat 'jarayon osilib qoldi' uchun."},{"l":"St","t":"open","tp":"Cloud","d":"infra","id":2029,"n":"I30","q":"Infratuzilmani qanday boshqarasiz: IaC, muhitlar va falokatdan tiklanish?","m":["Hamma infratuzilma kodda (Terraform/Pulumi), qo'lda o'zgartirish yo'q — drift detection va CI'da plan/apply review","State fayli xavfsiz (remote backend, lock); modul va muhit bo'yicha ajratish, prod alohida akkaunt/loyiha","Muhitlar bir xil shablondan — dev/stage/prod farqi faqat parametrda","Multi-AZ default; multi-region — RTO/RPO talab qilsa (narx va murakkablik)","DR: backup + tiklashni muntazam mashq qilish (game day), runbook, xaos testlari","Eng kam huquq, audit log, xarajat teglari va byudjet alertlari"],"e":"Staff/Principal signal: 'terraform bor' emas, jarayon — review, drift, tiklashni isbotlash. Tekshirilmagan DR rejasi — reja emas, taxmin."},{"l":"M","t":"mcq","tp":"AWS","d":"infra","id":5017,"n":"V18","q":"Foydalanuvchi katta fayl (video) yuklashi kerak. To'g'ri yondashuv?","o":["Fayl backend orqali o'tib S3'ga yoziladi","Backend pre-signed URL beradi, client to'g'ridan-to'g'ri S3'ga yuklaydi (katta fayl uchun multipart), yuklangach backend'ga xabar qilinadi yoki S3 event ishga tushadi","Faylni DB'da saqlash","EC2 diskida saqlash"],"a":1,"e":"Backend orqali o'tkazish — trafik narxi, memory va timeout muammosi. Pre-signed URL qisqa muddatli va cheklangan (metod, key, hajm shart bilan). Yuklangandan keyingi ishlov (thumbnail, virus scan) — S3 event → SQS/Lambda orqali asinxron.","src":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/PresignedUrlUploadObject.html"},{"l":"M","t":"mcq","tp":"AWS","d":"infra","id":5018,"n":"V19","q":"SQS standard va FIFO queue farqi?","o":["FIFO tezroq","Standard — juda katta throughput, kamida bir marta yetkazish va tartib kafolatlanmagan. FIFO — guruh (MessageGroupId) ichida tartib va takrorlanmaslik (deduplication), lekin throughput cheklangan","Standard tartibni kafolatlaydi","FIFO'da dedup yo'q"],"a":1,"e":"Ko'p holatda standard + idempotent consumer yetarli va arzonroq. Visibility timeout — xabar olingach boshqalarga ko'rinmaydigan vaqt: ishlov shu vaqtdan uzoq bo'lsa, xabar ikkinchi marta ishlanadi (shuning uchun timeoutni ishlov vaqtiga moslash yoki heartbeat bilan uzaytirish). Zaharli xabarlar uchun redrive policy → DLQ."},{"l":"S","t":"mcq","tp":"AWS","d":"infra","id":5019,"n":"V20","q":"EKS'dagi Go servisi S3'ga kirishi kerak. Eng xavfsiz usul?","o":["Access key va secret'ni env'ga yozish","IAM role: EKS uchun IRSA (service account'ga bog'langan rol) yoki EC2 instance profile — vaqtinchalik, avtomatik rotatsiyalanadigan credential; uzoq yashaydigan key yo'q","Key'larni ConfigMap'da saqlash","Root akkaunt key'ini ishlatish"],"a":1,"e":"Uzoq muddatli access key — sizib chiqish xavfi va rotatsiya og'rig'i. IRSA'da SDK avtomatik STS orqali token oladi. Qo'shimcha: eng kam huquq (faqat kerakli bucket va prefiks), bucket policy, shifrlash (SSE-KMS), CloudTrail audit.","src":"https://docs.aws.amazon.com/eks/latest/userguide/iam-roles-for-service-accounts.html"},{"l":"S","t":"mcq","tp":"AWS","d":"infra","id":5020,"n":"V21","q":"RDS'da Multi-AZ va read replica farqi?","o":["Bir xil narsa","Multi-AZ — standby nusxa, yozish/o'qish uchun ishlatilmaydi, faqat avtomatik failover (yuqori mavjudlik). Read replica — o'qish yukini taqsimlash uchun, asinxron (lag bor), avtomatik failover emas","Read replica yozishni ham qabul qiladi","Multi-AZ o'qishni tezlashtiradi"],"a":1,"e":"Ikkalasi turli muammoni yechadi: Multi-AZ — mavjudlik, read replica — masshtab. Replicadan o'qishda lag va read-your-writes muammosini hisobga olish kerak (kritik o'qishlar primary'dan). Aurora'da arxitektura boshqacha: umumiy storage, replicalar tez failover qila oladi."},{"l":"St","t":"open","tp":"AWS","d":"infra","id":5021,"n":"V22","q":"Go mikroservisini AWS'da ishga tushirish: ECS, EKS yoki Lambda? Qanday tanlaysiz?","m":["Lambda: hodisaga asoslangan, notekis yuk, operatsiya minimal; kamchilik — cold start, 15 daqiqa limit, uzoq connection'lar (DB pool) muammosi (RDS Proxy kerak)","ECS Fargate: doimiy servis, serversiz konteyner, Kubernetes murakkabligisiz — ko'p jamoa uchun oltin o'rtalik","EKS: ko'p servis, murakkab network/mesh, ko'p jamoa va allaqachon Kubernetes ekspertizasi bo'lsa","Mezonlar: yuk profili, jamoa tajribasi, narx, migratsiya qilish osonligi, compliance","Go afzalligi: kichik image va tez start — har uchala variantda ham yaxshi ishlaydi"],"e":"Staff signal: 'Kubernetes default emas' — operatsion narxni jamoa hajmi bilan solishtirish va qaytib chiqish (exit) narxini aytish."},{"l":"S","t":"mcq","tp":"OS","d":"infra","id":30044,"n":"SN45","q":"Production podda latency spike. `top`da CPU past, lekin `iowait` yuqori. Keyingi qadam?","o":["Replicani oshirish","I/O bo'yicha chuqurlash: `iostat -x` (await, %util), sekin query/fsync, disk throttling (EBS burst credit tugashi), va app tomonda sinxron yozuvlar","GC tuning","Kodni Rust'ga yozish"],"a":1,"e":"iowait — protsessor bloklangan I/O kutib. Tekshirish zanjiri: qaysi qurilma (`iostat`), qaysi jarayon (`pidstat -d`, `biotop`), cloud disk limiti (IOPS/throughput kvota, gp2 burst), fayl tizimi/fsync namunasi (DB WAL, log yozish). Ko'p hollarda sabab — disk kvotasi yoki jurnal yozuvining sinxronligi, kod emas."},{"l":"S","t":"mcq","tp":"Cloud","d":"infra","id":30045,"n":"SN46","q":"Multi-AZ'da xarajat portladi. Ko'p uchraydigan yashirin sabab?","o":["S3 saqlash narxi","Cross-AZ data transfer: servislar va DB har xil AZ'da, har so'rov tarmoq to'lovi; topology-aware routing / AZ-local replica yo'q","EC2 instance turi","CloudWatch alert soni"],"a":1,"e":"Har GB cross-AZ trafik to'lanadi, chatty microservice arxitekturasida bu katta summa. Choralar: `topologyAwareHints`/zone-aware balansirovka, o'qishni AZ-local replicadan, kesh mahalliy, va batching (chatty chaqiruvlarni kamaytirish). Lekin ishonchlilik bilan muvozanat: AZ-local hamma joyda emas, faqat o'qishda."},{"l":"St","t":"mcq","tp":"Ops","d":"infra","id":30046,"n":"SN47","q":"Incident: bitta AZ ishdan chiqdi. Servis yiqilmasligi uchun oldindan nima qilingan bo'lishi kerak?","o":["Faqat replicani ko'paytirish","Pod'lar AZ bo'ylab `topologySpreadConstraints` bilan tarqatilgan, DB multi-AZ failover (RTO/RPO o'lchangan), kvota boshqa AZ'da yuklamani ko'tarishga yetarli, va sog'liq tekshiruvi AZ'ni tez chiqaradi","DNS TTL 3600","Barcha podni bitta AZ'da ushlash (tarmoq arzon)"],"a":1,"e":"Ko'p jamoada nazariy multi-AZ bor, lekin: (a) pod'lar amalda bitta AZ'da yig'ilgan, (b) qolgan AZ'da headroom yo'q — cascading yiqilish, (c) failover qo'lda va sinovdan o'tmagan. Shuning uchun game day / chaos mashqi bilan tekshiriladi va kvota 'N-1 AZ' hisobiga rejalashtiriladi."},{"l":"S","t":"mcq","tp":"OS","d":"infra","id":30200,"n":"SN201","q":"Jarayon va oqim (thread) farqi, va nega Go goroutine ikkisidan arzon?","o":["Farqi yo'q","Jarayon — alohida adres maydoni (izolyatsiya, qimmat almashinish), thread — umumiy adres maydoni lekin OS rejalashtiradi (~1-8 MB stack, kernel switch); goroutine — user-space'da rejalashtiriladigan yengil oqim (2 KB dan boshlanadigan o'suvchi stack), M:N modeli bilan bir necha OS thread ustida ishlaydi","Goroutine — jarayon","Thread har doim tezroq"],"a":1,"e":"Go runtime scheduler (G-M-P modeli) kanal yoki tarmoq kutishida goroutine'ni thread'dan yechib qo'yadi — kernel switch bo'lmaydi. Shu sabab 100k goroutine normal, 100k OS thread esa emas. Blokirovka qiluvchi syscall (fayl, cgo) bo'lsa runtime yangi thread ajratadi — bu joy sizib ketishi mumkin (`GOMAXPROCS`dan ko'p thread)."},{"l":"S","t":"mcq","tp":"OS","d":"infra","id":30201,"n":"SN202","q":"Fayldan o'qishda `page cache` nimani o'zgartiradi?","o":["Hech narsa","Kernel o'qilgan bloklarni xotirada keshlaydi — takroriy o'qish diskka bormaydi; shuning uchun DB serverida bo'sh RAM 'behuda' emas, va `free` chiqishidagi `buff/cache` normal holat. Yozuvda esa `fsync` bo'lmaguncha ma'lumot faqat page cache'da (yo'qolishi mumkin)","Faqat yozuvni tezlashtiradi","Faqat SSD'da ishlaydi"],"a":1,"e":"Amaliy natijalar: PostgreSQL `shared_buffers` + OS page cache birga ishlaydi (shuning uchun shared_buffers RAM'ning 25% atrofida); `fsync`ni o'chirish tezlik beradi lekin crash'da ma'lumot yo'qoladi; konteynerda page cache cgroup memory hisobiga kiradi va OOM hisobida ko'rinishi mumkin."},{"l":"S","t":"mcq","tp":"OS","d":"infra","id":30202,"n":"SN203","q":"`fork` qilinganda xotira qanday nusxalanadi va bu nega muhim?","o":["To'liq nusxa olinadi","Copy-on-write: sahifalar umumiy qoladi, faqat yozilganda nusxalanadi — shuning uchun Redis `BGSAVE` paytida yozuv ko'p bo'lsa xotira ikki barobarga yaqin oshishi mumkin","Xotira umuman nusxalanmaydi","Faqat stack nusxalanadi"],"a":1,"e":"Redis persistence'dagi klassik incident: `fork` arzon ko'rinadi, lekin yozuv intensiv bo'lsa CoW sahifalari ko'payib OOM bo'ladi (shuning uchun `vm.overcommit_memory=1` tavsiya qilinadi va xotira zapasi qoldiriladi). Xuddi shu mexanizm konteyner image qatlamlari va `vfork`/`posix_spawn` optimizatsiyalarida ham asos."},{"l":"St","t":"mcq","tp":"OS","d":"infra","id":30203,"n":"SN204","q":"Latency raqamlari (tartib bo'yicha): L1 kesh, RAM, SSD, bir DC ichida tarmoq, kontinentlar orasi?","o":["Hammasi mikrosekund atrofida","~1 ns L1, ~100 ns RAM, ~100 µs SSD o'qish, ~0.5 ms bir DC ichida round-trip, ~150 ms kontinentlar orasi — har bosqich taxminan 100-1000x farq qiladi","RAM va SSD teng","Tarmoq RAM'dan tez"],"a":1,"e":"Bu raqamlar dizayn qarorlarini boshqaradi: RAM'dan o'qish diskdan ~1000x tez (shuning uchun kesh), bir DC ichidagi chaqiruv RAM'dan ~5000x sekin (shuning uchun N+1 chaqiruv halokatli), cross-region esa har round-trip 150 ms (shuning uchun cross-region sinxron yozuv qabul qilinmaydi). Aniq raqam emas, kattalik tartibi muhim."},{"l":"S","t":"mcq","tp":"Cloud","d":"infra","id":30268,"n":"SN269","q":"Terraform'da state fayli nima uchun kritik va qanday boshqariladi?","o":["Oddiy log fayl","State real infratuzilma bilan konfiguratsiya orasidagi moslikni saqlaydi — yo'qolsa Terraform resurslarni 'yo'q' deb hisoblab qayta yaratadi. Shuning uchun remote backend (S3+DynamoDB lock yoki HCP), versiyalash, shifrlash va `plan`ni doimo ko'rib chiqish kerak","Lokal saqlash yetarli","State keraksiz"],"a":1,"e":"Amaliy qoidalar: state'ni hech qachon qo'lda tahrir qilmaslik (`terraform state mv/rm` komandalari bor), lock bilan parallel `apply`ni bloklash, muhitlarni alohida state'ga ajratish (blast radius), sirlar state'ga tushishini hisobga olish (shifrlash va kirish nazorati), va `import` bilan qo'lda yaratilgan resursni state'ga kiritish."},{"l":"S","t":"mcq","tp":"AWS","d":"infra","id":30269,"n":"SN270","q":"IAM'da eng kam huquq (least privilege) amalda qanday ta'minlanadi?","o":["Har servisga AdministratorAccess","Rolga asoslangan kirish: workload'ga IAM Role (EC2 instance profile / EKS IRSA), statik kalit yo'q; policy resurs va shart bo'yicha cheklangan (`Resource` aniq ARN, `Condition` bilan), va Access Analyzer/CloudTrail bilan ortiqcha huquqlar kesiladi","Faqat MFA yoqish","IP allowlist"],"a":1,"e":"Amaliy qadamlar: uzoq yashovchi access key'lardan voz kechish (rol + STS), har servisga alohida rol (umumiy rol bo'lsa blast radius katta), `iam:PassRole` va wildcard action'larni ehtiyot bilan berish, va CloudTrail'dan haqiqiy ishlatilgan huquqlar bo'yicha policy'ni qisqartirish. S3'da bucket policy + `BlockPublicAccess` majburiy."},{"l":"S","t":"mcq","tp":"OS","d":"infra","id":30350,"n":"SN351","q":"Jarayon va oqim (thread) farqi, va nega Go goroutine ikkisidan arzon?","o":["Farqi yo'q","Jarayon — alohida adres maydoni (izolyatsiya, qimmat almashinish), thread — umumiy adres maydoni lekin OS rejalashtiradi (~1-8 MB stack, kernel switch); goroutine — user-space'da rejalashtiriladigan yengil oqim (2 KB dan boshlanadigan o'suvchi stack), M:N modeli bilan bir necha OS thread ustida ishlaydi","Goroutine — jarayon","Thread har doim tezroq"],"a":1,"e":"Go runtime scheduler (G-M-P modeli) kanal yoki tarmoq kutishida goroutine'ni thread'dan yechib qo'yadi — kernel switch bo'lmaydi. Shu sabab 100k goroutine normal, 100k OS thread esa emas. Blokirovka qiluvchi syscall (fayl, cgo) bo'lsa runtime yangi thread ajratadi — bu joy sizib ketishi mumkin (`GOMAXPROCS`dan ko'p thread)."},{"l":"S","t":"mcq","tp":"OS","d":"infra","id":30351,"n":"SN352","q":"Fayldan o'qishda `page cache` nimani o'zgartiradi?","o":["Hech narsa","Kernel o'qilgan bloklarni xotirada keshlaydi — takroriy o'qish diskka bormaydi; shuning uchun DB serverida bo'sh RAM 'behuda' emas, va `free` chiqishidagi `buff/cache` normal holat. Yozuvda esa `fsync` bo'lmaguncha ma'lumot faqat page cache'da (yo'qolishi mumkin)","Faqat yozuvni tezlashtiradi","Faqat SSD'da ishlaydi"],"a":1,"e":"Amaliy natijalar: PostgreSQL `shared_buffers` + OS page cache birga ishlaydi (shuning uchun shared_buffers RAM'ning 25% atrofida); `fsync`ni o'chirish tezlik beradi lekin crash'da ma'lumot yo'qoladi; konteynerda page cache cgroup memory hisobiga kiradi va OOM hisobida ko'rinishi mumkin."},{"l":"S","t":"mcq","tp":"OS","d":"infra","id":30352,"n":"SN353","q":"`fork` qilinganda xotira qanday nusxalanadi va bu nega muhim?","o":["To'liq nusxa olinadi","Copy-on-write: sahifalar umumiy qoladi, faqat yozilganda nusxalanadi — shuning uchun Redis `BGSAVE` paytida yozuv ko'p bo'lsa xotira ikki barobarga yaqin oshishi mumkin","Xotira umuman nusxalanmaydi","Faqat stack nusxalanadi"],"a":1,"e":"Redis persistence'dagi klassik incident: `fork` arzon ko'rinadi, lekin yozuv intensiv bo'lsa CoW sahifalari ko'payib OOM bo'ladi (shuning uchun `vm.overcommit_memory=1` tavsiya qilinadi va xotira zapasi qoldiriladi). Xuddi shu mexanizm konteyner image qatlamlari va `vfork`/`posix_spawn` optimizatsiyalarida ham asos."},{"l":"St","t":"mcq","tp":"OS","d":"infra","id":30353,"n":"SN354","q":"Latency raqamlari (tartib bo'yicha): L1 kesh, RAM, SSD, bir DC ichida tarmoq, kontinentlar orasi?","o":["Hammasi mikrosekund atrofida","~1 ns L1, ~100 ns RAM, ~100 µs SSD o'qish, ~0.5 ms bir DC ichida round-trip, ~150 ms kontinentlar orasi — har bosqich taxminan 100-1000x farq qiladi","RAM va SSD teng","Tarmoq RAM'dan tez"],"a":1,"e":"Bu raqamlar dizayn qarorlarini boshqaradi: RAM'dan o'qish diskdan ~1000x tez (shuning uchun kesh), bir DC ichidagi chaqiruv RAM'dan ~5000x sekin (shuning uchun N+1 chaqiruv halokatli), cross-region esa har round-trip 150 ms (shuning uchun cross-region sinxron yozuv qabul qilinmaydi). Aniq raqam emas, kattalik tartibi muhim."},{"l":"St","t":"mcq","tp":"OS","d":"infra","id":30457,"n":"SN458","q":"cgroup v2 memory limiti ilovaga qanday ta'sir qiladi?","o":["Faqat monitoring","`memory.max` ga yetilganda avval reclaim (page cache tozalash, swap agar bor bo'lsa), keyin OOM killer cgroup ichidagi jarayonni o'ldiradi. `memory.high` esa yumshoq chegara — throttling qiladi. Page cache ham hisobga kiradi, shuning uchun ko'p fayl o'qish limitga bosim beradi","Faqat RSS hisoblanadi","Limit yumshoq"],"a":1,"e":"Amaliy natijalar: Go'da `GOMEMLIMIT` ni `memory.max` dan past qo'yish OOMKill o'rniga GC bosimini beradi (jarayon tirik qoladi va diagnostika mumkin); katta fayl o'qiydigan jarayonlar page cache tufayli kutilmaganda o'ldirilishi mumkin; `memory.high` bilan jarayon sekinlashadi lekin o'lmaydi — bu ba'zan afzalroq."},{"l":"S","t":"mcq","tp":"Ops","d":"infra","id":30458,"n":"SN459","q":"Konteynerda `PID 1` muammosi nima?","o":["Muammo yo'q","PID 1 signal ishlovchisi bo'lmasa `SIGTERM` e'tiborsiz qolishi mumkin (graceful shutdown ishlamaydi) va zombi jarayonlar yig'iladi; shell orqali ishga tushirilgan bo'lsa signal bolaga yetmaydi — `exec` yoki `tini`/`--init` ishlatiladi","Faqat Docker'da","Faqat root bilan"],"a":1,"e":"Ko'rinishi: deploy paytida podlar 30 sekund kutib SIGKILL bilan o'ladi, ochiq so'rovlar uziladi. Tuzatish: `ENTRYPOINT [\"/app/server\"]` (exec form, shell emas) yoki `CMD exec ...`; Go binarlari signalni o'zi ishlaydi (`signal.NotifyContext`), lekin shell wrapper bo'lsa signal yo'qoladi. Zombi jarayonlar uchun `--init`."},{"l":"J","t":"mcq","tp":"IaC","d":"infra","id":30535,"n":"DO1","q":"Infrastructure as Code (IaC) nima beradi?","o":["Serverlarni qo'lda sozlashni tezlashtiradi","Infratuzilma kod sifatida versiyalanadi, review qilinadi va takrorlanadigan tarzda yaratiladi — 'snowflake' serverlar yo'qoladi","Faqat bulutda ishlaydi","Monitoring o'rnini bosadi"],"a":1,"e":"IaC: git tarixi (kim, qachon, nima o'zgartirdi), PR review, bir xil muhitlar (dev/stage/prod), tez tiklash (disaster recovery). Deklarativ (Terraform, CloudFormation — 'qanday holat kerak') va imperativ (skriptlar — 'qanday qadamlar') yondashuvlar bor."},{"l":"M","t":"mcq","tp":"IaC","d":"infra","id":30536,"n":"DO2","q":"`terraform plan` va `terraform apply` farqi?","o":["Bir xil","plan — joriy state va real resurslarni kod bilan solishtirib, qanday o'zgarish bo'lishini ko'rsatadi (hech narsa o'zgartirmaydi); apply — o'sha o'zgarishlarni bajaradi","plan faqat syntax tekshiradi","apply state faylni o'chiradi"],"a":1,"e":"CI'da odatiy oqim: PR'da plan chiqishi komment sifatida ko'rsatiladi, merge'dan keyin saqlangan plan fayl (`plan -out=tfplan`, `apply tfplan`) qo'llanadi — review qilingan va bajarilgan o'zgarish bir xil bo'lishi kafolatlanadi. `-/+` (destroy va qayta yaratish) belgisiga alohida e'tibor: DB kabi resurs uchun bu ma'lumot yo'qolishi."},{"l":"S","t":"mcq","tp":"IaC","d":"infra","id":30537,"n":"DO3","q":"Ikki muhandis bir vaqtda `terraform apply` qilsa nima bo'ladi va qanday oldini olasiz?","o":["Hech narsa, Terraform birlashtiradi","State buzilishi yoki resurslar ikki marta yaratilishi mumkin; remote backend + state locking (S3+DynamoDB, GCS, Terraform Cloud) va apply faqat CI orqali","Faqat oxirgisi saqlanadi, muammo yo'q","terraform fmt yordam beradi"],"a":1,"e":"Lock state'ni bir vaqtda faqat bitta jarayon yozishini ta'minlaydi. Qo'shimcha: state'ni muhit/komponent bo'yicha bo'lish (blast radius kichik), state ichida sirlar bo'lishi mumkin — shifrlangan backend va cheklangan kirish. `terraform force-unlock` faqat jarayon aniq o'lgan bo'lsa."},{"l":"S","t":"mcq","tp":"IaC","d":"infra","id":30538,"n":"DO4","q":"Drift nima?","o":["Terraform versiyasining eskirishi","Real infratuzilma koddan farq qilib qolishi — kimdir konsolda qo'lda o'zgartirgan; keyingi plan uni qaytarishga urinadi","Tarmoq kechikishi","Modul versiyalari mos kelmasligi"],"a":1,"e":"Aniqlash: rejali `terraform plan -detailed-exitcode` (exit 2 = farq bor) CI'da, alert bilan. Oldini olish: prod'da konsolga yozish huquqini cheklash, 'break-glass' kirish audit bilan. Qo'lda o'zgarish kerak bo'lsa — keyin albatta kodga qaytariladi yoki `terraform import` qilinadi."},{"l":"M","t":"mcq","tp":"IaC","d":"infra","id":30539,"n":"DO5","q":"Terraform va Ansible farqi?","o":["Bir xil vosita","Terraform — asosan resurslarni yaratish (provisioning, deklarativ, state bilan); Ansible — mavjud serverlarni sozlash (configuration management, agentsiz SSH, idempotent tasklar)","Ansible faqat Windows uchun","Terraform faqat Kubernetes uchun"],"a":1,"e":"Ko'p jamoada ular birga ishlatiladi: Terraform VM/tarmoq/DB yaratadi, Ansible ichini sozlaydi. Konteyner va immutable image (Packer) davrida configuration management roli kamaydi — server sozlanmaydi, yangi image bilan almashtiriladi."},{"l":"St","t":"open","tp":"IaC","d":"infra","id":30540,"n":"DO6","q":"Katta kompaniyada Terraform kodini qanday tashkil qilasan (modullar, muhitlar, state)?","m":"1) Qayta ishlatiladigan modullar alohida repo/katalogda, semver teglari bilan. 2) Muhitlar (dev/stage/prod) alohida katalog yoki workspace — lekin alohida state va alohida bulut akkauntlari (blast radius). 3) State'ni komponentlarga bo'lish (network, data, app) — kichik plan, tez, xavfsiz. 4) Remote backend + locking + shifrlash. 5) CI: fmt, validate, tflint, checkov/tfsec, plan PR'da, apply faqat merge'dan keyin va prod uchun manual approval. 6) Provider va modul versiyalarini pin qilish (.terraform.lock.hcl commit). 7) Drift tekshiruvi reja
