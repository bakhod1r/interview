hi test refactoring'da o'zgarmaydi, chunki u 'nima bo'lishi' ni tekshiradi, 'qanday qilinganini' emas. Over-mocking belgisi: test kodi `expect(repo.save).toHaveBeenCalledWith(...)` zanjiridan iborat. Almashtirish: fake/in-memory implementatsiya va natijani holat orqali tekshirish; mock faqat chetdagi tizimlarga (to'lov provayderi, email)."},{"l":"S","t":"mcq","tp":"DDD","d":"arch","id":30085,"n":"SN86","q":"Aggregate chegarasini qanday belgilaysiz?","o":["Har jadval — bitta aggregate","Invariant chegarasi bo'yicha: bitta transaksiyada birgalikda izchil bo'lishi kerak bo'lgan minimal to'plam; aggregate'lar orasida bog'lanish ID bilan va izchillik eventual","Butun bounded context bitta aggregate","UI ekranlariga qarab"],"a":1,"e":"Aggregate katta bo'lsa konkurentlik azoblanadi (bitta buyurtma ustida qulflar) va yuklash qimmatlashadi; juda kichik bo'lsa invariantni ushlab bo'lmaydi. Amaliy test: 'bu qoida buzilishi mumkin emasmi, agar ikki obyekt alohida commit qilinsa?' — mumkin bo'lmasa bir aggregate. Optimistik qulflash (`version`) aggregate darajasida qo'llanadi."},{"l":"St","t":"open","tp":"Testing","d":"arch","id":30086,"n":"SN87","q":"Flaky testlar jamoani sekinlashtirmoqda. Tizimli qanday hal qilasiz?","m":["O'lchash: har test uchun muvaffaqiyat tarixi (CI'da natijalarni saqlash), top flaky ro'yxati — his-tuyg'u emas, ma'lumot","Darhol karantin: flaky test alohida suite'ga chiqariladi, asosiy pipeline'ni bloklamaydi, lekin egasi va muddati bo'ladi","Sabablar bo'yicha tuzatish: `sleep` o'rniga aniq kutish/kanal, umumiy holat va tartibga bog'liqlik (test izolyatsiyasi), vaqt/random — inject qilinadigan clock va seed, tashqi tarmoq — test double, parallel port/DB konflikti","Reproduksiya: testni `-count=100 -race` bilan aylantirish, CI'da resurs cheklovi ostida","Siyosat: 'retry qo'shib yashirish' taqiqlanadi (retry faqat vaqtinchalik va ko'rinadigan metrikada), flaky yopilmasa test o'chiriladi — yolg'on signal noldan yomon","Natija: main branch yashil bo'lishi ishonchli bo'ladi, deploy qo'rquvi kamayadi"],"e":"Kutilayotgan fikr: flaky test — ishonch tizimidagi nosozlik, alohida bug emas. Shuning uchun javobda o'lchash, karantin, sabab tahlili va siyosat birga bo'lishi kerak."},{"l":"S","t":"mcq","tp":"Testing","d":"arch","id":30276,"n":"SN277","q":"Test piramidasi senior darajada qanday qo'llanadi?","o":["Faqat e2e test yozish — ishonch ko'proq","Ko'p unit (tez, domain mantiqiga), o'rtacha integration (DB, broker bilan testcontainers), juda kam e2e (kritik biznes yo'li). Sabab: yuqoriga chiqqan sari test sekin, mo'rt va sababni ko'rsatmaydigan bo'ladi","Faqat unit test","Teng nisbatda"],"a":1,"e":"Qo'shimcha qatlam — contract testing (Pact yoki sxema tekshiruvi): mikroservislar orasidagi kontraktni e2e'siz tekshiradi. Signal: e2e ko'p bo'lsa CI sekin va flaky bo'ladi, jamoa testga ishonmay qo'yadi. Har qatlam nimani tekshiradi — aniq javob berilishi kerak (unit: qoida, integration: SQL/mapping, e2e: yo'l butunligi)."},{"l":"S","t":"mcq","tp":"Testing","d":"arch","id":30277,"n":"SN278","q":"Konkurent kodni qanday test qilasiz?","o":["Bir necha marta qo'lda ishga tushirish","`go test -race` (CI'da majburiy), `-count=N` bilan takrorlash, sinxronizatsiya nuqtalarini test boshqaradigan qilib injektsiya (kanal/hook bilan), deterministik bo'lmagan `sleep`lardan voz kechish, va invariantni tekshiruvchi stress test (ko'p goroutine + yakuniy holat tekshiruvi)","Race detector sekin, ishlatmaslik","Faqat integration test"],"a":1,"e":"Race detector haqiqiy race'ni faqat u yuz berganda ko'radi — shuning uchun test ko'p iteratsiya va parallellik bilan bo'lishi kerak. Deterministik testlash uchun vaqt va tasodifni inject qilish (`Clock` interfeysi, seed), hamda `goleak` bilan goroutine qolmasligini tekshirish. Property-based test invariantlar uchun kuchli vosita."},{"l":"S","t":"mcq","tp":"TDD","d":"arch","id":30278,"n":"SN279","q":"Bug topildi. TDD bo'yicha to'g'ri ketma-ketlik?","o":["Darhol tuzatib deploy qilish","Avval bug'ni takrorlaydigan yiqiladigan test yozish (eng kichik miqyosda — domain darajasida bo'lsa ideal), keyin tuzatish, keyin test yashil bo'lishini ko'rish; test regressiya himoyasi sifatida qoladi","Faqat manual tekshirish","Test keyin yozilsa ham farqi yo'q"],"a":1,"e":"Yiqiladigan testni avval yozish ikki narsani isbotlaydi: sababni to'g'ri tushunganingizni va tuzatish haqiqatan ishlaganini. Agar test yozilmasa, tuzatish 'ishlaganga o'xshadi' holatida qoladi. Qo'shimcha: bug'ning sinf darajasini o'ylab, shu turdagi barcha holatlarni qamrab oladigan test yozish (masalan chegara qiymatlari)."},{"l":"M","t":"open","tp":"Domain","d":"arch","id":5027,"n":"V28","q":"Obuna (subscription) billing tizimini modellashtiring: nimalarni hisobga olasiz?","m":["Model: Plan (narx, davr), Subscription (holat: trialing/active/past_due/canceled), Invoice, Payment, PaymentAttempt","Davriy hisob-kitob: keyingi billing sanasi, vaqt zonasi va oy oxiri holatlari (31-yanvar → fevral)","Plan o'zgarishi: proration (qolgan davr uchun qayta hisob), upgrade darhol / downgrade davr oxirida","Success'siz to'lov: dunning — retry table'i, grace period, keyin to'xtatish; hodisalar bo'yicha email","Idempotentlik: har invoice/charge uchun idempotency key — takroriy yechishning oldini olish","Pul: butun son (tiyin/cent), valyuta bilan birga; hech qachon float; soliq va chegirmalar alohida qatlam","Audit: har holat o'zgarishi hodisa sifatida saqlanadi (moliyaviy tekshiruv uchun)"],"e":"Vakansiyada 'subscription-based business' yozilgan — bu savol katta ehtimol bilan beriladi. Eng kuchli signal: pulni integer saqlash, idempotentlik va past_due oqimini aytish."},{"l":"S","t":"mcq","tp":"Domain","d":"arch","id":5028,"n":"V29","q":"Cheklangan qoldiqli mahsulotni sotishda oversell'ning oldini olish uchun eng to'g'ri yondashuv?","o":["Faqat cache'dagi qoldiqqa ishonish","Qoldiqni DB'da atomik kamaytirish (UPDATE ... SET qty = qty - 1 WHERE id=? AND qty >= 1) va yangilangan row'lar sonini tekshirish; savatga qo'yishda vaqtinchalik reservation (TTL bilan)","Yozishdan oldin SELECT qilib tekshirish yetarli","Har buyurtmani qo'lda tasdiqlash"],"a":1,"e":"SELECT-keyin-UPDATE — race condition. Cache faqat ko'rsatish uchun; haqiqat DB'da. Reservation muddati tugasa avtomatik bo'shaydi (job yoki TTL). Yuqori yuk (flash sale) uchun: queue orqali seriyalashtirish yoki Redis'da atomik dekrement + keyin DB bilan yarashtirish (reconciliation)."},{"l":"S","t":"mcq","tp":"Domain","d":"arch","id":5029,"n":"V30","q":"Pul miqdorini kodda va DB'da qanday saqlash kerak?","o":["float64 / double","Eng kichik birlikda butun son (masalan cent/tiyin) yoki DECIMAL/NUMERIC; valyuta kodi bilan birga; yaxlitlash qoidasi aniq belgilangan bo'lishi kerak","string sifatida","Har ikkalasi ham farq qilmaydi"],"a":1,"e":"float ikkilik kasr — 0.1 + 0.2 ≠ 0.3; moliyada bu xato jamlanadi va hisobot mos kelmaydi. Go'da: int64 (minor units) yoki shopspring/decimal. Postgres'da NUMERIC (float emas). Valyutani miqdordan ajratmaslik: Money{Amount int64, Currency string} — turli valyutani qo'shib yuborish xatosini kompilyatsiya/tip level'ida oldini oladi."},{"l":"S","t":"mcq","tp":"Domain","d":"arch","id":30087,"n":"SN88","q":"E-commerce'da inventar rezervi: 1000 kishi bitta oxirgi mahsulotga uriladi. Qanday qilasiz?","o":["Optimistik tekshirish app'da: avval `SELECT`, keyin `UPDATE`","Atomik dekrement constraint bilan: `UPDATE stock SET qty = qty - 1 WHERE sku=$1 AND qty >= 1` va ta'sirlangan qator 0 bo'lsa rad etish; yoki Redis'da atomik hisoblagich + DB'da yakuniy tasdiq","`SELECT FOR UPDATE` butun jadvalga","Transaksiyasiz ishlash"],"a":1,"e":"Read-then-write race klassik oversell sababi. Shartli `UPDATE` bitta atomik operatsiyada tekshiradi va o'zgartiradi. Yuqori RPS'da hot row bo'ladi — chora: Redis/Lua bilan tez rad etish (arzon 'sotilib ketdi' javobi), rezervga TTL (to'lov bo'lmasa qaytariladi), va idempotency key bilan retry'da ikki marta rezerv qilinmasligi."},{"l":"S","t":"mcq","tp":"Domain","d":"arch","id":30088,"n":"SN89","q":"Buyurtma holatlari (`created → paid → shipped → delivered`) bilan ishlashda to'g'ri model?","o":["`status` ustunini har joyda `UPDATE` qilish","Aniq holat mashinasi: ruxsat etilgan o'tishlar kodda (va DB constraint/audit jadvalida), har o'tish sababi va vaqti bilan yozib boriladi, teskari o'tishlar taqiqlanadi","Status'ni frontend belgilaydi","Har holat uchun alohida jadval"],"a":1,"e":"Status erkin `UPDATE` bo'lsa: kechikkan webhook `paid` ni `created` ga qaytaradi, dublikat event ikki marta jo'natma yaratadi. Holat mashinasi + `WHERE status = $expected` shartli update (optimistik) noto'g'ri o'tishni bloklaydi; o'tishlar jurnali esa qo'llab-quvvatlash va audit uchun zarur."},{"l":"St","t":"open","tp":"Domain","d":"arch","id":30089,"n":"SN90","q":"Obuna (subscription) billing servisini loyihalang: davriy to'lov, proration, upgrade/downgrade, chek.","m":["Domain modeli: Plan (narx, interval), Subscription (holat, current_period_start/end), Invoice (qatorlari bilan), Payment, Ledger yozuvlari","Davriy hisoblash: scheduler emas, balki idempotent 'billing run' — `next_billing_at <= now` bo'yicha tanlab oladi, har obuna uchun `(subscription_id, period)` unique kaliti bilan invoice yaratadi (ikki marta yaratilmaydi)","Proration: o'rta muddatda plan o'zgarsa — ishlatilmagan qism krediti va yangi plan qismi alohida invoice qatorlari sifatida; hisob kunlarda (yoki sekundda) aniq va yaxlitlash qoidasi yozilgan","To'lov: PSP asinxron — invoice `open → paid/failed`; dunning siyosati (retry jadvali 1/3/5 kun, keyin obuna `past_due → canceled`)","Downgrade odatda davr oxirida, upgrade darhol — biznes qoidasi aniq belgilanadi","Soliq/valyuta: summalar minor unit'da, valyuta invoice darajasida qat'iy; soliq alohida qator","Idempotentlik va audit: har tashqi chaqiruvda idempotency key, har pul harakati ledger'da double-entry, hisobotlar ledger'dan olinadi (status ustunidan emas)","Vaqt zonasi va oy uzunligi edge case'lari: 31-yanvar + 1 oy = 28/29-fevral qoidasi, DST"],"e":"Bu yerda baholanadigan narsa — takroriy jarayonni idempotent qilish, pulni ledger bilan ifodalash va kalendar edge case'larini oldindan ko'rish. 'Cron yozaman va UPDATE qilaman' javobi yetarli emas."},{"l":"S","t":"mcq","tp":"Domain","d":"arch","id":30468,"n":"SN469","q":"Savat (cart) narxini qachon hisoblash kerak — ko'rsatishda yoki buyurtmada?","o":["Faqat ko'rsatishda hisoblab saqlash","Ikkalasida: ko'rsatishda joriy narx hisoblanadi, buyurtma yaratilganda narx snapshot qilinadi (mahsulot, chegirma, soliq, valyuta kursi bilan) — chunki narx keyin o'zgarishi mumkin va hisob-faktura qayta tiklanishi kerak","Faqat buyurtmada","Narx o'zgarmaydi deb hisoblash"],"a":1,"e":"Buyurtma qatoriga narx, chegirma qoidasi ID'si va soliq stavkasi yoziladi — keyin katalog o'zgarsa ham eski hisob o'zgarmaydi (audit va qaytarish uchun majburiy). Qo'shimcha nozik joy: savatda ko'rsatilgan narx bilan to'lovdagi narx farq qilsa foydalanuvchiga aniq ko'rsatish (narx o'zgardi) — jim o'zgartirish ishonchni buzadi va huquqiy muammo."},{"l":"St","t":"mcq","tp":"Domain","d":"arch","id":30469,"n":"SN470","q":"Qaytarish (refund) va bekor qilish (cancel) domen modelida qanday farqlanadi?","o":["Bir xil operatsiya","Cancel — capture'gacha, hech qanday pul harakati bo'lmaydi (hold bo'shatiladi), buyurtma `canceled` holatiga o'tadi; refund — capture'dan keyin teskari pul harakati, qisman bo'lishi mumkin, komissiya qaytmasligi mumkin va ledgerda alohida yozuv + soliq/hisobot ta'siri bor","Refund har doim to'liq","Ikkisi ham buyurtmani o'chiradi"],"a":1,"e":"Modelda ikkisi alohida hodisa sifatida saqlanadi (sabab, initsiator, summa, PSP referensi bilan). Qisman refund bo'lsa buyurtma qatorlari darajasida hisoblanadi (qaysi mahsulot qaytdi — inventar va analitika uchun). Buyurtma 'o'chirilmaydi' — holat va hodisalar tarixi saqlanadi, aks holda moliyaviy hisobot va qo'llab-quvvatlash ishlamaydi."},{"l":"S","t":"mcq","tp":"Domain","d":"arch","id":30515,"n":"SN516","q":"Chegirma va promo-kodlar mantiqini qayerga joylashtirasiz?","o":["Har joyda if bilan","Alohida pricing/promotion domeniga: qoidalar (shart, chegirma turi, cheklovlar, davr) ma'lumot sifatida, hisoblash esa sof funksiya — natija buyurtmaga snapshot qilib yoziladi (qaysi qoida qo'llanganini ko'rsatib); shunda audit, A/B va qayta hisoblash mumkin","Frontendda hisoblash","DB triggerida"],"a":1,"e":"Nozik biznes qoidalari: chegirmalarning birlashishi (stacking) ruxsat etiladimi, tartib qanday (foiz avvalmi yoki fiksirlangan), soliq chegirmadan oldinmi yoki keyin, va bir martalik kod bir vaqtda ikki buyurtmada ishlatilmasligi (atomik 'redeem' unique constraint bilan). Bu savol amalda ko'p bug keltiradigan joy."},{"l":"S","t":"mcq","tp":"Domain","d":"arch","id":30521,"n":"SN522","q":"Buyurtma va inventar alohida servislarda. 'Sotuvda yo'q' holatini qanday boshqarasiz?","o":["Buyurtmadan oldin sinxron tekshirish yetarli","Rezervatsiya naqshi: buyurtma yaratilganda inventar servisida TTL'li rezerv olinadi (atomik), to'lov tasdiqlangach rezerv iste'molga aylanadi, bekor bo'lsa yoki TTL o'tsa bo'shaydi; sinxron 'bormi?' tekshiruvi race'ni yopmaydi","Ortiqcha sotib keyin uzr so'rash","Inventarni buyurtma servisida saqlash"],"a":1,"e":"Sinxron tekshirish + keyin yozish — klassik TOCTOU race. Rezerv esa atomik operatsiya bo'lib, 'kim birinchi bo'lsa' aniqlanadi. Biznes qarori ham kerak: oversell umuman mumkin emasmi (chipta) yoki kichik ehtimol maqbulmi (tez to'ldiriladigan tovar) — bu texnik murakkablikni belgilaydi."},{"l":"M","t":"mcq","tp":"Payments","d":"arch","id":10001,"n":"P2","q":"Authorization, capture va settlement farqi?","o":["Bir xil narsaning uch nomi","Authorization — mablag' bloklanadi (hold), pul ko'chmaydi; capture — blokdan haqiqiy yechish so'raladi; settlement — banklar orasida pulning haqiqiy ko'chishi (odatda keyingi kunlar). Shuning uchun 'to'landi' holati vaqt bo'yicha bosqichma-bosqich","Settlement birinchi bo'ladi","Capture faqat qaytarishda"],"a":1,"e":"Dizaynga ta'siri: buyurtma holati va pul holati alohida modellanadi; auth muddati tugashi (odatda 7 kun) hisobga olinadi; qisman capture va qisman refund qo'llab-quvvatlanadi. Foydalanuvchi ko'radigan 'pending' summa — bank tomonidagi hold, sizning ledger'ingizda esa alohida yozuv turi."},{"l":"M","t":"mcq","tp":"Payments","d":"arch","id":10002,"n":"P3","q":"Karta ma'lumotlarini saqlash bo'yicha to'g'ri yondashuv?","o":["Shifrlab o'z bazangizda saqlash","Umuman saqlamaslik: karta ma'lumoti to'g'ridan-to'g'ri provayderga (hosted field/SDK) ketadi, sizga token qaytadi — bu PCI DSS qamrovini (scope) keskin kamaytiradi","Faqat oxirgi 4 raqamni shifrlash shart","CVV ni keyingi to'lovlar uchun saqlash"],"a":1,"e":"CVV ni avtorizatsiyadan keyin saqlash umuman taqiqlangan. Saqlash mumkin bo'lgan minimal ma'lumot: token, oxirgi 4 raqam, brend, muddat — ko'rsatish uchun. Tokenizatsiya bilan takroriy to'lov (recurring) ham ishlaydi. Qamrov kichrayganda audit va sertifikatsiya xarajati ham kamayadi (SAQ A darajasi)."},{"l":"S","t":"open","tp":"Payments","d":"arch","id":10003,"n":"P4","q":"PSP webhook'larini qanday ishonchli qabul qilasiz?","m":["Imzoni tekshirish (HMAC, timestamp bilan) — imzosiz webhook'ka ishonmaslik; replay uchun timestamp oynasi","Idempotentlik: event_id bo'yicha dedup — bir xil hodisa bir necha marta kelishi normal","Tartib kafolatlanmagan: 'succeeded' 'created' dan oldin kelishi mumkin — holat mashinasi faqat oldinga siljisin, eski hodisani rad etsin","Tez javob qaytarish (2xx) va og'ir ishni navbatga qo'yish — aks holda provayder retry qiladi","Yo'qolgan hodisalar uchun zaxira: davriy reconciliation (provayder API'sidan holatni so'rash)","Kuzatuv: ishlanmagan webhook'lar va imzo xatolari bo'yicha alert"],"e":"Webhook — at-least-once va tartibsiz. Ishonchli tizim ikki manbaga tayanadi: webhook (tez) va polling/reconciliation (kafolat). Faqat webhook'ga tayanish — pul yo'qolishining klassik sababi."},{"l":"S","t":"mcq","tp":"Payments","d":"arch","id":30090,"n":"SN91","q":"To'lov so'rovi timeout bo'ldi — PSP javobi noma'lum. To'g'ri harakat?","o":["Qayta to'lov yaratish","Aynan shu idempotency key bilan retry qilish yoki PSP'dan tranzaksiya holatini so'rash (reconcile); mahalliy holat `pending` da qoladi, yakuniy qaror webhook yoki so'rov natijasi bilan","Foydalanuvchiga 'xato' deb ko'rsatib unutish","Balansni qo'lda tuzatish"],"a":1,"e":"Timeout — 'bo'lmadi' degani emas: pul olingan bo'lishi mumkin. Shuning uchun har to'lov mahalliy `payment_intent` ID bilan boshlanadi, PSP'ga shu ID idempotency key sifatida beriladi, va noma'lum holat uchun reconciliation jarayoni (davriy `GET /charges` yoki settlement fayli bilan solishtirish) bo'ladi. Ikki marta to'lash — eng qimmat bug turi."},{"l":"S","t":"mcq","tp":"Payments","d":"arch","id":30091,"n":"SN92","q":"Kartadan pul yechishning `authorization` va `capture` bosqichlari nima beradi?","o":["Bir xil narsa, faqat nomi boshqa","Authorization mablag'ni bloklaydi (hold), capture haqiqiy yechish — tovar jo'natilganda yoki xizmat ko'rsatilganda capture qilinadi; hold muddati o'tsa avtomatik bo'shaydi (expiry)","Capture avval bo'ladi","Authorization pulni darhol o'tkazadi"],"a":1,"e":"Ikki bosqich biznes uchun muhim: buyurtma bekor bo'lsa `void` (capture'gacha) arzon va mijozga tez, `refund` (capture'dan keyin) sekin va komissiyali. Partial capture va multiple capture qo'llanishi PSP'ga bog'liq. Hold muddati (odatda 7 kun) o'tsa capture rad etiladi — shuning uchun jo'natish muddati bilan moslashtiriladi."},{"l":"St","t":"mcq","tp":"Payments","d":"arch","id":30092,"n":"SN93","q":"Chargeback (dispute) oqimini tizimda qanday qo'llab-quvvatlaysiz?","o":["Faqat pulni qaytarish","Dispute ham holat mashinasi: webhook bilan `dispute_opened` → dalil yig'ish muddati → `won/lost`; hisobda pul vaqtincha ushlanadi, ledger'da alohida yozuv (reversal + fee), va buyurtma tomonida yetkazib berish dalillari saqlanadi","Dispute'ni qo'lda Excel'da yuritish","Dispute'ni e'tiborsiz qoldirish"],"a":1,"e":"Texnik talablar: dalillar (IP, qurilma, yetkazib berish tasdig'i, shartlar qabul qilingani) audit bilan saqlanadi va muddatga bog'langan; ledger'da chargeback va uning komissiyasi alohida hisob (hech qachon asl yozuvni o'chirish emas); fraud metrikasi (dispute rate) kuzatiladi, chunki kart tizimlari chegaradan oshsa jarima qo'yadi."},{"l":"S","t":"mcq","tp":"Payments","d":"arch","id":30093,"n":"SN94","q":"PCI DSS doirasini kamaytirish uchun eng samarali qarori?","o":["Karta raqamini shifrlab o'z DB'da saqlash","Karta ma'lumotini umuman qabul qilmaslik: PSP tokenizatsiyasi (hosted field/iframe, client'dan to'g'ridan-to'g'ri PSP'ga), serverda faqat token saqlanadi","Log'larni o'chirish","Faqat HTTPS ishlatish"],"a":1,"e":"PAN tizimga kirsa — butun infra PCI doirasiga tushadi (audit, segmentatsiya, kalit boshqaruvi). Hosted fields bilan SAQ A darajasiga tushish mumkin. Qo'shimcha: CVV hech qachon saqlanmaydi, log/APM'da karta maydonlari maskalanadi, va takroriy to'lov uchun PSP tokeni (network token) ishlatiladi."},{"l":"S","t":"mcq","tp":"Payments","d":"arch","id":30462,"n":"SN463","q":"3-D Secure (SCA) to'lov oqimini qanday o'zgartiradi?","o":["Hech narsa o'zgarmaydi","To'lov sinxron tugamaydi: challenge uchun foydalanuvchi bankka yo'naltiriladi va natija redirect/webhook bilan keladi — demak `pending` holati, holat mashinasi, TTL va foydalanuvchi qaytmasa nima bo'lishi (bekor qilish yoki reconcile) oldindan aniqlanishi kerak","Faqat UI masalasi","Faqat Yevropada kartani bloklaydi"],"a":1,"e":"Muhandislik oqibatlari: buyurtma 'to'langan' deb belgilanmaydi to natija kelmaguncha; inventar rezervi challenge davomida ushlab turilishi kerak (TTL bilan); frictionless flow (challenge'siz) va exemption'lar konversiyaga ta'sir qiladi. Natija ikki kanaldan kelishi mumkin (redirect va webhook) — ikkisi ham idempotent qayta ishlanishi shart."},{"l":"St","t":"mcq","tp":"Payments","d":"arch","id":30463,"n":"SN464","q":"To'lov retry'lari (dunning) qanday loyihalanadi?","o":["Har soatda cheksiz qayta urinish","Xato turiga qarab: 'insufficient funds' — kechiktirilgan retry jadvali (1/3/5 kun); 'card expired'/'do not honor' — foydalanuvchidan yangi karta so'rash, retry befoyda; soft decline (3DS kerak) — challenge bilan qayta; har urinish va sabab kodi saqlanadi, kart tarmoqlari retry chastotasini cheklaydi","Bir marta urinib bekor qilish","Har daqiqada"],"a":1,"e":"Ko'r-ko'rona retry ikki zarar keltiradi: kart tarmog'i jarima/blok qo'yadi (yuqori decline nisbati) va mijoz bir necha marta hold ko'radi. To'g'ri yondashuv sabab kodini tasniflash (hard vs soft decline), retry oynasini kartaning to'lov kuniga moslash, va har urinishda idempotency key yangilash siyosatini aniq belgilash."},{"l":"S","t":"mcq","tp":"Payments","d":"arch","id":30513,"n":"SN514","q":"To'lov holatini nima belgilaydi: webhook, API javobi yoki ichki holat?","o":["Faqat webhook","Ichki holat mashinasi yagona haqiqat: webhook va API javobi — kirish signallari; ikkalasi ham idempotent qayta ishlanadi, tartibsiz kelishi mumkin (versiya/timestamp bilan), va hech biri kelmasa reconciliation holatni aniqlaydi","Faqat API javobi","Frontend belgilaydi"],"a":1,"e":"Webhook'ga yolg'iz ishonish klassik xato: u kechikadi, yo'qoladi, yoki tartibsiz keladi (`succeeded` dan keyin `processing`). Shuning uchun holat o'tishlari faqat oldinga (monoton) va har signal versiyasi tekshiriladi. Yakuniy himoya — davriy pull/reconcile, chunki pul masalasida 'signal kelmadi' ham holat."},{"l":"St","t":"open","tp":"Payments","d":"arch","id":30517,"n":"SN518","q":"To'lov servisida 'double charge' hodisasi bo'ldi. Qanday tekshirasiz va tuzatasiz?","m":["Darhol: ta'sir doirasini aniqlash — PSP tomonidagi tranzaksiyalarni ichki `payment_intent` bo'yicha guruhlab, bir intentga ikki charge topilganlarni ro'yxatlash (SQL bilan aniq raqam)","Mijozga ta'sir: avtomatik refund qarori (kutmasdan qaytarish odatda to'g'ri), va xabar berish; qo'llab-quvvatlash uchun ro'yxat","Sabab gipotezalari: idempotency key yuborilmagan yoki har retry'da yangi generatsiya qilingan; key faqat keshda saqlangan va evict bo'lgan; parallel so'rovlar `INSERT` dan oldin `SELECT` bilan tekshirgan (race); retry client va gateway ikkala qatlamda","Isbot: log va DB bo'yicha ikki so'rovning vaqt farqi va key qiymatlari; agar keylar farq qilsa — client tomoni, bir xil bo'lsa — server tomonidagi race","Tuzatish: `unique(idempotency_key)` DB constraint (kesh emas), `INSERT ... ON CONFLICT DO NOTHING` bilan atomik 'birinchi kim keldi', javob snapshot'ini saqlash, va PSP'ga ham idempotency key uzatish","Profilaktika: dublikat detektori (bir foydalanuvchi, bir summa, qisqa oyna) alert bilan; reconciliation kunlik; va integratsion test — parallel ikki so'rov bilan","Postmortem: nega monitoring ushlamadi (dublikat alerti yo'q edi), va action item'lar"],"e":"Pul bilan bog'liq incidentda tartib: ta'sirni o'lchash → mijozni himoya qilish (refund) → sababni dalil bilan aniqlash → DB darajasida tizimli to'siq. 'Kodni tuzatdim' javobi yetarli emas — constraint va detektor talab qilinadi."},{"l":"S","t":"mcq","tp":"Payments","d":"arch","id":30518,"n":"SN519","q":"PSP webhook imzosi qanday tekshiriladi?","o":["Faqat `Content-Type` tekshirish","Xom (raw) body ustidan HMAC hisoblash (JSON qayta serializatsiya qilingan matn emas!), constant-time solishtirish, timestamp bilan replay oynasi, va kalit rotatsiyasi uchun ikki kalitni parallel qabul qilish","Body'ni parse qilib keyin tekshirish","IP bo'yicha tekshirish yetarli"],"a":1,"e":"Eng ko'p uchraydigan xato: framework body'ni parse qilib qayta serializatsiya qiladi (probel/tartib o'zgaradi) va imza mos kelmaydi — shuning uchun raw body middleware'da saqlanishi kerak. Ikkinchi xato: `==` bilan solishtirish (timing). Uchinchisi: timestamp tekshirilmasa eski so'rov qayta yuborilishi mumkin."},{"l":"M","t":"mcq","tp":"Consistency","d":"dist","id":7002,"n":"D3","q":"N=3 nusxa, W=2 va R=2 (quorum). Bu nima beradi?","o":["Hech qanday kafolat","R + W > N bo'lgani uchun o'qish to'plami yozish to'plami bilan kamida bitta node'da kesishadi — eng so'nggi yozilgan qiymatni ko'rish kafolati kuchayadi","Faqat tezlik oshadi","Ma'lumot uch marta o'qiladi"],"a":1,"e":"Sozlash: W=1 (tez yozish, zaif o'qish kafolati), R=1 va W=N (tez o'qish, sekin yozish). Bu — Dynamo uslubidagi leaderless replikatsiya modeli (Cassandra, Riak). Diqqat: quorum ham hamma anomaliyani yopmaydi (konkurent yozishlar, sloppy quorum) — versiya (vector clock) yoki LWW bilan konflikt hal qilinadi."},{"l":"S","t":"mcq","tp":"Consensus","d":"dist","id":7003,"n":"D4","q":"Raft qanday ishlaydi?","o":["Hamma node teng, lider yo'q","Node'lar leader saylaydi (term va ovoz berish orqali); barcha yozuvlar leader log'iga tushadi va follower'larga replikatsiya qilinadi; yozuv ko'pchilik tasdiqlagach commit bo'ladi. Ko'pchilik yo'qolsa tizim yozishni to'xtatadi (konsistentlikni mavjudlikdan column qo'yadi)","Har node mustaqil qaror qiladi","Faqat ikki node kerak"],"a":1,"e":"Shuning uchun konsensus klasterlari toq sonda bo'ladi (3, 5): 3 node 1 ta yo'qotishga, 5 node 2 ta yo'qotishga chidaydi. Ishlatilishi: etcd (Kubernetes), Consul, CockroachDB, Kafka KRaft. Konsensus qimmat — uni har yozishga emas, metadata va liderlik kabi kam sonli qarorlarga qo'llash kerak.","src":"https://raft.github.io/"},{"l":"S","t":"mcq","tp":"Clocks","d":"dist","id":7005,"n":"D6","q":"Taqsimlangan tizimda hodisalar tartibini aniqlash uchun nega oddiy timestamp yetarli emas?","o":["Timestamp juda katta joy oladi","Serverlar soati bir xil emas (clock skew, NTP sakrashlari, hatto orqaga siljish) — shuning uchun 'kechroq timestamp = kechroq hodisa' deb bo'lmaydi. Sabab-oqibat tartibi uchun Lamport yoki vector clock, aniqlik kerak bo'lsa TrueTime kabi cheklangan noaniqlik","Timestamp doim aniq","Faqat replikatsiyada muammo"],"a":1,"e":"Amaliy oqibatlar: LWW (last write wins) konflikt hal qilish soatga ishonadi va yozuv 'yo'qolishi' mumkin; TTL/token muddati soat siljishida noto'g'ri hisoblanadi. Monotonic clock (Go'da time.Since) — davomiylikni o'lchash uchun; wall clock — sana ko'rsatish uchun."},{"l":"S","t":"mcq","tp":"Consistency","d":"dist","id":7006,"n":"D7","q":"Eventual consistency amalda nimani anglatadi?","o":["Ma'lumot hech qachon mos kelmaydi","Yangi yozuv bo'lmasa, nusxalar oxir-oqibat bir xil qiymatga keladi — lekin 'oxir-oqibat' qancha ekani kafolatlanmagan va oraliqda turli client turli qiymat ko'rishi mumkin","Yozish sekin bo'ladi","Faqat NoSQL'da bo'ladi"],"a":1,"e":"Yaqinlashtiruvchi mexanizmlar: read repair, anti-entropy (Merkle tree bilan solishtirish), hinted handoff. Foydalanuvchi uchun yumshatish: o'z yozganini ko'rish (read-your-writes), monotonic reads (bir sessiya orqaga ketmasin) va UI'da optimistik ko'rsatish. Qaysi ma'lumot eventual bo'lishi mumkinligi — biznes qarori."},{"l":"S","t":"mcq","tp":"Replication","d":"dist","id":7007,"n":"D8","q":"Leader-based va leaderless replikatsiya farqi?","o":["Farqi yo'q","Leader-based: hamma yozuv bitta leader orqali — tartib sodda, failover kerak (Postgres, MySQL, Kafka partition). Leaderless: har node yozuvni qabul qiladi, quorum va konflikt hal qilish bilan (Dynamo, Cassandra) — yozish mavjudligi yuqori, lekin konflikt va versiyalash murakkab","Leaderless doim tezroq","Leader-based konsistent emas"],"a":1,"e":"Uchinchi model — multi-leader (region bo'yicha), offline-first ilovalar va multi-region yozish uchun; konflikt hal qilish (CRDT, LWW, qo'lda) majburiy. Tanlov: yozish qayerdan keladi, konflikt qanchalik ehtimoliy va uni biznes qanday hal qiladi."},{"l":"St","t":"mcq","tp":"Consensus","d":"dist","id":7009,"n":"D10","q":"FLP impossibility natijasi nimani aytadi?","o":["Taqsimlangan tizim umuman ishlamaydi","To'liq asinxron network'da hatto bitta node ishdan chiqsa ham, har doim tugashi kafolatlangan deterministik konsensus algoritmi mavjud emas","Konsensus faqat ikki node bilan mumkin","Timeout ishlatish taqiqlangan"],"a":1,"e":"Amalda buni timeout va tasodifiylik bilan chetlab o'tiladi: Raft/Paxos security'ni (safety — noto'g'ri qaror bo'lmaydi) doim saqlaydi, lekin tirikligini (liveness — qaror qabul qilinadi) faqat network 'yetarlicha yaxshi' bo'lganda kafolatlaydi. Shuning uchun leader election timeout'lari va jitter muhim."},{"l":"St","t":"open","tp":"Consensus","d":"dist","id":7013,"n":"D14","q":"Taqsimlangan tizimda leader election qachon kerak va qanday tuzoqlari bor?","m":["Kerak bo'ladigan holatlar: bitta joyda bajarilishi shart bo'lgan ish (cron, kompaksiya, shard egaligi, sxema migratsiyasi)","Amalga oshirish: etcd/Consul/ZooKeeper lease yoki Kubernetes Lease obyekti; Redis lock — faqat 'optimizatsiya' level'ida","Tuzoq 1: eski leader o'zini leader deb o'ylashda davom etadi (GC, network) — fencing token bilan himoya","Tuzoq 2: lease TTL juda qisqa bo'lsa tez-tez almashinuv (flapping), uzun bo'lsa failover sekin","Tuzoq 3: leader bo'lish bilan ish boshlanmaydi — avvalgi holatni tiklash va yarim bajarilgan ishni yakunlash kerak","Muqobil: ishni partition bo'yicha bo'lish (har node o'z bo'lagiga egalik qiladi) — leader umuman kerak bo'lmasligi mumkin"],"e":"Staff signal: 'leader election kerakmi?' degan savoldan boshlash. Ko'p holatda idempotent ish + partitionlash liderlikdan sodda va ishonchli."},{"l":"S","t":"mcq","tp":"Consistency","d":"dist","id":30058,"n":"SN59","q":"Read replica'dan o'qiganda foydalanuvchi o'z yozuvini ko'rmaydi. Qanday tuzatiladi?","o":["Faqat primary'dan o'qish (boshqa yo'l yo'q)","Read-your-writes: yozuvdan keyin qisqa muddat primary'dan o'qish (sticky), yoki LSN/WAL pozitsiyasini olib replica shu nuqtaga yetganini kutish (`pg_wal_lsn_diff` / `wait_for_lsn`)","Replikani ko'paytirish","Keshni tozalash"],"a":1,"e":"Monoton kafolatlar app darajasida quriladi. Amaliy naqsh: yozuvda `pg_current_wal_lsn()` olinadi va sessiyaga (cookie/Redis) yoziladi; o'qishda replica LSN kichik bo'lsa primary'ga yo'naltiriladi. Oddiyroq variant — yozuvdan keyin N sekund sticky-primary. Muhim: bu qaror endpoint bo'yicha bo'ladi, hammasi uchun emas."},{"l":"S","t":"mcq","tp":"Consensus","d":"dist","id":30059,"n":"SN60","q":"Raft klasterida 5 nodedan 2 tasi yo'qolgan. Nima bo'ladi? 3 tasi yo'qolsa?","o":["Ikki holatda ham ishlaydi","2 yo'qolsa quorum (3) bor — yozuv davom etadi; 3 yo'qolsa quorum yo'q — yozuv to'xtaydi (availability yo'qoladi, lekin consistency saqlanadi)","Ikki holatda ham to'xtaydi","Ma'lumot yo'qoladi"],"a":1,"e":"Raft N/2+1 quorum talab qiladi: 5 node → 3. Quorum yo'qolganda yangi leader saylanmaydi va commit bo'lmaydi — bu ataylab qilingan tanlov (CP). Shuning uchun toq son (3/5) tanlanadi va nodelar failure domainlar (AZ) bo'ylab tarqatiladi; 2 AZ'ga 5 node qo'yish AZ yo'qolganda quorumni yo'qotish xavfini beradi."},{"l":"S","t":"mcq","tp":"Clocks","d":"dist","id":30060,"n":"SN61","q":"Ikki servis eventlarni `time.Now()` bilan tartiblaydi. Qanday xato kutiladi?","o":["Hech qanday","Clock skew va NTP sakrashi tufayli tartib buziladi (hatto orqaga ketadi); yechim — monoton hisoblagich, logik/Lamport soat yoki hybrid logical clock, va sabab-natija uchun versiya/sequence","Faqat yozuv sekinlashadi","UTC ishlatilsa muammo yo'q"],"a":1,"e":"Wall clock sinxronlashtirilgan bo'lsa ham millisekundlar farq qiladi; VM'da sakrash mumkin. Last-write-wins wall clock bilan — jim ma'lumot yo'qolishi. To'g'ri yo'llar: bitta manbadan sequence (DB sequence/Kafka offset), HLC (CockroachDB), yoki versiya vektori bilan konflikt aniqlash. Go'da o'lchash uchun `time.Since` monoton o'qishni ishlatadi."},{"l":"St","t":"mcq","tp":"Replication","d":"dist","id":30061,"n":"SN62","q":"PostgreSQL'da sinxron replikatsiya (`synchronous_commit = on`, `synchronous_standby_names`) qanday narxga ega?","o":["Narxi yo'q, har doim yoqilsin","Har commit standby ack'ini kutadi — yozuv latency RTT'ga bog'lanadi; standby yo'qolsa yozuv to'xtaydi (agar `ANY 1` / kvorum sozlanmagan bo'lsa)","Faqat disk hajmi oshadi","O'qish sekinlashadi"],"a":1,"e":"Tanlov: RPO=0 (ma'lumot yo'qotmaslik) uchun latency va availability qurbon qilinadi. Amaliy o'rta yo'l: `ANY 1 (s1, s2)` — ikki standbydan biri yetarli, shunda bitta node yiqilsa yozuv to'xtamaydi. Bundan tashqari `remote_write` va `remote_apply` darajalari farq qiladi: `remote_apply` o'qishda ham ko'rinishini kafolatlaydi, lekin eng sekin."},{"l":"P","t":"mcq","tp":"Consensus","d":"dist","id":30451,"n":"SN452","q":"Raft'da leader almashganda log qanday moslashtiriladi?","o":["Barcha log o'chiriladi","Yangi leader o'z log'ini haqiqat deb hisoblaydi: har follower bilan `nextIndex` orqasiga qadam tashlab mos keladigan nuqta topiladi, keyin follower'ning mos kelmaydigan yozuvlari kesiladi va leaderning yozuvlari ko'chiriladi; commit qilingan yozuv hech qachon yo'qolmaydi (saylov cheklovi buni kafolatlaydi)","Follower leader bo'ladi","Ma'lumot yo'qoladi"],"a":1,"e":"Saylov cheklovi (election restriction): faqat eng to'liq log'ga ega nomzod ovoz oladi — shuning uchun commit qilingan yozuv har doim yangi leaderda bo'ladi. Amaliy oqibat: commit qilinmagan, lekin diskka yozilgan yozuvlar yo'qolishi mumkin — shuning uchun client uchun 'commit' faqat kvorum tasdig'idan keyin."},{"l":"P","t":"mcq","tp":"Consensus","d":"dist","id":30452,"n":"SN453","q":"Raft'da linearizable o'qish qanday ta'minlanadi (va nega leaderdan o'qish yetarli emas)?","o":["Leaderdan o'qish har doim to'g'ri","Eski leader tarmoq bo'linishida o'zini hali leader deb o'ylashi mumkin — shuning uchun ReadIndex (o'qishdan oldin kvorumdan heartbeat tasdig'i) yoki leader lease ishlatiladi; follower'dan o'qish uchun esa ReadIndex'gacha log qo'llanishi kutiladi","Har o'qishni log'ga yozish","O'qish hech qachon linearizable bo'lmaydi"],"a":1,"e":"Bu etcd/Consul/CockroachDB'da real qo'llanadigan mexanizm. Lease variant tezroq (kvorum round-trip yo'q), lekin soat farqiga tayanadi — shuning uchun lease muddati konservativ tanlanadi. Amaliy xulosa: 'leaderdan o'qiyapman, demak eng yangi' degan taxmin taqsimlangan tizimda xavfli."},{"l":"S","t":"mcq","tp":"Replication","d":"dist","id":30453,"n":"SN454","q":"Kvorum formulasi `R + W > N` nimani beradi?","o":["Tezlikni","O'qish va yozish kvorumlari kesishadi — demak har o'qish kamida bitta eng yangi nusxani ko'radi (Dynamo uslubidagi tizimlarda kuchli izchillikka yaqinlik). `W=N` yozuvni qimmat, `R=1` o'qishni tez qiladi — sozlash workload'ga qarab","Ma'lumot yo'qolmasligini","Faqat 3 node uchun"],"a":1,"e":"Misol: N=3, W=2, R=2 — tipik konfiguratsiya (bitta node yiqilsa ham ishlaydi). Lekin bu 'linearizable' degani emas: konkurent yozuvlarda konflikt bo'lishi mumkin (vaqt belgisi yoki versiya vektori bilan hal qilinadi), va sloppy quorum/hinted handoff ishlatilsa kafolat yanada bo'shashadi. Cassandra'da bu `QUORUM`/`LOCAL_QUORUM` darajalari bilan sozlanadi."},{"l":"St","t":"mcq","tp":"Consistency","d":"dist","id":30454,"n":"SN455","q":"CRDT turlari va ularning chegarasi?","o":["CRDT har qanday ma'lumot uchun ishlaydi","G-Counter/PN-Counter (hisoblagich), G-Set/OR-Set (to'plam), LWW-Register, RGA/sequence (matn) — birlashtirish kommutativ, assotsiativ va idempotent bo'lgani uchun koordinatsiyasiz konvergensiya beradi. Chegara: 'balans manfiy bo'lmasin' kabi global invariantni CRDT kafolatlay olmaydi","CRDT konsensus o'rnini bosadi","Faqat matn tahririda"],"a":1,"e":"Shuning uchun pul/inventar kabi invariantli domenlarda CRDT yolg'iz yetmaydi — koordinatsiya (kvorum, rezervatsiya, escrow naqshi) kerak. CRDT ideal joylari: offline-first mobil ilova, birgalikda tahrirlash, presence, 'like' hisoblagichi. Narxi — metadata o'sishi (tombstone) va murakkab semantika (masalan o'chirish-qo'shish raqobati)."},{"l":"S","t":"mcq","tp":"Distributed","d":"dist","id":39,"n":40,"q":"CAP teoremasiga ko'ra network partition paytida tizim nimani tanlashi kerak?","o":["Consistency va Availability ikkalasini","Consistency yoki Availability — biri qurbon qilinadi","Partition tolerance'ni o'chirish","Latency va throughput"],"a":1,"e":"P ixtiyoriy emas — network baribir bo'linadi. CP: ozchilik tomon query'larni rad etadi (etcd, ZooKeeper). AP: har ikki tomon javob beradi, keyin konfliktni hal qiladi (Cassandra, Dynamo). Ko'proq nozik model — PACELC: partition bo'lmaganda ham Latency vs Consistency tanlovi bor."},{"l":"P","t":"open","tp":"Distributed","d":"dist","id":51,"n":52,"q":"Global active-active multi-region DB arxitekturasi: qaysi muammolar yuzaga keladi va qanday hal qilasiz?","m":["Yozish konfliktlari: LWW (soat drift xavfi), CRDT, yoki ma'lumotni region/user bo'yicha 'home region'ga bog'lash (konfliktdan qochish)","Kuchli konsistentlik kerak bo'lsa — konsensus (Spanner, CockroachDB), lekin cross-region yozish latency 100ms+","Data residency (GDPR, mahalliy qonunlar) — ma'lumot qayerda saqlanishi majburiy","Failover va split-brain, regionlararo trafik narxi","Ko'p hollarda active-passive yoki 'active-active o'qish, bitta regionda yozish' yetarli — murakkablikni asoslash"],"e":"Eng kuchli javob: 'active-active kerakmi?' degan savolni biznes SLA orqali tekshirish. Konfliktlarni hal qilishdan ko'ra ularning oldini olish (partitioning by home region) arzonroq."},{"l":"P","t":"mcq","tp":"Distributed","d":"dist","id":52,"n":53,"q":"Google Spanner global external consistency'ga (linearizable commit tartibi) qanday erishadi?","o":["Hamma yozishlar bitta global lider orqali","TrueTime (GPS/atom soatlar, noaniqlik oralig'i) + commit wait — noaniqlik tugaguncha kutish","Vector clock","Eventual consistency bilan"],"a":1,"e":"TrueTime [earliest, latest] oralig'ini beradi; commit timestamp tanlangach, oraliq o'tguncha kutiladi — shuning uchun keyingi transaction kattaroq timestamp oladi. Har shard ichida Paxos. CockroachDB aniq soatlarsiz HLC va uncertainty restart'lardan foydalanadi — kafolati biroz zaifroq."},{"l":"P","t":"mcq","tp":"Distributed","d":"dist","id":56,"n":57,"q":"Linearizability va serializability farqi?","o":["Bir xil narsa","Serializability — ko'p obyektli transaction'lar qandaydir ketma-ket tartibga ekvivalent; linearizability — bitta obyekt operatsiyalari real vaqt tartibiga mos (recency kafolati)","Linearizability faqat SQL DB'larda","Serializability real vaqt tartibini kafolatlaydi"],"a":1,"e":"Serializability real vaqt haqida hech narsa demaydi — transaction eskirgan snapshot'da ham serializable bo'lishi mumkin. Ikkalasi birga — strict serializability (Spanner). Principal level'da bu terminlarni aralashtirmaslik muhim."},{"l":"M","t":"mcq","tp":"Fundamentals","d":"dist","id":7000,"n":"D1","q":"'Fallacies of distributed computing' (taqsimlangan tizimlar haqidagi noto'g'ri farazlar) nimani ogohlantiradi?","o":["Network har doim ishonchli deb hisoblash mumkin","Ishlab chiquvchilar odatda noto'g'ri faraz qiladi: network ishonchli, latency nol, bandlik cheksiz, network xavfsiz, topologiya o'zgarmaydi, bitta administrator bor, transport narxi nol, network bir jinsli — har biri real tizimda buziladi","Network hech qachon ishlamaydi","Bu faqat eski tizimlarga tegishli"],"a":1,"e":"Amaliy natija: har network chaqiruvi uchta natijaga ega bo'lishi mumkin — success, xato va NOMA'LUM (timeout). Uchinchisi eng qiyin: query bajarilgan bo'lishi ham, bajarilmagan bo'lishi ham mumkin. Shuning uchun idempotentlik, deadline va retry siyosati — arxitekturaning bir qismi.","src":"https://en.wikipedia.org/wiki/Fallacies_of_distributed_computing"},{"l":"M","t":"mcq","tp":"Failure","d":"dist","id":7001,"n":"D2","q":"Node'dan javob kelmayapti. Uni 'o'lgan' deb hisoblash mumkinmi?","o":["Ha, javob yo'q — demak o'lgan","Yo'q: asinxron network'da sekin node va o'lgan node'ni ishonchli ajratib bo'lmaydi — javob kechikayotgan, network bo'lingan yoki node GC pauzasida bo'lishi mumkin. Shuning uchun timeout — taxmin, fakt emas","Faqat ping bilan aniqlanadi","Har doim aniq bilish mumkin"],"a":1,"e":"Shuning uchun failover xavfli: eski leader aslida tirik bo'lib, yozishda davom etishi mumkin (split-brain). Himoya: lease (muddatli egalik) + fencing token — resurs eski tokenli query'ni rad etadi. Heartbeat timeout'ini tanlash — tez aniqlash va noto'g'ri failover orasidagi muvozanat."},{"l":"S","t":"mcq","tp":"Failure","d":"dist","id":7004,"n":"D5","q":"Split-brain nima va undan qanday himoyalanasiz?","o":["Ma'lumot bazasi buzilishi","Network bo'linganda ikki node ham o'zini leader deb hisoblab, ikkalasi ham yozishni qabul qiladi — ma'lumot ikkiga ajraladi. Himoya: ko'pchilik (quorum) talabi, lease va fencing token, STONITH","Disk to'lishi","Sekin query'lar"],"a":1,"e":"Fencing token — eng amaliy himoya: har yangi leaderga o'suvchi raqam beriladi; storage eski raqamli query'ni rad etadi. Faqat TTL'ga tayanish yetarli emas — GC pauzasi yoki VM to'xtashi TTL'dan uzoq bo'lishi mumkin."},{"l":"S","t":"mcq","tp":"Fundamentals","d":"dist","id":7008,"n":"D9","q":"Gossip protokoli nima uchun ishlatiladi?","o":["Ma'lumotni shifrlash uchun","Node'lar tasodifiy tanlangan qo'shnilar bilan holat ma'lumotini almashadi — klaster a'zoligi va failure haqidagi xabar markaziy koordinatorsiz, epidemik tarzda tarqaladi (Cassandra, Consul, Redis Cluster)","Xabar queue'i sifatida","Faqat monitoring uchun"],"a":1,"e":"Afzalligi: markazlashmagan, katta klasterda yaxshi masshtablanadi, qisman nosozlikka chidamli. Kamchiligi: ma'lumot darhol emas, ehtimollik bilan tarqaladi (eventual). Konsensus o'rnini bosmaydi — a'zolik va sog'liq ma'lumoti uchun, qat'iy kelishuv uchun emas."},{"l":"St","t":"mcq","tp":"Fundamentals","d":"dist","id":7010,"n":"D11","q":"Mikroservislar orasida 'exactly-once' yetkazib berish mumkinmi?","o":["Ha, Kafka buni to'liq hal qilgan","Network level'ida yo'q (ikki general muammosi): amalda at-least-once yetkazish + iste'molchi tomonda idempotentlik = 'effectively once'. Kafka transaction'lari faqat Kafka ichidagi oqim uchun","Ha, TCP buni kafolatlaydi","Yo'q, faqat at-most-once mumkin"],"a":1,"e":"Amaliy retsept: har xabarga barqaror ID, iste'molchida dedup table'i yoki unique constraint, tashqi side effect uchun idempotency key. Bu savolga 'exactly-once yo'q, effectively-once bor' deb javob berish senior/staff signal."},{"l":"St","t":"open","tp":"Failure","d":"dist","id":7011,"n":"D12","q":"Gray failure (qisman failure) nima va uni qanday aniqlaysiz?","m":["Servis 'tirik' ko'rinadi (health check yashil), lekin amalda sekin yoki query'larning bir qismini yiqitmoqda","Sabablar: disk sekinlashuvi, bitta AZ'da network muammosi, GC pauzalari, issiq shard, bog'liqlik sekinligi","Aniqlash: sun'iy health check emas, real foydalanuvchi query'lari metrikasi (SLI), p99 va xato foizi; client tomonidan ko'rinadigan metrikalar","Node/AZ/shard bo'yicha kesimlar — 'o'rtacha yaxshi, lekin bitta instance yomon' holatini ko'rish","Chora: outlier detection bilan yomon instance'ni trafikdan chiqarish, circuit breaker, hedged request","Xaos testlari: sekinlik va paket yo'qotishni ataylab kiritib, tizim xulqini tekshirish"],"e":"Staff signal: 'ishlayapti/ishlamayapti' ikkilik modelidan voz kechish. Eng yomon failure — to'liq o'lim emas, yarim tirik holat: retry'lar ko'payadi va yuk zanjir bo'ylab tarqaladi."},{"l":"St","t":"mcq","tp":"Failure","d":"dist","id":7012,"n":"D13","q":"Cell-based (hujayrali) arxitektura nimani hal qiladi?","o":["Deploy tezligini","Blast radius'ni cheklaydi: tizim mustaqil 'hujayralar'ga bo'linadi (har biri to'liq stack va o'z resurslari), foydalanuvchilar hujayralarga taqsimlanadi — failure yoki yomon deploy faqat bitta hujayrani ushlaydi","Ma'lumotni shifrlaydi","Narxni ikki barobar kamaytiradi"],"a":1,"e":"Bu AWS va boshqa yirik provayderlarda keng qo'llanadigan yondashuv. Bog'liq amaliyotlar: shuffle sharding (foydalanuvchilarni tasodifiy kombinatsiyalarga joylash), hujayra bo'yicha bosqichli deploy (birinchi bitta hujayraga), hujayra ichida umumiy bog'liqliklarni minimallashtirish. Narxi: operatsion murakkablik va resurs takrorlanishi."},{"l":"S","t":"mcq","tp":"Distributed","d":"dist","id":30131,"n":"SN132","q":"Ikki generallar / FLP natijasi amaliy nimani anglatadi?","o":["Tarmoq har doim ishonchsiz, hech narsa qilib bo'lmaydi","Asinxron tizimda bitta node yiqilishi mumkin bo'lsa, kafolatlangan (har doim tugaydigan) konsensus algoritmi yo'q — shuning uchun amaliyotda timeout/failure detector bilan 'deyarli har doim tugaydigan' algoritmlar (Raft/Paxos) ishlatiladi","Konsensus imkonsiz, DB ishlatmaslik kerak","Faqat sinxron tarmoqda ma'lumot saqlanadi"],"a":1,"e":"FLP nazariy chegarani ko'rsatadi: determinizm + asinxronlik + bitta crash = kafolatlangan tugash yo'q. Raft bu chegarani randomized timeout bilan chetlab o'tadi: liveness ehtimollik bilan, safety esa har doim. Amaliy xulosa — leader saylanish paytida qisqa to'xtalish normal hodisa, uni tizim dizaynida hisobga olish kerak."},{"l":"St","t":"mcq","tp":"Failure","d":"dist","id":30132,"n":"SN133","q":"Servis 'yarim o'lik' (sekin javob beradi, lekin health check o'tadi). Bu nima uchun eng xavfli holat?","o":["Xavfli emas, LB hal qiladi","Gray failure: LB trafik yuborishda davom etadi, timeoutlar to'planadi, upstream'da resurs tugaydi — to'liq yiqilishdan ko'ra yomon. Yechim: latency asosidagi health (deep check), outlier detection va tez chiqarib tashlash","Faqat log'lar to'ladi","Avtomatik tuzaladi"],"a":1,"e":"Yiqilgan node darhol chiqariladi, sekin node esa zaharlashda davom etadi. Choralar: health check haqiqiy ishni tekshirsin (DB ping bilan, lekin dependency yiqilganda hammani o'chirib qo'ymaydigan darajada ehtiyotkor), Envoy outlier detection (xato/latency bo'yicha ejection), client-side breaker, va p99 bo'yicha alert (o'rtacha emas)."},{"l":"S","t":"mcq","tp":"Failure","d":"dist","id":30133,"n":"SN134","q":"Retry'lar bilan bog'liq 'metastable failure' (tiklanmaydigan holat) nima?","o":["Oddiy overload","Yuk tushgandan keyin ham tizim tiklanmaydi: navbatdagi va retry'dagi ishlar o'zini o'zi oziqlantiradi (kesh sovigan, navbat to'la) — trafikni sun'iy kamaytirish yoki navbatni tozalash kerak bo'ladi","Disk to'lishi","DNS muammosi"],"a":1,"e":"Klassik ko'rinish: incident'dan keyin trafik normallashdi, lekin servis hali ham 100% xato beradi — chunki sovuq kesh bilan har so'rov qimmat, retry'lar yukni ushlab turadi. Chiqish yo'li: load shedding (navbatni tashlash), trafikni bosqichma-bosqich kiritish (ramp up), kesh warm-up, va retry'ni vaqtincha o'chirish."},{"l":"S","t":"mcq","tp":"Distributed","d":"dist","id":30134,"n":"SN135","q":"'Split brain'ni oldini olish uchun fencing token nimaga kerak?","o":["Faqat log uchun","Qulf/leader egasi har yozuvda monoton o'suvchi token ko'rsatadi; saqlash qatlami eski (kichik) tokenli yozuvni rad etadi — GC pauzadan keyin 'uyqudan uyg'ongan' eski leader ma'lumotni buzmaydi","Tarmoqni tezlashtiradi","Qulfni uzaytiradi"],"a":1,"e":"Faqat TTL'ga tayanish yetmaydi: jarayon uzoq GC pauza yoki VM to'xtashidan keyin o'zini hali leader deb hisoblab yozishga urinadi. Fencing tokenni ZooKeeper/etcd (yoki DB sequence) beradi va storage tekshiradi. Bu Redlock kabi qulf sxemalarining asosiy tanqid nuqtasi."},{"l":"S","t":"mcq","tp":"Fundamentals","d":"dist","id":30135,"n":"SN136","q":"PACELC nima qo'shadi CAP'ga?","o":["Hech narsa, sinonim","Partition bo'lmaganda ham (Else) tanlov bor: Latency yoki Consistency. Ya'ni normal ish rejimida ham sinxron replikatsiya latency'ni oshiradi — tizimlar PC/EC (masalan spanner) yoki PA/EL (Dynamo) sifatida tavsiflanadi","CAP'ni bekor qiladi","Faqat NoSQL uchun"],"a":1,"e":"CAP faqat partition holatini tasvirlaydi — bu kundalik qarorlarga kam yordam beradi. PACELC amaliyroq: sizning tizim har yozuvda kvorum kutadimi (izchillik, katta latency) yoki mahalliy commit qilib keyin tarqatadimi (tez, lekin konflikt/stale). Dizayn suhbatida shu almashinuvni aniq aytish kuchli signal."},{"l":"S","t":"mcq","tp":"Fundamentals","d":"dist","id":30206,"n":"SN207","q":"Amdahl qonuni tizim dizaynida nimani aytadi?","o":["Ko'p node har doim chiziqli tezlashtiradi","Tezlashish ketma-ket (parallellashmaydigan) qism bilan cheklangan: 5% sinxron qism bo'lsa, cheksiz parallelizm ham 20x dan oshira olmaydi — shuning uchun umumiy qulf, yagona koordinator yoki bitta DB yozuv nuqtasi miqyoslashning asosiy chegarasi","Faqat CPU uchun","Xotira haqida"],"a":1,"e":"Amaliy tarjimasi: 'yana pod qo'shamiz' ishlamaydigan holatlar — barcha yozuvlar bitta primary'ga borsa, global qulf bo'lsa, yoki har so'rov markazlashgan hisoblagichni yangilasa. Shuning uchun dizaynda sharding va kontention nuqtalarini yo'q qilish birinchi o'rinda turadi (Universal Scalability Law bundan ham qattiqroq: koordinatsiya o'sishi bilan throughput tushib ketishi mumkin)."},{"l":"S","t":"mcq","tp":"Fundamentals","d":"dist","id":30207,"n":"SN208","q":"Idempotent, kommutativ va assotsiativ operatsiyalar taqsimlangan tizimda nega qadrli?","o":["Faqat matematik chiroylilik","Ular retry, tartib buzilishi va parallel birlashtirishga bardosh beradi: idempotent — takroriy yetkazib berish xavfsiz, kommutativ/assotsiativ — xabarlar tartibsiz kelsa ham natija bir xil (CRDT va agregatlar shunga tayanadi)","Faqat funksional tillarda","Faqat testda"],"a":1,"e":"Shu sabab 'set'ga qo'shish' yoki 'maksimum olish' taqsimlangan tizimda 'qiymatni o'rnatish' yoki 'hisoblagichni oshirish (LWW bilan)' dan xavfsizroq. Amaliy natija: hodisalarni shunday loyihalash kerakki, ularning qo'llanishi tartibga va takrorga sezgir bo'lmasin — shunda at-least-once yetkazib berish yetarli bo'ladi."},{"l":"S","t":"mcq","tp":"Fundamentals","d":"dist","id":30356,"n":"SN357","q":"Amdahl qonuni tizim dizaynida nimani aytadi?","o":["Ko'p node har doim chiziqli tezlashtiradi","Tezlashish ketma-ket (parallellashmaydigan) qism bilan cheklangan: 5% sinxron qism bo'lsa, cheksiz parallelizm ham 20x dan oshira olmaydi — shuning uchun umumiy qulf, yagona koordinator yoki bitta DB yozuv nuqtasi miqyoslashning asosiy chegarasi","Faqat CPU uchun","Xotira haqida"],"a":1,"e":"Amaliy tarjimasi: 'yana pod qo'shamiz' ishlamaydigan holatlar — barcha yozuvlar bitta primary'ga borsa, global qulf bo'lsa, yoki har so'rov markazlashgan hisoblagichni yangilasa. Shuning uchun dizaynda sharding va kontention nuqtalarini yo'q qilish birinchi o'rinda turadi (Universal Scalability Law bundan ham qattiqroq: koordinatsiya o'sishi bilan throughput tushib ketishi mumkin)."},{"l":"S","t":"mcq","tp":"Fundamentals","d":"dist","id":30357,"n":"SN358","q":"Idempotent, kommutativ va assotsiativ operatsiyalar taqsimlangan tizimda nega qadrli?","o":["Faqat matematik chiroylilik","Ular retry, tartib buzilishi va parallel birlashtirishga bardosh beradi: idempotent — takroriy yetkazib berish xavfsiz, kommutativ/assotsiativ — xabarlar tartibsiz kelsa ham natija bir xil (CRDT va agregatlar shunga tayanadi)","Faqat funksional tillarda","Faqat testda"],"a":1,"e":"Shu sabab 'set'ga qo'shish' yoki 'maksimum olish' taqsimlangan tizimda 'qiymatni o'rnatish' yoki 'hisoblagichni oshirish (LWW bilan)' dan xavfsizroq. Amaliy natija: hodisalarni shunday loyihalash kerakki, ularning qo'llanishi tartibga va takrorga sezgir bo'lmasin — shunda at-least-once yetkazib berish yetarli bo'ladi."},{"l":"S","t":"mcq","tp":"Distributed","d":"dist","id":30455,"n":"SN456","q":"Consistent hashing va rendezvous (HRW) hashing farqi?","o":["Bir xil algoritm","Consistent hashing: ring + virtual node'lar, O(log N) qidiruv, taqsimot virtual node soniga bog'liq; rendezvous: har kalit uchun barcha node bilan `hash(key,node)` hisoblab maksimalini tanlaydi — O(N) lekin oddiy, teng taqsimot va node qo'shilganda minimal ko'chish, hamda vaznlarni tabiiy qo'llaydi","Rendezvous eskirgan","Consistent hashing faqat Redis'da"],"a":1,"e":"Node soni kichik bo'lsa (o'nlab) rendezvous amalda qulayroq: virtual node sozlash kerak emas va taqsimot tekis. Juda ko'p node bo'lsa consistent hashing ring (yoki jump consistent hash) tezroq. Ikkisining ham asosiy maqsadi bir xil: node o'zgarganda kalitlarning faqat 1/N ulushi ko'chsin."},{"l":"St","t":"mcq","tp":"Failure","d":"dist","id":30456,"n":"SN457","q":"Tail latency bilan kurashishda 'hedged request' nima va xavfi nimada?","o":["Har so'rovni ikki marta yuborish","p95 dan keyin javob kelmasa ikkinchi nusxaga takroriy so'rov yuborish va birinchi kelgan javobni olish — p99 ni keskin yaxshilaydi; xavfi: yuk oshadi (shuning uchun faqat kichik ulushga, budjet bilan) va so'rov idempotent bo'lishi shart","Retry bilan bir xil","Faqat o'qishda mumkin emas"],"a":1,"e":"Google'ning 'The Tail at Scale' ishidan: hedging ~5% qo'shimcha yuk bilan p99 ni bir necha barobar yaxshilaydi. Shartlar: idempotentlik, hedge budjeti (umumiy trafikning foizi), va tizim to'yingan bo'lsa hedging'ni o'chirish (aks holda o'zi vaziyatni yomonlashtiradi). Yaqin variant — request cancellation: birinchi javob kelgach ikkinchisini bekor qilish."},{"l":"P","t":"mcq","tp":"Distributed gotcha","d":"dist","id":16032,"n":"E33","q":"Redis'dagi distributed lock TTL tugadi, lekin ish hali tugamagan. Nima yuz beradi?","o":["Ikkinchi worker lock'ni oladi — ikkita worker bir vaqtda ishlaydi; lock o'zi safety kafolatlamaydi, ish idempotent bo'lishi yoki fencing token ishlatilishi kerak","Redis lock'ni avtomatik uzaytiradi","Birinchi worker to'xtatiladi","Hech narsa, TTL faqat maslahat"],"a":0,"e":"Bu Kleppmann'ning Redlock tanqidining asosi: GC pauza yoki tarmoq kechikishi lock egasini 'muzlatadi', TTL tugaydi, boshqa egasi paydo bo'ladi, keyin birinchisi uyg'onib yozadi. Yechim — fencing token: lock bilan monoton o'suvchi raqam beriladi, storage eski tokenli yozuvni rad etadi. Amalda: ishni idempotent qilish + lock'ni faqat optimizatsiya (ortiqcha ishni kamaytirish) deb qarash.","src":"https://martin.kleppmann.com/2016/02/08/how-to-do-distributed-locking.html"},{"l":"P","t":"mcq","tp":"Distributed gotcha","d":"dist","id":16033,"n":"E34","q":"Kafka consumer at-least-once ishlayapti. Xabar ikki marta yetib keldi. Kim aybdor?","o":["Hech kim — at-least-once dizayni shunaqa (rebalance, offset commit'dan oldin crash); consumer idempotent bo'lishi kerak","Broker buzuq","Producer acks=0 qo'yilgan","Partition soni kam"],"a":0,"e":"Dublikat manbalari: offset commit'gacha crash; rebalance paytida in-flight xabarlar; producer retry (idempotent producer yoqilmagan bo'lsa). Yechim qatlamlari: producer'da enable.idempotence=true; consumer'da natija jadvalida unique key (message_id yoki business key) bilan ON CONFLICT DO NOTHING; yoki transactional outbox + dedup jadval. 'Exactly-once' faqat Kafka ichida (read-process-write transaction) mavjud, tashqi tizimga yozishda emas."},{"l":"P","t":"open","tp":"Distributed gotcha","d":"dist","id":16034,"n":"E35","q":"Service A dan B ga so'rov timeout bo'ldi. A retry qildi. B esa ikkala so'rovni ham bajardi. Bunday holatni tizim darajasida qanday oldini olasan?","m":"Qatlamlar: 1) B tomonda idempotency — Idempotency-Key yoki business key bo'yicha unique constraint; natija saqlanadi va takrorda qaytariladi. 2) A tomonda: timeout < B'ning ishlash vaqti bo'lmasin; deadline propagation orqali B qolgan vaqtni bilib, kech bo'lsa ishni boshlamasin. 3) Retry budjeti + exponential backoff + jitter; circuit breaker. 4) Yon ta'siri pul/tashqi API bo'lsa — ishni ikki bosqichga bo'lish (reserve/confirm) yoki outbox orqali asinxron qilish. 5) Kuzatuv: trace ID bilan dublikatni topish, duplicate_requests metrikasi.","e":"Bu 'two generals' muammosining amaliy ko'rinishi: javob yo'qolganda chaqiruvchi natijani bila olmaydi. Yagona ishonchli yechim — operatsiyani idempotent qilish yoki natijani so'rab bilish imkoni (GET /operations/{key})."},{"l":"P","t":"mcq","tp":"Distributed gotcha","d":"dist","id":16035,"n":"E36","q":"Read replica'dan o'qiganda foydalanuvchi o'zi yaratgan yozuvni ko'rmayapti. Eng to'g'ri yechim?","o":["Read-your-writes: yozgandan keyin qisqa muddat (yoki LSN/timestamp taqqoslash bilan) shu foydalanuvchi so'rovlarini primary'ga yo'naltirish","Replikatsiyani sinxron qilish (butun tizim uchun)","Cache TTL ni oshirish","Replica'ni o'chirish"],"a":0,"e":"Asinxron replikatsiyada lag normal (ms dan sekundlargacha). Amaliy naqshlar: (a) sticky-to-primary N sekund yoki sessiyadagi oxirgi write LSN'ni saqlab, replica shu LSN'ga yetganini tekshirish (Postgres: pg_last_wal_replay_lsn); (b) yozuv natijasini javobda qaytarib, UI'da optimistik ko'rsatish. Butun tizimni sinxron replikatsiyaga o'tkazish yozuv latency'sini va nosozlik ta'sirini oshiradi."},{"l":"S","t":"mcq","tp":"Distributed gotcha","d":"dist","id":16036,"n":"E37","q":"Cache invalidatsiyasida 'thundering herd' nima va qanday yopiladi?","o":["Mashhur kalit muddati tugaganda minglab so'rov bir vaqtda DB'ga uriladi; yechim: singleflight/mutex bilan bitta qayta hisob, jitterli TTL, stale-while-revalidate","Cache to'lib qolishi; yechim LRU","Redis cluster rebalance","Faqat cold start muammosi"],"a":0,"e":"Go'da golang.org/x/sync/singleflight bir kalit uchun bir vaqtda faqat bitta hisoblashni bajaradi, qolganlar shu natijani oladi. Qo'shimcha: TTL'ga tasodifiy jitter (masalan ±10%) bir vaqtda muddati tugashini yoyadi; stale qiymatni qaytarib, fon'da yangilash (stale-while-revalidate) latency spike'ni yo'qotadi; probabilistic early expiration (XFetch) ham shu muammoni yechadi."},{"l":"S","t":"mcq","tp":"Distributed gotcha","d":"dist","id":30161,"n":"SN162","q":"Two-phase commit (2PC) mikroservislarda nega kamdan-kam ishlatiladi?","o":["Sekin bo'lgani uchun faqat","Koordinator yiqilsa qatnashchilar resurslarni qulflab noma'lum holatda qoladi (blocking protokol), availability barcha qatnashchilarning ko'paytmasiga teng bo'lib pasayadi, va ko'p servis/API 2PC'ni qo'llamaydi — shuning uchun saga + idempotentlik tanlanadi","Faqat eski texnologiya","Ma'lumot yo'qotadi"],"a":1,"e":"2PC atomiklikni beradi, lekin ishlash muddatida barcha qatnashchi tirik bo'lishini talab qiladi. Amalda tanlov: bir DB ichida — oddiy tranzaksiya; servislar orasida — saga/outbox bilan eventual izchillik va biznes darajasidagi compensation. Aytish kerak bo'lgan nuqta: 2PC noto'g'ri emas, shunchaki availability narxi yuqori."},{"l":"S","t":"mcq","tp":"Distributed gotcha","d":"dist","id":30162,"n":"SN163","q":"Servis A, B, C zanjirida retry'lar bor. Nega 'retry amplification' xavfli?","o":["Xavfli emas","Har qatlam 3 marta urinsa 3×3×3 = 27 chaqiruv — sekinlashgan pastki servis butunlay yiqiladi; faqat eng chetdagi qatlam (yoki budjet bilan) retry qilishi kerak","Faqat log ko'payadi","Latency o'zgarmaydi"],"a":1,"e":"Qoida: retry bir joyda — foydalanuvchiga eng yaqin nuqtada yoki eng ichkarida, lekin barcha qatlamlarda emas. Qo'shimcha nazorat: retry budget (trafikning ~10%), `Retry-After` hurmat qilish, va serverdan 'retryable emas' signali (429/400 farqi). Incident'da birinchi choralardan biri — retry'ni vaqtincha o'chirish."},{"l":"St","t":"mcq","tp":"Distributed gotcha","d":"dist","id":30163,"n":"SN164","q":"Kesh va DB o'rtasida izchillik: `DB'ni yangilash → keshni yangilash` ketma-ketligi nega xavfli?","o":["Xavfli emas","Parallel oqimda eski qiymat keshga keyin yozilib qolishi mumkin (race) — natijada kesh jim ravishda eskirgan bo'lib qoladi; xavfsizroq: keshni o'chirish (invalidate), TTL bilan chegaralash, yoki versiyalangan yozuv","Kesh har doim to'g'ri","DB yozuvi yo'qoladi"],"a":1,"e":"Ssenariy: T1 DB'ga yangi qiymat yozdi, T2 eski qiymatni o'qib turgan edi va keshga yozdi — kesh eski. `DELETE`+TTL bu oynani ancha qisqartiradi; to'liqroq yechim — yozuvda versiya/timestamp bilan CAS (faqat yangiroq qiymat keshga tushadi) yoki keshni CDC/outbox eventidan yangilash."},{"l":"S","t":"mcq","tp":"Distributed gotcha","d":"dist","id":30311,"n":"SN312","q":"Two-phase commit (2PC) mikroservislarda nega kamdan-kam ishlatiladi?","o":["Sekin bo'lgani uchun faqat","Koordinator yiqilsa qatnashchilar resurslarni qulflab noma'lum holatda qoladi (blocking protokol), availability barcha qatnashchilarning ko'paytmasiga teng bo'lib pasayadi, va ko'p servis/API 2PC'ni qo'llamaydi — shuning uchun saga + idempotentlik tanlanadi","Faqat eski texnologiya","Ma'lumot yo'qotadi"],"a":1,"e":"2PC atomiklikni beradi, lekin ishlash muddatida barcha qatnashchi tirik bo'lishini talab qiladi. Amalda tanlov: bir DB ichida — oddiy tranzaksiya; servislar orasida — saga/outbox bilan eventual izchillik va biznes darajasidagi compensation. Aytish kerak bo'lgan nuqta: 2PC noto'g'ri emas, shunchaki availability narxi yuqori."},{"l":"S","t":"mcq","tp":"Distributed gotcha","d":"dist","id":30312,"n":"SN313","q":"Servis A, B, C zanjirida retry'lar bor. Nega 'retry amplification' xavfli?","o":["Xavfli emas","Har qatlam 3 marta urinsa 3×3×3 = 27 chaqiruv — sekinlashgan pastki servis butunlay yiqiladi; faqat eng chetdagi qatlam (yoki budjet bilan) retry qilishi kerak","Faqat log ko'payadi","Latency o'zgarmaydi"],"a":1,"e":"Qoida: retry bir joyda — foydalanuvchiga eng yaqin nuqtada yoki eng ichkarida, lekin barcha qatlamlarda emas. Qo'shimcha nazorat: retry budget (trafikning ~10%), `Retry-After` hurmat qilish, va serverdan 'retryable emas' signali (429/400 farqi). Incident'da birinchi choralardan biri — retry'ni vaqtincha o'chirish."},{"l":"St","t":"mcq","tp":"Distributed gotcha","d":"dist","id":30313,"n":"SN314","q":"Kesh va DB o'rtasida izchillik: `DB'ni yangilash → keshni yangilash` ketma-ketligi nega xavfli?","o":["Xavfli emas","Parallel oqimda eski qiymat keshga keyin yozilib qolishi mumkin (race) — natijada kesh jim ravishda eskirgan bo'lib qoladi; xavfsizroq: keshni o'chirish (invalidate), TTL bilan chegaralash, yoki versiyalangan yozuv","Kesh har doim to'g'ri","DB yozuvi yo'qoladi"],"a":1,"e":"Ssenariy: T1 DB'ga yangi qiymat yozdi, T2 eski qiymatni o'qib turgan edi va keshga yozdi — kesh eski. `DELETE`+TTL bu oynani ancha qisqartiradi; to'liqroq yechim — yozuvda versiya/timestamp bilan CAS (faqat yangiroq qiymat keshga tushadi) yoki keshni CDC/outbox eventidan yangilash."},{"l":"S","t":"mcq","tp":"Distributed gotcha","d":"dist","id":30500,"n":"SN501","q":"Ikki servis bir-birini sinxron chaqiradi (A→B va B→A). Qanday xatar?","o":["Xatar yo'q","Aylanma bog'liqlik: deadlock kabi kutish (ikkisi bir-birini kutadi va pool tugaydi), cascading failure, hamda alohida deploy qilib bo'lmaslik. Yechim — chegarani qayta chizish, event bilan asinxronlashtirish yoki umumiy ma'lumotni egalik bo'yicha ajratish","Faqat sekinlashadi","Retry bilan hal bo'ladi"],"a":1,"e":"Belgisi: incident paytida ikki servis birga yiqiladi va qaysi biri sabab ekanini aniqlab bo'lmaydi. Vaqtinchalik yumshatish — timeout va breaker; haqiqiy yechim esa domen chegarasini to'g'rilash (ko'pincha ma'lumot noto'g'ri joyda yoki bitta jarayon ikki servisga bo'lingan)."},{"l":"St","t":"mcq","tp":"Distributed gotcha","d":"dist","id":30501,"n":"SN502","q":"'Fallacies of distributed computing' ro'yxatidan qaysi biri kodda eng ko'p buziladi?","o":["Tarmoq tez","'Tarmoq ishonchli' va 'latency nol': chaqiruvlar mahalliy funksiya kabi yoziladi — timeout yo'q, xato yo'li yo'q, N+1 uzoq chaqiruv, va qisman nosozlik (partial failure) holati modellashtirilmagan","Bandwidth cheksiz","Topologiya o'zgarmaydi"],"a":1,"e":"Amaliy tekshiruv: har tashqi chaqiruvda timeout, retry siyosati, xato holatidagi xatti-harakat (degradatsiya) va idempotentlik bormi. Qisman nosozlik eng qiyin qismi: chaqiruv 'noma'lum' holatda tugashi mumkin — bu holat kodda aniq ifodalanishi kerak (`pending` + reconcile), aks holda ma'lumot nomuvofiqligi paydo bo'ladi."},{"l":"S","t":"mcq","tp":"System design","d":"sys","id":75,"n":76,"q":"Servis 99.9% SLA va'da qilgan. Bu oyiga qancha uzilish?","o":["Taxminan 5 daqiqa","Taxminan 43 daqiqa (30 kunlik oyda). 99.99% ≈ 4.3 daqiqa, 99% ≈ 7.2 soat","Taxminan 7 soat","Uzilish umuman bo'lmaydi"],"a":1,"e":"Zanjirdagi bog'liqliklar ko'paysa mavjudlik ko'paytiriladi: 99.9% bo'lgan 4 ta ketma-ket bog'liqlik ≈ 99.6%. Shuning uchun yuqori SLA uchun: ortiqchalik (redundancy), degradatsiya (bog'liqlik yiqilsa qisman ishlash), cache'dan eski javob berish. SLA — tashqi va'da, SLO — ichki maqsad (odatda qattiqroq), SLI — o'lchov."},{"l":"S","t":"open","tp":"System design","d":"sys","id":76,"n":77,"q":"Capacity estimation: 10 mln kunlik aktiv foydalanuvchili ilova uchun QPS va saqlashni qanday baholaysiz?","m":["Foydalanuvchi xatti-harakatidan boshlash: kuniga o'rtacha nechta amal (masalan 20 query) → 200 mln query/kun","O'rtacha QPS = 200M / 86 400 ≈ 2 300; peak odatda 2–5x → ~10 000 QPS","Saqlash: har yozuv hajmi × kunlik yozuvlar soni × saqlash muddati (+ index va replikatsiya koeffitsienti ~2–3x)","Bandlik: javob hajmi × QPS (masalan 10 KB × 10 000 = 100 MB/s)","Memory: issiq ma'lumot ulushi (80/20 qoidasi) — cache'ga sig'adimi","Raqamlarni yaxlitlash va taxminlarni ovoz chiqarib aytish; aniqlik emas, kattalik tartibi muhim"],"e":"Intervyuda maqsad — arifmetika emas, mantiq. Har farazni aytib boring ('20 query deb olamiz'), shunda intervyuchi kerak bo'lsa tuzatadi.","src":"https://github.com/donnemartin/system-design-primer"},{"l":"M","t":"mcq","tp":"System design","d":"sys","id":77,"n":78,"q":"Block, file va object storage farqi?","o":["Faqat narxda","Block (EBS) — xom disk bloklari, DB va OS uchun, past latency. File (NFS/EFS) — papka-fayl iyerarxiyasi, umumiy kirish. Object (S3) — key + metadata, HTTP API, deyarli cheksiz masshtab, rasm/video/backup uchun","Object storage DB o'rnini bosadi","File storage eng tez"],"a":1,"e":"Tanlov qoidasi: tez-tez qisman o'zgaradigan ma'lumot (DB fayllari) — block; ko'p mashina bir vaqtda o'qiydigan umumiy fayllar — file; katta, o'zgarmas fayllar va CDN bilan tarqatish — object. Object storage'da fayl 'o'zgartirilmaydi', qayta yoziladi; kataloglar esa faqat prefiks illyuziyasi."},{"l":"S","t":"mcq","tp":"System design","d":"sys","id":83,"n":84,"q":"Monolit, modular monolit, SOA, mikroservis va serverless — tanlovda asosiy mezon nima?","o":["Eng zamonaviysini tanlash","Jamoa hajmi va mustaqil deploy ehtiyoji, yuk profili, operatsion imkoniyat: kichik jamoa — modular monolit; ko'p jamoa va turlicha masshtab — mikroservis; hodisaga asoslangan, notekis yuk — serverless","Har doim mikroservis","Serverless har doim arzon"],"a":1,"e":"Intervyuda kuchli javob — bitta arxitekturani 'to'g'ri' deb e'lon qilmaslik, balki mezonlarni va o'tish yo'lini (modular monolitdan servislarni ajratib chiqish) aytish. Har variantning operatsion narxini nomlash ham muhim."},{"l":"St","t":"open","tp":"System design","d":"sys","id":1022,"n":"B23","q":"URL shortener (kuniga 100M yangi link, o'qish 100x ko'p) loyihalang.","m":["Hisob: 100M/kun ≈ 1.2K yozish/s, ~120K o'qish/s; 5 yilda ~180B link","ID: base62 7 belgi (62^7 ≈ 3.5T); counter/ID-range allocator yoki Snowflake — kolliziyasiz","Saqlash: key-value (DynamoDB/Cassandra) yoki shardlangan Postgres; code → url","O'qish: CDN + Redis cache (qizg'in linklar), 301 vs 302 (analitika uchun 302)","Analitika: kliklarni async (Kafka) → OLAP; abuse himoyasi, TTL"],"e":"Klassik system design. Staff signal: raqamlar bilan boshlash, ID generatsiyada kolliziya muammosini hal qilish, o'qish yo'lini asosiy qilish."},{"l":"P","t":"mcq","tp":"System design","d":"sys","id":1026,"n":"B27","q":"Query 100 ta backend'ga parallel fan-out qiladi, har birining p99 = 10ms. Umumiy query'ning taxminiy xulqi?","o":["p99 ≈ 10ms","Deyarli har query kamida bitta sekin javobni kutadi: 1 − 0.99^100 ≈ 63% query'lar p99 dan sekin — tail latency kuchayadi","p99 ≈ 1000ms (100 × 10)","Parallel bo'lgani uchun p50 ga teng"],"a":1,"e":"'Tail at scale' (Dean & Barroso). Yechimlar: hedged requests (sekin bo'lsa ikkinchi replikaga), tied requests, fan-out'ni kamaytirish, partial results bilan javob. Principal level'da p99'ni arxitektura muammosi sifatida ko'rish."},{"l":"P","t":"open","tp":"System design","d":"sys","id":1029,"n":"B30","q":"Sinxron REST zanjiridan (A→B→C→D) event-driven arxitekturaga o'tish kerakmi? Qanday qaror qilasiz?","m":["Muammo: sinxron zanjirda availability ko'paytiriladi (0.99^4 ≈ 96%), latency qo'shiladi","Event-driven: temporal decoupling, mustaqil masshtab; lekin eventual consistency, debugging qiyin, event sxemasi kontrakt","Hamma narsani emas: user darhol javob kutadigan query'lar — sinxron; side effect'lar (email, analitika) — async","Asoslar: outbox, idempotent consumer, schema registry, distributed tracing","Bosqichli: eng og'riqli zanjirdan boshlash va natijani o'lchash"],"e":"Principal signal: 'yoki-yoki' emas — har o'zaro ta'sir uchun consistency va latency talabiga qarab tanlash; operatsion narxni tan olish."},{"l":"M","t":"mcq","tp":"System design","d":"sys","id":13003,"n":"K4","q":"Load balancing algoritmlaridan qaysi biri qachon mos?","o":["Faqat round robin ishlatiladi","Round robin — bir xil quvvatli serverlar va qisqa so'rovlar uchun; weighted round robin — quvvat har xil bo'lsa; least connections — so'rov davomiyligi turlicha bo'lsa; least response time — moslashuvchan, lekin qimmatroq; power of two choices — katta masshtabda oddiy va samarali; consistent hashing / sticky — sessiya yoki kesh lokalligi kerak bo'lsa","Har doim least connections eng yaxshi","IP hash universal yechim"],"a":1,"e":"Stateless servis bo'lsa oddiy round robin yetarli — sticky session gorizontal masshtabni buzadi va deploy paytida muammo beradi. Health check bilan birga ishlashi shart: o'lik yoki sekin (outlier) instance'ni chiqarib tashlash. Uzoq yashaydigan ulanishlar (gRPC, WebSocket) uchun L4 balanslash yetarli emas.","src":"https://algomaster.io/learn/system-design/load-balancing-algorithms"},{"l":"M","t":"mcq","tp":"System design","d":"sys","id":13006,"n":"K7","q":"Vertikal va gorizontal masshtablash farqi?","o":["Bir xil","Vertikal — bitta mashinani kuchaytirish (oddiy, kod o'zgarmaydi, lekin chegarasi va yagona nosozlik nuqtasi bor). Gorizontal — mashina qo'shish (deyarli cheksiz, lekin servis stateless bo'lishi va ma'lumot taqsimlanishi kerak)","Gorizontal har doim arzonroq","Vertikal masshtablash imkonsiz"],"a":1,"e":"Amaliy tartib: avval o'lchash va optimallashtirish, keyin vertikal (tez va arzon), keyin o'qish uchun replikalar va kesh, oxirida gorizontal/sharding. Ko'p jamoa bu tartibni buzib, erta sharding qilib operatsion murakkablikni sotib oladi."},{"l":"S","t":"mcq","tp":"System design","d":"sys","id":13010,"n":"K11","q":"Latency va throughput farqi?","o":["Bir xil o'lchov","Latency — bitta so'rovga ketgan vaqt (masalan p99 200 ms). Throughput — birlik vaqtdagi ishlangan so'rovlar soni (RPS). Ular bog'liq, lekin bir-birini almashtirmaydi: batching throughput'ni oshirib, latency'ni yomonlashtirishi mumkin","Latency oshsa throughput ham oshadi","Throughput faqat tarmoqqa tegishli"],"a":1,"e":"Little qonuni: parallel ishlar soni ≈ throughput × latency. Amaliy xulosa: tizim to'yinganda latency keskin o'sadi (navbat), shuning uchun yuk testida ikkalasini birga o'lchash kerak. O'rtacha emas, persentillarga qarang."},{"l":"S","t":"open","tp":"System design","d":"sys","id":30062,"n":"SN63","q":"Kuniga 50 mln event qabul qiladigan 'notification' servisini loyihalang (email/SMS/push).","m":["Hisob: 50M/kun ≈ 580 RPS o'rtacha, peak x5 ≈ 3k RPS. Payload ~1KB → ~50GB/kun raw","Ingest: API/Kafka topic, faqat qabul qilib tasdiqlaydi (fast ack), qayta ishlash asinxron; idempotency key bilan dublikat bloklanadi","Fan-out: user preference va kanal bo'yicha yo'naltirish, per-kanal alohida topic/worker (SMS provayder sekin, push tez)","Provider chaqiruvi: rate limit (provayder kvotasi), retry + backoff, circuit breaker, DLQ; holat mashinasi (queued→sent→delivered→failed)","Deduplication va throttling: foydalanuvchini bombardimon qilmaslik — per-user window, digest/aggregation, quiet hours","Template va lokalizatsiya alohida servis; render natijasi keshlanadi","Saqlash: hodisa jurnali (Kafka retention) + status DB (partitionlangan sana bo'yicha), analitika uchun kolonkali ombor","Kuzatuv: kanal bo'yicha delivery rate, provayder latency, lag, DLQ hajmi; SLO kritik (OTP) va kritik bo'lmagan (marketing) uchun alohida yo'nalish"],"e":"Intervyuda kutiladigan ketma-ketlik: hisob-kitob → ingest/async ajratish → fan-out va prioritet → tashqi provayder ishonchsizligi (retry/DLQ/idempotency) → throttling → kuzatuv. OTP va marketing bir yo'lda ketmasligi — eng ko'p baholanadigan detal."},{"l":"S","t":"mcq","tp":"System design","d":"sys","id":30063,"n":"SN64","q":"Ko'p o'qishli feed uchun 'fan-out on write' va 'fan-out on read' orasida qanday tanlanadi?","o":["Har doim on write","On write (har follower uchun oldindan yozish) — o'qish tez, lekin mashhur akkaunt (millionlab follower) yozuvni portlatadi; on read — yozish arzon, o'qish qimmat. Amalda gibrid: oddiy foydalanuvchiga on write, celebrity'ga on read","Har doim on read","Farqi yo'q, kesh hal qiladi"],"a":1,"e":"Twitter klassik keysi. Gibridda mashhur akkaunt tweetlari o'qish vaqtida qo'shiladi, qolgani oldindan tarqatiladi. Qo'shimcha detallar: timeline Redis'da cheklangan uzunlikda (masalan oxirgi 800), sovuq foydalanuvchi uchun lazy qayta qurish, va yozuv asinxron (queue) — post qilish latency'si fan-out'ga bog'lanmaydi."},{"l":"St","t":"mcq","tp":"System design","d":"sys","id":30064,"n":"SN65","q":"URL shortener'da 100k RPS o'qish. Asosiy dizayn qarorlari?","o":["Bitta PostgreSQL yetarli","Kalit-qiymat o'qish: CDN/edge + Redis kesh (hot kalitlar), asosiy saqlash KV/DB, kalit generatsiyasi — oldindan ajratilgan diapazon (counter blok) yoki tasodifiy + unique tekshirish; 301/302 semantikasi va analitika asinxron","Har o'qishda DB'ga borish","Kalit sifatida URL hash'ini to'g'ridan-to'g'ri ishlatish"],"a":1,"e":"O'qish/yozuv nisbati juda katta (100:1+) — kesh markazda. Muhim detallar: 301 brauzerda muddatsiz keshlanadi (analitika yo'qoladi, o'zgartirish imkonsiz), shuning uchun ko'pincha 302 + qisqa TTL. Kalit generatsiyasi markazlashtirilgan counter'dan blok olish bilan koordinatsiyasiz bo'ladi; cache miss uchun negative caching (mavjud emas) ham kerak."},{"l":"S","t":"mcq","tp":"System design","d":"sys","id":30123,"n":"SN124","q":"Kesh pattern'lari: `cache-aside`, `write-through`, `write-behind` — qaysi biri ma'lumot yo'qotish xavfini keltiradi?","o":["Cache-aside","Write-behind: yozuv avval keshga tushadi va DB'ga asinxron yoziladi — kesh node yiqilsa tasdiqlangan yozuv yo'qoladi","Write-through","Hech biri"],"a":1,"e":"Write-behind eng tez, lekin durability'ni qurbon qiladi (navbat yo'qolsa ma'lumot ham). Cache-aside eng ko'p ishlatiladi (o'qishda miss → DB → keshga yozish), lekin stale va race muammosi bor: yozuvda keshni o'chirish (invalidate) qiymatni yangilashdan ishonchliroq, chunki parallel oqimda eski qiymat keshga qaytib qolishi mumkin."},{"l":"S","t":"mcq","tp":"System design","d":"sys","id":30124,"n":"SN125","q":"Consistent hashing nima muammoni yechadi va 'virtual node' nimaga kerak?","o":["Hash kolliziyasini yechadi","Node qo'shilganda/o'chganda kalitlarning faqat kichik ulushi ko'chadi (oddiy `hash % N` da deyarli hammasi); virtual node'lar esa taqsimotni tekislaydi va heterogen node sig'imini hisobga oladi","Kalitlarni siqadi","Replikatsiyani almashtiradi"],"a":1,"e":"`% N` bilan bitta node qo'shilsa deyarli butun kesh/shard qayta joylashadi — ommaviy miss va migratsiya. Ring'da har node bir necha yuz virtual nuqta oladi: tasodifiy taqsimot notekisligi kamayadi va kuchli mashinaga ko'proq nuqta berish mumkin. Dinamo uslubidagi tizimlar (Cassandra, Riak) shu asosda qurilgan."},{"l":"S","t":"mcq","tp":"System design","d":"sys","id":30125,"n":"SN126","q":"Back-of-envelope: 10 mln foydalanuvchi, har biri kuniga 20 rasm ko'radi, rasm 200KB. CDN'siz chiquvchi trafik qancha?","o":["~4 GB/kun","10M × 20 × 200KB = 40 TB/kun ≈ 3.7 Gbit/s o'rtacha, peak x3 ≈ 11 Gbit/s — demak CDN majburiy","~400 GB/kun","~4 PB/kun"],"a":1,"e":"Hisob: 200M so'rov/kun ≈ 2.3k RPS, hajm 40TB. Cloud'da chiquvchi trafik narxi eng katta xarajat bandiga aylanadi, shuning uchun CDN nafaqat latency uchun. Intervyuda shu tartibli hisobni ovoz chiqarib qilish — talab qilinadigan ko'nikma; aniq raqam emas, kattalik tartibi muhim."},{"l":"S","t":"mcq","tp":"System design","d":"sys","id":30126,"n":"SN127","q":"Servis 500 RPS ni 200ms latency bilan ishlaydi. Little's law bo'yicha qancha parallel ishlov kerak?","o":["500","L = λ × W = 500 × 0.2 = 100 parallel so'rov — demak kamida 100 ta konkurent ishlov (goroutine/ulanish) va shunga mos DB pool kerak","200","20"],"a":1,"e":"Little's law sig'imni rejalashtirishning eng tez vositasi. Amaliy natija: agar DB pool 20 ulanish bo'lsa, ishlov navbatda kutadi va latency o'sadi (navbat kutishi latency'ga qo'shiladi). Teskari yo'nalishda ham ishlatiladi: pool 20 va DB query 10ms bo'lsa maksimal throughput 2000 RPS."},{"l":"St","t":"mcq","tp":"System design","d":"sys","id":30127,"n":"SN128","q":"Yuk oshganda latency chiziqli emas, keskin portlaydi. Nazariy sabab?","o":["Kod yomon yozilgan","Navbat nazariyasi: utilizatsiya 1 ga yaqinlashganda kutish vaqti 1/(1-ρ) bo'yicha portlaydi — 80% da ~5x, 95% da ~20x. Shuning uchun headroom (odatda 50-70% target) qoldiriladi","Tarmoq MTU","GC"],"a":1,"e":"Shu sabab 'CPU 90% lekin hali joy bor' xato mulohaza: kichik burst ham navbatni portlatadi. Amaliy natijalar: autoscaling chegarasi 50-70%, o'zgaruvchanlik (variance) katta bo'lsa ko'proq headroom, va tail latency uchun hedged request yoki load shedding qo'llaniladi."},{"l":"S","t":"mcq","tp":"System design","d":"sys","id":30128,"n":"SN129","q":"Har chaqiruv p99 = 10ms. 100 ta parallel chaqiruvdan eng sekinini kutamiz. Natija p99 qancha bo'ladi?","o":["Baribir 10ms","Deyarli hamma so'rov 10ms dan oshadi: 100 chaqiruvdan kamida bittasining sekin bo'lish ehtimoli 1-0.99^100 ≈ 63% — bu 'tail amplification', shuning uchun fan-out kamaytiriladi yoki hedging/timeout qo'llaniladi","1ms","Aniqlash mumkin emas"],"a":1,"e":"Google'ning 'The Tail at Scale' ishidagi asosiy kuzatuv. Choralar: fan-out darajasini kamaytirish, qisman natija bilan javob berish (degradatsiya), hedged request (ikkinchi nusxaga p95'dan keyin yuborish), va tail'ni tuzatish (GC pauza, sovuq kesh, hot shard)."},{"l":"S","t":"mcq","tp":"System design","d":"sys","id":30129,"n":"SN130","q":"Idempotent bo'lmagan 'POST /orders' foydalanuvchi ikki marta bosdi. Eng ishonchli himoya qatlami qaysi?","o":["Frontendda tugmani o'chirish","Serverda tabiiy biznes kaliti bo'yicha unique constraint (masalan `unique(cart_id, checkout_attempt)`) yoki client bergan idempotency key — DB darajasidagi cheklov","Nginx rate limit","Kesh"],"a":1,"e":"Frontend himoyasi retry, tarmoq takrori va bot uchun ishlamaydi; rate limit tezkor ikki bosishni to'xtatmaydi. Yagona ishonchli joy — ma'lumotlar bazasidagi unique cheklov, chunki u parallel ikki tranzaksiyada ham bittasini rad etadi. Qolgan qatlamlar foydalanuvchi tajribasi uchun."},{"l":"St","t":"open","tp":"System design","d":"sys","id":30130,"n":"SN131","q":"Monolitdan mikroservislarga ajratish so'raldi. Qanday yondashasiz?","m":["Avval sabab: nima muammoni yechmoqchimiz (deploy tezligi, jamoa mustaqilligi, alohida skale)? Agar sabab 'modali' bo'lsa — ajratmaslik to'g'ri javob","Chegara: bounded context bo'yicha, ma'lumot egaligi bilan — bitta jadvalni ikki servis yozsa bu mikroservis emas, taqsimlangan monolit","Ketma-ketlik: modulli monolit (ichkarida aniq modul chegaralari va interfeyslar) → eng og'riqli moduldan boshlab ajratish (masalan og'ir yuklamali qism yoki tez o'zgaradigan qism)","Migratsiya naqshlari: strangler fig (yangi trafikni yangi servisga yo'naltirish), branch-by-abstraction, DB'ni ajratishda avval o'qish, keyin yozish, keyin ma'lumot ko'chirish","Nima qo'shiladi: tarmoq xatolari, izchillik eventual, tracing/monitoring majburiy, deploy va kontrakt versiyalash — bu narx oldindan aytiladi","O'lchov: har qadamdan keyin DORA metrikalari va incident soni — yaxshilanmasa yondashuv qayta ko'riladi","Birinchi ajratmaydigan narsalar: umumiy DB sxemasi va autentifikatsiya kabi kesishuvchi qismlar oxirida (yoki platforma sifatida) qilinadi"],"e":"Kutiladigan signal — texnologiya emas, sabab va bosqichlilik. 'Modulli monolit avval' va 'ma'lumot egaligi chegara belgilaydi' — ikki eng kuchli gap."},{"l":"S","t":"mcq","tp":"System design","d":"sys","id":30236,"n":"SN237","q":"Dizayn suhbatida birinchi 5 daqiqada nima qilinishi kerak?","o":["Darhol arxitektura chizish","Talablarni aniqlashtirish: funksional (nima kerak, nima kerak emas), nofunksional (RPS, ma'lumot hajmi, latency maqsadi, izchillik talabi, SLA), keyin kattalik tartibida hisob-kitob — shundan keyingina komponentlar
