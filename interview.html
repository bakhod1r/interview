1,1,2,3 · rk:1,1,3,4 · drk:1,2,3,4","rn:1,2,3,4 · rk:1,1,2,3 · drk:1,1,3,4","rn:1,2,3,4 · rk:1,2,3,4 · drk:1,1,2,3"],"a":0,"e":"ROW_NUMBER — doim unikal ketma-ketlik (tenglarda tartib aniqlanmagan!). RANK — tenglarga bir xil raqam, keyin sakrash (1,1,3). DENSE_RANK — sakrashsiz (1,1,2). 'Top-N per group' da tenglar ham kirishi kerak bo'lsa DENSE_RANK."},{"l":"M","t":"sql","tp":"Window","d":"db","id":17,"n":18,"q":"Har bir bo'limdan eng ko'p maosh oladigan 3 xodimni qaytaring. <code>employees(id, name, department_id, salary)</code>","m":"SELECT id, name, department_id, salary\nFROM (\n  SELECT e.*,\n         DENSE_RANK() OVER (PARTITION BY department_id\n                            ORDER BY salary DESC) AS r\n  FROM employees e\n) x\nWHERE r <= 3;","k":["OVER","PARTITION BY","ORDER BY","RANK|ROW_NUMBER"],"e":"Window funksiyani WHERE da to'g'ridan-to'g'ri ishlatib bo'lmaydi (WHERE SELECTdan oldin bajariladi) — shuning uchun subquery/CTE. Postgresda alternativ: LATERAL join bilan har bo'limga LIMIT 3 — (department_id, salary DESC) index bo'lsa juda tez."},{"l":"M","t":"sql","tp":"GROUP BY","d":"db","id":23,"n":24,"q":"<code>users(id, email)</code> da takrorlangan emaillarni va necha marta takrorlanganini toping (katta-kichik harf farqsiz).","m":"SELECT LOWER(email) AS email, COUNT(*) AS n\nFROM users\nGROUP BY LOWER(email)\nHAVING COUNT(*) > 1\nORDER BY n DESC;","k":["GROUP BY","HAVING","COUNT","LOWER"],"e":"Keyingi savol ko'pincha: 'dublikatlarni o'chiring, eng eskisini qoldiring' — ROW_NUMBER() OVER (PARTITION BY LOWER(email) ORDER BY id) > 1 bo'lganlarni DELETE. Keyin UNIQUE INDEX ON users(LOWER(email)) qo'yib muammoni ildizdan yopish."},{"l":"M","t":"code","tp":"NULL","d":"db","id":25,"n":26,"q":"<code>banned(user_id)</code> da bitta NULL qiymat bor. Natija?","c":"SELECT * FROM users\nWHERE id NOT IN (SELECT user_id FROM banned);","o":["Banned bo'lmagan hamma userlar","Bo'sh natija — hech qanday row","Xato","Faqat NULL id'li userlar"],"a":1,"e":"id NOT IN (1, NULL) ≡ id<>1 AND id<>NULL → ... AND UNKNOWN → hech qachon TRUE emas. Mashhur tuzoq. Yechim: NOT EXISTS (SELECT 1 FROM banned b WHERE b.user_id = u.id) — NULL xavfsiz va odatda anti-join sifatida yaxshi rejalanadi."},{"l":"S","t":"sql","tp":"Pagination","d":"db","id":35,"n":36,"q":"<code>posts(id, created_at, ...)</code> — OFFSET 100000 sekin. Keyset (cursor) pagination bilan keyingi 20 ta postni oling (oxirgi ko'rilgan: :last_created, :last_id).","m":"SELECT id, created_at, title\nFROM posts\nWHERE (created_at, id) < (:last_created, :last_id)\nORDER BY created_at DESC, id DESC\nLIMIT 20;\n\n-- index: CREATE INDEX ON posts (created_at DESC, id DESC);","k":["WHERE","<|>","ORDER BY","LIMIT","id"],"e":"OFFSET N hali ham N row'ni o'qib tashlaydi — O(N). Keyset indexdan to'g'ridan-to'g'ri joyga sakraydi — O(log n). id tie-breaker shart, aks holda bir xil created_at'li row'lar tushib qoladi yoki takrorlanadi. Kamchilik: ixtiyoriy page'ga sakrab bo'lmaydi."},{"l":"St","t":"code","tp":"Upsert","d":"db","id":45,"n":46,"q":"<code>key</code> allaqachon mavjud bo'lsa, bu query nima qaytaradi?","c":"INSERT INTO idempotency_keys(key, status)\nVALUES ('abc', 'in_progress')\nON CONFLICT (key) DO NOTHING\nRETURNING key;","o":["'abc' — mavjud row qaytadi","Hech qanday row (0 rows) — shu orqali 'men birinchi emasman' deb bilinadi","Unique violation xatosi","Row yangilanadi va qaytadi"],"a":1,"e":"DO NOTHING konfliktda row qaytarmaydi — bu 'lock olish' signali sifatida qulay. Mavjud row'ni ham olish kerak bo'lsa: DO UPDATE SET key = EXCLUDED.key RETURNING ... (lekin bu keraksiz yozish/dead tuple yaratadi) yoki keyin alohida SELECT."},{"l":"St","t":"sql","tp":"Upsert","d":"db","id":49,"n":50,"q":"<code>page_views(page_id PK, views)</code> — bir vaqtda minglab query keladi. Hisoblagichni atomik oshiring (row bo'lmasa yarating).","m":"INSERT INTO page_views(page_id, views)\nVALUES (:id, 1)\nON CONFLICT (page_id)\nDO UPDATE SET views = page_views.views + 1;","k":["INSERT","ON CONFLICT","DO UPDATE","+ 1|+1"],"e":"SELECT → UPDATE/INSERT ilovada race condition beradi. Upsert atomik. Staff davomi: juda hot row'da bitta row lock contention'ga aylanadi — yechim: counter'ni N ta shard row'ga bo'lib SUM qilish, yoki Redis INCR + davriy flush."},{"l":"S","t":"mcq","tp":"Window","d":"db","id":30231,"n":"SN232","q":"Har foydalanuvchining oxirgi buyurtmasini olish uchun eng samarali usul (PostgreSQL)?","o":["`GROUP BY user_id` bilan `MAX(created_at)` va keyin qayta JOIN","`DISTINCT ON (user_id) ... ORDER BY user_id, created_at DESC` (PostgreSQL-specific, index bilan juda tez) yoki window funksiya `ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY created_at DESC) = 1`; ko'p foydalanuvchi uchun `LATERAL` bilan index skip scan naqshi","Korrelyatsiyalangan subquery har doim","Barchasini olib app'da filtrlash"],"a":1,"e":"`(user_id, created_at DESC)` indeksi bo'lsa `DISTINCT ON` har guruhdan faqat birinchi qatorni o'qiydi. `MAX` + JOIN ikki marta skan qiladi va teng timestamp'larda dublikat beradi. Juda ko'p guruh bo'lsa `LATERAL` bilan 'loose index scan' (har user uchun LIMIT 1) eng tez variant bo'ladi."},{"l":"S","t":"mcq","tp":"Upsert","d":"db","id":30232,"n":"SN233","q":"`INSERT ... ON CONFLICT DO UPDATE` da qanday nozik xatarlar bor?","o":["Xatar yo'q","Unique indeks aynan konflikt maqsadiga mos bo'lishi kerak (aks holda xato yoki kutilmagan yozuv), yuqori konkurentlikda deadlock/`tuple concurrently updated` bo'lishi mumkin, va `EXCLUDED` bilan yozilgan qiymat eski qiymatni shartsiz bosib ketishi (yaxshisi `WHERE` sharti bilan)","Faqat sekin ishlaydi","Faqat PostgreSQL 9'da"],"a":1,"e":"Amaliy naqshlar: `ON CONFLICT (tenant_id, email) DO UPDATE SET ... WHERE excluded.updated_at > t.updated_at` — kechikkan yozuv yangi qiymatni buzmaydi (last-write-wins'ni vaqt bilan boshqarish). Idempotentlik uchun ko'pincha `DO NOTHING` + keyin `SELECT` yetarli, va bu deadlock ehtimolini kamaytiradi."},{"l":"S","t":"mcq","tp":"Window","d":"db","id":30381,"n":"SN382","q":"Har foydalanuvchining oxirgi buyurtmasini olish uchun eng samarali usul (PostgreSQL)?","o":["`GROUP BY user_id` bilan `MAX(created_at)` va keyin qayta JOIN","`DISTINCT ON (user_id) ... ORDER BY user_id, created_at DESC` (PostgreSQL-specific, index bilan juda tez) yoki window funksiya `ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY created_at DESC) = 1`; ko'p foydalanuvchi uchun `LATERAL` bilan index skip scan naqshi","Korrelyatsiyalangan subquery har doim","Barchasini olib app'da filtrlash"],"a":1,"e":"`(user_id, created_at DESC)` indeksi bo'lsa `DISTINCT ON` har guruhdan faqat birinchi qatorni o'qiydi. `MAX` + JOIN ikki marta skan qiladi va teng timestamp'larda dublikat beradi. Juda ko'p guruh bo'lsa `LATERAL` bilan 'loose index scan' (har user uchun LIMIT 1) eng tez variant bo'ladi."},{"l":"S","t":"mcq","tp":"Upsert","d":"db","id":30382,"n":"SN383","q":"`INSERT ... ON CONFLICT DO UPDATE` da qanday nozik xatarlar bor?","o":["Xatar yo'q","Unique indeks aynan konflikt maqsadiga mos bo'lishi kerak (aks holda xato yoki kutilmagan yozuv), yuqori konkurentlikda deadlock/`tuple concurrently updated` bo'lishi mumkin, va `EXCLUDED` bilan yozilgan qiymat eski qiymatni shartsiz bosib ketishi (yaxshisi `WHERE` sharti bilan)","Faqat sekin ishlaydi","Faqat PostgreSQL 9'da"],"a":1,"e":"Amaliy naqshlar: `ON CONFLICT (tenant_id, email) DO UPDATE SET ... WHERE excluded.updated_at > t.updated_at` — kechikkan yozuv yangi qiymatni buzmaydi (last-write-wins'ni vaqt bilan boshqarish). Idempotentlik uchun ko'pincha `DO NOTHING` + keyin `SELECT` yetarli, va bu deadlock ehtimolini kamaytiradi."},{"l":"S","t":"mcq","tp":"NULL","d":"db","id":30399,"n":"SN400","q":"Unique constraint'da NULL qanday ishlaydi (PostgreSQL)?","o":["NULL ham unique tekshiriladi, ikkinchi NULL rad etiladi","Default holatda har NULL o'ziga xos deb hisoblanadi — bir necha NULL qator qo'shilishi mumkin; PostgreSQL 15+ da `UNIQUE NULLS NOT DISTINCT` bilan bu xatti-harakat o'zgartiriladi","NULL umuman indekslanmaydi","Barcha DB'larda bir xil"],"a":1,"e":"Klassik bug: `UNIQUE (user_id, deleted_at)` bilan soft delete qilinsa, `deleted_at IS NULL` bo'lgan bir necha qator o'tib ketadi (dublikat faol yozuvlar). To'g'ri yechim — partial unique index: `CREATE UNIQUE INDEX ... ON t (user_id) WHERE deleted_at IS NULL`. Bu xulq DB'lar orasida farq qiladi, shuning uchun migratsiyada tekshiriladi."},{"l":"S","t":"mcq","tp":"SQL","d":"db","id":30400,"n":"SN401","q":"CTE (`WITH`) va subquery orasida ishlash farqi bormi (PostgreSQL)?","o":["CTE har doim tezroq","12-versiyagacha CTE optimizatsiya chegarasi edi (har doim materiallashtirilgan); 12+ da oddiy CTE inline qilinadi, lekin `MATERIALIZED`/`NOT MATERIALIZED` bilan boshqarish mumkin — rekursiv yoki bir necha marta ishlatilgan CTE materiallashtirish foydali","CTE va subquery aynan bir xil","CTE faqat rekursiya uchun"],"a":1,"e":"Amaliy natija: eski loyihalarda 'CTE bilan optimizatsiya qildim' degan hiyla (planner'ni to'xtatish) 12+ da ishlamay qolishi mumkin va plan o'zgaradi. Agar CTE natijasi bir marta hisoblanishi kerak bo'lsa (qimmat agregat, keyin ikki joyda ishlatilsa) — `MATERIALIZED` aniq yoziladi."},{"l":"S","t":"mcq","tp":"Window","d":"db","id":30434,"n":"SN435","q":"Window funksiya va `GROUP BY` farqi nimada?","o":["Bir xil natija","`GROUP BY` qatorlarni birlashtiradi (natija qatorlari kamayadi); window funksiya har qatorni saqlab, uning yonida oyna bo'yicha agregatni beradi (`SUM(...) OVER (PARTITION BY ... ORDER BY ...)`) — running total, reyting, oldingi/keyingi qiymat (`LAG`/`LEAD`) uchun","Window sekinroq va foydasiz","`GROUP BY` faqat sonlar uchun"],"a":1,"e":"Amaliy misollar: hisobdagi yurituvchi qoldiq (ledger `SUM() OVER (ORDER BY id)`), foydalanuvchi bo'yicha reyting, ikki hodisa orasidagi vaqt (`LEAD(ts) - ts`). Ishlash: window funksiya sort talab qiladi — mos indeks (`PARTITION BY` + `ORDER BY` ustunlari) bo'lsa sort tashlab ketiladi. Frame ta'rifi (`ROWS` vs `RANGE`) natijani o'zgartiradi — teng qiymatlarda `RANGE` hammasini qamrab oladi."},{"l":"S","t":"mcq","tp":"SQL","d":"db","id":30435,"n":"SN436","q":"`LATERAL` join qanday holatda kerak?","o":["Hech qachon","O'ng tomondagi subquery chap tomondagi qatorga bog'liq bo'lganda: har mijoz uchun oxirgi 3 buyurtma, har kategoriya uchun top mahsulot — ya'ni 'per-group LIMIT' naqshi","Faqat `CROSS JOIN` o'rniga","Faqat window bilan"],"a":1,"e":"Oddiy JOIN'da 'har guruhdan N ta' ni ifodalash qiyin: window funksiya bilan ham butun to'plam skanerlanadi, `LATERAL` esa har guruh uchun indeks bo'yicha faqat N qator o'qiydi — katta jadvalda bir necha tartib tez. Sintaksis: `FROM customers c, LATERAL (SELECT ... WHERE o.customer_id = c.id ORDER BY created_at DESC LIMIT 3) o`."},{"l":"J","t":"mcq","tp":"Keys","d":"db","id":0,"n":1,"q":"PRIMARY KEY va UNIQUE constraint o'rtasidagi asosiy farq?","o":["Farqi yo'q, ikkalasi ham bir xil","PRIMARY KEY NULL qabul qilmaydi va table'da faqat bitta bo'ladi; UNIQUE bir nechta bo'lishi va (ko'p DBda) NULL qabul qilishi mumkin","UNIQUE index yaratmaydi, PRIMARY KEY yaratadi","PRIMARY KEY faqat integer bo'lishi mumkin"],"a":1,"e":"PRIMARY KEY = UNIQUE + NOT NULL, table'da bittagina. UNIQUE constraint bir nechta bo'lishi mumkin va Postgres/MySQLda bir nechta NULL qiymatga ruxsat beradi (NULL ≠ NULL). Ikkalasi ham ostida unique index yaratadi. PK har qanday tipda bo'lishi mumkin (uuid, text, composite)."},{"l":"J","t":"open","tp":"Design","d":"db","id":5,"n":6,"q":"Normalizatsiya nima? 1NF, 2NF, 3NF ni misol bilan tushuntiring.","m":["1NF: har katakda atomar qiymat, takrorlanuvchi guruh yo'q (phones='1,2,3' — yomon)","2NF: 1NF + composite key bo'lsa, har non-key column butun keyga bog'liq (qisman bog'liqlik yo'q)","3NF: 2NF + tranzitiv bog'liqlik yo'q (orders.customer_city — customer orqali bog'liq, alohida table'ga)","Maqsad: takrorlanishni va update/insert/delete anomaliyalarini kamaytirish","Trade-off: ko'p JOIN; o'qish og'ir tizimlarda ongli denormalizatsiya qilinadi"],"e":"Intervyuchi ta'rifni emas, anomaliyani tushunishingizni tekshiradi: bitta faktni ikki joyda saqlasangiz, bittasini yangilab ikkinchisini unutasiz. Qisqa formula: 'key'ga, butun key'ga va faqat key'ga bog'liq'."},{"l":"J","t":"mcq","tp":"Keys","d":"db","id":10,"n":11,"q":"FOREIGN KEY asosan nima uchun kerak?","o":["Qidiruvni tezlashtirish uchun","Referential integrity: bola table'dagi qiymat ota table'da mavjud bo'lishini kafolatlash","Ma'lumotni shifrlash uchun","Table'ni shard qilish uchun"],"a":1,"e":"FK mavjud bo'lmagan user_id bilan order yaratishga yo'l qo'ymaydi, ON DELETE CASCADE/RESTRICT/SET NULL xulqini beradi. Diqqat: Postgres FK column'ga avtomatik index yaratmaydi — bola table'dagi FK column'ga index qo'yish kerak, aks holda ota row'ni o'chirishda seq scan va lock muammosi."},{"l":"M","t":"mcq","tp":"Types","d":"db","id":26,"n":27,"q":"PostgreSQLda <code>VARCHAR(255)</code> va <code>TEXT</code> performance farqi?","o":["VARCHAR ancha tez","TEXT ancha tez","Amalda farq yo'q — ikkalasi bir xil saqlanadi; VARCHAR(n) faqat uzunlik tekshiruvi qo'shadi","TEXT index qilinmaydi"],"a":2,"e":"Postgresda ikkalasi ham varlena. 255 — MySQL odati. Uzunlik chekloviga ehtiyoj bo'lsa CHECK (length(x) <= n) ham ishlaydi va o'zgartirish osonroq. CHAR(n) esa padding qiladi — deyarli hech qachon kerak emas."},{"l":"M","t":"open","tp":"Design","d":"db","id":27,"n":28,"q":"Soft delete (deleted_at column'i) — afzalliklari va kamchiliklari?","m":["+ Qayta tiklash, audit, tarix saqlanadi","− Har query'ga WHERE deleted_at IS NULL — unutish xavfi (data leak)","− UNIQUE constraint buziladi: o'chirilgan email bilan qayta ro'yxatdan o'tish → partial unique index WHERE deleted_at IS NULL","− FK/cascade ishlamaydi, table shishadi","Alternativ: archive table'ga ko'chirish yoki event/audit log; GDPR 'unutilish huquqi' — haqiqiy o'chirish kerak"],"e":"Middle/Senior farqi: kamchiliklarni aniq nomlash (unique index, GDPR). Yaxshi javob: 'default bo'yicha qilmayman, biznes talab bo'lsa partial index + view/ORM default scope bilan'."},{"l":"P","t":"mcq","tp":"Design","d":"db","id":58,"n":59,"q":"Denormalizatsiya qachon eng asosli?","o":["Har doim — JOIN sekin","O'qish yozishdan ancha ko'p, JOIN o'lchangan bottleneck, va nusxani sinxron saqlash mexanizmi aniq (trigger, event, materialized view)","Hech qachon","Faqat NoSQL'da"],"a":1,"e":"Denormalizatsiya — konsistentlik narxiga performance sotib olish. Asosiy savol: 'nusxa eskirsa kim, qanday tuzatadi?'. Birinchi qadam — materialized view yoki read model; qo'lda nusxa oxirgi chora."},{"l":"M","t":"mcq","tp":"Design","d":"db","id":13009,"n":"K10","q":"SQL va NoSQL tanlovida asosiy mezon?","o":["NoSQL yangi, shuning uchun yaxshiroq","Access pattern va konsistentlik talabi: murakkab JOIN, ad-hoc so'rov, tranzaksiya — SQL; oldindan ma'lum kalit bo'yicha juda katta masshtab, moslashuvchan hujjat yoki vaqt qatorlari — NoSQL. Jamoa tajribasi va operatsion narx ham mezon","NoSQL sxema talab qilmaydi, shuning uchun tezroq","SQL masshtablanmaydi"],"a":1,"e":"'NoSQL sxemasiz' — noto'g'ri tushuncha: sxema ilovaga ko'chadi. Bugungi Postgres JSONB bilan hujjat modelini ham beradi, shuning uchun ko'p holatda bitta relatsion DB yetadi. Intervyuda kuchli javob: konkret access pattern'larni sanab, shunga qarab tanlash."},{"l":"S","t":"mcq","tp":"Design","d":"db","id":30047,"n":"SN48","q":"Yuqori yozuv tezligidagi jadval uchun primary key sifatida qaysi tanlov yaxshiroq?","o":["Random UUIDv4 har doim","Monoton (ULID/UUIDv7 yoki bigint identity) — B-tree'da ketma-ket insert, kamroq page split va WAL; taqsimlangan tizimda global unikallik kerak bo'lsa UUIDv7","MD5(hash)","Kompozit tabiiy kalit"],"a":1,"e":"UUIDv4 tasodifiy bo'lgani uchun insert butun indeks bo'ylab tarqaladi: page split, kesh miss, WAL full-page write ko'payadi, indeks shishadi. UUIDv7/ULID vaqt prefiksi bilan lokal insert beradi. Bigint eng ixcham, lekin taxmin qilinadi (tashqi ID sifatida chiqarilmaydi) va shardlashda koordinatsiya talab qiladi."},{"l":"S","t":"mcq","tp":"Design","d":"db","id":30048,"n":"SN49","q":"Ko'p tenant'li SaaS'da ma'lumot izolyatsiyasi uchun tanlovlar va o'zaro almashinuvi?","o":["Faqat alohida DB to'g'ri","Umumiy jadval + `tenant_id` (RLS bilan) — arzon, oson migratsiya, lekin noisy neighbour va xato filtrida leak; sxema/DB per tenant — kuchli izolyatsiya, lekin migratsiya va ulanish poolini boshqarish qimmat","Har tenantga alohida ustun","tenant_id'ni faqat app'da saqlash"],"a":1,"e":"Qaror mezoni: tenant soni (10k mayda → umumiy jadval), compliance/rezidentlik talabi (alohida DB), yirik tenantlar (hybrid: kattalarga alohida). Umumiy modelda RLS + majburiy repository filtri, `(tenant_id, ...)` kompozit indeks va per-tenant kvota kerak. Hybrid eng ko'p uchraydigan yetuk yechim."},{"l":"S","t":"mcq","tp":"Types","d":"db","id":30049,"n":"SN50","q":"Pul miqdorini saqlash uchun to'g'ri tur?","o":["`float8` — tez","`numeric(19,4)` yoki eng kichik birlikdagi `bigint` (tiyin/cent) + valyuta kodi alohida ustunda","`money` turi","`text`"],"a":1,"e":"Float ikkilik kasr — 0.1+0.2 ≠ 0.3, hisob-kitob va solishtirishda xato to'planadi. `numeric` aniq, lekin sekinroq; `bigint` minor unit bilan tez va aniq (lekin bo'lish/foizda yaxlitlash siyosati aniq bo'lishi kerak). PostgreSQL `money` locale'ga bog'liq — ishlatilmaydi. Valyuta har doim miqdor bilan birga (multi-currency'da jamlash mumkin emas)."},{"l":"St","t":"mcq","tp":"Design","d":"db","id":30050,"n":"SN51","q":"'Soft delete' (`deleted_at`) joriy qilindi va muammolar boshlandi. Eng jiddiy ta'sirlar?","o":["Faqat disk hajmi","Har query'da filtr esdan chiqadi (leak), unique constraint buziladi (o'chirilgan yozuv emailni band qiladi), indekslar shishadi, FK va agregatlar noto'g'ri sanaydi","Hech qanday ta'siri yo'q","Faqat migratsiya sekinlashadi"],"a":1,"e":"Choralar: `WHERE deleted_at IS NULL` ni view yoki repository'da markazlashtirish, partial unique index (`UNIQUE (email) WHERE deleted_at IS NULL`), partial indekslar, va davriy arxivlash (alohida jadval/partition). Agar talab 'audit' bo'lsa — event log/history jadvali ko'pincha soft delete'dan to'g'riroq model."},{"l":"S","t":"mcq","tp":"Design","d":"db","id":30436,"n":"SN437","q":"Enum qiymatlarini qanday saqlash yaxshi?","o":["PostgreSQL `ENUM` turi har doim","Kichik, kamdan-kam o'zgaradigan to'plam uchun `text` + `CHECK` yoki reference jadval (FK bilan) moslashuvchan: yangi qiymat qo'shish oson, tarjima/metadata qo'shiladi; `ENUM` ixcham lekin qiymat o'chirish/tartib o'zgartirish og'riqli (ALTER TYPE cheklovlari)","`int` kod eng yaxshi","`jsonb`da saqlash"],"a":1,"e":"Amaliy tanlov: holat mashinasi qiymatlari (`created/paid/shipped`) — `text` + `CHECK` (o'qilishi oson, migratsiya yengil) yoki reference jadval; `int` kod joyni tejaydi lekin ma'lumot bazasini qo'lda o'qishni qiyinlashtiradi va kod bilan moslikni qo'lda saqlash kerak. Har uch holatda ham ilova tomonda aniq tur (Go'da `type Status string` + validatsiya) bo'lishi kerak."},{"l":"S","t":"mcq","tp":"Keys","d":"db","id":30527,"n":"SN528","q":"Tabiiy kalit (email, INN) va sun'iy kalit (surrogate) tanlovi?","o":["Tabiiy kalit har doim yaxshi","Surrogate PK (bigint/UUID) — barqaror, o'zgarmaydi, FK'lar ixcham; tabiiy kalit esa unique constraint sifatida qo'yiladi. Sabab: tabiiy qiymatlar o'zgaradi (email almashadi, INN formati o'zgaradi) va PK o'zgarishi barcha FK'ga tarqaladi","Surrogate keraksiz","Kompozit tabiiy kalit eng yaxshi"],"a":1,"e":"Qo'shimcha nuqta: tashqi API'da surrogate ID ni oshkor qilish ham qaror talab qiladi (ketma-ket bigint enumeration beradi) — public ID sifatida UUID/ULID yoki hashid ishlatiladi. Kompozit tabiiy kalitlar esa join va indekslarni og'irlashtiradi, ayniqsa uch-to'rt ustunli bo'lsa."},{"l":"St","t":"mcq","tp":"Design","d":"db","id":30528,"n":"SN529","q":"Ko'p-ko'pga (many-to-many) bog'lanishda qo'shimcha atributlar paydo bo'ldi. Nima qilinadi?","o":["Massiv ustun qo'shish","Bog'lovchi jadval mustaqil entity'ga aylanadi (masalan `enrollment` — `student_id`, `course_id`, `enrolled_at`, `status`): o'z ID'si, o'z hayot sikli va o'z qoidalari bo'ladi; domenda ham u tushuncha sifatida nomlanadi","`jsonb`ga solish","Ikki jadvalga nusxalash"],"a":1,"e":"Bu DDD'dagi muhim signal: bog'lanishning o'zi biznes tushunchasi bo'lib chiqadi ('ro'yxatdan o'tish', 'a'zolik', 'tayinlash') va u haqida hodisalar bo'ladi (bekor qilindi, uzaytirildi). Texnik tomondan ham qulay: unique constraint (`student_id, course_id`), tarix va status shu jadvalda tabiiy joylashadi."},{"l":"J","t":"open","tp":"Index","d":"db","id":12,"n":13,"q":"Index nima, qanday ishlaydi va uning narxi nima?","m":["Alohida saralangan struktura (odatda B-tree): key → row manzili (TID)","Qidiruv O(n) seq scan o'rniga O(log n)","WHERE, JOIN, ORDER BY ni tezlashtiradi","Narx: har INSERT/UPDATE/DELETE indexni ham yangilaydi — yozish sekinlashadi","Disk/memory egallaydi; past selektivlikdagi column'da (masalan boolean) foyda kam"],"e":"Yaxshi javob 'kitob oxiridagi mundarija' o'xshatishi + trade-off. Senior signal: write amplification, selektivlik, va 'ishlatilmayotgan indexlarni pg_stat_user_indexes bilan topib o'chiraman' deyish."},{"l":"M","t":"mcq","tp":"Index","d":"db","id":14,"n":15,"q":"<code>CREATE INDEX ON orders(customer_id, created_at)</code>. Qaysi query bu indexdan <b>samarali</b> foydalana olmaydi?","o":["WHERE customer_id = 5","WHERE customer_id = 5 AND created_at > now() - interval '1 day'","WHERE created_at > now() - interval '1 day'","WHERE customer_id = 5 ORDER BY created_at DESC"],"a":2,"e":"Composite B-tree 'leftmost prefix' qoidasi: index avval customer_id, keyin ichida created_at bo'yicha saralangan. Faqat created_at bo'yicha filtrda boshlang'ich nuqta yo'q. Column tartibi qoidasi: tenglik (=) column'lari oldin, diapazon/sort column'i keyin. (Postgres ba'zan butun indexni skan qiladi, lekin bu samarali emas.)"},{"l":"M","t":"open","tp":"ORM","d":"db","id":18,"n":19,"q":"N+1 query muammosi nima va uni qanday hal qilasiz?","m":["1 query ro'yxatni oladi, keyin har element uchun alohida query → N+1 round trip","Odatda ORM lazy loading sababli (post.author har loopda)","Yechim: eager loading (JOIN yoki WHERE id IN (...) batch) — include/prefetch_related/joinedload","GraphQL da DataLoader bilan batching","Aniqlash: query log, APM, testda query sonini assert qilish"],"e":"Muhim nuqta: muammo har query sekinligida emas, round-trip soni va latencyda. 100 ta 1ms query + network = 100ms+. Yaxshi javob aniqlash usulini ham aytadi."},{"l":"M","t":"mcq","tp":"Planner","d":"db","id":19,"n":20,"q":"<code>status</code> column'ida index bor, lekin <code>WHERE status='active'</code> uchun EXPLAIN <b>Seq Scan</b> ko'rsatyapti. Eng ehtimoliy sabab?","o":["Index buzilgan","Row'larning katta qismi (masalan 90%) 'active' — planner seq scanni arzonroq deb hisoblaydi","Postgres string column'da index ishlatmaydi","WHERE da tirnoq noto'g'ri"],"a":1,"e":"Past selektivlikda random I/O (index → heap) ketma-ket o'qishdan qimmat. Planner statistikaga (pg_stats) tayanadi. Agar kam uchraydigan qiymat bo'yicha qidirsangiz — partial index: CREATE INDEX ... WHERE status='pending'. Statistika eskirgan bo'lsa ANALYZE."},{"l":"M","t":"code","tp":"Index","d":"db","id":20,"n":21,"q":"<code>users(email)</code> da B-tree index bor. Bu query indexni ishlatadimi?","c":"SELECT * FROM users WHERE LOWER(email) = 'ali@x.uz';","o":["Ha, har doim","Yo'q — column'ga funksiya qo'llangan; expression index kerak: CREATE INDEX ON users (LOWER(email))","Ha, lekin faqat MySQLda","Yo'q, chunki = operatori index ishlatmaydi"],"a":1,"e":"Index email qiymatlari bo'yicha saralangan, LOWER(email) bo'yicha emas — 'non-sargable' predicate. Yechimlar: expression index, citext tipi, yoki yozishda normalizatsiya (emailni doim lowercase saqlash). Xuddi shu: WHERE created_at::date = ... yoki WHERE col + 1 = 5."},{"l":"M","t":"mcq","tp":"Index","d":"db","id":24,"n":25,"q":"'Covering index' (index-only scan) nima?","o":["Jadvaldagi hamma column'ni o'z ichiga olgan index","Query'ga kerak bo'lgan hamma column indexda bor — heapga murojaat qilmasdan javob beriladi","Bir nechta table'ni qamragan index","Primary key indexi"],"a":1,"e":"Postgres 11+: CREATE INDEX ON orders(customer_id) INCLUDE (total, status). Ogohlantirish: Postgresda index-only scan visibility map'ga bog'liq — VACUUM yaqinda ishlamagan bo'lsa baribir heapga boradi (EXPLAIN dagi 'Heap Fetches')."},{"l":"S","t":"mcq","tp":"Index","d":"db","id":36,"n":37,"q":"<code>jsonb</code> column'da <code>data @> '{\"tags\":[\"sql\"]}'</code> va full-text qidiruv uchun qaysi index turi mos?","o":["B-tree","Hash","GIN","BRIN"],"a":2,"e":"GIN — inverted index: bitta row'da ko'p key (array elementlari, jsonb key'lari, lexeme'lar). B-tree — tartib/diapazon. BRIN — juda katta, tabiiy tartiblangan (append-only vaqt) table'lar uchun juda kichik index. GiST — geometriya, range, nearest-neighbor. GIN kamchiligi: yozish qimmat (fastupdate/pending list)."},{"l":"J","t":"mcq","tp":"Index","d":"db","id":60,"n":61,"q":"B-tree index qidiruvni nega tezlashtiradi?","o":["Ma'lumotni siqadi","Qiymatlar saralangan daraxtda saqlanadi — har bosqichda qidiruv maydoni ko'p marta qisqaradi, 1 mln row'da ~3–4 page o'qish yetarli (O(log n))","Hamma row'ni memory'ga yuklaydi","Faqat hash hisoblaydi"],"a":1,"e":"O'xshatish: telefon kitobi alifbo tartibida — 'Karimov'ni topish uchun hamma page'ni o'qimaysiz, o'rtasini ochib, yarmini tashlaysiz. B-tree: root → ichki page'lar → leaf; leaf'da key + row manzili (TID). Leaf'lar bir-biriga ulangan — shuning uchun diapazon (BETWEEN, >, <) va ORDER BY ham tez. Indexsiz — Seq Scan: 1 mln row'ni birma-bir tekshirish."},{"l":"J","t":"mcq","tp":"Index","d":"db","id":61,"n":62,"q":"<code>users</code> table'i 10 mln row. Qaysi column'ga index eng ko'p foyda beradi?","o":["is_active (true/false, 95% true)","gender (3 xil qiymat)","email (har user uchun unikal, login'da qidiriladi)","created_by_admin (hech qachon WHERE'da ishlatilmaydi)"],"a":2,"e":"Ikki savol bering: 1) Bu column WHERE/JOIN/ORDER BY'da tez-tez ishlatiladimi? 2) Selektivligi yuqorimi (bitta qiymat kam row'ni beradimi)? email — ikkalasiga ha. is_active=true 95% row'ni qaytaradi — index foydasiz, planner baribir Seq Scan tanlaydi. Istisno: kam qiymat (is_active=false 5%) bo'yicha qidirsangiz — partial index."},{"l":"M","t":"code","tp":"Index","d":"db","id":62,"n":63,"q":"EXPLAIN natijasida quyidagilar nimani bildiradi?","c":"1) Seq Scan on orders\n2) Index Scan using orders_customer_idx on orders\n3) Index Only Scan using orders_cust_total_idx on orders\n4) Bitmap Heap Scan on orders\n     -> Bitmap Index Scan on orders_status_idx","o":["Hammasi bir xil, faqat nomi boshqa","1 — butun table ketma-ket; 2 — indexdan topib har row uchun table'ga boradi; 3 — javob faqat indexdan, table'ga bormaydi; 4 — indexdan manzillarni yig'ib, page'larni tartib bilan o'qiydi (o'rta selektivlik uchun)","2 va 3 da table o'qilmaydi","4 — xato, index buzilgan"],"a":1,"e":"Tezlik taxminan: Index Only < Index Scan < Bitmap < Seq Scan (kam row uchun). Lekin ko'p row kerak bo'lsa Seq Scan eng arzon bo'lishi mumkin — planner to'g'ri qilgan. Bitmap — 'qaysi page'lar kerak'ni avval belgilab, keyin har page'ni bir marta o'qiydi; bir nechta indexni AND/OR bilan birlashtira oladi. EXPLAIN ANALYZE haqiqiy vaqt va row sonini ko'rsatadi — 'rows' taxmini va 'actual rows' keskin farq qilsa, statistika eskirgan (ANALYZE)."},{"l":"M","t":"mcq","tp":"Index","d":"db","id":63,"n":64,"q":"<code>name</code> column'ida B-tree index bor. Qaysi query indexdan foydalana <b>olmaydi</b>?","o":["WHERE name = 'Ali'","WHERE name LIKE 'Ali%'","WHERE name LIKE '%li'","WHERE name > 'A' AND name < 'B'"],"a":2,"e":"B-tree prefiks bo'yicha saralangan — 'Ali%' boshlanishini biladi, '%li' esa istalgan joyda bo'lishi mumkin, boshlang'ich nuqta yo'q. (Postgres'da 'Ali%' uchun ham C collation yoki text_pattern_ops kerak bo'lishi mumkin.) '%li%' qidiruv uchun: pg_trgm + GIN index yoki full-text search."},{"l":"M","t":"mcq","tp":"Index","d":"db","id":64,"n":65,"q":"<code>jobs</code> table'ida 50 mln row, faqat ~1000 tasi <code>status='pending'</code>. Worker'lar doim pending'larni oladi. Eng yaxshi index?","o":["CREATE INDEX ON jobs(status)","CREATE INDEX ON jobs(created_at) WHERE status = 'pending'","Index kerak emas","CREATE INDEX ON jobs USING hash(id)"],"a":1,"e":"Partial index faqat shartga mos row'larni saqlaydi — 50 mln emas, ~1000 yozuv: juda kichik, tez, memory'da turadi. Job bajarilib status o'zgarsa, yozuv indexdan chiqadi. Query: WHERE status='pending' ORDER BY created_at LIMIT 10 FOR UPDATE SKIP LOCKED — queue uchun klassik. Shart: query'dagi WHERE index shartiga mos bo'lishi kerak."},{"l":"M","t":"code","tp":"Index","d":"db","id":65,"n":66,"q":"Index: <code>(a, b, c)</code>. Qaysi query'lar indexdan to'liq (hamma shart uchun) foydalanadi?","c":"Q1: WHERE a = 1 AND b = 2 AND c = 3\nQ2: WHERE a = 1 AND c = 3\nQ3: WHERE b = 2 AND c = 3\nQ4: WHERE a = 1 AND b > 5 AND c = 3","o":["Hammasi","Faqat Q1 to'liq; Q2 va Q4 — faqat boshlang'ich qismi bilan qidiradi (a / a,b), qolgan shart index ichida filtr; Q3 — samarali emas","Q1 va Q3","Faqat Q3"],"a":1,"e":"Composite index telefon kitobiga o'xshaydi: familiya (a) → ism (b) → otasining ismi (c). Familiyasiz (Q3) ism bo'yicha qidirib bo'lmaydi. Q2: b tashlab ketilgan — a bo'yicha topadi, c ni birma-bir tekshiradi. Q4: b diapazon — diapazondan keyingi column (c) qidiruvda ishlatilmaydi. Qoida: tenglik column'lari oldinga, diapazon oxiriga: (a, c, b) Q4 uchun yaxshiroq."},{"l":"M","t":"sql","tp":"Index","d":"db","id":66,"n":67,"q":"Bu query uchun eng mos indexni yozing:<br><code>SELECT * FROM orders WHERE customer_id = $1 AND status = 'paid' ORDER BY created_at DESC LIMIT 10;</code>","m":"CREATE INDEX CONCURRENTLY orders_cust_status_created_idx\n  ON orders (customer_id, status, created_at DESC);","k":["CREATE INDEX","customer_id","status","created_at"],"e":"Tartib: avval tenglik column'lari (customer_id, status), keyin ORDER BY column'i (created_at). Shunda DB indexda to'g'ri joyga sakraydi va 10 ta row'ni tayyor tartibda oladi — alohida Sort yo'q, LIMIT darhol to'xtaydi. Agar created_at birinchi bo'lsa — butun indexni aylanib chiqish kerak bo'lardi. Production'da CONCURRENTLY — yozishni bloklamaslik uchun."},{"l":"S","t":"mcq","tp":"Index","d":"db","id":67,"n":68,"q":"Table'da 15 ta index bor, INSERT/UPDATE sekinlashdi. Asosiy sabab va birinchi qadam?","o":["Index ko'pligi faqat disk joyiga ta'sir qiladi","Har yozish har bir indexni yangilaydi (write amplification), HOT update imkoniyati kamayadi; pg_stat_user_indexes'da idx_scan = 0 bo'lgan va dublikat (prefiks bir xil) indexlarni topib o'chirish","Hamma indexni REINDEX qilish","Table'ni partition qilish"],"a":1,"e":"Index (a) va (a, b) bo'lsa — (a) ko'pincha ortiqcha. idx_scan = 0 — hech kim ishlatmagan (lekin statistika reset vaqtini va replicalarni tekshiring). Har index bufer memory'ni ham egallaydi. O'chirishdan oldin: unique/constraint indexlarga tegmang."},{"l":"J","t":"open","tp":"Planner","d":"db","id":68,"n":69,"q":"EXPLAIN va EXPLAIN ANALYZE farqi nima va natijada nimalarga qaraysiz?","m":["EXPLAIN — reja va taxminiy narx, query bajarilmaydi; EXPLAIN ANALYZE — haqiqatda bajaradi (UPDATE/DELETE'ni transaction'da ROLLBACK bilan!)","Scan turi: Seq Scan katta table'da — shubhali","rows (taxmin) va actual rows farqi katta bo'lsa — statistika eskirgan, ANALYZE","Eng qimmat tugun (actual time), Sort / Hash diskka tushishi (external merge)","BUFFERS opsiyasi — qancha page o'qildi"],"e":"Rejani ichkaridan tashqariga (eng ichki tugundan) o'qing. Amaliy mashq: explain.depesz.com yoki explain.dalibo.com ga reja qo'yib ko'ring — vizual ko'rinadi."},{"l":"M","t":"mcq","tp":"ORM","d":"db","id":84,"n":85,"q":"ORM ishlatishning asosiy xavfi nima?","o":["Sekin kompilyatsiya","Yaratilayotgan SQL ko'rinmay qoladi: N+1 query'lar, keraksiz column'lar (SELECT *), lazy loading transaction'dan tashqarida, va noto'g'ri transaction chegaralari","ORM'lar xavfsiz emas","ORM indexlarni o'chiradi"],"a":1,"e":"Amaliy qoida: ORM CRUD uchun, murakkab query uchun qo'lda SQL (Go'da sqlc/sqlx, boshqa tillarda query builder). Har feature uchun log'da yaratilgan SQL'ni ko'rib chiqish odat bo'lishi kerak; testda query'lar sonini assert qilish N+1 ni qaytib kelishidan saqlaydi. ORM SQL bilishni almashtirmaydi — intervyuda aynan shuni tekshirishadi."},{"l":"M","t":"mcq","tp":"Planner","d":"db","id":86,"n":87,"q":"Ilova sekin. DB tomonida profil qilishni qayerdan boshlaysiz (PostgreSQL)?","o":["Serverga ko'proq RAM qo'shish","pg_stat_statements — umumiy vaqt bo'yicha eng qimmat query'larni topish (nafaqat eng sekin bitta bajarilish, balki chastota × vaqt), keyin o'sha query'larga EXPLAIN (ANALYZE, BUFFERS)","Hamma table'ga index qo'yish","Barcha query'larni keshlash"],"a":1,"e":"Muhim nuqta: 5 ms lik query soniyasiga 10 000 marta bajarilsa, 2 soniyalik hisobotdan qimmatroq. Qo'shimcha asboblar: auto_explain (sekin rejalarni logga yozish), log_min_duration_statement, pg_stat_activity (hozir nima ishlayapti), wait event'lar. Optimallashtirishdan oldin o'lchash — asosiy tartib."},{"l":"J","t":"mcq","tp":"Index","d":"db","id":101,"n":102,"q":"PostgreSQL va MySQL (InnoDB) da primary key indexi qanday farq qiladi?","o":["Ikkalasida bir xil","Postgres: table — tartibsiz heap, hamma indexlar (PK ham) alohida strukturada va row manzilini (TID) saqlaydi. InnoDB: table PK bo'yicha clustered — row'lar PK tartibida saqlanadi, ikkilamchi indexlar esa PK qiymatini saqlaydi","Postgres'da index yo'q","InnoDB'da PK index yaratmaydi"],"a":1,"e":"Amaliy oqibat InnoDB'da: ikkilamchi index bo'yicha qidiruv ikki bosqichli (index → PK → clustered index), shuning uchun PK qisqa bo'lgani yaxshi (UUID v4 — yomon: katta va tasodifiy, page'larni parchalaydi). Postgres'da esa CLUSTER buyrug'i bir martalik va avtomatik saqlanmaydi."},{"l":"J","t":"mcq","tp":"Index","d":"db","id":102,"n":103,"q":"<code>UNIQUE constraint</code> va <code>UNIQUE INDEX</code> farqi (PostgreSQL)?","o":["Umuman boshqa narsalar","Amalda constraint ostida unique index yaratiladi; farq — constraint katalogda e'lon qilinadi va FK uchun manba bo'la oladi, index esa partial (WHERE) yoki expression bo'lishi mumkin — constraint bunday bo'la olmaydi","Index tezroq tekshiradi","Constraint indexsiz ishlaydi"],"a":1,"e":"Shuning uchun 'faqat o'chirilmagan userlar orasida email unikal' talabi constraint bilan emas, partial unique index bilan yechiladi: CREATE UNIQUE INDEX ... ON users (email) WHERE deleted_at IS NULL. ON CONFLICT bilan ishlatish uchun index ifodasi query'dagi ifodaga mos bo'lishi kerak."},{"l":"M","t":"code","tp":"Index","d":"db","id":103,"n":104,"q":"EXPLAIN quyidagini ko'rsatyapti. Muammo va yechim?","c":"EXPLAIN SELECT * FROM events ORDER BY created_at DESC LIMIT 10;\n\nLimit\n  ->  Sort  (cost=250000.00..250010.00)\n        Sort Key: created_at DESC\n        ->  Seq Scan on events  (rows=5000000)","o":["Hammasi normal, LIMIT 10 tez ishlaydi","5 mln row o'qilib to'liq saralanmoqda, faqat keyin 10 tasi olinmoqda. created_at bo'yicha index qo'yilsa, planner indexdan tayyor tartibda 10 ta row'ni oladi va Sort yo'qoladi","LIMIT ni oshirish kerak","work_mem ni kamaytirish kerak"],"a":1,"e":"Rejadagi 'Sort' + 'Seq Scan' + ORDER BY + LIMIT — indexsizlikning klassik imzosi. B-tree ikki tomonlama o'qiy oladi, shuning uchun (created_at) indexi DESC uchun ham ishlaydi. Aralash tartib (ORDER BY a ASC, b DESC) bo'lsa — index ham (a ASC, b DESC) bo'lishi kerak."},{"l":"M","t":"mcq","tp":"Index","d":"db","id":104,"n":105,"q":"<code>WHERE a = 1 AND b = 2</code> uchun bitta (a,b) index yaxshimi yoki alohida (a) va (b) indexlari?","o":["Alohida indexlar doim yaxshi","(a,b) composite yaxshiroq: bitta strukturadan to'g'ridan-to'g'ri kerakli row'lar topiladi. Alohida indexlar bo'lsa Postgres BitmapAnd bilan birlashtiradi — ishlaydi, lekin sekinroq","Farqi yo'q","Ikkita index memory tejaydi"],"a":1,"e":"Qoida: ko'p uchraydigan query shablonini qoplaydigan composite index. Bonus: (a,b) indexi (a) bo'yicha query'larni ham qoplaydi — alohida (a) index ortiqcha bo'lib qoladi. Lekin har xil shartlar ko'p bo'lsa (a=?, b=?, c=?) hammasi uchun alohida composite yaratish ham yozishni sekinlashtiradi — eng muhim 2–3 tasini tanlash kerak."},{"l":"M","t":"mcq","tp":"Index","d":"db","id":105,"n":106,"q":"PostgreSQL B-tree indexi NULL qiymatlarni saqlaydimi?","o":["Yo'q, NULLlar indexga tushmaydi","Ha — shuning uchun WHERE col IS NULL ham indexdan foydalana oladi (Oracle'da esa oddiy B-tree NULLni saqlamaydi)","Faqat unique indexda saqlaydi","NULL indexni buzadi"],"a":1,"e":"Bog'liq nozik nuqta: unique index bir nechta NULLga ruxsat beradi, chunki NULL ≠ NULL. 'Bitta aktiv yozuv' talabi kerak bo'lsa NULLS NOT DISTINCT (Postgres 15+) yoki partial unique index ishlatiladi. Tartibda NULL joyi: ASC da oxirida, kerak bo'lsa NULLS FIRST/LAST bilan boshqariladi va index ham shu tartibda yaratilishi mumkin."},{"l":"M","t":"sql","tp":"Index","d":"db","id":106,"n":107,"q":"Email katta-kichik harf farqisiz unikal bo'lsin, lekin faqat o'chirilmagan (deleted_at IS NULL) foydalanuvchilar orasida. Indexni yozing.","m":"CREATE UNIQUE INDEX CONCURRENTLY users_email_lower_active_idx\n  ON users (LOWER(email))\n  WHERE deleted_at IS NULL;","k":["CREATE UNIQUE INDEX","LOWER","WHERE","deleted_at"],"e":"Bu bitta indexda ikki texnika: expression (LOWER) va partial (WHERE). Query ham shu ifodaga mos bo'lishi kerak: WHERE LOWER(email) = LOWER($1) AND deleted_at IS NULL. Muqobil: citext tipi yoki emailni yozishda normalizatsiya qilish (ko'pincha eng sodda va ishonchli yo'l)."},{"l":"S","t":"mcq","tp":"Index","d":"db","id":107,"n":108,"q":"Milliardlab row'li, faqat qo'shiladigan (append-only) va <code>created_at</code> bo'yicha tabiiy tartiblangan table'da sana diapazoni bo'yicha qidiruv uchun qaysi index turi juda kam joy egallaydi?","o":["B-tree","Hash","BRIN (Block Range INdex) — har blok diapazoni uchun min/max saqlaydi, hajmi juda kichik","GIN"],"a":2,"e":"BRIN faqat ma'lumot jismoniy tartibda saqlansa yaxshi ishlaydi (vaqt bo'yicha o'suvchi log table'lari) — aks holda deyarli foydasiz. B-tree aniqroq, lekin katta table'da gigabaytlab joy oladi. Tez-tez UPDATE bo'ladigan table'da tartib buziladi va BRIN samarasi tushadi."},{"l":"S","t":"mcq","tp":"Index","d":"db","id":108,"n":109,"q":"Index vaqt o'tib 'shishib' (bloat) ketdi va sekinlashdi. Production'da nima qilasiz?","o":["Indexni DROP qilib qayta yaratish (uzoq vaqt yozish bloklanadi)","REINDEX INDEX CONCURRENTLY (Postgres 12+) — yozishni bloklamaydi; sabablarini ham ko'rish kerak: tez-tez UPDATE, autovacuum yetishmasligi, uzoq transaction'lar","VACUUM FULL har kuni ishlatish","Hech narsa qilib bo'lmaydi"],"a":1,"e":"Bloat sababi — MVCC: UPDATE yangi versiya yaratadi, eski index yozuvlari qoladi. Profilaktika: autovacuum sozlamalari (table level'ida scale_factor pasaytirish), fillfactor bilan HOT update imkoniyatini oshirish, uzoq transaction'larni cheklash. VACUUM FULL table'ni to'liq qulflaydi — production'da odatda mumkin emas."},{"l":"S","t":"mcq","tp":"Index","d":"db","id":109,"n":110,"q":"Standart (C bo'lmagan) collation'da <code>WHERE name LIKE 'Ali%'</code> uchun oddiy B-tree index ishlamadi. Sabab?","o":["LIKE hech qachon index ishlatmaydi","Prefiks qidiruvi uchun taqqoslash tartibi bayt tartibiga mos bo'lishi kerak: C/POSIX collation'da ishlaydi, boshqa collation'da esa text_pattern_ops bilan alohida index kerak: CREATE INDEX ON t (name text_pattern_ops)","name column'i NULL bo'lgani uchun","Index buzilgan"],"a":1,"e":"Tekshirish: EXPLAIN bilan. Muhim: text_pattern_ops indexi faqat prefiks LIKE uchun ishlaydi, oddiy teng taqqoslash (=) va ORDER BY uchun asosiy index kerak bo'lib qolishi mumkin — ba'zan ikkala index ham saqlanadi. '%li%' kabi qidiruv uchun esa pg_trgm + GIN."},{"l":"S","t":"code","tp":"Index","d":"db","id":110,"n":111,"q":"Index <code>(customer_id, created_at)</code> bor. Nega bu query'da hali ham 'Sort' bor?","c":"SELECT * FROM orders\nWHERE customer_id = 42\nORDER BY created_at DESC, id ASC\nLIMIT 20;","o":["Index umuman ishlamayapti","ORDER BY da qo'shimcha column (id) va aralash yo'nalish bor — index tartibi query tartibiga to'liq mos emas. Mos index: (customer_id, created_at DESC, id ASC)","LIMIT 20 juda katta","created_at tipi noto'g'ri"],"a":1,"e":"Planner Sort'ni faqat index tartibi ORDER BY bilan to'liq mos kelganda olib tashlaydi (column'lar ketma-ketligi va yo'nalishi). Bir tomonga teskari yo'nalish (hammasi DESC) muammo emas — index ikki tomonlama o'qiladi; aralash yo'nalish esa alohida index talab qiladi. Keyset pagination uchun ham aynan shu index kerak bo'ladi."},{"l":"S","t":"mcq","tp":"Index","d":"db","id":30208,"n":"SN209","q":"B-tree indeks nima uchun hash indeksdan ko'proq ishlatiladi (DB'da)?","o":["Hash indeks tezroq emas","B-tree tartibni saqlaydi: diapazon (`>`, `BETWEEN`), `ORDER BY`, prefiks va `LIKE 'abc%'` ishlaydi, hamda balanslangan chuqurlik (3-4 daraja) bilan disk o'qishlari kam; hash faqat tenglik uchun","B-tree kam joy oladi","Hash indeks PostgreSQL'da yo'q"],"a":1,"e":"B-tree node'i disk sahifasi (8 KB) o'lchamida — bir o'qishda yuzlab kalit, shuning uchun milliard qatorda ham 3-4 sahifa o'qish yetadi. Hash indeks faqat `=` uchun va PostgreSQL'da ham bor, lekin ustunligi kam. Ma'lumot turiga qarab boshqa turlar: GIN (array/jsonb/full-text), GiST (geometriya), BRIN (katta, tabiiy tartiblangan jadval)."},{"l":"S","t":"mcq","tp":"Planner","d":"db","id":30209,"n":"SN210","q":"Planner nega ba'zan indeksni tashlab Seq Scan tanlaydi?","o":["Bug","Tanlanuvchanlik (selectivity) past bo'lsa: jadvalning katta ulushi qaytadi va tasodifiy sahifa o'qishlar ketma-ket o'qishdan qimmat bo'ladi; shuningdek statistika eskirgan bo'lsa yoki `random_page_cost` noto'g'ri sozlangan bo'lsa qaror xato bo'lishi mumkin","Indeks buzilgan","Faqat kichik jadvalda"],"a":1,"e":"Tekshirish tartibi: `EXPLAIN (ANALYZE, BUFFERS)` bilan kutilgan va haqiqiy qator sonini solishtirish (katta farq — statistika muammosi: `ANALYZE`, `default_statistics_target`, korrelyatsiyalangan ustunlar uchun `CREATE STATISTICS`). SSD'da `random_page_cost` 1.1 atrofida bo'lishi kerak (default 4 — HDD davridan qolgan)."},{"l":"S","t":"mcq","tp":"Index","d":"db","id":30358,"n":"SN359","q":"B-tree indeks nima uchun hash indeksdan ko'proq ishlatiladi (DB'da)?","o":["Hash indeks tezroq emas","B-tree tartibni saqlaydi: diapazon (`>`, `BETWEEN`), `ORDER BY`, prefiks va `LIKE 'abc%'` ishlaydi, hamda balanslangan chuqurlik (3-4 daraja) bilan disk o'qishlari kam; hash faqat tenglik uchun","B-tree kam joy oladi","Hash indeks PostgreSQL'da yo'q"],"a":1,"e":"B-tree node'i disk sahifasi (8 KB) o'lchamida — bir o'qishda yuzlab kalit, shuning uchun milliard qatorda ham 3-4 sahifa o'qish yetadi. Hash indeks faqat `=` uchun va PostgreSQL'da ham bor, lekin ustunligi kam. Ma'lumot turiga qarab boshqa turlar: GIN (array/jsonb/full-text), GiST (geometriya), BRIN (katta, tabiiy tartiblangan jadval)."},{"l":"S","t":"mcq","tp":"Planner","d":"db","id":30359,"n":"SN360","q":"Planner nega ba'zan indeksni tashlab Seq Scan tanlaydi?","o":["Bug","Tanlanuvchanlik (selectivity) past bo'lsa: jadvalning katta ulushi qaytadi va tasodifiy sahifa o'qishlar ketma-ket o'qishdan qimmat bo'ladi; shuningdek statistika eskirgan bo'lsa yoki `random_page_cost` noto'g'ri sozlangan bo'lsa qaror xato bo'lishi mumkin","Indeks buzilgan","Faqat kichik jadvalda"],"a":1,"e":"Tekshirish tartibi: `EXPLAIN (ANALYZE, BUFFERS)` bilan kutilgan va haqiqiy qator sonini solishtirish (katta farq — statistika muammosi: `ANALYZE`, `default_statistics_target`, korrelyatsiyalangan ustunlar uchun `CREATE STATISTICS`). SSD'da `random_page_cost` 1.1 atrofida bo'lishi kerak (default 4 — HDD davridan qolgan)."},{"l":"S","t":"mcq","tp":"Index","d":"db","id":30396,"n":"SN397","q":"Kompozit indeks `(a, b, c)` bor. Qaysi query'lar undan foydalanadi?","o":["Faqat uchchalasi shartda bo'lsa","`a`, `(a,b)`, `(a,b,c)` prefikslari bo'yicha samarali; `b` yoki `c` yolg'iz bo'lsa odatda yaramaydi (PostgreSQL ba'zan index scan qiladi, lekin samarasiz). Tartib qoidasi: tenglik shartlari avval, diapazon oxirida","Har qanday kombinatsiya bir xil ishlaydi","Faqat `ORDER BY` uchun"],"a":1,"e":"B-tree kalitlarni leksikografik tartibda saqlaydi — shuning uchun chapdan prefiks muhim. Amaliy natija: `(tenant_id, created_at)` indeksi `WHERE tenant_id = ? ORDER BY created_at DESC LIMIT 20` uchun ideal (filtr + tartib bitta indeksda). Diapazon shartidan keyingi ustunlar saralash uchun ishlatilmaydi — shuning uchun `(status, created_at)` va `(created_at, status)` butunlay boshqa natija beradi."},{"l":"S","t":"mcq","tp":"Index","d":"db","id":30397,"n":"SN398","q":"Partial va covering (INCLUDE) indekslar qachon foyda beradi?","o":["Hech qachon, oddiy indeks yetarli","Partial: faqat kerakli qatorlar indekslanadi (`WHERE deleted_at IS NULL` yoki `status='pending'`) — indeks kichik va tez; covering: `INCLUDE (cols)` bilan query indeksdan chiqmasdan bajariladi (index-only scan), heap'ga bormaydi","Faqat kichik jadvalda","Faqat unique indeksda"],"a":1,"e":"Navbat jadvallarida partial indeks ayniqsa kuchli: 10 mln yozuvdan faqat 500 `pending` indekslanadi. Index-only scan uchun visibility map yangi bo'lishi kerak (vacuum bilan) — aks holda heap tekshiruvi qaytadi. Narxi: har indeks yozuvni sekinlashtiradi va joy egallaydi, shuning uchun `pg_stat_user_indexes` bilan ishlatilmayotganlar tozalanadi."},{"l":"S","t":"mcq","tp":"Planner","d":"db","id":30424,"n":"SN425","q":"Nested loop, hash join va merge join — qaysi biri qachon tanlanadi?","o":["Har doim hash join eng tez","Nested loop: bir tomon kichik va ikkinchisida indeks bor (OLTP'da eng ko'p); hash join: ikkala tomon katta, tenglik sharti, xotirada hash jadval quriladi (`work_mem` yetmasa diskka to'kiladi); merge join: ikkala tomon sort kaliti bo'yicha tartiblangan (yoki indeks bor) va juda katta","Merge join eskirgan","Planner tasodifiy tanlaydi"],"a":1,"e":"Debug uchun muhim: `EXPLAIN ANALYZE`da 'Batches: 5, Memory Usage: ...' hash join diskka to'kilganini bildiradi — `work_mem` oshirish yoki natijani kamaytirish kerak. Nested loop noto'g'ri tanlansa (qator soni past baholangan) query 1000x sekinlashadi — sabab ko'pincha eskirgan statistika yoki korrelyatsiyalangan shartlar."},{"l":"St","t":"mcq","tp":"Planner","d":"db","id":30425,"n":"SN426","q":"Planner qator sonini 10x xato baholayapti. Nima qilinadi?","o":["`enable_seqscan=off` qo'yish","Statistikani yaxshilash: `ANALYZE`, `ALTER TABLE ... ALTER COLUMN ... SET STATISTICS 500` (ko'proq histogram), korrelyatsiyalangan ustunlar uchun `CREATE STATISTICS (dependencies, ndistinct)`; ifoda bo'yicha filtr bo'lsa expression index yoki generated column","Query'ni qayta yozish har doim","Indeks qo'shish"],"a":1,"e":"Klassik sabab: `WHERE city = 'Tashkent' AND country = 'UZ'` — planner ikkisini mustaqil deb hisoblab selektivlikni ko'paytiradi va qatorlarni juda kam baholaydi. Kengaytirilgan statistika bu bog'liqlikni o'rgatadi. `enable_*` flaglari faqat diagnostika uchun — productionda qotirib qo'yish plan regressiyasini yashiradi."},{"l":"S","t":"mcq","tp":"Index","d":"db","id":30426,"n":"SN427","q":"`jsonb` ustunni indekslash variantlari?","o":["Faqat B-tree","GIN (`jsonb_ops` — barcha kalit/qiymat, `jsonb_path_ops` — kichikroq va `@>` uchun tez), yoki aniq yo'lga B-tree expression index (`((data->>'status'))`) / generated column; tanlov query naqshiga bog'liq","GIN har doim","jsonb indekslanmaydi"],"a":1,"e":"Qoida: ma'lum va tez-tez ishlatiladigan maydon bo'lsa — uni ustunga chiqarish (generated column + B-tree) eng tez va eng arzon; erkin sxema bo'yicha qidiruv bo'lsa — GIN. GIN yozuvda qimmat (`fastupdate` bilan kechiktiriladi lekin keyin katta pauza) va kattaroq. jsonb'ni relyatsion sxema o'rniga ishlatish — eng ko'p uchraydigan dizayn xatosi."},{"l":"J","t":"mcq","tp":"Transactions","d":"db","id":7,"n":8,"q":"ACID dagi <b>A</b> nimani anglatadi?","o":["Availability — tizim doim ishlaydi","Atomicity — transaction yo to'liq bajariladi, yo umuman bajarilmaydi","Authorization — ruxsat tekshiriladi","Asynchrony — asinxron yozish"],"a":1,"e":"Atomicity: hammasi yoki hech narsa (pul o'tkazmasida debit va credit birga). C — Consistency (constraintlar buzilmaydi), I — Isolation (parallel transaction'lar bir-birini ko'rmaydi), D — Durability (commit bo'lgan narsa crashdan keyin ham qoladi, WAL orqali). Availability — bu CAP dan, ACID dan emas."},{"l":"M","t":"mcq","tp":"Isolation","d":"db","id":15,"n":16,"q":"Qaysi eng past isolation level'si <b>non-repeatable read</b> ni oldini oladi?","o":["READ UNCOMMITTED","READ COMMITTED","REPEATABLE READ","Hech biri, faqat SERIALIZABLE"],"a":2,"e":"Dirty read — READ COMMITTED da yo'q. Non-repeatable read (bir row'ni ikki marta o'qisang boshqa qiymat) — REPEATABLE READ da yo'q. Phantom — standart bo'yicha SERIALIZABLE da, lekin Postgres REPEATABLE READ (snapshot) phantomni ham oldini oladi. Postgres default: READ COMMITTED; MySQL InnoDB default: REPEATABLE READ."},{"l":"M","t":"mcq","tp":"Locking","d":"db","id":21,"n":22,"q":"<code>SELECT ... FOR UPDATE</code> qaysi yondashuvga misol?","o":["Optimistic locking","Pessimistic locking — row o'qilganda lock olinadi, boshqa yozuvchilar kutadi","MVCC snapshot","Advisory lock"],"a":1,"e":"Pessimistic: konflikt ko'p bo'lganda (masalan inventar kamaytirish). Optimistic: version column'i, UPDATE ... WHERE id=? AND version=? — 0 row yangilansa retry. Konflikt kam, o'qish ko'p bo'lsa optimistic. FOR UPDATE SKIP LOCKED — queue (job queue) uchun klassik pattern."},{"l":"M","t":"open","tp":"Locking","d":"db","id":22,"n":23,"q":"Deadlock nima, DB uni qanday aniqlaydi va siz qanday oldini olasiz?","m":["Ikki transaction bir-birining lockini kutadi: T1 A→B, T2 B→A","DB wait-for graph orqali aniqlaydi va birini abort qiladi (Postgres deadlock_timeout)","Oldini olish: resurslarni doim bir xil tartibda lock qilish (masalan id bo'yicha sort)","Transaction'ni qisqa qilish, tashqi HTTP chaqiruvni transaction ichida qilmaslik","Ilovada deadlock/serialization xatosini retry qilish"],"e":"Deadlockni butunlay yo'q qilib bo'lmaydi — shuning uchun retry logika majburiy. Pul o'tkazmada: ikki hisobni doim kichik id birinchi tartibda lock qilish klassik javob."},{"l":"S","t":"mcq","tp":"MVCC","d":"db","id":28,"n":29,"q":"PostgreSQL MVCC da <code>UPDATE</code> ichkarida nima qiladi?","o":["Row'ni joyida o'zgartiradi","Yangi tuple versiyasini yozadi, eskisini 'dead' deb belgilaydi; VACUUM keyin tozalaydi","Row'ni o'chirib, undo logga yozadi","Butun page'ni nusxalaydi"],"a":1,"e":"Postgres UPDATE = DELETE + INSERT (xmin/xmax). Oqibatlari: tez-tez yangilanadigan table'da bloat, autovacuum tuning muhim; har yangi versiya barcha indexlarni yangilaydi (HOT update bundan istisno — indexlangan column o'zgarmasa va page'da joy bo'lsa, fillfactor). MySQL InnoDB esa joyida yangilaydi, eski versiya undo logda."},{"l":"S","t":"mcq","tp":"Isolation","d":"db","id":30,"n":31,"q":"Ikki shifokor navbatchilikdan chiqadi: har biri 'kamida bitta navbatchi qolyaptimi?' deb tekshiradi, ikkalasi ham ha deb ko'radi va o'zini olib tashlaydi. Natijada 0 navbatchi. Bu anomaliya va uni kafolatli oldini oladigan level?","o":["Dirty read — READ COMMITTED","Lost update — REPEATABLE READ","Write skew — SERIALIZABLE (yoki tekshirilgan row'larni FOR UPDATE bilan lock qilish)","Phantom read — READ UNCOMMITTED"],"a":2,"e":"Write skew: ikki transaction bir xil to'plamni o'qiydi, turli row'larni yozadi — snapshot isolation (Postgres REPEATABLE READ) buni ushlamaydi. Postgres SERIALIZABLE (SSI) konfliktni aniqlab bittasini serialization failure bilan abort qiladi — ilova retry qilishi shart."},{"l":"S","t":"code","tp":"Concurrency","d":"db","id":31,"n":32,"q":"Ikki query bir vaqtda ishlaydi, boshlang'ich balans 100. READ COMMITTED. Yakuniy balans va to'g'ri tuzatish?","c":"-- ilova kodi (ikkala query'da bir xil)\nbal = SELECT balance FROM accounts WHERE id = 1;   -- 100\nUPDATE accounts SET balance = :bal - 10 WHERE id = 1;","o":["80 — hammasi to'g'ri","90 (lost update). Tuzatish: UPDATE accounts SET balance = balance - 10 WHERE id=1 (atomik) yoki SELECT ... FOR UPDATE","90, tuzatish: indexni qo'shish","Deadlock bo'ladi"],"a":1,"e":"Read-modify-write ilova tomonida — klassik lost update. Atomik UPDATE balance = balance - 10 row'ni lock qilib, commit bo'lgan oxirgi qiymatni qayta o'qiydi. Qo'shimcha himoya: CHECK (balance >= 0) yoki WHERE balance >= 10 va yangilangan row'lar sonini tekshirish."},{"l":"St","t":"open","tp":"Idempotency","d":"db","id":44,"n":45,"q":"To'lov API'sini idempotent qiling: client timeout olib qayta yuboradi — ikki marta yechilmasligi kerak. DB level'ida dizayn?","m":["Client Idempotency-Key yuboradi (UUID)","idempotency_keys(key PK, request_hash, status, response, created_at) table'i","Transaction: INSERT key ON CONFLICT DO NOTHING — kim birinchi kiritsa o'sha bajaradi","Takror query: saqlangan javobni qaytarish; key bir xil, body boshqa bo'lsa — 422","'in_progress' holatini boshqarish (parallel takror → 409 yoki kutish); TTL bilan tozalash","Tashqi provayderga ham o'sha key'ni uzatish"],"e":"Asosiy fikr: idempotentlikni unique constraint kafolatlaydi, ilovadagi 'avval tekshir, keyin yoz' emas (race condition). Business-level unique (order_id bo'yicha bitta payment) qo'shimcha himoya."},{"l":"St","t":"mcq","tp":"MVCC","d":"db","id":46,"n":47,"q":"Postgres'da 'transaction ID wraparound' xavfi nima va nima uning oldini oladi?","o":["Disk to'lishi; oldini olish — TRUNCATE","32-bit XID tugaydi, eski row'lar 'kelajakdagi' bo'lib ko'rinadi; himoya uchun DB yozishni to'xtatadi. Oldini olish — autovacuum freeze ishlashini ta'minlash","Replica sinxronligi yo'qoladi","Indexlar buziladi, REINDEX kerak"],"a":1,"e":"VACUUM FREEZE eski tuple'larni 'frozen' deb belgilaydi. Uzoq ochiq transaction'lar, unutilgan replication slot yoki prepared transaction vacuum'ni bloklaydi — age(datfrozenxid) monitoringi kerak. Real incidentlar (Sentry, Mailchimp) aynan shu bilan bo'lgan."},{"l":"J","t":"mcq","tp":"Isolation","d":"db","id":111,"n":112,"q":"<b>Dirty read</b> nima?","o":["Diskdan buzilgan ma'lumot o'qish","Boshqa transaction hali COMMIT qilmagan o'zgarishni o'qish — u keyin ROLLBACK bo'lsa, siz hech qachon mavjud bo'lmagan ma'lumotni ko'rgan bo'lasiz","Eski index'dan o'qish","Cache'dan o'qish"],"a":1,"e":"Misol: T1 balansni 100 → 1000 qildi (commit yo'q). T2 1000 ni ko'rib kredit berdi. T1 rollback. T2 'xayoliy' pul asosida qaror qildi. Faqat READ UNCOMMITTED ruxsat beradi — Postgres'da umuman yo'q (READ UNCOMMITTED ham READ COMMITTED kabi ishlaydi)."},{"l":"J","t":"mcq","tp":"Isolation","d":"db","id":112,"n":113,"q":"Non-repeatable read va phantom read farqi?","o":["Bir xil narsa","Non-repeatable: <b>bitta row'ni</b> qayta o'qisangiz qiymati o'zgargan (UPDATE). Phantom: <b>shart bo'yicha to'plamni</b> qayta o'qisangiz yangi row'lar paydo bo'lgan/yo'qolgan (INSERT/DELETE)","Phantom faqat indexlarda bo'ladi","Non-repeatable faqat DELETE da bo'ladi"],"a":1,"e":"Non-repeatable: SELECT balance WHERE id=1 → 100, boshqasi yangilab commit qildi, qayta → 200. Phantom: SELECT COUNT(*) WHERE dept=5 → 10, boshqasi yangi xodim qo'shdi, qayta → 11. Eslab qolish: non-repeatable — mavjud row o'zgardi; phantom — to'plam tarkibi o'zgardi."},{"l":"M","t":"code","tp":"Isolation","d":"db","id":113,"n":114,"q":"Postgres. T1 va T2 parallel. T1 ning ikkinchi SELECT'i nima qaytaradi: (a) READ COMMITTED da, (b) REPEATABLE READ da?","c":"-- boshida: accounts(id=1).balance = 100\nT1: BEGIN;\nT1: SELECT balance FROM accounts WHERE id = 1;   -- 100\n        T2: BEGIN;\n        T2: UPDATE accounts SET balance = 200 WHERE id = 1;\n        T2: COMMIT;\nT1: SELECT balance FROM accounts WHERE id = 1;   -- ?\nT1: COMMIT;","o":["(a) 100, (b) 100","(a) 200, (b) 100","(a) 200, (b) 200","(a) 100, (b) 200"],"a":1,"e":"Asosiy farq — snapshot qachon olinadi. READ COMMITTED: har <b>query</b> boshida yangi snapshot — T2 commit qilgani ko'rinadi (200). REPEATABLE READ: transaction'dagi <b>birinchi query'da</b> snapshot olinadi va oxirigacha o'sha — 100. Bu MVCC tufayli: eski versiya hali mavjud, T1 uni o'qiydi, hech kim bloklanmaydi."},{"l":"M","t":"mcq","tp":"Isolation","d":"db","id":114,"n":115,"q":"Postgres REPEATABLE READ. T1 row'ni o'qidi, T2 o'sha row'ni yangilab commit qildi, endi T1 ham o'sha row'ni UPDATE qilmoqchi. Nima bo'ladi?","o":["T1 T2 ning o'zgarishini ustidan yozadi (lost update)","T1 xato oladi: 'could not serialize access due to concurrent update' — ilova transaction'ni boshidan retry qilishi kerak","T1 abadiy kutadi","T2 rollback bo'ladi"],"a":1,"e":"REPEATABLE READ lost update'ni oldini oladi — lekin xato orqali. Shuning uchun REPEATABLE READ / SERIALIZABLE ishlatsangiz, ilova SQLSTATE 40001 ni ushlab, butun transaction'ni qayta bajarishi SHART. READ COMMITTED da esa T1 kutadi, keyin T2 ning yangi qiymati ustida UPDATE'ni qayta baholaydi."},{"l":"M","t":"mcq","tp":"Isolation","d":"db","id":115,"n":116,"q":"SQL standarti bo'yicha table'da qaysi row to'g'ri? (✗ = anomaliya mumkin emas, ✓ = mumkin)","o":["READ COMMITTED: dirty ✓, non-repeatable ✗, phantom ✗","REPEATABLE READ: dirty ✗, non-repeatable ✗, phantom ✓","SERIALIZABLE: phantom ✓","READ UNCOMMITTED: hammasi ✗"],"a":1,"e":"Yodlash table'i (standart):\n• READ UNCOMMITTED: dirty ✓, non-rep ✓, phantom ✓\n• READ COMMITTED: dirty ✗, non-rep ✓, phantom ✓\n• REPEATABLE READ: dirty ✗, non-rep ✗, phantom ✓\n• SERIALIZABLE: hammasi ✗ (+ write skew ham yo'q)\nHar pog'ona bitta anomaliyani yopadi. Postgres farqi: REPEATABLE READ phantom'ni ham yopadi (snapshot), lekin write skew'ni emas. Default'lar: Postgres — READ COMMITTED, MySQL — REPEATABLE READ."},{"l":"S","t":"mcq","tp":"Isolation","d":"db","id":116,"n":117,"q":"Nega hamma joyda SERIALIZABLE ishlatilmaydi?","o":["Postgres'da mavjud emas","Konflikt ko'p bo'lganda transaction'lar tez-tez serialization failure bilan abort bo'ladi — retry kerak, throughput tushadi; qo'shimcha kuzatuv (predicate lock) xarajati bor","U dirty read'ga ruxsat beradi","Faqat o'qish uchun ishlaydi"],"a":1,"e":"Amaliy yondashuv: default READ COMMITTED + kritik joylarda aniq himoya — atomik UPDATE (balance = balance - 10), SELECT ... FOR UPDATE, unique/check constraint. SERIALIZABLE — invariant bir nechta row'ga bog'liq va boshqa himoya murakkab bo'lganda (write skew). Intervyuda: 'kerakli joyda, retry logika bilan' deyish."},{"l":"M","t":"code","tp":"Isolation","d":"db","id":117,"n":118,"q":"Omborda 1 ta mahsulot qoldi. READ COMMITTED da ikki xaridor bir vaqtda sotib oladi. Natija va tuzatish?","c":"BEGIN;\nSELECT stock FROM products WHERE id = 7;      -- ikkalasi 1 ko'radi\n-- ilova: if stock > 0 ...\nUPDATE products SET stock = stock - 1 WHERE id = 7;\nINSERT INTO orders ...;\nCOMMIT;","o":["Faqat bittasi sotib oladi — DB o'zi himoya qiladi","Ikkalasi sotib oladi, stock = -1 (oversell). Tuzatish: UPDATE ... SET stock = stock - 1 WHERE id = 7 AND stock > 0 va yangilangan row'lar sonini tekshirish (0 bo'lsa — tugagan); yoki SELECT ... FOR UPDATE; yoki CHECK (stock >= 0)","Deadlock bo'ladi","Ikkinchisi xato oladi"],"a":1,"e":"'Tekshir-keyin-yoz' (check-then-act) ilovada — race condition. Eng sodda va tez yechim: shartni UPDATE ichiga qo'yish — DB row'ni lock qilib, commit bo'lgan oxirgi qiymat bilan shartni qayta tekshiradi. CHECK (stock >= 0) — oxirgi himoya chizig'i."},{"l":"M","t":"open","tp":"Isolation","d":"db","id":118,"n":119,"q":"4 ta isolation level'ini va har biri qaysi anomaliyani yopishini memory'dan tushuntiring (table ko'rinishida).","m":["READ UNCOMMITTED — hech narsani yopmaydi (dirty read mumkin)","READ COMMITTED — dirty read yopiq; har query yangi snapshot (Postgres default)","REPEATABLE READ — non-repeatable read yopiq; transaction bitta snapshot (MySQL default); Postgres'da phantom ham yopiq","SERIALIZABLE — hammasi + write skew; natija qandaydir ketma-ket bajarilishga teng; retry kerak","Trade-off: level oshgan sari konsistentlik oshadi, parallellik/throughput tushadi"],"e":"Bu savolga 1 daqiqada aniq javob berish Middle level'ning minimumi. Mashq: table'ni qog'ozga 3 marta memory'dan chizing, keyin har anomaliyaga bittadan misol ayting."},{"l":"J","t":"mcq","tp":"Transactions","d":"db","id":119,"n":120,"q":"<code>BEGIN</code> yozilmasa, Postgres'da har bir query qanday bajariladi?","o":["Hech qachon commit bo'lmaydi","Autocommit: har query o'zi alohida transaction — success'li bo'lsa darhol commit","Keyingi BEGIN gacha kutadi","Faqat SELECT ishlaydi"],"a":1,"e":"Autocommit rejimida 3 ta alohida UPDATE — 3 ta alohida transaction: ikkinchisi yiqilsa, birinchisi allaqachon saqlangan. Bir-biriga bog'liq amallar (pul o'tkazish: debit + credit) bitta BEGIN ... COMMIT ichida bo'lishi shart. Diqqat: psql/driver sozlamasi autocommit'ni o'chirishi mumkin (Python psycopg2 default — autocommit OFF)."},{"l":"J","t":"code","tp":"Transactions","d":"db","id":120,"n":121,"q":"Natijada <code>accounts</code> table'ida nima qoladi?","c":"BEGIN;\nUPDATE accounts SET balance = balance - 100 WHERE id = 1;  -- OK\nUPDATE accounts SET balance = balance + 100 WHERE id = 99; -- 0 row (id=99 yo'q)\nCOMMIT;","o":["Hech narsa o'zgarmaydi — 0 row xato hisoblanadi, rollback bo'ladi","id=1 dan 100 yechildi, hech kimga qo'shilmadi — pul 'yo'qoldi'","Xato chiqadi","DB avtomatik id=99 ni yaratadi"],"a":1,"e":"0 row yangilash — xato EMAS, shuning uchun transaction commit bo'ladi. Atomicity faqat xato bo'lganda ishlaydi. Ilova har UPDATE'ning ta'sir qilgan row'lar sonini (rowcount) tekshirib, kutilmagan bo'lsa o'zi ROLLBACK qilishi kerak. FK/constraint bo'lsa ham bu holatni ushlamaydi — mantiqiy tekshiruv ilovada."},{"l":"J","t":"mcq","tp":"Transactions","d":"db","id":121,"n":122,"q":"Postgres'da transaction ichida bitta query xato berdi (masalan unique violation). Keyingi query'lar nima bo'ladi?","o":["Odatdagidek davom etadi","Transaction 'aborted' holatga o'tadi: 'current transaction is aborted, commands ignored until end of transaction block' — faqat ROLLBACK (yoki SAVEPOINT'ga qaytish) mumkin","Faqat xato bergan query bekor bo'ladi, qolganlari commit bo'ladi","DB avtomatik retry qiladi"],"a":1,"e":"Postgres xatodan keyin butun transaction'ni yaroqsiz deb biladi (MySQL esa faqat o'sha statement'ni bekor qilib, davom etishga ruxsat beradi). Qisman davom etish kerak bo'lsa — SAVEPOINT sp; ... ROLLBACK TO SAVEPOINT sp; yoki INSERT ... ON CONFLICT bilan xatoning oldini olish."},{"l":"M","t":"code","tp":"Transactions","d":"db","id":122,"n":123,"q":"SAVEPOINT bilan natija: qaysi row'lar saqlanadi?","c":"BEGIN;\nINSERT INTO logs VALUES (1);\nSAVEPOINT a;\nINSERT INTO logs VALUES (2);\nROLLBACK TO SAVEPOINT a;\nINSERT INTO logs VALUES (3);\nCOMMIT;","o":["1, 2, 3","1, 3","Faqat 1","Hech narsa"],"a":1,"e":"ROLLBACK TO SAVEPOINT faqat savepoint'dan keyingi o'zgarishlarni bekor qiladi, transaction davom etadi. ORM'lardagi 'nested transaction' (Django atomic() ichida atomic(), Rails requires_new) aslida savepoint'lar. Postgres'da haqiqiy nested transaction yo'q. Ko'p savepoint — performance narxi bor (subtransaction SLRU muammosi)."},{"l":"M","t":"open","tp":"Transactions","d":"db","id":123,"n":124,"q":"Uzoq davom etadigan (yoki 'idle in transaction') transaction'lar nima uchun xavfli?","m":["Lock'larni ushlab turadi — boshqa query'lar queue'da kutadi, zanjir bo'lib butun servis to'xtashi mumkin","MVCC: VACUUM eski row versiyalarini tozalay olmaydi — table va index shishadi (bloat), query'lar sekinlashadi","Connection pool'dan connection'ni band qiladi","Replica'da hot_standby_feedback bilan primary'ga ham ta'sir","Himoya: idle_in_transaction_session_timeout, statement_timeout, lock_timeout; transaction ichida tashqi HTTP chaqiruv qilmaslik; pg_stat_activity monitoringi"],"e":"Klassik incident: kimdir psql'da BEGIN yozib, tushlikka ketdi. Transaction ichida tashqi API chaqiruv (to'lov provayder 30s javob bermaydi) — eng ko'p uchraydigan sabab. Qoida: transaction faqat DB ishini qamrab olsin, qisqa bo'lsin."},{"l":"M","t":"mcq","tp":"Transactions","d":"db","id":124,"n":125,"q":"COMMIT qaytgandan keyin server elektr o'chib ketdi. Ma'lumot saqlanganmi va nima orqali?","o":["Yo'q, ma'lumot faqat memory'da edi","Ha — COMMIT WAL (write-ahead log) diskka fsync qilinganidan keyin qaytadi; qayta ishga tushganda WAL qayta o'ynaladi (redo)","Faqat checkpoint bo'lgan bo'lsa","Faqat replica bo'lsa"],"a":1,"e":"Durability = WAL. Ma'lumot page'lari keyinroq (checkpoint'da) diskka yoziladi, lekin WAL darhol. synchronous_commit = off — commit tezroq, lekin crash'da oxirgi bir necha yuz ms yo'qolishi mumkin (DB buzilmaydi, faqat oxirgi commitlar). Log/analitika uchun qabul qilinadi, to'lov uchun yo'q."},{"l":"M","t":"code","tp":"Transactions","d":"db","id":125,"n":126,"q":"Bu kodning muammosi nima?","c":"with db.transaction():\n    order = db.insert_order(cart)\n    payment = stripe.charge(card, order.total)   # HTTP, 2–30 s\n    db.mark_paid(order.id, payment.id)\n    email.send(user, \"Rahmat!\")","o":["Muammo yo'q","Transaction ichida tashqi chaqiruvlar: lock va connection uzoq band; charge o'tib, keyin DB rollback bo'lsa — pul yechilgan, order yo'q; email rollback'dan keyin ham ketgan bo'ladi","Faqat email async bo'lishi kerak","stripe.charge ikki marta chaqirilishi kerak"],"a":1,"e":"Tashqi side effect'ni rollback qilib bo'lmaydi. To'g'ri oqim: 1) order'ni 'pending' holatda commit qilish; 2) transaction'dan tashqarida idempotency key bilan charge; 3) yangi qisqa transaction'da 'paid' + outbox'ga 'send_email' event; 4) worker email yuboradi. Tiklash uchun 'pending' qolib ketganlarni tekshiruvchi job."},{"l":"S","t":"mcq","tp":"Transactions","d":"db","id":126,"n":127,"q":"Two-phase commit (2PC) ning asosiy muammosi?","o":["Juda tez ishlaydi","Koordinator prepare'dan keyin yiqilsa, qatnashchilar 'in-doubt' holatda lock ushlab qoladi (blocking protocol); latency oshadi, har qatnashchi mavjud bo'lishi shart","Atomiklikni kafolatlamaydi","Faqat bitta DB bilan ishlaydi"],"a":1,"e":"2PC: prepare (hamma 'tayyorman' deydi va diskka yozadi) → commit. Koordinator o'rtada o'lsa — hamma kutadi. Postgres'da PREPARE TRANSACTION bor, lekin unutilgan prepared tx VACUUM'ni bloklaydi. Mikroservislarda odatda 2PC o'rniga saga + outbox."},{"l":"S","t":"mcq","tp":"Transactions","d":"db","id":127,"n":128,"q":"Postgres'da DDL (ALTER TABLE, CREATE INDEX) transaction ichida qanday ishlaydi?","o":["DDL implicit commit qiladi (MySQL kabi)","Postgres'da DDL tranzaksion — BEGIN; ALTER ...; ROLLBACK; o'zgarishni to'liq bekor qiladi (CREATE INDEX CONCURRENTLY va ba'zi buyruqlar bundan mustasno)","DDL transaction'da taqiqlangan","Faqat superuser uchun tranzaksion"],"a":1,"e":"Migratsiya uchun katta afzallik: ko'p qadamli migratsiya yarmida yiqilsa, hammasi qaytadi. MySQL/Oracle'da DDL implicit commit — yarim bajarilgan migratsiya qoladi. Ogohlantirish: ALTER ACCESS EXCLUSIVE lock oladi va transaction oxirigacha ushlab turadi — migratsiya transaction'sini qisqa qiling, lock_timeout qo'ying."},{"l":"S","t":"open","tp":"Transactions","d":"db","id":128,"n":129,"q":"Transaction chegarasini (boundary) qayerda qo'yasiz — repository, service yoki controller? DDD kontekstida tushuntiring.","m":["Chegara — use case (application service) level'ida: bitta biznes amal = bitta transaction","Repository o'zi commit qilmaydi — aks holda bir nechta repository'ni atomik birlashtirib bo'lmaydi (Unit of Work pattern)","Controller/HTTP qatlamida emas — transaction kerakidan uzun va tashqi chaqiruvlarni qamrab oladi","DDD: bitta transaction'da bitta aggregate'ni o'zgartirish; boshqa aggregate'lar — domain event orqali, eventual","Tashqi side effect'lar commit'dan keyin (outbox)"],"e":"Senior signal: 'bitta transaction — bitta aggregate' qoidasi va nega (lock contention, masshtab). Unit of Work — ORM session (SQLAlchemy Session, EF DbContext)."},{"l":"M","t":"mcq","tp":"Isolation","d":"db","id":129,"n":130,"q":"<b>Read skew</b> (inconsistent read) qaysi holat?","o":["Bir row'ni ikki marta o'qish","T1 hisob A ni o'qiydi (500), T2 A dan B ga 100 o'tkazib commit qiladi, T1 endi B ni o'qiydi (yangi, 600) — T1 jami 1100 ko'radi, aslida 1000","Indexdan noto'g'ri o'qish","Replica'dan o'qish"],"a":1,"e":"READ COMMITTED da har query yangi snapshot — shuning uchun turli row'lar turli vaqt holatidan o'qiladi. Hisobot, backup, balans yig'indisi uchun xavfli. Yechim: REPEATABLE READ (bitta snapshot) yoki hammasini bitta query'da o'qish. pg_dump aynan shuning uchun REPEATABLE READ ishlatadi."},{"l":"M","t":"mcq","tp":"Isolation","d":"db","id":130,"n":131,"q":"Snapshot isolation nimani anglatadi?","o":["DB diskining nusxasi","Transaction boshlangan paytdagi commit bo'lgan holatni ko'radi; o'quvchilar yozuvchilarni, yozuvchilar o'quvchilarni bloklamaydi (MVCC)","Hamma query'lar ketma-ket bajariladi","Faqat o'qish uchun rejim"],"a":1,"e":"'Readers don't block writers, writers don't block readers' — MVCC'ning asosiy afzalligi. Postgres REPEATABLE READ = snapshot isolation. U dirty, non-repeatable, phantom, lost update'ni yopadi, lekin write skew'ni emas. Oracle 'SERIALIZABLE' deb atagani aslida snapshot isolation."},{"l":"M","t":"mcq","tp":"Locking","d":"db","id":131,"n":132,"q":"<code>FOR UPDATE</code> va <code>FOR SHARE</code> farqi?","o":["Farqi yo'q","FOR SHARE — boshqalar ham FOR SHARE olishi mumkin, lekin o'zgartira olmaydi; FOR UPDATE — eksklyuziv, boshqa FOR UPDATE/SHARE va UPDATE/DELETE kutadi","FOR SHARE table'ni lock qiladi","FOR UPDATE o'qishni ham bloklaydi"],"a":1,"e":"Oddiy SELECT hech qanday row lock kutmaydi (MVCC). FOR SHARE: 'men o'qiyotganimda bu row o'zgarmasin' (masalan FK tekshiruvi). FOR UPDATE: 'men buni o'zgartiraman'. Postgres'da yengilroq variantlar: FOR NO KEY UPDATE (FK'larni bloklamaydi), FOR KEY SHARE."},{"l":"M","t":"code","tp":"Locking","d":"db","id":132,"n":133,"q":"10 ta worker bir table'dan job oladi. Qaysi variant to'g'ri va nima uchun?","c":"-- A\nSELECT * FROM jobs WHERE status='pending'\nORDER BY id LIMIT 1 FOR UPDATE;\n\n-- B\nSELECT * FROM jobs WHERE status='pending'\nORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED;\n\n-- C\nSELECT * FROM jobs WHERE status='pending'\nORDER BY id LIMIT 1 FOR UPDATE NOWAIT;","o":["A — eng xavfsiz","B — band row'ni o'tkazib yuborib keyingi bo'sh job'ni oladi; A'da hamma worker bitta row'ni kutib queue'ga turadi; C band bo'lsa darhol xato beradi","C — eng tez","Uchalasi bir xil"],"a":1,"e":"SKIP LOCKED — Postgres'da queue (queue) qurishning standart usuli: parallel worker'lar bir-birini kutmaydi. NOWAIT — 'kutmayman, darhol xato' (user interfeysda 'boshqa kishi tahrirlayapti' deyish uchun). Job'ni olgach status='running' qilib commit qiling yoki transaction ichida bajaring."},{"l":"S","t":"mcq","tp":"Isolation","d":"db","id":133,"n":134,"q":"MySQL InnoDB REPEATABLE READ phantom'ni qanday oldini oladi (locking read'larda)?","o":["Hech qanday — phantom bo'ladi","Next-key lock (record lock + gap lock): indexdagi row va undan oldingi 'bo'shliq'ni lock qiladi — boshqalar shu oraliqqa INSERT qila olmaydi","Table'ni to'liq lock qiladi","Snapshot bilan, lock'siz"],"a":1,"e":"Oddiy SELECT — snapshot (MVCC). SELECT ... FOR UPDATE / UPDATE — next-key lock. Oqibat: index bo'lmagan column bo'yicha UPDATE WHERE butun table'ni lock qilishi mumkin, gap lock'lar kutilmagan deadlock'lar beradi. Ko'p kompaniyalar MySQL'da READ COMMITTED'ga o'tadi — gap lock'lar yo'qoladi."},{"l":"S","t":"code","tp":"Isolation","d":"db","id":134,"n":135,"q":"SERIALIZABLE bilan ishlaganda ilova kodi qanday bo'lishi kerak? Qaysi variant to'g'ri?","c":"# A\ntry:\n    with tx(isolation=\"serializable\"):\n        transfer(a, b, 100)\nexcept SerializationFailure:\n    log.error(\"xato\")\n\n# B\nfor attempt in range(5):\n    try:\n        with tx(isolation=\"serializable\"):\n            transfer(a, b, 100)\n        break\n    except SerializationFailure:   # SQLSTATE 40001\n        sleep(backoff(attempt))\nelse:\n    raise","o":["A — xatoni loglash yetarli","B — butun transaction'ni boshidan (qayta o'qish bilan) retry qilish, backoff va chegara bilan","Ikkalasi ham noto'g'ri — SERIALIZABLE xato bermaydi","A, chunki retry ikki marta o'tkazadi"],"a":1,"e":"40001 (serialization_failure) va 40P01 (deadlock) — 'normal' xatolar, qayta urinsa o'tadi. Muhim: faqat oxirgi query'ni emas, butun transaction'ni qayta bajarish (ma'lumotni qayta o'qish). Transaction ichida tashqi side effect bo'lmasligi kerak — aks holda retry uni takrorlaydi."},{"l":"S","t":"mcq","tp":"MVCC","d":"db","id":135,"n":136,"q":"Postgres row versiyasi transaction'ga ko'rinadimi-yo'qligini qanday aniqlaydi?","o":["Timestamp column'i orqali","Har tuple'da xmin (yaratgan tx ID) va xmax (o'chirgan/yangilagan tx ID); snapshot'dagi faol transaction'lar ro'yxati bilan solishtiriladi: xmin commit bo'lgan va snapshot'dan oldin, xmax esa yo'q yoki hali ko'rinmas bo'lsa — ko'rinadi","Index orqali","Lock table'i orqali"],"a":1,"e":"SELECT xmin, xmax, * FROM t; — o'zingiz ko'ring. Snapshot = (xmin, xmax, faol tx ro'yxati). Shuning uchun uzoq transaction eski versiyalarni 'tirik' ushlab turadi — VACUUM ularni o'chira olmaydi. Bu isolation, VACUUM va bloat'ni bitta mexanizmga bog'laydi — senior intervyuda juda yaxshi signal."},{"l":"S","t":"mcq","tp":"Locking","d":"db","id":136,"n":137,"q":"Production'da <code>ALTER TABLE users ADD COLUMN x int;</code> bir soniyalik operatsiya, lekin butun sayt 2 daqiqa to'xtadi. Sabab?","o":["ADD COLUMN butun table'ni qayta yozadi","ALTER ACCESS EXCLUSIVE lock kutdi (uzoq SELECT ushlab turgan edi); navbatdagi ALTER o'zidan keyin kelgan HAMMA query'larni ham bloklaydi — lock queue. Yechim: SET lock_timeout = '3s' va retry","Index qayta qurildi","Disk to'ldi"],"a":1,"e":"Lock queue — eng ko'p tushunilmaydigan mexanizm: kutayotgan eksklyuziv lock query'i keyingi oddiy SELECT'larni ham o'zidan o'tkazmaydi. Shuning uchun migratsiyalarda doim lock_timeout + retry. Postgres 11+ ADD COLUMN ... DEFAULT (volatile bo'lmagan) table'ni qayta yozmaydi."},{"l":"St","t":"mcq","tp":"Locking","d":"db","id":137,"n":138,"q":"Bir nechta servis instance'i bitta cron job'ni bir vaqtda bajarmasligi kerak. DB'da yengil yechim?","o":["Har instance'da boolean o'zgaruvchi","pg_try_advisory_lock(job_id) — kim olsa bajaradi, qolganlar false oladi va o'tkazib yuboradi; session tugasa lock avtomatik bo'shaydi","Table'ni LOCK TABLE bilan lock qilish","sleep(random) qo'yish"],"a":1,"e":"Advisory lock — Postgres'ning ilova darajasidagi mutex'i, table row'lariga bog'liq emas. Session-level va transaction-level (pg_advisory_xact_lock) turlari bor. PgBouncer transaction mode'da session-level advisory lock ishonchsiz — xact variantini ishlating. Ko'p node'li umumiy lock uchun alternativ — Redis/etcd lease."},{"l":"St","t":"open","tp":"Isolation","d":"db","id":138,"n":139,"q":"Bank tizimi uchun isolation strategiyasini loyihalang: qaysi operatsiyaga qaysi level va mexanizm?","m":["Default READ COMMITTED — ko'p o'qish/yozish uchun yetarli va tez","Pul o'tkazish: atomik UPDATE balance = balance - x WHERE balance >= x, ikkala hisobni id tartibida lock (deadlock yo'q), CHECK (balance >= 0)","Ko'p row'li invariantlar (limit, 'jami qarz ≤ N'): SERIALIZABLE + retry yoki umumiy row'ni FOR UPDATE bilan lock","Hisobot/reconciliation: REPEATABLE READ READ ONLY (bir xil snapshot) yoki replica","Ledger modeli: balansni UPDATE emas, append-only yozuvlar (double-entry) — audit va konkurentlik soddalashadi","Idempotency key har to'lov query'iga"],"e":"Staff signal: 'hammasiga SERIALIZABLE' emas — har operatsiya uchun eng arzon yetarli mexanizm. Append-only ledger lost update muammosining o'zini yo'q qiladi."},{"l":"M","t":"mcq","tp":"Transactions","d":"db","id":13001,"n":"K2","q":"ACID va BASE farqi?","o":["BASE — ACID ning yangi nomi","ACID (Atomicity, Consistency, Isolation, Durability) — an'anaviy relatsion DB: har transaction qat'iy kafolat bilan. BASE (Basically Available, Soft state, Eventual consistency) — taqsimlangan NoSQL yondashuvi: mavjudlikni ustun qo'yib, konsistentlikni vaqt o'tib ta'minlaydi","ACID faqat NoSQL uchun","BASE tranzaksiyalarni umuman qo'llamaydi"],"a":1,"e":"CAP bilan bog'liqlik: ACID tizimlar odatda CP tomonda (partition paytida yozishni rad etadi), BASE tizimlar AP tomonda. Bu ikkilik emas — bugungi ko'p NoSQL (MongoDB, DynamoDB) tranzaksiya va kuchli o'qishni qo'llaydi, Postgres esa replikada eventual consistency beradi. Tanlov: pul/inventar — ACID; feed, hisoblagich, katalog — BASE maqbul.","src":"https://www.hellointerview.com/learn/system-design/core-concepts/cap-theorem"},{"l":"S","t":"mcq","tp":"MVCC","d":"db","id":30210,"n":"SN211","q":"PostgreSQL MVCC'da uzoq ochiq tranzaksiya nega xavfli?","o":["Faqat qulf ushlaydi","Eski qator versiyalari (dead tuple) tozalanmaydi: `VACUUM` `xmin` horizontidan o'tolmaydi — jadval va indeks shishadi (bloat), query sekinlashadi, og'ir holatda transaction ID wraparound xavfi paydo bo'ladi","Xotira oshadi faqat","WAL to'xtaydi"],"a":1,"e":"Shu sabab `idle in transaction` sessiyalar kuzatiladi (`pg_stat_activity`) va `idle_in_transaction_session_timeout` qo'yiladi. Xuddi shu ta'sirni uzoq ishlayotgan replica query'lari (`hot_standby_feedback`) va to'xtagan replication slot'lar ham beradi. Amaliy qoida: tranzaksiya ichida tashqi HTTP chaqiruv yoki foydalanuvchi kutishi bo'lmasligi kerak."},{"l":"S","t":"mcq","tp":"Isolation","d":"db","id":30211,"n":"SN212","q":"`REPEATABLE READ` (PostgreSQL) qanday anomaliyani yechmaydi?","o":["Hech qanday, hammasini yechadi","Write skew: ikki tranzaksiya bir-birining o'qigan ma'lumotiga tayanib turli qatorlarni o'zgartiradi (masalan 'kamida bitta shifokor navbatchi bo'lishi kerak' qoidasi ikki tomondan buziladi); buni `SERIALIZABLE` yoki aniq qulf (`SELECT ... FOR UPDATE`) yechadi","Dirty read","Lost update"],"a":1,"e":"PostgreSQL `REPEATABLE READ` snapshot izolyatsiyasi: dirty/non-repeatable read va phantom yo'q, lekin write skew qoladi. Yechimlar: `SERIALIZABLE` (SSI — konflikt bo'lsa `40001` bilan rollback, demak retry mantiqi kerak), yoki invariantni bitta qatorga jamlab qulflash, yoki DB constraint bilan ifodalash."},{"l":"S","t":"mcq","tp":"Locking","d":"db","id":30212,"n":"SN213","q":"Deadlock'ni kamaytirish uchun eng samarali amaliyot?","o":["Retry qo'shish yetarli","Qulflarni har joyda bir xil tartibda olish (masalan ID bo'yicha o'sish), tranzaksiyani qisqa ushlash, kerakli minimal qatorni qulflash, va `lock_timeout` bilan uzoq kutishni kesish; ustiga `40P01` uchun retry","Izolyatsiyani pasaytirish","Indeksni o'chirish"],"a":1,"e":"Deadlock ko'pincha teskari tartibdan kelib chiqadi: A→B va B→A. Tartibni normallashtirish (`ORDER BY id` bilan `SELECT ... FOR UPDATE`) muammoni ildizdan yechadi. DB deadlock'ni aniqlab bittasini bekor qiladi, shuning uchun ilova `40P01`/`40001` da idempotent retry qilishi kerak — lekin retry sababni yashirmasligi uchun metrikada sanalishi lozim."},{"l":"S","t":"mcq","tp":"MVCC","d":"db","id":30360,"n":"SN361","q":"PostgreSQL MVCC'da uzoq ochiq tranzaksiya nega xavfli?","o":["Faqat qulf ushlaydi","Eski qator versiyalari (dead tuple) tozalanmaydi: `VACUUM` `xmin` horizontidan o'tolmaydi — jadval va indeks shishadi (bloat), query sekinlashadi, og'ir holatda transaction ID wraparound xavfi paydo bo'ladi","Xotira oshadi faqat","WAL to'xtaydi"],"a":1,"e":"Shu sabab `idle in transaction` sessiyalar kuzatiladi (`pg_stat_activity`) va `idle_in_transaction_session_timeout` qo'yiladi. Xuddi shu ta'sirni uzoq ishlayotgan replica query'lari (`hot_standby_feedback`) va to'xtagan replication slot'lar ham beradi. Amaliy qoida: tranzaksiya ichida tashqi HTTP chaqiruv yoki foydalanuvchi kutishi bo'lmasligi kerak."},{"l":"S","t":"mcq","tp":"Isolation","d":"db","id":30361,"n":"SN362","q":"`REPEATABLE READ` (PostgreSQL) qanday anomaliyani yechmaydi?","o":["Hech qanday, hammasini yechadi","Write skew: ikki tranzaksiya bir-birining o'qigan ma'lumotiga tayanib turli qatorlarni o'zgartiradi (masalan 'kamida bitta shifokor navbatchi bo'lishi kerak' qoidasi ikki tomondan buziladi); buni `SERIALIZABLE` yoki aniq qulf (`SELECT ... FOR UPDATE`) yechadi","Dirty read","Lost update"],"a":1,"e":"PostgreSQL `REPEATABLE READ` snapshot izolyatsiyasi: dirty/non
