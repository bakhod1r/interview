-repeatable read va phantom yo'q, lekin write skew qoladi. Yechimlar: `SERIALIZABLE` (SSI — konflikt bo'lsa `40001` bilan rollback, demak retry mantiqi kerak), yoki invariantni bitta qatorga jamlab qulflash, yoki DB constraint bilan ifodalash."},{"l":"S","t":"mcq","tp":"Locking","d":"db","id":30362,"n":"SN363","q":"Deadlock'ni kamaytirish uchun eng samarali amaliyot?","o":["Retry qo'shish yetarli","Qulflarni har joyda bir xil tartibda olish (masalan ID bo'yicha o'sish), tranzaksiyani qisqa ushlash, kerakli minimal qatorni qulflash, va `lock_timeout` bilan uzoq kutishni kesish; ustiga `40P01` uchun retry","Izolyatsiyani pasaytirish","Indeksni o'chirish"],"a":1,"e":"Deadlock ko'pincha teskari tartibdan kelib chiqadi: A→B va B→A. Tartibni normallashtirish (`ORDER BY id` bilan `SELECT ... FOR UPDATE`) muammoni ildizdan yechadi. DB deadlock'ni aniqlab bittasini bekor qiladi, shuning uchun ilova `40P01`/`40001` da idempotent retry qilishi kerak — lekin retry sababni yashirmasligi uchun metrikada sanalishi lozim."},{"l":"S","t":"mcq","tp":"Idempotency","d":"db","id":30398,"n":"SN399","q":"Advisory lock (`pg_advisory_xact_lock`) qachon to'g'ri vosita?","o":["Har doim qator qulfi o'rniga","Qator mavjud bo'lmagan yoki jadvalga bog'lanmagan mantiqiy resursni qulflashda: 'bitta tenant uchun bir vaqtda bitta import', 'leader election', 'bitta cron bir instansiyada' — kalit hash orqali beriladi","Tranzaksiya o'rniga","Faqat read uchun"],"a":1,"e":"`xact` variantida qulf commit/rollback bilan avtomatik bo'shaydi (sessiya variantini qo'lda bo'shatish kerak — leak xavfi). Bu Redis-lock'dan afzal tomoni: DB bilan bir xil tranzaksion kontekst va failover'da holat aniq. Cheklovi — qulflar bitta DB node'da, shuning uchun u DB availability'siga bog'liq."},{"l":"P","t":"mcq","tp":"MVCC","d":"db","id":30427,"n":"SN428","q":"PostgreSQL snapshot izolyatsiyasi ichkarida qanday ishlaydi?","o":["Qulflar bilan","Har qator versiyasida `xmin` (yaratgan tranzaksiya) va `xmax` (o'chirgan) bor; snapshot — `xmin` chegarasi, `xmax` chegarasi va faol tranzaksiyalar ro'yxati. Qator ko'rinadi, agar uni yaratgan tranzaksiya snapshot uchun tugagan bo'lsa va o'chirgani ko'rinmasa","Har o'qishda qulf olinadi","Faqat `SERIALIZABLE`da"],"a":1,"e":"Shu sabab o'qish yozuvni bloklamaydi va aksincha (readers don't block writers). Amaliy oqibatlar: eski versiyalar vacuum'gacha saqlanadi (bloat), uzoq tranzaksiya barcha eski versiyalarni ushlab turadi, va `SELECT`lar ham `xmin` horizontiga ta'sir qiladi. `SERIALIZABLE` esa ustiga SSI konflikt kuzatuvini qo'shadi."},{"l":"P","t":"mcq","tp":"Isolation","d":"db","id":30428,"n":"SN429","q":"`SERIALIZABLE` (SSI) PostgreSQL'da qanday amalga oshirilgan?","o":["Barcha tranzaksiyani ketma-ket bajaradi","Optimistik: predicate qulflari (SIRead) bilan o'qish-yozish bog'liqliklari kuzatiladi; xavfli naqsh (dangerous structure) aniqlansa tranzaksiyalardan biri `40001` bilan bekor qilinadi — shuning uchun ilova retry qilishi shart","Har doim bloklaydi","Faqat bitta ulanishda"],"a":1,"e":"Afzalligi: write skew kabi anomaliyalar to'liq yo'qoladi va qo'lda qulf qo'yish kerak emas. Narxi: yuqori konkurentlikda rollback chastotasi oshadi (retry mantiqi va idempotentlik majburiy), SIRead qulflari xotira yeydi, va uzoq tranzaksiyalar konflikt ehtimolini oshiradi. Retry — eksponensial backoff bilan va cheklangan urinish."},{"l":"S","t":"mcq","tp":"Locking","d":"db","id":30429,"n":"SN430","q":"`FOR UPDATE`, `FOR NO KEY UPDATE`, `FOR SHARE`, `FOR KEY SHARE` farqi?","o":["Faqat nom farqi","Qulf kuchi bo'yicha: `FOR UPDATE` eng kuchli (boshqa har qanday qator qulfini bloklaydi), `FOR NO KEY UPDATE` kalit bo'lmagan ustunlarni yangilash uchun (FK tekshiruvlari bilan kamroq to'qnashadi), `FOR SHARE`/`FOR KEY SHARE` o'qish uchun — FK bo'yicha ota qator o'chirilmasligini kafolatlaydi","Faqat `FOR UPDATE` ishlaydi","Hammasi teng"],"a":1,"e":"Amaliy muammo: foreign key mavjud bo'lsa bola jadvalga insert ota qatorga `FOR KEY SHARE` qulfini oladi — bu ota qatorni `FOR UPDATE` bilan qulflagan jarayon bilan to'qnashadi va kutilmagan bloklanish beradi. Shu sabab agregat qatorni faqat kerakli darajada qulflash (`FOR NO KEY UPDATE`) contention'ni kamaytiradi."},{"l":"S","t":"mcq","tp":"Transactions","d":"db","id":30430,"n":"SN431","q":"Tranzaksiya ichida tashqi HTTP chaqiruv qilish nega yomon?","o":["Ishlaydi, muammo yo'q","Qulflar va snapshot tashqi servis javobini kutib turadi: vacuum to'xtaydi, boshqa yozuvlar bloklanadi, pool tugaydi; tashqi chaqiruv timeout bo'lsa tranzaksiya uzoq ochiq qoladi. To'g'ri: tranzaksiyani yopib, keyin chaqiruv, natijani outbox/statusga yozish","Faqat sekin","HTTP tranzaksiyani buzadi"],"a":1,"e":"Bu eng ko'p uchraydigan 'DB sekinlashdi' sababi. To'g'ri naqsh: (1) DB tranzaksiyasida intent + outbox yozuvi, commit; (2) tashqi chaqiruv; (3) natijani alohida qisqa tranzaksiyada yozish; noma'lum holat uchun reconcile. Xuddi shu qoida uzoq hisob-kitob va foydalanuvchi kutishiga ham tegishli."},{"l":"S","t":"open","tp":"Migrations","d":"db","id":29,"n":30,"q":"Production'da katta table'dagi column nomini downtime'siz qanday o'zgartirasiz?","m":["To'g'ridan-to'g'ri RENAME — eski kod versiyasi darhol sinadi (deploy paytida ikki versiya ishlaydi)","Expand–contract: 1) yangi column qo'shish (nullable, default'siz)","2) Ilova ikkala column'ga yozadi (dual write) yoki trigger","3) Eski ma'lumotni batchlab backfill (kichik batch, throttle)","4) O'qishni yangi column'ga o'tkazish, 5) eski column'dan yozishni to'xtatish, 6) keyinroq DROP","lock_timeout qo'yish; ALTER qisqa ACCESS EXCLUSIVE lock kutib, butun trafikni bloklashi mumkin"],"e":"Senior signal: deploy vaqtida eski va yangi kod parallel ishlashini hisobga olish, backfill'ni bitta ulkan UPDATE emas batch bilan qilish va lock_timeout. Har bosqich alohida deploy va alohida rollback qilinadi."},{"l":"S","t":"mcq","tp":"Replication","d":"db","id":32,"n":33,"q":"Asinxron replikatsiyaning asosiy xavfi?","o":["Yozish sekinlashadi","Failover paytida primary'da commit bo'lgan, lekin replicaga yetib bormagan ma'lumot yo'qoladi (RPO > 0)","Replica yozishni qabul qiladi","Indexlar replicaga ko'chmaydi"],"a":1,"e":"Sinxron replikatsiya: commit kamida bitta replica tasdiqlagach — RPO=0, lekin latency oshadi va replica o'lsa yozish to'xtashi mumkin. Amaliy kompromis: quorum/semi-sync (Postgres synchronous_standby_names = ANY 1 (...)). Async'da replica lag ham o'qishlarda eskirgan ma'lumot beradi."},{"l":"S","t":"open","tp":"Replication","d":"db","id":33,"n":34,"q":"Read replica ishlatyapsiz. User profilini yangiladi, page yangilanganda eski ma'lumot ko'rindi. Sabab va yechimlar?","m":["Sabab: replication lag — o'qish replicadan, yozish primary'dan","Read-your-writes: yozgan userning keyingi N soniyadagi o'qishlarini primary'ga yo'naltirish","LSN tracking: yozishdan keyin LSN ni saqlash, replica shu LSN ga yetguncha kutish yoki primary'ga o'tish","Kritik o'qishlar (to'lov, balans) doim primary'dan","Lag monitoringi va alert (pg_stat_replication replay_lag)"],"e":"Yaxshi javob biznesga qarab tabaqalaydi: ko'p o'qishlar eventual consistency'ga chidaydi, faqat 'o'z yozganini ko'rish' kerak. Sticky session / LSN-based routing — Staff darajadagi detal."},{"l":"S","t":"mcq","tp":"Partitioning","d":"db","id":34,"n":35,"q":"Katta <code>events</code> table'ini <code>created_at</code> bo'yicha oylik RANGE partition qilishning eng katta foydasi?","o":["Har qanday query tezlashadi","Partition pruning (sana bo'yicha query faqat kerakli partitionni o'qiydi) va eski ma'lumotni DROP/DETACH PARTITION bilan bir zumda o'chirish","UNIQUE constraint'lar osonlashadi","Replikatsiya kerak bo'lmay qoladi"],"a":1,"e":"DELETE WHERE created_at < ... millionlab dead tuple va WAL yaratadi; DROP PARTITION — metadata operatsiya. Kamchiliklar: partition key'siz query'lar hamma partitionni skan qiladi; unique/PK partition key'ni o'z ichiga olishi shart; juda ko'p partition planner'ni sekinlatadi."},{"l":"S","t":"open","tp":"Ops","d":"db","id":37,"n":38,"q":"Connection pool hajmini qanday tanlaysiz? PgBouncer transaction mode'ning tuzoqlari nima?","m":["Postgres har connection'ga process ochadi — minglab connection memory va context switch muammosi","Formula boshlang'ich nuqta: ~ (CPU yadro × 2) + disk; ko'proq connection ≠ ko'proq throughput","Ilova instance'lari × pool size ≤ max_connections (replica, admin uchun zaxira)","Transaction mode: session state yo'qoladi — SET, advisory lock, LISTEN, temp table, session-level prepared statement ishlamaydi (PgBouncer 1.21+ protocol-level prepared statement'larni qo'llaydi)","Pool kutish vaqtini (wait time) monitoring qilish"],"e":"Senior signal: 'pool'ni oshiraylik' refleksiga qarshi turish — DB to'yingan bo'lsa ko'proq connection latency'ni oshiradi. Queueing ilovada bo'lgani yaxshiroq."},{"l":"S","t":"mcq","tp":"Migrations","d":"db","id":38,"n":39,"q":"50M row'li table'ga production'da <code>CREATE INDEX</code> ishga tushirildi. Nima bo'ladi va to'g'ri yo'l?","o":["Hech narsa, indexlar fon rejimida quriladi","Table'ga yozish (INSERT/UPDATE/DELETE) index qurilguncha bloklanadi; to'g'ri yo'l — CREATE INDEX CONCURRENTLY","O'qish ham, yozish ham bloklanmaydi","Table o'chib ketadi"],"a":1,"e":"Oddiy CREATE INDEX SHARE lock oladi — o'qish mumkin, yozish yo'q. CONCURRENTLY sekinroq, transaction ichida ishlamaydi va success'siz bo'lsa INVALID index qoldiradi (DROP qilib qayta urinish kerak). Migratsiya toollari (Rails, Django) uchun buni alohida belgilash kerak."},{"l":"St","t":"open","tp":"Sharding","d":"db","id":40,"n":41,"q":"Multi-tenant SaaS uchun sharding strategiyasini loyihalang. Shard key, 'hot tenant' va rebalancing?","m":["Shard key: tenant_id — tenant ichidagi query'lar bitta shardda, JOIN va transaction lokal","Cross-tenant query'lar (analitika) — alohida DWH/CDC orqali, OLTP'da emas","Hot/katta tenant: alohida dedicated shard; directory-based (lookup) mapping hash'dan moslashuvchan","Rebalancing: tenant'ni ko'chirish — logical replication/dual-write + cutover, qisqa read-only oyna","Global table'lar (plans, config) — har shardga replikatsiya","Avval vertikal masshtab, read replica, partitioning — sharding oxirgi chora (operatsion narx)"],"e":"Staff signal: 'sharding kerakmi?' degan savoldan boshlash va operatsion narxni aytish. Directory mapping (tenant → shard table'i) consistent hashing'dan ko'ra tenant ko'chirishni osonlashtiradi. Citus, Vitess misol sifatida."},{"l":"St","t":"open","tp":"Migration","d":"db","id":42,"n":43,"q":"Monolit bitta umumiy DB'dan mikroservislarga har servisga o'z DB bilan o'tishni qanday rejalashtirasiz?","m":["Avval bounded context bo'yicha table egaligini aniqlash; boshqa servis table'iga to'g'ridan-to'g'ri JOIN'larni topish","Strangler fig: bitta context'ni ajratish, avval kod level'ida (modul), keyin DB","Ma'lumot ko'chirish: CDC (Debezium) bilan yangi DB'ga sinxron, keyin read switch, keyin write switch","JOIN'lar o'rniga API chaqiruv yoki lokal read-model (event orqali)","Transaction'lar → saga + outbox; konsistentlik chegarasi o'zgaradi — biznes bilan kelishish","Har qadam rollback qilinadigan, feature flag bilan"],"e":"Staff level'da kutiladi: 'big bang' emas, bosqichli; va texnik bo'lmagan narx — cross-servis hisobotlar, eventual consistency'ni biznes qabul qilishi. Shared DB — integratsiya anti-pattern, lekin tezda ajratish ham xavfli."},{"l":"St","t":"open","tp":"Backup","d":"db","id":47,"n":48,"q":"Muhim DB uchun backup/DR strategiyasini loyihalang. RPO va RTO qanday belgilanadi?","m":["RPO — qancha ma'lumot yo'qotishga chidaymiz; RTO — qancha vaqtda tiklanamiz; biznes bilan kelishiladi","Base backup + WAL arxiv (pgBackRest/WAL-G) → PITR (masalan xato DELETE'dan oldingi daqiqaga)","Replika backup emas: DROP TABLE replicaga ham ketadi; delayed replica qo'shimcha himoya","Backup'lar boshqa region/akkauntda, shifrlangan, immutable (ransomware)","Tiklashni muntazam test qilish — tekshirilmagan backup = backup yo'q","Tiklash vaqtini o'lchash, runbook"],"e":"Staff javobning o'zagi: 'backup'ni qilish emas, tiklashni isbotlash'. RPO/RTO'ni texnik emas biznes qarori sifatida qo'yish."},{"l":"St","t":"mcq","tp":"Sharding","d":"db","id":48,"n":49,"q":"Consistent hashing'ning oddiy <code>hash(key) % N</code> ga nisbatan asosiy afzalligi?","o":["Hash tezroq hisoblanadi","Node qo'shilganda/olib tashlanganda key'larning faqat ~1/N qismi ko'chadi (% N da deyarli hammasi ko'chadi)","Hot key muammosini butunlay hal qiladi","Replikatsiya kerak emas"],"a":1,"e":"% N da N o'zgarsa deyarli hamma key boshqa node'ga tushadi — cache yoki shard uchun halokat. Virtual node'lar yukni tekisroq taqsimlaydi. Hot key muammosini hal qilmaydi — buning uchun key splitting yoki keshlash kerak."},{"l":"P","t":"open","tp":"Cost","d":"db","id":55,"n":56,"q":"DB xarajati yiliga $2M ga yetdi. Uni qanday kamaytirasiz?","m":["Avval o'lchash: qaysi servis/query/table qancha resurs yeydi (pg_stat_statements, cost attribution)","Qimmat query'lar: indexlar, N+1, keraksiz polling; cache qatlami","Ma'lumot lifecycle: eski ma'lumot → arzon storage (S3/Parquet), partition drop","Right-sizing: haddan tashqari instance, ishlatilmagan replica; reserved/savings plan","Analitik yukni OLTP'dan DWH'ga ko'chirish","Har tejash taklifini risk va muhandislik vaqti bilan solishtirish"],"e":"Principal javob: tartib — o'lchash, eng katta ulushdan boshlash, unit economics (query/user boshiga narx) ni kuzatish, va tejash reliability'ni buzmasligi."},{"l":"P","t":"open","tp":"Incident","d":"db","id":57,"n":58,"q":"Peak vaqtida DB CPU 100%, API latency 10x oshdi. Birinchi 15 daqiqada nima qilasiz?","m":["Incident e'lon qilish, rollarni belgilash (IC, comms), status page","Oxirgi o'zgarishlar: deploy, migratsiya, feature flag — shubha bo'lsa rollback","pg_stat_activity: uzoq query'lar, lock kutish; pg_stat_statements: top query'lar","Tez yengillatish: aybdor query'ni o'ldirish, og'ir feature/cron'ni o'chirish, rate limit, load shedding","Stabilizatsiyadan keyin ildiz sabab; blameless postmortem va takrorlanmaslik choralari"],"e":"Principal signal: avval mitigatsiya, keyin tahlil; kommunikatsiya; 'nima o'zgardi?' birinchi savol. Instance'ni kattalashtirish — oxirgi chora, chunki vaqt oladi va sababni yashiradi."},{"l":"M","t":"mcq","tp":"Ops","d":"db","id":69,"n":70,"q":"PostgreSQL'da <code>shared_buffers</code> va <code>work_mem</code> nima?","o":["Ikkalasi ham disk cache'i","shared_buffers — butun instance uchun umumiy page cache'i (odatda RAM ning ~25%). work_mem — HAR sort/hash operatsiyasi uchun ajratiladigan memory: ko'p parallel query'da ko'paytiriladi, shuning uchun ehtiyot bo'lib oshiriladi","work_mem butun server uchun","shared_buffers har connection uchun"],"a":1,"e":"work_mem yetmasa Sort/Hash diskka tushadi (EXPLAIN'da 'external merge Disk: ...'). Xavf: work_mem × parallel operatsiyalar soni × connection'lar = OOM. Yaxshi amaliyot: global qiymatni mo''tadil qoldirib, og'ir hisobot uchun sessiyada oshirish (SET LOCAL work_mem). Boshqa muhim parametrlar: effective_cache_size (planner uchun maslahat), maintenance_work_mem (VACUUM/CREATE INDEX), max_connections.","src":"https://www.postgresql.org/docs/current/runtime-config-resource.html"},{"l":"S","t":"mcq","tp":"Ops","d":"db","id":70,"n":71,"q":"WAL va checkpoint qanday bog'liq?","o":["Bog'liq emas","Har o'zgarish avval WAL'ga yoziladi (durability); checkpoint esa 'iflos' page'larni ma'lumot fayllariga tushiradi va tiklash uchun boshlanish nuqtasini belgilaydi. Checkpoint tez-tez bo'lsa I/O tepaligi, kam bo'lsa tiklash uzoq davom etadi","Checkpoint WAL'ni o'chiradi va ma'lumot yo'qoladi","WAL faqat replikatsiya uchun"],"a":1,"e":"Sozlamalar: max_wal_size, checkpoint_timeout, checkpoint_completion_target (yozishni vaqtga yoyish). 'checkpoints are occurring too frequently' logdagi ogohlantirish — max_wal_size ni oshirish signali. WAL shuningdek PITR va logical/physical replikatsiya asosi."},{"l":"S","t":"mcq","tp":"Ops","d":"db","id":71,"n":72,"q":"Postgres'da security'ni qanday tashkil qilasiz (rollar va kirish)?","o":["Hamma ilovaga superuser berish","Eng kam huquq: ilova uchun alohida rol, faqat kerakli schema/table huquqlari; migratsiya uchun alohida rol; pg_hba.conf bilan kirish manbai va autentifikatsiya usuli (scram-sha-256), TLS majburiy; kerak bo'lsa Row Level Security (multi-tenant)","Faqat parol qo'yish yetarli","Ruxsatlar ilovada tekshirilsa kifoya"],"a":1,"e":"Rollar meros oladi (GRANT role TO role) — jamoaviy huquqlarni boshqarish uchun qulay. RLS multi-tenant izolyatsiyada kuchli: WHERE tenant_id unutilsa ham DB himoya qiladi. Yana: default privileges (kelajakdagi table'lar uchun), audit (pgaudit), maxfiy column'lar uchun shifrlash.","src":"https://www.postgresql.org/docs/current/ddl-rowsecurity.html"},{"l":"S","t":"mcq","tp":"Migrations","d":"db","id":72,"n":73,"q":"Katta production DB'ni yangi major versiyaga (masalan 14 → 16) qanday ko'tarasiz?","o":["Faqat paketni yangilash yetarli","Variantlar: pg_upgrade (--link bilan tez, lekin qaytarish qiyin, downtime bor) yoki logical replication bilan yangi versiyaga ko'chirib, qisqa cutover qilish (deyarli nol downtime). Ikkala holatda ham: test muhitida mashq, ANALYZE ni qayta ishga tushirish, rollback rejasi","Major yangilanish ma'lumotni saqlab qolmaydi","Faqat dump/restore mumkin"],"a":1,"e":"Major yangilanishda ichki format o'zgaradi — oddiy restart yetarli emas. Yangilanishdan keyin statistikalar yo'qoladi: darhol ANALYZE (yoki vacuumdb --analyze-in-stages), aks holda query'lar sekin bo'ladi. Extension'lar va ularning versiyalari ham tekshiriladi."},{"l":"S","t":"open","tp":"Ops","d":"db","id":85,"n":86,"q":"DB bilan bog'liq qanday failure mode'larni bilasiz va har biriga qanday tayyorgarlik ko'rasiz?","m":["Primary yiqilishi — failover (Multi-AZ/Patroni), ilovada qayta connection va retry, RPO ni bilish","Connection'lar tugashi — pool cheklovi, PgBouncer, timeout'lar","Disk to'lishi — WAL va log o'sishi, unutilgan replication slot; monitoring va alert","Uzoq transaction va lock zanjiri — lock_timeout, statement_timeout, idle_in_transaction_session_timeout","Sekin query tufayli CPU 100% — pg_stat_statements, plan regressiya, query'ni o'ldirish","Replica lag — o'qishni primary'ga qaytarish, lag alert","Inson xatosi (DROP/DELETE) — PITR, delayed replica, ruxsatlarni cheklash","Har biri uchun runbook va muntazam tiklash mashqi"],"e":"Senior intervyusida 'nima bo'lishi mumkin va siz nima qilasiz' shaklida so'raladi. Kuchli javob har nosozlikka aniq mexanizm va o'lchov (alert) bog'laydi."},{"l":"S","t":"mcq","tp":"Ops","d":"db","id":87,"n":88,"q":"Kecha tez ishlagan query bugun sekin (plan regressiya). Ehtimoliy sabablar?","o":["Faqat ma'lumot ko'payganligi","Statistika eskirgan (ANALYZE ishlamagan), ma'lumot taqsimoti o'zgargan, index bloat, parametr sniffing / noto'g'ri baholash, yoki yangi index/versiya planner tanlovini o'zgartirgan","Faqat network","DB versiyasi hech qachon ta'sir qilmaydi"],"a":1,"e":"Diagnostika: EXPLAIN (ANALYZE) da 'rows' taxmini va 'actual rows' farqi — statistikaga ishora; ANALYZE yoki column uchun statistika maqsadini oshirish (ALTER TABLE ... SET STATISTICS), ko'p column'li bog'liqlik uchun CREATE STATISTICS. Vaqtinchalik chora sifatida query'ni qayta yozish (masalan LATERAL yoki CTE MATERIALIZED) ishlatiladi."},{"l":"M","t":"mcq","tp":"Go+DB","d":"db","id":5014,"n":"V15","q":"Go'da <code>database/sql</code> yoki <code>pgx</code> pool'ini sozlashda eng muhim parametr?","o":["Hech qanday sozlash kerak emas","SetMaxOpenConns — cheklanmasa yuk paytida Postgres max_connections tugaydi; shuningdek SetMaxIdleConns va SetConnMaxLifetime (uzoq yashagan connection'larni almashtirish uchun)","Faqat SetMaxIdleConns","Driver o'zi optimal sozlaydi"],"a":1,"e":"Default MaxOpenConns — cheksiz: 50 pod × cheksiz = DB yiqiladi. Hisob: hamma instance × pool ≤ max_connections minus zaxira. MaxIdleConns MaxOpenConns'dan kichik bo'lsa, connection'lar doim yopilib-ochiladi (TLS handshake narxi). ConnMaxLifetime — LB va failover'dan keyin eski connection'larni tozalaydi.","src":"https://pkg.go.dev/database/sql#DB.SetMaxOpenConns"},{"l":"M","t":"mcq","tp":"Go+DB","d":"db","id":5015,"n":"V16","q":"Go'da <code>rows, err := db.QueryContext(...)</code> dan keyin eng ko'p uchraydigan xato?","o":["err ni tekshirmaslik","defer rows.Close() ni unutish — connection pool'ga qaytmaydi va pool tugaydi; shuningdek sikl tugagach rows.Err() ni tekshirmaslik (yarim o'qilgan natija xatosi yashirin qoladi)","Context uzatish","QueryRow ishlatish"],"a":1,"e":"rows.Close() bitta row qolib ketganda ham zarur (return yoki break bilan chiqilsa). QueryRow'da Close kerak emas — Scan o'zi yopadi. Context bekor bo'lsa query ham bekor qilinadi (Postgres'ga cancel yuboriladi) — HTTP handler context'ini DB chaqiruviga uzating."},{"l":"S","t":"mcq","tp":"Go+DB","d":"db","id":5016,"n":"V17","q":"PgBouncer transaction mode ortida Go ilovasi 'prepared statement does not exist' xatosi beryapti. Sabab?","o":["Driver eskirgan","Transaction mode'da har transaction boshqa serverdagi connection'ga tushishi mumkin — session'ga bog'langan prepared statement'lar yo'qoladi. Yechim: prepared statement cache'ini o'chirish (pgx'da QueryExecModeSimpleProtocol/exec) yoki PgBouncer 1.21+ dagi protokol darajasidagi qo'llab-quvvatlashdan foydalanish","Postgres versiyasi eski","Pool hajmi katta"],"a":1,"e":"Transaction mode'da yo'qoladigan boshqa narsalar: SET, LISTEN/NOTIFY, temp table'lar, session-level advisory lock. Shuning uchun advisory lock kerak bo'lsa transaction-level (pg_advisory_xact_lock) variantini ishlating."},{"l":"S","t":"mcq","tp":"Ops","d":"db","id":14010,"n":"SR11","q":"Ilovada 200 ta ishchi thread/goroutine bor, DB pool hajmi 30. Yuk oshganda nima bo'ladi?","o":["200 ta so'rov bir vaqtda DB'ga boradi","Bir vaqtda ko'pi bilan 30 tasi DB bilan ishlaydi, qolganlari pool'dan ulanish kutadi — kutish vaqti latency'ga qo'shiladi va pool timeout bo'lsa xato qaytadi. Muammo DB sekinligi emas, navbat","Pool avtomatik kengayadi","So'rovlar yo'qoladi"],"a":1,"e":"Kuzatiladigan metrika: pool wait time va band ulanishlar ulushi. Pool'ni ko'r-ko'rona oshirish DB'ni yiqitadi (Postgres'da har ulanish — alohida process). To'g'ri yo'l: sekin query'larni tuzatish, tranzaksiyani qisqartirish, kerakli joyda kesh, va ilova darajasida konkurentlikni cheklash (semaphore).","src":"https://www.secondtalent.com/interview-guide/backend-performance-optimization/"},{"l":"S","t":"mcq","tp":"Go+DB","d":"db","id":14028,"n":"SR29","q":"Go'da NULL bo'lishi mumkin bo'lgan ustunlarni qanday o'qiysiz?","o":["Oddiy string'ga skanerlash yetarli","sql.NullString / sql.NullInt64 yoki pointer (*string); pgx'da esa pgtype tiplari. Oddiy string'ga NULL skanerlansa xato qaytadi ('converting NULL to string is unsupported')","NULL avtomatik bo'sh satrga aylanadi","COALESCE ishlatish taqiqlangan"],"a":1,"e":"Amaliy maslahat: domain modelda Null* tiplarini tarqatmang — repository qatlamida pointer yoki default qiymatga aylantiring. Ko'pincha eng yaxshi yechim — sxemada NOT NULL DEFAULT qo'yib, NULL'ni umuman yo'q qilish."},{"l":"S","t":"mcq","tp":"Partitioning","d":"db","id":30229,"n":"SN230","q":"PostgreSQL'da vaqt bo'yicha partitionlash qanday foyda beradi?","o":["Query har doim tezlashadi","Eski ma'lumotni `DROP PARTITION` bilan bir zumda o'chirish (`DELETE` va vacuum yuki yo'q), partition pruning bilan skan hajmini kamaytirish, indekslarni kichik ushlash va `VACUUM`/`REINDEX` ni bo'laklab qilish","Faqat disk tejaydi","Indeks keraksiz bo'ladi"],"a":1,"e":"Eng katta amaliy foyda — retention: `DELETE FROM events WHERE created_at < ...` milliard qatorda soatlab ishlaydi va bloat qoldiradi, `DROP TABLE` esa millisekund. Shartlar: partition kaliti query'larda bo'lishi kerak (aks holda barcha partition skan qilinadi), unique constraint kalitni o'z ichiga olishi kerak, va partitionlarni oldindan yaratish avtomatlashtirilishi lozim (`pg_partman`)."},{"l":"St","t":"open","tp":"Ops","d":"db","id":30230,"n":"SN231","q":"Productionda PostgreSQL CPU 100%, ilova timeout beryapti. Qadam-baqadam nima qilasiz?","m":["Birinchi: ta'sirni cheklash — `pg_stat_activity` dan eng og'ir/uzun query'larni topish, kerak bo'lsa `pg_cancel_backend` (avval cancel, keyin `pg_terminate_backend`)","Sabab toifalari: yangi deploy bilan kelgan query (plan o'zgardi), statistikaning eskirishi, indeks yo'qligi, lock kutish zanjiri (`pg_locks`, `pg_blocking_pids`), vacuum/autovacuum og'ir ishi, yoki trafik o'sishi","Tez choralar: eng qimmat query'ni bloklash/rate limit qilish, `statement_timeout` qo'yish, kesh qatlamini yoqish, read replica'ga o'qishni ko'chirish, ilova pool'ini kamaytirish (paradoks: kamroq ulanish — kamroq kontention)","`pg_stat_statements` bo'yicha total vaqt reytingi — real aybdor ko'pincha 'sekin' emas, 'juda tez-tez' query","Tuzatgandan keyin: `EXPLAIN (ANALYZE, BUFFERS)` bilan plan tekshirish, indeks qo'shish (`CONCURRENTLY`), `ANALYZE`, va zarur bo'lsa query'ni qayta yozish","Profilaktika: `pg_stat_statements` doimiy monitoringda, sekin query log, migratsiya va deploy'da plan regressiyasini tekshirish, `lock_timeout` standart sozlama sifatida","Aloqa: incident kanalida holat, ta'sir va ETA; postmortem bilan yopish"],"e":"Kutiladigan tartib: mitigation avval (cancel/timeout/trafikni kamaytirish), keyin sabab (`pg_stat_statements`, `EXPLAIN`), keyin profilaktika. 'Indeks qo'shaman' darhol aytilishi — diagnozsiz harakat belgisidir."},{"l":"S","t":"mcq","tp":"Partitioning","d":"db","id":30379,"n":"SN380","q":"PostgreSQL'da vaqt bo'yicha partitionlash qanday foyda beradi?","o":["Query har doim tezlashadi","Eski ma'lumotni `DROP PARTITION` bilan bir zumda o'chirish (`DELETE` va vacuum yuki yo'q), partition pruning bilan skan hajmini kamaytirish, indekslarni kichik ushlash va `VACUUM`/`REINDEX` ni bo'laklab qilish","Faqat disk tejaydi","Indeks keraksiz bo'ladi"],"a":1,"e":"Eng katta amaliy foyda — retention: `DELETE FROM events WHERE created_at < ...` milliard qatorda soatlab ishlaydi va bloat qoldiradi, `DROP TABLE` esa millisekund. Shartlar: partition kaliti query'larda bo'lishi kerak (aks holda barcha partition skan qilinadi), unique constraint kalitni o'z ichiga olishi kerak, va partitionlarni oldindan yaratish avtomatlashtirilishi lozim (`pg_partman`)."},{"l":"St","t":"open","tp":"Ops","d":"db","id":30380,"n":"SN381","q":"Productionda PostgreSQL CPU 100%, ilova timeout beryapti. Qadam-baqadam nima qilasiz?","m":["Birinchi: ta'sirni cheklash — `pg_stat_activity` dan eng og'ir/uzun query'larni topish, kerak bo'lsa `pg_cancel_backend` (avval cancel, keyin `pg_terminate_backend`)","Sabab toifalari: yangi deploy bilan kelgan query (plan o'zgardi), statistikaning eskirishi, indeks yo'qligi, lock kutish zanjiri (`pg_locks`, `pg_blocking_pids`), vacuum/autovacuum og'ir ishi, yoki trafik o'sishi","Tez choralar: eng qimmat query'ni bloklash/rate limit qilish, `statement_timeout` qo'yish, kesh qatlamini yoqish, read replica'ga o'qishni ko'chirish, ilova pool'ini kamaytirish (paradoks: kamroq ulanish — kamroq kontention)","`pg_stat_statements` bo'yicha total vaqt reytingi — real aybdor ko'pincha 'sekin' emas, 'juda tez-tez' query","Tuzatgandan keyin: `EXPLAIN (ANALYZE, BUFFERS)` bilan plan tekshirish, indeks qo'shish (`CONCURRENTLY`), `ANALYZE`, va zarur bo'lsa query'ni qayta yozish","Profilaktika: `pg_stat_statements` doimiy monitoringda, sekin query log, migratsiya va deploy'da plan regressiyasini tekshirish, `lock_timeout` standart sozlama sifatida","Aloqa: incident kanalida holat, ta'sir va ETA; postmortem bilan yopish"],"e":"Kutiladigan tartib: mitigation avval (cancel/timeout/trafikni kamaytirish), keyin sabab (`pg_stat_statements`, `EXPLAIN`), keyin profilaktika. 'Indeks qo'shaman' darhol aytilishi — diagnozsiz harakat belgisidir."},{"l":"S","t":"mcq","tp":"Ops","d":"db","id":30388,"n":"SN389","q":"PostgreSQL'da `shared_buffers` qanday qo'yiladi va nega RAM'ning 100% emas?","o":["RAM'ning 90% — qancha ko'p bo'lsa shuncha yaxshi","~25% RAM (odatda 8-16 GB dan oshirish kam foyda beradi) — qolgani OS page cache uchun kerak, u ham keshlaydi; ikki marta keshlash foydasiz va `work_mem`, ulanishlar, autovacuum uchun ham xotira qolishi kerak","Default 128MB yetarli","Faqat `work_mem` muhim"],"a":1,"e":"PostgreSQL ikki qatlamli kesh bilan ishlaydi: `shared_buffers` + OS page cache. Bundan tashqari har ulanish `work_mem` gacha (sort/hash uchun, bir query'da bir necha marta!) ajratadi — `max_connections × work_mem` RAM'dan oshmasligi kerak. Amaliy boshlang'ich: `shared_buffers` 25%, `effective_cache_size` 50-75% (planner uchun maslahat), `work_mem` 16-64 MB, `maintenance_work_mem` kattaroq."},{"l":"S","t":"mcq","tp":"Ops","d":"db","id":30389,"n":"SN390","q":"Autovacuum katta jadvalga yetib bormayapti, bloat o'syapti. Nima sozlanadi?","o":["Autovacuum'ni o'chirish","Jadval darajasida agressivroq qilish: `autovacuum_vacuum_scale_factor` pasaytirish (0.2 → 0.01), `autovacuum_vacuum_cost_limit` oshirish/`cost_delay` kamaytirish, va parallel worker soni; sababni ham yopish — uzoq tranzaksiyalar va to'xtagan replication slot'lar","`VACUUM FULL` cron bilan har kuni","Jadvalni qayta yaratish"],"a":1,"e":"Default `scale_factor=0.2` degani 100 mln qatorli jadval 20 mln dead tuple yig'ilgach tozalanadi — juda kech. `VACUUM FULL` esa `ACCESS EXCLUSIVE` qulf oladi (jadval productionda ishlamaydi) — uning o'rniga `pg_repack`. Eng muhimi: vacuum `xmin` horizontidan o'ta olmaydi, shuning uchun uzoq ochiq tranzaksiya tuzatilmasa hech qanday sozlama yordam bermaydi."},{"l":"S","t":"mcq","tp":"Backup","d":"db","id":30390,"n":"SN391","q":"PITR (point-in-time recovery) nimaga tayanadi va nega `pg_dump` yetarli emas?","o":["`pg_dump` har doim yetarli","PITR = bazaviy nusxa (`pg_basebackup`) + uzluksiz WAL arxivi — har qanday vaqt nuqtasiga tiklash imkonini beradi; `pg_dump` mantiqiy snapshot bo'lib, oxirgi dump'dan keyingi o'zgarishlar yo'qoladi (RPO = dump davri) va katta bazada tiklash soatlab ketadi","WAL keraksiz","Faqat replica yetarli"],"a":1,"e":"Replica ham backup emas: `DROP TABLE` replicaga ham replikatsiya qilinadi. Shuning uchun: PITR (WAL arxivi) + davriy to'liq nusxa + sinovdan o'tgan tiklash protsedurasi. RTO/RPO raqamda belgilanadi va muntazam tiklash mashqi qilinadi — 'backup bor' degan gap tiklash sinovi bo'lmasa qiymatsiz."},{"l":"S","t":"mcq","tp":"Replication","d":"db","id":30391,"n":"SN392","q":"Streaming replikatsiyada `hot_standby_feedback = on` nima qiladi?","o":["Replicani tezlashtiradi","Replica o'zining eng qadimgi query snapshot'ini primary'ga xabar qiladi — primary shu qatorlarni vacuum qilmaydi, natijada replicada `canceling statement due to conflict with recovery` xatosi kamayadi; narxi — primary'da bloat o'sishi","Replikani sinxron qiladi","WAL'ni siqadi"],"a":1,"e":"Almashinuv aniq: replicada uzoq analitik query'lar ishlashi kerak bo'lsa `hot_standby_feedback=on` (lekin primary'da dead tuple to'planadi), aks holda `max_standby_streaming_delay` bilan konfliktni boshqarish. Uchinchi variant — analitikani alohida, kechikishi muhim bo'lmagan replicaga ajratish."},{"l":"St","t":"mcq","tp":"Ops","d":"db","id":30392,"n":"SN393","q":"PgBouncer'ni `transaction` rejimida ishlatganda nima ishlamay qoladi?","o":["Hech narsa","Sessiya holatiga bog'liq narsalar: prepared statement'lar (nomli), `SET`/sessiya o'zgaruvchilari, `LISTEN/NOTIFY`, advisory lock va kursorlar tranzaksiyadan tashqarida — chunki har tranzaksiya boshqa server ulanishiga tushishi mumkin","Tranzaksiyalar ishlamaydi","Faqat `SELECT` ishlaydi"],"a":1,"e":"Transaction pooling minglab client ulanishini o'nlab server ulanishiga siqadi (PostgreSQL'da har ulanish jarayon — bu katta tejamkorlik). Lekin ilova moslashishi kerak: Go'da `pgx` bilan `statement_cache_mode=describe` yoki prepared statement'larni o'chirish, `SET` o'rniga query darajasida sozlash. `session` rejimi hammasini qo'llaydi, lekin poolingdan foyda kam."},{"l":"S","t":"mcq","tp":"Ops","d":"db","id":30393,"n":"SN394","q":"`statement_timeout`, `lock_timeout`, `idle_in_transaction_session_timeout` — qaysi biri nimadan himoya qiladi?","o":["Uchtasi bir xil","`statement_timeout` — uzoq query'ni kesadi; `lock_timeout` — qulf kutishni cheklaydi (migratsiyada majburiy, aks holda `ALTER TABLE` butun jadvalni to'sib qo'yadi); `idle_in_transaction_session_timeout` — ochiq qolgan tranzaksiyani yopib vacuum'ni bo'shatadi","Faqat `statement_timeout` kerak","Ilova darajasida timeout yetarli"],"a":1,"e":"Migratsiya uchun standart naqsh: `SET lock_timeout = '3s'; SET statement_timeout = '30s';` — qulf olinmasa migratsiya tez yiqiladi va productionni to'xtatib qo'ymaydi (keyin retry qilinadi). Ilova timeout'i yetmaydi: client uzilsa ham DB'da query davom etishi mumkin (shu sabab server tomonda ham chegara kerak)."},{"l":"St","t":"open","tp":"Sharding","d":"db","id":30394,"n":"SN395","q":"PostgreSQL bitta node sig'imidan chiqdi. Qanday tartibda miqyoslaysiz?","m":["Avval o'lchash: yozuv bo'g'izimi yoki o'qish? CPU, IOPS, qulflar, yoki query samarasizligi? Ko'p holatda 'sharding kerak' deb kelingan muammo aslida indeks yoki N+1 muammosi","1. Query va sxema optimizatsiyasi: `pg_stat_statements` top query'lari, indekslar, `COPY`/batch yozuv, keraksiz yozuvlarni olib tashlash","2. Vertikal: tezroq disk (IOPS), ko'proq RAM (kesh hit), connection pooling (PgBouncer) — arzon va tez natija","3. O'qishni ko'chirish: read replica'lar + read-your-writes siyosati; analitikani alohida replicaga yoki omborga","4. Ma'lumotni kamaytirish: partitionlash + retention (eski ma'lumotni arxivga), katta ustunlarni alohida jadvalga","5. Funksional bo'lish: modul bo'yicha alohida DB (eng og'ir domenni ajratish) — bu shardlashdan oddiyroq","6. Gorizontal sharding: tenant/user ID bo'yicha; kalit tanlovi, cross-shard query va resharding rejasi oldindan; Citus yoki ilova darajasida routing","Har qadamda o'lchash va to'xtash nuqtasi: sharding oxirgi chora, chunki operatsion murakkablik (migratsiya, backup, monitoring, tranzaksiyalar) keskin oshadi"],"e":"Kutilayotgan asosiy signal — tartib va o'lchash. Darhol 'shardlaymiz' deyish senior darajada salbiy baholanadi; 'avval nima to'yingan' savoli va arzon bosqichlarni sanash to'g'ri javob."},{"l":"S","t":"mcq","tp":"Migrations","d":"db","id":30395,"n":"SN396","q":"100 mln qatorli jadvalga `NOT NULL` ustun qo'shish kerak. Xavfsiz ketma-ketlik?","o":["`ALTER TABLE ... ADD COLUMN x int NOT NULL DEFAULT 0` — darhol","1) nullable ustun qo'shish, 2) kod ikkisini ham yozadigan holatda deploy, 3) batch'lab backfill (kichik tranzaksiyalar, throttling bilan), 4) `CHECK (x IS NOT NULL) NOT VALID` + `VALIDATE CONSTRAINT`, 5) `SET NOT NULL`","`UPDATE` bilan hammasini bir tranzaksiyada to'ldirish","Jadvalni qayta yaratib ma'lumotni ko'chirish"],"a":1,"e":"PostgreSQL 11+ da `ADD COLUMN ... DEFAULT` jadvalni qayta yozmaydi (metadata default) — shuning uchun oddiy holatlarda tez. Lekin `SET NOT NULL` to'liq skan va `ACCESS EXCLUSIVE` qulf talab qiladi; `NOT VALID` CHECK bilan bosqichma-bosqich qilinadi. Bitta katta `UPDATE` esa WAL portlashi, qulf va replikatsiya lag'ini keltiradi — shuning uchun batch va pauza."},{"l":"St","t":"mcq","tp":"Ops","d":"db","id":30420,"n":"SN421","q":"PostgreSQL'da WAL nima uchun kerak va checkpoint nima qiladi?","o":["Faqat replikatsiya uchun","WAL — write-ahead log: o'zgarish avval jurnal(ga) yoziladi va `fsync` qilinadi, shundan keyin commit tasdiqlanadi (durability); ma'lumot sahifalari keyinroq diskka tushadi. Checkpoint — kir sahifalarni diskka yozib, tiklash boshlanadigan nuqtani oldinga suradi","WAL — backup fayli","Checkpoint jadvalni qulflaydi"],"a":1,"e":"Nega tez: ketma-ket WAL yozuvi tasodifiy sahifa yozuvidan ancha arzon. Operatsion oqibatlar: checkpoint paytida I/O spike bo'ladi (`checkpoint_completion_target` bilan yoyiladi), `max_wal_size` katta bo'lsa checkpoint kam lekin tiklash uzunroq, va `full_page_writes` checkpoint'dan keyingi birinchi o'zgarishda butun sahifani WAL'ga yozadi (WAL hajmi shuning uchun sakraydi)."},{"l":"P","t":"mcq","tp":"Ops","d":"db","id":30421,"n":"SN422","q":"`full_page_writes` nima uchun yoqilgan va nimaga ta'sir qiladi?","o":["Ishlashni tezlashtirish uchun","Torn page (qisman yozilgan 8 KB sahifa) muammosiga qarshi: checkpoint'dan keyin sahifaga birinchi tegishda butun sahifa WAL'ga yoziladi. Natija — WAL hajmi va I/O oshadi, ayniqsa tez-tez checkpoint bo'lsa","Replikatsiya uchun shart","Faqat SSD'da kerak"],"a":1,"e":"Shuning uchun UUIDv4 primary key yomon: tasodifiy insert ko'p turli sahifaga tegadi, har biri to'liq sahifa yozuvini keltiradi — WAL bir necha barobar o'sadi. Yumshatish: checkpoint intervalini oshirish (`max_wal_size`), WAL siqish (`wal_compression`), va monoton kalit ishlatish. Fayl tizimi/qurilma atomik yozuvni kafolatlasa o'chirish mumkin, lekin bu kamdan-kam holat."},{"l":"P","t":"mcq","tp":"Ops","d":"db","id":30422,"n":"SN423","q":"HOT (Heap-Only Tuple) update nima beradi?","o":["Yozuvni ikki barobar tezlashtiradi","Agar yangilangan ustunlar indekslanmagan bo'lsa va yangi versiya bir xil sahifaga sig'sa — indekslar yangilanmaydi (indeks yozuvi eski tupleni ko'rsatib turadi, zanjir orqali yangisiga boriladi). Bu yozuv amplifikatsiyasini va indeks bloatini keskin kamaytiradi","Faqat o'qishni tezlashtiradi","Indekslarni o'chiradi"],"a":1,"e":"Amaliy xulosalar: tez-tez yangilanadigan ustunni indekslamang (masalan `last_seen_at`) — aks holda har update barcha indekslarga yoziladi; `fillfactor` ni pasaytirish (masalan 80) sahifada joy qoldirib HOT ehtimolini oshiradi. `pg_stat_user_tables.n_tup_hot_upd` nisbati bilan kuzatiladi."},{"l":"S","t":"mcq","tp":"Ops","d":"db","id":30423,"n":"SN424","q":"TOAST nima va qachon muammo bo'ladi?","o":["Kesh turi","Katta qiymatlar (>~2 KB) alohida TOAST jadvaliga siqilib ko'chiriladi; asosiy jadval ixcham qoladi. Muammo: katta `jsonb`/`text` ustunni tez-tez o'qish/yangilash qo'shimcha I/O va TOAST bloatini keltiradi, hamda siqish CPU yeydi","Faqat rasm uchun","Indeks turi"],"a":1,"e":"Nozik joylar: TOAST qiymatining bir qismini o'zgartirish butun qiymatni qayta yozadi (jsonb'da kichik maydonni yangilash qimmat); `SELECT *` bilan keraksiz katta ustunni tortish latency beradi. Yechimlar: katta ustunni alohida jadvalga, `storage EXTERNAL` (siqishsiz, substring tez), yoki hujjatni obyekt saqlashga chiqarish."},{"l":"S","t":"mcq","tp":"Replication","d":"db","id":30431,"n":"SN432","q":"Fizik (streaming) va mantiqiy (logical) replikatsiya farqi?","o":["Ikkisi bir xil","Fizik: WAL baytma-bayt, butun klaster nusxasi, bir xil versiya/arxitektura, replica faqat o'qish; mantiqiy: o'zgarishlar dekodlanib jadval darajasida uzatiladi — tanlangan jadvallar, versiyalar orasida migratsiya, va replica yozishga ochiq (lekin konflikt sizning zimmangizda)","Mantiqiy sekinroq va foydasiz","Fizik faqat backup uchun"],"a":1,"e":"Mantiqiy replikatsiya asosiy qo'llanishlari: katta versiya yangilanishi (minimal downtime), ma'lumotni boshqa tizimga oqizish (CDC), va jadval darajasidagi sharding migratsiyasi. Cheklovlari: DDL replikatsiya qilinmaydi, sequence holati ko'chmaydi, primary key yoki `REPLICA IDENTITY` kerak, va slot iste'mol qilinmasa WAL to'planadi."},{"l":"St","t":"mcq","tp":"Partitioning","d":"db","id":30432,"n":"SN433","q":"Partition pruning qachon ishlamaydi?","o":["Har doim ishlaydi","Partition kaliti query'da yo'q bo'lsa, yoki shart ifoda ostida bo'lsa (`WHERE date_trunc('day', ts) = ...`), yoki kalit qiymati faqat runtime'da ma'lum bo'lsa (prepared statement generic plan) — oxirgisini runtime pruning qisman hal qiladi","Faqat katta jadvalda","Indeks bo'lsa ishlamaydi"],"a":1,"e":"Tekshirish: `EXPLAIN`da nechta partition skanerlanayotgani ko'rinadi (`Subplans Removed`). Amaliy qoidalar: shartni kalitga to'g'ridan-to'g'ri yozish (`ts >= $1 AND ts < $2`), `enable_partition_pruning` yoqilgan bo'lishi, va juda ko'p partition (minglab) planner vaqtini oshirishini hisobga olish — partition soni ham me'yorida bo'lishi kerak."},{"l":"S","t":"mcq","tp":"Cost","d":"db","id":30433,"n":"SN434","q":"Indeks bloat aniqlandi. Xavfsiz tozalash?","o":["`VACUUM FULL`","`REINDEX INDEX CONCURRENTLY` (PG12+) — jadval yoziladigan holatda qoladi; yoki yangi indeksni `CREATE INDEX CONCURRENTLY` bilan qurib eskisini almashtirish. `VACUUM FULL`/oddiy `REINDEX` `ACCESS EXCLUSIVE` qulf oladi","Indeksni o'chirib qoldirish","`ANALYZE` yetarli"],"a":1,"e":"`CONCURRENTLY` sekinroq va ikki marta skan qiladi, yiqilsa `INVALID` indeks qoladi (topib o'chirish kerak — `pg_index.indisvalid`). Jadval bloati uchun esa `pg_repack`. Profilaktika muhimroq: autovacuum sozlamalari, uzoq tranzaksiyalarni yo'q qilish, va tez-tez yangilanadigan ustunlarni indekslamaslik."},{"l":"M","t":"code","tp":"SQL gotcha","d":"db","id":8010,"n":"T11","q":"<code>status</code> column'ida 100 row bor: 60 'active', 30 'banned', 10 NULL. Natija nechta row?","c":"SELECT count(*) FROM users WHERE status <> 'active';","o":["40","30 — NULL row'lar tushib qoladi, chunki NULL <> 'active' natijasi UNKNOWN","10","100"],"a":1,"e":"Bu eng ko'p uchraydigan 'yo'qolgan row'lar' sababi. To'g'ri yozish: WHERE status IS DISTINCT FROM 'active' (Postgres) yoki WHERE status <> 'active' OR status IS NULL. Xuddi shu tarzda NOT IN va ba'zi JOIN shartlari ham NULL bilan kutilmagan natija beradi."},{"l":"M","t":"code","tp":"SQL gotcha","d":"db","id":8011,"n":"T12","q":"PostgreSQL'da natija?","c":"SELECT 5 / 2 AS a, 5.0 / 2 AS b, AVG(x) FROM (VALUES (1),(2)) t(x);","o":["2.5, 2.5, 1.5","2, 2.5, 1.5 — butun sonlar bo'linishi butun son beradi (kasr tashlanadi)","2, 2, 1","Xato"],"a":1,"e":"integer / integer = integer. Foiz hisoblashda klassik xato: (count_a / count_b) * 100 doim 0 chiqadi. Tuzatish: 100.0 * a / b yoki a::numeric / b. Pul bilan ishlashda umuman float ishlatmang — numeric yoki minor unit integer."},{"l":"M","t":"code","tp":"SQL gotcha","d":"db","id":8012,"n":"T13","q":"Sahifalash paytida ba'zi row'lar ikki marta, ba'zilari umuman ko'rinmayapti. Sabab?","c":"SELECT * FROM posts ORDER BY created_at DESC LIMIT 20 OFFSET 40;","o":["OFFSET buzuq","ORDER BY unikal emas: bir xil created_at'li row'lar tartibi har query'da boshqacha bo'lishi mumkin. Tie-breaker kerak: ORDER BY created_at DESC, id DESC","LIMIT kichik","Index yo'q"],"a":1,"e":"Barqaror tartib uchun ORDER BY oxirida unikal column bo'lishi shart. Qo'shimcha sabab: page'lar orasida yangi row qo'shilsa OFFSET siljiydi — keyset (cursor) pagination bu muammoni ham yechadi. ORDER BY'siz LIMIT esa umuman kafolatsiz tartib beradi."},{"l":"S","t":"code","tp":"SQL gotcha","d":"db","id":8013,"n":"T14","q":"Transaction rollback bo'ldi. <code>id</code> ketma-ketligi qanday bo'ladi?","c":"BEGIN;\nINSERT INTO t DEFAULT VALUES;   -- id = 5\nROLLBACK;\nINSERT INTO t DEFAULT VALUES;   -- id = ?","o":["5 — sequence ham rollback bo'ladi","6 — sequence transaction'ga bo'ysunmaydi, rollback qilinmaydi; shuning uchun id'larda bo'shliqlar bo'lishi normal","1","Xato"],"a":1,"e":"Bu ataylab qilingan: aks holda har INSERT sequence ustida lock talab qilardi. Oqibati: id ketma-ket deb faraz qilish (masalan 'bugun nechta buyurtma bo'ldi' ni max(id)-min(id) bilan hisoblash) — xato. Xuddi shunday, id tartibi vaqt tartibini kafolatlamaydi (parallel transaction'lar turli vaqtda commit bo'ladi)."},{"l":"S","t":"code","tp":"SQL gotcha","d":"db","id":8014,"n":"T15","q":"<code>timestamp</code> va <code>timestamptz</code> farqi bo'yicha qaysi to'g'ri?","c":"SET timezone = 'Asia/Tashkent';\nSELECT now()::timestamp, now()::timestamptz;","o":["Ikkalasi ham vaqt zonasini saqlaydi","timestamptz lahzani UTC sifatida saqlaydi va ko'rsatishda sessiya zonasiga o'giradi; timestamp esa zonasiz 'devordagi soat' — turli zonadagi serverlarda bir xil qiymat boshqa lahzani anglatadi","timestamptz zona nomini saqlaydi","Farqi faqat formatda"],"a":1,"e":"Qoida: hodisa vaqti (created_at, logged_at) uchun DOIM timestamptz. timestamp faqat zona ma'nosiz bo'lgan holatlarda (tug'ilgan sana, 'har kuni 09:00'). Tipik bug: timestamp column'ga UTC yozib, lokal zonada o'qish — 5 soatlik siljish. DST o'tishida esa lokal vaqt takrorlanadi yoki yo'qoladi."},{"l":"S","t":"code","tp":"SQL gotcha","d":"db","id":8015,"n":"T16","q":"Bu <code>UPDATE ... FROM</code> da nima xavf bor?","c":"UPDATE orders o\nSET status = p.status\nFROM payments p\nWHERE p.order_id = o.id;","o":["Xavf yo'q","Bitta order uchun bir nechta payment bo'lsa, qaysi qiymat yozilishi aniqlanmagan — natija tasodifiy va takrorlanmaydi. Avval agregatsiya yoki DISTINCT ON bilan bitta row'ga keltirish kerak","Sintaksis xatosi","Barcha row'lar NULL bo'ladi"],"a":1,"e":"SQL bu holatda xato bermaydi — jimgina bitta mos row'ni tanlaydi. Xavfsiz yozish: FROM (SELECT DISTINCT ON (order_id) order_id, status FROM payments ORDER BY order_id, created_at DESC) p. Xuddi shunday JOIN bilan UPDATE ham dublikat row'larni yashiradi."},{"l":"S","t":"code","tp":"SQL gotcha","d":"db","id":8016,"n":"T17","q":"<code>DISTINCT ON</code> (PostgreSQL) to'g'ri ishlatilganmi?","c":"SELECT DISTINCT ON (user_id) user_id, created_at, amount\nFROM orders\nORDER BY created_at DESC;","o":["Ha, har user'ning oxirgi buyurtmasini beradi","Yo'q — ORDER BY birinchi DISTINCT ON column'idan boshlanishi shart: ORDER BY user_id, created_at DESC. Aks holda xato yoki kutilmagan row qaytadi","DISTINCT ON Postgres'da yo'q","Faqat LIMIT bilan ishlaydi"],"a":1,"e":"DISTINCT ON har guruhdan ORDER BY bo'yicha BIRINCHI row'ni oladi — shuning uchun tartib guruh column'idan boshlanishi kerak. Muqobil yozuv: ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY created_at DESC) = 1 — ko'proq portativ, lekin ko'pincha sekinroq.","src":"https://www.postgresql.org/docs/current/sql-select.html#SQL-DISTINCT"},{"l":"S","t":"code","tp":"SQL gotcha","d":"db","id":8017,"n":"T18","q":"<code>CHAR(10)</code> column'da saqlangan 'abc' bilan taqqoslash:","c":"-- c CHAR(10) column'ida 'abc' saqlangan\nSELECT c = 'abc', length(c), c || '!' FROM t;","o":["true, 3, 'abc!'","true, 3, 'abc       !' — CHAR bo'shliq bilan to'ldiriladi: taqqoslashda bo'shliqlar e'tiborga olinmaydi, lekin konkatenatsiyada ular chiqadi","false, 10, 'abc!'","Xato"],"a":1,"e":"CHAR(n) — deyarli har doim keraksiz tip: padding kutilmagan natijalar beradi (konkatenatsiya, uzunlik, ba'zi funksiyalar). Postgres'da length() padding'ni hisobga olmaydi, char_length esa... aynan shu chalkashlik sababli amaliyotda faqat text yoki varchar ishlatiladi."},{"l":"M","t":"sql","tp":"SQL gotcha","d":"db","id":16020,"n":"E21","q":"Nega bu query kutilganidan kam row qaytaradi?","c":"SELECT u.id, o.total\nFROM users u\nLEFT JOIN orders o ON o.user_id = u.id\nWHERE o.status = 'paid';","k":["AND","ON"],"e":"WHERE dagi o.status LEFT JOIN'ni INNER JOIN'ga aylantiradi: buyurtmasiz user'lar uchun o.status NULL bo'ladi va NULL = 'paid' hech qachon TRUE emas, shuning uchun row tashlanadi. To'g'risi — shartni ON ichiga ko'chirish: LEFT JOIN orders o ON o.user_id = u.id AND o.status = 'paid'. Qoida: LEFT JOIN'ning o'ng tomonidagi filtr ON'da, chap tomondagi filtr WHERE'da."},{"l":"M","t":"sql","tp":"SQL gotcha","d":"db","id":16021,"n":"E22","q":"Nega `WHERE id NOT IN (SELECT user_id FROM bans)` bo'sh natija qaytarishi mumkin?","c":"-- bans.user_id ustunida NULL bor","k":["NOT EXISTS","NULL"],"e":"NOT IN ro'yxatida bitta NULL bo'lsa, natija hech qachon TRUE bo'lmaydi (3-qiymatli mantiq: id <> NULL = UNKNOWN), shuning uchun query bo'sh qaytaradi. Yechimlar: NOT EXISTS (NULL'ga sezgir emas), yoki subquery'ga WHERE user_id IS NOT NULL qo'shish. NOT EXISTS odatda planner uchun ham qulayroq (anti-join)."},{"l":"S","t":"sql","tp":"SQL gotcha","d":"db","id":16022,"n":"E23","q":"Bu ikki hisob nega farq qiladi?","c":"SELECT count(*), count(rating), avg(rating) FROM reviews;","k":["NULL"],"e":"count(*) barcha row'ni sanaydi; count(rating) NULL bo'lmaganlarini; avg(rating) esa NULL'larni butunlay e'tiborsiz qoldiradi (yig'indi/NULL bo'lmagan soni). Ya'ni avg 'nolga teng' deb hisoblamaydi. NULL'ni 0 sifatida sanash kerak bo'lsa: avg(coalesce(rating,0)). Shuningdek sum() hech row bo'lmasa NULL qaytaradi, 0 emas."},{"l":"S","t":"sql","tp":"SQL gotcha","d":"db","id":16023,"n":"E24","q":"Nega `SELECT ... WHERE lower(email) = $1` index'dan foydalanmayapti?","c":"CREATE INDEX idx_email ON users(email);","k":["expression index","lower"],"e":"Ustunga funksiya qo'llanganda oddiy B-tree index ishlamaydi (predikat sargable emas). Yechim: expression index — CREATE INDEX ON users(lower(email)); yoki citext tipi. Xuddi shu qoida: WHERE created_at::date = '2024-01-01' o'rniga created_at >= '2024-01-01' AND created_at < '2024-01-02' yozing."},{"l":"P","t":"sql","tp":"SQL gotcha","d":"db","id":16024,"n":"E25","q":"Bu migratsiya production'da nega xavfli?","c":"ALTER TABLE orders ADD COLUMN status text NOT NULL DEFAULT 'new';\nCREATE INDEX idx_orders_status ON orders(status);","k":["CONCURRENTLY","ACCESS EXCLUSIVE","lock_timeout"],"e":"Postgres 11+ da volatile bo'lmagan DEFAULT bilan ustun qo'shish jadvalni qayta yozmaydi (tez), lekin baribir qisqa ACCESS EXCLUSIVE lock oladi — uzoq ishlayotgan query orqasida navbatga turib, butun jadvalni bloklaydi. CREATE INDEX esa CONCURRENTLY'siz yozuvlarni index qurilguncha bloklaydi. To'g'ri retsept: lock_timeout = '3s' + retry, CREATE INDEX CONCURRENTLY (transaction ichida emas), va migratsiyani kichik qadamlarga bo'lish.","src":"https://www.postgresql.org/docs/current/sql-createindex.html"},{"l":"P","t":"sql","tp":"SQL gotcha","d":"db","id":16025,"n":"E26","q":"`SELECT ... FOR UPDATE` bilan ikki servis deadlock berayapti. Sabab va yechim?","c":"-- A: UPDATE accounts WHERE id=1; UPDATE accounts WHERE id=2;\n-- B: UPDATE accounts WHERE id=2; UPDATE accounts WHERE id=1;","k":["ORDER BY","tartib","deadlock"],"e":"Klassik lock ordering deadlock: ikki tranzaksiya resurslarni teskari tartibda qulflaydi. Postgres deadlock_timeout (default 1s) dan keyin birini bekor qiladi: 'deadlock detected'. Yechim: barcha kod yo'llarida qat'iy bir xil tartib (masalan id bo'yicha o'sish: SELECT ... WHERE id = ANY($1) ORDER BY id FOR UPDATE), yoki bitta ledger row'ga serializatsiya, yoki SKIP LOCKED bilan navbat. Ilova darajasida 40P01 xatosini retry qilish ham kerak."},{"l":"M","t":"sql","tp":"SQL gotcha","d":"db","id":16026,"n":"E27","q":"Nega `LIMIT 20 OFFSET 100000` sekin?","c":"SELECT * FROM events ORDER BY created_at DESC LIMIT 20 OFFSET 100000;","k":["keyset","seek"],"e":"OFFSET row'larni tashlab yubormaydi — ularni baribir o'qib, keyin tashlaydi. 100k offset = 100020 row o'qish. Yechim: keyset (seek) pagination — WHERE (created_at, id) < ($1,$2) ORDER BY created_at DESC, id DESC LIMIT 20. Bonus: keyset yangi row qo'shilganda dublikat/tushib qolish muammosini ham yopadi, OFFSET esa yopmaydi."},{"l":"S","t":"code","tp":"SQL gotcha","d":"db","id":30145,"n":"SN146","q":"Bu query nega kutilganidan kam qator qaytaradi?","c":"SELECT u.id, u.email\nFROM users u\nLEFT JOIN orders o ON o.user_id = u.id\nWHERE o.status = 'paid';","o":["`LEFT JOIN` noto'g'ri yozilgan","`WHERE` filtri JOIN'dan keyin qo'llanadi va `NULL` qatorlarni kesib tashlaydi — LEFT JOIN amalda INNER JOIN'ga aylanadi; shart `ON`ga ko'chirilishi kerak","`status` indeksi yo'q","`u.id` unique emas"],"a":1,"e":"Outer join'da o'ng tomon shartlari `ON` ichida bo'lishi kerak: `LEFT JOIN orders o ON o.user_id = u.id AND o.status = 'paid'`. Agar maqsad 'to'lovi yo'q userlar' bo'lsa — `WHERE o.id IS NULL` (anti-join). Bu xato kod review'da eng ko'p o'tib ketadigan SQL xatolaridan biri."},{"l":"S","t":"code","tp":"SQL gotcha","d":"db","id":30146,"n":"SN147","q":"`NOT IN` bilan nega bo'sh natija keladi?","c":"SELECT * FROM users\nWHERE id NOT IN (SELECT user_id FROM orders);","o":["Jadval bo'sh","`orders.user_id` ichida bitta `NULL` bo'lsa — butun shart `UNKNOWN` bo'ladi va hech qanday qator qaytmaydi; `NOT EXISTS` yoki `IS NOT NULL` filtri ishlatiladi","Indeks yo'q","`NOT IN` sintaksisi xato"],"a":1,"e":"`id NOT IN (1, NULL)` = `id <> 1 AND id <> NULL` = `... AND UNKNOWN` — hech qachon rost bo'lmaydi. `NOT EXISTS` NULL bilan to'g'ri ishlaydi va planner uchun ko'pincha samaraliroq (anti-join). Bu klassik jim bug: ma'lumotga bitta NULL kelgan kuni hisobot bo'shab qoladi."},{"l":"S","t":"code","tp":"SQL gotcha","d":"db","id":30147,"n":"SN148","q":"Pagination'da qatorlar takrorlanib/tushib qolyapti. Nega?","c":"SELECT * FROM events ORDER BY created_at DESC LIMIT 20 OFFSET 40;","o":["OFFSET har doim xato","`created_at` unique emas — teng qiymatlarda tartib barqaror emas, shuning uchun sahifalar orasida qator takrorlanadi yoki yo'qoladi; tie-breaker (`, id DESC`) va keyset pagination kerak","LIMIT 20 kichik","Indeks yo'q"],"a":1,"e":"Ikki muammo birga: (1) barqaror bo'lmagan tartib — har doim unique tie-breaker qo'shiladi; (2) OFFSET chuqurlashganda sekinlashadi (N qatorni tashlab o'tish) va yangi yozuvlar sahifani surib yuboradi. Yechim — keyset: `WHERE (created_at, id) < ($1, $2) ORDER BY created_at DESC, id DESC LIMIT 20`."},{"l":"S","t":"mcq","tp":"SQL gotcha","d":"db","id":30148,"n":"SN149","q":"`SELECT count(*)` katta jadvalda sekin. PostgreSQL'da nega va nima qilinadi?","o":["Indeks qo'shish `count(*)`ni tezlashtiradi","MVCC tufayli aniq sanoq har qatorning ko'rinishini tekshirishni talab qiladi (index-only scan bo'lsa ham to'liq skan) — taxminiy sanoq (`pg_class.reltuples`), alohida hisoblagich jadval yoki keshlangan qiymat ishlatiladi","`count(1)` tezroq","`VACUUM` count'ni tezlashtiradi"],"a":1,"e":"MySQL InnoDB'da ham shunday. Amaliy yechimlar: UI'da 'taxminan N natija' (reltuples yoki `EXPLAIN` bahosi), filtrlangan sanoq uchun alohida agregat jadval (trigger yoki eventdan yangilanadi), yoki `count(*) OVER ()` bilan faqat joriy sahifa kontekstida. `count(1)` va `count(*)` bir xil tezlikda."},{"l":"S","t":"code","tp":"SQL gotcha","d":"db","id":30295,"n":"SN296","q":"Bu query nega kutilganidan kam qator qaytaradi?","c":"SELECT u.id, u.email\nFROM users u\nLEFT JOIN orders o ON o.user_id = u.id\nWHERE o.status = 'paid';","o":["`LEFT JOIN` noto'g'ri yozilgan","`WHERE` filtri JOIN'dan keyin qo'llanadi va `NULL` qatorlarni kesib tashlaydi — LEFT JOIN amalda INNER JOIN'ga aylanadi; shart `ON`ga ko'chirilishi kerak","`status` indeksi yo'q","`u.id` unique emas"],"a":1,"e":"Outer join'da o'ng tomon shartlari `ON` ichida bo'lishi kerak: `LEFT JOIN orders o ON o.user_id = u.id AND o.status = 'paid'`. Agar maqsad 'to'lovi yo'q userlar' bo'lsa — `WHERE o.id IS NULL` (anti-join). Bu xato kod review'da eng ko'p o'tib ketadigan SQL xatolaridan biri."},{"l":"S","t":"code","tp":"SQL gotcha","d":"db","id":30296,"n":"SN297","q":"`NOT IN` bilan nega bo'sh natija keladi?","c":"SELECT * FROM users\nWHERE id NOT IN (SELECT user_id FROM orders);","o":["Jadval bo'sh","`orders.user_id` ichida bitta `NULL` bo'lsa — butun shart `UNKNOWN` bo'ladi va hech qanday qator qaytmaydi; `NOT EXISTS` yoki `IS NOT NULL` filtri ishlatiladi","Indeks yo'q","`NOT IN` sintaksisi xato"],"a":1,"e":"`id NOT IN (1, NULL)` = `id <> 1 AND id <> NULL` = `... AND UNKNOWN` — hech qachon rost bo'lmaydi. `NOT EXISTS` NULL bilan to'g'ri ishlaydi va planner uchun ko'pincha samaraliroq (anti-join). Bu klassik jim bug: ma'lumotga bitta NULL kelgan kuni hisobot bo'shab qoladi."},{"l":"S","t":"code","tp":"SQL gotcha","d":"db","id":30297,"n":"SN298","q":"Pagination'da qatorlar takrorlanib/tushib qolyapti. Nega?","c":"SELECT * FROM events ORDER BY created_at DESC LIMIT 20 OFFSET 40;","o":["OFFSET har doim xato","`created_at` unique emas — teng qiymatlarda tartib barqaror emas, shuning uchun sahifalar orasida qator takrorlanadi yoki yo'qoladi; tie-breaker (`, id DESC`) va keyset pagination kerak","LIMIT 20 kichik","Indeks yo'q"],"a":1,"e":"Ikki muammo birga: (1) barqaror bo'lmagan tartib — har doim unique tie-breaker qo'shiladi; (2) OFFSET chuqurlashganda sekinlashadi (N qatorni tashlab o'tish) va yangi yozuvlar sahifani surib yuboradi. Yechim — keyset: `WHERE (created_at, id) < ($1, $2) ORDER BY created_at DESC, id DESC LIMIT 20`."},{"l":"S","t":"mcq","tp":"SQL gotcha","d":"db","id":30298,"n":"SN299","q":"`SELECT count(*)` katta jadvalda sekin. PostgreSQL'da nega va nima qilinadi?","o":["Indeks qo'shish `count(*)`ni tezlashtiradi","MVCC tufayli aniq sanoq har qatorning ko'rinishini tekshirishni talab qiladi (index-only scan bo'lsa ham to'liq skan) — taxminiy sanoq (`pg_class.reltuples`), alohida hisoblagich jadval yoki keshlangan qiymat ishlatiladi","`count(1)` tezroq","`VACUUM` count'ni tezlashtiradi"],"a":1,"e":"MySQL InnoDB'da ham shunday. Amaliy yechimlar: UI'da 'taxminan N natija' (reltuples yoki `EXPLAIN` bahosi), filtrlangan sanoq uchun alohida agregat jadval (trigger yoki eventdan yangilanadi), yoki `count(*) OVER ()` bilan faqat joriy sahifa kontekstida. `count(1)` va `count(*)` bir xil tezlikda."},{"l":"M","t":"mcq","tp":"Ledger","d":"db","id":10000,"n":"P1","q":"Double-entry ledger nima va nega fintech'da shu model tanlanadi?","o":["Har tranzaksiyani ikki bazaga yozish","Har pul harakati kamida ikki yozuv bilan qayd etiladi: bir hisobdan debet, ikkinchisiga kredit — barcha yozuvlar yig'indisi doim nolga teng. Balans o'zgaruvchi emas, yozuvlardan hisoblanadi","Ikki marta tasdiqlash","Ikki valyutada saqlash"],"a":1,"e":"Amaliy foydalari: har balans tarix bilan izohlanadi (audit), yo'qolgan pul darhol ko'rinadi (yig'indi nolga teng bo'lmaydi), va balansni UPDATE qilishdagi lost update muammosi yo'qoladi — faqat INSERT. Balansni tez o'qish uchun snapshot/materialized qiymat saqlanadi, lekin haqiqat manbai — yozuvlar.","src":"https://martinfowler.com/eaaDev/AccountingNarrative.html"},{"l":"S","t":"mcq","tp":"Ledger","d":"db","id":10004,"n":"P5","q":"Foydalanuvchi balansini qanday saqlaysiz?","o":["accounts.balance ustunini har to'lovda UPDATE qilish","O'zgarmas (immutable) yozuvlar jurnali + tez o'qish uchun agregat: balans yozuvlardan hisoblanadi, kerak bo'lsa davriy snapshot bilan tezlashtiriladi. Yozish faqat INSERT — tarix buzilmaydi","Faqat Redis'da saqlash","Har kuni qayta hisoblash yetarli"],"a":1,"e":"Agar tezlik uchun balans ustuni ham saqlansa, u bitta transaction ichida yozuv bilan birga yangilanadi va CHECK bilan himoyalanadi (masalan balans manfiy bo'lmasin). Muhim: mablag' yetarliligini tekshirish va yechish bitta atomik operatsiyada bo'lishi kerak — aks holda double-spend."},{"l":"S","t":"mcq","tp":"Ledger","d":"db","id":10005,"n":"P6","q":"Reconciliation (yarashtirish) nima uchun kerak?","o":["Hisobotni chiroyli ko'rsatish uchun","Ichki ledger va tashqi manba (bank/PSP hisoboti) bir xilligini muntazam tekshirish: yo'qolgan, takrorlangan yoki summasi farq qiladigan tranzaksiyalarni topish va tekshiruvga chiqarish","Faqat yillik audit uchun","Bazani zaxiralash uchun"],"a":1,"e":"Amaliy dizayn: kunlik fayl/API hisoboti → moslashtirish kaliti (provayder tranzaksiya id) → farqlar jadvali → operatsion panel va alert. Farqlar normal hodisa (vaqt farqi, valyuta konvertatsiyasi, komissiya) — muhimi ularni tushuntirib yopish jarayoni bo'lishi. Yarashtirilmagan farqlar yig'ilib qolsa, keyin tergov qilish deyarli imkonsiz."},{"l":"S","t":"code","tp":"Ledger","d":"db","id":10008,"n":"P9","q":"Pul o'tkazishda qaysi yozuv to'g'ri?","c":"-- A dan B ga 100.00 (10000 tiyin)\n-- Variant 1\nUPDATE accounts SET balance = balance - 10000 WHERE id='A';\nUPDATE accounts SET balance = balance + 10000 WHERE id='B';\n\n-- Variant 2\nINSERT INTO entries(tx_id, account, amount) VALUES\n  ('t1','A',-10000), ('t1','B',+10000);","o":["Variant 1 — soddaroq","Variant 2: bitta transaction ichida ikki yozuv, yig'indisi 0; balans yozuvlardan olinadi, tarix saqlanadi. Variant 1 da mablag' yetarliligi sharti (WHERE balance >= 10000) va natijani tekshirish ham bo'lishi shart, aks holda balans manfiy bo'ladi","Ikkalasi ham noto'g'ri","Variant 2 faqat NoSQL uchun"],"a":1,"e":"Ikkala variantda ham BEGIN/COMMIT majburiy. Variant 2 uchun invariantlar: (tx_id) bo'yicha yig'indi = 0 (constraint yoki test bilan), amount ≠ 0, va tx_id unikal — idempotentlik shu orqali beriladi (takror so'rov unique violation beradi, pul ikki marta ko'chmaydi)."},{"l":"S","t":"mcq","tp":"Ledger","d":"db","id":30094,"n":"SN95","q":"Double-entry ledger'da balansni qanday hisoblaysiz — yuqori yuklamada?","o":["Har `UPDATE accounts SET balance = balance + x`","Immutable `entries` jadvali (debit/credit) — balans yozuvlar yig'indisi; tezlik uchun davriy snapshot/materiallashgan balans (`balance_at_version`) va undan keyingi yozuvlar qo'shiladi","Balansni faqat keshda saqlash","Har o'qishda butun tarixni sanash"],"a":1,"e":"Mutable balans ustuni audit va tiklashni yo'qotadi (qanday qilib shu raqam chiqdi?). Immutable yozuvlar + snapshot ikki narsani beradi: to'liq izlanish va tez o'qish. Har tranzaksiya uchun invariant `sum(debit) = sum(credit)` DB constraint yoki test bilan tekshiriladi; yozuvlar hech qachon `UPDATE`/`DELETE` qilinmaydi — faqat qarama-qarshi yozuv (reversal)."},{"l":"S","t":"mcq","tp":"Ledger","d":"db","id":30095,"n":"SN96","q":"Ledger yozuvlarida konkurent yozuv va izchillik uchun to'g'ri yondashuv?","o":["Serializable izolyatsiya har doim va boshqa hech narsa","Har hisob uchun monoton `sequence`/`version` bilan optimistik yozuv yoki hisob bo'yicha qulf; balans cheklovi (`balance >= 0`) atomik shartli yozuv bilan tekshiriladi; idempotency key har tranzaksiyada","Faqat app'da mutex","Yozuvlarni navbatga qo'yib bitta worker bilan yozish har doim"],"a":1,"e":"Pul harakatida ikki xatarni yopish kerak: qo'sh yozuv (idempotency key + unique constraint) va minusga tushish (atomik shart). Hot hisob bo'lsa (masalan merchant hisobi) per-account navbat yoki sharding (bir hisobni ko'p sub-balansga bo'lish) qo'llanadi. `SERIALIZABLE` to'g'ri, lekin retry siyosati va throughput narxi bor."},{"l":"St","t":"open","tp":"Ledger","d":"db","id":30096,"n":"SN97","q":"Kunlik reconciliation: PSP settlement fayli bilan ichki ledger mos kelmadi. Qanday ishlaysiz?","m":["Jarayon: settlement faylini import (immutable, raw saqlanadi) → external ID bo'yicha matching → uch guruh: mos, faqat bizda, faqat PSP'da","Sabab toifalari: kechikkan capture/settlement (timing), komissiya va FX farqi, qaytarish/chargeback, bizdagi yo'qolgan webhook, PSP tomonidagi qo'lda operatsiya","Farq har biri uchun 'exception' yozuvi ochiladi: egasi, sababi, yechimi; hech narsa jimgina yo'q qilinmaydi","Tuzatish faqat ledger'ga qo'shimcha (reversal/adjustment) yozuv bilan — mavjud yozuv o'zgartirilmaydi, izoh va manba havolasi bilan","Avtomatlashtirish: timing farqini T+1 oynasi bilan avtomatik yopish, qolganiga alert va dashboard (ochiq farq summasi va yoshi — KPI)","Profilaktika: webhook'ni yagona haqiqat manbasi qilib qo'ymaslik (davriy pull/reconcile), idempotency, va har tashqi tranzaksiya ID'sini saqlash"],"e":"Fintechda reconciliation — ixtiyoriy emas: webhook yo'qoladi, PSP kechikadi. Intervyuda kutiladigan detal — farqni toifalash va tuzatishni append-only yozuv bilan qilish."},{"l":"St","t":"mcq","tp":"Ledger","d":"db","id":30464,"n":"SN465","q":"Ledger'da pul o'tkazish (A→B) yozuvi qanday bo'ladi va nega ikki yozuv?","o":["Bitta `UPDATE` bilan ikki balansni o'zgartirish","Bitta tranzaksiyada ikki entry: A hisobiga debit, B hisobiga kredit, bir `transaction_id` ostida; `sum(debit) = sum(credit)` invarianti har tranzaksiya uchun tekshiriladi — shu bilan har pul harakati izlanadi va hisobot yozuvlardan qayta hisoblanadi","Faqat jurnal yozish","Har hisob uchun alohida tranzaksiya"],"a":1,"e":"Ikki alohida tranzaksiya ishlatilsa pul 'havoda' qolishi mumkin (birinchi commit, ikkinchi fail). Bir DB ichida bu oddiy tranzaksiya; servislar orasida bo'lsa — saga bilan ikki bosqich (`pending` yozuv → tasdiq) yoki umuman ledgerni bitta servisda ushlash. Amaliyotda ledgerni bo'lish eng oxirgi chora, chunki invariant butunligi shu yerda."},{"l":"S","t":"mcq","tp":"Ledger","d":"db","id":30465,"n":"SN466","q":"Ledger'da yaxlitlash (rounding) qanday boshqariladi?","o":["Har joyda yaxlitlash","Yaxlitlash faqat aniq belgilangan nuqtalarda (masalan komissiya hisoblashda), qoidasi hujjatlashtirilgan (half-up/banker's), va yo'qolgan tiyinlar alohida 'rounding' hisobiga yoziladi — shunda `sum(debit)=sum(credit)` buzilmaydi","Float bilan avtomatik","Yaxlitlamaslik"],"a":1,"e":"Klassik xato: 100.00 ni uchga bo'lib 33.33 × 3 = 99.99 — 1 tiyin yo'qoladi va reconciliation buziladi. Yechim: qoldiqni oxirgi qismga qo'shish yoki rounding hisobiga yozish. Foiz/soliq hisoblari uchun qaysi tartibda yaxlitlash (avval jamlab keyin yaxlitlashmi) ham biznes qoidasi sifatida qat'iy belgilanadi."},{"l":"St","t":"mcq","tp":"Ledger","d":"db","id":30514,"n":"SN515","q":"Ledger jadvali juda katta bo'lib ketdi (mlrd qator). Qanday boshqariladi?","o":["Eski yozuvlarni o'chirish","Vaqt bo'yicha partitionlash + davriy balans snapshot (hisob bo'yicha `balance_at(period)`): joriy balans snapshot + keyingi yozuvlar; eski partitionlar arxivga (sovuq saqlash) ko'chiriladi, lekin o'chirilmaydi — qonuniy saqlash muddati bor","Balansni ustunda saqlash","Ma'lumotni siqish yetarli"],"a":1,"e":"Snapshot qoidalari: snapshot ham immutable yozuv sifatida saqlanadi (qaysi entry ID gacha hisoblangani bilan), shunda tekshirish (audit) mumkin bo'ladi. Arxivga ko'chirishda so'rov yo'li saqlanishi kerak (masalan yillik hisobot uchun) — ko'pincha ombor (ClickHouse/BigQuery) nusxasi shu maqsadda ishlatiladi."},{"l":"S","t":"mcq","tp":"Ledger","d":"db","id":30519,"n":"SN520","q":"Hisob balansi manfiyga tushmasligini qanday kafolatlaysiz (yuqori konkurentlikda)?","o":["Ilovada `if balance >= amount`","DB darajasida atomik shart: balans yozuvini `UPDATE ... SET balance = balance - $1 WHERE account_id = $2 AND balance >= $1` (ta'sirlangan qator 0 bo'lsa rad etish) yoki `CHECK (balance >= 0)` constraint; ilovadagi tekshiruv faqat UX uchun","`SERIALIZABLE` yetarli","Mutex bilan"],"a":1,"e":"Read-then-write har doim race beradi. Hot hisob (masalan merchant) bo'lsa bitta qatorga contention paydo bo'ladi — chora: hisobni sub-balanslarga bo'lish (N ta shard qator, tasodifiy tanlab yechish, jamlab o'qish) yoki navbat bilan ketma-ketlashtirish. Ledger yozuvlari esa baribir append-only qoladi."},{"l":"M","t":"mcq","tp":"Cache","d":"nosql","id":1006,"n":"B7","q":"Cache-aside (lazy loading) pattern'da o'qish oqimi qanday?","o":["Ilova faqat cache'ga yozadi, cache DBga o'zi yozadi","Ilova cache'dan o'qiydi; miss bo'lsa DBdan o'qib cache'ga yozadi; yozishda DB yangilanadi va cache key'i o'chiriladi","Cache har daqiqada butun DBni nusxalaydi","DB cache'ni triggerlar orqali yangilaydi"],"a":1,"e":"Eng keng tarqalgan pattern. Yozishda cache'ni yangilash emas, o'chirish (invalidate) xavfsizroq — ikki parallel yozish cache'ga eski qiymatni qoldirishi mumkin. TTL qo'shimcha himoya. Boshqalari: write-through, write-behind."},{"l":"S","t":"open","tp":"Cache","d":"nosql","id":1013,"n":"B14","q":"Cache stampede (thundering herd) nima va qanday oldini olasiz?","m":["Mashhur key TTL tugaydi → minglab query bir vaqtda miss → hammasi DBga","Request coalescing / single-flight: faqat bitta query qayta hisoblaydi, qolganlar kutadi (lock yoki promise)","Distributed lock (Redis SET NX PX) bilan qayta hisoblash","Probabilistic early expiration (XFetch) yoki fon rejimida yangilash","TTL jitter — ko'p key bir vaqtda tugamasin; stale-while-revalidate"],"e":"Senior signal: bir nechta usulni va ularning trade-off'ini bilish. Cache 'yiqilganda' (cold start) ham xuddi shu muammo — cache'ni isitish (warmup)."},{"l":"J","t":"mcq","tp":"Redis","d":"nosql","id":5040,"n":"V41","q":"Redis buyruqlari qanday bajariladi?","o":["Har connection uchun alohida thread, parallel","Buyruqlar bitta thread'da ketma-ket bajariladi — shuning uchun har buyruq atomik; network I/O uchun qo'shimcha threadlar bo'lishi mumkin (io-threads), lekin buyruq bajarilishi baribir bitta","Buyruqlar random tartibda","Har buyruq alohida jarayonda"],"a":1,"e":"Amaliy natijalar: INCR, SETNX, LPUSH kabi buyruqlarga lock kerak emas — ular allaqachon atomik. Lekin bitta sekin buyruq (KEYS *, katta ZRANGE, O(n) buyruq) butun serverni bloklaydi — barcha clientlar kutadi. Shuning uchun Redis'da 'sekin buyruq' = 'incident'. SLOWLOG bilan kuzatiladi.","src":"https://redis.io/docs/latest/develop/reference/eviction/"},{"l":"J","t":"mcq","tp":"Redis","d":"nosql","id":5041,"n":"V42","q":"Reyting table'i (leaderboard: ball bo'yicha top 10 va foydalanuvchi o'rni) uchun qaysi struktura?","o":["List","Sorted set (ZSET): ZADD bilan ball, ZREVRANGE bilan top N, ZREVRANK bilan o'rin — O(log n)","Hash","String"],"a":1,"e":"ZSET — skiplist + hash: tartib va tezkor kirish. Boshqa moslamalar: String — cache/hisoblagich; Hash — obyekt maydonlari; Set — unikal to'plam va SINTER; List — oddiy queue/stack; Stream — hodisalar loglari va consumer group; HyperLogLog — taxminiy unikal sanoq (kam memory); Bitmap — kunlik faollik."},{"l":"M","t":"mcq","tp":"Redis","d":"nosql","id":5042,"n":"V43","q":"Distributed lock uchun to'g'ri buyruq va bo'shatish usuli?","o":["SET key 1, keyin DEL key","SET key <tasodifiy_token> NX PX 30000 — atomik olish va muddat; bo'shatishda Lua skript bilan 'token mos kelsa DEL' qilish","SETNX, keyin alohida EXPIRE","GETSET bilan"],"a":1,"e":"Ikki nozik nuqta: 1) SETNX + EXPIRE alohida bo'lsa, orasida crash bo'lganda lock abadiy qoladi — shuning uchun bitta SET ... NX PX; 2) Oddiy DEL boshqa egasining lockini o'chirishi mumkin (sizning ishingiz TTL dan uzoq davom etsa) — shuning uchun token tekshiruvi Lua'da atomik qilinadi. Ish TTL dan uzoq cho'zilsa lock uzaytiriladi (watchdog).","src":"https://redis.io/docs/latest/develop/clients/patterns/distributed-locks/"},{"l":"S","t":"open","tp":"Redis","d":"nosql","id":5043,"n":"V44","q":"Redlock (bir necha Redis node'da lock) ishonchlimi? Qanday yondashasiz?","m":["Redlock N node'ning ko'pchiligidan lock olishga asoslangan","Tanqid (Martin Kleppmann): soat siljishi, GC pauzasi va network kechikishi TTL tugagach ham client o'zini egaman deb o'ylashiga olib keladi — o'zaro istisno kafolatlanmaydi","Himoya: fencing token — har lockda o'suvchi raqam, resurs (DB) eski tokenli yozuvni rad etadi","Amaliy qoida: lock 'optimizatsiya' uchun bo'lsa (ikki marta ishlamaslik) — Redis lock yetarli; 'to'g'rilik' uchun bo'lsa (pul, unikal yozuv) — DB constraint/transaction yoki konsensus tizimi (etcd, ZooKeeper)","Ko'p holatda idempotentlik lockdan yaxshiroq yechim"],"e":"Bu savol senior level'ni ajratadi: 'Redlock ishlatamiz' emas, 'lock nima uchun kerak — tezlik uchunmi yoki to'g'rilik uchunmi' degan savoldan boshlash.","src":"https://martin.kleppmann.com/2016/02/08/how-to-do-distributed-locking.html"},{"l":"M","t":"mcq","tp":"Redis","d":"nosql","id":5044,"n":"V45","q":"<code>maxmemory</code> ga yetganda nima bo'ladi?","o":["Redis eski key'larni doim o'zi o'chiradi","maxmemory-policy ga bog'liq: default noeviction — yozish buyruqlari OOM xatosi qaytaradi; allkeys-lru / allkeys-lfu — har qanday key'ni siqib chiqaradi; volatile-* — faqat TTL qo'yilgan key'larni","Redis qayta ishga tushadi","Ma'lumot diskka ko'chadi"],"a":1,"e":"Cache sifatida ishlatsangiz: allkeys-lru yoki allkeys-lfu (takroriy murojaat ko'p bo'lsa LFU yaxshiroq). Queue/lock/session saqlasangiz noeviction xavfsizroq — lekin unda memory monitoringi va alert majburiy. LRU/LFU Redis'da taxminiy (sampling bilan) — aniq emas, bu ataylab qilingan.","src":"https://redis.io/docs/latest/develop/reference/eviction/"},{"l":"M","t":"mcq","tp":"Redis","d":"nosql","id":5045,"n":"V46","q":"TTL tugagan key memory'dan qachon o'chadi?","o":["Aniq shu soniyada","Ikki mexanizm: lazy — key'ga murojaat qilinganda tekshiriladi; active — fon rejimida tasodifiy namuna olib o'chiriladi. Shuning uchun muddati o'tgan key biroz vaqt memory'da turishi mumkin","Faqat restartda","O'chmaydi, faqat ko'rinmaydi"],"a":1,"e":"Amaliy natija: 'TTL qo'ydim, demak memory darhol bo'shaydi' degan hisob noto'g'ri — ayniqsa ko'p key bir vaqtda tugasa. Bir vaqtda ommaviy tugash yukni ham oshiradi, shuning uchun TTL'ga tasodifiy jitter qo'shiladi. Replicada key'ni faqat primary o'chiradi (DEL replikatsiya qilinadi)."},{"l":"M","t":"code","tp":"Redis","d":"nosql","id":5046,"n":"V47","q":"Production'da bu buyruq nima uchun xavfli va o'rniga nima ishlatiladi?","c":"KEYS session:*","o":["Xavfli emas","KEYS butun keyspace'ni skanerlaydi va bitta threadli serverni millionlab key'da bloklaydi — hamma query'lar kutadi. O'rniga SCAN (kursorli, bosqichma-bosqich) ishlatiladi","Faqat sekin, lekin xavfsiz","O'rniga FLUSHALL"],"a":1,"e":"Xuddi shunday xavfli buyruqlar: FLUSHALL, katta key'da DEL (o'rniga UNLINK — asinxron), katta HGETALL/SMEMBERS/ZRANGE 0 -1. Redis'da 'big key' va 'hot key' — ikki klassik muammo: birinchisi bloklaydi, ikkinchisi bitta shardni qizdiradi. Key'larni ro'yxatlash kerak bo'lsa — alohida index (SET) yuriting."},{"l":"M","t":"mcq","tp":"Redis","d":"nosql","id":5047,"n":"V48","q":"Pipeline, MULTI/EXEC va Lua skript farqi?","o":["Uchalasi bir xil","Pipeline — bir nechta buyruqni bitta round-tripda yuborish (atomiklik bermaydi). MULTI/EXEC — buyruqlar queue'i ketma-ket va uzilmasdan bajariladi, lekin oraliq natijaga qarab qaror qilib bo'lmaydi. Lua (EVAL) — server tomonida mantiq: o'qib, tekshirib, yozish atomik","MULTI rollback qiladi","Lua sekinroq va atomik emas"],"a":1,"e":"MULTI/EXEC'da rollback yo'q: buyruq ishlash vaqtida xato bersa, qolganlari baribir bajariladi. Shartli mantiq kerak bo'lsa (lockni tokenga qarab o'chirish, rate limit hisoblash) — Lua. Lua skript ham bitta threadda ishlaydi, shuning uchun qisqa bo'lishi shart — uzun skript butun serverni bloklaydi. WATCH — optimistik variant."},{"l":"S","t":"mcq","tp":"Redis","d":"nosql","id":5048,"n":"V49","q":"RDB va AOF persistence farqi?","o":["Bir xil, faqat fayl formati boshqa","RDB — davriy snapshot: kichik fayl, tez tiklanish, lekin oxirgi snapshotdan keyingi yozuvlar yo'qoladi. AOF — har yozish buyrug'i logga yoziladi (appendfsync everysec bo'lsa ≤1 soniya yo'qotish), fayl kattaroq va tiklanish sekinroq; AOF rewrite uni ixchamlashtiradi","AOF ma'lumot yo'qotmaydi va tezroq","RDB har buyruqni yozadi"],"a":1,"e":"Ko'pincha ikkalasi birga yoqiladi (Redis 7'da multi-part AOF + RDB preamble). Muhim tushuncha: Redis — birinchi queue'da xotiradagi tizim; appendfsync always bo'lsa ham disk kafolati klassik DB level'ida emas. Kritik ma'lumotni Redis'da yagona nusxada saqlamaslik kerak.","src":"https://redis.io/docs/latest/operate/oss_and_stack/management/persistence/"},{"l":"S","t":"mcq","tp":"Redis","d":"nosql","id":5049,"n":"V50","q":"Redis replikatsiyasi va failover haqida qaysi to'g'ri?","o":["Replikatsiya sinxron, ma'lumot yo'qolmaydi","Replikatsiya asinxron: primary yiqilsa, replicaga yetmagan yozuvlar yo'qoladi. Sentinel (yoki Cluster) avtomatik failover qiladi; WAIT buyrug'i bilan N replica tasdig'ini kutish mumkin, lekin bu ham to'liq kafolat emas","Replica ham yozishni qabul qiladi","Failover uchun qo'lda aralashuv shart"],"a":1,"e":"Shuning uchun Redis'ni yagona haqiqat manbai sifatida ishlatish (to'lov, buyurtma) tavsiya etilmaydi — cache, sessiya, rate limit, queue uchun juda yaxshi. Sentinel — HA bitta master uchun; Cluster — sharding + HA. Split-brain holatlari uchun min-replicas-to-write sozlamasi bor."},{"l":"S","t":"mcq","tp":"Redis","d":"nosql","id":5050,"n":"V51","q":"Redis Cluster'da <code>MGET user:1:name user:2:name</code> xato berdi (CROSSSLOT). Sabab va yechim?","o":["Cluster ko'p key'li buyruqni umuman qo'llamaydi","Key'lar 16384 hash slot bo'yicha taqsimlanadi; ko'p key'li buyruq faqat bir slotdagi key'lar bilan ishlaydi. Birga turishi kerak bo'lsa — hash tag: user:{1}:name va user:{1}:email bitta slotga tushadi","MGET o'rniga KEYS ishlatish kerak","Node sonini oshirish kerak"],"a":1,"e":"Hash tag {...} ichidagi qism bo'yicha slot hisoblanadi. Ehtiyot bo'ling: hammasini bitta tagga solsangiz, ma'lumot bitta shardga yig'iladi (hot shard). Transaction va Lua ham bitta slot talab qiladi. Ko'pincha oddiyroq yechim — pipeline bilan alohida GET'lar."},{"l":"S","t":"mcq","tp":"Redis","d":"nosql","id":5051,"n":"V52","q":"Pub/Sub va Streams farqi?","o":["Bir xil","Pub/Sub — fire-and-forget: obuna bo'lmagan yoki uzilgan client xabarni umuman olmaydi, saqlanmaydi. Streams — saqlanadigan log: consumer group, offset, ACK, qayta o'qish (Kafka'ga o'xshash model)","Streams xabarni saqlamaydi","Pub/Sub ACK talab qiladi"],"a":1,"e":"Ishonchli yetkazish kerak bo'lsa Pub/Sub mos emas (deploy paytida uzilish = yo'qolgan xabarlar). Streams: XADD, XREADGROUP, XACK, pending entries list (XPENDING) bilan ishlanmagan xabarlarni ko'rish va XCLAIM bilan boshqa consumer'ga o'tkazish. Kichik hajmdagi ishonchli queue uchun Streams — Kafka o'rniga arzon variant."},{"l":"St","t":"open","tp":"Redis","d":"nosql","id":5052,"n":"V53","q":"'Redis bizga sekin' deyishdi: p99 latency sakraydi. Qanday tekshirasiz?","m":["SLOWLOG GET — sekin buyruqlar (KEYS, katta ZRANGE/HGETALL, uzun Lua)","Big key va hot key tahlili: redis-cli --bigkeys / --hotkeys, MEMORY USAGE","INFO: used_memory va maxmemory nisbati, evicted_keys, blocked_clients, instantaneous_ops_per_sec","Latency manbalari: fork paytida RDB/AOF rewrite (katta memory'da sezilarli), transparent huge pages, swap","Network va client tomoni: round-trip soni (pipeline'ga o'tish), connection pool sozlamalari, TLS narxi","Arxitektura: hot keyni lokal (in-process) cache bilan yumshatish, shardlash, o'qishni replicaga bo'lish"],"e":"Staff signal: Redis'da latency muammosi deyarli doim 'bitta og'ir operatsiya butun threadni bloklagan' yoki 'memory/fork' bilan bog'liq. Tartib: o'lchash (SLOWLOG, INFO) → sabab → chora."},{"l":"M","t":"mcq","tp":"Cache","d":"nosql","id":13004,"n":"K5","q":"Write-through, write-back va write-around farqi?","o":["Faqat nomi bilan farq qiladi","Write-through — keshga va DB'ga birga yoziladi (o'qish tez, yozish sekinroq, ma'lumot mos). Write-back — avval keshga, DB'ga keyin asinxron (juda tez, lekin kesh yo'qolsa ma'lumot yo'qoladi). Write-around — to'g'ridan-to'g'ri DB'ga, kesh faqat o'qishda to'ladi (bir marta yoziladigan ma'lumot uchun)","Write-back eng xavfsiz","Write-around keshni o'chiradi"],"a":1,"e":"Eng keng tarqalgani — cache-aside (lazy loading) + yozishda kalitni invalidate qilish. Write-back faqat ishonchli, replikatsiyalangan kesh bilan (masalan Redis AOF) va yo'qotishga chidamli ma'lumot uchun. Tanlovda savol: kesh yo'qolsa nima bo'ladi va eskirgan ma'lumot qancha vaqt maqbul."},{"l":"S","t":"open","tp":"Cache","d":"nosql","id":14013,"n":"SR14","q":"Kesh invalidatsiyasi subsystem'ini loyihalang — ko'p servis bir xil ma'lumotni keshlaydi.","m":["Kalit sxemasi va egalik: har ma'lumot turi uchun kim yozadi va kim invalidate qiladi","Usullar: TTL (eng sodda), yozishdan keyin delete, versiyalangan kalit (user:42:v7), yoki event/CDC orqali global invalidatsiya","Ko'p qatlam: CDN, ilova xotirasidagi kesh, Redis — invalidatsiya hammasiga yetishi kerak (lokal kesh uchun pub/sub)","Xavflar: commit'dan oldin o'chirish, stampede, invalidatsiya xabarining yo'qolishi — TTL zaxira sifatida","Kuzatuv: hit ratio, eskirgan javoblar bo'yicha shikoyat, kesh va DB farqini davriy tekshirish","Qaror: qaysi ma'lumot qancha eskirishi mumkin — bu mahsulot talabi"],"e":"Kuchli javob 'kesh invalidatsiyasi — eng qiyin ikki masaladan biri' degan hazil bilan cheklanmaydi: aniq mexanizm, zaxira TTL va kuzatuvni aytadi."},{"l":"S","t":"mcq","tp":"Redis","d":"nosql","id":30224,"n":"SN225","q":"Redis'da eviction policy `noeviction` bo'lsa xotira tugaganda nima bo'ladi?","o":["Eng eski kalitlar o'chadi","Yozuv operatsiyalari xato qaytaradi (`OOM command not allowed`) — kesh sifatida ishlatilganda bu incident'ga olib keladi; kesh uchun `allkeys-lru`/`allkeys-lfu`, ma'lumot ombori sifatida esa `noeviction` + xotira nazorati to'g'ri","Redis qayta ishga tushadi","Diskka yoziladi"],"a":1,"e":"Qaror 'Redis nima vazifada' degan savoldan kelib chiqadi: kesh — yo'qotish mumkin, demak LRU/LFU; navbat yoki yagona holat ombori — yo'qotish mumkin emas, demak `noeviction`, `maxmemory` zapas bilan va alert. Ikkisini bir instansiyada aralashtirish klassik xato — kesh yozuvi muhim ma'lumotni evict qiladi."},{"l":"S","t":"mcq","tp":"Cache","d":"nosql","id":30225,"n":"SN226","q":"Kesh kaliti dizaynida nimalarga e'tibor beriladi?","o":["Faqat qisqa bo'lishi","Versiya/sxema
