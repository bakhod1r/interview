kalar: go_memstats_heap_inuse_bytes, go_goroutines, RSS — qaysi biri o'syapti (heap, goroutine, yoki heap'dan tashqari)","pprof: /debug/pprof/heap ni ikki vaqtda olib -base bilan farqini ko'rish (go tool pprof -base old.pb.gz new.pb.gz)","Goroutine soni o'sayotgan bo'lsa — leak: /debug/pprof/goroutine?debug=2 dagi stack'lar qayerda bloklanganini ko'rsatadi","Tipik sabablar: context'siz kutayotgan goroutine, to'xtatilmagan time.Ticker, resp.Body yopilmagan, cheksiz o'sadigan map/cache, katta massivni ushlab turgan kichik slice","Tuzatish: har goroutine'ga tugash yo'li, cache'ga TTL va hajm chegarasi, defer resp.Body.Close()","Himoya: GOMEMLIMIT qo'yish, goroutine soni va heap bo'yicha alert, testda goleak"],"e":"Intervyuda kutilgan tartib: o'lchash → farqni olish → stack'dan sababni topish → tuzatish → qaytalanmasligi uchun alert. 'Restart qo'yamiz' javobi — mitigatsiya, yechim emas (lekin incident paytida to'g'ri birinchi qadam bo'lishi mumkin).","src":"https://go.dev/blog/pprof"},{"l":"S","t":"open","tp":"Go case","d":"go","id":12001,"n":"GC2","q":"CASE: Servis CPU 100% da, lekin trafik o'zgarmagan. Nima qilasiz?","m":["30 soniyalik CPU profil: go tool pprof http://host/debug/pprof/profile?seconds=30 — top va flame graph","Tipik aybdorlar: siklda regexp.MustCompile yoki json.Marshal, katta struct nusxalash, tartibsiz o'sgan slice'da chiziqli qidiruv, siqish/шифрlash, log darajasi debug'ga o'tib ketgani","GC ulushi: GODEBUG=gctrace=1 yoki go_gc_duration; allokatsiya ko'p bo'lsa — memory profili (allocs) va sync.Pool / buferlarni qayta ishlatish","Bloklanish emasligini tekshirish: agar CPU emas, kutish bo'lsa — block va mutex profillari","Tarqalish: bitta pod'dami yoki hammasidami; oxirgi deploy va feature flag bilan bog'liqmi","Tezkor chora: aybdor endpoint'ni rate limit qilish yoki flag bilan o'chirish, keyin tuzatish"],"e":"Kuchli javob profil ma'lumotisiz taxmin qilmaydi. Yana bir tez tekshiruv: konteyner CPU limiti va GOMAXPROCS mosligi — throttling ham 'CPU to'la' bo'lib ko'rinadi."},{"l":"S","t":"open","tp":"Go case","d":"go","id":12002,"n":"GC3","q":"CASE: p99 latency vaqti-vaqti bilan 50 ms dan 2 s gacha sakraydi, p50 esa barqaror. Sabablarni qanday qidirasiz?","m":["Qachon sakraydi: deploy, cron, GC, trafik cho'qqisi bilan bog'liqmi — metrikalarni bir oynada solishtirish","GC pauzalari: gctrace yoki runtime metrikalari; katta heap va yuqori allokatsiya tezligi sabab bo'lishi mumkin","Lock contention: /debug/pprof/mutex va block profillari — bitta mutex ostidagi uzun operatsiya (masalan lock ushlab turib DB chaqiruvi)","Resurs to'yinishi: DB connection pool kutish vaqti, Redis, tashqi API p99, HTTP client pool (MaxIdleConnsPerHost kichik bo'lsa har so'rovga yangi ulanish)","Qo'shni ta'sir: node'da boshqa pod, CPU throttling (container_cpu_cfs_throttled_seconds)","Tracing bilan sekin so'rovning qaysi bosqichida vaqt ketayotganini ko'rish"],"e":"p50 yaxshi, p99 yomon — bu deyarli doim navbat (queueing) yoki vaqti-vaqti bilan yuz beradigan bloklanish. O'rtacha qiymatga qarab xulosa qilmaslik — senior signal."},{"l":"S","t":"open","tp":"Go case","d":"go","id":12003,"n":"GC4","q":"CASE: Servis 'osilib qoldi' — hech qanday so'rovga javob bermayapti, CPU ham past. Birinchi nima qilasiz?","m":["Stack dump olish: /debug/pprof/goroutine?debug=2 (yoki jarayonga SIGQUIT yuborish) — hamma goroutine qayerda turganini ko'rsatadi","Naqshni qidirish: ko'p goroutine bitta mutex yoki kanalda kutyaptimi (deadlock/live-lock), yoki hammasi tashqi chaqiruvda turibdimi","Bog'liqliklarni tekshirish: DB, Redis, tashqi API javob beryaptimi; timeout qo'yilmagan chaqiruv bormi","Pool tugaganmi: DB pool va HTTP client pool metrikalari; barcha ulanishlar band bo'lsa yangi so'rovlar kutadi","Tezkor chora: dump olingach restart (dalilni yo'qotmaslik uchun avval dump)","Tuzatish: har tashqi chaqiruvga context deadline, lock ichida I/O qilmaslik, pool o'lchami va kutish timeout'i"],"e":"Muhim tafsilot: restartdan OLDIN stack dump olish — aks holda sabab yo'qoladi. Deadlock runtime tomonidan faqat hamma goroutine uxlab qolganda aniqlanadi; bitta mutexda osilgan servis esa 'tirik' ko'rinadi."},{"l":"S","t":"open","tp":"Go case","d":"go","id":12004,"n":"GC5","q":"CASE: Hisoblagichlar ba'zan noto'g'ri, xatolar takrorlanmaydi. Race'ni qanday isbotlaysiz?","m":["go test -race bilan testlarni ishga tushirish; mavjud test qamramasa — konkurent stress test yozish (t.Parallel, ko'p goroutine bir xil kodni chaqiradi)","Staging'da -race bilan qurilgan build ni cheklangan trafik bilan ishlatish (2–10x sekin, prod uchun emas)","Shubhali joylar: global o'zgaruvchilar, umumiy map/slice, struct'dagi maydonni mutexsiz o'qish, sync.WaitGroup noto'g'ri ishlatilishi","Tuzatish: mutex bilan o'rash, atomic tiplar, yoki holatni bitta goroutine'ga (owner) berib kanal orqali ishlash","Regressiyani to'sish: CI'da -race majburiy, topilgan holat uchun test qoldirish"],"e":"Race detector faqat bajarilgan kod yo'lini ko'radi — shuning uchun 'topilmadi' degani 'yo'q' degani emas. Topilgani esa har doim real bug: 'kamdan-kam bo'ladi' degan bahona yo'q."},{"l":"S","t":"open","tp":"Go case","d":"go","id":12005,"n":"GC6","q":"CASE: Konteyner OOMKilled bo'lyapti, lekin pprof heap atigi 200 MB ko'rsatyapti. Nima bo'layotgan bo'lishi mumkin?","m":["Heap ≠ RSS: Go runtime bo'shatilgan xotirani darhol OS'ga qaytarmasligi mumkin; runtime/metrics va GODEBUG=madvdontneed tarixini hisobga olish","GOMEMLIMIT qo'yilmagan bo'lsa GC konteyner limitini bilmaydi — limitdan oldin yetarlicha yig'ishtirmaydi","Heap'dan tashqari: goroutine stack'lari (yuz minglab goroutine), mmap qilingan fayllar, cgo/kutubxona allokatsiyalari, katta bufer poollari","Kirish hajmi: cheklanmagan request body yoki javobni butunlay xotiraga o'qish (io.ReadAll) — bitta katta so'rov pod'ni o'ldiradi","Tuzatish: GOMEMLIMIT = limitning ~80%, MaxBytesReader / streaming o'qish, goroutine sonini cheklash, bufer hajmini chegaralash"],"e":"Amaliy qoida: Kubernetes'da Go servisi uchun memory request = limit va GOMEMLIMIT shu limitdan biroz past. Shunda GC agressivroq ishlaydi va OOMKill o'rniga latency biroz oshadi — bu ancha yaxshi ayirboshlash."},{"l":"S","t":"open","tp":"Go case","d":"go","id":12006,"n":"GC7","q":"CASE: Loglar 'context deadline exceeded' bilan to'lib ketdi. Qanday tahlil qilasiz?","m":["Qayerda: qaysi bog'liqlik (DB, Redis, tashqi API) va qaysi endpoint — xatoga kontekst qo'shilganmi (%w bilan o'ralganmi)","Haqiqatan sekinmi yoki navbatdami: bog'liqlikning o'z p99 si yaxshi bo'lsa — muammo pool/navbatda (connection pool kutish vaqti)","Timeout qiymatlari mantiqiymi: ichki timeout tashqisidan kichikmi, retry bilan birga umumiy byudjet oshib ketmayaptimi","Retry amplification: har qadam 3 martadan urinib, yuk ko'paytirilyaptimi — retry budget va circuit breaker","Tezkor chora: aybdor oqimni cheklash, timeout va pool sozlamalarini to'g'rilash, kerak bo'lsa degradatsiya (keshdan eski javob)","Kuzatuv: bog'liqlik bo'yicha alohida latency va xato metrikalari"],"e":"Klassik tuzoq: timeout'ni oshirib qo'yish. Bu ko'pincha holatni yomonlashtiradi — goroutine va ulanishlar uzoqroq band bo'ladi. To'g'ri yo'nalish: sababni topish va tez fail qilish (fail fast) + backpressure."},{"l":"S","t":"open","tp":"Go case","d":"go","id":12007,"n":"GC8","q":"CASE: 'too many open files' va 'connection reset by peer' xatolari paydo bo'ldi. Sabab va tuzatish?","m":["Eng tipik sabab: HTTP javobida resp.Body yopilmagan — ulanish pool'ga qaytmaydi va fayl deskriptori sizadi (defer resp.Body.Close(), body o'qilmasa ham)","Har so'rovda yangi http.Client yaratish — transport va ulanish pool'i qayta ishlatilmaydi; bitta Client'ni umumiy qilish kerak","Transport sozlamalari: MaxIdleConnsPerHost juda kichik bo'lsa ulanishlar doim ochilib-yopiladi (TIME_WAIT to'planadi)","Tekshirish: lsof/ss bilan ochiq deskriptorlar, ulimit -n, konteyner limitlari; metrikada FD soni","DB tomonida: rows.Close() unutilgan bo'lsa pool tugaydi","Tuzatish + himoya: linter (bodyclose), FD va pool metrikalari bo'yicha alert"],"e":"Bu xatolar 'tarmoq muammosi' bo'lib ko'rinadi, lekin deyarli har doim resursni yopmaslik natijasi. Yaxshi javob aniq kod naqshini nomlaydi va linter bilan qaytalanmasligini ta'minlaydi."},{"l":"S","t":"open","tp":"Go case","d":"go","id":12008,"n":"GC9","q":"CASE: Deploy paytida har safar bir nechta so'rov 502 bilan yiqiladi. Go servisi tomonida nima qilasiz?","m":["SIGTERM'ni ushlash: signal.NotifyContext bilan kontekst yaratish va srv.Shutdown(ctx) chaqirish (Close emas)","Shutdown'dan oldin readiness'ni 'not ready' qilib, LB/Service'dan chiqarilishini kutish (preStop sleep bir necha soniya)","Joriy so'rovlarga tugash uchun vaqt berish: shutdown deadline terminationGracePeriodSeconds dan kichik bo'lsin","Fon ishlarini to'xtatish: worker'lar ctx.Done() bo'yicha chiqadi, queue consumer joriy xabarni ack qilib to'xtaydi","Keep-alive: server IdleTimeout LB idle timeout'idan katta bo'lsin (aks holda LB yopilgan ulanishdan foydalanib 502 oladi)","Tekshirish: deploy paytida yuk testi va 5xx metrikasi bilan isbotlash"],"e":"Deploy'dagi 5xx 'normal' emas. Ko'pincha ikki sabab birga bo'ladi: graceful shutdown yo'qligi va readiness/endpoint yangilanishidagi kechikish — ikkalasi ham hal qilinishi kerak."},{"l":"S","t":"open","tp":"Go case","d":"go","id":12009,"n":"GC10","q":"CASE: Kafka consumer (Go) sekinlashdi va xotira o'sdi. Qanday yondashasiz?","m":["Lag qaysi partition'larda o'syapti — notekis bo'lsa key taqsimoti (hot key) yoki bitta consumer sekin","Ishlov profili: har xabarga DB yozish N+1 bo'lsa — batch qilish, prepared statement, bulk insert","Xotira: butun batch'ni xotiraga yig'ish, cheklanmagan kanal buferi yoki har xabarda katta obyekt yaratish — bufer hajmini cheklash, sync.Pool","Parallellik: partition soniga qarab worker; lekin tartib talab qilinsa kalit bo'yicha ketma-ketlikni saqlash","Sozlamalar: max.poll.interval.ms ishlov vaqtidan katta, fetch hajmi va commit strategiyasi (ishlovdan keyin)","Xatolar: poyson xabar uchun retry limiti va DLQ — cheksiz sikl xotirani ham yeydi"],"e":"Go tomonidagi tipik xato: har xabar uchun goroutine ochish va ularni cheklamaslik — yuk cho'qqisida minglab goroutine va OOM. To'g'ri: worker pool + bounded channel."},{"l":"St","t":"open","tp":"Go case","d":"go","id":12010,"n":"GC11","q":"CASE: Yangi versiya chiqarilgandan so'ng xatolar 5% ga oshdi, lekin faqat ba'zi foydalanuvchilarda. Qanday harakat qilasiz?","m":["Avval qaytarish: canary bo'lsa to'xtatish, to'liq chiqarilgan bo'lsa rollback — tergov keyin","Segmentlash: xatolar qaysi endpoint, qaysi tenant, qaysi client versiyasi, qaysi region — log va metrikani shu kesimda ko'rish","Diff: oxirgi deploy nimani o'zgartirdi (kod, konfiguratsiya, migratsiya, bog'liqlik versiyasi, feature flag)","Ma'lumot tomoni: yangi kod eski ma'lumot formatini o'qiy oladimi (nullable maydon, enum qiymati) — ko'pincha 'ba'zi foydalanuvchilar' aynan shu","Takrorlash: muammoli so'rov namunasini olib, staging'da qayta ishlab ko'rish; test yozish","Postmortem: nega canary ushlamadi — metrika, trafik ulushi yoki kuzatuv oynasi yetarli emasmi"],"e":"Staff signal: 'avval mitigatsiya, keyin tahlil' va 'ba'zi foydalanuvchilar' iborasini segmentga aylantirish. Deploy'ni shubhali deb hisoblash — statistik jihatdan to'g'ri boshlanish nuqtasi."},{"l":"St","t":"open","tp":"Go case","d":"go","id":12011,"n":"GC12","q":"CASE: Bitta og'ir hisobot endpoint'i butun servisni sekinlashtirmoqda. Arxitektura darajasida nima qilasiz?","m":["Izolyatsiya: og'ir ishni alohida servis/worker pool'ga chiqarish (bulkhead) — bitta oqim boshqasini o'ldirmasin","Asinxronlashtirish: hisobotni so'rov ichida emas, job sifatida bajarish va tayyor bo'lgach havola/bildirishnoma berish","Cheklash: parallel hisobotlar soniga semaphore, foydalanuvchi bo'yicha rate limit, natijani keshlash","Ma'lumot tomoni: analitik query'ni replica yoki DWH'ga ko'chirish, oldindan agregatsiya (materialized view)","Timeout va bekor qilish: client uzilsa ishni to'xtatish (context), uzoq ishlar uchun deadline","Kuzatuv: endpoint bo'yicha resurs iste'moli va navbat uzunligi metrikalari"],"e":"Staff javobning o'zagi — resursni ajratish (bulkhead) va sinxron so'rovdan chiqarish. Faqat 'query'ni optimallashtiramiz' deyish qisqa muddatli yechim: yuk oshsa muammo qaytadi."},{"l":"St","t":"open","tp":"Go case","d":"go","id":20013,"n":"GT14","q":"Monolitdan Go mikroservislariga o'tish taklif qilindi. Staff sifatida qanday javob berasan?","m":"Avval savol: qanday muammoni yechyapmiz? Sabab jamoalar bir-birini bloklashi bo'lsa — modullilik va deploy mustaqilligi kerak, bu monolit ichida ham (modular monolith, alohida deploy birligi) erishiladi. Sabab masshtab bo'lsa — faqat tor joy (hot path) ajratiladi. Reja: (1) o'lchov — deploy chastotasi, lead time, incident sabablari; (2) domen chegaralarini aniqlash (DDD, event storming) va monolit ichida modul sifatida mustahkamlash; (3) faqat isbotlangan chegarani strangler fig bilan ajratish, avval o'qish yo'lini; (4) ma'lumot: har servisga o'z sxemasi, o'zaro JOIN o'rniga API/event, outbox bilan izchillik; (5) platforma tayyorligi — CI/CD, kuzatuv, tracing, on-call; bularsiz mikroservis tarqoq monolitga aylanadi; (6) narxni ochiq aytish: tarqoq tranzaksiya yo'qligi, tarmoq xatolari, versiyalash, lokal ishlab chiqish murakkabligi.","e":"Staff javobining mohiyati — texnologiya tanlovi emas, muammoni aniqlash va eng arzon yechimni taklif qilish, hamda tashkiliy narxni (Conway qonuni, on-call yuki) ko'rsatish. 'Yo'q' deyishning ham asosli varianti bo'lishi kerak."},{"l":"St","t":"open","tp":"Go case","d":"go","id":20014,"n":"GT15","q":"Go servisi p99 latency SLO'sini buzyapti, lekin CPU 30%. Qanday tizimli yondashasan?","m":"1) Muammoni raqamlashtirish: qaysi endpoint, qaysi tenant, qaysi vaqt; SLO va error budget qancha yeyilgan. 2) USE/RED bo'yicha qarash: utilizatsiya past bo'lsa muammo navbatda yoki kutishda. 3) Kutish joylarini topish: DB pool kutishi (pool metrikalari), lock contention (mutex profil), channel/worker navbati (block profil), tashqi chaqiruv (tracing span'lari), GC assist (gctrace), CFS throttling. 4) Little's law bilan konkurentlik chegarasini tekshirish; bitta sekin bog'liqlik butun pool'ni egallayotgan bo'lishi mumkin (bulkhead kerak). 5) Gipotezani load test bilan tasdiqlash, bitta o'zgarish kiritish, o'lchash. 6) Tuzatish variantlari: pool hajmi va timeout, N+1 query, kesh, batching, hedged request, load shedding, adaptive concurrency. 7) Qaytalanmasligi uchun: SLO alert, dashboards, yuk testini CI'ga qo'yish, post-mortem.","e":"Asosiy tushuncha: CPU past bo'lganda ham tizim to'yingan bo'lishi mumkin — cheklov navbat va kutishda. Staff darajasida kutilgani — o'lchov asosidagi ketma-ketlik va tashkiliy davomi (SLO, alert, post-mortem), shunchaki 'profil oldim' emas."},{"l":"St","t":"open","tp":"Go case","d":"go","id":20015,"n":"GT16","q":"Jamoada ikki dasturchi 'DDD kerak' va 'oddiy CRUD yetarli' deb bahslashyapti. Qaror qanday chiqariladi?","m":"Mezon — domen murakkabligi, o'zgarish tezligi va qoidalarning qayerdaligi. Agar biznes qoidalari ko'p, ular tez-tez o'zgaradi va bir necha joyda takrorlanadi — domen modeli (invariantlar entity/aggregate ichida, use case application qatlamida) foyda beradi. Agar mohiyatan ma'lumot kiritish-chiqarish bo'lsa — qatlam qo'shish faqat qimmat. Amaliy yo'l: bitta bounded context'ni tanlab ikkala uslubni taqqoslash; qoidalarni testlar bilan qamrab, keyin ko'chirish; 'hamma joyda bir xil arxitektura' talab qilmaslik — kontekstlar har xil bo'lishi normal. Qarorni ADR sifatida yozib, qayta ko'rish sanasini belgilash.","e":"Go'da DDD ko'pincha og'ir freymvorksiz amalga oshadi: domain paketi tashqi kutubxonalarsiz (faqat standart kutubxona), repository interfeysi domen tomonida e'lon qilinadi, adapterlar tashqarida. Staff javobi bahsni texnologiya emas, mezon va o'lchov bilan yopadi."},{"l":"St","t":"mcq","tp":"Go case","d":"go","id":20016,"n":"GT17","q":"Umumiy kutubxona (shared library) 8 ta servisda ishlatiladi. Unga breaking change kerak. To'g'ri yo'l?","o":["Yangi API'ni yonma-yon qo'shib, eskisini Deprecated deb belgilash; iste'molchilar ko'chgach yangi major (v2) chiqarish — hech qachon bir vaqtda hammani majburlamaslik","Darhol o'zgartirib, hamma repo'ni tuzatish","Kutubxonani har servisga nusxalash","Faqat jamoaga xabar berish yetarli"],"a":0,"e":"Expand/contract (parallel change) naqshi: qo'shish, ko'chirish, o'chirish. Go'da yordam beradigan vositalar: `// Deprecated:` kommentariysi (IDE va linter ko'rsatadi), /v2 modul yo'li, va migratsiya uchun gofmt -r yoki go fix uslubidagi skript. Tashkiliy tomoni: ko'chish muddati, egalik va kim qo'llab-quvvatlashi kelishilgan bo'lsin — aks holda uchta versiya abadiy yashaydi."},{"l":"St","t":"open","tp":"Go case","d":"go","id":30179,"n":"SN180","q":"Production'da Go servis p99 latency 2 sekundga chiqdi, CPU 30%. Qanday tekshirasiz?","m":["Avval o'lchov: p99 qaysi endpoint va qaysi instansiyada — hammasida yoki bittasida (hot shard/pod)? Trace bilan qaysi hop vaqt yeganini aniqlash","Bloklanish gipotezalari: DB pool tugagan (`sql.DBStats.WaitCount`/`WaitDuration`), tashqi HTTP timeout, mutex contention, kanal navbati","`/debug/pprof/block` va `/debug/pprof/mutex` (yoqilgan bo'lsa), `goroutine?debug=2` bilan bloklangan stack'lar — 10k goroutine bir joyda kutayotgani darhol ko'rinadi","GC: `GODEBUG=gctrace=1` yoki runtime metrikalari — pauza uzunligi va chastotasi; STW pauza p99'ni ko'tarishi mumkin (katta heap, ko'p pointer)","Runtime scheduling: `GOMAXPROCS` vs CPU limiti, CFS throttling (`container_cpu_cfs_throttled_seconds_total`) — CPU 30% ko'rinib turib throttle bo'lishi mumkin","Tashqi: DNS (5s retry), TLS handshake, keep-alive yo'qligi, downstream p99","Tuzatgandan keyin: xuddi shu metrikaga alert va yuk testi bilan regressiyani tekshirish"],"e":"CPU past + latency yuqori — deyarli har doim kutish: qulf, pool, tashqi chaqiruv yoki throttling. Kutilayotgan javob tartibi: o'lchash → bloklanishni topish (block/mutex/goroutine profil) → runtime/infra cheklovlarini tekshirish."},{"l":"St","t":"open","tp":"Go case","d":"go","id":30180,"n":"SN181","q":"Servisda goroutine soni monoton o'sib boradi (leak). Qanday topib tuzatasiz?","m":["Dalil: `runtime.NumGoroutine()` metrikasi vaqt bo'yicha o'sish grafigi (alert shu metrikaga qo'yilishi kerak)","Aniqlash: `curl /debug/pprof/goroutine?debug=1` — o'sayotgan stack guruhi darhol ko'rinadi; ikki snapshot farqi eng ishonchli","Eng ko'p uchraydigan sabablar: `resp.Body` yopilmagan (HTTP client goroutine'i qoladi), kanalga yozuv/ o'qish abadiy bloklangan, `time.Ticker` `Stop` qilinmagan, `ctx` uzatilmagan fon ishlari, `for { go ... }` cheksiz spawn","Tuzatish naqshlari: har goroutine uchun 'kim to'xtatadi' aniq bo'lishi, kanal operatsiyalari `select`da `ctx.Done()` bilan, `defer resp.Body.Close()` + `io.Copy(io.Discard, body)`","Profilaktika: `go.uber.org/goleak` bilan testda leak tekshiruvi, va `-race` bilan CI","Tasdiqlash: tuzatishdan keyin yuk testi ostida goroutine soni stabillashishi (grafik bilan), xotira RSS ham tekis bo'lishi"],"e":"Bu savolda intervyuer aniq vositalarni eshitmoqchi: pprof goroutine ikki snapshot farqi va goleak. 'Xotira oshdi, GOGC o'zgartirdim' javobi sababni ko'rmaganlikni ko'rsatadi."},{"l":"S","t":"open","tp":"Go case","d":"go","id":30181,"n":"SN182","q":"Go servis DB bilan ishlaydi. Ulanish pool'ini qanday sozlaysiz va nega?","m":["`SetMaxOpenConns`: DB tomonidagi `max_connections` va boshqa iste'molchilar bilan hisoblanadi — barcha pod × pool ≤ DB limiti (minus zaxira); PostgreSQL'da har ulanish alohida jarayon, shuning uchun 100-200 dan oshirish odatda zarar","`SetMaxIdleConns` = MaxOpen (yoki yaqin) — aks holda ulanishlar doimiy yopilib-ochiladi (handshake narxi)","`SetConnMaxLifetime` (masalan 30 daqiqa) — LB/PgBouncer orqasida eski ulanishlarni yangilash va failover'dan keyin trafik qayta taqsimlanishi uchun; `SetConnMaxIdleTime` bilan bo'sh ulanishlarni bo'shatish","Sizing: Little's law — kerakli parallel query = RPS × query_duration; pool shundan kichik bo'lsa navbat kutish latency'ga qo'shiladi (`DBStats.WaitDuration` bilan kuzatiladi)","Juda ko'p ulanish ham yomon: DB'da kontekst almashinish va lock contention oshadi — ko'pincha PgBouncer (transaction pooling) bilan markazlashtirish to'g'riroq","Har query'da `context` timeout; `statement_timeout` DB tomonda ham qo'yiladi","Kuzatuv: `WaitCount`, `WaitDuration`, `InUse`, `Idle` metrikalari — pool tugashi incident'larda eng ko'p uchraydigan bo'g'iz"],"e":"Kutilayotgan asosiy fikr: pool o'lchami tasodifiy raqam emas, DB sig'imi va Little's law bilan hisoblanadi; `ConnMaxLifetime` esa failover va PgBouncer bilan ishlashda majburiy."},{"l":"St","t":"open","tp":"Go case","d":"go","id":30329,"n":"SN330","q":"Production'da Go servis p99 latency 2 sekundga chiqdi, CPU 30%. Qanday tekshirasiz?","m":["Avval o'lchov: p99 qaysi endpoint va qaysi instansiyada — hammasida yoki bittasida (hot shard/pod)? Trace bilan qaysi hop vaqt yeganini aniqlash","Bloklanish gipotezalari: DB pool tugagan (`sql.DBStats.WaitCount`/`WaitDuration`), tashqi HTTP timeout, mutex contention, kanal navbati","`/debug/pprof/block` va `/debug/pprof/mutex` (yoqilgan bo'lsa), `goroutine?debug=2` bilan bloklangan stack'lar — 10k goroutine bir joyda kutayotgani darhol ko'rinadi","GC: `GODEBUG=gctrace=1` yoki runtime metrikalari — pauza uzunligi va chastotasi; STW pauza p99'ni ko'tarishi mumkin (katta heap, ko'p pointer)","Runtime scheduling: `GOMAXPROCS` vs CPU limiti, CFS throttling (`container_cpu_cfs_throttled_seconds_total`) — CPU 30% ko'rinib turib throttle bo'lishi mumkin","Tashqi: DNS (5s retry), TLS handshake, keep-alive yo'qligi, downstream p99","Tuzatgandan keyin: xuddi shu metrikaga alert va yuk testi bilan regressiyani tekshirish"],"e":"CPU past + latency yuqori — deyarli har doim kutish: qulf, pool, tashqi chaqiruv yoki throttling. Kutilayotgan javob tartibi: o'lchash → bloklanishni topish (block/mutex/goroutine profil) → runtime/infra cheklovlarini tekshirish."},{"l":"St","t":"open","tp":"Go case","d":"go","id":30330,"n":"SN331","q":"Servisda goroutine soni monoton o'sib boradi (leak). Qanday topib tuzatasiz?","m":["Dalil: `runtime.NumGoroutine()` metrikasi vaqt bo'yicha o'sish grafigi (alert shu metrikaga qo'yilishi kerak)","Aniqlash: `curl /debug/pprof/goroutine?debug=1` — o'sayotgan stack guruhi darhol ko'rinadi; ikki snapshot farqi eng ishonchli","Eng ko'p uchraydigan sabablar: `resp.Body` yopilmagan (HTTP client goroutine'i qoladi), kanalga yozuv/ o'qish abadiy bloklangan, `time.Ticker` `Stop` qilinmagan, `ctx` uzatilmagan fon ishlari, `for { go ... }` cheksiz spawn","Tuzatish naqshlari: har goroutine uchun 'kim to'xtatadi' aniq bo'lishi, kanal operatsiyalari `select`da `ctx.Done()` bilan, `defer resp.Body.Close()` + `io.Copy(io.Discard, body)`","Profilaktika: `go.uber.org/goleak` bilan testda leak tekshiruvi, va `-race` bilan CI","Tasdiqlash: tuzatishdan keyin yuk testi ostida goroutine soni stabillashishi (grafik bilan), xotira RSS ham tekis bo'lishi"],"e":"Bu savolda intervyuer aniq vositalarni eshitmoqchi: pprof goroutine ikki snapshot farqi va goleak. 'Xotira oshdi, GOGC o'zgartirdim' javobi sababni ko'rmaganlikni ko'rsatadi."},{"l":"S","t":"open","tp":"Go case","d":"go","id":30331,"n":"SN332","q":"Go servis DB bilan ishlaydi. Ulanish pool'ini qanday sozlaysiz va nega?","m":["`SetMaxOpenConns`: DB tomonidagi `max_connections` va boshqa iste'molchilar bilan hisoblanadi — barcha pod × pool ≤ DB limiti (minus zaxira); PostgreSQL'da har ulanish alohida jarayon, shuning uchun 100-200 dan oshirish odatda zarar","`SetMaxIdleConns` = MaxOpen (yoki yaqin) — aks holda ulanishlar doimiy yopilib-ochiladi (handshake narxi)","`SetConnMaxLifetime` (masalan 30 daqiqa) — LB/PgBouncer orqasida eski ulanishlarni yangilash va failover'dan keyin trafik qayta taqsimlanishi uchun; `SetConnMaxIdleTime` bilan bo'sh ulanishlarni bo'shatish","Sizing: Little's law — kerakli parallel query = RPS × query_duration; pool shundan kichik bo'lsa navbat kutish latency'ga qo'shiladi (`DBStats.WaitDuration` bilan kuzatiladi)","Juda ko'p ulanish ham yomon: DB'da kontekst almashinish va lock contention oshadi — ko'pincha PgBouncer (transaction pooling) bilan markazlashtirish to'g'riroq","Har query'da `context` timeout; `statement_timeout` DB tomonda ham qo'yiladi","Kuzatuv: `WaitCount`, `WaitDuration`, `InUse`, `Idle` metrikalari — pool tugashi incident'larda eng ko'p uchraydigan bo'g'iz"],"e":"Kutilayotgan asosiy fikr: pool o'lchami tasodifiy raqam emas, DB sig'imi va Little's law bilan hisoblanadi; `ConnMaxLifetime` esa failover va PgBouncer bilan ishlashda majburiy."},{"l":"P","t":"open","tp":"Go case","d":"go","id":30419,"n":"SN420","q":"Go servisda p99 latency GC pauzalari tufayli sakramoqda deb gumon qilinyapti. Qanday isbotlaysiz va tuzatasiz?","m":["Isbot: `GODEBUG=gctrace=1` yoki `runtime/metrics` (`gc/pauses`, `gc/cycles`) — pauza davomiyligi va chastotasi; `go tool trace` bilan GC bosqichlari va assist vaqtini so'rov timeline'iga solishtirish","Zamonaviy Go'da STW pauza odatda <1ms — shuning uchun ko'pincha aybdor pauza emas, balki GC assist (ajratuvchi goroutine GC ishining bir qismini bajaradi) va CPU raqobati","Allocation profili: `-alloc_space` bilan eng ko'p ajratuvchi yo'l; issiq yo'lda `[]byte`/string konversiyalari, log formatlash, JSON, slice/map oldindan sig'imsiz","Tuzatish: allocation kamaytirish (Builder, preallocation, buffer qayta ishlatish), pointer sonini kamaytirish (GC skan vaqti), va kerak bo'lsa `GOGC` oshirish + `GOMEMLIMIT` bilan chegaralash","Infra tomoni: CPU limiti va CFS throttling — GC CPU talab qiladi, kvota kichik bo'lsa pauza uzayadi; `GOMAXPROCS` kvotaga moslanishi shart","Tasdiqlash: o'zgarishdan oldin/keyin p99 va `gc/pauses` taqsimoti, yuk testi bilan; bitta o'zgarish — bitta o'lchov"],"e":"Kutilayotgan asosiy nuqta: GC'ni ayblashdan oldin o'lchash, va zamonaviy Go'da muammo odatda pauza emas — allocation tezligi va CPU kvotasi. `GOGC`ni ko'r-ko'rona o'zgartirish javobi yetarli emas."},{"l":"M","t":"code","tp":"Go gotcha","d":"go","id":8000,"n":"T1","q":"Funksiya nima qaytaradi?","c":"func f() (result int) {\n    defer func() { result *= 2 }()\n    return 5\n}","o":["5","10","0","panic"],"a":1,"e":"Nomlangan qaytish qiymati (named return) bilan `return 5` avval result=5 qiladi, keyin defer ishlaydi va result ni 10 ga o'zgartiradi. Nomlanmagan bo'lsa (func f() int) defer qaytish qiymatiga ta'sir qila olmaydi. Shuning uchun xatoni defer ichida o'rash uchun aynan named return ishlatiladi: defer func(){ if err != nil { err = fmt.Errorf(\"...: %w\", err) } }()."},{"l":"M","t":"code","tp":"Go gotcha","d":"go","id":8001,"n":"T2","q":"Natija?","c":"var m map[string]int\nfmt.Println(m[\"yo'q\"], len(m))\nm[\"a\"] = 1","o":["0 0, keyin panic: assignment to entry in nil map","panic darhol birinchi row'da","0 0, keyin 'a' qo'shiladi","Kompilyatsiya xatosi"],"a":0,"e":"nil map'dan o'qish xavfsiz — nol qiymat va len=0 qaytadi; yozish esa panic beradi. nil slice esa aksincha: append(nilSlice, x) mutlaqo to'g'ri ishlaydi. Shuning uchun struct ichidagi map maydonini konstruktorda make bilan initsializatsiya qilish odat bo'lishi kerak."},{"l":"M","t":"code","tp":"Go gotcha","d":"go","id":8002,"n":"T3","q":"Nima chop etiladi?","c":"type P struct{ N int }\nps := []P{{1}, {2}, {3}}\nfor _, p := range ps {\n    p.N *= 10\n}\nfmt.Println(ps)","o":["[{10} {20} {30}]","[{1} {2} {3}]","panic","[{10} {2} {3}]"],"a":1,"e":"range har elementning NUSXASINI beradi — nusxani o'zgartirish asl slice'ga ta'sir qilmaydi. To'g'ri yo'llar: for i := range ps { ps[i].N *= 10 } yoki []*P ishlatish. Xuddi shu sabab bilan katta struct'lar ustida range qilish nusxa olish narxini ham qo'shadi."},{"l":"M","t":"code","tp":"Go gotcha","d":"go","id":8003,"n":"T4","q":"Bu kod qanday ishlaydi?","c":"m := map[string]int{\"a\":1, \"b\":2, \"c\":3}\nfor k := range m {\n    fmt.Print(k, \" \")\n}","o":["Har doim a b c","Tartib tasodifiy — Go map iteratsiyasi ataylab tartibsiz (har ishga tushishda boshqacha)","Tartib kiritilish bo'yicha","Kompilyatsiya xatosi"],"a":1,"e":"Go runtime iteratsiyani ataylab tasodifiy boshlaydi — dasturchilar tartibga tayanib qolmasligi uchun. Barqaror natija kerak bo'lsa: key'larni slice'ga yig'ib sort qilish (yoki Go 1.21+ da slices.Sorted(maps.Keys(m))). Testlar aynan shu sababdan 'ba'zan yiqiladi'."},{"l":"S","t":"code","tp":"Go gotcha","d":"go","id":8004,"n":"T5","q":"Kompilyatsiya bo'ladimi?","c":"type Animal interface{ Speak() string }\ntype Dog struct{}\nfunc (d *Dog) Speak() string { return \"woof\" }\n\nvar a Animal = Dog{}","o":["Ha, ishlaydi","Yo'q: Speak pointer receiver bilan e'lon qilingan, shuning uchun interfeysni faqat *Dog qanoatlantiradi — var a Animal = &Dog{} bo'lishi kerak","Ha, lekin panic beradi","Faqat Go 1.22 da ishlaydi"],"a":1,"e":"Metod to'plami qoidasi: *T tipi ham value, ham pointer receiver metodlariga ega; T esa faqat value receiver metodlariga. Amaliy maslahat: bitta tip uchun receiver turlarini aralashtirmang — struct o'zgartiriladigan yoki katta bo'lsa hamma metodda pointer receiver ishlating.","src":"https://go.dev/tour/methods/10"},{"l":"S","t":"code","tp":"Go gotcha","d":"go","id":8005,"n":"T6","q":"Natija?","c":"s := \"héllo\"\nfmt.Println(len(s), s[1])\nfor i, r := range s { fmt.Print(i, string(r), \" \"); break }","o":["5 va 'é'","6 va 195 (bayt), range esa indeks 0 va 'h' beradi","5 va 'h'","panic"],"a":1,"e":"len(s) — baytlar soni (é — 2 bayt, shuning uchun 6). s[1] — bitta BAYT (uint8), belgi emas. range esa UTF-8 ni dekodlab rune va uning bayt indeksini beradi (indekslar 0,1,3,4,5 kabi sakraydi). Xato yozilgan kesish (s[:3]) belgi o'rtasidan bo'lishi mumkin — natijada buzilgan matn."},{"l":"S","t":"code","tp":"Go gotcha","d":"go","id":8006,"n":"T7","q":"JSON'da nima chiqadi?","c":"type U struct {\n    Name  string `json:\"name\"`\n    email string\n    Age   int    `json:\"age,omitempty\"`\n}\nb, _ := json.Marshal(U{Name:\"Ali\", email:\"a@x.uz\", Age:0})","o":["{\"name\":\"Ali\",\"email\":\"a@x.uz\",\"age\":0}","{\"name\":\"Ali\"} — eksport qilinmagan maydon (email) umuman marshal qilinmaydi, Age esa omitempty va 0 bo'lgani uchun tushib qoladi","{\"name\":\"Ali\",\"age\":0}","Xato qaytadi"],"a":1,"e":"Ikki tuzoq: 1) kichik harfli maydonlar paketdan tashqariga ko'rinmaydi — encoding/json ularni ko'rmaydi (xato ham bermaydi); 2) omitempty nol qiymatni (0, \"\", false, nil) tushiradi — 'foydalanuvchi 0 kiritdi' bilan 'kiritmadi' farqi yo'qoladi. Bu farq kerak bo'lsa *int yoki maxsus tip ishlating."},{"l":"S","t":"code","tp":"Go gotcha","d":"go","id":8007,"n":"T8","q":"Dastur nima qiladi?","c":"func main() {\n    defer fmt.Println(\"tugadi\")\n    go func() { panic(\"boom\") }()\n    time.Sleep(time.Second)\n}","o":["'boom' ni chop etib davom etadi","Butun dastur crash bo'ladi: goroutine'dagi panic'ni tashqaridan recover qilib bo'lmaydi va defer'lar ham ishlamay qoladi — recover o'sha goroutine ichida bo'lishi kerak","Faqat goroutine to'xtaydi","Kompilyatsiya xatosi"],"a":1,"e":"Qoida: har ishga tushirilgan goroutine o'z panic'ini o'zi ushlashi kerak (worker boshida defer func(){ if r:=recover(); r!=nil {log...} }()). HTTP serverda net/http har query goroutine'ini o'zi recover qiladi, lekin siz ichkarida yaratgan goroutine'ni emas — bu production'da eng ko'p uchraydigan to'satdan crash sababi."},{"l":"S","t":"code","tp":"Go gotcha","d":"go","id":8008,"n":"T9","q":"Nima bo'ladi?","c":"type Key struct{ Tags []string }\nm := map[Key]int{}          // 1\nvar a any = []int{1}\nvar b any = []int{1}\nfmt.Println(a == b)          // 2","o":["Ikkalasi ham ishlaydi, natija true","1-row kompilyatsiya xatosi (slice maydonli struct taqqoslanmaydi, key bo'la olmaydi), 2-row esa runtime panic: comparing uncomparable type []int","Ikkalasi ham false","1 ishlaydi, 2 false qaytaradi"],"a":1,"e":"Taqqoslanmaydigan tiplar: slice, map, funksiya. Ular interfeys ichida bo'lsa xato kompilyatsiyada emas, ishlash vaqtida chiqadi — shuning uchun any bilan == ishlatish xavfli. Chuqur taqqoslash uchun reflect.DeepEqual yoki Go 1.21+ slices.Equal."},{"l":"S","t":"code","tp":"Go gotcha","d":"go","id":8009,"n":"T10","q":"Vaqtlarni taqqoslashda qaysi to'g'ri?","c":"t1 := time.Now()\nt2 := t1.Round(0)        // monotonic qism olib tashlanadi\nfmt.Println(t1 == t2, t1.Equal(t2))","o":["true true","false true — == struct ichidagi hamma maydonni (monotonic soat, wall clock, Location) solishtiradi; vaqt tengligini tekshirish uchun Equal ishlatiladi","true false","panic"],"a":1,"e":"time.Time — struct, shuning uchun == sintaktik jihatdan ishlaydi va kutilmagan natija beradi: bir xil lahza turli Location yoki monotonic holat bilan teng emas deb chiqadi. Qoida: vaqtni Equal, Before, After bilan solishtiring; map key'i sifatida vaqtni ishlatmang (UnixNano ishlating).","src":"https://pkg.go.dev/time#Time"},{"l":"S","t":"code","tp":"Go gotcha","d":"go","id":16000,"n":"E1","q":"Natija?","c":"type E struct{}\nfunc (E) Error() string { return \"e\" }\nfunc find() *E { return nil }\nfunc do() error { return find() }\nfmt.Println(do() == nil)","o":["true","false — typed nil interface'ga o'ralganda interface nil bo'lmaydi","panic","Kompilyatsiya xatosi"],"a":1,"e":"interface ikki so'zdan iborat: (type, value). do() qaytarganda type=*E, value=nil — type qismi bo'sh emas, shuning uchun taqqoslash false. Shuning uchun konkret error tipini hech qachon `error` sifatida qaytarmang; `var err error` e'lon qilib, faqat haqiqiy xato bo'lganda unga qiymat bering.","src":"https://go.dev/doc/faq#nil_error"},{"l":"M","t":"code","tp":"Go gotcha","d":"go","id":16001,"n":"E2","q":"b ning uzunligi va cap'i, hamda a ga ta'siri?","c":"a := []int{1,2,3,4,5}\nb := a[1:3]\nb = append(b, 99)\nfmt.Println(a, b)","o":["[1 2 3 99 5] [2 3 99] — b cap=4, append asosiy massivni yozadi","[1 2 3 4 5] [2 3 99]","panic: index out of range","[1 2 3 4 5 99] [2 3 99]"],"a":0,"e":"b := a[1:3] da len=2, cap=4 (massiv oxirigacha). append cap ichiga sig'gani uchun yangi massiv ajratilmaydi — a[3] ustiga yoziladi. Himoya: full slice expression a[1:3:3] cap'ni 2 qiladi, keyingi append nusxa oladi. Bu bug ayniqsa umumiy buffer'ni funksiyalarga uzatganda chiqadi."},{"l":"M","t":"code","tp":"Go gotcha","d":"go","id":16002,"n":"E3","q":"Nima chop etiladi?","c":"x := 0.1 + 0.2\nfmt.Println(x == 0.3, x)","o":["false 0.30000000000000004 — IEEE 754 float","true 0.3","false 0.3","panic"],"a":0,"e":"float64 ikkilik kasr — 0.1 va 0.2 aniq ifodalanmaydi. Pul uchun float ishlatilmaydi: int64 minor unit (tiyin/cent) yoki shopspring/decimal. Taqqoslash kerak bo'lsa epsilon bilan: math.Abs(a-b) < 1e-9."},{"l":"S","t":"code","tp":"Go gotcha","d":"go","id":16003,"n":"E4","q":"Bu kod nega xavfli?","c":"type Cache struct{ mu sync.Mutex; m map[string]int }\nfunc (c Cache) Get(k string) int {\n    c.mu.Lock(); defer c.mu.Unlock()\n    return c.m[k]\n}","o":["Value receiver — Mutex nusxalanadi, har chaqiruv boshqa lock'ni qulflaydi, himoya yo'q","Hech qanday muammo yo'q","defer noto'g'ri joyda","map o'qish lock talab qilmaydi"],"a":0,"e":"sync.Mutex nusxalanmasligi kerak (`go vet` copylocks buni topadi). Value receiver har chaqiruvda struct nusxasini oladi — mutex ham nusxalanadi va mutual exclusion yo'qoladi. To'g'risi: func (c *Cache) Get(...). Umumiy qoida: mutex saqlaydigan struct har doim pointer orqali uzatiladi."},{"l":"M","t":"mcq","tp":"Go gotcha","d":"go","id":16004,"n":"E5","q":"`defer resp.Body.Close()` ni qachon yozish kerak?","o":["err tekshiruvidan KEYIN — err != nil bo'lsa resp nil bo'lishi mumkin va nil pointer panic chiqadi","http.Get dan oldin","Umuman kerak emas, GC yopadi","func oxirida qo'lda"],"a":0,"e":"net/http kontrakti: xato bo'lmasa resp.Body doim nil emas va yopilishi shart; xato bo'lsa resp nil. To'g'ri tartib: resp, err := c.Do(req); if err != nil { return err }; defer resp.Body.Close(). Body yopilmasa connection pool'ga qaytmaydi — fd leak va keyinchalik 'too many open files'. Qayta ishlatish uchun body'ni oxirigacha o'qish ham kerak (io.Copy(io.Discard, resp.Body))."},{"l":"S","t":"code","tp":"Go gotcha","d":"go","id":16005,"n":"E6","q":"Loop oxirida nechta faylni yopadi?","c":"for _, name := range names {\n    f, err := os.Open(name)\n    if err != nil { return err }\n    defer f.Close()\n    process(f)\n}","o":["Hech birini — hamma defer funksiya tugaganda ishlaydi, loop'da emas; ko'p fayl ochilsa fd tugaydi","Har iteratsiyada bittasini","Hammasini darhol","Kompilyatsiya xatosi"],"a":0,"e":"defer funksiya scope'iga bog'lanadi, blok scope'iga emas. Yechim: tana'ni alohida funksiyaga (yoki anonim func bilan darhol chaqirishga) chiqarish, yoki Go 1.22+ da ham qoida o'zgarmagan — faqat loop o'zgaruvchisi semantikasi o'zgargan, defer emas."},{"l":"M","t":"code","tp":"Go gotcha","d":"go","id":16006,"n":"E7","q":"Natija?","c":"var arr [3]int\nb := arr\nb[0] = 9\nfmt.Println(arr[0], b[0])","o":["0 9 — array qiymat tipi, tayinlash to'liq nusxa","9 9","panic","0 0"],"a":0,"e":"Go'da array — qiymat tipi (slice esa header: ptr+len+cap). Funksiyaga [1000000]int uzatish million element nusxasi demak. Shuning uchun deyarli har doim slice ishlatiladi; array esa o'lcham tipning bir qismi bo'lgan joyda (masalan [32]byte hash) foydali."},{"l":"M","t":"code","tp":"Go gotcha","d":"go","id":16007,"n":"E8","q":"Qaysi ifoda panic beradi?","c":"var s []int\n// A: fmt.Println(len(s), cap(s))\n// B: s = append(s, 1)\n// C: fmt.Println(s[0])\n// D: for range s {}","o":["Faqat C — nil slice o'qish/append/range xavfsiz, lekin indeks bo'yicha kirish out of range","A va C","Hammasi","Hech biri"],"a":0,"e":"nil slice: len=0, cap=0, range 0 marta aylanadi, append yangi massiv ajratadi. Faqat mavjud bo'lmagan indeks panic beradi. Shuning uchun JSON'da bo'sh massiv kerak bo'lsa nil emas, []T{} qaytaring — nil `null` ga marshal bo'ladi."},{"l":"S","t":"code","tp":"Go gotcha","d":"go","id":30140,"n":"SN141","q":"Bu kod nima chiqaradi va nega?","c":"type MyErr struct{}\nfunc (e *MyErr) Error() string { return \"boom\" }\n\nfunc do() error {\n    var e *MyErr = nil\n    return e\n}\n\nfunc main() {\n    if err := do(); err != nil {\n        fmt.Println(\"xato bor:\", err == nil)\n    }\n}","o":["Hech narsa chiqmaydi","`xato bor: false` — typed nil interface'ga solinganda interface nil bo'lmaydi (tur bor, qiymat nil)","panic: nil pointer","Kompilyatsiya xatosi"],"a":1,"e":"Interface ikki so'zdan iborat: (type, value). `(*MyErr, nil)` — type mavjud, shuning uchun `err != nil` rost, lekin `err.Error()` chaqirilsa panic bo'lishi mumkin. Qoida: konkret pointer turini `error` sifatida qaytarmaslik — funksiya `error` qaytarsa `return nil` yozilishi kerak, `var e *MyErr; return e` emas."},{"l":"S","t":"code","tp":"Go gotcha","d":"go","id":30141,"n":"SN142","q":"`sub` slice'iga `append` qilinganda nima bo'ladi?","c":"a := []int{1, 2, 3, 4, 5}\nsub := a[1:3]          // len 2, cap 4\nsub = append(sub, 99)\nfmt.Println(a, sub)","o":["`[1 2 3 4 5] [2 3 99]` — a o'zgarmaydi","`[1 2 3 99 5] [2 3 99]` — cap yetgani uchun append asl massivni bosib yozadi","panic","`[1 2 3 4 5 99]`"],"a":1,"e":"Slice bir xil backing array'ni ko'rsatadi; `cap(sub)=4` bo'lgani uchun append yangi massiv ajratmay `a[3]`ni almashtiradi. Himoya: `a[1:3:3]` (full slice expression bilan cap'ni cheklash) yoki `slices.Clone`. Bu xato ayniqsa funksiyaga slice berib, u append qilganda jim ma'lumot buzilishiga olib keladi."},{"l":"S","t":"code","tp":"Go gotcha","d":"go","id":30142,"n":"SN143","q":"Ushbu map'dagi struct maydonini o'zgartirish nega kompilyatsiya qilinmaydi?","c":"type P struct{ N int }\nm := map[string]P{\"a\": {1}}\nm[\"a\"].N = 2","o":["Map faqat o'qish uchun","Map elementi addressable emas — `m[\"a\"]` nusxa qaytaradi; yechim: qiymatni olib o'zgartirib qaytib yozish yoki `map[string]*P` ishlatish","`N` eksport qilinmagan","Map'da struct saqlanmaydi"],"a":1,"e":"Map ichidagi qiymat ko'chishi mumkin (rehash), shuning uchun Go unga manzil bermaydi. Ikki yo'l: `p := m[\"a\"]; p.N = 2; m[\"a\"] = p` yoki pointer saqlash (lekin u holda nil tekshiruvi va GC yuki paydo bo'ladi). Slice elementi esa addressable — `s[0].N = 2` ishlaydi."},{"l":"S","t":"code","tp":"Go gotcha","d":"go","id":30143,"n":"SN144","q":"`defer` qaysi qiymatni yozadi?","c":"func f() (err error) {\n    defer fmt.Println(\"A:\", err)\n    defer func() { fmt.Println(\"B:\", err) }()\n    err = errors.New(\"late\")\n    return err\n}","o":["Ikkisi ham `late`","`B: late`, `A: <nil>` — birinchi defer argumenti darhol baholanadi, closure esa bajarilish paytida o'qiydi","Ikkisi ham nil","Kompilyatsiya xatosi"],"a":1,"e":"`defer f(x)` da `x` defer e'lon qilinganda hisoblanadi; closure ichidagi o'zgaruvchi esa keyin o'qiladi. Shuning uchun xatoni o'rab qaytarish (`defer func(){ if err != nil { err = fmt.Errorf(\"...: %w\", err) } }()`) faqat named return va closure bilan ishlaydi. Metrik/log yozadigan defer'larda bu eng ko'p uchraydigan xato."},{"l":"S","t":"mcq","tp":"Go gotcha","d":"go","id":30144,"n":"SN145","q":"`time.After` uzoq ishlaydigan `select` loop ichida ishlatilgan. Muammo?","o":["Muammo yo'q","Har iteratsiyada yangi timer yaratiladi va o'z vaqtigacha GC qilinmaydi — yuqori RPS'da xotira va timer heap o'sadi; `time.NewTimer` + `Reset`/`Stop` yoki `context` bilan ishlanadi","Timer ishlamaydi","Goroutine deadlock"],"a":1,"e":"`time.After(d)` kanalni qaytaradi, lekin timer runtime heap'ida `d` tugaguncha yashaydi. 1 daqiqali timeout bilan sekundda 10k iteratsiya — 600k tirik timer. Go 1.23'da timer GC xatti-harakati yaxshilangan, lekin idiomatik yechim baribir timer'ni qayta ishlatish yoki `ctx.Done()`."},{"l":"S","t":"code","tp":"Go gotcha","d":"go","id":30290,"n":"SN291","q":"Bu kod nima chiqaradi va nega?","c":"type MyErr struct{}\nfunc (e *MyErr) Error() string { return \"boom\" }\n\nfunc do() error {\n    var e *MyErr = nil\n    return e\n}\n\nfunc main() {\n    if err := do(); err != nil {\n        fmt.Println(\"xato bor:\", err == nil)\n    }\n}","o":["Hech narsa chiqmaydi","`xato bor: false` — typed nil interface'ga solinganda interface nil bo'lmaydi (tur bor, qiymat nil)","panic: nil pointer","Kompilyatsiya xatosi"],"a":1,"e":"Interface ikki so'zdan iborat: (type, value). `(*MyErr, nil)` — type mavjud, shuning uchun `err != nil` rost, lekin `err.Error()` chaqirilsa panic bo'lishi mumkin. Qoida: konkret pointer turini `error` sifatida qaytarmaslik — funksiya `error` qaytarsa `return nil` yozilishi kerak, `var e *MyErr; return e` emas."},{"l":"S","t":"code","tp":"Go gotcha","d":"go","id":30291,"n":"SN292","q":"`sub` slice'iga `append` qilinganda nima bo'ladi?","c":"a := []int{1, 2, 3, 4, 5}\nsub := a[1:3]          // len 2, cap 4\nsub = append(sub, 99)\nfmt.Println(a, sub)","o":["`[1 2 3 4 5] [2 3 99]` — a o'zgarmaydi","`[1 2 3 99 5] [2 3 99]` — cap yetgani uchun append asl massivni bosib yozadi","panic","`[1 2 3 4 5 99]`"],"a":1,"e":"Slice bir xil backing array'ni ko'rsatadi; `cap(sub)=4` bo'lgani uchun append yangi massiv ajratmay `a[3]`ni almashtiradi. Himoya: `a[1:3:3]` (full slice expression bilan cap'ni cheklash) yoki `slices.Clone`. Bu xato ayniqsa funksiyaga slice berib, u append qilganda jim ma'lumot buzilishiga olib keladi."},{"l":"S","t":"code","tp":"Go gotcha","d":"go","id":30292,"n":"SN293","q":"Ushbu map'dagi struct maydonini o'zgartirish nega kompilyatsiya qilinmaydi?","c":"type P struct{ N int }\nm := map[string]P{\"a\": {1}}\nm[\"a\"].N = 2","o":["Map faqat o'qish uchun","Map elementi addressable emas — `m[\"a\"]` nusxa qaytaradi; yechim: qiymatni olib o'zgartirib qaytib yozish yoki `map[string]*P` ishlatish","`N` eksport qilinmagan","Map'da struct saqlanmaydi"],"a":1,"e":"Map ichidagi qiymat ko'chishi mumkin (rehash), shuning uchun Go unga manzil bermaydi. Ikki yo'l: `p := m[\"a\"]; p.N = 2; m[\"a\"] = p` yoki pointer saqlash (lekin u holda nil tekshiruvi va GC yuki paydo bo'ladi). Slice elementi esa addressable — `s[0].N = 2` ishlaydi."},{"l":"S","t":"code","tp":"Go gotcha","d":"go","id":30293,"n":"SN294","q":"`defer` qaysi qiymatni yozadi?","c":"func f() (err error) {\n    defer fmt.Println(\"A:\", err)\n    defer func() { fmt.Println(\"B:\", err) }()\n    err = errors.New(\"late\")\n    return err\n}","o":["Ikkisi ham `late`","`B: late`, `A: <nil>` — birinchi defer argumenti darhol baholanadi, closure esa bajarilish paytida o'qiydi","Ikkisi ham nil","Kompilyatsiya xatosi"],"a":1,"e":"`defer f(x)` da `x` defer e'lon qilinganda hisoblanadi; closure ichidagi o'zgaruvchi esa keyin o'qiladi. Shuning uchun xatoni o'rab qaytarish (`defer func(){ if err != nil { err = fmt.Errorf(\"...: %w\", err) } }()`) faqat named return va closure bilan ishlaydi. Metrik/log yozadigan defer'larda bu eng ko'p uchraydigan xato."},{"l":"S","t":"mcq","tp":"Go gotcha","d":"go","id":30294,"n":"SN295","q":"`time.After` uzoq ishlaydigan `select` loop ichida ishlatilgan. Muammo?","o":["Muammo yo'q","Har iteratsiyada yangi timer yaratiladi va o'z vaqtigacha GC qilinmaydi — yuqori RPS'da xotira va timer heap o'sadi; `time.NewTimer` + `Reset`/`Stop` yoki `context` bilan ishlanadi","Timer ishlamaydi","Goroutine deadlock"],"a":1,"e":"`time.After(d)` kanalni qaytaradi, lekin timer runtime heap'ida `d` tugaguncha yashaydi. 1 daqiqali timeout bilan sekundda 10k iteratsiya — 600k tirik timer. Go 1.23'da timer GC xatti-harakati yaxshilangan, lekin idiomatik yechim baribir timer'ni qayta ishlatish yoki `ctx.Done()`."},{"l":"S","t":"code","tp":"Concurrency gotcha","d":"go","id":16008,"n":"E9","q":"Bu kod nima qiladi?","c":"ch := make(chan int)\nvar wg sync.WaitGroup\nfor i := 0; i < 3; i++ {\n    wg.Add(1)\n    go func(){ defer wg.Done(); ch <- i }()\n}\nwg.Wait()\nclose(ch)\nfor v := range ch { fmt.Println(v) }","o":["Deadlock — unbuffered channel'ga yozayotgan goroutine'lar o'quvchi yo'qligi uchun bloklanadi, wg.Wait() hech qachon qaytmaydi","3 ta qiymat chop etadi","panic: send on closed channel","Tasodifiy tartibda ishlaydi"],"a":0,"e":"Klassik tuzoq: consumer producer'dan KEYIN turibdi. To'g'ri shakl — close'ni alohida goroutine'ga olish: go func(){ wg.Wait(); close(ch) }(), keyin asosiy goroutine'da range ch. Buffered channel (make(chan int,3)) ham bu holatda ishlaydi, lekin miqdor oldindan ma'lum bo'lgandagina."},{"l":"S","t":"code","tp":"Concurrency gotcha","d":"go","id":16009,"n":"E10","q":"Bu WaitGroup ishlatilishida nima xato?","c":"for _, u := range urls {\n    go func(u string){\n        wg.Add(1)\n        defer wg.Done()\n        fetch(u)\n    }(u)\n}\nwg.Wait()","o":["wg.Add goroutine ICHIDA — Wait() goroutine'lar boshlanishidan oldin 0 ko'rib darhol qaytishi mumkin","defer wg.Done() noto'g'ri","u ni uzatish kerak emas","Hech qanday xato yo'q"],"a":0,"e":"Add har doim goroutine'ni ishga tushirishdan OLDIN, chaqiruvchi goroutine'da bajariladi. Aks holda race: Wait() counter hali oshmasidan qaytadi va natijalar yo'qoladi. Go 1.25+ da `wg.Go(func(){...})` shu naqshni o'zi to'g'ri bajaradi."},{"l":"S","t":"mcq","tp":"Concurrency gotcha","d":"go","id":16010,"n":"E11","q":"Nil channel'ga yozish yoki undan o'qish nima qiladi?","o":["Abadiy bloklanadi (panic emas) — select ichida case'ni 'o'chirish' uchun ishlatiladi","panic beradi","Darhol nol qiymat qaytaradi","Kompilyatsiya xatosi"],"a":0,"e":"nil channel operatsiyalari hech qachon tayyor bo'lmaydi. Bu xususiyat foydali: select loop'da tugagan manba channel'ini `ch = nil` qilib qo'ysangiz, o'sha case boshqa tanlanmaydi va busy loop (yopilgan channel doim tayyor) yo'qoladi. Yopilgan channel'dan o'qish esa aksincha — darhol nol qiymat va ok=false."},{"l":"S","t":"code","tp":"Concurrency gotcha","d":"go","id":16011,"n":"E12","q":"Bu kod nega xato?","c":"for i := range items {\n    go func(){ results[i] = work(items[i]) }()\n}","o":["Go 1.22+ da i har iteratsiyada yangi — lekin baribir results'ga parallel yozish sinxronizatsiyasiz; bu yerda har goroutine boshqa indeksga yozgani uchun xavfsiz, wg yo'qligi asosiy bug","Go 1.21 va oldin i ulashilgan bo'lgani uchun hamma goroutine oxirgi indeksni ko'radi","Hech qanday xato yo'q","Kompilyatsiya xatosi"],"a":1,"e":"Go 1.22 gacha loop o'zgaruvchisi iteratsiyalar orasida ulashilar edi — barcha goroutine'lar oxirgi qiymatni ko'rardi. 1.22 dan boshlab har iteratsiyada yangi o'zgaruvchi (`loopvar` o'zgarishi, go.mod'dagi `go 1.22` yo'nalishi bilan yoqiladi). Baribir bu kodda kutish yo'q — asosiy funksiya goroutine'lar tugashini kutmaydi. Turli indekslarga yozish o'z-o'zidan data race emas.","src":"https://go.dev/blog/loopvar-preview"},{"l":"P","t":"mcq","tp":"Concurrency gotcha","d":"go","id":16012,"n":"E13","q":"`-race` detektori nimani kafolatlaydi?","o":["Faqat ISHGA TUSHGAN kodda yuz bergan race'ni topadi — test qamrovi past bo'lsa race'ni ko'rmaydi; false positive bermaydi","Barcha mumkin bo'lgan race'larni statik topadi","Deadlock'ni ham topadi","Ishlash tezligiga ta'sir qilmaydi"],"a":0,"e":"ThreadSanitizer dinamik: haqiqatda bajarilgan xotira kirishlarini happens-before bo'yicha tekshiradi. Topganida — haqiqiy bug (false positive yo'q), topmaganida — kafolat yo'q. Narxi: ~2-20x sekin, 5-10x xotira. Amaliyot: CI'da `go test -race ./...` va integration testlarni race bilan yuritish.","src":"https://go.dev/doc/articles/race_detector"},{"l":"S","t":"code","tp":"Concurrency gotcha","d":"go","id":16013,"n":"E14","q":"Bu kod nima bilan tugaydi?","c":"var once sync.Once\nfunc get() *DB {\n    once.Do(func(){ db = connect() })\n    return db\n}\n// connect() panic qilsa nima bo'ladi?","o":["once 'bajarildi' deb belgilanadi — keyingi chaqiruvlar Do'ni qayta ishga tushirmaydi va db nil qoladi","Keyingi chaqiruvda qayta urinadi","Butun dastur to'xtaydi va tiklanmaydi","Do hech qachon tugamaydi"],"a":0,"e":"sync.Once funksiya panic bilan tugasa ham bajarilgan hisoblanadi (Do defer orqali belgilaydi). Shuning uchun Once ichida panic qiladigan initsializatsiya qilmang: xatoni qaytaring va saqlang (`var initErr error`), keyin har chaqiruvda qaytaring, yoki retry kerak bo'lsa Once o'rniga mutex+flag ishlating."},{"l":"P","t":"open","tp":"Concurrency gotcha","d":"go","id":16014,"n":"E15","q":"Production'da goroutine soni asta-sekin o'sib bormoqda (pprof goroutine profili 50k ko'rsatyapti), lekin RPS o'zgarmagan. Qanday tekshirasan?","m":"1) `curl /debug/pprof/goroutine?debug=2` — stack'lar bo'yicha guruhlash, qaysi qatorda 'chan receive'/'chan send'/'select' da turgani ko'rinadi. 2) Eng ko'p uchraydigan stack'ni topish — odatda: context'siz HTTP chaqiruv, javob kutayotgan goroutine; yoki hech kim o'qimaydigan channel'ga yozish; yoki timer/ticker Stop qilinmagan. 3) Tekshirish ro'yxati: har http.Client'da Timeout yoki req context; time.Ticker uchun defer t.Stop(); worker'lar uchun ctx.Done() tanlovi; resp.Body.Close(). 4) Reproduktsiya: load test + goroutine count metrikasi (runtime.NumGoroutine() gauge). 5) Alert: goroutine soni RPS'ga proporsional bo'lmay o'ssa ogohlantirish.","e":"Goroutine leak — Go'dagi eng keng tarqalgan production muammosi. Asosiy sabab: goroutine hech qachon tayyor bo'lmaydigan operatsiyada bloklangan. Har goroutine kamida 8 KB stack — 50k ta ~400 MB+ va GC bosimi. Profil turi: goroutine profili (block/mutex emas) — u bloklangan goroutine stack'larini aynan ko'rsatadi."},{"l":"S","t":"code","tp":"Concurrency gotcha","d":"go","id":30152,"n":"SN153","q":"Bu kodda qanday bug bor?","c":"var wg sync.WaitGroup\nfor _, u := range urls {\n    wg.Add(1)\n    go func() {\n        defer wg.Done()\n        fetch(u)\n    }()\n}\nwg.Wait()","o":["`wg.Add` noto'g'ri joyda","Go 1.22'gacha loop o'zgaruvchisi barcha goroutine'lar uchun umumiy bo'lgan — hammasi oxirgi `u`ni oladi; 1.22+ da har iteratsiyada yangi o'zgaruvchi, lekin kod eski versiyalarda va linter'siz xavfli","`wg.Wait` deadlock","`fetch` nil"],"a":1,"e":"Go 1.22 loop semantikasini o'zgartirdi (har iteratsiya yangi o'zgaruvchi), shuning uchun yangi kodda bug yo'q. Lekin: `go.mod` da eski `go` direktivasi bo'lsa eski xatti-harakat saqlanadi. Ishonchli uslub — argument sifatida uzatish (`go func(u string){...}(u)`), va parallelizmni cheklash (semaphore/errgroup `SetLimit`), aks holda 10k URL 10k goroutine va tashqi servisni o'ldirish."},{"l":"S","t":"code","tp":"Concurrency gotcha","d":"go","id":30153,"n":"SN154","q":"Bu kod nega deadlock beradi?","c":"ch := make(chan int)   // unbuffered\nch <- 1\nfmt.Println(<-ch)","o":["Kanal yopilmagan","Buferlanmagan kanalda yuborish o'quvchi bo'lguncha bloklanadi — bir goroutine ichida o'zi kutadi: `fatal error: all goroutines are asleep - deadlock!`","`make` xato","Kanal turi mos emas"],"a":1,"e":"Unbuffered kanal — sinxronlash nuqtasi: yuborish va qabul qilish bir vaqtda bo'lishi kerak. Yechim: o'qishni alohida goroutine'da qilish yoki `make(chan int, 1)`. Kattaroq amaliy xulosa: kanal bilan ishlashda 'kim yopadi, kim o'qiydi' shartnomasi oldindan aniq bo'lishi kerak — aks holda yopilgan kanalga yozish (panic) yoki abadiy kutish paydo bo'ladi."},{"l":"St","t":"mcq","tp":"Concurrency gotcha","d":"go","id":30154,"n":"SN155","q":"`sync.Mutex`ni struct bilan nusxalash nima qiladi?","o":["Hech narsa","Qulf holati nusxalanadi — ikki nusxa bir-birini himoya qilmaydi, race paydo bo'ladi (`go vet` copylocks bilan ogohlantiradi); shuning uchun mutexli struct pointer bilan uzatiladi","Kompilyatsiya xatosi","Deadlock kafolatlangan"],"a":1,"e":"Klassik ko'rinish: metod `func (s Store) Add()` (value receiver) — har chaqiruvda mutex nusxasi qulflanadi va hech kimni to'xtatmaydi. `go vet` bu holatni topadi, CI'da majburiy bo'lishi kerak. Xuddi shu qoida `sync.WaitGroup`, `sync.Once`, `atomic.Value` uchun ham amal qiladi."},{"l":"S","t":"code","tp":"Concurrency gotcha","d":"go","id":30302,"n":"SN303","q":"Bu kodda qanday bug bor?","c":"var wg sync.WaitGroup\nfor _, u := range urls {\n    wg.Add(1)\n    go func() {\n        defer wg.Done()\n        fetch(u)\n    }()\n}\nwg.Wait()","o":["`wg.Add` noto'g'ri joyda","Go 1.22'gacha loop o'zgaruvchisi barcha goroutine'lar uchun umumiy bo'lgan — hammasi oxirgi `u`ni oladi; 1.22+ da har iteratsiyada yangi o'zgaruvchi, lekin kod eski versiyalarda va linter'siz xavfli","`wg.Wait` deadlock","`fetch` nil"],"a":1,"e":"Go 1.22 loop semantikasini o'zgartirdi (har iteratsiya yangi o'zgaruvchi), shuning uchun yangi kodda bug yo'q. Lekin: `go.mod` da eski `go` direktivasi bo'lsa eski xatti-harakat saqlanadi. Ishonchli uslub — argument sifatida uzatish (`go func(u string){...}(u)`), va parallelizmni cheklash (semaphore/errgroup `SetLimit`), aks holda 10k URL 10k goroutine va tashqi servisni o'ldirish."},{"l":"S","t":"code","tp":"Concurrency gotcha","d":"go","id":30303,"n":"SN304","q":"Bu kod nega deadlock beradi?","c":"ch := make(chan int)   // unbuffered\nch <- 1\nfmt.Println(<-ch)","o":["Kanal yopilmagan","Buferlanmagan kanalda yuborish o'quvchi bo'lguncha bloklanadi — bir goroutine ichida o'zi kutadi: `fatal error: all goroutines are asleep - deadlock!`","`make` xato","Kanal turi mos emas"],"a":1,"e":"Unbuffered kanal — sinxronlash nuqtasi: yuborish va qabul qilish bir vaqtda bo'lishi kerak. Yechim: o'qishni alohida goroutine'da qilish yoki `make(chan int, 1)`. Kattaroq amaliy xulosa: kanal bilan ishlashda 'kim yopadi, kim o'qiydi' shartnomasi oldindan aniq bo'lishi kerak — aks holda yopilgan kanalga yozish (panic) yoki abadiy kutish paydo bo'ladi."},{"l":"St","t":"mcq","tp":"Concurrency gotcha","d":"go","id":30304,"n":"SN305","q":"`sync.Mutex`ni struct bilan nusxalash nima qiladi?","o":["Hech narsa","Qulf holati nusxalanadi — ikki nusxa bir-birini himoya qilmaydi, race paydo bo'ladi (`go vet` copylocks bilan ogohlantiradi); shuning uchun mutexli struct pointer bilan uzatiladi","Kompilyatsiya xatosi","Deadlock kafolatlangan"],"a":1,"e":"Klassik ko'rinish: metod `func (s Store) Add()` (value receiver) — har chaqiruvda mutex nusxasi qulflanadi va hech kimni to'xtatmaydi. `go vet` bu holatni topadi, CI'da majburiy bo'lishi kerak. Xuddi shu qoida `sync.WaitGroup`, `sync.Once`, `atomic.Value` uchun ham amal qiladi."},{"l":"M","t":"code","tp":"Time gotcha","d":"go","id":16015,"n":"E16","q":"Bu taqqoslash nega xato?","c":"t1, _ := time.Parse(time.RFC3339, \"2024-01-01T00:00:00Z\")\nt2 := t1.In(time.FixedZone(\"UTC+5\", 5*3600))\nfmt.Println(t1 == t2)","o":["false — `==` monotonic clock va Location'ni ham solishtiradi; to'g'risi t1.Equal(t2)","true","panic","Kompilyatsiya xatosi"],"a":0,"e":"time.Time struct: wall clock + monotonic reading + *Location. `==` barcha maydonlarni solishtiradi, shuning uchun bir xil lahzaning turli zonadagi ko'rinishlari teng chiqmaydi. Har doim t1.Equal(t2) ishlating. time.Now() dan olingan qiymatda monotonic qism bor — uni Round(0) olib tashlaydi (DB'ga yozishdan oldin foydali).","src":"https://pkg.go.dev/time#Time"},{"l":"S","t":"mcq","tp":"Time gotcha","d":"go","id":16016,"n":"E17","q":"Vaqt oralig'ini o'lchash uchun nima ishlatiladi?","o":["time.Since(start) — u monotonic clock'dan foydalanadi, NTP sakrashi yoki DST ta'sir qilmaydi","time.Now().Unix() farqi","time.Now().Sub(start.UTC())","Har biri bir xil"],"a":0,"e":"Wall clock NTP tuzatishi bilan orqaga sakrashi mumkin — o'lchov manfiy chiqadi. Go time.Now() ichida monotonic reading saqlaydi va Sub/Since shu qismni ishlatadi. Lekin Unix() yoki UTC()/Round(0) chaqirsangiz monotonic qism yo'qoladi va wall clock'ga qaytasiz."},{"l":"M","t":"open","tp":"Time gotcha","d":"go","id":16017,"n":"E18","q":"Kelajakdagi uchrashuvni qanday saqlaysan: UTC timestamp'mi yoki local vaqt + timezone'mi?","m":"O'tgan hodisa (log, audit, created_at) — UTC instant (timestamptz). Kelajakdagi inson rejalashtirgan hodisa (uchrashuv, budilnik, cron) — local wall time + IANA timezone nomi ('Asia/Tashkent'), UTC emas. Sabab: davlat DST yoki offset qoidasini o'zgartirsa (bu har yili bir necha marta yuz beradi), saqlangan UTC noto'g'ri mahalliy vaqtga aylanadi; zona nomi bilan saqlansa qayta hisoblash to'g'ri chiqadi. Takrorlanuvchi hodisa uchun RRULE + zona saqlanadi, har instance oldindan UTC'ga materializatsiya qilinmaydi (yoki qilinsa, tzdata yangilanganda qayta hisoblanadi).","e":"Postgres'da timestamptz aslida zona saqlamaydi — u kiruvchi qiymatni UTC'ga o'girib saqlaydi. Shuning uchun zona nomi alohida ustunda kerak. Server tzdata versiyasi ham deploy artefakti — Go'da `time/tzdata` paketini import qilib binary ichiga joylash mumkin.","src":"https://www.postgresql.org/docs/current/datatype-datetime.html"},{"l":"M","t":"code","tp":"Time gotcha","d":"go","id":16018,"n":"E19","q":"JSON'da nima chiqadi?","c":"type U struct {\n    ID   int64  `json:\"id\"`\n    Name string `json:\"name\"`\n    age  int\n}\nb, _ := json.Marshal(U{1, \"ali\", 30})","o":["{\"id\":1,\"name\":\"ali\"} — kichik harfli (unexported) maydon marshal bo'lmaydi","{\"id\":1,\"name\":\"ali\",\"age\":30}","Xato qaytaradi","{\"ID\":1,...}"],"a":0,"e":"encoding/json faqat exported maydonlarni ko'radi (reflection unexported'ga yoza olmaydi). Yana tuzoqlar: int64 JavaScript'da 2^53 dan keyin aniqlikni yo'qotadi — katta ID'larni string sifatida yuboring (`json:\"id,string\"`); `omitempty` 0 va false ni ham tashlab yuboradi — ixtiyoriy maydon uchun pointer yoki *sql.Null* ishlating."},{"l":"P","t":"mcq","tp":"Time gotcha","d":"go","id":16019,"n":"E20","q":"Ikki service o'rtasida UUID'ni tartiblash kerak. Qaysi variant to'g'ri?","o":["UUIDv7 — vaqt prefiksi bor, leksikografik tartib vaqt tartibiga mos, B-tree index'da ham lokal","UUIDv4 — tasodifiy, tartiblash mumkin emas va index'da random insert","Har ikkisi bir xil","MD5 hash"],"a":0,"e":"UUIDv4 to'liq tasodifiy — B-tree'ga insert har safar boshqa sahifaga tushadi (WAL amplification, cache miss). UUIDv7 (RFC 9562, 2024) birinchi 48 bit — Unix millisekund; monotonik o'sish B-tree'ning o'ng chetiga insert qiladi, ULID bilan bir xil g'oya. Ogohlantirish: vaqt prefiksi yaratilish vaqtini oshkor qiladi.","src":"https://datatracker.ietf.org/doc/html/rfc9562"},{"l":"S","t":"mcq","tp":"Time gotcha","d":"go","id":30155,"n":"SN156","q":"Kunlik hisobot `WHERE created_at >= current_date` bilan yozilgan, lekin natijalar 5 soatga surilgan. Sabab?","o":["Server sekin","`timestamp without time zone` vs `timestamptz` va sessiya `TimeZone` sozlamasi aralashgan — UTC'da saqlanib mahalliy vaqt bilan solishtirilgan yoki teskarisi","Indeks yo'q","DST"],"a":1,"e":"Qoida: hamma joyda `timestamptz` (UTC'da saqlanadi, chiqishda konvertatsiya) va biznes 'kun' chegarasi aniq vaqt zonasida hisoblanadi: `created_at >= (date_trunc('day', now() AT TIME ZONE 'Asia/Tashkent')) AT TIME ZONE 'Asia/Tashkent'`. Hisobot talabini 'kimning kuni' deb aniqlash — mahsulot qarori, texnik emas."},{"l":"S","t":"mcq","tp":"Time gotcha","d":"go","id":30156,"n":"SN157","q":"Go'da ikki vaqt orasidagi o'tgan muddatni o'lchash uchun nima ishlatiladi?","o":["`time.Now().Sub(start)` — lekin `start` boshqa mashinadan kelgan bo'lsa ham to'g'ri","`time.Since(start)` bir jarayon ichida monoton soatni ishlatadi; lekin vaqt DB/tarmoqdan kelib serializatsiya qilinsa monoton komponent yo'qoladi va NTP tuzatishlari natijani buzadi","`time.Unix()` har doim","Faqat `time.Sleep`"],"a":1,"e":"Go `time.Time` ichida wall clock va monoton o'qish ikkalasini saqlaydi; `Sub`/`Since` monotondan foydalanadi. Ammo `t.Round(0)`, JSON marshal yoki DB'ga yozib qaytarish monoton qismni o'chiradi — shundan keyin o'lchov NTP sakrashiga bog'liq bo'ladi, hatto manfiy davomiylik chiqishi mumkin."},{"l":"S","t":"mcq","tp":"Time gotcha","d":"go","id":30157,"n":"SN158","q":"'Har oyning 31-kuni' obunasini hisoblashda qanday edge case bor?","o":["Yo'q","Fevralda 31-kun yo'q — siyosat aniq belgilanishi kerak (oyning oxirgi kuni yoki 1-mart); shuningdek DST kunida mahalliy 02:30 mavjud bo'lmasligi va ikki marta bo'lishi mumkin","Faqat yillik hisobda","Faqat ma'lumot bazasida"],"a":1,"e":"Go'da `AddDate(0, 1, 0)` 31-yanvarga qo'shilsa 3-mart chiqadi (kun oshib ketadi) — bu odatda biznes kutganidan boshqa. Shuning uchun davriy hisob-kitob 'anchor day' + oy oxiri bilan clamp qilib yoziladi va testlarda fevral, kabisa yil, DST kunlari alohida holat sifatida bo'ladi."},{"l":"S","t":"mcq","tp":"Time gotcha","d":"go","id":30305,"n":"SN306","q":"Kunlik hisobot `WHERE created_at >= current_date` bilan yozilgan, lekin natijalar 5 soatga surilgan. Sabab?","o":["Server sekin","`timestamp without time zone` vs `timestamptz` va sessiya `TimeZone` sozlamasi aralashgan — UTC'da saqlanib mahalliy vaqt bilan solishtirilgan yoki teskarisi","Indeks yo'q","DST"],"a":1,"e":"Qoida: hamma joyda `timestamptz` (UTC'da saqlanadi, chiqishda konvertatsiya) va biznes 'kun' chegarasi aniq vaqt zonasida hisoblanadi: `created_at >= (date_trunc('day', now() AT TIME ZONE 'Asia/Tashkent')) AT TIME ZONE 'Asia/Tashkent'`. Hisobot talabini 'kimning kuni' deb aniqlash — mahsulot qarori, texnik emas."},{"l":"S","t":"mcq","tp":"Time gotcha","d":"go","id":30306,"n":"SN307","q":"Go'da ikki vaqt orasidagi o'tgan muddatni o'lchash uchun nima ishlatiladi?","o":["`time.Now().Sub(start)` — lekin `start` boshqa mashinadan kelgan bo'lsa ham to'g'ri","`time.Since(start)` bir jarayon ichida monoton soatni ishlatadi; lekin vaqt DB/tarmoqdan kelib serializatsiya qilinsa monoton komponent yo'qoladi va NTP tuzatishlari natijani buzadi","`time.Unix()` har doim","Faqat `time.Sleep`"],"a":1,"e":"Go `time.Time` ichida wall clock va monoton o'qish ikkalasini saqlaydi; `Sub`/`Since` monotondan foydalanadi. Ammo `t.Round(0)`, JSON marshal yoki DB'ga yozib qaytarish monoton qismni o'chiradi — shundan keyin o'lchov NTP sakrashiga bog'liq bo'ladi, hatto manfiy davomiylik chiqishi mumkin."},{"l":"S","t":"mcq","tp":"Time gotcha","d":"go","id":30307,"n":"SN308","q":"'Har oyning 31-kuni' obunasini hisoblashda qanday edge case bor?","o":["Yo'q","Fevralda 31-kun yo'q — siyosat aniq belgilanishi kerak (oyning oxirgi kuni yoki 1-mart); shuningdek DST kunida mahalliy 02:30 mavjud bo'lmasligi va ikki marta bo'lishi mumkin","Faqat yillik hisobda","Faqat ma'lumot bazasida"],"a":1,"e":"Go'da `AddDate(0, 1, 0)` 31-yanvarga qo'shilsa 3-mart chiqadi (kun oshib ketadi) — bu odatda biznes kutganidan boshqa. Shuning uchun davriy hisob-kitob 'anchor day' + oy oxiri bilan clamp qilib yoziladi va testlarda fevral, kabisa yil, DST kunlari alohida holat sifatida bo'ladi."},{"l":"S","t":"mcq","tp":"Time gotcha","d":"go","id":30496,"n":"SN497","q":"`time.Time` ni DB'ga yozib o'qiganda vaqt o'zgarib qolyapti. Sabab?","o":["Driver bug'i","Ustun turi `timestamp` (zonasiz) bo'lsa zona ma'lumoti tashlanadi va o'qishda sessiya zonasi qo'llanadi; `timestamptz` + hamma joyda UTC bilan ishlash muammoni yo'qotadi","Go vaqtni saqlamaydi","Faqat SQLite'da"],"a":1,"e":"Amaliy qoidalar: DB'da `timestamptz`, ilovada UTC, foydalanuvchiga ko'rsatishda mahalliy zona; `time.Time` monoton komponenti serializatsiyada yo'qoladi (davomiylik o'lchash uchun yaramaydi); testlarda `time.Now()` ni inject qilinadigan `Clock` bilan almashtirish — aks holda testlar zonaga va soatga bog'liq bo'ladi."},{"l":"St","t":"mcq","tp":"Time gotcha","d":"go","id":30497,"n":"SN498","q":"Kunlik cron soat 02:30 da ishlaydi. DST o'tishida nima bo'ladi?","o":["Hech narsa","Bahorda 02:30 mavjud bo'lmasligi mumkin (ish o'tkazib yuboriladi), kuzda esa ikki marta bo'ladi (ish ikki marta ishlaydi) — shuning uchun jadval UTC'da yuritiladi va ish idempotent qilinadi (`run_key` bilan)","Cron avtomatik to'g'rilaydi","Faqat AQShda"],"a":1,"e":"Xuddi shu muammo 'oyning oxirgi kuni' va kabisa yil bilan ham bor. Yechim naqshi: rejalashtirishni UTC'da saqlash, foydalanuvchiga mahalliy zonada ko'rsatish, va har bajarilishga `(job_id, scheduled_for)` unique kaliti berish — takror ishga tushsa ikkinchisi o'tkazib yuboriladi."},{"l":"P","t":"code","tp":"Memory gotcha","d":"go","id":17000,"n":"E38","q":"Bu funksiya nega xotira ushlab qoladi?","c":"func firstLine(data []byte) []byte {\n    i := bytes.IndexByte(data, '\\n')\n    return data[:i]\n}\n// data — 10 MB fayl","o":["Qaytgan slice asosiy 10 MB massivga ishora qiladi — GC butun massivni ozod qila olmaydi; yechim: bytes.Clone yoki append([]byte(nil), data[:i]...)","Hech qanday muammo yo'q, GC kesilgan qismni ozod qiladi","panic: slice bounds","Faqat string bilan muammo bo'ladi"],"a":0,"e":"Slice — massivga ishora qiluvchi header. Kichik sub-slice ham butun backing array'ni tirik ushlaydi. Xuddi shu holat: katta slice'dan bitta elementni struct'da saqlash, yoki []byte'dan sub-slice'ni cache'ga qo'yish. Yechim — nusxa olish (Go 1.20+ da bytes.Clone / slices.Clone)."},{"l":"P","t":"mcq","tp":"Memory gotcha","d":"go","id":17001,"n":"E39","q":"Slice'dan element o'chirganda pointer'lar nima bo'ladi?","o":["s = append(s[:i], s[i+1:]...) oxirgi slot'da eski pointer nusxasini qoldiradi — u tirik qoladi; oxirgi elementga nil berish kerak","Go avtomatik tozalaydi","append pointer bilan ishlamaydi","Faqat map'da muammo bor"],"a":0,"e":"len kamayadi, lekin backing array'ning [len] pozitsiyasidagi eski pointer saqlanib qoladi va obyektni GC'dan himoya qiladi (memory leak). To'g'ri: s[len(s)-1] = nil; s = s[:len(s)-1] yoki Go 1.21+ da slices.Delete (u ortiqcha slot'larni nol qiladi).","src":"https://go.dev/wiki/SliceTricks"},{"l":"P","t":"mcq","tp":"Memory gotcha","d":"go","id":17002,"n":"E40","q":"Go'da map'dan ko'p element o'chirilgandan keyin xotira qaytmayapti. Nega?","o":["Map bucket'lari hech qachon qisqarmaydi — delete faqat slot'ni bo'shatadi; xotirani qaytarish uchun yangi map qurib ko'chirish kerak","GC buzilgan","delete xotirani darhol qaytaradi, muammo boshqa joyda","Faqat sync.Map'da shunday"],"a":0,"e":"Go runtime map'ni shrink qilmaydi: 10M element qo'shib hammasini o'chirsangiz, bucket massivi joyida qoladi. Katta vaqtinchalik map'lar uchun: ishdan keyin map'ni nil qilish yoki yangisini yaratish. Shuningdek map[string]BigStruct o'rniga map[string]*BigStruct pointer skanini oshiradi — katta map'larda GC vaqtiga ta'sir qiladi."},{"l":"P","t":"mcq","tp":"Memory gotcha","d":"go","id":17003,"n":"E41","q":"Konteynerda Go servis OOMKilled bo'lyapti, lekin heap profili kichik. Birinchi nima tekshirasan?","o":["GOMEMLIMIT o'rnatilganmi — konteyner limitini Go bilmaydi, GOGC=100 heap'ni ikki barobarga o'stiradi; yana goroutine stack'lari va cgo/mmap xotirasi heap profilida ko'rinmaydi","Darhol GOGC=10 qo'yish","Xotira limitini olib tashlash","Faqat pod replikasini oshirish"],"a":0,"e":"Go 1.19+ GOMEMLIMIT — soft limit: unga yaqinlashganda GC tez-tez ishlaydi. Amaliy sozlash: GOMEMLIMIT ≈ konteyner limitining 80-90%, GOGC o'chirilmasin (off qilish xavfli). RSS heap'dan katta bo'lishining sabablari: goroutine stack'lari, runtime metadata, OS'ga hali qaytarilmagan sahifalar (MADV_FREE), cgo allocatsiyalari. Tekshiruv: runtime/metrics, GODEBUG=gctrace=1.","src":"https://go.dev/doc/gc-guide"},{"l":"S","t":"code","tp":"Memory gotcha","d":"go","id":17004,"n":"E42","q":"Qaysi kod escape to'g'ri tushuntiradi?","c":"func newUser() *User { u := User{}; return &u }","o":["u heap'ga escape qiladi — Go'da stack'dagi o'zgaruvchiga pointer qaytarish xavfsiz, kompilyator escape analysis bilan joyni tanlaydi","Dangling pointer, undefined behavior","Kompilyatsiya xatosi","Har doim stack'da qoladi"],"a":0,"e":"C'dan farqli o'laroq Go'da bu xavfsiz. Kompilyator `go build -gcflags='-m'` bilan qarorni ko'rsatadi: 'moved to heap: u'. Escape sabablari: pointer qaytarish, interface'ga solish, closure'da ushlash, fmt.Println kabi interface{} qabul qiluvchi chaqiruvlar. Hot path'da allokatsiyani kamaytirish uchun shu chiqishga qarab optimizatsiya qilinadi."},{"l":"S","t":"code","tp":"Memory gotcha","d":"go","id":30164,"n":"SN165","q":"Bu kod nega xotira ushlab qoladi?","c":"func firstLine(data []byte) []byte {\n    i := bytes.IndexByte(data, '\\n')\n    return data[:i]   // data 10MB bo'lsin\n}","o":["Ushlamaydi, faqat kichik qism qaytadi","Qaytgan slice 10MB backing array'ni ushlab turadi — GC butun massivni bo'shatmaydi; `append([]byte(nil), data[:i]...)` yoki `bytes.Clone` bilan nusxa olinadi","Panic bo'ladi","GC darhol tozalaydi"],"a":1,"e":"Slice — (ptr, len, cap): kichik oyna ham katta massivga havola. Bu naqsh HTTP javobini o'qib bir bo'lagini keshda saqlaganda haqiqiy leak keltiradi (kesh 100 element × 10MB). Xuddi shunday `string(bigBytes[:10])` esa nusxa oladi — string konversiyasi allocation qiladi."},{"l":"S","t":"mcq","tp":"Memory gotcha","d":"go","id":30165,"n":"SN166","q":"`sync.Pool` bilan ishlashda klassik xato?","o":["Pool ishlatmaslik","Buferni pool'ga qaytarishdan oldin tozalamaslik (eski ma'lumot boshqa so'rovga oqadi) yoki juda katta buferlarni qaytarish (pool xotirani ushlab qoladi); shuningdek pool'dagi obyektga havolani saqlab qo'yish","`Get` nil qaytaradi","Pool goroutine-safe emas"],"a":1,"e":"Xavfsizlik nuqtasi: ma'lumot oqishi (bir foydalanuvchi javobi boshqasiga) — real incident turi. To'g'ri naqsh: `buf.Reset()` qaytarishdan oldin, hajm chegarasidan katta buferlarni umuman qaytarmaslik, va pool'dan olingan slice'ga tashqi havola qoldirmaslik. `sync.Pool` GC paytida tozalanadi — kesh emas, faqat allocation pressure'ni kamaytirish vositasi."},{"l":"S","t":"mcq","tp":"Memory gotcha","d":"go","id":30272,"n":"SN273","q":"Go GC bor — unda memory leak qanday ko'rinishda bo'ladi?","o":["Go'da leak bo'lmaydi","GC faqat erishib bo'lmaydigan obyektlarni tozalaydi; leak — hali ham havola qilinayotgan, lekin kerak bo'lmagan ma'lumot: cheksiz o'sayotgan map/kesh (TTL yo'q), bloklangan goroutine'lar va ularning stack'i, `sync.Pool`da ushlangan katta buferlar, katta slice'ning kichik bo'lagini saqlash, yopilmagan `resp.Body` va `time.Ticker`","Faqat cgo'da","Faqat `unsafe` bilan"],"a":1,"e":"Bu savol intervyularda aynan shu shaklda so'raladi. Diagnostika: `/debug/pprof/heap` (inuse_space) ikki snapshot farqi kerak bo'lmagan ushlanishni ko'rsatadi, `/debug/pprof/goroutine` bloklanganlarni, RSS va `MemStats` esa Go tashqarisidagi o'sishni. Eng ko'p uchraydigan sabab — chegarasiz kesh (map) va goroutine leak."},{"l":"S","t":"code","tp":"Memory gotcha","d":"go","id":30314,"n":"SN315","q":"Bu kod nega xotira ushlab qoladi?","c":"func firstLine(data []byte) []byte {\n    i := bytes.IndexByte(data, '\\n')\n    return data[:i]   // data 10MB bo'lsin\n}","o":["Ushlamaydi, faqat kichik qism qaytadi","Qaytgan slice 10MB backing array'ni ushlab turadi — GC butun massivni bo'shatmaydi; `append([]byte(nil), data[:i]...)` yoki `bytes.Clone` bilan nusxa olinadi","Panic bo'ladi","GC darhol tozalaydi"],"a":1,"e":"Slice — (ptr, len, cap): kichik oyna ham katta massivga havola. Bu naqsh HTTP javobini o'qib bir bo'lagini keshda saqlaganda haqiqiy leak keltiradi (kesh 100 element × 10MB). Xuddi shunday `string(bigBytes[:10])` esa nusxa oladi — string konversiyasi allocation qiladi."},{"l":"S","t":"mcq","tp":"Memory gotcha","d":"go","id":30315,"n":"SN316","q":"`sync.Pool` bilan ishlashda klassik xato?","o":["Pool ishlatmaslik","Buferni pool'ga qaytarishdan oldin tozalamaslik (eski ma'lumot boshqa so'rovga oqadi) yoki juda katta buferlarni qaytarish (pool xotirani ushlab qoladi); shuningdek pool'dagi obyektga havolani saqlab qo'yish","`Get` nil qaytaradi","Pool goroutine-safe emas"],"a":1,"e":"Xavfsizlik nuqtasi: ma'lumot oqishi (bir foydalanuvchi javobi boshqasiga) — real incident turi. To'g'ri naqsh: `buf.Reset()` qaytarishdan oldin, hajm chegarasidan katta buferlarni umuman qaytarmaslik, va pool'dan olingan slice'ga tashqi havola qoldirmaslik. `sync.Pool` GC paytida tozalanadi — kesh emas, faqat allocation pressure'ni kamaytirish vositasi."},{"l":"S","t":"mcq","tp":"Memory gotcha","d":"go","id":30494,"n":"SN495","q":"Xotirada cheksiz o'sadigan kesh (`map[string]T`) qanday to'g'rilanadi?","o":["`GOGC` ni kamaytirish","Chegara qo'yish: LRU (`hashicorp/golang-lru`) yoki TTL bilan tozalanadigan kesh, element soni/bayt hajmi limiti va metrikada kuzatuv; chegarasiz map — GC uchun leak emas (havola bor) lekin amalda leak","`sync.Map` ishlatish","Kesh o'rniga global o'zgaruvchi"],"a":1,"e":"`sync.Map` konkurentlikni hal qiladi, o'sishni emas. Yana bir tuzoq: kalit sifatida katta string yoki struct ishlatish (masalan butun so'rov matni) — kardinallik portlaydi. Amaliy qoida: har keshga maksimal hajm, TTL va hit/miss/evict metrikalari majburiy."},{"l":"S","t":"code","tp":"Memory gotcha","d":"go","id":30495,"n":"SN496","q":"Bu kodda qanday xotira muammosi bor?","c":"func handler(w http.ResponseWriter, r *http.Request) {\n    body, _ := io.ReadAll(r.Body)\n    var req Request\n    json.Unmarshal(body, &req)\n    // ...\n}","o":["Muammo yo'q","Body hajmi cheklanmagan — katta payload bilan xotira to'ldiriladi (DoS); `http.MaxBytesReader(w, r.Body, 1<<20)` bilan cheklash va `json.NewDecoder` bilan oqimda o'qish kerak; bundan tashqari `Unmarshal` xatosi tekshirilmagan","`io.ReadAll` eskirgan","`json` sekin"],"a":1,"e":"Ikki alohida muammo: (1) hajm limiti yo'q — bitta so'rov bilan OOM qilish mumkin; (2) xato e'tiborsiz qoldirilgan — noto'g'ri JSON bilan `req` nol qiymatlar bilan qolib, biznes mantiqi jim noto'g'ri ishlaydi. Server tomonida `MaxBytesReader` + `ReadHeaderTimeout` standart himoya."},{"l":"J","t":"mcq","tp":"JOIN","d":"db","id":1,"n":2,"q":"Chap table'dagi <b>barcha</b> row'larni, o'ngda mos kelmasa ham, qaytaradigan JOIN?","o":["INNER JOIN","LEFT JOIN","RIGHT JOIN","CROSS JOIN"],"a":1,"e":"LEFT JOIN chap tomonning hamma row'ini qaytaradi; o'ngda mos yo'q bo'lsa o'ng column'lar NULL bo'ladi. INNER faqat mos kelganlarini, CROSS Dekart ko'paytmani beradi. Tipik tuzoq: LEFT JOINdan keyin WHERE da o'ng table column'ini filtrlash uni amalda INNER JOINga aylantiradi — shartni ON ga qo'yish kerak."},{"l":"J","t":"code","tp":"NULL","d":"db","id":2,"n":3,"q":"Natija nima bo'ladi?","c":"CREATE TABLE t(x int);\nINSERT INTO t VALUES (1),(NULL),(3);\n\nSELECT COUNT(*), COUNT(x), SUM(x), AVG(x) FROM t;","o":["3, 3, 4, 1.33","3, 2, 4, 2","2, 2, 4, 2","3, 2, NULL, NULL"],"a":1,"e":"COUNT(*) row'larni sanaydi (3). COUNT(x), SUM, AVG kabi aggregatlar NULLni e'tiborsiz qoldiradi: COUNT(x)=2, SUM=4, AVG=4/2=2. Intervyuda ko'p so'raladi: AVG NULLni 0 deb hisoblamaydi — kerak bo'lsa AVG(COALESCE(x,0))."},{"l":"J","t":"mcq","tp":"SQL","d":"db","id":3,"n":4,"q":"WHERE va HAVING farqi?","o":["Farqi yo'q","WHERE guruhlashdan oldin row'larni, HAVING guruhlashdan keyin guruhlarni filtrlaydi","HAVING faqat JOIN bilan ishlaydi","WHERE aggregat funksiyalar bilan ishlaydi, HAVING ishlamaydi"],"a":1,"e":"Mantiqiy tartib: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT. Shuning uchun WHERE ichida COUNT(*) yozib bo'lmaydi, HAVING da esa mumkin. Performance maslahati: aggregatsiz shartni HAVING emas WHERE ga qo'ying — kamroq row guruhlanadi."},{"l":"J","t":"sql","tp":"GROUP BY","d":"db","id":4,"n":5,"q":"<code>employees(id, name, department_id, salary)</code>. 5 tadan ko'p xodimi bor bo'limlarni va xodimlar sonini qaytaring.","m":"SELECT department_id, COUNT(*) AS cnt\nFROM employees\nGROUP BY department_id\nHAVING COUNT(*) > 5;","k":["GROUP BY","HAVING","COUNT"],"e":"Guruh bo'yicha shart — HAVING. Ko'p xato: WHERE COUNT(*) > 5 — bu xato beradi. Qo'shimcha: bo'lim nomi kerak bo'lsa departments bilan JOIN qilib, GROUP BY ga d.id, d.name qo'shiladi."},{"l":"J","t":"mcq","tp":"NULL","d":"db","id":6,"n":7,"q":"<code>SELECT NULL = NULL;</code> nima qaytaradi?","o":["TRUE","FALSE","NULL (unknown)","Xato"],"a":2,"e":"SQL uch qiymatli mantiqda ishlaydi: TRUE/FALSE/UNKNOWN. NULL bilan har qanday taqqoslash NULL beradi. Shuning uchun IS NULL / IS DISTINCT FROM ishlatiladi. WHERE faqat TRUE row'larni o'tkazadi — UNKNOWN tushib qoladi."},{"l":"J","t":"mcq","tp":"SQL","d":"db","id":8,"n":9,"q":"DELETE, TRUNCATE, DROP farqi bo'yicha qaysi to'g'ri?","o":["Uchalasi ham faqat ma'lumotni o'chiradi","DELETE row'larni WHERE bilan o'chiradi (trigger ishlaydi); TRUNCATE hamma row'ni tez o'chiradi, struktura qoladi; DROP table'ni butunlay o'chiradi","TRUNCATE table strukturasini o'chiradi","DROP ni rollback qilib bo'lmaydi, DELETE ni ham"],"a":1,"e":"DELETE qatorma-row, loglanadi, ROW triggerlar ishlaydi, sekin. TRUNCATE page'larni tashlaydi — tez, lekin kuchli lock oladi. DROP — table, index, constraint hammasi yo'q. Postgresda TRUNCATE va DROP ham transaction ichida rollback qilinadi (MySQLda DDL implicit commit)."},{"l":"J","t":"sql","tp":"Subquery","d":"db","id":9,"n":10,"q":"<code>employees(salary)</code> dan ikkinchi eng katta maoshni toping (takror maoshlar bo'lishi mumkin).","m":"SELECT MAX(salary) FROM employees\nWHERE salary < (SELECT MAX(salary) FROM employees);\n\n-- yoki\nSELECT DISTINCT salary FROM employees\nORDER BY salary DESC OFFSET 1 LIMIT 1;","k":["MAX|DENSE_RANK|OFFSET","DISTINCT|<|DENSE_RANK"],"e":"Klassik savol. DISTINCT'siz ORDER BY ... OFFSET 1 xato beradi agar top maosh ikki kishida bo'lsa. N-chi uchun eng umumiy yechim: DENSE_RANK() OVER (ORDER BY salary DESC) = N. Ikkinchi maosh bo'lmasa MAX variant NULL qaytaradi — bu odatda kerakli xulq."},{"l":"J","t":"code","tp":"NULL","d":"db","id":11,"n":12,"q":"PostgreSQLda natija tartibi qanday?","c":"-- names: 'Ali', NULL, 'Bek'\nSELECT name FROM users ORDER BY name;","o":["NULL, Ali, Bek","Ali, Bek, NULL","Ali, NULL, Bek","Xato: NULL tartiblanmaydi"],"a":1,"e":"Postgres NULLni eng katta qiymat deb hisoblaydi: ASC da oxirida, DESC da boshida. MySQL/SQLite aksincha (NULL eng kichik). Aniq boshqarish: ORDER BY name NULLS FIRST / NULLS LAST. Index ham shu tartibda bo'lishi kerak, aks holda index ishlatilmasligi mumkin."},{"l":"J","t":"mcq","tp":"SQL","d":"db","id":13,"n":14,"q":"UNION va UNION ALL farqi?","o":["UNION ALL dublikatlarni olib tashlaydi","UNION dublikatlarni olib tashlaydi (sort/hash qiladi), UNION ALL hammasini qaytaradi va tezroq","Ikkalasi ham bir xil","UNION faqat ikki table bilan ishlaydi"],"a":1,"e":"UNION = UNION ALL + DISTINCT, ya'ni qo'shimcha sort yoki hash. Dublikat bo'lmasligini bilsangiz (masalan turli sanalar oralig'i) doim UNION ALL — arzonroq."},{"l":"M","t":"code","tp":"Window","d":"db","id":16,"n":17,"q":"<code>salary</code>: 100, 100, 90, 80. Natija column'lari (rn, rk, drk)?","c":"SELECT salary,\n  ROW_NUMBER() OVER (ORDER BY salary DESC) rn,\n  RANK()       OVER (ORDER BY salary DESC) rk,\n  DENSE_RANK() OVER (ORDER BY salary DESC) drk\nFROM emp;","o":["rn:1,2,3,4 · rk:1,1,3,4 · drk:1,1,2,3","rn:
