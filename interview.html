h — O(n log n)","Binary search — O(log n)"],"a":1,"e":"Oyna patterni belgilari: uzluksiz (contiguous) bo'lak, 'eng uzun/eng qisqa', va shart oyna kengayganda buziladi. map[byte]int oxirgi indeksni saqlaydi. Alifbo cheklangan bo'lsa memory O(min(n, alifbo)).","src":"https://neetcode.io/practice/practice/neetcode150"},{"l":"M","t":"mcq","tp":"Intervals","d":"alg","id":4003,"n":"A4","q":"Oraliqlarni birlashtirish (merge intervals) algoritmi va murakkabligi?","o":["O(n) — saralashsiz ham mumkin","Boshlanish nuqtasi bo'yicha saralash, keyin ketma-ket yurib kesishganlarini birlashtirish: O(n log n) vaqt (saralash hisobiga), O(n) natija uchun","O(n²) — har juftni solishtirish shart","O(log n)"],"a":1,"e":"Kesishish sharti: keyingi.start <= joriy.end. Bu pattern kalendar/booking masalalarida qayta ishlatiladi: 'yig'ilish xonalari soni' (min-heap yoki sweep line bilan), 'yangi oraliq qo'shish'. Intervyuda chegara holatlari muhim: teginib turgan oraliqlar ([1,2] va [2,3]) birlashadimi — savol berish kerak.","src":"https://neetcode.io/practice/practice/neetcode150"},{"l":"M","t":"mcq","tp":"Heap","d":"alg","id":4004,"n":"A5","q":"n elementdan eng ko'p uchraydigan K ta elementni topish. Eng yaxshi yondashuv?","o":["Hammasini saralash — O(n log n) va boshqa yo'l yo'q","Chastotalarni sanab, o'lchami K bo'lgan min-heap bilan O(n log K); yoki bucket sort bilan O(n) — chastota indeks sifatida ishlatiladi","Binary search bilan O(log n)","Faqat brute force"],"a":1,"e":"K kichik bo'lganda heap yechimi to'liq saralashdan yaxshi. Bucket sort varianti: chastota 1..n oralig'ida bo'lgani uchun har chastota uchun ro'yxat tutib, oxiridan K ta olinadi — O(n). Intervyuda ikkala yechimni aytib, trade-off'ni tushuntirish yaxshi.","src":"https://neetcode.io/practice/practice/neetcode150"},{"l":"M","t":"mcq","tp":"Graphs","d":"alg","id":4005,"n":"A6","q":"Og'irliksiz grafda eng qisqa yo'lni topish uchun qaysi algoritm?","o":["DFS — u ham eng qisqa yo'lni beradi","BFS — qatlamma-qatlam yurgani uchun birinchi yetib borish eng qisqa yo'l; O(V+E)","Dijkstra — faqat shu holatda ishlaydi","Binary search"],"a":1,"e":"DFS yo'l topadi, lekin eng qisqasini kafolatlamaydi. Og'irliklar bo'lsa: manfiy bo'lmasa — Dijkstra (O((V+E) log V)), manfiy og'irlik bo'lsa — Bellman-Ford (O(V·E), manfiy sikl ham aniqlaydi). Matritsadagi masalalar (orollar, eng qisqa yo'l) — grafning yashirin ko'rinishi.","src":"https://neetcode.io/practice/practice/neetcode150"},{"l":"M","t":"code","tp":"Binary search","d":"alg","id":4006,"n":"A7","q":"Bu binary search'da qanday nozik xatolar bor?","c":"lo, hi = 0, len(a)\nwhile lo < hi:\n    mid = (lo + hi) / 2      # 1\n    if a[mid] == target: return mid\n    elif a[mid] < target: lo = mid    # 2\n    else: hi = mid\nreturn -1","o":["Xato yo'q","(1) butun bo'lmagan bo'lish — mid = (lo + hi) // 2 bo'lishi kerak (ba'zi tillarda lo + (hi-lo)//2, overflow uchun); (2) lo = mid cheksiz siklga olib keladi — lo = mid + 1 bo'lishi kerak","Faqat return -1 noto'g'ri","while sharti > bo'lishi kerak"],"a":1,"e":"lo = mid bo'lsa, lo va hi qo'shni bo'lganda mid doim lo ga teng bo'lib, sikl to'xtamaydi. Chegara masalalari (birinchi/oxirgi uchrash, lower_bound) uchun bitta shablonni yodlab olish va unga sodiq qolish eng ishonchli yo'l. Java/Go'da (lo+hi)/2 katta massivda overflow berishi mumkin — mashhur JDK bug'i.","src":"https://neetcode.io/practice/practice/blind75"},{"l":"M","t":"mcq","tp":"DP","d":"alg","id":4007,"n":"A8","q":"Zinapoyaga chiqish (har qadamda 1 yoki 2 pog'ona) — n pog'ona uchun necha xil yo'l bor va qanday hisoblanadi?","o":["n² — ichma-ich sikl kerak","Fibonachchi rekurrensiyasi f(n) = f(n-1) + f(n-2); memoizatsiya yoki pastdan yuqoriga: O(n) vaqt, ikki o'zgaruvchi bilan O(1) memory","2^n — hamma variantni sanash shart","n log n"],"a":1,"e":"DP belgilari: optimal substructure va qayta-qayta takrorlanadigan qism masalalar. Naiv rekursiya O(2^n) — memoizatsiya uni O(n) ga tushiradi. Ko'p DP masalasi shu bosqichlar bilan yechiladi: rekursiya → memoizatsiya (top-down) → table (bottom-up) → memory'ni siqish.","src":"https://neetcode.io/practice/practice/blind75"},{"l":"S","t":"mcq","tp":"Design","d":"alg","id":4008,"n":"A9","q":"LRU cache'ni O(1) get va put bilan qanday quraysiz?","o":["Faqat hash map bilan","Hash map (key → tugun) + ikki tomonlama bog'langan ro'yxat (eng yangi boshda): get — tugunni boshga ko'chirish, put — to'lgan bo'lsa oxirgisini o'chirish; ikkalasi ham O(1)","Massiv va saralash bilan","Min-heap bilan"],"a":1,"e":"Nega aynan doubly linked list: tugunni O(1) da uzib olish uchun oldingi element kerak. Ko'p tillarda tayyor bor (Java LinkedHashMap, Go container/list). Kengaytma savollari: thread-safe qilish (mutex yoki shardlangan lock), TTL qo'shish, LFU bilan farqi.","src":"https://neetcode.io/practice/practice/neetcode150"},{"l":"S","t":"mcq","tp":"Sorting","d":"alg","id":4009,"n":"A10","q":"Quicksort, mergesort va heapsort haqida qaysi to'g'ri?","o":["Uchalasi ham har doim O(n log n)","Quicksort — o'rtacha O(n log n), eng yomon O(n²) (yomon pivot), memory O(log n), joyida; mergesort — kafolatlangan O(n log n), barqaror (stable), O(n) qo'shimcha memory; heapsort — kafolatlangan O(n log n), joyida, lekin barqaror emas","Mergesort eng tez","Heapsort barqaror"],"a":1,"e":"Amalda: ko'p kutubxonalar gibrid ishlatadi — introsort (quicksort + chuqurlik oshsa heapsort), Timsort (mergesort + insertion, barqaror). Barqarorlik muhim: ikki mezon bo'yicha ketma-ket saralaganda. Tashqi (diskdagi) saralash uchun — merge asosidagi yondashuv."},{"l":"S","t":"open","tp":"Approach","d":"alg","id":4010,"n":"A11","q":"Intervyuda ko'rmagan algoritm masalangizni qanday yechasiz (qadamlar)?","m":["Savolni aniqlashtirish: kirish hajmi, tiplar, chegara holatlari, takrorlanuvchi elementlar, memory chekloviu","Misolni qo'lda ishlab ko'rish — namuna topish","Avval brute force yechimni aytish va murakkabligini baholash — keyin optimallashtirish (hash, ikki ko'rsatkich, saralash, oyna, DP)","Kod yozishdan oldin rejani ovoz chiqarib aytish va kelishib olish","Kodni yozib, misol bilan qatorma-row tekshirish; chegara holatlari (bo'sh, bitta element, toshib ketish)","Vaqt va memory murakkabligini aytish, yaxshilash yo'lini taklif qilish"],"e":"Baholanadigan narsa — jim o'tirib to'g'ri javob topish emas, fikrlashni ko'rsatish. Tiqilib qolsangiz: ovoz chiqarib nimani sinayotganingizni ayting va yo'naltiruvchi savol bering — bu minus emas.","src":"https://www.techinterviewhandbook.org/coding-interview-prep/"},{"l":"J","t":"mcq","tp":"Arrays","d":"alg","id":13022,"n":"K23","q":"Massiv (array) va bog'langan ro'yxat (linked list) farqi?","o":["Bir xil, faqat sintaksis boshqa","Massiv: indeks bo'yicha O(1), xotirada ketma-ket (kesh uchun yaxshi), o'rtaga qo'shish O(n). Linked list: boshiga qo'shish O(1), indeks bo'yicha kirish O(n), har element uchun qo'shimcha pointer va kesh uchun yomon","Linked list har doim tezroq","Massivda qidiruv O(1)"],"a":1,"e":"Amalda zamonaviy protsessorlarda kesh lokalligi tufayli dinamik massiv (slice, vector) ko'p holatda linked list'dan tezroq — hatto o'rtaga qo'shishda ham (ko'chirish arzon). Linked list mantiqan kerak bo'ladigan joylar: LRU cache (doubly linked), navbat implementatsiyasi, tez-tez splice qilinadigan ro'yxatlar."},{"l":"M","t":"mcq","tp":"Hash tables","d":"alg","id":13023,"n":"K24","q":"Hash map ichkarida qanday ishlaydi?","o":["Saralangan daraxt sifatida","Kalitdan hash hisoblanadi → bucket indeksi; to'qnashuvlar zanjir (chaining) yoki ochiq adreslash bilan hal qilinadi; elementlar ko'payib load factor oshsa jadval kattalashtirilib qayta joylashtiriladi (rehash). O'rtacha O(1), eng yomon holatda O(n)","Kalitlar tartibda saqlanadi","Hash funksiya har doim unikal qiymat beradi"],"a":1,"e":"Intervyuda davomi: nega amortized O(1) (rehash kamdan-kam va tarqatilgan), yomon hash yoki hash flooding hujumi natijasida O(n) ga tushishi (shuning uchun Go va boshqa tillarda hash urug'i tasodifiy), va kalit o'zgarmas bo'lishi shartligi. Go map'da tartib kafolatlanmaydi — bu ataylab."},{"l":"J","t":"mcq","tp":"Heap","d":"alg","id":13024,"n":"K25","q":"Stack va queue qanday tanlanadi?","o":["Bir xil struktura","Stack — LIFO (oxirgi kirgan birinchi chiqadi): rekursiya, orqaga qaytish (undo), qavslarni tekshirish, DFS. Queue — FIFO: navbat bilan ishlov, BFS, buferlash. Priority queue (heap) — eng muhim element birinchi","Queue LIFO ishlaydi","Stack faqat xotira uchun"],"a":1,"e":"Amaliy misollar: monotonic stack ('keyingi kattaroq element' masalalari), deque (ikki tomonlama navbat — sliding window maksimumi), min-heap (top-K, Dijkstra, scheduler). Go'da: slice bilan stack/queue, container/heap bilan priority queue."},{"l":"M","t":"mcq","tp":"Approach","d":"alg","id":13025,"n":"K26","q":"Big-O bo'yicha qaysi qator to'g'ri?","o":["Hash map qidiruvi O(log n), binary search O(1)","Hash map o'rtacha O(1); saralangan massivda binary search O(log n); saralash O(n log n); ichma-ich ikki sikl O(n²); balanslangan daraxtda qidiruv/qo'shish O(log n)","Saralash har doim O(n)","Binary search saralanmagan massivda ham ishlaydi"],"a":1,"e":"Intervyuda faqat vaqt emas, xotira murakkabligini ham ayting. Yana: Big-O konstantani yashiradi — kichik n da O(n²) yechim O(n log n) dan tez bo'lishi mumkin; amalda kesh lokalligi ham muhim. 'Amortized' (dinamik massivga qo'shish) va 'eng yomon holat' farqini bilish ham kutiladi."},{"l":"M","t":"mcq","tp":"Approach","d":"alg","id":13026,"n":"K27","q":"Rekursiya va iteratsiya tanlovida nimaga e'tibor berasiz?","o":["Rekursiya har doim chiroyliroq, shuning uchun afzal","Rekursiya daraxt/graf va bo'lib-hal qilish masalalarida tabiiy, lekin chuqurlik katta bo'lsa stack overflow xavfi bor. Iteratsiya (o'z stack'ingiz bilan) xotirani boshqarish imkonini beradi; ba'zi tillarda tail call optimizatsiyasi yo'q (Go'da ham yo'q)","Rekursiya har doim tezroq","Iteratsiya faqat sikl uchun"],"a":1,"e":"Go'da goroutine stack'i dinamik o'sadi (1 GB gacha default limit), shuning uchun panic 'stack overflow' bilan tugaydi. Chuqur daraxt yoki foydalanuvchi bergan ma'lumot bo'yicha rekursiya — DoS vektori: chuqurlikni cheklang yoki iterativ yozing."},{"l":"S","t":"mcq","tp":"Graphs","d":"alg","id":13027,"n":"K28","q":"Binary tree, BST, balanslangan daraxt va B-tree farqi?","o":["Hammasi bir xil","Binary tree — har tugunda 2 tagacha bola. BST — chapda kichik, o'ngda katta (qidiruv O(h)), lekin tartiblangan ma'lumot kiritilsa ro'yxatga aylanib O(n) bo'ladi. AVL/Red-Black — balanslangan, O(log n) kafolati. B-tree — bitta tugunda ko'p kalit: disk/sahifa o'qishni kamaytiradi, shuning uchun DB indekslarida ishlatiladi","B-tree faqat xotirada ishlaydi","BST har doim balanslangan"],"a":1,"e":"Nima uchun DB'da B-tree (B+tree): disk I/O sahifa bilan o'lchanadi, keng tugun daraxt balandligini keskin kamaytiradi (milliardlab qator uchun 3–4 daraja). Xotiradagi indekslar uchun esa balanslangan ikkilik daraxt yoki skip list (Redis ZSET) ham yetarli."},{"l":"S","t":"mcq","tp":"Design","d":"alg","id":30136,"n":"SN137","q":"LRU kesh O(1) get/put bilan qanday tuziladi?","o":["Faqat hash map","Hash map (kalit → node) + ikki tomonlama bog'langan ro'yxat (foydalanish tartibi): get'da node boshga ko'chiriladi, to'lganda oxirgisi o'chiriladi","Saralangan massiv","Heap"],"a":1,"e":"Ro'yxat O(1) ko'chirish va o'chirish beradi (node havolasi map'da), map O(1) qidiruv. Go'da `container/list` bilan yoziladi. Amaliy qo'shimchalar: konkurent kesh uchun shardlangan qulf (yoki `sync.Map` + shard), va real tizimlarda LRU o'rniga LRU-K/TinyLFU — bir martalik skan keshni yuvib ketmasligi uchun."},{"l":"S","t":"mcq","tp":"Design","d":"alg","id":30137,"n":"SN138","q":"Oqimdagi 'top-K eng ko'p uchraydigan element'ni cheklangan xotirada qanday topamiz?","o":["Hammasini map'ga yig'ib saralash","Count-Min Sketch (yoki Space-Saving/Misra-Gries) bilan taxminiy sanoq + kichik min-heap top-K uchun — xotira O(K), aniqlik ma'lum xato chegarasi ichida","Bloom filter","Binary search"],"a":1,"e":"Aniq sanoq uchun barcha unikal element kerak (millionlab kalitda xotira yetmaydi). Count-Min Sketch bir necha hash qatori bilan sanoqni yuqoridan cheklab baholaydi (overestimate, underestimate emas), heap esa eng kattalarini ushlaydi. Amaliy misol: Redis `TOPK` (RedisBloom), yoki trending hashtag hisoblash."},{"l":"S","t":"mcq","tp":"Design","d":"alg","id":30138,"n":"SN139","q":"1 mlrd URL ichida 'bu URL avval ko'rilganmi?' savoliga tez javob kerak. Xotira kam.","o":["Hash set (aniq, lekin har URL uchun 50+ bayt)","Bloom filter: ~10 bit/element (1 mlrd ≈ 1.2 GB bit = ~150 MB), false positive bor, false negative yo'q","Saralangan fayl va binary search har so'rovda","Trie"],"a":1,"e":"Aniq hash set 1 mlrd URL uchun o'n gigabaytlarga chiqadi. Bloom filter 1% false positive uchun ~10 bit/element sarflaydi — ya'ni ~150 MB. 'Ehtimol ko'rilgan' javobida aniq tekshiruv (DB/KV) qilinadi, 'ko'rilmagan' esa 100% ishonchli. Element o'chirish qo'llanmaydi — buning uchun counting bloom yoki cuckoo filter."},{"l":"St","t":"mcq","tp":"Design","d":"alg","id":30139,"n":"SN140","q":"Sliding window rate limiter'ni kam xotirada qanday aniq qilamiz?","o":["Har so'rov timestamp'ini ro'yxatda saqlash (aniq, lekin xotira O(N))","Ikki oyna interpolatsiyasi: joriy va oldingi fixed window sanoqlari bilan taxminiy sliding qiymat — O(1) xotira, kichik xato; yoki token bucket bilan tekis cheklov","Bloom filter","Heap"],"a":1,"e":"Sliding log aniq lekin har kalit uchun timestamp ro'yxati (yuqori RPS'da qimmat, Redis'da `ZREMRANGEBYSCORE` bilan tozalash kerak). Interpolatsiyalangan variant: `prev_count × (oyna qolgan ulushi) + cur_count` — amalda ko'p tizimlar (Cloudflare) shuni ishlatadi. Token bucket esa burst siyosatini tabiiy ifodalaydi."},{"l":"S","t":"mcq","tp":"Approach","d":"alg","id":30185,"n":"SN186","q":"Amortizatsiyalangan murakkablik nima? Dinamik massivga `append` misolida.","o":["O'rtacha holat murakkabligi (average case)","N ta operatsiyaning umumiy narxini N ga bo'lish: har `append` O(1) amortizatsiyalangan, chunki cap tugaganda O(n) ko'chirish bo'ladi, lekin u har 2x o'sishda bir marta — jami O(n) ish N operatsiyaga taqsimlanadi","Eng yomon holat O(1)","Tasodifiy ma'lumotdagi tezlik"],"a":1,"e":"Average case ma'lumot taqsimotiga tayanadi, amortizatsiya esa hech qanday ehtimollik talab qilmaydi — bu kafolat. Muhim amaliy natija: real-time tizimda amortizatsiya yetmaydi, chunki bitta operatsiya O(n) bo'lib latency spike beradi (shu sabab GC va rehash pauzalari). Ikki barobar o'sish siyosati aynan shu amortizatsiyani ta'minlaydi; 1.25x o'sish xotirani tejaydi, lekin ko'chirishlar ko'payadi."},{"l":"S","t":"mcq","tp":"Hash tables","d":"alg","id":30186,"n":"SN187","q":"Hash jadvalining eng yomon holati O(n) bo'lishi qanday hujumga aylanadi?","o":["Hujum bo'lolmaydi","Hash collision DoS: hujumchi bir xil bucket'ga tushadigan kalitlar yuboradi (JSON kalitlari, HTTP parametrlari) va har operatsiya O(n) bo'lib CPU tugaydi; himoya — tasodifiy seed bilan hash (Go map shunday qiladi) yoki SipHash","Faqat xotira oshadi","Faqat eski tillarda"],"a":1,"e":"2011-2012 yillarda PHP/Java/Python veb-freymvorklari shu bilan yiqitilgan. Go map har jarayonda tasodifiy seed ishlatadi, shuning uchun kalitlarni oldindan tanlab bo'lmaydi (shu sababdan map iteratsiya tartibi ham har safar boshqa). Qo'shimcha himoya — kirish o'lchamini cheklash (parametrlar soni, JSON kalitlari soni)."},{"l":"S","t":"mcq","tp":"Hash tables","d":"alg","id":30187,"n":"SN188","q":"Open addressing (linear probing) va chaining farqi amalda nimada?","o":["Faqat kod uzunligi","Chaining: har bucket'da ro'yxat — yuqori load factor'da ham ishlaydi, lekin pointer sakrashlari (kesh miss); open addressing: elementlar massivda ketma-ket — kesh uchun juda yaxshi, lekin load factor ~0.7 dan oshsa clustering va o'chirish murakkab (tombstone)","Chaining har doim tezroq","Open addressing kolliziyasiz"],"a":1,"e":"Zamonaviy implementatsiyalar (Go map, Swiss table, abseil `flat_hash_map`) kesh lokalligi uchun ochiq adreslash yoki bucket ichida bir necha slot ishlatadi — CPU'da kesh miss narxi hash hisoblashdan qimmatroq. Bu 'nazariy bir xil O(1)' bo'lsa ham amalda 2-5x farq beradigan klassik misol."},{"l":"S","t":"mcq","tp":"Sorting","d":"alg","id":30188,"n":"SN189","q":"Barqaror (stable) saralash qachon majburiy?","o":["Har doim","Ko'p kalit bo'yicha ketma-ket saralaganda (avval ism, keyin yosh — teng yoshlarda ism tartibi saqlanishi kerak) va pagination/UI'da barqaror tartib talab qilinganda; `sort.Slice` barqaror emas, `sort.SliceStable` barqaror","Faqat kichik massivda","Faqat butun sonlarda"],"a":1,"e":"Go'da `sort.Slice` pdqsort (barqaror emas) — teng elementlar tartibi kafolatlanmaydi va har ishga tushirishda farq qilishi mumkin. Barqarorlik narxi: qo'shimcha xotira yoki sekinroq ishlash. DB'da ham xuddi shu tamoyil: `ORDER BY` unique bo'lmasa tartib barqaror emas, tie-breaker kerak."},{"l":"St","t":"mcq","tp":"Sorting","d":"alg","id":30189,"n":"SN190","q":"100 GB faylni 8 GB RAM bilan saralash kerak. Qanday?","o":["Hammasini xotiraga yuklab `sort`","External merge sort: fayl xotiraga sig'adigan bo'laklarga bo'linadi, har biri saralanib diskka yoziladi (run), keyin k-way merge (min-heap bilan) bitta o'tishda birlashtiriladi — I/O O(n log_k n) blokda","Quicksort diskda","Faqat ClickHouse ishlatish"],"a":1,"e":"Bu PostgreSQL `work_mem` yetmaganda qiladigan ish (disk-based sort) va MapReduce shuffle bosqichining asosi. Amaliy detallar: blok kattaligi ketma-ket o'qishni maksimallashtirish uchun tanlanadi, k (bir vaqtda ochiladigan run soni) fayl deskriptorlari va buferga bog'liq, va siqish I/O ni kamaytiradi."},{"l":"S","t":"mcq","tp":"Heap","d":"alg","id":30190,"n":"SN191","q":"N elementdan eng katta K tasini topish: qaysi yondashuv samarali?","o":["Hammasini saralash — O(n log n)","Hajmi K bo'lgan min-heap bilan bitta o'tish — O(n log k) va xotira O(k); oqim (stream) uchun ham ishlaydi. Quickselect esa O(n) o'rtacha, lekin butun massiv xotirada bo'lishi kerak","Har doim quickselect","Bubble sort K marta"],"a":1,"e":"K << N bo'lganda heap yondashuvi aniq g'olib, ayniqsa ma'lumot oqimda kelsa (barchasini saqlash imkonsiz). Quickselect (`nth_element`) bir martalik in-memory holat uchun eng tez. Taqsimlangan variantda: har node o'zining top-K sini beradi, keyin natijalar birlashtiriladi — bu 'top-K exact' uchun to'g'ri, chunki K dan tashqaridagi element global top-K ga kira olmaydi."},{"l":"S","t":"mcq","tp":"Graphs","d":"alg","id":30191,"n":"SN192","q":"BFS va Dijkstra qachon ekvivalent, qachon Dijkstra shart?","o":["Har doim bir xil","Barcha qirralar vazni teng (yoki 1) bo'lsa BFS eng qisqa yo'lni beradi — O(V+E); turli musbat vaznlarda Dijkstra (priority queue) kerak — O(E log V). Manfiy vazn bo'lsa Bellman-Ford yoki SPFA","BFS har doim tezroq va to'g'ri","Dijkstra manfiy vaznda ham ishlaydi"],"a":1,"e":"Dijkstra manfiy qirrada buziladi, chunki u 'bir marta yopilgan node qayta yaxshilanmaydi' taxminiga tayanadi. Amaliy misollar: sotsial graf masofasi — BFS; yo'l/latency marshruti — Dijkstra; valyuta arbitraji (manfiy log vazn) — Bellman-Ford bilan sikl aniqlash. 0-1 vaznlarda esa deque bilan 0-1 BFS O(V+E) beradi."},{"l":"S","t":"mcq","tp":"Graphs","d":"alg","id":30192,"n":"SN193","q":"Topologik saralash qanday amaliy muammoni yechadi va qachon imkonsiz?","o":["Faqat o'quv masalasi","Bog'liqliklarni tartibga solish: build tizimi, migratsiya tartibi, task scheduler, paket o'rnatish. Sikl bo'lsa imkonsiz — Kahn algoritmi qolgan tugunlar orqali siklni aniqlaydi (aylanma bog'liqlik xatosi)","Har doim mumkin","Faqat daraxtda ishlaydi"],"a":1,"e":"Kahn: in-degree 0 bo'lgan tugunlardan boshlab navbat bilan olib boriladi; oxirida qolgan tugunlar sikl tarkibida. DFS varianti orqa qirra (back edge) bilan siklni topadi. Mikroservis arxitekturasida ham shu vosita: bog'liqlik grafida sikl bo'lsa deploy tartibi aniqlanmaydi — bu dizayn xatosi belgisi."},{"l":"St","t":"mcq","tp":"Graphs","d":"alg","id":30193,"n":"SN194","q":"Union-Find (DSU) qanday muammolarda eng mos?","o":["Eng qisqa yo'l","Dinamik ulanish: komponentlarni birlashtirish va 'bir komponentdami?' savoli — path compression + union by rank bilan deyarli O(1) (amortizatsiyalangan α(n)); misollar: Kruskal MST, dedupe/klasterlash, akkauntlarni birlashtirish (identity resolution)","Saralash","Hash jadval o'rniga"],"a":1,"e":"DSU faqat birlashtirishga imkon beradi — ajratish (undo) qo'llanmaydi, buning uchun offline dinamik algoritmlar kerak. Amaliy backend misoli: bir xil foydalanuvchini turli signal bo'yicha (email, qurilma, karta) bitta identitetga yig'ish — bu tabiiy union-find masalasi va uni DB'da `root_id` bilan saqlash mumkin."},{"l":"S","t":"mcq","tp":"DP","d":"alg","id":30194,"n":"SN195","q":"Masala DP bilan yechiladimi — qanday aniqlanadi?","o":["Har optimizatsiya masalasi DP","Ikki shart: optimal substructure (butun yechim qism yechimlardan quriladi) va overlapping subproblems (bir xil qism yechim qayta hisoblanadi). Ikkinchisi bo'lmasa — divide and conquer; greedy to'g'ri bo'lsa (exchange argument bilan isbot) DP keraksiz","Faqat massivlarda","Faqat rekursiv kodda"],"a":1,"e":"Amaliy tartib: rekursiv formulani yozish (holat va o'tish), keyin memoizatsiya (top-down), keyin kerak bo'lsa tabulyatsiya va xotirani qisqartirish (faqat oxirgi qator). Intervyu signali — holatni to'g'ri ta'riflash: 'dp[i][j] = ... ma'nosi' aniq aytilsa, qolgani mexanik."},{"l":"S","t":"mcq","tp":"Binary search","d":"alg","id":30195,"n":"SN196","q":"'Javob bo'yicha binary search' (parametric search) qanday ishlaydi?","o":["Faqat saralangan massivda qidirish","Monoton predikat ustida: `can(x)` rost bo'lsa barcha kattalarida ham rost bo'lsa — minimal x ni log(diapazon) qadamda topamiz. Misollar: minimal sig'im/tezlik, deadline'ga sig'adigan worker soni, rate limit sozlash","Faqat butun sonlarda","Har doim O(1)"],"a":1,"e":"Kalit shart — monotonlik; uni isbotlash yoki kamida aniq aytish kerak. Backend misoli: 'N ta faylni K worker bilan T vaqtda ko'chirish mumkinmi?' — `can(T)` monoton, demak minimal T binary search bilan topiladi. Capacity planning masalalarida ham shu naqsh ishlatiladi."},{"l":"S","t":"mcq","tp":"Intervals","d":"alg","id":30196,"n":"SN197","q":"Ko'p intervalni birlashtirish (merge intervals) va 'eng ko'p bir vaqtda faol' masalasi qanday yechiladi?","o":["Har juftlikni solishtirish — O(n²)","Boshlanish bo'yicha saralab bitta o'tish (merge) — O(n log n); 'bir vaqtda faol maksimum' uchun sweep line: boshlanishga +1, tugashga -1 qo'yib saralangan hodisalar bo'yicha prefiks maksimumi","Heap majburiy","DP kerak"],"a":1,"e":"Sweep line amaliyotda ko'p uchraydi: bir vaqtdagi maksimal ulanish soni, xona/resurs bandligi, rate limit oynasi, monitoringda concurrency hisoblash. Nozik joyi — teng koordinatalarda tartib: tugash boshlanishdan oldin qo'llanadimi (yopiq/ochiq interval semantikasi) — buni aniq belgilash kerak, aks holda off-by-one bug chiqadi."},{"l":"S","t":"mcq","tp":"Linked list","d":"alg","id":30197,"n":"SN198","q":"Amaliyotda bog'langan ro'yxat massivdan qachon afzal?","o":["Deyarli har doim","Kamdan-kam: kesh lokalligi yo'q (har node alohida joyda) — iteratsiya massivdan ancha sekin. Afzal holatlar: o'rtaga O(1) qo'shish/o'chirish node havolasi bo'lganda (LRU ro'yxati), yoki ko'chirish qimmat bo'lgan katta elementlar","Xotira kam ishlatadi","Saralash tezroq"],"a":1,"e":"Nazariy murakkablik teng bo'lsa ham amalda massiv/slice g'olib chiqadi, chunki CPU ketma-ket xotirani oldindan o'qiydi (prefetch). Shuning uchun LRU keshda ham ro'yxat faqat tartib uchun, qidiruv map bilan. Bu 'big-O hamma narsani aytmaydi' tamoyilining eng aniq misoli."},{"l":"St","t":"mcq","tp":"Approach","d":"alg","id":30198,"n":"SN199","q":"Ikkita katta fayl (har biri 50 GB) ichida umumiy satrlarni topish kerak. Xotira 4 GB.","o":["Ikkisini xotiraga yuklash","Hash bo'yicha shardlash: har satrni `hash(line) % K` bilan K ta bo'lakka yozib chiqish (ikki fayl uchun ham) — bir xil satr bir xil bo'lakka tushadi, keyin har juft bo'lakni xotirada set bilan solishtirish","Faqat `sort | uniq -d`","Bloom filter yetarli (aniq natija uchun)"],"a":1,"e":"Bu MapReduce join'ning mohiyati: 'katta masalani hash bo'yicha mustaqil bo'laklarga ajratish'. Alternativa — ikkisini external sort qilib merge (`sort | comm`), I/O ko'proq lekin xotira kam. Bloom filter tez oldindan filtrlash uchun yaxshi (false positive bor), shuning uchun aniq natija uchun keyin tekshirish kerak."},{"l":"S","t":"mcq","tp":"Design","d":"alg","id":30199,"n":"SN200","q":"Trie (prefix tree) hash jadvaldan qachon afzal?","o":["Har doim tezroq","Prefiks bo'yicha so'rovlar kerak bo'lganda (autocomplete, IP routing/longest prefix match, lug'at tekshiruvi) va umumiy prefikslar xotirani tejaganda; aniq kalit qidiruvida hash jadval odatda tezroq","Xotira kam ishlatadi","Kolliziyasiz bo'lgani uchun"],"a":1,"e":"Trie qidiruvi O(kalit uzunligi) va hash hisoblashni talab qilmaydi, lekin node'lar tarqoq joylashgani uchun kesh miss ko'p. Amaliy optimizatsiyalar: radix/patricia tree (bir bolali zanjirlarni siqish), DAWG (qo'shimcha siqish), yoki oddiygina prefiks→natija xaritasi (oldindan hisoblangan) — ko'p tizimda eng arzon yechim shu."},{"l":"S","t":"mcq","tp":"Bits","d":"alg","id":30253,"n":"SN254","q":"`x & (x-1)` nima qiladi va qayerda ishlatiladi?","o":["Ikkiga bo'ladi","Eng o'ngdagi 1 bitni o'chiradi — shuning uchun `x & (x-1) == 0` tekshiruvi 'ikkining darajasimi' degan savolga javob beradi, va bit sanash (popcount) tsikli shu bilan qisqartiriladi","Belgini o'zgartiradi","Har doim 0 beradi"],"a":1,"e":"Amaliy backend qo'llanishi: hash jadval va bufer o'lchamlari ikkining darajasi qilinadi, shunda `hash % n` o'rniga `hash & (n-1)` ishlatiladi (bo'lish operatsiyasi bit AND'dan ancha sekin — Kafka partitioner, Go map bucket'lari shunga tayanadi). Popcount esa bitmap indekslar va HyperLogLog hisob-kitobida ishlatiladi."},{"l":"S","t":"mcq","tp":"Bits","d":"alg","id":30254,"n":"SN255","q":"Bitmap (bitset) qachon eng samarali ma'lumot strukturasi?","o":["Har doim set o'rniga","Zich (dense) butun son ID'lari to'plami uchun: 1 mln foydalanuvchi faolligi 125 KB, AND/OR/XOR bilan to'plam operatsiyalari juda tez (Redis `SETBIT`/`BITCOUNT`/`BITOP`); siyrak (sparse) ma'lumotda esa xotira bekorga ketadi — roaring bitmap yoki set afzal","Faqat matnda","Faqat C'da"],"a":1,"e":"Tipik misollar: kunlik faol foydalanuvchi (`SETBIT dau:2026-09-29 <user_id> 1`), feature flag ro'yxatlari, ruxsat maskalari, va analitik tizimlarda filtrlar (ClickHouse/Elasticsearch ichkarida roaring bitmap ishlatadi). Siyrak ID'larda (UUID) bitmap yaramaydi."},{"l":"S","t":"mcq","tp":"Numbers","d":"alg","id":30255,"n":"SN256","q":"`0.1 + 0.2 == 0.3` nega false?","o":["Til bug'i","IEEE 754 ikkilik kasr: 0.1 va 0.2 ikkilik sanoq sistemasida aniq ifodalanmaydi — yig'indi 0.30000000000000004; solishtirish epsilon bilan yoki umuman butun son (minor unit) / decimal turlari bilan qilinadi","Yaxlitlash xatosi faqat katta sonlarda","Faqat float32'da"],"a":1,"e":"Backend uchun amaliy xulosa: pul, soliq, kvota kabi qiymatlar `numeric`/`decimal` yoki eng kichik birlikdagi butun son bilan saqlanadi. Float faqat ilmiy/o'lchov ma'lumotlari uchun. Qo'shimcha tuzoqlar: float yig'indisi tartibga bog'liq (assotsiativ emas), `NaN != NaN`, va katta butun sonlar float'da aniqlikni yo'qotadi (2^53)."},{"l":"S","t":"mcq","tp":"Encoding","d":"alg","id":30256,"n":"SN257","q":"Go'da `len(\"salom\")` va foydalanuvchi ko'rgan belgi soni nega farq qiladi?","o":["Farq qilmaydi","`len` baytlar sonini beradi (UTF-8), belgi (rune) soni `utf8.RuneCountInString`; bundan tashqari grafema klasterlari (emoji, kombinatsiyalangan harflar) bir necha rune bo'lishi mumkin — foydalanuvchi ko'rgan 'belgi' uchun grafema hisoblash kerak","Go Unicode'ni qo'llamaydi","Faqat emoji'da"],"a":1,"e":"Amaliy natijalar: DB'da `VARCHAR(50)` bayt yoki belgi cheklovi ekanini bilish kerak (PostgreSQL'da belgi, MySQL'da kodlashga bog'liq); string'ni indeks bo'yicha kesish UTF-8 ketma-ketligini buzishi mumkin; validatsiyada 'ism 50 belgidan oshmasin' talabi rune bo'yicha tekshiriladi. Normalizatsiya (NFC) ham muhim — bir xil ko'rinadigan matn turlicha kodlanishi mumkin."},{"l":"S","t":"mcq","tp":"Encoding","d":"alg","id":30257,"n":"SN258","q":"Base64 nima uchun ishlatiladi va nima narxi bor?","o":["Shifrlash uchun","Binary ma'lumotni matnli kanalda (JSON, URL, email header) xavfsiz uzatish uchun — shifrlash emas; hajmi ~33% oshadi, shuning uchun katta fayllar uchun multipart yoki alohida binary kanal afzal","Siqish uchun","Hash uchun"],"a":1,"e":"Intervyu tuzog'i: base64'ni xavfsizlik chorasi deb aytish. Amaliy detallar: URL'da `base64url` variant (`-`, `_`) kerak, JWT aynan shuni ishlatadi; rasm'ni JSON ichida base64 bilan yuborish 33% ortiqcha trafik va parse narxi beradi — presigned URL bilan to'g'ridan-to'g'ri yuklash to'g'ri yechim."},{"l":"S","t":"mcq","tp":"Trees","d":"alg","id":30258,"n":"SN259","q":"B-tree va binary search tree (AVL/red-black) farqi nimada va nega DB B-tree'ni tanlaydi?","o":["Farqi yo'q","BST node'ida bitta kalit — chuqurlik log2(N), har daraja alohida xotira/disk sakrashi; B-tree node'i yuzlab kalitni bir sahifada saqlaydi — chuqurlik log_k(N) (3-4 daraja), demak disk o'qishlari minimal. Xotiradagi indekslar uchun esa BST/skip list maqbul","B-tree balanslanmaydi","AVL diskda tezroq"],"a":1,"e":"Asosiy g'oya — xotira ierarxiyasi: disk/SSD blok bilan o'qiladi (4-8 KB), shuning uchun tugun blok o'lchamiga moslanadi. Shu sabab LSM-tree (RocksDB, Cassandra) yozuvga optimallashgan alternativa: ketma-ket yozish va keyin compaction — yozuv og'ir workload'da B-tree'dan tez, lekin o'qishda amplifikatsiya beradi."},{"l":"St","t":"mcq","tp":"Trees","d":"alg","id":30259,"n":"SN260","q":"LSM-tree (RocksDB/Cassandra) va B-tree o'rtasidagi almashinuv?","o":["LSM har doim tezroq","LSM: yozuv ketma-ket (memtable → SSTable), yozuv amplifikatsiyasi kam, siqish yaxshi — lekin o'qishda bir necha darajaga qarash (bloom filter bilan yumshatiladi) va compaction fon yuki/latency spike; B-tree: o'qish barqaror va predictable, yozuvda tasodifiy I/O va page split","LSM o'qishda tez","B-tree siqmaydi"],"a":1,"e":"Tanlov workload bo'yicha: yozuv-og'ir, vaqt seriyali, append-only ma'lumot — LSM (Cassandra, ClickHouse, RocksDB); murakkab tranzaksion o'qish, indeks bo'yicha diapazon, MVCC — B-tree (PostgreSQL, MySQL). Compaction operatsion ta'siri (disk hajmi vaqtincha 2x, I/O spike) senior darajada aytilishi kerak."},{"l":"S","t":"mcq","tp":"Approach","d":"alg","id":30260,"n":"SN261","q":"P, NP va NP-complete amaliy muhandislikda nimani bildiradi?","o":["Faqat akademik masala","Masala NP-hard bo'lsa aniq optimal yechim katta kirishda amalda topilmaydi — shuning uchun heuristika, approximation yoki cheklangan holatga soddalashtirish tanlanadi (masalan kuryer marshruti = TSP, jadvallashtirish, bin packing = resurs joylashtirish)","Har NP masala yechilmaydi","Faqat kriptografiyada"],"a":1,"e":"Backend misollari: dostavka marshruti (TSP/VRP) — greedy + local search yoki tashqi solver; podlarni node'larga joylash (bin packing) — Kubernetes scheduler heuristikasi; smena jadvali — constraint solver. Intervyuda to'g'ri javob 'optimal emas, lekin yetarlicha yaxshi va vaqt chegarasida' yechimni taklif qilish."},{"l":"S","t":"mcq","tp":"Approach","d":"alg","id":30335,"n":"SN336","q":"Amortizatsiyalangan murakkablik nima? Dinamik massivga `append` misolida.","o":["O'rtacha holat murakkabligi (average case)","N ta operatsiyaning umumiy narxini N ga bo'lish: har `append` O(1) amortizatsiyalangan, chunki cap tugaganda O(n) ko'chirish bo'ladi, lekin u har 2x o'sishda bir marta — jami O(n) ish N operatsiyaga taqsimlanadi","Eng yomon holat O(1)","Tasodifiy ma'lumotdagi tezlik"],"a":1,"e":"Average case ma'lumot taqsimotiga tayanadi, amortizatsiya esa hech qanday ehtimollik talab qilmaydi — bu kafolat. Muhim amaliy natija: real-time tizimda amortizatsiya yetmaydi, chunki bitta operatsiya O(n) bo'lib latency spike beradi (shu sabab GC va rehash pauzalari). Ikki barobar o'sish siyosati aynan shu amortizatsiyani ta'minlaydi; 1.25x o'sish xotirani tejaydi, lekin ko'chirishlar ko'payadi."},{"l":"S","t":"mcq","tp":"Hash tables","d":"alg","id":30336,"n":"SN337","q":"Hash jadvalining eng yomon holati O(n) bo'lishi qanday hujumga aylanadi?","o":["Hujum bo'lolmaydi","Hash collision DoS: hujumchi bir xil bucket'ga tushadigan kalitlar yuboradi (JSON kalitlari, HTTP parametrlari) va har operatsiya O(n) bo'lib CPU tugaydi; himoya — tasodifiy seed bilan hash (Go map shunday qiladi) yoki SipHash","Faqat xotira oshadi","Faqat eski tillarda"],"a":1,"e":"2011-2012 yillarda PHP/Java/Python veb-freymvorklari shu bilan yiqitilgan. Go map har jarayonda tasodifiy seed ishlatadi, shuning uchun kalitlarni oldindan tanlab bo'lmaydi (shu sababdan map iteratsiya tartibi ham har safar boshqa). Qo'shimcha himoya — kirish o'lchamini cheklash (parametrlar soni, JSON kalitlari soni)."},{"l":"S","t":"mcq","tp":"Hash tables","d":"alg","id":30337,"n":"SN338","q":"Open addressing (linear probing) va chaining farqi amalda nimada?","o":["Faqat kod uzunligi","Chaining: har bucket'da ro'yxat — yuqori load factor'da ham ishlaydi, lekin pointer sakrashlari (kesh miss); open addressing: elementlar massivda ketma-ket — kesh uchun juda yaxshi, lekin load factor ~0.7 dan oshsa clustering va o'chirish murakkab (tombstone)","Chaining har doim tezroq","Open addressing kolliziyasiz"],"a":1,"e":"Zamonaviy implementatsiyalar (Go map, Swiss table, abseil `flat_hash_map`) kesh lokalligi uchun ochiq adreslash yoki bucket ichida bir necha slot ishlatadi — CPU'da kesh miss narxi hash hisoblashdan qimmatroq. Bu 'nazariy bir xil O(1)' bo'lsa ham amalda 2-5x farq beradigan klassik misol."},{"l":"S","t":"mcq","tp":"Sorting","d":"alg","id":30338,"n":"SN339","q":"Barqaror (stable) saralash qachon majburiy?","o":["Har doim","Ko'p kalit bo'yicha ketma-ket saralaganda (avval ism, keyin yosh — teng yoshlarda ism tartibi saqlanishi kerak) va pagination/UI'da barqaror tartib talab qilinganda; `sort.Slice` barqaror emas, `sort.SliceStable` barqaror","Faqat kichik massivda","Faqat butun sonlarda"],"a":1,"e":"Go'da `sort.Slice` pdqsort (barqaror emas) — teng elementlar tartibi kafolatlanmaydi va har ishga tushirishda farq qilishi mumkin. Barqarorlik narxi: qo'shimcha xotira yoki sekinroq ishlash. DB'da ham xuddi shu tamoyil: `ORDER BY` unique bo'lmasa tartib barqaror emas, tie-breaker kerak."},{"l":"St","t":"mcq","tp":"Sorting","d":"alg","id":30339,"n":"SN340","q":"100 GB faylni 8 GB RAM bilan saralash kerak. Qanday?","o":["Hammasini xotiraga yuklab `sort`","External merge sort: fayl xotiraga sig'adigan bo'laklarga bo'linadi, har biri saralanib diskka yoziladi (run), keyin k-way merge (min-heap bilan) bitta o'tishda birlashtiriladi — I/O O(n log_k n) blokda","Quicksort diskda","Faqat ClickHouse ishlatish"],"a":1,"e":"Bu PostgreSQL `work_mem` yetmaganda qiladigan ish (disk-based sort) va MapReduce shuffle bosqichining asosi. Amaliy detallar: blok kattaligi ketma-ket o'qishni maksimallashtirish uchun tanlanadi, k (bir vaqtda ochiladigan run soni) fayl deskriptorlari va buferga bog'liq, va siqish I/O ni kamaytiradi."},{"l":"S","t":"mcq","tp":"Heap","d":"alg","id":30340,"n":"SN341","q":"N elementdan eng katta K tasini topish: qaysi yondashuv samarali?","o":["Hammasini saralash — O(n log n)","Hajmi K bo'lgan min-heap bilan bitta o'tish — O(n log k) va xotira O(k); oqim (stream) uchun ham ishlaydi. Quickselect esa O(n) o'rtacha, lekin butun massiv xotirada bo'lishi kerak","Har doim quickselect","Bubble sort K marta"],"a":1,"e":"K << N bo'lganda heap yondashuvi aniq g'olib, ayniqsa ma'lumot oqimda kelsa (barchasini saqlash imkonsiz). Quickselect (`nth_element`) bir martalik in-memory holat uchun eng tez. Taqsimlangan variantda: har node o'zining top-K sini beradi, keyin natijalar birlashtiriladi — bu 'top-K exact' uchun to'g'ri, chunki K dan tashqaridagi element global top-K ga kira olmaydi."},{"l":"S","t":"mcq","tp":"Graphs","d":"alg","id":30341,"n":"SN342","q":"BFS va Dijkstra qachon ekvivalent, qachon Dijkstra shart?","o":["Har doim bir xil","Barcha qirralar vazni teng (yoki 1) bo'lsa BFS eng qisqa yo'lni beradi — O(V+E); turli musbat vaznlarda Dijkstra (priority queue) kerak — O(E log V). Manfiy vazn bo'lsa Bellman-Ford yoki SPFA","BFS har doim tezroq va to'g'ri","Dijkstra manfiy vaznda ham ishlaydi"],"a":1,"e":"Dijkstra manfiy qirrada buziladi, chunki u 'bir marta yopilgan node qayta yaxshilanmaydi' taxminiga tayanadi. Amaliy misollar: sotsial graf masofasi — BFS; yo'l/latency marshruti — Dijkstra; valyuta arbitraji (manfiy log vazn) — Bellman-Ford bilan sikl aniqlash. 0-1 vaznlarda esa deque bilan 0-1 BFS O(V+E) beradi."},{"l":"S","t":"mcq","tp":"Graphs","d":"alg","id":30342,"n":"SN343","q":"Topologik saralash qanday amaliy muammoni yechadi va qachon imkonsiz?","o":["Faqat o'quv masalasi","Bog'liqliklarni tartibga solish: build tizimi, migratsiya tartibi, task scheduler, paket o'rnatish. Sikl bo'lsa imkonsiz — Kahn algoritmi qolgan tugunlar orqali siklni aniqlaydi (aylanma bog'liqlik xatosi)","Har doim mumkin","Faqat daraxtda ishlaydi"],"a":1,"e":"Kahn: in-degree 0 bo'lgan tugunlardan boshlab navbat bilan olib boriladi; oxirida qolgan tugunlar sikl tarkibida. DFS varianti orqa qirra (back edge) bilan siklni topadi. Mikroservis arxitekturasida ham shu vosita: bog'liqlik grafida sikl bo'lsa deploy tartibi aniqlanmaydi — bu dizayn xatosi belgisi."},{"l":"St","t":"mcq","tp":"Graphs","d":"alg","id":30343,"n":"SN344","q":"Union-Find (DSU) qanday muammolarda eng mos?","o":["Eng qisqa yo'l","Dinamik ulanish: komponentlarni birlashtirish va 'bir komponentdami?' savoli — path compression + union by rank bilan deyarli O(1) (amortizatsiyalangan α(n)); misollar: Kruskal MST, dedupe/klasterlash, akkauntlarni birlashtirish (identity resolution)","Saralash","Hash jadval o'rniga"],"a":1,"e":"DSU faqat birlashtirishga imkon beradi — ajratish (undo) qo'llanmaydi, buning uchun offline dinamik algoritmlar kerak. Amaliy backend misoli: bir xil foydalanuvchini turli signal bo'yicha (email, qurilma, karta) bitta identitetga yig'ish — bu tabiiy union-find masalasi va uni DB'da `root_id` bilan saqlash mumkin."},{"l":"S","t":"mcq","tp":"DP","d":"alg","id":30344,"n":"SN345","q":"Masala DP bilan yechiladimi — qanday aniqlanadi?","o":["Har optimizatsiya masalasi DP","Ikki shart: optimal substructure (butun yechim qism yechimlardan quriladi) va overlapping subproblems (bir xil qism yechim qayta hisoblanadi). Ikkinchisi bo'lmasa — divide and conquer; greedy to'g'ri bo'lsa (exchange argument bilan isbot) DP keraksiz","Faqat massivlarda","Faqat rekursiv kodda"],"a":1,"e":"Amaliy tartib: rekursiv formulani yozish (holat va o'tish), keyin memoizatsiya (top-down), keyin kerak bo'lsa tabulyatsiya va xotirani qisqartirish (faqat oxirgi qator). Intervyu signali — holatni to'g'ri ta'riflash: 'dp[i][j] = ... ma'nosi' aniq aytilsa, qolgani mexanik."},{"l":"S","t":"mcq","tp":"Binary search","d":"alg","id":30345,"n":"SN346","q":"'Javob bo'yicha binary search' (parametric search) qanday ishlaydi?","o":["Faqat saralangan massivda qidirish","Monoton predikat ustida: `can(x)` rost bo'lsa barcha kattalarida ham rost bo'lsa — minimal x ni log(diapazon) qadamda topamiz. Misollar: minimal sig'im/tezlik, deadline'ga sig'adigan worker soni, rate limit sozlash","Faqat butun sonlarda","Har doim O(1)"],"a":1,"e":"Kalit shart — monotonlik; uni isbotlash yoki kamida aniq aytish kerak. Backend misoli: 'N ta faylni K worker bilan T vaqtda ko'chirish mumkinmi?' — `can(T)` monoton, demak minimal T binary search bilan topiladi. Capacity planning masalalarida ham shu naqsh ishlatiladi."},{"l":"S","t":"mcq","tp":"Intervals","d":"alg","id":30346,"n":"SN347","q":"Ko'p intervalni birlashtirish (merge intervals) va 'eng ko'p bir vaqtda faol' masalasi qanday yechiladi?","o":["Har juftlikni solishtirish — O(n²)","Boshlanish bo'yicha saralab bitta o'tish (merge) — O(n log n); 'bir vaqtda faol maksimum' uchun sweep line: boshlanishga +1, tugashga -1 qo'yib saralangan hodisalar bo'yicha prefiks maksimumi","Heap majburiy","DP kerak"],"a":1,"e":"Sweep line amaliyotda ko'p uchraydi: bir vaqtdagi maksimal ulanish soni, xona/resurs bandligi, rate limit oynasi, monitoringda concurrency hisoblash. Nozik joyi — teng koordinatalarda tartib: tugash boshlanishdan oldin qo'llanadimi (yopiq/ochiq interval semantikasi) — buni aniq belgilash kerak, aks holda off-by-one bug chiqadi."},{"l":"S","t":"mcq","tp":"Linked list","d":"alg","id":30347,"n":"SN348","q":"Amaliyotda bog'langan ro'yxat massivdan qachon afzal?","o":["Deyarli har doim","Kamdan-kam: kesh lokalligi yo'q (har node alohida joyda) — iteratsiya massivdan ancha sekin. Afzal holatlar: o'rtaga O(1) qo'shish/o'chirish node havolasi bo'lganda (LRU ro'yxati), yoki ko'chirish qimmat bo'lgan katta elementlar","Xotira kam ishlatadi","Saralash tezroq"],"a":1,"e":"Nazariy murakkablik teng bo'lsa ham amalda massiv/slice g'olib chiqadi, chunki CPU ketma-ket xotirani oldindan o'qiydi (prefetch). Shuning uchun LRU keshda ham ro'yxat faqat tartib uchun, qidiruv map bilan. Bu 'big-O hamma narsani aytmaydi' tamoyilining eng aniq misoli."},{"l":"St","t":"mcq","tp":"Approach","d":"alg","id":30348,"n":"SN349","q":"Ikkita katta fayl (har biri 50 GB) ichida umumiy satrlarni topish kerak. Xotira 4 GB.","o":["Ikkisini xotiraga yuklash","Hash bo'yicha shardlash: har satrni `hash(line) % K` bilan K ta bo'lakka yozib chiqish (ikki fayl uchun ham) — bir xil satr bir xil bo'lakka tushadi, keyin har juft bo'lakni xotirada set bilan solishtirish","Faqat `sort | uniq -d`","Bloom filter yetarli (aniq natija uchun)"],"a":1,"e":"Bu MapReduce join'ning mohiyati: 'katta masalani hash bo'yicha mustaqil bo'laklarga ajratish'. Alternativa — ikkisini external sort qilib merge (`sort | comm`), I/O ko'proq lekin xotira kam. Bloom filter tez oldindan filtrlash uchun yaxshi (false positive bor), shuning uchun aniq natija uchun keyin tekshirish kerak."},{"l":"S","t":"mcq","tp":"Design","d":"alg","id":30349,"n":"SN350","q":"Trie (prefix tree) hash jadvaldan qachon afzal?","o":["Har doim tezroq","Prefiks bo'yicha so'rovlar kerak bo'lganda (autocomplete, IP routing/longest prefix match, lug'at tekshiruvi) va umumiy prefikslar xotirani tejaganda; aniq kalit qidiruvida hash jadval odatda tezroq","Xotira kam ishlatadi","Kolliziyasiz bo'lgani uchun"],"a":1,"e":"Trie qidiruvi O(kalit uzunligi) va hash hisoblashni talab qilmaydi, lekin node'lar tarqoq joylashgani uchun kesh miss ko'p. Amaliy optimizatsiyalar: radix/patricia tree (bir bolali zanjirlarni siqish), DAWG (qo'shimcha siqish), yoki oddiygina prefiks→natija xaritasi (oldindan hisoblangan) — ko'p tizimda eng arzon yechim shu."},{"l":"J","t":"open","tp":"Behavioral","d":"soft","id":5030,"n":"V31","q":"'Tell me about yourself' — bu rol uchun javobni qanday tuzasiz (ingliz tilida)?","m":["2 daqiqa, uch qism: hozirgi rol va mas'uliyat → eng mos 1–2 yutuq (raqam bilan) → nega aynan shu vakansiya","Vakansiya tiliga moslash: Go, microservices, Kafka, PostgreSQL, AWS, event-driven","Yutuqni STAR bilan qisqa: Situation, Task, Action, Result (masalan 'p99 latency 800ms dan 120ms ga tushdi')","Butun karyerani boshidan sanamaslik; oxirgi 3–5 yilga fokus","Ingliz tilida oldindan ovoz chiqarib mashq qilish — bu yerda C1 talabi bor"],"e":"Bu savol deyarli har intervyuda birinchi bo'ladi va ingliz tili darajangiz shu yerda baholanadi. Yodlab olingan matn emas, tayyorlangan struktura kerak."},{"l":"M","t":"open","tp":"Behavioral","d":"soft","id":5031,"n":"V32","q":"Junior muhandisga mentorlik va code review'ni qanday qilasiz?","m":["Review'da muammoni odamdan ajratish: 'bu funksiya...' deyish, 'sen...' emas","Kommentlarni darajalash: bloklovchi (bug, security) va ixtiyoriy (nit) — aniq belgilab qo'yish","Sabab tushuntirish va havola berish — shunda review o'rgatadi, faqat tuzatmaydi","Katta o'zgarishni oldin dizayn bo'yicha kelishish — 300 row'dan keyin arxitektura bahsi kech","Mentorlik: juftlikda ishlash, o'sib boruvchi murakkablikdagi vazifalar, muntazam 1:1 va aniq fikr-mulohaza","O'lchov: junior mustaqil yetkazadigan ish hajmi va review'dagi takroriy xatolar kamayishi"],"e":"Vakansiyada 'mentorship' va 'code review' aniq yozilgan. Kuchli javob — konkret amaliyot va misol, umumiy gap emas."},{"l":"S","t":"open","tp":"Behavioral","d":"soft","id":5032,"n":"V33","q":"Product Owner muddati siqilgan feature so'rayapti, sizning texnik baholashingiz boshqacha. Qanday gaplashasiz?","m":["Avval maqsadni tushunish: nega shu sana, qanday biznes natija kutilyapti","Variantlarni narx bilan taqdim etish: to'liq yechim (X hafta), qisqartirilgan qamrov (Y hafta), vaqtinchalik yechim + texnik qarz (Z, keyin to'lash rejasi bilan)","Xavflarni aniq aytish: nima buziladi, qanday ehtimol, qanday yumshatish (feature flag, canary)","Qarorni PO qabul qiladi — lekin yozma qayd etiladi (ADR yoki ticket kommenti)","Kelishilgan qarzni backlog'ga aniq vazifa sifatida qo'yish va muddatini belgilash"],"e":"Baholanadigan narsa — 'yo'q' deyish emas, tanlovni ko'rsatish. Ingliz tilida bu suhbatni mashq qiling: 'Here are three options with trade-offs...' — customer-facing kommunikatsiya talabi shu yerda tekshiriladi."},{"l":"S","t":"open","tp":"Behavioral","d":"soft","id":30097,"n":"SN98","q":"'Tell me about a production incident you handled' — javobni qanday tuzasiz (ingliz tilida)?","m":["STAR: Situation (tizim, trafik, ta'sir — raqam bilan: '12% of checkout requests failing for 25 minutes')","Task: sizning roli — incident commander, debugger, communicator (aniq ayting)","Action: gipoteza va o'lchash ketma-ketligi ('metrics showed p99 spike only on writes → checked pg_stat_activity → lock contention from a migration')","Mitigation avval, root cause keyin — bu senior signal: 'we rolled back the migration first, investigated after service recovered'","Result: MTTR, keyin nima o'zgardi (alert, runbook, lock_timeout, CI check) — takrorlanmasligi uchun tizimli tuzatish","Nimani o'rgandingiz va nimani boshqacha qilardingiz — ayblashsiz (blameless)"],"e":"Intervyuer qidiradi: o'lchashga asoslangan debugging, mitigation va root cause'ni ajratish, muloqot (stakeholder'ga xabar), va follow-up. Faqat 'qahramonlik' hikoyasi (bir kechada tuzatdim) zaif signal."},{"l":"S","t":"open","tp":"Behavioral","d":"soft","id":30098,"n":"SN99","q":"'Tell me about a technical decision you disagreed with' — qanday javob beriladi?","m":["Kontekst qisqa: qanday qaror, kim qabul qildi, nega siz qo'shilmadingiz (texnik sabab, taxmin emas)","Sizning harakati: dalil yig'ish (benchmark, prototip, incident ma'lumoti), yozma taqqoslash (trade-off jadvali), to'g'ri odam bilan suhbat","Natija ikki variantda halol bo'lsin: (a) qaror o'zgardi — qanday dalil ishonch berdi, (b) o'zgarmadi — 'disagree and commit', siz to'liq bajardingiz va xatarni monitoring bilan yopdingiz","Nimani o'rgandingiz: eskalatsiya vaqti, qarorni hujjatlashtirish (ADR) qiymati"],"e":"Baholanadigan xususiyat — ego emas, dalil bilan ishlash va jamoada harakat qilish qobiliyati. 'Men to'g'ri edim, ular bilmadi' javobi salbiy signal; 'disagree and commit' aytilishi esa kuchli."},{"l":"St","t":"open","tp":"Behavioral","d":"soft","id":30099,"n":"SN100","q":"'How do you mentor and review code?' — senior/staff darajada kutilgan javob?","m":["Review'da prioritet: to'g'rilik va xavfsizlik → dizayn/kontrakt → o'qilishi → uslub (uslubni linter/formatter avtomatlashtiradi, odam vaqtini yemaydi)","Kommentlar savol va sabab bilan ('bu joyda retry idempotent emas — dublikat to'lov bo'lishi mumkin'), blokirovka va tavsiyani ajratish (nit/blocking belgilash)","Kichik PR va tez javob madaniyati; katta o'zgarishda avval dizayn muhokamasi (ADR) — review'da arxitektura bahsi kech","Mentorlik: javob bermay yo'l ko'rsatish, juftlikda debugging, o'sish uchun aniq maqsad va fikr-mulohaza (feedback) muntazam","O'lchov: review kutish vaqti, PR hajmi, incident'dan keyingi takroriy xatolar kamayishi"],"e":"Staff darajada kutiladigani — jamoaning umumiy chiqishini oshirish, o'z kodini emas. Konkret misol va o'lchov bilan aytilsa kuchli javob bo'ladi."},{"l":"S","t":"open","tp":"Behavioral","d":"soft","id":30284,"n":"SN285","q":"'Walk me through a system you designed and owned end to end' — javobni qanday tuzasiz?","m":["Kontekst raqamlar bilan: 'payments service, Go + PostgreSQL, ~80k transactions/day, 3 engineers, I owned the design and the on-call'","Muammo va cheklovlar: nima uchun qurildi, qanday talablar (latency, izchillik, compliance) va nimani ataylab qilmadik (scope)","Arxitektura qisqa: asosiy komponentlar va ma'lumot oqimi — 2-3 gapda, keyin eng qiyin qismga chuqurlashish (masalan 'the hardest part was retry semantics with the third-party processor')","Almashinuvlar: qanday variantlar bor edi, nega shuni tanladingiz, nimani qurbon qildingiz (masalan eventual consistency)","Natija raqamda: latency, xato nisbati, xarajat, incident soni — va keyin nima o'zgardi (o'sganda nima buzildi)","Egalik belgilari: on-call, monitoring va runbook'ni siz qurganingiz, migratsiyani qanday xavfsiz o'tkazganingiz","Nimani boshqacha qilardingiz — halol va aniq bitta narsa"],"e":"Intervyuerlar aynan shu yerda 'buzzword zichligi' ni tekshiradi: Kafka, gRPC, Kubernetes, mesh, OTel deb sanab, hech birini shaxsan shippingga bog'lay olmaslik — salbiy signal. Raqam, cheklov va bitta chuqur qiyin qism eng kuchli javob strukturasi."},{"l":"S","t":"open","tp":"Behavioral","d":"soft","id":30285,"n":"SN286","q":"'Tell me about a time you made a technical mistake in production' — qanday javob beriladi?","m":["Haqiqiy, o'lchovli misol tanlash (kichik emas, lekin karyerani buzmaydigan): masalan migratsiya qulf olib 4 daqiqa yozuvlarni to'sib qo'ygani","Nima bo'lganini aniq ayting: ta'sir raqamda, qancha davom etgani, foydalanuvchi qanday ko'rgan","Sizning harakati: qanday aniqlandi (alert bormi yoki mijoz aytdimi — bu ham halol signal), qanday to'xtatdingiz, kim bilan muloqot qildingiz","Root cause: nega bu mumkin edi — tizimda guardrail yo'qligi (`lock_timeout` qo'yilmagani, staging'da real hajm yo'qligi)","Tizimli tuzatish: nima qo'shildi (migratsiya checklisti, CI tekshiruvi, alert), shundan keyin takrorlanmagani","O'zingiz haqida xulosa: nimani endi boshqacha qilasiz — bir gapda","Ayblashsiz va mudofaasiz ohang; 'menda xato bo'lmagan' javobi eng yomon variant"],"e":"Baholanadigan narsa — mas'uliyatni olish va xatoni tizimli tuzatishga aylantirish. Aniqlash vaqti va monitoring bo'shlig'ini aytish senior signal: siz nafaqat tuzatgan, balki 'nega tezroq bilmadik' savolini bergan bo'lasiz."},{"l":"S","t":"open","tp":"Behavioral","d":"soft","id":30286,"n":"SN287","q":"'How do you handle competing priorities and push back on scope?' — kutilgan javob?","m":["Prioritetni ma'lumotga bog'lash: ta'sir (foydalanuvchi/biznes), xatar, va narx — his-tuyg'u emas","Shaffof qilish: hozirgi ish ro'yxati va sig'im ko'rinadigan bo'lsin; yangi ish qo'shilganda nima kechikadi degan savolni aniq qo'yish ('bu kirsa, X keyingi sprintga suriladi — shu maqbulmi?')","Texnik qarzni biznes tiliga o'girish: 'bu refactor kechikish emas, deploy vaqti 40 daqiqadan 10 ga tushadi va incident chastotasi kamayadi'","Muzokara varianti: to'liq scope o'rniga bosqichli yetkazish (MVP + keyingi bosqich), yoki vaqtincha yechim + reja","Yozma qaror: kelishuvni yozib qo'yish (ticket/ADR) — keyin 'biz bunday kelishmaganmiz' bahsi bo'lmaydi","Eskalatsiya: kelishilmasa menejer bilan ochiq muhokama, lekin qaror chiqqach to'liq bajarish"],"e":"Senior'dan kutiladigani — 'yo'q' demaslik yoki hammasiga 'ha' deyish emas, balki almashinuvni ko'rinadigan qilish. Texnik qarzni biznes metrikasiga o'girib gapirish eng kuchli ko'nikma."},{"l":"S","t":"open","tp":"Behavioral","d":"soft","id":30287,"n":"SN288","q":"'Do you have any questions for us?' — nima so'raladi (va bu nega baholanadi)?","m":["Muhandislik amaliyoti: deploy chastotasi, CI vaqti, rollback qanday, on-call rotatsiyasi va incident madaniyati (blameless postmortem bormi)","Texnik holat: eng katta texnik qarz nima, monolit yoki servislar, test qoplami va migratsiyalarni qanday qilasiz","Rol va kutilma: bu rol uchun ilk 3-6 oyda muvaffaqiyat nimada o'lchanadi, kim bilan ishlaymiz, qarorlar qanday qabul qilinadi","Jamoa: kod review madaniyati, mentorlik, o'sish yo'li (senior'dan keyin nima)","Mahsulot: eng katta muammo nima va nega hozir shu rol ochildi","So'rash kerak bo'lmagani: faqat maosh/ta'til (birinchi bosqichda) yoki umuman savol bermaslik — qiziqish yo'qligi signali"],"e":"Bu savol baholanadi: siz jamoa sifatini tekshiradigan muhandismi yoki shunchaki ishga muhtojmi. Deploy/rollback/on-call haqidagi savollar siz production bilan ishlaganingizni ko'rsatadi — bu bilvosita eng kuchli signal."},{"l":"St","t":"open","tp":"Behavioral","d":"soft","id":30478,"n":"SN479","q":"'Design suhbatida intervyuer sizni noto'g'ri deb turibdi, lekin siz haqsiz' — nima qilasiz?","m":["Avval tushunishga harakat: 'sizni to'g'ri tushundimmi — X holatda bu ishlamaydi deyapsizmi?' — ko'pincha farq taxminlarda, faktda emas","Taxminlarni ochiq qilish: 'men 10k RPS va eventual consistency maqbul deb faraz qildim; agar kuchli izchillik talab bo'lsa mening yechimim noto'g'ri'","Dalil keltirish qisqa va texnik: mexanizm darajasida (nega kvorum kerak, nega bu retry amplifikatsiya beradi), shaxsiy emas","Ikkinchi yo'lni ham ko'rsatish: 'sizning yondashuvingiz bilan ham ishlaydi, almashinuvi shu — men buni tanladim chunki...'","Vaqtni behuda sarflamaslik: kelishmovchilik cho'zilsa 'keling sizning variantingiz bilan davom etaman' deb suhbatni oldinga surish — bu moslashuvchanlik signali","Intervyu doirasida ko'pincha bu ataylab qilingan bosim testi: baholanadigan narsa — mudofaaga o'tasizmi yoki dalil bilan muloqot qilasizmi"],"e":"Kutiladigan xatti-harakat: taxminni ochish, dalilni mexanizm darajasida aytish, keyin kerak bo'lsa moslashish. Qat'iy turib olish ham, darhol taslim bo'lish ham salbiy signal."},{"l":"S","t":"open","tp":"Behavioral","d":"soft","id":30479,"n":"SN480","q":"'Eng qiyin texnik muammo qaysi edi?' — qanday tanlaysiz va aytasiz?","m":["Tanlov mezoni: sabab darhol ko'rinmagan, bir necha gipoteza tekshirilgan va yechim tizimli bo'lgan muammo (oddiy 'ko'p ish qildim' emas)","Struktura: simptom va ta'sir (raqam bilan) → nima uchun qiyin edi (noaniqlik, takrorlanmaydigan, bir necha tizim chegarasi) → qanday toraytirdingiz (o'lchov, binary search, izolyatsiya) → topilgan sabab → tuzatish va profilaktika","Texnik chuqurlik ko'rsatish: bitta mexanizmni oxirigacha tushuntirish (masalan ulanish pooli tugashi va kutish navbati, yoki GC assist), yuzaki sanab o'tmaslik","Jamoaviy tomoni: kim bilan ishladingiz, qanday xabar berdingiz, qaror qanday qabul qilindi","Natijadan keyingi o'zgarish: alert, test, runbook, arxitektura tuzatishi — takrorlanmaganini ayting","Hikoya 3-5 daqiqa; intervyuer chuqurlashtirsa detallar tayyor bo'lsin (raqamlar, komandalar, nomlar)"],"e":"Bu savolda chuqurlik yuza kengligidan muhimroq. Bitta muammoni mexanizm darajasida (nega aynan shunday bo'ldi) tushuntira olish — senior va middle orasidagi eng aniq farqlovchi signal."},{"l":"S","t":"open","tp":"Behavioral","d":"soft","id":30529,"n":"SN530","q":"'Nega ish joyingizni o'zgartiryapsiz?' — qanday javob beriladi?","m":["Oldinga qaragan ramka: nimani izlayapsiz (masshtab, domen, texnik chuqurlik, egalik darajasi), nega bu joy shuni beradi — konkret va shu kompaniyaga bog'langan","Hozirgi joy haqida hurmat bilan va faktga tayanib: 'jamoa 3 kishi, mahsulot barqaror bosqichda, yangi texnik muammolar kam' — bu tanqid emas, bosqich ta'rifi","Salbiy narsalarni shaxsiylashtirmaslik: menejer/hamkasblarni ayblash eng yomon signal (intervyuer keyingi joyda siz ular haqida shunday gapirishingizni tasavvur qiladi)","Agar chiqib ketish sababi noqulay bo'lsa (qisqartirish, konflikt) — qisqa, halol va aybsiz formulirovka, so'ng oldinga burish","Izchillik: rezyumedagi qisqa muddatlar bo'lsa oldindan tushuntirish tayyor bo'lsin"],"e":"Baholanadigan narsa — motivatsiya va yetuklik. Javob 'nimadan qochyapman' emas, 'nimaga intilyapman' bo'lishi kerak, va u konkret vakansiya bilan bog'lansa ishonarli bo'ladi."},{"l":"St","t":"open","tp":"Behavioral","d":"soft","id":30530,"n":"SN531","q":"'Jamoada past natija ko'rsatayotgan muhandis bor' — nima qilasiz (senior/lead nuqtai nazaridan)?","m":["Avval sababni aniqlash, taxmin qilmaslik: ko'nikma bo'shlig'imi, kontekst yetishmaydimi, noaniq talablarmi, motivatsiya yoki shaxsiy holatmi — 1:1 da ochiq savol bilan","Konkret va kuzatiladigan fikr-mulohaza: 'oxirgi uch PR review'da shu naqsh takrorlandi' — umumiy 'sifat past' emas","Qo'llab-quvvatlash rejasi: juftlikda ishlash, kichikroq va aniqroq vazifalar, kod review'da mentorlik, kutilmalarni yozma qilish va muddat belgilash","Tizimni ham tekshirish: onboarding, hujjat, test qoplami, noaniq arxitektura — ko'pincha muammo odamda emas, kontekstda","Natijani kuzatish: belgilangan muddatda yaxshilanish bo'lmasa menejer bilan birga keyingi qadam (rol o'zgarishi va h.k.) — lekin bu menejerning qarori, senior'ning emas","Jamoaga ta'sirini boshqarish: ishni qayta taqsimlash va relizni xavf ostiga qo'ymaslik"],"e":"Staff/lead darajasida kutilgani: sababni tekshirish, konkret fikr-mulohaza, tizimli omillarni ko'rish va chegarani bilish (HR/menejer hududiga o'tib ketmaslik)."},{"l":"J","t":"mcq","tp":"AppSec","d":"sec","id":9000,"n":"S1","q":"Parollarni saqlashning to'g'ri usuli?","o":["SHA-256 bilan hash qilish","Parolga mo'ljallangan sekin algoritm: Argon2id (yoki bcrypt/scrypt) — har parol uchun alohida salt va sozlanadigan narx (cost) bilan","AES bilan shifrlash va key'ni saqlash","Base64 bilan kodlash"],"a":1,"e":"SHA-256 juda tez — GPU bilan sekundiga milliardlab urinish qilinadi. Argon2id xotira va vaqtni ataylab sarflaydi. Salt rainbow table'ga qarshi, har foydalanuvchida alohida. Shifrlash noto'g'ri: kalit sizsa hamma parol ochiladi, hash esa qaytarilmaydi. Qo'shimcha: parol uzunligiga urg'u (12+), buzilgan parollar ro'yxati bilan tekshirish, login'ga rate limit.","src":"https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html"},{"l":"M","t":"code","tp":"AppSec","d":"sec","id":9001,"n":"S2","q":"Bu kodda qanday zaiflik bor?","c":"query := \"SELECT * FROM users WHERE email = '\" + email + \"'\"\nrows, _ := db.Query(query)","o":["Zaiflik yo'q","SQL injection: email ichidagi tirnoq query'ni buzadi (' OR '1'='1). Yechim — parametrli query: db.Query(\"SELECT ... WHERE email = $1\", email)","Faqat performance muammosi","XSS"],"a":1,"e":"Qochirish (escaping) funksiyasini o'zingiz yozish ham yechim emas — drayverning parametr mexanizmi ishlatiladi, u qiymatni query matnidan butunlay ajratadi. Dinamik bo'lishi kerak bo'lgan qismlar (table/column nomi, ORDER BY yo'nalishi) parametr bo'la olmaydi — ular uchun faqat allowlist. ORM ishlatganda ham raw query joylariga alohida e'tibor."},{"l":"M","t":"mcq","tp":"AppSec","d":"sec","id":9002,"n":"S3","q":"JWT tekshirishda eng xavfli xato?","o":["Token'ni cookie'da saqlash","Header'dagi <code>alg</code> ga ishonish: <code>alg: none</code> yoki RS256 o'rniga HS256 ga almashtirish hujumi — server kutilgan algoritmni QATTIQ belgilashi va public key'ni HMAC siri sifatida ishlatmasligi kerak","Token muddatini qo'yish","Payload'da user_id saqlash"],"a":1,"e":"Boshqa majburiy tekshiruvlar: exp/nbf, iss va aud, kalit identifikatori (kid) — faqat o'z kalitlaringiz ro'yxatidan. Payload shifrlanmagan (faqat imzolangan) — maxfiy ma'lumot solmang. Kutubxonani o'zingiz yozmang, tekshirilgan kutubxona ishlating."},{"l":"M","t":"mcq","tp":"AppSec","d":"sec","id":9003,"n":"S4","q":"Broken Access Control (IDOR) nima va qanday yopiladi?","o":["Parolni zaif qo'yish","<code>/invoices/1042</code> ni boshqa foydalanuvchi ochib ko'rishi — ruxsat har so'rovda, ma'lumot egaligiga qarab tekshirilmagani uchun. Yechim: har query'ga tenant/user sharti, markaziy authorization qatlami va testlar","Brauzer keshi","Eski kutubxona"],"a":1,"e":"'ID'ni UUID qilish' — himoya emas, faqat topishni qiyinlashtiradi. Ishonchli yondashuvlar: repository darajasida majburiy scope (WHERE user_id = :me), Postgres RLS, va CI'da avtomatik test: B foydalanuvchining tokeni bilan A resursiga so'rov — 403 bo'lishi shart. OWASP Top 10 da birinchi o'rinda turadi.","src":"https://owasp.org/Top10/A01_2021-Broken_Access_Control/"},{"l":"M","t":"mcq","tp":"AppSec","d":"sec","id":9004,"n":"S5","q":"SSRF (Server Side Request Forgery) nima?","o":["Client brauzerida skript ishlatish","Foydalanuvchi bergan URL'ga server o'zi so'rov yuboradi — hujumchi uni ichki tarmoqqa (169.254.169.254 metadata, localhost, ichki admin panel) yo'naltiradi","Parolni o'g'irlash","DNS hujumi"],"a":1,"e":"Bulutda ayniqsa xavfli: metadata endpoint orqali IAM credential o'g'irlanadi (IMDSv2 buni yumshatadi). Himoya: allowlist (faqat ruxsat etilgan domenlar), DNS'ni tekshirgandan keyin IP'ni qayta tekshirish (DNS rebinding'ga qarshi), private IP diapazonlarini bloklash, redirect'larni kuzatmaslik, chiquvchi trafik uchun alohida proxy va tarmoq qoidalari."},{"l":"M","t":"mcq","tp":"AppSec","d":"sec","id":9005,"n":"S6","q":"XSS'dan himoyaning asosiy qoidasi?","o":["Kirishda barcha < va > belgilarini o'chirish","Chiqishda kontekstga mos qochirish (HTML, atribut, JS, URL uchun turlicha) — odatda shablon dvigateli avtomatik qiladi; qo'shimcha qatlam sifatida Content-Security-Policy","Faqat HTTPS ishlatish","Cookie'ni o'chirish"],"a":1,"e":"Kirishni 'tozalash' yetarli emas: bir xil qiymat HTML matnida xavfsiz, JS ichida xavfli bo'lishi mumkin. Xavfli naqshlar: innerHTML, dangerouslySetInnerHTML, foydalanuvchi bergan URL'ni href'ga qo'yish (javascript:). Cookie'ga HttpOnly qo'yish token o'g'irlanishini qiyinlashtiradi, lekin XSS'ning o'zini yo'q qilmaydi."},{"l":"M","t":"mcq","tp":"AppSec","d":"sec","id":9006,"n":"S7","q":"Cookie asosidagi sessiyada CSRF'dan qanday himoyalanasiz?","o":["HTTPS yetarli","SameSite=Lax/Strict cookie + holat o'zgartiruvchi so'rovlarga CSRF token (yoki double submit); GET faqat o'qish uchun bo'lsin","Faqat POST ishlatish","CORS ni ochib qo'yish"],"a":1,"e":"Nima uchun bu ishlaydi: hujumchi sayti so'rov yubora oladi, lekin token qiymatini o'qiy olmaydi (same-origin policy). Bearer token'ni header'da yuboradigan API'larda CSRF odatda muammo emas — chunki brauzer header'ni avtomatik qo'shmaydi. SameSite=None bo'lsa Secure majburiy."},{"l":"S","t":"mcq","tp":"AppSec","d":"sec","id":9007,"n":"S8","q":"Foydalanuvchi ma'lumotlarini shifrlashda kalitlarni qanday boshqarasiz?","o":["Kalitni kod ichida konstanta sifatida saqlash","KMS/HSM (AWS KMS, Vault): ma'lumot kaliti (DEK) bilan shifrlanadi, DEK esa master kalit (KEK) bilan o'raladi — envelope encryption; master kalit hech qachon ilovaga chiqmaydi va rotatsiya qilinadi","Kalitni DB'ning o'zida saqlash","Har foydalanuvchiga bitta doimiy kalit"],"a":1,"e":"Rotatsiya uchun shifrlangan qiymat bilan birga kalit versiyasini saqlang — eski ma'lumotni bir vaqtning o'zida qayta shifrlash shart emas. Diskni shifrlash (at rest) faqat o'g'irlangan disk holatidan himoya qiladi — ilova darajasidagi maxfiy maydonlar (karta, pasport) alohida shifrlanadi. Nima shifrlanganini va kim ochishi mumkinligini hujjatlashtiring."},{"l":"S","t":"mcq","tp":"AppSec","d":"sec","id":9008,"n":"S9","q":"Audit log uchun qaysi talab to'g'ri?","o":["Oddiy ilova logi yetarli","Kim, nima, qachon, qaysi resurs ustida va natija — o'zgartirib bo'lmaydigan (append-only, alohida saqlash, cheklangan ruxsat) tarzda; maxfiy qiymatlar (parol, token, karta) loglanmaydi","Faqat xatolarni yozish","Loglarni 1 kun saqlash"],"a":1,"e":"Audit log — hodisadan keyin tergov va compliance uchun yagona manba. Talablar: aniq vaqt manbai (NTP), o'zgartirishni aniqlash (hash zanjiri yoki WORM saqlash), saqlash muddati (ko'pincha 1–7 yil), va loglarga kirishning o'zi ham audit qilinishi. PII loglash — alohida xavf: GDPR bo'yicha o'chirish talabini bajarish qiyinlashadi."},{"l":"S","t":"mcq","tp":"AppSec","d":"sec","id":9009,"n":"S10","q":"Ta'minot zanjiri (supply chain) xavfini qanday kamaytirasiz?","o":["Faqat mashhur kutubxonalarni ishlatish","Versiyalarni lock fayl bilan qotirish va checksum'ni tekshirish, avtomatik zaiflik skani (govulncheck, Dependabot), SBOM, build'ni ishonchli muhitda qilish va artefaktni imzolash (Sigstore), yangilanishlarni review bilan","Har kuni hamma paketni yangilash","Vendor papkaga ko'chirish yetarli"],"a":1,"e":"Real hujumlar: buzilgan paket versiyasi (event-stream), typosquatting, CI credential o'g'irlanishi (Codecov). Go'da module proxy va checksum DB (sum.golang.org) allaqachon kuchli himoya beradi. Qo'shimcha: CI'da sirlarni minimal huquq bilan berish va pull request'lardan sirlarga kirishni bloklash."},{"l":"S","t":"mcq","tp":"AppSec","d":"sec","id":9010,"n":"S11","q":"Login endpoint'ini brute force'dan qanday himoya qilasiz?","o":["Faqat murakkab parol talab qilish","Ko'p qatlam: IP va akkaunt bo'yicha rate limit (exponential backoff), bir necha urinishdan keyin CAPTCHA yoki vaqtinchalik bloklash, buzilgan parollar ro'yxati, MFA; javoblar bir xil bo'lsin — 'user topilmadi' va 'parol xato' farqlanmasin","Login'ni yashirish","Faqat CAPTCHA"],"a":1,"e":"Aniq xabar (user enumeration) hujumchiga mavjud akkauntlar ro'yxatini beradi. Credential stuffing (boshqa saytdan o'g'irlangan parollar) uchun rate limit kam — MFA va buzilgan parol tekshiruvi kuchliroq. Shuningdek: parolni tiklash oqimi ham bir xil himoyalanishi kerak (ko'pincha unutiladi)."},{"l":"S","t":"mcq","tp":"AppSec","d":"sec","id":9011,"n":"S12","q":"Ichki servislar orasidagi aloqani qanday himoyalaysiz (zero trust)?","o":["Ichki tarmoq ishonchli — himoya kerak emas","Har chaqiruv autentifikatsiya qilinadi: mTLS yoki imzolangan servis token'lari, eng kam huquq bilan avtorizatsiya, vaqtinchalik credential (rotatsiya avtomatik), tarmoq siyosati (NetworkPolicy) bilan qo'shimcha cheklov","Faqat VPN yetarli","IP allowlist yetarli"],"a":1,"e":"'Perimetr ichida ishonch' modeli bitta buzilgan pod butun tizimga kirish demakligini anglatadi. Amaliy qadamlar: servis identifikatori (SPIFFE/IRSA), sirlarni Vault/KMS orqali qisqa muddatga berish, audit, va lateral harakatni cheklash uchun segmentatsiya."},{"l":"S","t":"open","tp":"AppSec","d":"sec","id":9012,"n":"S13","q":"Production'da sir (API key) git repozitoriyga tushib ketdi. Qadamlaringiz?","m":["Birinchi navbatda kalitni bekor qilish va yangisini chiqarish (rotatsiya) — tarixni tozalash ikkinchi darajali, chunki kalit allaqachon oshkor","Ta'sirni baholash: kalit nimaga kirish berardi, loglarda suiiste'mol bormi (auth loglari, g'ayrioddiy trafik)","Repo public bo'lganmi, qancha vaqt turgan, forklar va CI keshlari","Tarixni tozalash (git filter-repo) va ochiq fork/kesh egalari bilan ishlash","Oldini olish: pre-commit secret scanner, CI'da skan, sirlarni faqat secret manager orqali berish","Incident sifatida hujjatlashtirish va postmortem"],"e":"Eng ko'p uchraydigan xato — faqat commit'ni o'chirib 'hal bo'ldi' deb hisoblash. Kalit oshkor bo'lgan lahzadan boshlab ishonchsiz. Tezlik muhim: public repoda sirlar bir necha daqiqada avtomatik skanerlar tomonidan topiladi."},{"l":"St","t":"open","tp":"AppSec","d":"sec","id":9013,"n":"S14","q":"Mahsulotga xavfsizlikni qanday tizimli singdirasiz (jarayon sifatida)?","m":["Threat modeling: yangi feature uchun 'kim, nimani, qanday buzishi mumkin' (STRIDE) — dizayn bosqichida","Guardrail'lar: xavfsiz default'lar, markaziy auth kutubxonasi, shablon servis (paved road)","Avtomatlashtirish: SAST/DAST, dependency skan, secret skan, IaC skan — CI'da bloklovchi qoidalar bilan","Ruxsatlar: eng kam huquq, vaqtinchalik kirish (JIT), muntazam ruxsat auditi","Tayyorgarlik: incident response plani, bug bounty yoki tashqi pentest, xavfsizlik incidentlari bo'yicha postmortem","O'lchov: kritik zaifliklarni tuzatish vaqti (MTTR), qoplangan servislar ulushi"],"e":"Staff/Principal signal: xavfsizlikni bitta jamoaning 'darvozaboni' emas, muhandislik jarayonining bir qismi sifatida ko'rish. Eng samarali chora — xavfli narsani qilish qiyin, xavfsizini oson qilib qo'yish."},{"l":"S","t":"mcq","tp":"AppSec","d":"sec","id":30219,"n":"SN220","q":"Fayl yuklash funksiyasi bor. Xavfsizlik nazorati ro'yxati?","o":["Kengaytmani tekshirish yetarli","Hajm va tur cheklovi (mazmun bo'yicha sniffing, kengaytmaga ishonmaslik), fayl nomini normalizatsiya (path traversal), alohida domen/bucket'da saqlash va `Content-Disposition: attachment` bilan berish, `X-Content-Type-Options: nosniff`, antivirus/sandbox skan, imzolangan URL bilan kirish","Faqat hajmni cheklash","Faqat autentifikatsiya"],"a":1,"e":"Eng xavfli ssenariylar: SVG/HTML yuklab XSS (shuning uchun alohida domen yoki attachment), `../../etc/passwd` bilan traversal, ZIP bomb (dekompressiya limiti), va rasm parseridagi zaifliklar. Fayl app serveridan emas, obyekt saqlashdan imzolangan URL bilan berilishi kerak — bu ham xavfsizlik, ham miqyos jihatidan to'g'ri."},{"l":"S","t":"mcq","tp":"AppSec","d":"sec","id":30220,"n":"SN221","q":"Parol tiklash (reset) oqimini xavfsiz qanday quriladi?","o":["Email'ga parolni yuborish","Bir martalik, tasodifiy (128+ bit) token — DB'da hash holida, qisqa TTL (15-60 daqiqa), ishlatilgach bekor qilinadi; javob har doim bir xil ('agar email mavjud bo'lsa yuborildi'), rate limit, tiklashdan keyin barcha sessiyalar bekor qilinadi","Xavfsizlik savoli bilan","Token'ni URL'da `user_id` bilan birga yuborish yetarli"],"a":1,"e":"Detallar muhim: token DB'da ochiq saqlansa DB leak'da hisoblar egallanadi (shuning uchun hash); javob farq qilsa foydalanuvchi mavjudligi oshkor bo'ladi (enumeration); sessiyalar bekor qilinmasa hujumchi kirishda qoladi. Bundan tashqari email o'zgartirishda eski manzilga ogohlantirish yuborilishi kerak."},{"l":"St","t":"mcq","tp":"AppSec","d":"sec","id":30221,"n":"SN222","q":"Ichki admin panel faqat VPN orqasida. Bu yetarlimi?","o":["Ha, ichki tarmoq ishonchli","Yo'q — zero trust: autentifikatsiya va avtorizatsiya har so'rovda, MFA, harakatlar audit log'i, kritik amallarga ikki kishi tasdig'i (four-eyes), va eng kam huquq; VPN faqat qo'shimcha qatlam","Faqat IP allowlist yetarli","Faqat HTTPS yetarli"],"a":1,"e":"VPN kompromis bo'lgan ishchi noutbuki yoki ichki hujumchini to'xtatmaydi, shuningdek SSRF orqali ichki panelga so'rov yuborilishi mumkin. Admin harakatlari (mablag' o'zgartirish, foydalanuvchi ma'lumoti ko'rish) audit qilinishi va PII ko'rish sababini so'rashi kerak — bu compliance talabi ham."},{"l":"S","t":"mcq","tp":"AppSec","d":"sec","id":30273,"n":"SN274","q":"OWASP Top 10'dagi 'Broken Access Control' backend kodida qanday tizimli yopiladi?","o":["Frontendda tugmalarni yashirish","Default-deny: har endpoint uchun aniq ruxsat talabi (middleware/policy), obyekt egaligini ma'lumot qatlamida majburiy filtr bilan tekshirish, ID'ni tokendan olish, va avtotestlar (A foydalanuvchi B resursiga kirishga urinishi)","Faqat JWT tekshirish","Faqat rate limit"],"a":1,"e":"Eng ko'p uchraydigan real zaiflik turi. Amaliy qadamlar: yangi route qo'shilganda ruxsat talabini majburiy qilish (framework darajasida 'auth yo'q' aniq belgilanishi kerak), repository'da tenant filtri, admin endpoint'larini alohida guruhga ajratish, va har PR'da ruxsat testlari. Ko'rish (read) ham access control — ko'pincha faqat yozuv tekshiriladi."},{"l":"S","t":"mcq","tp":"AppSec","d":"sec","id":30274,"n":"SN275","q":"Bog'liqliklardagi zaifliklarni (supply chain) qanday boshqarasiz?","o":["Yiliga bir marta yangilash","Doimiy skan (`govulncheck`, Dependabot/Renovate), lockfile va hash bilan qotirilgan versiyalar, SBOM generatsiyasi, konteyner image skani, va yangilanishni avtomatik PR + CI testi bilan kichik qadamlarda qilish","Faqat productionda tekshirish","Barcha bog'liqliklarni o'zi yozish"],"a":1,"e":"Muhim farq: 'zaiflik bor' va 'zaiflik chaqirilyapti' — `govulncheck` faqat haqiqatda ishlatiladigan yo'llarni ko'rsatadi, shuning uchun shovqin kam va prioritet aniq. Qo'shimcha xatarlar: typosquatting paketlar, `go install` bilan noma'lum manba, va build vaqtidagi skriptlar. Bazaviy image'larni muntazam yangilash ham shu ishning bir qismi."},{"l":"S","t":"mcq","tp":"AppSec","d":"sec","id":30275,"n":"SN276","q":"Log'larda shaxsiy ma'lumot (PII) va sirlar bo'lmasligini qanday ta'minlanadi?","o":["Ishonch bilan — dasturchilar yozmaydi","Strukturaviy logger'da maydon darajasida maskalash (karta, token, parol, email siyosatga qarab), `String()`/`MarshalJSON` metodlarida maxfiy maydonlarni yashirish, request/response body'ni to'liq log qilmaslik, va CI'da sirlarni aniqlash skani","Log'larni butunlay o'chirish","Faqat production'da maskalash"],"a":1,"e":"Amaliy usul: maxfiy turlar uchun maxsus tip (`type Token string` + `func (t Token) String() string { return \"[REDACTED]\" }`) — tasodifiy `%v` bilan chiqib ketmaydi. Shuningdek xato matnlariga query parametrlari va URL'dagi tokenlar tushishini tekshirish, retention siyosati va log'larga kirish nazorati (GDPR talablari)."},{"l":"S","t":"mcq","tp":"AppSec","d":"sec","id":30369,"n":"SN370","q":"Fayl yuklash funksiyasi bor. Xavfsizlik nazorati ro'yxati?","o":["Kengaytmani tekshirish yetarli","Hajm va tur cheklovi (mazmun bo'yicha sniffing, kengaytmaga ishonmaslik), fayl nomini normalizatsiya (path traversal), alohida domen/bucket'da saqlash va `Content-Disposition: attachment` bilan berish, `X-Content-Type-Options: nosniff`, antivirus/sandbox skan, imzolangan URL bilan kirish","Faqat hajmni cheklash","Faqat autentifikatsiya"],"a":1,"e":"Eng xavfli ssenariylar: SVG/HTML yuklab XSS (shuning uchun alohida domen yoki attachment), `../../etc/passwd` bilan traversal, ZIP bomb (dekompressiya limiti), va rasm parseridagi zaifliklar. Fayl app serveridan emas, obyekt saqlashdan imzolangan URL bilan berilishi kerak — bu ham xavfsizlik, ham miqyos jihatidan to'g'ri."},{"l":"S","t":"mcq","tp":"AppSec","d":"sec","id":30370,"n":"SN371","q":"Parol tiklash (reset) oqimini xavfsiz qanday quriladi?","o":["Email'ga parolni yuborish","Bir martalik, tasodifiy (128+ bit) token — DB'da hash holida, qisqa TTL (15-60 daqiqa), ishlatilgach bekor qilinadi; javob har doim bir xil ('agar email mavjud bo'lsa yuborildi'), rate limit, tiklashdan keyin barcha sessiyalar bekor qilinadi","Xavfsizlik savoli bilan","Token'ni URL'da `user_id` bilan birga yuborish yetarli"],"a":1,"e":"Detallar muhim: token DB'da ochiq saqlansa DB leak'da hisoblar egallanadi (shuning uchun hash); javob farq qilsa foydalanuvchi mavjudligi oshkor bo'ladi (enumeration); sessiyalar bekor qilinmasa hujumchi kirishda qoladi. Bundan tashqari email o'zgartirishda eski manzilga ogohlantirish yuborilishi kerak."},{"l":"St","t":"mcq","tp":"AppSec","d":"sec","id":30371,"n":"SN372","q":"Ichki admin panel faqat VPN orqasida. Bu yetarlimi?","o":["Ha, ichki tarmoq ishonchli","Yo'q — zero trust: autentifikatsiya va avtorizatsiya har so'rovda, MFA, harakatlar audit log'i, kritik amallarga ikki kishi tasdig'i (four-eyes), va eng kam huquq; VPN faqat qo'shimcha qatlam","Faqat IP allowlist yetarli","Faqat HTTPS yetarli"],"a":1,"e":"VPN kompromis bo'lgan ishchi noutbuki yoki ichki hujumchini to'xtatmaydi, shuningdek SSRF orqali ichki panelga so'rov yuborilishi mumkin. Admin harakatlari (mablag' o'zgartirish, foydalanuvchi ma'lumoti ko'rish) audit qilinishi va PII ko'rish sababini so'rashi kerak — bu compliance talabi ham."},{"l":"St","t":"mcq","tp":"AppSec","d":"sec","id":30476,"n":"SN477","q":"Ko'p tenant'li tizimda ma'lumot izolyatsiyasini qanday isbotlaysiz (nafaqat ta'minlaysiz)?","o":["Kod review yetarli","Avtomatlashtirilgan tekshiruvlar: har endpoint uchun cross-tenant test (A tokeni bilan B resursi — 404/403), RLS yoqilganini migratsiya testi bilan tekshirish, query loglarida tenant filtri yo'q so'rovlarni aniqlash, va davriy ma'lumot auditi (tenant bo'yicha qatorlar sanog'i)","Faqat penetration test","Faqat WAF"],"a":1,"e":"Isbot muhim, chunki bitta yangi endpoint butun izolyatsiyani buzadi. Amaliy vositalar: repository qatlamida tenant kontekstisiz query'ni kompilyatsiya/runtime'da bloklash, PostgreSQL RLS (`FORCE ROW LEVEL SECURITY`), va CI'dagi 'tenant matrix' testlari. Bu SOC2/ISO auditlarida ham talab qilinadigan dalil."},{"l":"S","t":"mcq","tp":"Security gotcha","d":"sec","id":17018,"n":"E56","q":"JWT tekshirishda eng xavfli xato qaysi?","o":["Token'dagi `alg` header'iga ishonish — hujumchi alg=none yoki HS256 (public key'ni secret sifatida) yuborishi mumkin; kutilgan algoritm serverda qat'iy belgilanadi","exp'ni tekshirmaslik","Token'ni log qilish","Uzun token"],"a":0,"e":"Kutubxonaga algoritmni o'zi tanlashiga ruxsat bermang: jwt.WithValidMethods([]string{\"RS256\"}) kabi cheklov qo'ying. Yana tekshirilishi kerak: exp, nbf, iss, aud, kid (key rotation), va imzo kaliti manbai (JWKS keshlash + TTL). Muhim: JWT'ni bekor qilib bo'lmaydi — logout/ban uchun qisqa TTL + refresh token yoki jti deny-list kerak.","src":"https://datatracker.ietf.org/doc/html/rfc8725"},{"l":"S","t":"code","tp":"Security gotcha","d":"sec","id":17019,"n":"E57","q":"Bu kod nega noto'g'ri?","c":"if userToken == storedToken {\n    allow()\n}","o":["Oddiy `==` string taqqoslash erta chiqadi — timing attack orqali sir bayt-bayt topilishi mumkin; hmac.Equal yoki subtle.ConstantTimeCompare kerak","Xato yo'q","crypto/md5 kerak","Faqat parol uchun muhim"],"a":0,"e":"API kaliti, HMAC imzosi, CSRF token kabi sirlar constant-time solishtiriladi: hmac.Equal(a, b). Parol uchun esa umuman boshqa: Argon2id yoki bcrypt bilan hash va o'sha kutubxonaning tekshiruv funksiyasi (u allaqachon constant-time). Webhook imzosini tekshirishda ham hmac.Equal + timestamp tolerance (replay himoyasi)."},{"l":"P","t":"mcq","tp":"Security gotcha","d":"sec","id":17020,"n":"E58","q":"Foydalanuvchi bergan URL'ga so'rov yuboradigan feature (webhook, avatar import). Asosiy xavf?","o":["SSRF — ichki tarmoq va cloud metadata endpoint'iga (169.254.169.254) kirish; DNS rebinding sababli faqat URL tekshiruvi yetarli emas, IP'ni ulanish paytida tekshirish va redirect'larni cheklash kerak","XSS","SQL injection","CSRF"],"a":0,"e":"To'liq himoya: allow-list domenlar; ruxsat etilmagan IP diapazonlari (RFC1918, loopback, link-local, IPv6 mapped) ni DialContext ichida (Control funksiyasi) tekshirish — chunki DNS javobi tekshiruvdan keyin o'zgarishi mumkin (rebinding); redirect'ni o'chirish yoki har hop'ni qayta tekshirish; alohida tarmoq segmenti/egress proxy; IMDSv2 talab qilish. Javob mazmunini foydalanuvchiga qaytarish ham ma'lumot sizishi (blind emas) demak.","src":"https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html"},{"l":"S","t":"mcq","tp":"Security gotcha","d":"sec","id":17021,"n":"E59","q":"ORM ishlatyapsiz — SQL injection mumkinmi?","o":["Ha: raw query, string bilan qurilgan ORDER BY / jadval nomi / IN ro'yxati parametrlashtirib bo'lmaydigan joylar; ular allow-list bilan tekshiriladi","Yo'q, ORM to'liq himoyalaydi","Faqat MySQL'da","Faqat eski ORM'larda"],"a":0,"e":"Parametr faqat QIYMAT o'rnida ishlaydi — identifikator (ustun/jadval nomi) va yo'nalish (ASC/DESC) uchun emas. Ular uchun qat'iy allow-list (ruxsat etilgan ustunlar map'i) ishlatiladi. Go'da: `db.Query(\"... WHERE id = $1\", id)` to'g'ri; fmt.Sprintf bilan qurish xato. `IN` uchun pq.Array/pgx'da = ANY($1) ishlatiladi."},{"l":"S","t":"mcq","tp":"Security gotcha","d":"sec","id":30105,"n":"SN106","q":"Parol taqqoslash `if hmac == expected` (string ==) bilan yozilgan. Muammo?","o":["Muammo yo'q","Timing attack: `==` birinchi farqda to'xtaydi va vaqt farqi sirni bit-bit tiklashga yo'l beradi; `hmac.Equal`/`subtle.ConstantTimeCompare` ishlatiladi","Faqat uzunlik tekshirilmagan","Unicode muammosi"],"a":1,"e":"Amaliyotda tarmoq shovqini hujumni qiyinlashtiradi, lekin bu himoya emas — mahalliy yoki ko'p o'lchovli hujumda ishlaydi. Qoida: har qanday sir/token/HMAC taqqoslashda constant-time funksiya. Parol uchun esa taqqoslash umuman boshqacha: `bcrypt/argon2.CompareHashAndPassword` (hash ichida solt va narx)."},{"l":"St","t":"mcq","tp":"Security gotcha","d":"sec","id":30106,"n":"SN107","q":"Servis foydalanuvchi bergan URL'ga so'rov qiladi (webhook test, rasm yuklash). Qanday zaifli
