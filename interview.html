<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Interview Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#eef2f1; --panel:#ffffff; --ink:#15211f; --muted:#5b6b68; --line:#d5dedb;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#d7efec;
  --code-bg:#12201e; --code-ink:#d6ebe7;
  --ok:#15803d; --ok-soft:#dcf3e3; --bad:#b91c1c; --bad-soft:#fbe3e3; --mid:#b45309; --mid-soft:#fbeed8;
  --sans:"Manrope",system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1413; --panel:#141f1d; --ink:#e3eeeb; --muted:#93a7a2; --line:#263633;
  --accent:#2dd4bf; --accent-ink:#06201d; --accent-soft:#123a36;
  --code-bg:#071010; --code-ink:#cfe7e2;
  --ok:#4ade80; --ok-soft:#12321f; --bad:#f87171; --bad-soft:#3a1616; --mid:#fbbf24; --mid-soft:#3a2a0f;
}}
:root[data-theme="dark"]{
  --bg:#0c1413; --panel:#141f1d; --ink:#e3eeeb; --muted:#93a7a2; --line:#263633;
  --accent:#2dd4bf; --accent-ink:#06201d; --accent-soft:#123a36;
  --code-bg:#071010; --code-ink:#cfe7e2;
  --ok:#4ade80; --ok-soft:#12321f; --bad:#f87171; --bad-soft:#3a1616; --mid:#fbbf24; --mid-soft:#3a2a0f;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:start}
@media (max-width:820px){.wrap{grid-template-columns:1fr}}
header.top{max-width:1080px;margin:0 auto 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0}
h1 span{font-family:var(--mono);font-weight:600;color:var(--accent);font-size:.8em}
.sub{color:var(--muted);margin:0;font-size:14px}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:grid;gap:18px}
@media (max-width:820px){aside{position:static}}
.group h3{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 13px var(--sans);padding:5px 10px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:focus-visible,.btn:focus-visible,.opt:focus-visible,textarea:focus-visible,.dot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.acc{display:grid;gap:6px}
.acc-all{text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:700 13px var(--sans);padding:8px 12px;border-radius:8px;cursor:pointer}
.acc-all[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.acc-item{border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.acc-item.on{border-color:var(--accent)}
.acc-item summary{list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 12px;cursor:pointer;font-weight:700;font-size:13px}
.acc-item summary::-webkit-details-marker{display:none}
.acc-item summary::before{content:"▸";color:var(--muted);margin-right:6px;transition:transform .15s}
.acc-item[open] summary::before{transform:rotate(90deg)}
.acc-item summary span{flex:1}
.acc-item summary b{font:600 11px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.acc-item summary:focus-visible,.acc-all:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.acc-body{display:grid;gap:6px;padding:0 10px 10px}
.acc-dom>summary{font-size:14px;letter-spacing:.01em}
.acc-dom .acc-item{background:var(--bg)}
.acc-item .chips{padding:0 2px 2px}
.acc-item .chip{font-size:12px;padding:4px 9px}
.stats{display:grid;gap:6px;font-size:13px}
.srow{display:grid;grid-template-columns:70px 1fr 48px;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.srow b{text-align:right;font-weight:600;color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dot{width:22px;height:22px;border-radius:5px;border:1px solid var(--line);background:var(--panel);font:600 10px var(--mono);color:var(--muted);cursor:pointer;padding:0}
.dot.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.dot.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.dot.mid{background:var(--mid-soft);border-color:var(--mid);color:var(--mid)}
.dot.cur{outline:2px solid var(--ink);outline-offset:1px}
main.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;min-width:0}
@media (max-width:500px){main.card{padding:18px}}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;font-size:12px}
.tag{font:600 11px var(--mono);padding:3px 8px;border-radius:4px;background:var(--accent-soft);color:var(--ink);letter-spacing:.02em}
.tag.lvl{background:var(--ink);color:var(--panel)}
.meta .pos{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 14px;text-wrap:balance}
pre{background:var(--code-bg);color:var(--code-ink);font:13px/1.55 var(--mono);padding:14px 16px;border-radius:8px;overflow-x:auto;margin:0 0 16px;white-space:pre}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 15px/1.5 var(--sans);padding:11px 14px;border-radius:9px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font:600 12px var(--mono);width:24px;height:24px;display:grid;place-items:center;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.opt code,.exp code,.q code{font-family:var(--mono);font-size:.88em;background:var(--accent-soft);padding:1px 5px;border-radius:4px}
textarea{width:100%;min-height:130px;resize:vertical;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);padding:12px}
textarea.sql{font-family:var(--mono);font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:700 14px var(--sans);padding:9px 16px;border-radius:8px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:default}
.spacer{flex:1}
.hint{font-size:12px;color:var(--muted)}
.verdict{margin-top:18px;padding:12px 14px;border-radius:9px;font-weight:700}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict.mid{background:var(--mid-soft);color:var(--mid)}
.exp{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}
.exp h4{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.exp p{margin:0 0 10px;max-width:68ch;white-space:pre-line}
.exp ul{margin:0 0 12px;padding-left:20px}
.src{font-size:12px;color:var(--muted);word-break:break-all;margin:0 0 4px}
.src a{color:var(--accent);font-weight:700}
.src span{opacity:.75}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.keys span{font:600 12px var(--mono);padding:2px 8px;border-radius:4px;border:1px solid var(--line)}
.keys span.hit{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.keys span.miss{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.self{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
@media (prefers-reduced-motion:no-preference){.opt,.chip,.btn{transition:background .15s,border-color .15s}}
</style>

<header class="top">
  <div>
    <h1>Interview Drill <span>1207 savol</span></h1>
    <p class="sub">Junior → Principal · ABC, kod, SQL yozish, ochiq savol · tekshirgandan keyin izoh</p>
  </div>
  <p class="sub">Klaviatura: <b>1–4</b> tanlash · <b>Enter</b> tekshirish · <b>← →</b> savol</p>
</header>

<div class="wrap">
  <aside>
    <div class="group"><h3>Bo'limlar</h3><div class="acc" id="acc"></div></div>
    <div class="group"><h3>Daraja</h3><div class="chips" id="f-lvl"></div></div>
    <div class="group"><h3>Savol turi</h3><div class="chips" id="f-type"></div></div>
    <div class="group"><h3>Ko'rsatish</h3><div class="chips" id="f-show"></div></div>
    <div class="group"><h3>Natija (daraja bo'yicha)</h3><div class="stats" id="stats"></div></div>
    <div class="group"><h3>Savollar</h3><div class="dots" id="dots"></div></div>
    <div class="group"><button class="btn" id="reset" type="button">Natijani tozalash</button></div>
  </aside>
  <main class="card" id="card"></main>
</div>

<script>
const LV={J:"Junior",M:"Middle",S:"Senior",St:"Staff",P:"Principal"};
const TY={mcq:"ABC",code:"Kod",sql:"SQL yoz",open:"Ochiq"};
const Q=[{"l":"J","t":"mcq","tp":"Basics","d":"go","id":3000,"n":"G1","q":"Go'da array va slice farqi?","o":["Bir xil","Array — uzunligi tipning bir qismi ([3]int va [4]int — turli tiplar), qiymat sifatida nusxalanadi. Slice — array ustidagi ko'rinish: {pointer, len, cap} strukturasi, nusxalanganda ham bir xil massivga ishora qiladi","Slice o'zgarmas","Array faqat funksiya ichida ishlatiladi"],"a":1,"e":"Slice'ni funksiyaga bersangiz, struct nusxalanadi, lekin ichidagi pointer bir xil — elementni o'zgartirsangiz chaqiruvchida ham ko'rinadi. append esa cap yetmasa yangi massiv yaratadi va bog'liqlik uziladi — shuning uchun append natijasini doim qaytarib o'zlashtirish kerak: s = append(s, x).","src":"https://go.dev/blog/slices-intro"},{"l":"J","t":"code","tp":"Basics","d":"go","id":3001,"n":"G2","q":"Nima chop etiladi?","c":"a := []int{1, 2, 3}\nb := a[:2]\nb = append(b, 99)\nfmt.Println(a, b)","o":["[1 2 3] [1 2 99]","[1 2 99] [1 2 99]","[1 2 3] [1 2 3 99]","panic"],"a":1,"e":"b ning len=2, cap=3 — a bilan bir xil massivni bo'lishadi. append cap ichida joy topgani uchun yangi massiv yaratmaydi, a[2] ni 99 ga yozadi. Shuning uchun a = [1 2 99]. Buning oldini olish: b := a[:2:2] (cap ni cheklash, 'full slice expression') yoki nusxa olish (slices.Clone). Bu Go'dagi eng ko'p uchraydigan nozik xatolardan biri.","src":"https://go.dev/blog/slices"},{"l":"J","t":"mcq","tp":"Basics","d":"go","id":3002,"n":"G3","q":"<code>make</code> va <code>new</code> farqi?","o":["Bir xil","make — faqat slice, map va channel uchun: ularni initsializatsiya qilib, tayyor qiymat qaytaradi. new(T) — nol qiymatli T uchun memory ajratib, *T pointer qaytaradi","new faqat struct uchun","make pointer qaytaradi"],"a":1,"e":"var m map[string]int (yoki new(map...)) — nil map: o'qish mumkin, yozish panic beradi ('assignment to entry in nil map'). m := make(map[string]int) — ishlaydi. Slice uchun nil slice (var s []int) foydalanish mumkin: append nil slice'ga ishlaydi, len=0 va JSON'da null bo'ladi."},{"l":"M","t":"code","tp":"Basics","d":"go","id":3003,"n":"G4","q":"Go 1.22 va undan yuqori versiyada nima chop etiladi?","c":"var fns []func()\nfor i := 0; i < 3; i++ {\n    fns = append(fns, func() { fmt.Print(i, \" \") })\n}\nfor _, f := range fns { f() }","o":["0 1 2","3 3 3","0 0 0","Kompilyatsiya xatosi"],"a":0,"e":"Go 1.22 dan boshlab sikl o'zgaruvchisi har iteratsiyada yangi yaratiladi — closure'lar 0, 1, 2 ni ko'radi. Go 1.21 va undan oldin bitta o'zgaruvchi bo'lgan va natija '3 3 3' edi; buning uchun i := i deb nusxa olish yoki parametr sifatida uzatish kerak edi. Intervyuda ikkala xulqni ham va qaysi versiyadan o'zgarganini bilish kuchli signal. Eslatma: xulq modul go.mod dagi 'go' versiyasiga bog'liq.","src":"https://go.dev/blog/loopvar-preview"},{"l":"M","t":"code","tp":"Errors","d":"go","id":3004,"n":"G5","q":"Nima chop etiladi?","c":"type MyErr struct{}\nfunc (e *MyErr) Error() string { return \"boom\" }\n\nfunc do() error {\n    var p *MyErr = nil\n    return p            // nil pointer, lekin error interfeysi ichida\n}\n\nfunc main() {\n    if err := do(); err != nil {\n        fmt.Println(\"xato bor:\", err == nil)\n    } else {\n        fmt.Println(\"xato yo'q\")\n    }\n}","o":["xato yo'q","xato bor: false","panic","Kompilyatsiya xatosi"],"a":1,"e":"Interfeys qiymati ikki qismdan iborat: (tip, qiymat). Bu yerda tip = *MyErr, qiymat = nil — shuning uchun interfeys nil EMAS. 'typed nil' muammosi. To'g'ri yozish: funksiya xato yo'q bo'lsa aniq 'return nil' qilsin, konkret pointer tipini error sifatida qaytarmasin. go vet va staticcheck buni ba'zan ushlaydi.","src":"https://go.dev/doc/faq#nil_error"},{"l":"M","t":"mcq","tp":"Basics","d":"go","id":3005,"n":"G6","q":"<code>defer</code> haqida qaysi to'g'ri?","o":["defer funksiya oxirida argumentlarni hisoblaydi","defer chaqirilgan paytda argumentlar darhol hisoblanadi, chaqiruvning o'zi funksiya qaytishida LIFO (oxirgi kiritilgan birinchi) tartibda bajariladi","defer panic bo'lsa bajarilmaydi","defer sikl ichida ishlamaydi"],"a":1,"e":"i := 0; defer fmt.Println(i); i++ → 0 chop etadi. defer panic paytida ham bajariladi (recover shuning uchun ishlaydi). Tuzoq: sikl ichida defer f.Close() — fayllar funksiya tugagunchaishlamaydi yopilmaydi; sikl tanasini alohida funksiyaga chiqaring. Yana: defer named return qiymatini o'zgartira oladi."},{"l":"S","t":"open","tp":"Errors","d":"go","id":3014,"n":"G15","q":"Go'da xatolarni qanday boshqarasiz: wrapping, sentinel, custom tiplar?","m":["Xato — oddiy qiymat: tekshirib, kontekst qo'shib yuqoriga uzatiladi","Wrapping: fmt.Errorf(\"user yuklab bo'lmadi: %w\", err) — zanjir saqlanadi","Tekshirish: errors.Is(err, ErrNotFound) — sentinel uchun; errors.As(err, &myErr) — tipga ko'ra ma'lumot olish uchun","Sentinel xatolar paket API'sining bir qismi — o'ylab e'lon qilinadi (var ErrNotFound = errors.New(...))","Xato matnini string sifatida solishtirmaslik; har qatlamda bir marta loglash (pastda log + yuqorida log = takror)","panic faqat dastur mantig'i buzilganda; kutilgan holatlar uchun emas"],"e":"Senior signal: %w va %v farqi (%w zanjirni saqlaydi va errors.Is ishlaydi), va xatoni qayerda log qilish qarori (odatda eng yuqori qatlamda, qolganida kontekst qo'shib uzatish).","src":"https://go.dev/blog/go1.13-errors"},{"l":"M","t":"mcq","tp":"Interfaces","d":"go","id":3019,"n":"G20","q":"Go'da interfeys qanday amalga oshiriladi (implement qilinadi)?","o":["implements key so'zi bilan","Implicit: tip interfeysdagi metodlarga ega bo'lsa, uni avtomatik qanoatlantiradi — e'lon qilish shart emas","Faqat embedding orqali","Faqat pointer tiplar uchun"],"a":1,"e":"Shuning uchun interfeys iste'molchi (consumer) tomonida e'lon qilinadi, ishlab chiqaruvchi paketda emas — 'accept interfaces, return structs'. Kichik interfeyslar afzal (io.Reader — bitta metod). Nozik nuqta: metod pointer receiver bilan bo'lsa, faqat *T interfeysni qanoatlantiradi, T emas.","src":"https://go.dev/doc/effective_go#interfaces"},{"l":"M","t":"code","tp":"Methods","d":"go","id":11006,"n":"M7","q":"Nima chop etiladi?","c":"type C struct{ n int }\nfunc (c C) IncVal()  { c.n++ }\nfunc (c *C) IncPtr() { c.n++ }\n\nc := C{}\nc.IncVal(); c.IncVal(); c.IncPtr()\nfmt.Println(c.n)","o":["3","1 — value receiver nusxa ustida ishlaydi (o'zgarish yo'qoladi), faqat pointer receiver asl qiymatni o'zgartiradi","0","Kompilyatsiya xatosi"],"a":1,"e":"c.IncPtr() yozilishi mumkin, chunki c — manzillanadigan (addressable) o'zgaruvchi va Go uni avtomatik (&c).IncPtr() ga aylantiradi. Lekin map elementida (m[\"k\"].IncPtr()) bu ishlamaydi — manzil olib bo'lmaydi, kompilyatsiya xatosi. Qoida: tipni o'zgartiradigan yoki katta struct metodlari — pointer receiver."},{"l":"M","t":"code","tp":"Methods","d":"go","id":11007,"n":"M8","q":"Embedding bilan nima bo'ladi?","c":"type Base struct{ ID int }\nfunc (b Base) Describe() string { return \"base\" }\n\ntype User struct {\n    Base\n    Name string\n}\nu := User{Base{7}, \"Ali\"}\nfmt.Println(u.ID, u.Describe())","o":["Kompilyatsiya xatosi","7 base — embed qilingan tipning maydon va metodlari tashqi tipga ko'tariladi (promotion), lekin bu meros emas: Base metodida User haqida hech qanday ma'lumot yo'q","0 base","7 user"],"a":1,"e":"Farqi muhim: agar User ham Describe() yozsa, u Base'nikini soya qiladi (override emas — shunchaki nomi ustun). Base ichidan User metodini chaqirib bo'lmaydi (virtual chaqiruv yo'q) — shuning uchun 'template method' pattern Go'da interfeys va kompozitsiya bilan quriladi. Embed qilingan interfeys esa metodlarni delegatsiya qiladi.","src":"https://go.dev/doc/effective_go#embedding"},{"l":"S","t":"code","tp":"Methods","d":"go","id":11008,"n":"M9","q":"Bu kod nima qiladi?","c":"type T struct{ n int }\nfunc (t *T) Show() { if t == nil { fmt.Println(\"nil T\"); return }; fmt.Println(t.n) }\n\nvar p *T\np.Show()","o":["panic: nil pointer dereference","'nil T' chop etadi — nil pointer ustida metod chaqirish mumkin, receiver shunchaki nil bo'ladi; panic faqat nil maydonga murojaat qilinganda chiqadi","Kompilyatsiya xatosi","Hech narsa"],"a":1,"e":"Bu amalda ishlatiladi: masalan nil *log.Logger yoki bo'sh daraxt tuguni uchun metodlar. Lekin ehtiyot bo'ling: interfeys ichidagi nil pointer 'typed nil' muammosini beradi (err != nil bo'lib chiqadi). Value receiver'li metodni nil pointer ustida chaqirish esa panic beradi — chunki dereference kerak."},{"l":"S","t":"code","tp":"Methods","d":"go","id":11009,"n":"M10","q":"Bu kodning muammosi nima?","c":"type Money struct{ Cents int64 }\nfunc (m Money) String() string {\n    return fmt.Sprintf(\"%v so'm\", m)\n}","o":["Muammo yo'q","Cheksiz rekursiya va stack overflow: %v Stringer'ni chaqiradi, u yana %v ni chaqiradi. Tuzatish: maydonni chop etish — fmt.Sprintf(\"%d so'm\", m.Cents)","Kompilyatsiya xatosi","Money pointer bo'lishi kerak"],"a":1,"e":"Klassik tuzoq. Xuddi shu Error() metodida ham bo'ladi. Xavfsiz yo'l: formatda aniq maydonlarni ishlatish yoki tipni almashtirish (type alias T2 T; fmt.Sprintf(\"%v\", T2(m))). Eslatma: String() value receiver bilan bo'lsa, %v ham value, ham pointer uchun ishlaydi; pointer receiver bo'lsa — faqat pointer uchun."},{"l":"S","t":"mcq","tp":"Methods","d":"go","id":11010,"n":"M11","q":"Method value va method expression farqi?","o":["Bir xil","Method value — <code>f := u.Describe</code>: receiver qiymati shu paytda qotib qoladi (bind bo'ladi). Method expression — <code>f := User.Describe</code>: receiver birinchi argumentga aylanadi, f(u) deb chaqiriladi","Method value kompilyatsiya bo'lmaydi","Faqat interfeyslarda ishlaydi"],"a":1,"e":"Nozik nuqta: method value receiver nusxasini o'sha lahzada oladi — keyin u o'zgarsa, chaqiruv eski qiymatni ko'radi (pointer receiver bo'lsa manzil bog'lanadi). Bu callback va defer bilan birga kutilmagan natija beradi: defer u.Describe() argumentlarni darhol hisoblaydi."},{"l":"S","t":"mcq","tp":"Basics","d":"go","id":13014,"n":"K15","q":"Go generics (type parameters) qachon ishlatiladi?","o":["Har joyda, interfeys o'rniga","Bir xil mantiq turli tiplar uchun takrorlanganda (Map/Filter, to'plam, kesh, min/max): tip xavfsizligi saqlanadi va any + type assertion kerak bo'lmaydi. Xulq tipga qarab o'zgarishi kerak bo'lsa — interfeys to'g'ri tanlov","Generics Go'da yo'q","Generics faqat struct uchun"],"a":1,"e":"Cheklovlar (constraints) bilan ishlaydi: any, comparable, yoki o'z interfeysingiz (~int | ~float64). Kamchiliklari: kod o'qilishi murakkablashadi, ba'zi hollarda performance yutuq bermaydi. Go jamoasining maslahati: avval oddiy kod yozing, takrorlanish haqiqatan og'riq bo'lganda generics kiriting.","src":"https://go.dev/blog/intro-generics"},{"l":"S","t":"mcq","tp":"Basics","d":"go","id":13015,"n":"K16","q":"Reflection (reflect paketi) haqida to'g'ri gap?","o":["Har joyda ishlatish kerak — moslashuvchan","Kuchli, lekin qimmat va kompilyatsiya tekshiruvidan chetda: tiplar xatosi ishlash vaqtida chiqadi. Asosan kutubxonalarda ishlatiladi (JSON marshalling, ORM, validatsiya); ilova kodida iloji boricha kamroq","Reflection kompilyatsiyada bajariladi","Reflection generics bilan almashtirilgan"],"a":1,"e":"Alternativalar: interfeys bilan polimorfizm, kod generatsiyasi (go generate, sqlc, easyjson), generics. Agar reflect ishlatsangiz — natijani keshlang (masalan struct maydonlari ma'lumotini bir marta hisoblab). Reflection ko'p ishlatilgan joy odatda profil natijasida yuqorida turadi."},{"l":"M","t":"mcq","tp":"Basics","d":"go","id":13017,"n":"K18","q":"Paket initsializatsiyasi va <code>init()</code> tartibi qanday?","o":["init() main'dan keyin ishlaydi","Avval import qilingan paketlar (bog'liqlik tartibida), har paket ichida o'zgaruvchilar bog'liqligi bo'yicha, keyin init() funksiyalari (bir faylda tartib bo'yicha, fayllar odatda nom tartibida), eng oxirida main()","Faqat bitta init() bo'lishi mumkin","init() ni qo'lda chaqirish kerak"],"a":1,"e":"Nima uchun ehtiyot bo'lish kerak: init() da xatoni qaytarib bo'lmaydi (faqat panic), test uchun almashtirib bo'lmaydi, va tartibga bog'liq nozik buglar paydo bo'ladi. Amaliy maslahat: init() ni faqat registratsiya (masalan drayver ro'yxatga olish) uchun ishlating, ulanish va konfiguratsiya main'da aniq qilinsin."},{"l":"M","t":"mcq","tp":"Errors","d":"go","id":13018,"n":"K19","q":"<code>panic</code> va <code>recover</code> qachon ishlatiladi?","o":["Har xato uchun panic qilish qulay","panic — dastur mantig'i buzilgan, davom etish ma'nosiz bo'lgan holatlar uchun (nil dereference, imkonsiz holat). Kutiladigan xatolar error bilan qaytariladi. recover — faqat chegarada (HTTP middleware, worker sikli) dasturni tirik saqlash uchun","recover har joyda chaqirilishi kerak","panic goroutine'ni to'xtatadi, dastur ishlayveradi"],"a":1,"e":"recover faqat defer ichida va o'sha goroutine'da ishlaydi. Middleware'da recover qilinganda: stack trace bilan loglash, 500 qaytarish va alert. Kutubxona yozayotgan bo'lsangiz panic'ni tashqariga chiqarmang — error ga aylantiring."},{"l":"S","t":"mcq","tp":"Interfaces","d":"go","id":13021,"n":"K22","q":"Interfeys qiymati ichkarida qanday saqlanadi?","o":["Faqat qiymat nusxasi","Ikki so'zli struktura: tip ma'lumoti (itab — metod jadvali bilan) va ma'lumotga pointer. Shuning uchun nil bo'lmagan tip + nil qiymat = nil bo'lmagan interfeys (typed nil), va interfeys orqali chaqiruv dinamik (inline qilish qiyinroq)","Interfeys metodlarni nusxalaydi","Interfeys har doim heap'da"],"a":1,"e":"Amaliy natijalar: qiymatni interfeysga solish ko'pincha heap allokatsiya beradi (escape analysis); issiq sikllarda konkret tip bilan ishlash tezroq. Lekin avval o'lchang — ko'p hollarda farq sezilmaydi va interfeys kodni soddalashtiradi."},{"l":"S","t":"mcq","tp":"Interfaces","d":"go","id":14025,"n":"SR26","q":"Go'da mock va fake farqi — qaysi biri afzal?","o":["Mock har doim afzal","Fake — soddalashtirilgan real implementatsiya (masalan xotiradagi repository): testni xulq bo'yicha tekshiradi va refactor'ga chidamli. Mock — chaqiruvlarni tekshiradi: implementatsiyaga bog'lanib qoladi. Ko'p holatda fake afzal, mock — faqat o'zaro ta'sir muhim bo'lganda (masalan email yuborildimi)","Fake sekin ishlaydi","Go'da mock yozib bo'lmaydi"],"a":1,"e":"Go'da kichik interfeyslar tufayli fake yozish arzon. Kod generatsiyasi (mockgen) ham bor, lekin har o'zgarishda qayta generatsiya va mo'rt testlar narxini hisobga oling. Testni 'nima qildi' emas, 'qanday natija berdi' bo'yicha yozish — asosiy tamoyil."},{"l":"S","t":"mcq","tp":"Basics","d":"go","id":14026,"n":"SR27","q":"Go'da bog'liqliklarni ulash (dependency injection) qanday qilinadi?","o":["Framework majburiy (Spring kabi)","Odatda qo'lda: konstruktorlarga interfeys uzatiladi, hamma narsa main'da ulanadi; katta loyihada wire (kompilyatsiya vaqtida generatsiya) yoki fx ishlatilishi mumkin. Global o'zgaruvchilar va init() — tavsiya etilmaydi","Reflection bilan avtomatik","Har paket o'z bog'liqligini o'zi yaratadi"],"a":1,"e":"Nima uchun qo'lda DI Go'da qulay: bog'liqlik grafi kodda ko'rinadi, kompilyator tekshiradi, testda almashtirish oson. Runtime DI konteynerlari xatoni ishga tushirish vaqtiga suradi — Go falsafasiga zid."},{"l":"S","t":"code","tp":"Basics","d":"go","id":14027,"n":"SR28","q":"JSON'da <code>null</code> va maydonning umuman yo'qligini qanday ajratasiz?","c":"type Patch struct {\n    Name *string `json:\"name\"`   // ?\n    Age  int     `json:\"age\"`\n}","o":["Farqi yo'q","Pointer (*string) bilan: maydon yo'q bo'lsa nil, null kelsa ham nil — to'liq ajratish uchun json.RawMessage yoki maxsus tip (Optional[T]) va UnmarshalJSON kerak; Age int esa 0 va 'yo'q' ni ajrata olmaydi","Faqat map[string]any bilan mumkin","omitempty buni hal qiladi"],"e":"Bu PATCH endpoint'larida real muammo: 'maydonni o'zgartirma' va 'maydonni tozalab qo'y' farqlanishi kerak. Yechimlar: pointer + alohida 'fields' ro'yxati, JSON Merge Patch semantikasi, yoki har maydon uchun Optional[T] tipi (Set bool bilan)."},{"l":"S","t":"mcq","tp":"Errors","d":"go","id":15005,"n":"GS6","q":"Go 1.20+ da bir nechta xatoni birga qaytarish uchun nima ishlatiladi?","o":["Faqat birinchi xatoni qaytarish","errors.Join(err1, err2, ...) — birlashtirilgan xato; errors.Is/As zanjirning har bo'lagida ishlaydi. fmt.Errorf ham bir nechta %w ni qo'llaydi","Xatolarni string sifatida qo'shish","panic qilish"],"a":1,"e":"Qachon foydali: validatsiya (hamma maydon xatolarini birga qaytarish), parallel ishlar natijasi (errgroup faqat birinchisini qaytaradi — qolganini o'zingiz yig'asiz), va defer'da Close xatosini asosiy xatoga qo'shish. Foydalanuvchiga ko'rsatishda esa xatolarni tuzilgan (structured) holda qaytarish afzal.","src":"https://pkg.go.dev/errors#Join"},{"l":"M","t":"mcq","tp":"Basics","d":"go","id":15009,"n":"GS10","q":"<code>io.Reader</code> va <code>io.Writer</code> nega Go'da shunchalik muhim?","o":["Faqat fayllar uchun","Ular universal kompozitsiya nuqtasi: fayl, tarmoq, bufer, siqish, shifrlash — hammasi bir xil interfeys orqali ulanadi (io.Copy, io.TeeReader, gzip.NewReader). Ma'lumotni xotiraga to'liq yuklamasdan oqim bilan ishlash imkonini beradi","Ular eskirgan","Faqat kichik ma'lumot uchun"],"a":1,"e":"Amaliy misol: fayl → gzip → hash → HTTP body zanjiri bitta o'tishda, qo'shimcha xotirasiz. Shuning uchun funksiya imzosida []byte o'rniga io.Reader qabul qilish ko'pincha yaxshiroq dizayn. io.Copy ichkarida buferni qayta ishlatadi va imkon bo'lsa optimallashtirilgan yo'ldan foydalanadi."},{"l":"S","t":"mcq","tp":"Basics","d":"go","id":15010,"n":"GS11","q":"<code>go:embed</code> nima uchun kerak?","o":["Kodni siqish uchun","Statik fayllarni (shablon, migratsiya, konfiguratsiya, frontend build) binarniki ichiga joylash — deploy bitta fayl bo'ladi va ishga tushirishda fayl yo'li muammosi yo'qoladi","Kutubxona ulash uchun","Faqat test uchun"],"a":1,"e":"Misol: //go:embed migrations/*.sql + embed.FS. Cheklovlar: fayllar paket ichida bo'lishi kerak, yashirin fayllar default kirmaydi, va binar hajmi oshadi. Migratsiya fayllarini embed qilish — deploy xatolarini kamaytiradigan amaliy naqsh."},{"l":"S","t":"mcq","tp":"Basics","d":"go","id":15011,"n":"GS12","q":"Go modullarida versiya tanlash qanday ishlaydi (MVS)?","o":["Har doim eng so'nggi versiya olinadi","Minimal Version Selection: har bog'liqlik uchun talab qilingan MINIMAL versiyalarning eng kattasi tanlanadi — natija takrorlanadigan (reproducible) va o'z-o'zidan yangilanmaydi; yangilash aniq buyruq bilan (go get -u)","Tasodifiy tanlanadi","Faqat go.sum belgilaydi"],"a":1,"e":"Shuning uchun go.mod da versiyani ko'tarish — ongli qaror. go.sum checksum'larni saqlaydi (ta'minot zanjiri himoyasi). v2+ modullar uchun import yo'lida /v2 suffiksi shart. replace — lokal ishlash yoki fork uchun, lekin kutubxona go.mod'idagi replace iste'molchilarga o'tmaydi.","src":"https://research.swtch.com/vgo-mvs"},{"l":"S","t":"mcq","tp":"Basics","d":"go","id":15012,"n":"GS13","q":"Bir nechta modul ustida birga ishlash uchun (monorepo) nima ishlatiladi?","o":["Har safar replace yozish va commit qilish","go.work (workspace, Go 1.18+): lokal modullarni birga ulaydi, go.mod'ga replace yozish shart emas va u commit qilinmaydi","Modullarni birlashtirish","Vendor papka"],"a":1,"e":"go.work odatda git'ga qo'shilmaydi (har dasturchining o'z muhiti). CI esa go.work'siz, aniq versiyalar bilan quradi — shuning uchun lokalda ishlagan narsa CI'da sinmasligi uchun bog'liqlik versiyalari to'g'ri yangilanishi kerak."},{"l":"S","t":"mcq","tp":"Basics","d":"go","id":15015,"n":"GS16","q":"Go 1.22 dan <code>net/http</code> marshrutlashda nima o'zgardi?","o":["Hech narsa, framework kerak","ServeMux endi metod va yo'l shablonlarini qo'llaydi: mux.HandleFunc(\"GET /items/{id}\", h) va r.PathValue(\"id\") — ko'p holatda tashqi router kerak emas","Faqat GET qo'llaniladi","Regexp marshrutlash qo'shildi"],"a":1,"e":"Shablonlar: {id}, {path...} (qolgan yo'l), aniqlik bo'yicha ustunlik qoidalari bor. Tashqi router hali ham foydali bo'lishi mumkin (middleware guruhlari, ko'p imkoniyat), lekin oddiy servis uchun standart kutubxona yetadi — bog'liqlik kamayadi.","src":"https://go.dev/blog/routing-enhancements"},{"l":"S","t":"mcq","tp":"Basics","d":"go","id":15016,"n":"GS17","q":"Go 1.23 dagi iteratorlar (range-over-func) nima?","o":["Yangi sikl sintaksisi, faqat slice uchun","Funksiya ham range ichida ishlatilishi mumkin: iter.Seq[V] va iter.Seq2[K,V] — o'z ma'lumot tuzilmangiz yoki sahifalangan API ustidan standart usulda iteratsiya yozish imkonini beradi (masalan slices.All, maps.Keys)","Generics o'rnini bosadi","Goroutine bilan ishlaydi"],"a":1,"e":"Amaliy foyda: kursorli API yoki daraxt bo'ylab yurishni oddiy for-range bilan ifodalash, oraliq slice yaratmasdan. Diqqat: iterator funksiyasi ichida resurs ochilsa (fayl, rows), uni yopish mas'uliyatini aniq belgilang — yield false qaytarsa sikl erta tugaydi.","src":"https://go.dev/blog/range-functions"},{"l":"M","t":"mcq","tp":"Basics","d":"go","id":15017,"n":"GS18","q":"Go 1.21+ dagi <code>slices</code> va <code>maps</code> paketlari nima beradi?","o":["Hech qanday yangilik, qo'lda yozish kerak","Generic yordamchilar: slices.Contains, Index, Sort, SortFunc, BinarySearch, Clone, Equal; maps.Keys/Values (Go 1.23 dan iterator sifatida). Bu takroriy qo'l kodini va xatolarni kamaytiradi","Faqat int uchun ishlaydi","Uchinchi tomon paketi"],"a":1,"e":"Eslatma: slices.Sort — barqaror emas (SortStableFunc alohida), va slices.Clone sayoz nusxa qiladi. maps.Keys natijasi tartibsiz — kerak bo'lsa saralang: slices.Sorted(maps.Keys(m))."},{"l":"S","t":"mcq","tp":"Interfaces","d":"go","id":15023,"n":"GS24","q":"Interfeyslarni loyihalashda Go uslubi qanday?","o":["Har struct uchun oldindan interfeys yozish","Kichik interfeyslar, iste'molchi paketda e'lon qilinadi va faqat kerak bo'lganda ('accept interfaces, return structs'). Oldindan 'kelajak uchun' interfeys yozish — ortiqcha mavhumlik (interface pollution)","Interfeyslar faqat testda","Katta interfeyslar afzal"],"a":1,"e":"Intervyuda kuchli javob sabab bilan: interfeysni implementatsiya paketida e'lon qilsangiz, iste'molchi keraksiz metodlarga bog'lanadi va mock yozish og'irlashadi. Go'da implicit satisfaction shuni qulay qiladi: kerakli metodlarni sanab, o'zingizga kerakli minimal interfeysni yozasiz."},{"l":"J","t":"code","tp":"Basics","d":"go","id":18000,"n":"GR1","q":"`iota` nima beradi?","c":"type Level int\nconst (\n    Debug Level = iota\n    Info\n    Warn\n    _\n    Fatal\n)\nfmt.Println(Info, Fatal)","o":["1 4","1 3","0 4","Kompilyatsiya xatosi"],"a":0,"e":"iota const blokida 0 dan boshlab har QATORDA oshadi (ifoda takrorlanadi). `_` ham qatorni sarflaydi, shuning uchun Fatal=4. Bitmask uchun tipik shakl: 1 << iota. Maslahat: shunday enum uchun `stringer` generatsiya qiling (go:generate stringer -type=Level), aks holda log'da raqam chiqadi."},{"l":"J","t":"mcq","tp":"Basics","d":"go","id":18001,"n":"GR2","q":"Go'da zero value nima?","o":["Har tip e'lon qilinganda aniq default oladi: 0, \"\", false, nil (pointer/slice/map/chan/func/interface); struct — maydonlari zero","Initsializatsiya qilinmagan o'zgaruvchi tasodifiy qiymatga ega","nil — faqat pointer uchun","Kompilyator initsializatsiyani majburlaydi"],"a":0,"e":"Zero value dizayn printsipi: tip 'zero value bilan ishlatishga tayyor' bo'lishi kerak. Masalan sync.Mutex, bytes.Buffer, sync.WaitGroup e'lon qilinishi bilan ishlaydi. Ammo map bundan mustasno — nil map'ga yozish panic; shuning uchun make() kerak."},{"l":"M","t":"code","tp":"Basics","d":"go","id":18002,"n":"GR3","q":"Nima chop etiladi?","c":"x := 1\nif x := 2; x > 1 {\n    fmt.Println(x)\n}\nfmt.Println(x)","o":["2 1 — if ichidagi `:=` yangi scope'da shadow qiladi","2 2","1 1","Kompilyatsiya xatosi: x qayta e'lon qilingan"],"a":0,"e":"Variable shadowing — eng qiyin topiladigan buglardan biri, ayniqsa `err` bilan: if ... { data, err := f() } ichidagi err tashqaridagisini yopadi va xato jimgina yo'qoladi. Tekshirish: `go vet -vettool=shadow` yoki golangci-lint'dagi govet shadow tekshiruvi."},{"l":"J","t":"code","tp":"Basics","d":"go","id":18003,"n":"GR4","q":"Comma-ok idiomi nimaga kerak?","c":"m := map[string]int{\"a\": 0}\nv, ok := m[\"a\"]\n_, ok2 := m[\"b\"]","o":["v=0 ok=true, ok2=false — kalit yo'qligi bilan qiymati 0 ekanini ajratish uchun","ok har doim true","Faqat channel uchun ishlaydi","Xato qaytaradi"],"a":0,"e":"Comma-ok uch joyda: map o'qish (kalit bormi), channel o'qish (v, ok := <-ch; ok=false — yopilgan va bo'sh), type assertion (v, ok := i.(T) — ok=false bo'lsa panic bo'lmaydi). Ularsiz variant panic beradi yoki noaniqlik qoldiradi."},{"l":"M","t":"code","tp":"Basics","d":"go","id":18004,"n":"GR5","q":"Variadic funksiyaga slice qanday uzatiladi?","c":"func sum(nums ...int) int { ... }\ns := []int{1,2,3}\n// A: sum(s)   B: sum(s...)","o":["B to'g'ri — `s...` slice'ni argumentlarga yoyadi; funksiya ichida nums o'sha backing array'ni ulashadi, o'zgartirsa asl slice o'zgaradi","A to'g'ri","Ikkalasi ham ishlaydi","Variadic faqat interface{} bilan ishlaydi"],"a":0,"e":"Muhim nuans: sum(s...) nusxa yaratmaydi — nums va s bir massivni ko'rsatadi. Funksiya elementlarni o'zgartirsa yoki sort qilsa, chaqiruvchining slice'i ham o'zgaradi. Kerak bo'lsa slices.Clone qiling. Argumentsiz chaqiruvda nums — nil slice."},{"l":"M","t":"code","tp":"Basics","d":"go","id":18005,"n":"GR6","q":"Closure nima qaytaradi?","c":"func counter() func() int {\n    i := 0\n    return func() int { i++; return i }\n}\nc := counter()\nfmt.Println(c(), c())","o":["1 2 — closure i ni havola bo'yicha ushlaydi, u heap'ga escape qiladi","1 1","0 1","panic"],"a":0,"e":"Closure tashqi o'zgaruvchini NUSXA emas, havola bilan ushlaydi va u funksiya yashaganicha tirik qoladi (escape analysis heap'ga ko'chiradi). Ogohlantirish: Go'da chap-o'ngdan baholash tartibi kafolatlangan emas — fmt.Println(c(), c()) argumentlari chapdan o'ngga baholanadi, lekin bunday kodga tayanmaslik yaxshi. Goroutine ichida closure bilan ulashilgan o'zgaruvchi — data race manbai."},{"l":"M","t":"code","tp":"Basics","d":"go","id":18006,"n":"GR7","q":"Struct embedding nima qiladi?","c":"type Base struct{ ID int }\nfunc (b Base) Describe() string { return \"base\" }\ntype User struct {\n    Base\n    Name string\n}\nu := User{}\n_ = u.ID\n_ = u.Describe()","o":["Promotion: Base maydon va metodlari User'da to'g'ridan-to'g'ri ko'rinadi — bu kompozitsiya, meros emas","Bu klassik meros (inheritance)","Kompilyatsiya xatosi","Faqat maydonlar promote bo'ladi, metodlar emas"],"a":0,"e":"Embedding — kompozitsiya + avtomatik delegatsiya. Muhim farq merosdan: virtual dispatch yo'q — Base metodining ichidan chaqirilgan metod User'da override qilingan versiyani ko'rmaydi (ozgina 'Base' o'zini biladi). Nom to'qnashsa tashqi (sayoz) daraja g'olib bo'ladi; bir xil chuqurlikda ikkita bir xil nom — ambiguity, kompilyatsiya xatosi."},{"l":"M","t":"code","tp":"Basics","d":"go","id":18007,"n":"GR8","q":"Struct tag qanday ta'sir qiladi?","c":"type U struct {\n    Name  string `json:\"name\" db:\"user_name\"`\n    Email string `json:\"-\"`\n    Age   int    `json:\"age,omitempty\"`\n}","o":["Tag — reflection orqali o'qiladigan metadata: Email marshal bo'lmaydi, Age 0 bo'lsa tushib qoladi, db tegi sqlx/pgx uchun","Tag kompilyatorga ta'sir qiladi","Tag faqat hujjat","Tag'siz JSON ishlamaydi"],"a":0,"e":"Tag — oddiy string, kompilyator tekshirmaydi (xato yozsangiz jimgina ishlamaydi — `go vet` structtag buni topadi). omitempty semantikasi: 0, \"\", false, nil, bo'sh slice/map tushadi — 'qiymat berilmagan' bilan 'nol berilgan' ni ajratish uchun pointer ishlating. Go 1.24 da omitzero qo'shildi (faqat zero struct uchun)."},{"l":"M","t":"code","tp":"Interfaces","d":"go","id":18008,"n":"GR9","q":"Type switch qanday yoziladi va nima uchun kerak?","c":"switch v := i.(type) {\ncase string:\n    fmt.Println(len(v))\ncase error:\n    fmt.Println(v.Error())\ndefault:\n}","o":["Interfeys ichidagi dinamik tipni tekshirish; har case'da v o'sha tipga ega bo'ladi","Kompilyatsiya vaqtida ishlaydi","Faqat error uchun","v har doim interface{} bo'lib qoladi"],"a":0,"e":"Type assertion — v, ok := i.(T), ok'siz varianti mos kelmasa panic beradi. Type switch — ko'p variant uchun. Ammo ko'p type switch odatda dizayn hidi: interfeysga metod qo'shish yoki visitor/sealed interface (faqat shu paketda implement qilinadigan unexported metod) bilan almashtirish yaxshiroq. errors.As esa zanjir bo'ylab tekshiradi — oddiy assertion wrap qilingan xatoni topmaydi."},{"l":"S","t":"mcq","tp":"Interfaces","d":"go","id":18009,"n":"GR10","q":"`any` va `interface{}` farqi?","o":["Hech qanday farq yo'q — Go 1.18 dan `any` interface{} uchun alias; `any` o'qishga qulayroq","any generiklarda boshqa ma'no beradi","any faqat generic funksiyalarda ishlaydi","any tipni tekshiradi"],"a":0,"e":"Alias, ya'ni bir xil tip. Lekin dizayn maslahati o'zgarmagan: 'empty interface says nothing' — any qaytaruvchi API tip xavfsizligini yo'qotadi. Generiklar aynan shu uchun paydo bo'ldi. Runtime'da any qiymat interface header (tip + pointer) — allokatsiya va dinamik dispatch narxi bor."},{"l":"S","t":"code","tp":"Interfaces","d":"go","id":18010,"n":"GR11","q":"Bu generic funksiyada constraint nima qiladi?","c":"type Number interface{ ~int | ~int64 | ~float64 }\nfunc Sum[T Number](xs []T) T {\n    var s T\n    for _, x := range xs { s += x }\n    return s\n}","o":["~int — asosiy tipi int bo'lgan barcha tiplar (masalan type Celsius int) ham mos keladi; ~siz faqat aynan int","~ hech narsa o'zgartirmaydi","Bu interfeys oddiy metod to'plami","Faqat int qabul qiladi"],"a":0,"e":"Constraint — tip to'plami. `~T` — 'underlying type T bo'lgan har qanday tip'. Tip inferensiyasi tufayli Sum(xs) deb chaqirish yetarli, [int] yozish shart emas. Amaliy qoida: generic faqat haqiqiy takrorlanish bo'lsa — xUzoq constraint ierarxiyasi kodni o'qishni qiyinlashtiradi; golang.org/x/exp/constraints o'rniga endi standart `cmp.Ordered` bor.","src":"https://go.dev/blog/intro-generics"},{"l":"S","t":"mcq","tp":"Errors","d":"go","id":18011,"n":"GR12","q":"`errors.Is` va `errors.As` farqi?","o":["Is — zanjirda MA'LUM qiymatga (sentinel, masalan sql.ErrNoRows) tengligini tekshiradi; As — zanjirda ma'lum TIPni topib, unga o'zlashtiradi","Ikkalasi bir xil","Is faqat string solishtiradi","As faqat panic bilan ishlaydi"],"a":0,"e":"Ikkalasi ham %w bilan o'ralgan zanjirni Unwrap qilib yuradi. `err == sql.ErrNoRows` wrap qilingan xatoda ishlamaydi — shuning uchun doim errors.Is. Maxsus xato tipi (masalan *ValidationError, kod va maydonlar bilan) uchun errors.As. Sentinel'lar API kontrakti — ularni e'lon qilsangiz, keyin o'zgartirish breaking change."},{"l":"M","t":"code","tp":"Errors","d":"go","id":18012,"n":"GR13","q":"`panic` va `recover` qachon o'rinli?","c":"func safe() (err error) {\n    defer func() {\n        if r := recover(); r != nil {\n            err = fmt.Errorf(\"panic: %v\", r)\n        }\n    }()\n    return risky()\n}","o":["recover faqat defer ichida ishlaydi; server chegarasida (HTTP middleware, worker loop) butun jarayon o'lmasligi uchun ishlatiladi, oddiy xato oqimi uchun emas","panic — Go'da odatiy xato qaytarish usuli","recover istalgan joyda ishlaydi","panic'dan keyin defer'lar ishlamaydi"],"a":0,"e":"Qoida: xato — qaytariladigan qiymat; panic — dasturchi xatosi yoki tiklab bo'lmaydigan holat. Muhim: recover BOSHQA goroutine'dagi panic'ni ushlay olmaydi — har goroutine o'zida himoyalanishi kerak, aks holda jarayon o'ladi. http.Server o'z handler'larida panic'ni ushlaydi, lekin sizning worker goroutine'laringizda emas."},{"l":"S","t":"mcq","tp":"Errors","d":"go","id":30173,"n":"SN174","q":"Xatolarni qanday o'rash va tekshirish idiomatik?","o":["`fmt.Errorf(\"%v\", err)` va matn bo'yicha `strings.Contains`","`fmt.Errorf(\"context: %w\", err)` bilan o'rash, `errors.Is` (sentinel) va `errors.As` (tur/maydonlar) bilan tekshirish; API chegarasida ichki xatoni o'z turiga o'girish","Har joyda panic","Xatoni log qilib nil qaytarish"],"a":1,"e":"`%v` zanjirni uzadi — `errors.Is` ishlamaydi. Matn bo'yicha tekshirish esa kutubxona xabari o'zgarganda jim buziladi. Qatlamlar bo'yicha qoida: pastda `%w` bilan kontekst qo'shiladi, yuqorida (HTTP handler) `errors.As` bilan domain xatosi aniqlanib status kodga o'giriladi. `errors.Join` bir nechta xatoni birlashtiradi."},{"l":"S","t":"mcq","tp":"Interfaces","d":"go","id":30174,"n":"SN175","q":"Go'da interfeys qayerda e'lon qilinishi kerak?","o":["Implementatsiya paketida, barcha metodlar bilan","Iste'molchi paketida va minimal (kerakli metodlargina) — 'accept interfaces, return structs'; katta interfeys mock va bog'liqlikni ko'paytiradi","`internal/interfaces` paketida markazlashgan","Farqi yo'q"],"a":1,"e":"Iste'molchi tomonda e'lon qilinsa: paket o'ziga kerakli minimal shartnomani belgilaydi, test uchun mock oson, va implementatsiya paketi hech kimga bog'lanmaydi. `io.Reader` — bu falsafaning namunasi. Konstruktor esa konkret turni qaytaradi, shunda iste'molchi kerakli qismini o'zi abstraktlaydi."},{"l":"S","t":"code","tp":"Basics","d":"go","id":30175,"n":"SN176","q":"Bu kod nima chiqaradi?","c":"s := []int{1, 2, 3}\nmodify(s)\nfmt.Println(s)\n\nfunc modify(x []int) {\n    x[0] = 100\n    x = append(x, 4)\n    x[1] = 200\n}","o":["`[100 200 3]`","`[100 2 3]` — `x[0]` umumiy massivga yozadi, `append` esa cap yetmagani uchun yangi massiv yaratadi va keyingi o'zgarishlar asl slice'ga tegmaydi","`[1 2 3]`","`[100 200 3 4]`"],"a":1,"e":"Slice qiymat bo'yicha uzatiladi, lekin backing array umumiy — shuning uchun `x[0]=100` ko'rinadi. `append` cap oshganda yangi massivga ko'chiradi, shundan keyin funksiya ichidagi slice mustaqil bo'ladi. Shu chalkashlik sababli slice'ni o'zgartiradigan funksiyalar natijani qaytarishi kerak (`func modify(x []int) []int`)."},{"l":"S","t":"mcq","tp":"Errors","d":"go","id":30323,"n":"SN324","q":"Xatolarni qanday o'rash va tekshirish idiomatik?","o":["`fmt.Errorf(\"%v\", err)` va matn bo'yicha `strings.Contains`","`fmt.Errorf(\"context: %w\", err)` bilan o'rash, `errors.Is` (sentinel) va `errors.As` (tur/maydonlar) bilan tekshirish; API chegarasida ichki xatoni o'z turiga o'girish","Har joyda panic","Xatoni log qilib nil qaytarish"],"a":1,"e":"`%v` zanjirni uzadi — `errors.Is` ishlamaydi. Matn bo'yicha tekshirish esa kutubxona xabari o'zgarganda jim buziladi. Qatlamlar bo'yicha qoida: pastda `%w` bilan kontekst qo'shiladi, yuqorida (HTTP handler) `errors.As` bilan domain xatosi aniqlanib status kodga o'giriladi. `errors.Join` bir nechta xatoni birlashtiradi."},{"l":"S","t":"mcq","tp":"Interfaces","d":"go","id":30324,"n":"SN325","q":"Go'da interfeys qayerda e'lon qilinishi kerak?","o":["Implementatsiya paketida, barcha metodlar bilan","Iste'molchi paketida va minimal (kerakli metodlargina) — 'accept interfaces, return structs'; katta interfeys mock va bog'liqlikni ko'paytiradi","`internal/interfaces` paketida markazlashgan","Farqi yo'q"],"a":1,"e":"Iste'molchi tomonda e'lon qilinsa: paket o'ziga kerakli minimal shartnomani belgilaydi, test uchun mock oson, va implementatsiya paketi hech kimga bog'lanmaydi. `io.Reader` — bu falsafaning namunasi. Konstruktor esa konkret turni qaytaradi, shunda iste'molchi kerakli qismini o'zi abstraktlaydi."},{"l":"S","t":"code","tp":"Basics","d":"go","id":30325,"n":"SN326","q":"Bu kod nima chiqaradi?","c":"s := []int{1, 2, 3}\nmodify(s)\nfmt.Println(s)\n\nfunc modify(x []int) {\n    x[0] = 100\n    x = append(x, 4)\n    x[1] = 200\n}","o":["`[100 200 3]`","`[100 2 3]` — `x[0]` umumiy massivga yozadi, `append` esa cap yetmagani uchun yangi massiv yaratadi va keyingi o'zgarishlar asl slice'ga tegmaydi","`[1 2 3]`","`[100 200 3 4]`"],"a":1,"e":"Slice qiymat bo'yicha uzatiladi, lekin backing array umumiy — shuning uchun `x[0]=100` ko'rinadi. `append` cap oshganda yangi massivga ko'chiradi, shundan keyin funksiya ichidagi slice mustaqil bo'ladi. Shu chalkashlik sababli slice'ni o'zgartiradigan funksiyalar natijani qaytarishi kerak (`func modify(x []int) []int`)."},{"l":"S","t":"mcq","tp":"Interfaces","d":"go","id":30416,"n":"SN417","q":"Interface metod chaqiruvi konkret tur chaqiruvidan qanchalik qimmat?","o":["Bir xil","Interface chaqiruvi itab orqali bilvosita (dynamic dispatch) — inline qilinmaydi va kesh miss ehtimoli bor; issiq tsiklda sezilarli bo'lishi mumkin, lekin odatda I/O va allocation oldida ahamiyatsiz. Profil ko'rsatmasa optimizatsiya qilinmaydi","10 barobar sekin","Interface tezroq"],"a":1,"e":"Muhimrog'i — interface'ga solish (boxing) allocation keltirishi mumkin: kichik qiymat interface'ga o'ralganda heap'ga qochadi. Shuning uchun issiq yo'lda `fmt.Sprintf`, `any` argumentlar va log chaqiruvlari GC bosimini oshiradi. Go 1.21+ PGO (profile-guided optimization) ba'zi interface chaqiruvlarini devirtualizatsiya qiladi."},{"l":"S","t":"mcq","tp":"Errors","d":"go","id":30417,"n":"SN418","q":"Panic/recover qachon o'rinli?","o":["Xatolarni qaytarish o'rniga har joyda","Chegaralarda: HTTP server middleware'ida recover bilan bitta so'rovni yiqitib, jarayonni saqlash; ishga tushishda (`MustCompile`) dasturchi xatosi uchun; kutubxona ichida panic'ni tashqi API chegarasida `error`ga aylantirish. Oddiy biznes xatolarida ishlatilmaydi","Hech qachon","Faqat testda"],"a":1,"e":"Nozik joy: `recover` faqat shu goroutine'da ishlaydi — `go func()` ichida panic bo'lsa butun jarayon yiqiladi (shu sabab har spawn qilingan goroutine'da recovery wrapper bo'lishi kerak). Ikkinchi nuqta: recover'dan keyin holat noaniq bo'lishi mumkin, shuning uchun so'rovni bekor qilish to'g'ri, ishni davom ettirish emas."},{"l":"M","t":"code","tp":"Channels","d":"go","id":3006,"n":"G7","q":"Natija?","c":"func main() {\n    ch := make(chan int)   // buffersiz\n    ch <- 1\n    fmt.Println(<-ch)\n}","o":["1 chop etadi","fatal error: all goroutines are asleep - deadlock!","0 chop etadi","Kompilyatsiya xatosi"],"a":1,"e":"Buffersiz kanalda jo'natish qabul qiluvchi tayyor bo'lguncha bloklaydi. Bu yerda bitta goroutine bor — o'zi jo'natib, o'zi qabul qila olmaydi. Runtime hamma goroutine bloklanganini aniqlab deadlock beradi. Tuzatish: qabul qilishni alohida goroutine'da qilish yoki make(chan int, 1) — bufer bilan."},{"l":"M","t":"mcq","tp":"Channels","d":"go","id":3007,"n":"G8","q":"Yopilgan (closed) kanal bilan ishlaganda qaysi row to'g'ri?","o":["Yopilgan kanaldan o'qish panic beradi","Yopilgan kanaldan o'qish darhol nol qiymat qaytaradi (v, ok := <-ch da ok=false); yopilgan kanalga jo'natish panic; ikki marta close ham panic","Yopilgan kanalga jo'natish e'tiborsiz qoldiriladi","close faqat buffersiz kanallarda ishlaydi"],"a":1,"e":"Qoida: kanalni jo'natuvchi yopadi, qabul qiluvchi emas — aks holda 'send on closed channel' panic xavfi. Ko'p jo'natuvchi bo'lsa: alohida done kanal yoki context, yoki sync.WaitGroup tugagach bitta joyda close. range ch — kanal yopilganda tabiiy tugaydi.","src":"https://go.dev/ref/spec#Close"},{"l":"M","t":"mcq","tp":"Channels","d":"go","id":3008,"n":"G9","q":"<code>select</code> ichidagi <code>default</code> nima beradi?","o":["Xatoni ushlaydi","Hech bir case tayyor bo'lmasa darhol default bajariladi — bloklanmaydigan (non-blocking) jo'natish/qabul qilish","Birinchi case'ni tanlaydi","Timeout qo'yadi"],"a":1,"e":"default'siz select biror case tayyor bo'lguncha kutadi; bir nechta tayyor bo'lsa tasodifiy tanlaydi (adolat uchun). Timeout uchun: case <-time.After(2*time.Second) yoki yaxshisi case <-ctx.Done(). Non-blocking jo'natish metrika/telemetriya kanalini to'ldirmaslik uchun qulay."},{"l":"M","t":"open","tp":"Concurrency","d":"go","id":3009,"n":"G10","q":"Goroutine leak nima, qanday yuzaga keladi va qanday aniqlaysiz?","m":["Goroutine hech qachon tugamaydigan operatsiyada bloklanib qoladi — kanalda kutadi, qabul qiluvchi yo'q","Tipik sabablar: natijani hech kim o'qimaydigan buffersiz kanal, context'siz cheksiz kutish, abandon qilingan HTTP query, to'xtatilmagan ticker (time.Ticker.Stop qilinmagan)","Har goroutine stack memory ushlaydi — asta-sekin memory va planner yuki o'sadi","Aniqlash: runtime.NumGoroutine() metrikasi va o'sish tendensiyasi, net/http/pprof dagi /debug/pprof/goroutine, testda goleak (go.uber.org/goleak)","Oldini olish: har goroutine'ga tugash yo'li — context, done kanal, WaitGroup; jo'natishda select bilan ctx.Done()"],"e":"Go'da goroutine'ni tashqaridan o'ldirib bo'lmaydi — u o'zi qaytishi kerak. Shuning uchun 'kim bu goroutine'ni to'xtatadi?' savoli har yaratishda berilishi kerak.","src":"https://github.com/uber-go/goleak"},{"l":"S","t":"code","tp":"Sync","d":"go","id":3010,"n":"G11","q":"Bu kodda nima xato?","c":"var wg sync.WaitGroup\nfor _, url := range urls {\n    go func(u string) {\n        wg.Add(1)\n        defer wg.Done()\n        fetch(u)\n    }(url)\n}\nwg.Wait()","o":["Xato yo'q","wg.Add goroutine ichida chaqirilgan — Wait() Add'dan oldin ishga tushib, hech narsa kutmasdan o'tib ketishi mumkin (race). Add goroutine yaratishdan OLDIN, tashqarida chaqirilishi kerak","defer wg.Done() noto'g'ri","url'ni parametr sifatida uzatish shart emas"],"a":1,"e":"To'g'risi: wg.Add(1) ni 'go' dan oldin yozish (yoki sikldan oldin wg.Add(len(urls))). Sabab: goroutine qachon ishga tushishi kafolatlanmagan — Wait() hisoblagich 0 ko'rib darhol qaytadi. Go 1.25 dan boshlab wg.Go(func(){...}) helperi bor — Add/Done ni o'zi boshqaradi. Yana: WaitGroup'ni qiymat sifatida nusxalash mumkin emas (pointer bilan uzating).","src":"https://pkg.go.dev/sync#WaitGroup"},{"l":"S","t":"mcq","tp":"Context","d":"go","id":3011,"n":"G12","q":"<code>ctx, cancel := context.WithTimeout(parent, 2*time.Second)</code> dan keyin <code>defer cancel()</code> yozilmasa nima bo'ladi?","o":["Hech narsa, timeout baribir ishlaydi","Context va uning timer'i parent bilan bog'liq holda timeout tugaguncha saqlanadi — resurs (timer va ota context'dagi bola ro'yxati) sizadi; go vet 'lostcancel' deb ogohlantiradi","Kod kompilyatsiya bo'lmaydi","Timeout 2 barobar uzayadi"],"a":1,"e":"cancel() ishni erta tugatganda ham resursni bo'shatadi. Qoida: context query doirasida (request-scoped) bo'ladi, struct maydonida saqlanmaydi, funksiyaning birinchi parametri sifatida uzatiladi. context.Value faqat query metadata'si uchun (trace_id), majburiy parametrlar uchun emas.","src":"https://pkg.go.dev/context"},{"l":"S","t":"mcq","tp":"Sync","d":"go","id":3012,"n":"G13","q":"Map'ga bir vaqtda ikki goroutine yozsa nima bo'ladi?","o":["Oxirgi yozuv qoladi","Runtime 'fatal error: concurrent map writes' bilan dasturni o'ldiradi (recover qilib bo'lmaydi) — sync.Mutex yoki sync.Map kerak","Ma'lumot buziladi, lekin dastur ishlaydi","Go avtomatik lock qo'yadi"],"a":1,"e":"Bu panic emas, fatal error — recover ushlamaydi. Odatiy yechim: mutex bilan o'ralgan struct. sync.Map faqat ikki stsenariyda foydali: key bir marta yozilib ko'p o'qilsa yoki turli goroutine'lar turli key'lar bilan ishlasa. Poyga holatlarini topish: go test -race, prod'ga yaqin yuk bilan.","src":"https://go.dev/doc/articles/race_detector"},{"l":"St","t":"open","tp":"Concurrency","d":"go","id":3016,"n":"G17","q":"Cheklangan parallellikda worker pool yozing: N worker, graceful shutdown, xatolarni yig'ish. Qanday quraysiz?","m":["Jobs kanali (buffered) + N ta worker goroutine + sync.WaitGroup","Har worker: for job := range jobs { select ctx.Done() bilan tekshirish; natijani results kanaliga }","Jo'natuvchi ishni tugatgach close(jobs); worker'lar range tugab chiqadi; wg.Wait() dan keyin close(results)","Xatolar: golang.org/x/sync/errgroup — birinchi xatoda context bekor qilinadi, g.SetLimit(N) bilan parallellik cheklanadi","Graceful shutdown: signal.NotifyContext(os.Interrupt) → ctx bekor bo'ladi → workerlar joriy ishni tugatib chiqadi, deadline bilan","Backpressure: kanal buferini cheklash — cheksiz queue memory'ni yeydi"],"e":"Staff signal: errgroup'ni bilish va 'kim kanalni yopadi' qoidasini aniq aytish. Yana: worker soni — CPU-bound ish uchun ≈ GOMAXPROCS, I/O-bound uchun ko'proq, lekin tashqi tizim limitiga qarab.","src":"https://pkg.go.dev/golang.org/x/sync/errgroup"},{"l":"J","t":"mcq","tp":"Concurrency","d":"go","id":3020,"n":"G21","q":"Goroutine va OS thread farqi?","o":["Bir xil narsa","Goroutine — Go runtime boshqaradigan yengil bajarilish birligi: boshlang'ich stack ~2KB va o'sib boradi, runtime ularni M:N sxemada OS threadlarga taqsimlaydi; minglab-millionlab goroutine normal. OS thread — yadro obyekti, stack odatda 1–8MB","Goroutine — bu jarayon","Har goroutine uchun bitta OS thread yaratiladi"],"a":1,"e":"Planner (scheduler) goroutine bloklanganda (kanal, network) boshqasini o'sha threadda ishga tushiradi — shuning uchun I/O ko'p bo'lgan servislar Go'da yaxshi masshtablanadi. Bloklovchi syscall bo'lsa runtime yangi thread ajratadi. GOMAXPROCS — bir vaqtda Go kodini bajaradigan threadlar soni."},{"l":"J","t":"code","tp":"Concurrency","d":"go","id":3021,"n":"G22","q":"Nima chop etiladi?","c":"func main() {\n    go fmt.Println(\"salom\")\n}","o":["salom","Hech narsa — main goroutine tugashi bilan dastur to'xtaydi, goroutine ishga tushishga ulgurmasligi mumkin","panic","Deadlock"],"a":1,"e":"main qaytsa, butun dastur tugaydi — qolgan goroutine'lar 'o'ldiriladi' (ularga hech qanday signal berilmaydi, defer'lari ham ishlamaydi). Kutish uchun sync.WaitGroup yoki kanal. time.Sleep bilan 'kutish' — testda ham, prodda ham noto'g'ri: kafolat bermaydi va sekinlashtiradi."},{"l":"M","t":"mcq","tp":"Channels","d":"go","id":3022,"n":"G23","q":"<code>make(chan int, 3)</code> — buferli kanalda jo'natish qachon bloklanadi?","o":["Hech qachon","Bufer to'lganda (3 ta o'qilmagan element bo'lsa); qabul qilish esa bufer bo'sh bo'lganda bloklanadi","Har jo'natishda","Faqat kanal yopilganda"],"a":1,"e":"Bufer — vaqtinchalik notekislikni yumshatish uchun, cheksiz queue emas. Bufer hajmini o'ylab tanlash kerak: katta bufer muammoni yashiradi (backpressure yo'qoladi, memory o'sadi, crashda ma'lumot yo'qoladi). len(ch) — hozirgi elementlar soni, cap(ch) — sig'im."},{"l":"M","t":"mcq","tp":"Channels","d":"go","id":3023,"n":"G24","q":"<code>select</code> ichidagi <code>nil</code> kanal nima qiladi?","o":["panic beradi","Nil kanaldagi jo'natish/qabul abadiy bloklanadi — shuning uchun select'da o'sha case hech qachon tanlanmaydi; bu case'ni 'o'chirish' uchun ataylab ishlatiladi","Darhol nol qiymat qaytaradi","Case'ni birinchi tanlaydi"],"a":1,"e":"Amaliy pattern: ikkita manbadan o'qiyotganda biri tugasa (kanal yopilsa), o'sha o'zgaruvchini nil qilib qo'yasiz — aks holda yopilgan kanal doim 'tayyor' bo'lib, select cheksiz aylanadi va CPU yeydi. Bu fan-in kodidagi klassik xatoning yechimi."},{"l":"M","t":"code","tp":"Sync","d":"go","id":3024,"n":"G25","q":"Bu kod qanday natija beradi?","c":"counter := 0\nvar wg sync.WaitGroup\nfor i := 0; i < 1000; i++ {\n    wg.Add(1)\n    go func() { defer wg.Done(); counter++ }()\n}\nwg.Wait()\nfmt.Println(counter)","o":["Doim 1000","1000 dan kichik va har safar boshqacha — counter++ atomik emas (o'qish-qo'shish-yozish); bu data race, go test -race aniqlaydi. Tuzatish: sync.Mutex yoki atomic.Int64","panic","Kompilyatsiya xatosi"],"a":1,"e":"Data race — aniqlanmagan xulq: natija noto'g'ri bo'lishi ham, kompilyator optimizatsiyasi tufayli yanada g'alati ko'rinishi ham mumkin. Yechimlar: var mu sync.Mutex bilan o'rash, yoki var counter atomic.Int64 va counter.Add(1) (Go 1.19+ tipli atomiklar). Har goroutine natijani kanalga yuborib, bitta joyda yig'ish ham to'g'ri yondashuv."},{"l":"M","t":"mcq","tp":"Sync","d":"go","id":3025,"n":"G26","q":"Mutex va kanal — qachon qaysi biri?","o":["Doim kanal, mutex eskirgan","Mutex — umumiy holatni (struct maydoni, cache, hisoblagich) himoya qilish uchun sodda va tez. Kanal — egalikni uzatish, ish taqsimlash va bosqichlarni bog'lash (pipeline) uchun","Doim mutex","Ikkalasi ham bir xil ishlaydi"],"a":1,"e":"'Share memory by communicating' — shior, qat'iy qoida emas; Go jamoasining o'z maslahati: oddiy holat himoyasi uchun mutex ishlating. sync.RWMutex — o'qish juda ko'p, yozish kam bo'lganda (lekin qisqa kritik bo'limda oddiy Mutex tezroq bo'lishi mumkin). Qoida: lock ushlab turganda tashqi chaqiruv (HTTP, DB) qilmang.","src":"https://go.dev/doc/effective_go#concurrency"},{"l":"S","t":"code","tp":"Context","d":"go","id":3026,"n":"G27","q":"Worker'ni to'g'ri to'xtatish uchun qaysi variant to'g'ri?","c":"// A\nfor job := range jobs {\n    process(job)\n}\n\n// B\nfor {\n    select {\n    case job, ok := <-jobs:\n        if !ok { return }\n        process(ctx, job)\n    case <-ctx.Done():\n        return\n    }\n}","o":["A — soddaroq va yetarli","B — kanal yopilishini ham, context bekor qilinishini ham hisobga oladi: shutdown signalida worker joriy siklni tugatib chiqadi","Ikkalasi bir xil","A tezroq, shuning uchun to'g'ri"],"a":1,"e":"A varianti faqat kanal yopilganda tugaydi — graceful shutdown'da jo'natuvchi bloklangan bo'lsa, worker abadiy kutishi mumkin. Muhim tafsilot: process(ctx, job) — context ichkariga ham uzatiladi, aks holda uzoq DB query'i baribir kutadi. Shutdown deadline: context.WithTimeout bilan cheklab, tugamaganini majburan tark etish."},{"l":"S","t":"mcq","tp":"Concurrency","d":"go","id":3027,"n":"G28","q":"Uzoq ishlaydigan siklda <code>case &lt;-time.After(1*time.Second):</code> ishlatishning muammosi?","o":["Muammo yo'q","Har iteratsiyada yangi Timer yaratiladi va u ishlab bo'lguncha (yoki GC yig'guncha) resurs ushlaydi — yuqori chastotali siklda sezilarli yuk; o'rniga time.NewTimer/NewTicker yaratib, Reset va Stop bilan boshqarish kerak","time.After noto'g'ri vaqt beradi","Faqat testda muammo"],"a":1,"e":"Eslatma: Go 1.23 dan boshlab timer'lar ishlatilmasa ham GC uchun erishiladigan bo'lib qolmaydi — bu eski 'time.After leak' muammosini ancha yumshatdi, lekin yuqori chastotali kodda Timer'ni qayta ishlatish baribir afzal. Ticker'ni to'xtatmaslik esa har doim leak: defer ticker.Stop()."},{"l":"S","t":"mcq","tp":"Concurrency","d":"go","id":3028,"n":"G29","q":"<code>errgroup.Group</code> qanday ishlaydi?","o":["Hamma xatolarni ro'yxat qilib qaytaradi","g.Go(fn) bilan goroutine'lar ishga tushadi; g.Wait() hammasini kutib, birinchi qaytgan xatoni qaytaradi. WithContext bilan yaratilgan bo'lsa, birinchi xatoda context bekor qilinadi va qolgan ishlar to'xtaydi; SetLimit(n) bilan parallellik cheklanadi","Xatolarni yutib yuboradi","WaitGroup bilan bir xil, farqi yo'q"],"a":1,"e":"Tipik ishlatish: bir nechta tashqi servisga parallel query — biri yiqilsa qolganlarini bekor qilish. Diqqat: g.Wait() faqat BIRINCHI xatoni qaytaradi, hammasini yig'ish kerak bo'lsa o'zingiz to'plang (yoki Go 1.20+ errors.Join). Har goroutine ichida ctx.Err() ni tekshirish kerak, aks holda bekor qilish ta'sir qilmaydi.","src":"https://pkg.go.dev/golang.org/x/sync/errgroup"},{"l":"S","t":"code","tp":"Concurrency","d":"go","id":3029,"n":"G30","q":"Fan-in: bu kodda nima bo'ladi?","c":"results := make(chan int)      // buffersiz\nvar wg sync.WaitGroup\nfor _, j := range jobs {\n    wg.Add(1)\n    go func(j Job) { defer wg.Done(); results <- run(j) }(j)\n}\nwg.Wait()\nclose(results)\nfor r := range results { fmt.Println(r) }","o":["To'g'ri ishlaydi","Deadlock: buffersiz kanalga hech kim o'qimayapti — goroutine'lar jo'natishda bloklanadi, wg.Wait() esa hech qachon qaytmaydi. Tuzatish: yig'ishni alohida goroutine'ga olish (go func(){ wg.Wait(); close(results) }()) va keyin range qilish","panic: close of closed channel","Natijalar tartibsiz chiqadi, xolos"],"a":1,"e":"Qoida: kanalni to'ldiruvchi va bo'shatuvchi bir vaqtda ishlashi kerak. To'g'ri shablon: goroutine'lar yozadi → alohida goroutine wg.Wait() dan keyin close qiladi → asosiy goroutine range bilan o'qiydi. Muqobil: results ni len(jobs) hajmda buferli qilish (lekin bu memory va backpressure masalasi)."},{"l":"S","t":"mcq","tp":"Sync","d":"go","id":3030,"n":"G31","q":"<code>sync/atomic</code> va <code>sync.Mutex</code> — qachon qaysi biri?","o":["Atomic doim yaxshi","Atomic — bitta o'zgaruvchi ustida oddiy amal (hisoblagich, flag, pointer almashtirish) uchun: lock'siz va tez. Mutex — bir nechta maydonni birga izchil o'zgartirish yoki murakkab kritik bo'lim uchun","Mutex doim tezroq","Atomic faqat 32-bit tizimlarda"],"a":1,"e":"Go 1.19 dan tipli atomiklar bor: atomic.Int64, atomic.Bool, atomic.Pointer[T] — eski atomic.AddInt64(&x, 1) shakliga nisbatan xavfsizroq (eski shaklda 32-bit platformalarda hizalanish talabi bor edi). Atomiklardan 'mini-lock' yasashga urinmang: bir nechta atomik amal birgalikda atomik emas."},{"l":"S","t":"mcq","tp":"Concurrency","d":"go","id":3031,"n":"G32","q":"Go memory modeli (memory model) bo'yicha qaysi to'g'ri?","o":["Bitta goroutine yozgan qiymatni boshqasi darhol ko'radi","Sinxronizatsiyasiz (kanal, mutex, atomic, WaitGroup) yozuvni boshqa goroutine hech qachon ko'rmasligi ham mumkin — kompilyator va protsessor qayta tartiblashi va cache'da ushlab turishi mumkin","for sikli bilan kutish (busy wait) yetarli","volatile key so'zi kerak"],"a":1,"e":"Shuning uchun 'flag bool' ni sinxronizatsiyasiz tekshirib kutish — buzuq kod (cheksiz sikl bo'lishi mumkin). To'g'ri yo'llar: kanal, mutex, atomic.Bool, context. 'Bizda ishladi' — kafolat emas: xulq arxitektura va kompilyator versiyasiga qarab o'zgaradi.","src":"https://go.dev/ref/mem"},{"l":"St","t":"mcq","tp":"Concurrency","d":"go","id":3032,"n":"G33","q":"HTTP handler'da foydalanuvchi query'i bekor qilinganda (client uzildi) fon ishini davom ettirish kerak bo'lsa nima qilasiz?","o":["r.Context() ni to'g'ridan-to'g'ri goroutine'ga uzatish","Query context'i client uzilganda bekor bo'ladi — fon ishi darhol to'xtaydi. Kerak bo'lsa: context.WithoutCancel(ctx) (Go 1.21+) yoki yangi context yaratib, faqat qiymatlarni (trace_id) ko'chirish va o'z timeout'ini qo'yish","context.Background() ni ishlatib, timeout qo'ymaslik","Goroutine'ni context'siz ishga tushirish"],"a":1,"e":"Ikki xato ham xavfli: birinchisi ishni yarimda to'xtatadi, ikkinchisi (timeout'siz) goroutine leak beradi. Yaxshiroq arxitektura: uzoq ishni HTTP query'idan butunlay ajratib, queue'ga (outbox/Kafka/SQS) qo'yish — shunda qayta urinish va kuzatuv ham bo'ladi."},{"l":"M","t":"mcq","tp":"Sync","d":"go","id":13016,"n":"K17","q":"<code>sync.Once</code> nima uchun kerak?","o":["Goroutine'ni bir marta ishga tushirish","Initsializatsiyani bir marta va konkurent xavfsiz bajarish (lazy singleton, ulanish yaratish): birinchi chaqiruv funksiyani bajaradi, qolganlari u tugaguncha kutadi va keyin darhol qaytadi","Mutex o'rnini bosadi","Faqat testda ishlatiladi"],"a":1,"e":"Tuzoq: Once ichida xato bo'lsa, u qayta urinmaydi — xato qaytaradigan initsializatsiya uchun o'zingiz holatni saqlab, kerak bo'lsa qayta urinish mantig'ini yozing (yoki Go 1.21+ sync.OnceValue/OnceValues). Global holatni kamaytirish uchun ko'pincha yaxshiroq yo'l — konstruktorda yaratib, bog'liqlik sifatida uzatish."},{"l":"S","t":"mcq","tp":"Concurrency","d":"go","id":14021,"n":"SR22","q":"Bir xil kalit uchun bir vaqtda 1000 ta kesh miss bo'ldi. Go'da qanday yechim eng mos?","o":["Har biri o'z query'sini yuborsin","golang.org/x/sync/singleflight: bir xil kalit uchun faqat bitta chaqiruv bajariladi, qolganlari uning natijasini kutadi (thundering herd'ga qarshi)","Mutex bilan butun keshni qulflash","Retry qo'shish"],"a":1,"e":"singleflight lokal (bitta process) darajada ishlaydi — ko'p pod bo'lsa har podda bittadan chaqiruv bo'ladi; to'liq himoya uchun Redis lock yoki stale-while-revalidate qo'shiladi. Diqqat: singleflight natijani barcha kutuvchilarga bir xil qaytaradi — xato ham umumiy bo'ladi.","src":"https://pkg.go.dev/golang.org/x/sync/singleflight"},{"l":"S","t":"mcq","tp":"Concurrency","d":"go","id":14022,"n":"SR23","q":"Worker pool o'lchamini qanday tanlaysiz?","o":["Goroutine arzon, cheklash shart emas","Ish turiga qarab: CPU-bound uchun ≈ GOMAXPROCS; I/O-bound uchun ko'proq, lekin pastdagi resurs limiti (DB pool, tashqi API rate limit) bilan cheklanadi — o'lchab sozlanadi","Har doim 100","Foydalanuvchilar soniga teng"],"a":1,"e":"Cheklanmagan goroutine — Go'dagi eng ko'p uchraydigan yuk muammosi: DB pool tugaydi, xotira o'sadi, tashqi servis 429 qaytaradi. Amaliy naqsh: bounded channel yoki errgroup.SetLimit, va navbat uzunligi bo'yicha backpressure (to'lsa so'rovni rad etish)."},{"l":"S","t":"mcq","tp":"Sync","d":"go","id":15001,"n":"GS2","q":"Konfiguratsiyani ishlash vaqtida qayta yuklash (hot reload) uchun Go'da eng mos mexanizm?","o":["Global o'zgaruvchini mutexsiz yangilash","<code>atomic.Pointer[Config]</code> (yoki atomic.Value): o'quvchilar lock'siz Load qiladi, yangilanishda esa YANGI struct yaratilib Store qilinadi — mavjud struct joyida o'zgartirilmaydi","Har o'qishda faylni qayta o'qish","sync.Once bilan"],"a":1,"e":"Bu copy-on-write naqshi: o'qish juda ko'p, yozish kam bo'lgan holat uchun ideal (RWMutex'dan ham yengil). Muhim shart: Store qilingan qiymat o'zgarmas (immutable) bo'lsin — aks holda o'quvchilar yarim yangilangan holatni ko'radi. atomic.Value bir xil konkret tipni talab qiladi va Store'dan keyin nusxalanmasligi kerak.","src":"https://pkg.go.dev/sync/atomic#Pointer"},{"l":"S","t":"code","tp":"Concurrency","d":"go","id":15002,"n":"GS3","q":"Bir vaqtda ko'pi bilan 10 ta ish bajarilsin. Kanal bilan qanday yoziladi?","c":"sem := make(chan struct{}, 10)\nfor _, job := range jobs {\n    sem <- struct{}{}          // ?\n    go func(j Job) {\n        defer func() { <-sem }()\n        process(j)\n    }(job)\n}","o":["Bu kod noto'g'ri","To'g'ri: buferli kanal semafor sifatida ishlaydi — bufer to'lsa yangi goroutine ishga tushmay kutadi. Lekin oxirida hamma tugashini kutish uchun WaitGroup ham kerak, va xatolarni yig'ish uchun errgroup.SetLimit(10) soddaroq","struct{} o'rniga bool bo'lishi kerak","Semafor uchun mutex ishlatiladi"],"e":"struct{} nol bayt egallaydi — signal uchun ideal. errgroup.SetLimit(n) shu naqshni va xato tarqatishni birga beradi. Diqqat: sem'ga yozish goroutine ICHIDA bo'lsa cheklash ishlamaydi — barcha goroutine'lar darhol yaratiladi."},{"l":"S","t":"mcq","tp":"Context","d":"go","id":15003,"n":"GS4","q":"Ota context'da 2 soniyalik deadline bor. Bolada <code>context.WithTimeout(parent, 10*time.Second)</code> qilindi. Nima bo'ladi?","o":["Bola 10 soniya ishlaydi","Bola baribir 2 soniyada bekor bo'ladi — deadline faqat qisqartiriladi, uzaytirilmaydi; zanjirdagi eng erta muddat yutadi","Ota context uzayadi","Xato qaytadi"],"a":1,"e":"Shuning uchun ichki chaqiruvlar uchun timeout tashqisidan kichik bo'lishi mantiqiy — kattasini yozish samarasiz. Muddatni haqiqatan uzaytirish kerak bo'lsa (fon ishi so'rovdan uzoq yashashi kerak): context.WithoutCancel(ctx) (Go 1.21+) yoki yangi context yaratib, faqat kerakli qiymatlarni ko'chirish.","src":"https://pkg.go.dev/context"},{"l":"S","t":"code","tp":"Context","d":"go","id":15004,"n":"GS5","q":"<code>context.WithValue</code> uchun kalit sifatida nima ishlatiladi?","c":"// A\nctx = context.WithValue(ctx, \"userID\", id)\n\n// B\ntype ctxKey struct{}\nctx = context.WithValue(ctx, ctxKey{}, id)","o":["A — oddiyroq","B: eksport qilinmagan o'z tipingiz — string kalit boshqa paket kaliti bilan to'qnashishi mumkin va go vet buni ogohlantiradi. Qiymatni olishda ham tip tekshiriladi","Ikkalasi bir xil","Kalit int bo'lishi shart"],"a":1,"e":"context.Value faqat so'rov doirasidagi metadata uchun (trace_id, user, locale) — majburiy parametrlarni u orqali uzatmang: kompilyator tekshirmaydi va kod o'qilishi qiyinlashadi. Qiymat olish uchun tipli yordamchi funksiya yozing: func UserFrom(ctx) (User, bool)."},{"l":"S","t":"mcq","tp":"Sync","d":"go","id":15022,"n":"GS23","q":"<code>sync.Cond</code> qachon kerak bo'ladi?","o":["Har qanday kutish uchun","Kamdan-kam: bir nechta goroutine umumiy holat o'zgarishini kutayotganda (masalan bounded buffer 'bo'sh emas' bo'lguncha). Go'da ko'pincha kanal yoki context bilan yozish soddaroq va xavfsizroq","Mutex o'rniga","Kanal ishlamaganda"],"a":1,"e":"Cond bilan ishlash xatoga moyil: Wait() lock'ni bo'shatadi va uyg'ongach qayta oladi, shuning uchun shart doim for siklida tekshiriladi (spurious wakeup va poyga). Intervyuda 'bilaman, lekin odatda kanal ishlataman' degan javob yetuklik belgisi."},{"l":"M","t":"code","tp":"Channels","d":"go","id":18013,"n":"GR14","q":"`select` da `default` nima qiladi?","c":"select {\ncase v := <-ch:\n    use(v)\ndefault:\n    // ...\n}","o":["Hech bir case tayyor bo'lmasa bloklanmasdan darhol default bajariladi (non-blocking o'qish/yozish)","Boshqa case'lardan keyin ishlaydi","Timeout beradi","Kompilyatsiya xatosi"],"a":0,"e":"Non-blocking naqsh. Ogohlantirish: default'li select'ni loop ichiga qo'ysangiz busy-wait (CPU 100%) hosil bo'ladi — o'rniga time.After yoki ticker qo'shing. Timeout uchun: case <-time.After(d) (har iteratsiyada yangi timer allokatsiyasi) yoki yaxshiroq — case <-ctx.Done(). Bir nechta case tayyor bo'lsa, tanlov tasodifiy."},{"l":"S","t":"mcq","tp":"Channels","d":"go","id":18014,"n":"GR15","q":"Buffered va unbuffered channel qachon tanlanadi?","o":["Unbuffered — sinxronizatsiya nuqtasi (yuborish va qabul qilish bir vaqtda, happens-before kafolati); buffered — producer'ni qisqa portlashlarda bloklamaslik uchun, hajmi ataylab tanlanadi","Buffered har doim tezroq, doim ishlating","Farqi yo'q","Unbuffered xabarlarni yo'qotadi"],"a":0,"e":"Buffer — backpressure'ni yo'qotmaydi, faqat kechiktiradi: to'lgach baribir bloklaydi. Katta buffer muammoni yashiradi (xotira o'sadi, latency ko'rinmaydi, crash'da ma'lumot yo'qoladi). Tanlov qoidasi: buffer hajmi ma'lum bir sababga ega bo'lsin (masalan worker soni yoki bitta batch), 'ehtiyot uchun 1000' emas."},{"l":"S","t":"code","tp":"Concurrency","d":"go","id":18015,"n":"GR16","q":"Bu qanday naqsh?","c":"func merge(chs ...<-chan int) <-chan int {\n    out := make(chan int)\n    var wg sync.WaitGroup\n    for _, c := range chs {\n        wg.Add(1)\n        go func(c <-chan int){ defer wg.Done(); for v := range c { out <- v } }(c)\n    }\n    go func(){ wg.Wait(); close(out) }()\n    return out\n}","o":["Fan-in: bir nechta channel'ni bittaga birlashtirish; close alohida goroutine'da barcha producer'lar tugagach chaqiriladi","Fan-out","Pipeline stage","Worker pool"],"a":0,"e":"Fan-out — bitta manbadan ko'p worker o'qiydi (yukni bo'lish). Fan-in — ko'p natijani bittaga yig'ish. Pipeline — stage'lar zanjiri, har biri channel qaytaradi. Muhim qoida: channel'ni faqat YOZUVCHI yopadi, va bu yerda ko'p yozuvchi bo'lgani uchun close WaitGroup ortida turadi. Yana: iste'molchi erta to'xtasa goroutine'lar `out <- v` da osilib qoladi — shuning uchun done/ctx kanali bilan chiqish yo'li kerak.","src":"https://go.dev/blog/pipelines"},{"l":"S","t":"code","tp":"Concurrency","d":"go","id":18016,"n":"GR17","q":"Worker pool'da natijalarni qanday yig'asan?","c":"jobs := make(chan Job)\nresults := make(chan Result, len(all))\nfor i := 0; i < n; i++ {\n    go func(){ for j := range jobs { results <- process(j) } }()\n}","o":["jobs'ni to'ldirib close qilish (worker'lar range'dan chiqadi), keyin natijalarni len(all) marta o'qish yoki WaitGroup bilan results'ni yopish","Worker'lar o'zi to'xtaydi, close kerak emas","results buffersiz bo'lishi shart","Har job uchun yangi goroutine ochish shart"],"a":0,"e":"Kanonik shakl: producer jobs'ni yozadi va close(jobs) qiladi; har worker `for j := range jobs` bilan tugaydi; go func(){ wg.Wait(); close(results) }() va asosiy goroutine `for r := range results`. Zamonaviy alternativa — errgroup.Group + SetLimit(n): birinchi xatoda ctx bekor qilinadi va Wait() xatoni qaytaradi."},{"l":"S","t":"mcq","tp":"Sync","d":"go","id":18017,"n":"GR18","q":"`sync.RWMutex` qachon Mutex'dan yomonroq?","o":["Kritik seksiya juda qisqa bo'lsa — RWMutex qimmatroq (ko'proq atomik operatsiya) va yozuvchi ko'p bo'lsa reader'lar navbati sababli yomonlashadi; o'qish ustunlik qilganda va seksiya uzun bo'lganda foyda beradi","Har doim yaxshiroq","Hech qachon ishlatilmaydi","Faqat map bilan ishlaydi"],"a":0,"e":"RWMutex Lock kutayotganda yangi RLock'lar bloklanadi (yozuvchi ochlikdan himoyalangan). Ko'p yadroda RLock kesh qatorlari bo'ylab urishishi mumkin. Alternativalar: atomic.Pointer bilan copy-on-write (deyarli o'zgarmaydigan konfiguratsiya uchun ideal), sharded map, yoki sync.Map (faqat 'bir marta yoziladi, ko'p o'qiladi' yoki disjoint kalitlar holati uchun)."},{"l":"P","t":"code","tp":"Sync","d":"go","id":19019,"n":"RT20","q":"Bu kod 32-bit ARM'da nega panic berishi mumkin edi?","c":"type Counter struct {\n    flag  bool\n    total int64\n}\natomic.AddInt64(&c.total, 1)","o":["Eski atomic funksiyalari 64-bit argumentdan 8 baytga moslangan manzil talab qiladi; 32-bit platformada struct ichidagi int64 4 baytga tushib qolishi mumkin — yechim: atomic.Int64 tipini ishlatish (u alignment'ni o'zi kafolatlaydi)","32-bit da atomic umuman yo'q","bool maydon atomic'ni buzadi","Faqat Windows'da muammo"],"a":0,"e":"Go 1.19 dan atomic.Int64/Uint64/Pointer tiplari bor: ular alignment'ni kafolatlaydi, nusxalanishdan himoyalaydi (noCopy) va API tipli. Yangi kodda &x bilan ishlaydigan eski funksiyalar o'rniga shu tiplarni ishlating.","src":"https://pkg.go.dev/sync/atomic#Int64"},{"l":"S","t":"mcq","tp":"Context","d":"go","id":30169,"n":"SN170","q":"`ctx` bekor bo'lgach `errgroup`dagi qolgan goroutine'lar avtomatik to'xtaydimi?","o":["Ha, avtomatik","Yo'q — `errgroup.WithContext` faqat ctx'ni bekor qiladi; har goroutine o'zi `ctx.Done()`ni yoki ctx'ni qabul qiluvchi chaqiruvlarni (DB, HTTP) tekshirishi kerak, aks holda ish davom etadi","Faqat `SetLimit` bilan","Panic bo'ladi"],"a":1,"e":"Go'da cancellation kooperativ: hech kim goroutine'ni majburan to'xtata olmaydi. Shuning uchun uzun tsikllarda `select { case <-ctx.Done(): return ctx.Err(); default: }` yoki I/O chaqiruvlariga ctx uzatish kerak. `errgroup.Wait` birinchi xatoni qaytaradi, lekin qolganlarini kutadi — leak shu yerdan chiqadi."},{"l":"S","t":"code","tp":"Sync","d":"go","id":30170,"n":"SN171","q":"Bu kodda qanday xato bor?","c":"type Counter struct {\n    mu sync.RWMutex\n    m  map[string]int\n}\n\nfunc (c *Counter) Inc(k string) {\n    c.mu.RLock()\n    defer c.mu.RUnlock()\n    c.m[k]++\n}","o":["`RWMutex` o'rniga `Mutex` kerak emas, kod to'g'ri","`RLock` yozuvni himoya qilmaydi — bir necha goroutine bir vaqtda `RLock` oladi va map'ga yozadi: `concurrent map writes` panic yoki buzilgan sanoq","`defer` sekin","`map` nil"],"a":1,"e":"`RLock` faqat o'qishlar uchun va ular o'zaro bloklanmaydi. Yozuvda `Lock` kerak. Bu bug yuk ostida tasodifiy panic beradi va testda chiqmaydi — shuning uchun CI'da `go test -race` majburiy. Yuqori konkurentlikda `atomic.Int64` yoki shardlangan hisoblagich mutex'dan tez bo'ladi."},{"l":"S","t":"mcq","tp":"Channels","d":"go","id":30171,"n":"SN172","q":"Worker pool'da natija kanali buferlanmagan va konsumer xato bo'lib chiqib ketdi. Nima bo'ladi?","o":["Hech narsa","Yozuvchi goroutine'lar abadiy bloklanadi — goroutine leak; shuning uchun yozish `select`da `ctx.Done()` bilan birga bo'lishi yoki konsumer kanalni oxirigacha drenaj qilishi kerak","Kanal avtomatik yopiladi","Xabarlar tashlanadi"],"a":1,"e":"Klassik leak: `results <- r` bloklangan, funksiya `return` qilmaydi, `wg.Wait()` ham abadiy kutadi. Naqsh: `select { case results <- r: case <-ctx.Done(): return }`. Qoida — kanalga yozish har doim bekor qilinishi mumkin bo'lgan operatsiya sifatida yozilsin; kanalni yopish esa faqat yozuvchi tomonning vazifasi."},{"l":"St","t":"mcq","tp":"Concurrency","d":"go","id":30172,"n":"SN173","q":"10k tashqi HTTP chaqiruvni parallel qilish kerak. To'g'ri yondashuv?","o":["10k goroutine bir vaqtda","Konkurentlikni cheklash: `errgroup` + `SetLimit(N)` yoki semaphore; N tashqi servis limitiga va o'z resursiga qarab tanlanadi, ustiga per-request timeout, retry budget va umumiy ctx deadline","`GOMAXPROCS`ni oshirish","Kanalsiz `sync.WaitGroup`"],"a":1,"e":"Goroutine arzon, lekin har biri TCP ulanish, xotira buferi va downstream yukini keltiradi — 10k parallel so'rov tashqi servisni yoki o'z FD limitini o'ldiradi. N ni empirik tanlash kerak (latency × N ≈ throughput, Little's law). Qo'shimcha: natijalarni tartibli yig'ish uchun indeksli slice, kanalga yozishdan ko'ra oddiyroq."},{"l":"S","t":"mcq","tp":"Context","d":"go","id":30319,"n":"SN320","q":"`ctx` bekor bo'lgach `errgroup`dagi qolgan goroutine'lar avtomatik to'xtaydimi?","o":["Ha, avtomatik","Yo'q — `errgroup.WithContext` faqat ctx'ni bekor qiladi;
