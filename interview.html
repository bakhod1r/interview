k va himoya?","o":["XSS — escaping","SSRF: ichki tarmoq va cloud metadata (169.254.169.254) ga kirish. Himoya — allowlist domen, DNS resolutsiyadan keyin IP tekshirish (private/link-local blok), redirect'larni qayta tekshirish, alohida egress proxy, IMDSv2","CSRF — token","SQL injection"],"a":1,"e":"Ko'p uchraydigan xato: URL'ni faqat matn sifatida tekshirish — DNS rebinding yoki `http://127.0.0.1.nip.io` bilan aylanib o'tiladi. Shuning uchun tekshiruv aslida ulanadigan IP ustida bo'lishi kerak (`Control`/custom dialer), har redirect uchun takrorlanadi, va tarmoq darajasida egress cheklovi qo'yiladi — bu eng ishonchli qatlam."},{"l":"S","t":"mcq","tp":"Security gotcha","d":"sec","id":30486,"n":"SN487","q":"Xato xabarida `err.Error()` to'g'ridan-to'g'ri foydalanuvchiga qaytarilmoqda. Xavf?","o":["Xavf yo'q, foydali","Ichki ma'lumot oqadi: SQL matni, jadval/ustun nomlari, fayl yo'llari, ichki xost nomlari va kutubxona versiyalari — bu rekognossirovka uchun material. Tashqariga umumiy xabar + `trace_id`, batafsil xato esa faqat logga","Faqat sekinlashadi","Faqat 500 xatolarda"],"a":1,"e":"To'g'ri naqsh: domen xatolarini foydalanuvchiga tushunarli kodga xaritalash (`ERR_INSUFFICIENT_FUNDS`), kutilmagan xatolarga esa `\"internal error\", trace_id: ...` qaytarish. Qo'shimcha: xato matni bo'yicha foydalanuvchi mavjudligini aniqlash mumkin bo'lmasin (enumeration), va stack trace hech qachon javobga tushmasin."},{"l":"S","t":"mcq","tp":"Security gotcha","d":"sec","id":30487,"n":"SN488","q":"Fayl yo'lini foydalanuvchi kiritmasi bilan qurish: `filepath.Join(dir, userInput)`. Yetarlimi?","o":["Ha, `Join` tozalaydi","Yetarli emas: `..` bilan yuqoriga chiqish mumkin (`Join` `Clean` qiladi lekin natija baribir `dir` tashqarisiga chiqishi mumkin) — natijani `filepath.Abs` bilan hisoblab `dir` prefiksini tekshirish, yoki nomni allowlist/UUID bilan almashtirish kerak; symlink ham hisobga olinadi","`Clean` yetarli","Faqat Windows'da muammo"],"a":1,"e":"Ishonchli yondashuv: foydalanuvchi bergan nomni umuman ishlatmaslik — serverda UUID nom berib, asl nomni metadata sifatida DB'da saqlash. Agar kerak bo'lsa: `rel, err := filepath.Rel(base, abs)` va `strings.HasPrefix(rel, \"..\")` tekshiruvi; Go 1.24'da `os.Root` bilan katalogdan chiqmaydigan fayl operatsiyalari mavjud."},{"l":"St","t":"mcq","tp":"Security gotcha","d":"sec","id":30488,"n":"SN489","q":"`math/rand` bilan parol tiklash tokeni generatsiya qilingan. Nima xato?","o":["Sekin ishlaydi","Kriptografik xavfsiz emas: generator holati oldingi natijalar bo'yicha tiklanishi mumkin va tokenlar bashorat qilinadi — `crypto/rand` ishlatilishi shart (token, sessiya ID, sir, sol)","Uzunligi yetarli emas faqat","Faqat eski Go'da"],"a":1,"e":"Go 1.20+ da `math/rand` global seed tasodifiy bo'ldi, lekin bu uni kriptografik qilmaydi — algoritm baribir bashorat qilinadi. Qoida: xavfsizlikka aloqador har qanday tasodifiylik `crypto/rand` dan; token uzunligi kamida 128 bit entropiya va base64url bilan kodlanadi."},{"l":"S","t":"mcq","tp":"Fintech","d":"sec","id":10006,"n":"P7","q":"Valyuta konvertatsiyasi va yaxlitlashda to'g'ri yondashuv?","o":["Konvertatsiyani ko'rsatish paytida float bilan hisoblash","Kursni tranzaksiya paytida qotirib (rate id, vaqt bilan) saqlash; hisob-kitobni butun son (minor units) yoki decimal bilan; yaxlitlash qoidasi aniq belgilangan va har yozuvda farq (rounding difference) alohida hisobga olinadi","Har safar joriy kursni qayta olish","Yaxlitlashni mijozga qoldirish"],"a":1,"e":"Kurs saqlanmasa, keyin hisobot va reconciliation mos kelmaydi. Yaxlitlashda yo'qolgan tiyinlar ledger'da nolga yig'ilishi uchun 'rounding' hisobiga yoziladi. Valyutalarda minor unit soni har xil (JPY — 0, TND — 3) — 100 ga bo'lish universal emas: ISO 4217 ma'lumotiga tayaning."},{"l":"S","t":"mcq","tp":"Fintech","d":"sec","id":10007,"n":"P8","q":"KYC/AML bo'yicha texnik talab qaysi?","o":["Faqat pasport rasmini saqlash","Shaxsni tasdiqlash oqimi, sanktsiya va PEP ro'yxatlari bo'yicha skrining (yangilanib turadigan), shubhali operatsiyalarni aniqlash qoidalari (velocity, structuring) va hisobot; hammasi audit izi bilan","Har tranzaksiyani qo'lda tekshirish","Faqat katta summalarni tekshirish"],"a":1,"e":"Texnik jihatdan: skrining — taxminiy moslik (fuzzy matching) va false positive bilan ishlash; operator uchun ko'rib chiqish navbati; qaror va sababni saqlash. Muhim: bloklash qarorlari biznes/compliance jamoasiniki, muhandis esa jarayonni va izni ta'minlaydi. Ma'lumotni saqlash muddati va maxfiyligi alohida talab."},{"l":"S","t":"mcq","tp":"Fintech","d":"sec","id":10009,"n":"P10","q":"To'lov tizimida statuslarni qanday modellashtirasiz?","o":["Bitta boolean: to'landi/to'lanmadi","Aniq holat mashinasi (created → pending → authorized → captured → settled, hamda failed/refunded/disputed) va faqat ruxsat etilgan o'tishlar; har o'tish vaqti va sababi bilan yoziladi","Statusni provayderdan har safar so'rash","Faqat log yozish"],"a":1,"e":"Nega muhim: provayder hodisalari tartibsiz keladi, retry bor, ba'zi holatlar qaytmaydi (settled → pending bo'lmaydi). Holat mashinasi noto'g'ri o'tishni rad etadi va jimgina buzilishning oldini oladi. Qo'shimcha: 'noma'lum' holat ham bo'lishi kerak — timeout bo'lgan, hali aniqlanmagan to'lovlar uchun."},{"l":"St","t":"open","tp":"Fintech","d":"sec","id":10010,"n":"P11","q":"Fintech tizimida incident: 200 ta foydalanuvchidan ikki marta pul yechilgan. Qanday harakat qilasiz?","m":["To'xtatish: aybdor oqimni (feature flag, worker) o'chirib, yangi zararni to'xtatish","Ta'sirni aniqlash: ledger'dan ikki marta yechilgan tranzaksiyalarni aniq ro'yxat qilish (idempotency key yoki bir xil summa/vaqt bo'yicha)","Mijozga qaytarish: avtomatik refund partiyasi, idempotent va tekshiriladigan; har qaytarish ledger'da alohida yozuv","Kommunikatsiya: mijozlarga xabar, qo'llab-quvvatlash jamoasiga skript, regulyator/bank talab qilsa xabar berish","Ildiz sabab: nega idempotentlik ishlamadi (retry, race, webhook takrori) — test bilan qaytalanmasligini isbotlash","Postmortem va guardrail: ikki marta yechishni aniqlaydigan monitoring va reconciliation alerti"],"e":"Bu savolda texnik bilim emas, tartib va mas'uliyat baholanadi: avval zararni to'xtatish, keyin aniq hisob-kitob, keyin tuzatish va oldini olish. Pul bilan ishlashda 'keyin ko'ramiz' degan yondashuv yo'q."},{"l":"St","t":"mcq","tp":"Fintech","d":"sec","id":10011,"n":"P12","q":"Ledger ma'lumotlarini o'chirish/tuzatish talab qilindi (xato yozuv). To'g'ri yo'l?","o":["Yozuvni UPDATE qilib tuzatish","Hech qachon o'zgartirmaslik: teskari (reversal/compensating) yozuv qo'shiladi va izoh bilan bog'lanadi — tarix va audit izi buzilmaydi","Yozuvni DELETE qilish","Bazadan qo'lda tuzatish"],"a":1,"e":"Immutable ledger — moliyaviy audit va regulyator talabi. Har tuzatish o'z sababi, muallifi va vaqti bilan ko'rinadi. Texnik jihatdan: yozuvlar jadvaliga faqat INSERT huquqi (UPDATE/DELETE grant berilmaydi), o'chirish faqat saqlash muddati siyosati bo'yicha."},{"l":"St","t":"open","tp":"Fintech","d":"sec","id":10012,"n":"P13","q":"Kartadan to'lov qabul qiluvchi tizimda firibgarlikni (fraud) qanday kamaytirasiz?","m":["Qoidalar qatlami: velocity (bir kartadan N urinish), summa chegaralari, geo/IP nomuvofiqligi, qora ro'yxatlar","Signal to'plash: qurilma barmoq izi, sessiya xulqi, tarixiy xatti-harakat","3-D Secure / SCA: risk yuqori bo'lsa qo'shimcha tasdiq so'rash (past riskda ishqalanishni oshirmaslik)","Model qatlami (keyinchalik): skoring, lekin tushuntiriladigan qoidalar bilan birga","O'lchovlar: fraud darajasi, chargeback foizi, false positive (yo'qotilgan haqiqiy mijoz) — muvozanat biznes qarori","Chargeback jarayoni: dalillarni yig'ish, muddatlar, avtomatik hujjat tayyorlash"],"e":"Muhim fikr: fraudni nolga tushirish maqsad emas — konversiya bilan muvozanat. Chargeback foizi kritik ko'rsatkich: yuqori bo'lsa to'lov tizimlari jarimaga tortadi yoki xizmatdan chetlatadi."},{"l":"S","t":"mcq","tp":"Fintech","d":"sec","id":30222,"n":"SN223","q":"Valyuta konvertatsiyasida (FX up va log'lardagi PII ham siyosatga kiritilishi kerak (aks holda 'o'chirdim' deyish noto'g'ri)."},{"l":"S","t":"mcq","tp":"Fintech","d":"sec","id":30467,"n":"SN468","q":"Idempotency key'ning TTL'i va saqlash joyi qanday tanlanadi (to'lovda)?","o":["5 daqiqa keshda","Kamida mijoz retry oynasidan uzun (odatda 24 soat, pul operatsiyalarida ko'pincha kunlar); saqlash joyi — DB (unique constraint bilan), faqat kesh emas: kesh evict qilsa dublikat to'lov bo'ladi","Cheksiz xotirada","Key kerak emas"],"a":1,"e":"Kesh (Redis) tez, lekin eviction/failover'da kalit yo'qolishi mumkin — pul operatsiyasida bu ikki marta to'lash demakdir. Amaliy yechim: DB'da `unique(idempotency_key)` yozuv + javob snapshot'i, Redis esa oldindagi tez tekshiruv sifatida (ixtiyoriy). TTL tugagach kalit qayta ishlatilishi mumkinligini hisobga olib mijozga qoida hujjatlashtiriladi."},{"l":"S","t":"mcq","tp":"Fintech","d":"sec","id":30516,"n":"SN517","q":"Audit log moliyaviy tizimda qanday talablarga javob berishi kerak?","o":["Oddiy log fayl","O'zgarmas (append-only, o'chirib/tahrir qilib bo'lmaydigan saqlash), kim-nima-qachon-qaysi qiymatdan qaysiga, korrelyatsiya ID bilan bog'langan, saqlash muddati siyosati, va kirish nazorati (audit log'ni o'qish ham audit qilinadi)","Faqat xatolarni yozish","Faqat DB triggerlari"],"a":1,"e":"Texnik implementatsiya: alohida jadval/oqim (ilova foydalanuvchisiga faqat `INSERT` huquqi), yoki WORM saqlash (S3 Object Lock); yozuvlar hash zanjiri bilan bog'lansa buzilganini aniqlash mumkin. Muhim: audit log biznes eventlari darajasida bo'lsin ('to'lov qaytarildi, sabab X'), SQL o'zgarishlari darajasida emas — aks holda o'qib bo'lmaydi."},{"l":"S","t":"mcq","tp":"Fintech","d":"sec","id":30520,"n":"SN521","q":"PII ma'lumotlarni saqlashda minimal texnik talablar?","o":["Faqat HTTPS","Shifrlash (at rest — KMS boshqaruvidagi kalit, in transit — TLS), maydon darajasida shifrlash yoki tokenizatsiya eng maxfiylari uchun, kirish nazorati va audit, ma'lumotni minimallashtirish (kerak bo'lmaganini yig'maslik), saqlash muddati va o'chirish jarayoni","Faqat parolni hash qilish","Faqat backup shifrlash"],"a":1,"e":"Ma'lumotni minimallashtirish eng arzon himoya: yig'ilmagan ma'lumot oqib ketmaydi. Amaliy qo'shimchalar: test/stage muhitlarida real PII ishlatmaslik (maskalangan ma'lumot generatsiyasi), log va analitikaga PII tushmasligi, va uchinchi tomon servislariga yuborilayotgan maydonlar ro'yxatini nazorat qilish (data processing agreement)."}];

function list(){
  const f=S.filt;
  return Q.filter(q=>(!f.dom||q.d===f.dom)&&(!f.sec||secOf(q)===f.sec)&&(!f.tp.length||f.tp.includes(q.tp))&&(!f.lvl.length||f.lvl.includes(q.l))&&(!f.type.length||f.type.includes(q.t))&&
    (f.show==="all"||(f.show==="todo"&&!S.res[q.id])||(f.show==="wrong"&&S.res[q.id]&&S.res[q.id].g!=="ok")));

function chips(el,items,isOn,onClick){

    b.setAttribute("aria-pressed",isOn(v));b.onclick=()=>onClick(v);el.appendChild(b);});

function toggle(arr,v){const i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1);}

  let h=`<div class="meta"><span class="tag lvl">${LV[q.l]}</span><span class="tag">${TY[q.t]}</span><span class="tag">${esc(SEC[secOf(q)][0])} › ${esc(q.tp)}</span><span class="pos">#${q.n} · ${S.cur+1}/${L.length}</span></div>
  <p class="q">${q.q}</p>`;
  if(q.c)h+=`<pre>${esc(q.c)}</pre>`;
  if(q.o){
    const sel=done?r.v:draft[q.id];
    h+=`<div class="opts" role="radiogroup">`+q.o.map((o,i)=>{
      let cls="opt";if(done){if(i===q.a)cls+=" right";else if(i===r.v)cls+=" wrong";}else if(sel===i)cls+=" sel";
      return `<button type="button" class="${cls}" data-i="${i}" ${done?"disabled":""} role="radio" aria-checked="${sel===i}"><span class="k">${"ABCD"[i]}</span><span>${inline(o)}</span></button>`;}).join("")+`</div>`;
  }else{
    const val=done?r.v:(draft[q.id]||"");
    h+=`<textarea id="ans-${q.id}" class="${q.t==="sql"?"sql":""}" placeholder="${q.t==="sql"?"SELECT ...":"Javobingizni o'zingizcha yozing — interviewda aytgandek."}" ${done?"readonly":""}>${esc(val)}</textarea>`;
  }
  h+=`<div class="actions"><button class="btn" id="prev" type="button" ${S.cur===0?"disabled":""}>← Oldingi</button>`;
  if(!done)h+=`<button class="btn primary" id="check" type="button">Tekshirish</button>`;
  else h+=`<button class="btn" id="redo" type="button">Qayta yechish</button>`;
  h+=`<span class="spacer"></span><button class="btn" id="next" type="button" ${S.cur===L.length-1?"disabled":""}>Keyingi →</button></div>`;
  if(done)h+=explain(q,r);
  c.innerHTML=h;
  c.querySelectorAll(".opt:not([disabled])").forEach(b=>b.onclick=()=>{draft[q.id]=+b.dataset.i;renderCard();});
  const ta=c.querySelector("textarea:not([readonly])");if(ta)ta.oninput=()=>draft[q.id]=ta.value;
  $("#prev").onclick=()=>go(-1);$("#next").onclick=()=>go(1);
  const ck=$("#check");if(ck)ck.onclick=()=>check(q);
  const rd=$("#redo");if(rd)rd.onclick=()=>{delete S.res[q.id];delete draft[q.id];save();render();};
  c.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{S.res[q.id].g=b.dataset.g;S.res[q.id].self=true;save();render();});
}
function hits(q,txt){const u=txt.toUpperCase().replace(/\s+/g," ");return q.k.map(k=>({k:k.split("|")[0],hit:k.split("|").some(p=>u.includes(p.toUpperCase()))}));}
function explain(q,r){
  let h="";
  if(q.o){
    h+=r.g==="ok"?`<div class="verdict ok">To'g'ri ✓</div>`:r.v==null?`<div class="verdict bad">Javob tanlanmadi. To'g'ri javob: ${"ABCD"[q.a]}</div>`:`<div class="verdict bad">Noto'g'ri. To'g'ri javob: ${"ABCD"[q.a]}</div>`;
  }else{
    const lab={ok:"Bildim",mid:"Qisman",bad:"Bilmadim"};
    h+=`<div class="verdict ${r.g}">O'z bahoyingiz: ${lab[r.g]}${r.self?"":" (avtomatik taxmin — pastda o'zgartiring)"}</div>`;
  }
  h+=`<div class="exp">`;
  if(q.t==="sql"){
    h+=`<h4>Kalit elementlar</h4><div class="keys">${hits(q,r.v||"").map(x=>`<span class="${x.hit?"hit":"miss"}">${esc(x.k)}</span>`).join("")}</div>`;
    h+=`<h4>Namuna yechim</h4><pre>${esc(q.m)}</pre>`;
  }
  if(q.t==="open")h+=`<h4>Kuchli javobda bo'lishi kerak</h4><ul>${q.m.map(x=>`<li>${inline(x)}</li>`).join("")}</ul>`;
  h+=`<h4>Izoh</h4><p>${inline(q.e)}</p>`;
  if(q.src)h+=`<p class="src">Manba: <a href="${esc(q.src)}" target="_blank" rel="noopener noreferrer">${esc(q.src.replace(/^https?:\/\//,"").split("/")[0])}</a> — <span>${esc(q.src)}</span></p>`;
  if(!q.o)h+=`<h4>O'zingizni baholang</h4><div class="self"><button class="btn" data-g="ok" type="button">Bildim</button><button class="btn" data-g="mid" type="button">Qisman</button><button class="btn" data-g="bad" type="button">Bilmadim</button></div>`;
  return h+`</div>`;
}
function check(q){
  if(q.o){const v=draft[q.id];S.res[q.id]={v:v??null,g:v===q.a?"ok":"bad"};}
  else{const v=(draft[q.id]||"").trim();let g="bad";
    if(q.t==="sql"&&v){const hs=hits(q,v),n=hs.filter(x=>x.hit).length;g=n===hs.length?"ok":n>=hs.length/2?"mid":"bad";}
    else if(v.length>40)g="mid";
    S.res[q.id]={v,g};}
  delete draft[q.id];save();render();
}
function go(d){const L=list();S.cur=Math.max(0,Math.min(L.length-1,S.cur+d));save();render();window.scrollTo({top:0});}
function render(){renderSide();renderCard();}
$("#reset").onclick=()=>{if(confirm("Barcha natijalar o'chirilsinmi?")){S.res={};draft={};S.cur=0;save();render();}};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="TEXTAREA"){if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){const b=$("#check");b&&b.click();}return;}
  if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);
  else if(/^[1-4]$/.test(e.key)){const b=document.querySelector(`.opt[data-i="${+e.key-1}"]:not([disabled])`);b&&b.click();}
  else if(e.key==="Enter"){const b=$("#check");if(b){e.preventDefault();b.click();}}
});
render();
</script>

</body></html>
