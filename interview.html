","Texnologiyalarni sanash","Ma'lumotlar bazasi tanlash"],"a":1,"e":"Intervyuerlar eng ko'p baholaydigan signal — noaniq talabni o'zi aniqlab, doirani cheklash (scoping). Hisob-kitob (QPS, hajm, band kenglik) keyingi barcha qarorlarni oqlaydi: 100 RPS uchun bitta PostgreSQL yetarli, 100k RPS uchun butunlay boshqa arxitektura. Texnologiya nomlari eng oxirida keladi."},{"l":"St","t":"mcq","tp":"System design","d":"sys","id":30237,"n":"SN238","q":"'Bu tizimni 10x yuklamaga qanday chidamli qilasiz?' savoliga javob strukturasi?","o":["Kubernetes replicani oshirish","Bo'g'izni aniqlash tartibi: o'lchash (qaysi resurs to'yingan) → arzon g'alabalar (kesh, N+1 yo'q qilish, batching, indeks) → gorizontal skale (stateless qatlam) → ma'lumot qatlami (read replica, partition, sharding) → arxitektura o'zgarishi (asinxron qilish, CQRS) — va har qadamda narx/murakkablik almashinuvi","Hammasini qayta yozish","Faqat DB'ni kattalashtirish"],"a":1,"e":"Yaxshi javob tartibli va o'lchovga tayanadi: 'nima to'yingan?' savolisiz har qanday optimizatsiya taxmin. Odatda eng katta g'alaba arzon qismda bo'ladi (bitta N+1 query yoki keshning yo'qligi), sharding esa oxirgi chora — chunki u operatsion murakkablikni keskin oshiradi."},{"l":"S","t":"mcq","tp":"System design","d":"sys","id":30386,"n":"SN387","q":"Dizayn suhbatida birinchi 5 daqiqada nima qilinishi kerak?","o":["Darhol arxitektura chizish","Talablarni aniqlashtirish: funksional (nima kerak, nima kerak emas), nofunksional (RPS, ma'lumot hajmi, latency maqsadi, izchillik talabi, SLA), keyin kattalik tartibida hisob-kitob — shundan keyingina komponentlar","Texnologiyalarni sanash","Ma'lumotlar bazasi tanlash"],"a":1,"e":"Intervyuerlar eng ko'p baholaydigan signal — noaniq talabni o'zi aniqlab, doirani cheklash (scoping). Hisob-kitob (QPS, hajm, band kenglik) keyingi barcha qarorlarni oqlaydi: 100 RPS uchun bitta PostgreSQL yetarli, 100k RPS uchun butunlay boshqa arxitektura. Texnologiya nomlari eng oxirida keladi."},{"l":"St","t":"mcq","tp":"System design","d":"sys","id":30387,"n":"SN388","q":"'Bu tizimni 10x yuklamaga qanday chidamli qilasiz?' savoliga javob strukturasi?","o":["Kubernetes replicani oshirish","Bo'g'izni aniqlash tartibi: o'lchash (qaysi resurs to'yingan) → arzon g'alabalar (kesh, N+1 yo'q qilish, batching, indeks) → gorizontal skale (stateless qatlam) → ma'lumot qatlami (read replica, partition, sharding) → arxitektura o'zgarishi (asinxron qilish, CQRS) — va har qadamda narx/murakkablik almashinuvi","Hammasini qayta yozish","Faqat DB'ni kattalashtirish"],"a":1,"e":"Yaxshi javob tartibli va o'lchovga tayanadi: 'nima to'yingan?' savolisiz har qanday optimizatsiya taxmin. Odatda eng katta g'alaba arzon qismda bo'ladi (bitta N+1 query yoki keshning yo'qligi), sharding esa oxirgi chora — chunki u operatsion murakkablikni keskin oshiradi."},{"l":"S","t":"mcq","tp":"System design","d":"sys","id":30531,"n":"SN532","q":"Dizayn suhbatida ma'lumotlar bazasini qanday tanlaysiz?","o":["Eng mashhurini aytish","Kirish naqshidan boshlash: query shakllari, izchillik talabi, yozuv/o'qish nisbati, hajm va o'sish, tranzaksiya chegarasi — shundan keyin turi (relyatsion / KV / hujjat / kolonkali / vaqt seriyasi) va nihoyat konkret mahsulot; standart javob 'PostgreSQL, agar X talab bo'lsa Y'","NoSQL zamonaviyroq","Har servisga alohida DB turi"],"a":1,"e":"Kuchli signal — PostgreSQL'ni default deb aytib, qachon undan chiqish kerakligini asoslash (masalan 1 mln yozuv/sek time-series, yoki full-text relevantlik, yoki graf traversal). Zaif signal — mahsulot nomlarini talabdan oldin sanash. Operatsion narx (kim boqadi, backup, monitoring) ham tanlov mezonlaridan."},{"l":"St","t":"mcq","tp":"System design","d":"sys","id":30532,"n":"SN533","q":"Dizaynni qanday yakunlaysiz (oxirgi 5 daqiqa)?","o":["Diagrammani chizib tugatish","Zaif nuqtalarni o'zingiz sanash: yagona nosozlik nuqtalari, bo'g'izlar va ular qachon uriladi, izchillik kompromislari, operatsion masalalar (deploy, migratsiya, monitoring), va keyingi bosqich rejasi (10x o'sishda nima o'zgaradi)","Hech narsa qo'shmaslik","Barcha detalni takrorlash"],"a":1,"e":"Tizimning cheklovlarini o'zi ko'rsata olish — yetuklik signali. Qo'shimcha kuchli yakun: 'birinchi versiyada buni qilmayman, chunki hozircha kerak emas; qachon kerak bo'lishini shu metrika ko'rsatadi' — bu haddan tashqari muhandislikdan qochish qobiliyatini ko'rsatadi."},{"l":"S","t":"open","tp":"Case","d":"sys","id":4011,"n":"A12","q":"CASE: URL qisqartiruvchi (bit.ly) loyihalang. Intervyuda qanday boshlaysiz?","m":["Talablarni aniqlash: qisqa link yaratish, redirect, custom alias, analitika; kutilgan yozish/o'qish nisbati (o'qish ~100x ko'p)","Hisob-kitob: kunlik yangi linklar → QPS, saqlash hajmi, 5 yillik prognoz","Key generatsiya: base62 (7 belgi ≈ 3.5 trln), counter/ID allocator yoki hash + kolliziyani tekshirish","Saqlash: key-value yoki shardlangan SQL; o'qish yo'lida cache (Redis) va CDN","Redirect: 301 (brauzer keshlaydi, analitika yo'qoladi) vs 302 (har safar serverga keladi)","Qo'shimcha: rate limiting, abuse/spam tekshiruvi, muddati (TTL), analitikani async (Kafka) yig'ish"],"e":"Eng ko'p beriladigan case. Kuchli javob talab va raqamlardan boshlaydi, keyin key generatsiya strategiyasini taqqoslaydi. Manbada to'liq yechim bor.","src":"https://bytebytego.com/courses/system-design-interview/design-a-url-shortener"},{"l":"S","t":"open","tp":"Case","d":"sys","id":4012,"n":"A13","q":"CASE: Distributed rate limiter loyihalang (yuzlab API server, foydalanuvchi bo'yicha limit).","m":["Har server alohida sanasa, limit N barobar buziladi — markaziy hisoblagich kerak (Redis)","Algoritm tanlash: fixed window (oddiy, chegarada 2x burst), sliding window log/counter (aniq, qimmatroq), token bucket (burst'ga ruxsat)","Atomiklik: Redis Lua skript yoki INCR + EXPIRE; key = user:endpoint:window","Latency: har query'ga Redis chaqiruvi; alternativ — lokal token + davriy sinxronizatsiya (aniqlik pasayadi)","Failure rejimi: Redis o'lsa fail-open (mavjudlik) yoki fail-closed (himoya) — ongli qaror","Javob: 429 + Retry-After va RateLimit-* headerlar; limitni edge (gateway) va servis level'ida qatlamlash"],"e":"Asosiy nuqta — 'distributed' so'zi: bitta serverdagi hisoblagich yetarli emas. Intervyuda algoritmlarni taqqoslash va failure xulqini aytish kutiladi.","src":"https://bytebytego.com/courses/system-design-interview/design-a-rate-limiter"},{"l":"St","t":"open","tp":"Case","d":"sys","id":4013,"n":"A14","q":"CASE: Ticketmaster/booking tizimi — 10 000 kishi bir vaqtda bitta konsertga chipta olmoqda. Qanday loyihalaysiz?","m":["Asosiy muammo: bitta joy ikki kishiga sotilmasligi (double booking) — kuchli konsistentlik talab qiladigan nuqta","Joyni band qilish: DB transaction'sida SELECT ... FOR UPDATE yoki shartli UPDATE (WHERE status='available'), unique constraint bilan himoya","Vaqtinchalik reservation (masalan 10 daqiqa) — TTL bilan, to'lov tugamasa avtomatik bo'shaydi (Redis TTL yoki fon job)","Trafik to'lqini: virtual queue (waiting room), rate limiting, bot himoyasi","O'qish yo'li (afisha, joylar xaritasi) — cache va CDN; yozish yo'li — kichik va tranzaksion","Hodisa bo'yicha shardlash; mashhur hodisa — hot partition muammosi"],"e":"Bu 'transactional system' turkumidagi case: intervyuchi konkurentlikni qanday hal qilishingizni ko'radi. Eventual consistency bu yerda mos emas — pul va joy.","src":"https://www.hellointerview.com/learn/system-design/problem-breakdowns/ticketmaster"},{"l":"St","t":"open","tp":"Case","d":"sys","id":4014,"n":"A15","q":"CASE: Yangiliklar lentasi (news feed) loyihalang — fan-out on write va fan-out on read farqi nimada?","m":["Fan-out on write (push): post yozilganda har obunachining lentasiga nusxa yoziladi — o'qish juda tez, lekin mashhur akkaunt (10M obunachi) yozishda portlaydi","Fan-out on read (pull): lenta so'ralganda obuna bo'lganlarning postlari yig'iladi — yozish arzon, o'qish qimmat","Gibrid: oddiy akkauntlar uchun push, 'celebrity' akkauntlar uchun pull va o'qishda birlashtirish","Saqlash: lenta — Redis ro'yxati/sorted set, postlar — alohida saqlash; ranking uchun qo'shimcha signal","Pagination — cursor (keyset), yangi postlar oqimi uchun real-time (WebSocket/push)","Cache, sekin bog'liqliklarni async qilish, eventual consistency qabul qilinadi"],"e":"Klassik trade-off savoli. Kuchli javob: 'ikkalasi ham emas — gibrid, chunki taqsimot og'ir dumli (power law)'.","src":"https://bytebytego.com/courses/system-design-interview/design-a-news-feed-system"},{"l":"St","t":"open","tp":"Case","d":"sys","id":4015,"n":"A16","q":"CASE: Chat ilovasi (WhatsApp) loyihalang — xabar yetkazib berish va 'o'qildi' statusi.","m":["Connection: WebSocket (yoki long polling fallback); millionlab ochiq connection uchun connection serverlari qatlami va discovery (qaysi server qaysi foydalanuvchini ushlab turadi)","Xabar oqimi: client → gateway → xabar servisi → saqlash → qabul qiluvchiga push; offline bo'lsa queue'da saqlanadi","ID va tartib: per-chat monoton ID (Snowflake yoki ketma-ket seq) — tartib va dedup uchun","Yetkazish kafolati: at-least-once + client tomonda dedup (message_id); ACK bosqichlari: sent → delivered → read","Saqlash: chat bo'yicha shardlangan, oxirgi xabarlar issiq saqlashda; guruh chat — fan-out","Push notification (offline), E2E shifrlash bo'lsa key almashinuvi"],"e":"Diqqat qaratiladigan nuqtalar: connection'larni masshtablash, xabar tartibi va takrorlanmasligi. 'Xabar yo'qolmasligi' talabini qanday ta'minlashingiz asosiy savol.","src":"https://bytebytego.com/courses/system-design-interview/design-a-chat-system"},{"l":"St","t":"open","tp":"Case","d":"sys","id":4016,"n":"A17","q":"CASE: To'lov tizimi (payment service) loyihalang — pul ikki marta yechilmasligi va hisob-kitob (reconciliation) qanday?","m":["Idempotency key har to'lov query'iga; unique constraint bilan takrorni DB level'ida to'sish","Ledger modeli: double-entry, append-only yozuvlar — balans hisoblanadi, ustiga yozilmaydi","Holat mashinasi: created → authorized → captured → settled / failed / refunded; har o'tish hodisa sifatida saqlanadi","Tashqi provayder (Stripe/PSP) bilan: timeout = noma'lum natija → status query'i (polling) va webhook bilan yarashtirish","Webhook: imzo tekshiruvi, takror yetkazishga chidamlilik (idempotent), tartibsiz kelishi mumkin","Kunlik reconciliation: provayder hisoboti va ichki ledger'ni solishtirish, farqlar uchun alert va qo'lda ko'rib chiqish oqimi","Pul — integer (minor units) + valyuta; PCI DSS: karta ma'lumotini saqlamaslik, tokenizatsiya"],"e":"Bu case'da konsistentlik va audit birinchi o'rinda. Kuchli javob: 'eventual consistency bu yerda mumkin, lekin ledger va idempotentlik qat'iy bo'lishi kerak' va reconciliation'ni alohida aytish.","src":"https://bytebytego.com/courses/system-design-interview/design-a-payment-system"},{"l":"St","t":"open","tp":"Case","d":"sys","id":4017,"n":"A18","q":"CASE: Uber uslubidagi haydovchi-yo'lovchi moslashtirish (matching) tizimini loyihalang.","m":["Haydovchi joylashuvi har 4–5 soniyada yangilanadi — yozish juda ko'p; xotiradagi geo-index (Redis GEO, geohash/S2/H3 katak) ishlatiladi","Qidiruv: yo'lovchi atrofidagi kataklardan nomzodlar, keyin ETA va reyting bo'yicha saralash","Moslashtirish — konkurent muammo: bitta haydovchini ikki buyurtmaga bermaslik (atomik band qilish, TTL bilan taklif)","Holat: taklif → qabul/rad → safar; har bosqich hodisa (Kafka) bilan yoziladi","Shardlash geografiya bo'yicha (shahar/region) — hot region uchun alohida sig'im","Real vaqt kanali: haydovchi va yo'lovchi ilovalari uchun push/WebSocket; network uzilishiga chidamlilik","Talab yuqori bo'lganda: surge pricing, queue, degradatsiya rejasi"],"e":"Baholanadigan nuqtalar: geo-indekslash tanlovi, yozish yukini memory'da ushlash, va moslashtirishdagi poyga holatini qanday yopishingiz.","src":"https://www.hellointerview.com/learn/system-design/problem-breakdowns/uber"},{"l":"St","t":"open","tp":"Case","d":"sys","id":4018,"n":"A19","q":"CASE: Fayl saqlash va sinxronizatsiya (Dropbox/Google Drive) loyihalang.","m":["Fayl bo'laklarga (chunk, masalan 4MB) bo'linadi — faqat o'zgargan bo'lak yuklanadi (delta sync)","Deduplikatsiya: chunk hash (SHA-256) bo'yicha — bir xil bo'lak bir marta saqlanadi","Metadata servisi (fayl daraxti, versiyalar, egalik, ruxsatlar) — SQL; bo'laklar — obyekt saqlash (S3)","Yuklash: client to'g'ridan-to'g'ri S3'ga (pre-signed URL), metadata keyin yangilanadi","Sinxronizatsiya: uzun connection yoki polling orqali o'zgarish jurnalini (change log, cursor bilan) olish","Konflikt: bir faylni ikki qurilma o'zgartirsa — versiya saqlash va 'conflicted copy' yaratish","Ruxsat va ulashish: havola, muddat, kim ko'rgani (audit)"],"e":"Asosiy g'oyalar: chunking, deduplikatsiya va metadata/ma'lumotni ajratish. Intervyuda 1 GB faylning bitta so'zi o'zgarsa nima bo'ladi degan savol albatta keladi.","src":"https://bytebytego.com/courses/system-design-interview/design-google-drive"},{"l":"St","t":"open","tp":"Case","d":"sys","id":4019,"n":"A20","q":"CASE: Avtoto'ldirish (search autocomplete / typeahead) tizimini loyihalang — 10 ms javob kerak.","m":["Ma'lumot tuzilmasi: trie (prefiks daraxti), har tugunda eng mashhur N ta yakuniy natija oldindan hisoblangan","Trie memory'da va shardlangan (prefiks bo'yicha); yangilanish — offline qurish va atomik almashtirish","Mashhurlikni hisoblash: qidiruv loglari → oqim ishlovi (Kafka + agregatsiya) → davriy qayta qurish (masalan soatlik)","Cache: eng ko'p so'raladigan prefikslar uchun Redis/CDN; javob juda kichik","Yozuv xatolariga chidamlilik (fuzzy) va shaxsiylashtirish — narxi latency, ehtiyotkorlik bilan","Filtrlash: nomaqbul so'zlar, yangi trend'larni tezroq ko'rsatish uchun qisqa muddatli qatlam"],"e":"Bu case'da asosiy urg'u — o'qish yo'li juda tez bo'lishi va og'ir hisob-kitob offline bajarilishi. 'Har query'da hisoblamaymiz, oldindan tayyorlaymiz' g'oyasi baholanadi.","src":"https://bytebytego.com/courses/system-design-interview/design-a-search-autocomplete-system"},{"l":"St","t":"open","tp":"Case","d":"sys","id":4020,"n":"A21","q":"CASE: Video platformasi (YouTube) loyihalang — yuklash, kodlash va ko'rish.","m":["Yuklash: client → pre-signed URL bilan obyekt saqlashga (katta fayl uchun multipart, qayta tiklanadigan)","Kodlash: yuklangach hodisa → transcoding pipeline (bir nechta sifat/bitrate, thumbnail, subtitr); og'ir CPU ishi, queue va worker pool bilan","Yetkazish: HLS/DASH bo'laklari CDN orqali; adaptiv bitrate client tomonda","Metadata: video, kanal, ko'rishlar — SQL/NoSQL; ko'rishlar hisobi — async agregatsiya (aniq real vaqt shart emas)","Masshtab: o'qish juda ko'p — cache va CDN birinchi; mashhur video uchun oldindan tarqatish (prefetch)","Qo'shimcha: moderatsiya, huquqlar (DRM), tavsiya tizimi alohida servis"],"e":"Muhim g'oya: og'ir ish (kodlash) asinxron, ko'rish yo'li esa CDN bilan statik bo'lakka aylantirilgan. 'Videoni DB'da saqlamaymiz' — birinchi aytiladigan gap.","src":"https://bytebytego.com/courses/system-design-interview/design-youtube"},{"l":"St","t":"open","tp":"Case","d":"sys","id":4021,"n":"A22","q":"CASE: Taqsimlangan job scheduler (cron servisi) loyihalang — vazifalar o'z vaqtida va bir marta bajarilsin.","m":["Table saqlash: keyingi ishga tushish vaqti bilan (next_run_at) indekslangan table","Olish: SELECT ... WHERE next_run_at <= now() ORDER BY next_run_at FOR UPDATE SKIP LOCKED LIMIT N — parallel worker'lar bir-birini kutmaydi","Bir marta bajarilish: (job_id, scheduled_time) bo'yicha unique constraint — takror ishga tushirish rad etiladi","Bajarilish uzoq bo'lsa: lease va heartbeat, worker o'lsa vazifa qaytariladi (lekin idempotent bo'lishi kerak)","Failure holatlari: retry siyosati, backoff, DLQ, o'tkazib yuborilgan oynalarni (missed run) qanday hal qilish — catch-up yoki tashlab ketish","Masshtab: partitionlash, vaqt zonalari va DST, monitoring (kechikish metrikasi)"],"e":"Senior signal: 'at-least-once + idempotentlik' va SKIP LOCKED naqshi. DST va vaqt zonalari haqida savol berish ham yaxshi taassurot qoldiradi."},{"l":"St","t":"open","tp":"Case","d":"sys","id":4022,"n":"A23","q":"CASE: Multi-tenant SaaS uchun API platformasi loyihalang — kvota, izolyatsiya va hisob-kitob (billing).","m":["Autentifikatsiya: API key yoki OAuth2 client credentials; har query'da tenant konteksti majburiy","Kvota va rate limit tenant bo'yicha, tarif rejasiga bog'langan; oshganda 429 va aniq header'lar","Izolyatsiya: ma'lumot level'ida (RLS yoki majburiy tenant_id), resurs level'ida (alohida queue/pool), kerak bo'lsa dedicated tier","Foydalanishni hisoblash (metering): har query hodisa sifatida yoziladi → agregatsiya → billing; takrorlanmaslik va yo'qolmaslik muhim","Observability: tenant bo'yicha latency, xato va xarajat; 'noisy neighbor'ni aniqlash","Versiyalash va deprecation siyosati; sandbox muhit va hujjatlar"],"e":"Staff signal: metering'ni to'lov bilan bog'lash (yo'qolgan hodisa = yo'qolgan pul), va izolyatsiyani bir necha qatlamda ko'rsatish."},{"l":"S","t":"open","tp":"Case","d":"sys","id":4023,"n":"A24","q":"CASE: Real vaqtda 'trend'dagi top-K' (eng ko'p qidirilgan 10 so'z) tizimini loyihalang.","m":["Oqim: hodisalar Kafka'ga → oqim ishlovi (Flink/Kafka Streams yoki o'z worker'laringiz)","Aniq hisob juda qimmat — taxminiy strukturalar: Count-Min Sketch (chastota) + heap (top-K), HyperLogLog (unikal sanoq)","Oyna: tumbling yoki sliding window (masalan oxirgi 5 daqiqa), kechikkan hodisalar uchun watermark","Yakuniy natija Redis'da saqlanadi va API undan o'qiydi — o'qish juda tez","Aniqlik va narx muvozanati: taxminiy natija odatda yetarli (trend ro'yxati uchun)","Failure: qayta ishlov (replay) imkoniyati, idempotent yozish"],"e":"Bu case'da intervyuchi 'aniqlikni biroz qurbon qilib, memory va vaqtni yutish' g'oyasini bilishingizni tekshiradi. Count-Min Sketch nomini aytish kuchli signal."},{"l":"St","t":"open","tp":"Case","d":"sys","id":4024,"n":"A25","q":"CASE: Notification servisi (email, SMS, push) loyihalang.","m":["Ishlab chiqaruvchi servislar → queue (Kafka/SQS) → notification worker → provayder (SES, Twilio, APNs/FCM)","Idempotentlik: notification_id bo'yicha dedup — bitta hodisadan ikki xabar ketmasin","Retry: provayder xatosi uchun exponential backoff + DLQ; provayder rate limitiga rioya","Foydalanuvchi sozlamalari: kanal tanlovi, unsubscribe, quiet hours, tilga moslash (template servisi)","Prioritet: OTP/security xabarlari alohida yuqori prioritetli queue","Kuzatuv: yuborildi/yetkazildi/ochildi metrikalar, provayder failover"],"e":"Bu case'da intervyuchi asinxron arxitektura, idempotentlik va provayder failure'larini qanday boshqarishingizni ko'radi. Shablon boshqaruvi va foydalanuvchi sozlamalari ham baholanadi.","src":"https://bytebytego.com/courses/system-design-interview/design-a-notification-system"},{"l":"S","t":"open","tp":"Case","d":"sys","id":14000,"n":"SR1","q":"CASE: Taqsimlangan kesh (Redis/Memcached kabi) loyihalang.","m":["API: GET/SET/DEL + TTL; kalit bo'yicha shardlash — consistent hashing va virtual node'lar","Eviction: LRU yoki LFU, taxminiy (sampling) implementatsiya — aniq LRU qimmat","Xotira: slab/arena allokatsiya, fragmentatsiyani kamaytirish; maksimal qiymat hajmi","Mavjudlik: replika (async) va failover; kesh yo'qolsa DB'ni himoya qilish (stampede, warmup)","Hot key: client-side kesh, key splitting, yoki replikadan o'qish","Kuzatuv: hit ratio, evictions, p99, ulanishlar soni; klaster kengaytirilganda ma'lumot ko'chishi"],"e":"Bu case'da intervyuchi ko'radigan asosiy nuqtalar: consistent hashing, eviction siyosati va kesh yiqilganda DB'ni himoya qilish. 'Kesh — haqiqat manbai emas' degan tamoyilni aniq aytish kerak.","src":"https://www.educative.io/blog/system-design-interview-questions"},{"l":"S","t":"open","tp":"Case","d":"sys","id":14001,"n":"SR2","q":"CASE: Web crawler loyihalang (milliardlab sahifa).","m":["Frontier (navbat): URL'lar prioriteti, domen bo'yicha politeness va rate limit, qayta tashrif chastotasi","Dedup: URL normalizatsiyasi va ko'rilganlarni tekshirish (Bloom filter + doimiy saqlash), kontent dublikati uchun hash/simhash","Yuklash: DNS keshi, robots.txt hurmati, timeout va retry, sekin saytlar uchun alohida navbat","Saqlash: xom HTML — obyekt saqlash, metadata — DB; keyin parsing va indekslash pipeline'i","Masshtab: worker'lar domen bo'yicha shardlangan, tiklanadigan holat (checkpoint), o'lgan worker ishini qayta olish","Tuzoqlar: cheksiz kalendar sahifalar (crawler trap), sessiya id'li URL'lar, juda katta fayllar"],"e":"Baholanadigan nuqtalar: politeness, dedup strukturasi va to'xtatib-davom ettirish imkoniyati. Bloom filter'ni nomlab, uning false positive xususiyatini tushuntirish kuchli signal."},{"l":"S","t":"open","tp":"Case","d":"sys","id":14002,"n":"SR3","q":"CASE: Instagram uslubidagi ilova (rasm yuklash + lenta) loyihalang.","m":["Media: client to'g'ridan-to'g'ri obyekt saqlashga (pre-signed URL), keyin async ishlov — turli o'lchamlar, format, moderatsiya; yetkazish CDN orqali","Metadata: post, like, follow — relatsion yoki wide-column; like hisoblagichi — agregat/counter, aniq real vaqt shart emas","Lenta: gibrid fan-out (oddiy akkauntga push, mashhurga pull), cursor pagination","Kesh: issiq lenta va profil ma'lumotlari Redis'da; thumbnail CDN'da uzoq TTL","Masshtab: o'qish yozishdan ancha ko'p; yozish yo'li sodda, o'qish yo'li optimallashtirilgan","Qo'shimcha: stories uchun TTL, hashtag qidiruv (Elasticsearch), tavsiya alohida servis"],"e":"Bu case fan-out va media pipeline'ni birga tekshiradi. Kuchli javobda: 'rasm DB'da saqlanmaydi', 'like hisobi eventual consistent bo'lishi mumkin' va CDN roli aniq aytiladi."},{"l":"St","t":"open","tp":"Case","d":"sys","id":14003,"n":"SR4","q":"CASE: Google Docs uslubidagi hamkorlikdagi tahrirlash tizimini loyihalang.","m":["Asosiy muammo: bir vaqtda ko'p foydalanuvchi bitta hujjatni o'zgartiradi — konfliktni hal qilish kerak","Ikki yondashuv: Operational Transformation (OT — markaziy server operatsiyalarni transformatsiya qiladi) yoki CRDT (konflikt matematik tarzda yo'q, offline uchun qulay, lekin metadata o'sadi)","Transport: WebSocket, operatsiyalar ketma-ketligi (versiya raqami) va qayta ulanishda sinxronizatsiya","Saqlash: operatsiya jurnali + davriy snapshot; tarix va 'undo' shu jurnaldan","Masshtab: hujjat bo'yicha shardlash — bitta hujjat bitta koordinator/serverga bog'lanadi (session affinity)","Qo'shimcha: kursor/presence, ruxsatlar, offline rejim, katta hujjatlar uchun bo'laklash"],"e":"Senior/Staff darajadagi case. Kutiladigan javob OT va CRDT trade-off'ini aytib, bittasini asoslab tanlaydi va 'har hujjat uchun bitta yozish koordinatori' g'oyasini ko'rsatadi.","src":"https://www.hellointerview.com/learn/system-design/in-a-hurry/problem-breakdowns"},{"l":"St","t":"open","tp":"Case","d":"sys","id":14004,"n":"SR5","q":"CASE: S3 kabi obyekt saqlash tizimini loyihalang.","m":["API: PUT/GET/DELETE, multipart upload, kalit (prefiks) bo'yicha ro'yxat; obyektlar o'zgarmas — yangilash = qayta yozish","Ichki: metadata servisi (kalit → bo'lak joylashuvi) va ma'lumot node'lari; metadata juda ko'p — shardlangan KV","Chidamlilik: replikatsiya yoki erasure coding (masalan 6+3) — joy tejaydi; checksum va fon rejimida scrubbing","Konsistentlik: yozishdan keyin o'qish (read-after-write) kafolati metadata commit tartibi bilan beriladi","Masshtab: hot prefiks muammosi, throttling, katta obyektlar uchun parallel bo'lak yuklash","Qo'shimcha: versiyalash, lifecycle (arxivga ko'chirish), shifrlash, kirish siyosatlari"],"e":"Baholanadigan g'oyalar: metadata va ma'lumotni ajratish, erasure coding, va obyektning o'zgarmasligi. Bu case senior+ darajada tez-tez beriladi."},{"l":"St","t":"open","tp":"Case","d":"sys","id":14005,"n":"SR6","q":"CASE: Monitoring/metrics tizimini (Prometheus kabi) loyihalang.","m":["Yig'ish: pull (scrape) yoki push; ma'lumot modeli — metrika nomi + labellar + vaqt qatori","Saqlash: time-series DB — vaqt bo'yicha bloklar, siqish (delta-of-delta, XOR), eski ma'lumotni downsampling","Kardinallik: labellar kombinatsiyasi portlashi asosiy xavf — limit va kuzatuv","Query: agregatsiya tili, oyna funksiyalari; og'ir query'lar uchun limit va timeout","Alerting: qoidalar dvigateli, for davri (flapping'ga qarshi), guruhlash va marshrutlash (dedup)","Masshtab/HA: shardlash (target bo'yicha), uzoq muddatli saqlash uchun alohida qatlam (Thanos/Mimir kabi)"],"e":"Bu case senior intervyularda ko'payib bormoqda. Muhim: kardinallik muammosi va saqlash siqilishi — aynan shular tizimning narxini belgilaydi."},{"l":"St","t":"open","tp":"Case","d":"sys","id":14006,"n":"SR7","q":"CASE: Kafka kabi pub/sub tizimini loyihalang.","m":["Model: topic → partition; har partition — append-only log, offset bilan; tartib partition ichida","Chidamlilik: har partition N replikaga yoziladi, leader-follower; ISR va acks siyosati","Consumer: group va offset saqlash, rebalance; iste'mol o'qish pozitsiyasi — brokerda emas, offsetda","Ishlash: ketma-ket disk yozish, sahifa keshi, zero-copy, batching va siqish","Saqlash: retention (vaqt/hajm) yoki compaction; eski ma'lumotni arzon storage'ga ko'chirish (tiered)","Koordinatsiya: metadata va leader saylovi uchun konsensus (ZooKeeper yoki KRaft)"],"e":"Kuchli javob 'nega log tez' degan savolga aniq javob beradi: ketma-ket I/O va batching. Yana: partition — parallellik va tartibning birligi ekanini ta'kidlash."},{"l":"S","t":"open","tp":"Case","d":"sys","id":14007,"n":"SR8","q":"CASE: Real vaqt leaderboard (10 mln o'yinchi, top 100 va har o'yinchining o'rni) loyihalang.","m":["Asos: Redis sorted set — ZADD, ZREVRANGE top uchun O(log n), ZREVRANK o'rin uchun","Yozish ko'p bo'lsa: ballarni batch yoki oqim bilan agregatsiya qilib, ZSET ni davriy yangilash","Shardlash: o'yin/mavsum/region bo'yicha alohida ZSET; global top uchun shardlardan yig'ish","Ishonchlilik: Redis — tezkor qatlam, haqiqat manbai DB; qayta qurish (rebuild) skripti bo'lsin","Aniq o'rin qimmat bo'lsa: taxminiy o'rin (persentil, bucket) ko'rsatish","Kuzatuv: hot mavsum kalitlari, xotira hajmi (10 mln element ≈ yuzlab MB)"],"e":"Bu case Redis ma'lumot tuzilmalarini bilishni tekshiradi. Kuchli javob taxminiy o'rin variantini ham taklif qiladi — aniq reyting har doim ham biznes talabi emas."},{"l":"St","t":"open","tp":"Case","d":"sys","id":14008,"n":"SR9","q":"CASE: LLM API xizmatini (inference serving) loyihalang — 2026 intervyularida tez-tez so'raladi.","m":["Yuk profili: so'rovlar uzun va turli davomiylikda; GPU qimmat va cheklangan resurs","Navbat va batching: continuous batching bilan GPU utilizatsiyasini oshirish; prioritet (interaktiv va fon)","Streaming javob (SSE) — birinchi token vaqti (TTFT) asosiy UX metrikasi","Kesh: bir xil prompt uchun javob keshi, prefix/KV kesh; semantik kesh ehtiyotkorlik bilan","Xarajat nazorati: token bo'yicha hisob, tenant kvotalari, model tanlovi (kichik model arzon), rate limit","Ishonchlilik: timeout, retry (idempotent emas — ehtiyot), fallback model, provayder nosozligiga degradatsiya"],"e":"Yangi, lekin tez tarqalayotgan case. Kutiladigan signal: GPU'ni CPU kabi masshtablab bo'lmasligini tushunish, batching va navbat, va xarajatni birinchi darajali talab sifatida ko'rish.","src":"https://www.designgurus.io/blog/system-design-interviews-at-google-meta-amazon"},{"l":"St","t":"open","tp":"Case","d":"sys","id":14009,"n":"SR10","q":"CASE: Deploy tizimi (ichki PaaS) loyihalang — jamoalar servislarini o'zi chiqara olsin.","m":["Pipeline: build (reproducible, image digest) → test → artefakt registri → muhitlarga chiqarish","Strategiya: rolling/canary/blue-green tanlovi, avtomatik metrikaga qarab to'xtatish (auto-rollback)","Konfiguratsiya: muhit bo'yicha ajratilgan, sirlar secret manager orqali, GitOps bilan deklarativ holat","Ruxsat va audit: kim nimani chiqara oladi, tasdiqlash oqimi, har deploy izi","Guardrail'lar: production readiness tekshiruvi (health check, SLO, on-call egasi), migratsiya linteri","Kuzatuv: deploy chastotasi, lead time, change failure rate, MTTR (DORA)"],"e":"Staff darajadagi 'platforma' case'i. Kuchli javob mahsulot sifatida yondashadi: ichki mijoz kim, qanday yo'l eng oson bo'lishi kerak va muvaffaqiyat qanday o'lchanadi."},{"l":"S","t":"open","tp":"Case","d":"sys","id":30109,"n":"SN110","q":"Taqsimlangan rate limiter loyihalang: 10k RPS, per-API-key 1000 req/min, bir necha region.","m":["Algoritm tanlovi: fixed window oddiy lekin chegara chetida 2x burst beradi; sliding window log aniq lekin xotira qimmat; token bucket — burst ruxsati bilan tekis, amalda eng ko'p ishlatiladi","Holat joyi: Redis'da per-key counter, atomik Lua skript (`INCR` + `EXPIRE` yoki token bucket hisob-kitobi bitta skriptda) — race yo'q","Latency: har so'rovda Redis round-trip (~0.5ms) maqbul, lekin ishonchlilik uchun Redis yiqilsa 'fail open' yoki mahalliy zaxira limit (degradatsiya siyosati aniq yozilgan bo'lishi kerak)","Yuqori RPS'da: local token bucket + davriy markaziy sinxronlash (approximate) — aniqlikni ozgina yo'qotib, Redis yukini 10-100x kamaytirish","Multi-region: global qat'iy limit qimmat (cross-region RTT). Amaliy yechim — limitni regionlarga taqsimlash (har biriga kvota ulushi) yoki eventual sinxronlash bilan yumshoq global limit","Javob kontrakti: 429 + `Retry-After`, `X-RateLimit-Limit/Remaining/Reset` headerlari; limit turlari (per-key, per-IP, per-endpoint narxi bilan — og'ir endpoint ko'proq token yeydi)","Hot key: bitta yirik mijoz bitta Redis slotini qizdiradi — kalitni shardlash (`key:{bucket}`) yoki mijozga alohida instansiya","Kuzatuv: 429 nisbati mijoz bo'yicha, limitga urilgan top kalitlar, va limit o'zgarishini konfiguratsiyadan (deploy'siz) berish"],"e":"Intervyuda ko'pincha 'Redis INCR' bilan to'xtaydilar. Farqlovchi detallar: atomiklik (Lua), Redis yiqilganda siyosat, yuqori RPS uchun mahalliy approximate limit, va multi-region'da qat'iy global limitning narxi."},{"l":"S","t":"open","tp":"Case","d":"sys","id":30110,"n":"SN111","q":"Taqsimlangan unique ID generator loyihalang (Twitter Snowflake uslubida). Nega auto-increment yaramaydi?","m":["Talablar: global unikal, taxminan vaqt bo'yicha o'sish (indeks lokalligi va sort uchun), koordinatsiyasiz va tez (mahalliy generatsiya), 64-bit sig'ish","Snowflake tuzilishi: 41 bit millisekund (custom epoch, ~69 yil) + 10 bit machine/worker ID + 12 bit sequence (ms ichida 4096 ID) → bir node ~4M ID/sek","Worker ID taqsimlash: ZooKeeper/etcd yoki Kubernetes StatefulSet ordinal; ikki node bir ID olsa — kolliziya, shuning uchun bu joy kritik","Clock muammosi: NTP orqaga sakrasa duplikat bo'ladi — oxirgi timestamp saqlanadi va orqaga ketishda kutish yoki xato qaytarish; monotonik saat ishlatish","Alternativalar: UUIDv7/ULID (koordinatsiyasiz, vaqt prefiksli, 128-bit — indeks kattaroq), DB sequence bilan blok ajratish (`hi/lo`: har instansiya 1000 lik diapazon oladi — oddiy va ishonchli)","Auto-increment muammosi: bitta nuqtada koordinatsiya (yozuv bottleneck, shardlashda konflikt), tashqi ID sifatida sanab chiqiladi (enumeration hujumi, biznes ma'lumoti oqadi)","Xavfsizlik nuqtasi: vaqt bo'yicha o'suvchi ID raqobatchiga hajm sur'atini oshkor qiladi — tashqi API'da alohida opaque ID yoki hashid ishlatiladi"],"e":"Bu klassik savolning mag'zi: koordinatsiya narxini bit-budjetga almashtirish. Eng ko'p e'tibordan qoladigan qism — worker ID taqsimlash va soat orqaga ketishi."},{"l":"St","t":"open","tp":"Case","d":"sys","id":30111,"n":"SN112","q":"Chat tizimi loyihalang (1-1 va guruh, online status, o'qildi belgisi, 50 mln DAU).","m":["Ulanish qatlami: WebSocket gateway (stateful, faqat ulanishni ushlaydi), autentifikatsiya handshake'da, `user_id → gateway_pod` xaritasi Redis'da TTL bilan","Xabar yo'li: client → gateway → message service → (a) Kafka/log'ga yozish, (b) qabul qiluvchi gateway'ga pub/sub orqali push; offline bo'lsa push notification","Saqlash: chat xabarlari — kalit `(conversation_id, message_id)`, message_id monoton (Snowflake) → tartib va kursor pagination; Cassandra/ScyllaDB yoki partitionlangan PostgreSQL, so'nggi xabarlar keshda","Yetkazib berish semantikasi: at-least-once + client dedupe (`client_msg_id`); 'sent/delivered/read' — alohida yengil eventlar, guruhda read receipt agregatlangan (har a'zo uchun alohida yozuv qimmat)","Guruh fan-out: kichik guruh (≤500) — write fan-out; katta kanal (100k) — read fan-out, a'zo o'z kursorini olib keladi","Presence: heartbeat + TTL kalit; statusni har o'zgarishda barchaga yubormaslik — faqat ochiq chat oynasidagi kontaktlarga, va throttling bilan","Tartib: bitta suhbat bo'yicha server tomonda sequence beriladi (client vaqti emas) — clock skew muammosi yo'qoladi","Shkala/operatsion: gateway'lar arzon skale, deploy paytida graceful drain (reconnect bo'roniga qarshi jitter), va kanal bo'yicha backpressure","Maxfiylik: E2E shifrlash talab bo'lsa — server xabar mazmunini ko'rmaydi, demak server tomonda qidiruv va moderatsiya yo'q (biznes bilan aniq kelishiladi)"],"e":"Bu savolda eng ko'p tekshiriladigan joylar: ulanish holatini yo'naltirish (pub/sub), xabar tartibi va ID, guruh fan-out strategiyasi, va offline yetkazib berish. E2E'ning natijasini aytish — kuchli signal."},{"l":"St","t":"open","tp":"Case","d":"sys","id":30112,"n":"SN113","q":"Taksi/dostavka uchun 'yaqin haydovchilarni topish' tizimini loyihalang (real-time geo, 100k faol haydovchi).","m":["Yozuv yo'li: haydovchi har 4-5 sekundda lokatsiya yuboradi → 100k/5s ≈ 20k RPS. Bu ma'lumot o'tkinchi: asosiy nusxa xotirada/Redis'da, tarix esa alohida (analitika uchun Kafka → ombor)","Indekslash: geohash yoki S2/H3 cell — `GEOADD`/`GEOSEARCH` (Redis) yoki cell ID bo'yicha bucket; qidiruv radiusi cell va qo'shni cell'larni skanerlaydi","Cell o'lchami zichlikka bog'liq: shahar markazida kichik, chekkada katta — aks holda bitta cell'da 10k haydovchi (hot partition) yoki bo'sh skan","Matching: 'eng yaqin' to'g'ri chiziq masofasi emas — ETA (yo'l grafi) bo'yicha; shuning uchun avval nomzodlar (top 20 geo bo'yicha), keyin routing servisidan ETA","Konkurentlik: bir haydovchini ikki buyurtmaga bermaslik — atomik holat o'zgarishi (`available → assigned`, shartli update yoki Redis Lua), taklif TTL bilan (haydovchi 15s ichida javob bermasa keyingisiga)","Shardlash: geografiya bo'yicha (region/city) — tabiiy va trafik lokal; cross-region query kam","Ishonchlilik: lokatsiya yo'qolsa oxirgi ma'lum joy + TTL bilan 'stale' deb belgilash; yozuvni at-most-once deb hisoblash mumkin (eskirgan lokatsiya keraksiz)","Kuzatuv: assignment latency, taklifni rad etish nisbati, hot cell'lar, va surge zonalari"],"e":"Farqlovchi nuqtalar: lokatsiya ma'lumotining o'tkinchi tabiati (DB'ga har yozishga urinish — klassik xato), zichlikka moslashuvchi cell, va tayinlashning atomikligi."},{"l":"S","t":"open","tp":"Case","d":"sys","id":30113,"n":"SN114","q":"Video yuklash va transcoding pipeline'ini loyihalang (YouTube uslubida).","m":["Yuklash: client to'g'ridan-to'g'ri obyekt saqlashga (S3 presigned URL, multipart) — backend katta faylni o'tkazmaydi; resumable upload (tarmoq uzilsa davom etadi)","Trigger: upload tugashi event (S3 notification) → queue → transcode workerlar; metadata DB'da `status: uploaded → processing → ready/failed`","Transcoding: videoni segmentlarga bo'lib parallel ishlash (chunk-level parallelism), har chunk uchun bir necha sifat (240p…1080p) + HLS/DASH manifest; ish idempotent (`video_id + rendition + chunk`)","Resurs: transcode CPU/GPU og'ir va uzun — alohida worker pool, spot instance bilan arzonlashtirish (ish qayta bajarilishga tayyor), prioritet navbat (kichik video tez yo'lda)","Yetkazib berish: CDN + segment keshlash, imzolangan URL (huquq), adaptive bitrate client tomonda","Ishonchlilik: har qadam retry + DLQ; qisman muvaffaqiyat (720p tayyor, 1080p yiqildi) — foydalanuvchiga mavjud sifatlar bilan chiqarish","Qo'shimcha oqimlar: thumbnail, subtitr/ASR, moderatsiya (nsfw/copyright) — alohida consumer, video 'ready' bo'lishi bu tekshiruvlarga bog'lanishi mumkin","Kuzatuv: navbat lag, transcode vaqti/daqiqa video, xato nisbati kodek bo'yicha, xarajat/video"],"e":"Kutiladigan asosiy g'oyalar: og'ir faylni backenddan o'tkazmaslik (presigned), uzun ishni idempotent chunklarga bo'lish, va status mashinasi bilan qisman natijani ko'rsatish."},{"l":"S","t":"open","tp":"Case","d":"sys","id":30114,"n":"SN115","q":"Autocomplete/typeahead servisini loyihalang: 10 mln so'rov/kun, javob <50ms.","m":["O'qish og'ir, yozuv kam — asosiy g'oya: oldindan hisoblash. Prefiks → top-N tavsiya xaritasi (trie yoki oddiy KV: `prefix -> [natijalar]`)","Saqlash: trie'ni xotirada ushlash (har node'da top-K keshlangan) — javob mikro-sekundlarda; yoki Redis'da prefiks kaliti bo'yicha sorted set","Reyting: chastota + yangilik (time decay) + personalizatsiya (foydalanuvchi tarixi alohida qatlam sifatida qo'shiladi)","Yangilanish: real-time emas — log'lardan (Kafka) davriy batch ishlov (masalan har 10-30 daqiqa) yangi trie qurilib atomik almashtiriladi (versiyalangan snapshot)","Edge: qisqa prefiks (1-2 harf) eng qizigan — CDN/edge keshda; xato yozilish (typo) uchun fuzzy (edit distance ≤1) qatlami; til/lokal bo'yicha alohida model","Filtrlash: taqiqlangan so'zlar va shaxsiy ma'lumot chiqib ketmasligi (qidiruv tarixidan sizib chiqish — real incident turi)","Shkala: stateless servis + mahalliy xotira nusxasi (har podda to'liq trie bo'lsa — arzon va tez), katta bo'lsa prefiks bo'yicha shardlash","Kuzatuv: p99 latency, bo'sh natija nisbati, CTR (tavsiya sifatining o'lchovi)"],"e":"Bu keysning kaliti — qidiruvni so'rov vaqtida bajarmaslik. Batch qurilgan snapshot + xotiradagi struktura 50ms talabini oson bajaradi; real-time yangilash odatda kerak emas va qimmat."},{"l":"S","t":"open","tp":"Case","d":"sys","id":30115,"n":"SN116","q":"O'yin leaderboard'i: 10 mln o'yinchi, real-time reyting va 'mening o'rnim' so'rovi.","m":["Asosiy struktura: Redis sorted set (`ZADD`, `ZREVRANGE` top-N, `ZREVRANK` o'rin) — O(log N), 10 mln a'zo bitta instansiyada sig'adi (~bir necha yuz MB)","Top-N so'rovi juda ko'p — natija qisqa TTL (1-5s) bilan keshlanadi; 'mening o'rnim' esa har foydalanuvchi uchun alohida — `ZREVRANK` arzon","Doimiylik: Redis — tezkor nusxa, haqiqat manbasi DB (ball o'zgarishi eventi yoziladi); Redis yo'qolsa DB'dan qayta quriladi (rebuild skripti bo'lishi shart)","Davriy leaderboard (kunlik/haftalik/season): kalitga davr qo'shiladi (`lb:2026-09`), eski davrlar arxivga, TTL bilan tozalanadi","Juda katta miqyos: ballni bucket'larga bo'lish (approximate rank — bucket ichida aniq, bucketlar yig'indisi bilan taxminiy o'rin) — aniqlikni latency'ga almashtirish","Adolat/anti-cheat: ball serverda hisoblanadi (client yubormaydi), tezlik anomaliyasi tekshiriladi, va o'zgarishlar audit log'da","Do'stlar orasidagi reyting: alohida kichik sorted set yoki do'stlar ID'lari bo'yicha `ZSCORE` yig'ib saralash (N kichik)","Kuzatuv: yozuv RPS, `ZREVRANK` p99, kesh hit nisbati"],"e":"Bu savol 'qaysi ma'lumot strukturasi' ni tekshiradi, lekin senior signali — doimiylik (Redis haqiqat manbasi emas), davrlar va approximate rank bilan miqyoslash."},{"l":"St","t":"open","tp":"Case","d":"sys","id":30116,"n":"SN117","q":"Taqsimlangan job scheduler loyihalang (cron + kechiktirilgan vazifalar, 1 mln jadval, 'exactly-once' ta'sir).","m":["Model: `jobs(id, schedule, next_run_at, status, owner, attempt)`; ishlov — `next_run_at <= now` bo'yicha tanlash, `FOR UPDATE SKIP LOCKED` bilan bir vazifani faqat bitta worker oladi","Kechiktirilgan vazifa uchun alternativa: Redis sorted set (score = ishga tushish vaqti) yoki Kafka + tumbling bucket; DB varianti kuzatiladigan va tranzaksion — odatda afzal","Ikki marta bajarilmaslik: qat'iy exactly-once yo'q — lease (visibility timeout) + `run_key = (job_id, scheduled_for)` unique yozuvi bilan ta'sir idempotent qilinadi","Worker o'lganda: lease muddati o'tgach vazifa qaytib olinadi (shuning uchun bajarish idempotent bo'lishi shart), `attempt` oshadi, N martadan keyin DLQ va alert","Cron semantikasi: vaqt zonasi va DST (DST'da 02:30 yo'q kun / ikki marta bo'ladigan kun), o'tkazib yuborilgan ishlarni to'ldirish siyosati (catch-up yoki skip) — aniq belgilanadi","Thundering herd: ko'p vazifa aynan 00:00 ga belgilangan — jitter qo'shish va per-tenant konkurentlik cheklovi","Miqyos: vazifalarni `next_run_at` bo'yicha indeks + partitionlash; poller'lar ko'p, lekin `SKIP LOCKED` tufayli koordinatsiya arzon","Kuzatuv: kechikish (scheduled vs actual), navbatdagi vazifalar yoshi, xato/retry nisbati, uzoq ishlayotgan vazifalar"],"e":"Eng ko'p e'tibordan chetda qoladigan uchta joy: lease bilan o'lgan workerdan tiklash, DST/cron edge case'lari, va 00:00 herd. 'Exactly-once' so'zi eshitilganda idempotentlikka burish to'g'ri javob."},{"l":"St","t":"open","tp":"Case","d":"sys","id":30117,"n":"SN118","q":"Konsert chiptalarini sotish tizimi: 50k joy, bir vaqtda 500k odam. Overselling bo'lmasin.","m":["Kirish oqimini boshqarish: virtual navbat (waiting room) — foydalanuvchilar tokenlar bilan bosqichma-bosqich kiritiladi; CDN'da statik sahifa, backend faqat kirganlarni ko'radi","Inventar: har joy alohida yozuv (`seat(event_id, seat_no, status, hold_until, user_id)`); rezerv — atomik shartli update: `UPDATE ... SET status='held', hold_until=now()+'10 min' WHERE seat_no=$1 AND status='free'`, ta'sirlangan qator 0 bo'lsa band","Hold muddati: to'lov tugamasa avtomatik bo'shaydi (davriy tozalash yoki `hold_until` ni o'qishda hisobga olish — 'lazy expiry' ishonchliroq)","To'lov: hold ichida PSP bilan; idempotency key bilan, natija noma'lum bo'lsa reconcile (pul ketib chipta berilmasligi — eng yomon holat)","Hot row: bitta mashhur sektor uchun raqobat — Redis'da tez rad etish qatlami (qolgan joy soni), DB esa yakuniy haqiqat (arzon 'joy yo'q' javobi 500k so'rovni DB'dan uzoqda to'xtatadi)","Adolat: birinchi kelgan birinchi xizmat — navbat tokenida vaqt; bot himoyasi (rate limit per akkaunt/karta/IP, CAPTCHA), aks holda 'adolat' texnik emas balki firibgarlik masalasi bo'lib qoladi","Umumiy joy (nomerlanmagan) holati: atomik hisoblagich (`DECR` shart bilan) — lekin yakuniy tasdiq DB constraint'da (`qty >= 0`)","Kuzatuv: hold→to'lov konversiyasi, bekor bo'lgan holdlar, DB lock kutish vaqti, navbat uzunligi"],"e":"Bu keysda intervyuer ikki narsani qidiradi: overselling'ni DB constraint/atomik shart bilan yopish (app'dagi tekshiruvga ishonmaslik) va 500k trafikni inventar qatlamiga yetkazmaslik (navbat + tez rad etish)."},{"l":"St","t":"open","tp":"Case","d":"sys","id":30118,"n":"SN119","q":"Metrikalar/telemetriya ingest tizimi: 2 mln nuqta/sekund, 13 oy saqlash, grafiklar tez ochilsin.","m":["Ingest: agentlar batch va siqilgan holda yuboradi (protobuf/snappy), gateway faqat validatsiya qilib Kafka'ga yozadi — buffer va backpressure shu yerda","Yozuv modeli: time-series (metric name + label to'plami = seriya), seriya ID bilan ajratiladi; kolonkali/TSDB saqlash (Prometheus TSDB, VictoriaMetrics, ClickHouse) — delta-of-delta va XOR siqish bilan nuqta ~1-2 baytga tushadi","Cardinality — asosiy xavf: label'da user_id/URL bo'lsa seriya soni portlaydi va xotira/indeks o'ladi; kvota va ingest'da cardinality limiti + eng yomon label'lar hisoboti kerak","Downsampling/retention: xom ma'lumot 15 kun, 5 daqiqalik agregat 3 oy, 1 soatlik 13 oy — grafik diapazoniga qarab mos qatlamdan o'qiladi","O'qish: oldindan hisoblangan agregatlar (recording rules) og'ir dashboardlar uchun; query timeouti va natija limiti (bitta query klasterni o'ldirmasligi kerak)","Shardlash: seriya hash'i bo'yicha; replikatsiya ikki nusxa (yo'qotish xavfi biznesga qarab), va query fan-out + merge","Ishonchlilik: monitoring tizimi monitoring qilinadigan tizimdan mustaqil bo'lishi kerak (alohida klaster/region), aks holda incidentda ko'r qolinadi","Kuzatuv: ingest lag, tashlangan nuqtalar, seriya soni o'sishi, query p99 va eng qimmat queryler"],"e":"Bu keysning farqlovchi mavzusi — cardinality. Ko'p nomzod saqlash hajmini hisoblaydi, lekin seriya portlashi va downsampling qatlamlarini aytmaydi; monitoringni mustaqil klasterda ushlash ham kuchli detal."},{"l":"St","t":"open","tp":"Case","d":"sys","id":30119,"n":"SN120","q":"Fayl saqlash va sinxronlash (Dropbox uslubida): katta fayllar, ko'p qurilma, konflikt.","m":["Fayl bo'laklarga bo'linadi (chunking, 4MB, content-defined bo'lsa yaxshiroq), har chunk hash'i (SHA-256) bilan adreslanadi → deduplikatsiya va delta sync (faqat o'zgargan chunk yuboriladi)","Metadata servisi alohida: fayl daraxti, versiyalar, chunk ro'yxati (DB'da, tranzaksion); chunklar obyekt saqlashda (immutable, hash nomi bilan)","Sinxronlash: qurilma o'zgarishlar jurnalini (cursor bilan) so'raydi — long-poll yoki push notification; har o'zgarish monoton `journal_id` oladi","Konflikt: bir fayl ikki qurilmada o'zgarsa — versiya vektori yoki `parent_version` tekshiruvi; avtomatik merge qilinmaydi (matn bo'lmasa xavfli), 'conflicted copy' yaratiladi — bu ko'pchilik tizimdagi amaliy tanlov","Katta fayl: resumable multipart upload, chunk darajasida retry, yuklanish tugagach metadata atomik yangilanadi (yarim fayl ko'rinmaydi)","Xavfsizlik: chunk shifrlash, imzolangan URL bilan to'g'ridan-to'g'ri yuklab olish (backend trafikdan chetda), umumiy havolalar uchun ruxsat modeli","Tejash: cross-user dedupe (bir xil fayl bir marta) — lekin bu maxfiylik va 'hash oracle' xavfini keltiradi (fayl mavjudligini aniqlash), shuning uchun ko'pincha per-user dedupe","Kuzatuv: sync kechikishi, konflikt soni, yuklash muvaffaqiyati, dedupe koeffitsienti"],"e":"Kutilayotgan yadro: content-addressed chunking + alohida metadata + kursorli o'zgarish jurnali. Konfliktda 'avtomatik merge' deyish zaif javob — nomzod cheklovni tan olishi kerak."},{"l":"S","t":"open","tp":"Case","d":"sys","id":30120,"n":"SN121","q":"Web crawler loyihalang: 1 mlrd sahifa, ohista (polite), takrorlanmasin.","m":["Frontier (navbat): URL prioriteti bo'yicha, domen bo'yicha alohida navbat — politeness (bir domenga sekundda 1 so'rov, `robots.txt` va `crawl-delay` hurmat qilinadi)","Dedupe: URL normalizatsiyasi (parametrlar tartibi, fragment, sessiya ID) + ko'rilganlar to'plami — 1 mlrd URL uchun bloom filter (xotirada) + aniq tekshiruv KV'da","Kontent dublikati: sahifa mazmuni hash'i yoki simhash/minhash bilan near-duplicate aniqlash (bir xil sahifa turli URL'da)","Tuzoqlar: cheksiz kalendar/pagination (crawler trap) — chuqurlik va URL naqshi limitlari; juda katta sahifa, sekin server uchun timeout; redirect zanjiri limiti","Taqsimlash: domen hash'i bo'yicha shardlash — politeness tabiiy saqlanadi (bitta domen bitta worker'da), DNS keshi alohida","Qayta tashrif: sahifa o'zgarish chastotasiga qarab (yangilik sayti tez, arxiv kam) — adaptiv recrawl siyosati, `ETag`/`Last-Modified` bilan shartli so'rov","Saqlash: xom HTML obyekt saqlashda (siqilgan), ajratilgan matn va havolalar alohida — indeks quruvchi pipeline uchun","Kuzatuv: sahifa/sekund, xato kodlari domen bo'yicha, frontier o'sishi, dedupe nisbati"],"e":"Klassik savol, lekin ko'pchilik politeness va traplarni tashlab ketadi. Bloom filter + domen bo'yicha shardlash + adaptiv recrawl — kutiladigan uchta asosiy g'oya."},{"l":"St","t":"open","tp":"Case","d":"sys","id":30121,"n":"SN122","q":"Active-active multi-region arxitektura: qanday hollarda mumkin, qanday hollarda emas?","m":["Birinchi savol — ma'lumot qaysi region'ga tegishli. Agar foydalanuvchi ma'lumoti tabiiy ravishda regionga bo'linsa (sharding by user/tenant home region), active-active oson: har yozuv o'z home region'ida","Global qat'iy izchillik kerak bo'lsa (bitta hisobdan pul, yagona inventar) — cross-region konsensus latency (50-150ms RTT) har yozuvga qo'shiladi; bu ko'pincha qabul qilinmaydi, shuning uchun bitta yozuv region (active-passive) tanlanadi","Konflikt: ikki region bir yozuvni o'zgartirsa — LWW jim ma'lumot yo'qotadi; CRDT (hisoblagich, to'plam) yoki biznes qoidasi bilan merge, yoki entity darajasida yozuv egaligi (ownership)","Idempotentlik va replikatsiya: cross-region event oqimi (Kafka mirror) at-least-once — consumer dedupe qiladi; tartib faqat kalit bo'yicha","Trafikni yo'naltirish: GeoDNS/anycast, lekin sessiya home region'ga yopishishi kerak (aks holda read-your-writes buziladi)","Failover: RTO/RPO aniq raqamda, promotion jarayoni avtomatlashtirilgan va mashq qilingan; 'split brain'ni oldini olish uchun yagona qaror nuqtasi (kvorum)","Narx: cross-region trafik to'lovi, ikki barobar sig'im, operatsion murakkablik, va testlash qiyinligi — talab (masalan 99.99% va rezidentlik) buni oqlashi kerak","Amaliy o'rta yo'l: o'qish global (replica har regionda), yozuv bitta region — ko'p mahsulotga yetarli"],"e":"Senior/staff darajada kutiladigan javob — 'active-active qilaman' emas, balki ma'lumot egaligi va izchillik talabidan kelib chiqib qaror. Konflikt strategiyasini aytmaslik — eng ko'p uchraydigan bo'shliq."},{"l":"S","t":"open","tp":"Case","d":"sys","id":30122,"n":"SN123","q":"Feature flag servisini loyihalang: 200 servis, 1 mln flag tekshiruvi/sekund, o'zgarish 10 sekundda yetsin.","m":["Baholash client tomonda (SDK ichida) — har tekshiruv uchun tarmoqqa chiqish mumkin emas; SDK butun konfiguratsiyani xotirada ushlaydi, baholash lokal va mikro-sekundda","Tarqatish: SDK streaming (SSE/WebSocket) yoki qisqa polling (10-30s) bilan yangilanadi; CDN orqali konfiguratsiya snapshot (versiyalangan, ETag) — control plane yiqilsa ham oxirgi snapshot ishlaydi","Fail-safe: SDK ishga tushishda konfiguratsiya olmasa — kodda berilgan default qiymat; hech qachon 'flag servisi yo'q, servis ishlamaydi' holati bo'lmasligi kerak","Targeting: foydalanuvchi atributlari bo'yicha qoidalar va foizli yoyish — `hash(flag_key + user_id) % 100 < percent` bilan barqaror (sticky) taqsimlash, shu bilan bir foydalanuvchi har chaqiruvda bir xil natija oladi","Audit va xavfsizlik: kim, qachon, nimani o'zgartirdi; kritik flaglar uchun tasdiq (approval) va o'zgarishni bosqichli yoyish; kill switch alohida ajratilgan","Telemetriya: flag qiymati eventlarga/trace'ga qo'shiladi (A/B va incident tahlili uchun), lekin har tekshiruvni yuborish emas — agregat (sanoq) yuboriladi","Hayot davri: har flagga ega va muddat, eskirganlar hisoboti — flag qarzini boshqarish (aks holda kod o'qilmas holga keladi)","Kuzatuv: konfiguratsiya tarqalish kechikishi, SDK versiyalari, default'ga tushib qolgan instansiyalar soni"],"e":"Kaliti — 1 mln/s ni tarmoqqa chiqarmaslik (lokal baholash) va control plane yiqilganda xavfsiz degradatsiya. Sticky hash bilan foizli yoyish — ko'p nomzod tashlab ketadigan detal."},{"l":"St","t":"open","tp":"Case","d":"sys","id":30233,"n":"SN234","q":"To'lov gateway'i loyihalang: 500 TPS, bir necha PSP, pul yo'qolmasin.","m":["Kontrakt: har to'lov `payment_intent` sifatida boshlanadi (mahalliy ID, idempotency key mijozdan) — holat mashinasi: `created → authorized → captured → settled`, yoki `failed/canceled/refunded`","Yozuv yo'li: DB tranzaksiyasida intent + outbox eventi; PSP chaqiruvi tranzaksiyadan tashqarida (tashqi chaqiruv hech qachon ochiq tranzaksiya ichida bo'lmaydi)","PSP routing: har PSP uchun adapter (anti-corruption layer), yo'naltirish qoidalari (valyuta, karta turi, narx, muvaffaqiyat darajasi), va bitta PSP yiqilsa fallback — lekin fallback dublikat to'lov keltirmasligi uchun avval holat aniqlanadi","Noma'lum holat: timeout bo'lsa retry aynan shu idempotency key bilan yoki status so'rovi; hal bo'lmasa `pending` va reconciliation navbatiga","Webhook: imzo tekshirish, idempotent qabul, kechikkan/tartibsiz eventlarni versiya bo'yicha qo'llash; webhook yagona manba emas — davriy pull ham bor","Ledger: har pul harakati double-entry yozuv; hisobotlar ledger'dan, `status` ustunidan emas","Xavfsizlik/compliance: PAN tizimga kirmaydi (tokenizatsiya), PCI doirasi minimal, audit log o'zgarmas, sirlar KMS'da","Kuzatuv: PSP bo'yicha muvaffaqiyat darajasi va latency, `pending` yoshi, reconciliation ochiq farqi, dublikat to'lov alerti (eng muhim biznes alerti)","Miqyos: 500 TPS DB uchun katta emas, lekin hot hisob qatorlari (merchant balansi) uchun yozuvni agregatlash/sharding kerak bo'lishi mumkin"],"e":"Bu keysda intervyuer texnik miqyosni emas, pul bilan ishlash intizomini tekshiradi: idempotentlik, noma'lum holatni boshqarish, outbox, ledger va reconciliation. Har birini nomlash va sababini aytish kutiladi."},{"l":"St","t":"open","tp":"Case","d":"sys","id":30234,"n":"SN235","q":"Ko'p tenant'li SaaS analitika servisi: mijoz dashboardlari, kunlik 5 mlrd hodisa.","m":["Ingest: SDK → gateway (validatsiya, tenant aniqlash, rate limit) → Kafka; hodisa sxemasi versiyalangan (schema registry), noto'g'ri hodisalar DLQ'ga","Saqlash: kolonkali ombor (ClickHouse) — `(tenant_id, event_date, event_name)` bo'yicha partition va tartiblash kaliti; xom hodisa + oldindan agregatlangan jadvallar (materialized view) birga","O'qish: dashboard query'lari agregat jadvaldan (sekundlar emas, millisekundlar), ad-hoc query'lar xom ma'lumotdan lekin kvota bilan (vaqt/skan hajmi limiti, aks holda bitta mijoz klasterni band qiladi)","Tenant izolyatsiyasi: query kvotasi, alohida query pool, va kritik mijozlar uchun ajratilgan klaster (noisy neighbour muammosi bu yerda asosiy xatar)","Aniqlik/narx: taxminiy aniqlik yetarli bo'lgan joyda HyperLogLog (unique count) va sampling — xarajatni bir necha barobar kamaytiradi","Retention va narx: xom ma'lumot 30-90 kun, agregatlar yillar; sovuq ma'lumot obyekt saqlashda (S3) va kamdan-kam so'raladi","Kechikkan hodisalar: mobil qurilma offline bo'lib 3 kundan keyin yuboradi — agregatlarni qayta hisoblash oynasi (late arrival window) va idempotent qayta yozish kerak","Kuzatuv: ingest lag, dropped events, query p95 tenant bo'yicha, xarajat/tenant (unit economics)"],"e":"Farqlovchi detallar: oldindan agregatlash, tenant kvotalari (noisy neighbour), kechikkan hodisalarni qayta hisoblash, va HyperLogLog bilan aniqlikni narxga almashtirish. 'PostgreSQL'da `GROUP BY` qilaman' javobi bu hajmda ishlamaydi."},{"l":"S","t":"open","tp":"Case","d":"sys","id":30235,"n":"SN236","q":"Hujjat ustida real-time birgalikda ishlash (Google Docs uslubida) — asosiy qarorlar?","m":["Konflikt modeli: OT (operational transformation) yoki CRDT. CRDT — markazsiz, birlashtirish matematik kafolatlangan, lekin metadata o'sadi (tombstone); OT — ixchamroq lekin markaziy server va murakkab transformatsiyalar talab qiladi","Transport: WebSocket bilan kichik operatsiyalar (insert/delete pozitsiya bilan), har client uchun versiya/vektor; offline'dan keyin qayta birlashtirish ishlashi kerak","Kursorlar va presence: alohida yengil kanal, tez-tez lekin ishonchsiz (yo'qolsa muammo emas)","Doimiylik: operatsiyalar jurnali (append-only) + davriy snapshot — yuklashda snapshot + keyingi operatsiyalar qo'llanadi; bu event sourcing'ning tabiiy qo'llanishi","Tarix va undo: jurnal bo'yicha versiyalar, foydalanuvchi bo'yicha undo (o'z operatsiyalarini teskari qilish — CRDT'da nozik masala)","Miqyos: bitta hujjat = bitta koordinator (shard by document) — shu bilan tartib va konflikt hal qilish arzon bo'ladi; hujjatlar bo'ylab esa gorizontal","Ruxsat: har operatsiyada tekshirish (faqat ochilishda emas), havola bilan bo'lishish modeli, va audit"],"e":"Kutilayotgan asosiy qaror — OT va CRDT o'rtasidagi tanlov va uning sababi, hamda 'bitta hujjat bitta koordinatorda' shardlash g'oyasi. Snapshot + operatsiya jurnali esa yuklash tezligini hal qiladi."},{"l":"St","t":"open","tp":"Case","d":"sys","id":30288,"n":"SN289","q":"Monolitda ishlaydigan qidiruv sekinlashdi: 'LIKE %term%' bilan 20 mln qator. Qanday hal qilasiz?","m":["Diagnoz: `LIKE '%term%'` anchor bo'lmagani uchun B-tree ishlamaydi — har so'rov sequential scan; `EXPLAIN` bilan tasdiqlash va so'rov chastotasini o'lchash","Eng arzon qadam: PostgreSQL ichida qolish — `pg_trgm` GIN indeks (`LIKE`/`ILIKE` va o'xshashlik uchun) yoki full-text (`tsvector` + GIN, `websearch_to_tsquery`); generated column bilan indeks doimiy yangilanadi","Agar talab relevantlik, fasetlar, tipografik xatolarga bardosh va yuqori QPS bo'lsa — Elasticsearch/OpenSearch; sinxronlash outbox/CDC bilan, alias almashtirish bilan reindex","Tanlov mezoni: ES alohida tizim (operatsion yuk, izchillik kechikishi) — faqat talab oqlasa; ko'p loyihada `pg_trgm`/FTS yetarli va bir tizimda qolish katta ustunlik","Qo'shimcha optimizatsiya: qidiruv natijalarini keshlash (mashhur so'rovlar), debounce va minimal uzunlik, autocomplete uchun alohida oldindan hisoblangan struktura","Migratsiya rejasi: indeks `CONCURRENTLY`, dual-read (yangi manbani solishtirish), keyin almashtirish; latency va natija sifati metrikalari bilan tasdiqlash"],"e":"Intervyuda kutiladigan narsa — darhol 'Elasticsearch qo'shamiz' demaslik. Avval mavjud DB imkoniyati (`pg_trgm`, FTS), keyin talab bo'yicha alohida qidiruv tizimi va uning operatsion narxi. Sinxronlash strategiyasini aytish majburiy."},{"l":"S","t":"open","tp":"Case","d":"sys","id":30289,"n":"SN290","q":"Servis 200 RPS'da ishlaydi, marketing aksiyasi 10x trafik keltiradi (1 kun oldin ma'lum bo'ldi). Nima qilasiz?","m":["Birinchi: bo'g'izni topish — yuk testi (k6/vegeta) staging yoki productionning ajratilgan qismida, real profilga yaqin ssenariy bilan; taxmin bilan optimizatsiya qilinmaydi","Tez g'alabalar: eng og'ir query'larga indeks, N+1 ni yo'q qilish, mashhur javoblarni keshlash (qisqa TTL ham katta foyda), statik kontentni CDN'ga","Sig'im: replica soni oldindan oshirilgan (autoscaling reaksiya qilishga vaqt yetmasligi mumkin), DB pool va PgBouncer sozlamalari, `requests/limits` tekshirilgan, kvota va limitlar (cloud) oshirilgan","Himoya mexanizmlari: rate limit, load shedding va prioritet (checkout > tavsiyalar), circuit breaker, va degradatsiya rejasi (og'ir sahifani soddalashtirish, tavsiyalarni o'chirish)","Kuzatuv: dashboard oldindan tayyor (RED + DB + kesh + navbat), alertlar sozlangan, dejurlik rejasi va rollback tayyor","Aksiyadan keyin: haqiqiy raqamlarni yig'ib doimiy tuzatishlarni rejaga kiritish (postmortem, hatto incident bo'lmasa ham)"],"e":"Bu keys 'vaqt kam' cheklovi bilan boshqacha javob talab qiladi: arxitektura qayta qurilmaydi — o'lchash, arzon optimizatsiya, oldindan skale va degradatsiya rejasi. Degradatsiya va prioritetni aytish eng kuchli signal."},{"l":"St","t":"open","tp":"Case","d":"sys","id":30383,"n":"SN384","q":"To'lov gateway'i loyihalang: 500 TPS, bir necha PSP, pul yo'qolmasin.","m":["Kontrakt: har to'lov `payment_intent` sifatida boshlanadi (mahalliy ID, idempotency key mijozdan) — holat mashinasi: `created → authorized → captured → settled`, yoki `failed/canceled/refunded`","Yozuv yo'li: DB tranzaksiyasida intent + outbox eventi; PSP chaqiruvi tranzaksiyadan tashqarida (tashqi chaqiruv hech qachon ochiq tranzaksiya ichida bo'lmaydi)","PSP routing: har PSP uchun adapter (anti-corruption layer), yo'naltirish qoidalari (valyuta, karta turi, narx, muvaffaqiyat darajasi), va bitta PSP yiqilsa fallback — lekin fallback dublikat to'lov keltirmasligi uchun avval holat aniqlanadi","Noma'lum holat: timeout bo'lsa retry aynan shu idempotency key bilan yoki status so'rovi; hal bo'lmasa `pending` va reconciliation navbatiga","Webhook: imzo tekshirish, idempotent qabul, kechikkan/tartibsiz eventlarni versiya bo'yicha qo'llash; webhook yagona manba emas — davriy pull ham bor","Ledger: har pul harakati double-entry yozuv; hisobotlar ledger'dan, `status` ustunidan emas","Xavfsizlik/compliance: PAN tizimga kirmaydi (tokenizatsiya), PCI doirasi minimal, audit log o'zgarmas, sirlar KMS'da","Kuzatuv: PSP bo'yicha muvaffaqiyat darajasi va latency, `pending` yoshi, reconciliation ochiq farqi, dublikat to'lov alerti (eng muhim biznes alerti)","Miqyos: 500 TPS DB uchun katta emas, lekin hot hisob qatorlari (merchant balansi) uchun yozuvni agregatlash/sharding kerak bo'lishi mumkin"],"e":"Bu keysda intervyuer texnik miqyosni emas, pul bilan ishlash intizomini tekshiradi: idempotentlik, noma'lum holatni boshqarish, outbox, ledger va reconciliation. Har birini nomlash va sababini aytish kutiladi."},{"l":"St","t":"open","tp":"Case","d":"sys","id":30384,"n":"SN385","q":"Ko'p tenant'li SaaS analitika servisi: mijoz dashboardlari, kunlik 5 mlrd hodisa.","m":["Ingest: SDK → gateway (validatsiya, tenant aniqlash, rate limit) → Kafka; hodisa sxemasi versiyalangan (schema registry), noto'g'ri hodisalar DLQ'ga","Saqlash: kolonkali ombor (ClickHouse) — `(tenant_id, event_date, event_name)` bo'yicha partition va tartiblash kaliti; xom hodisa + oldindan agregatlangan jadvallar (materialized view) birga","O'qish: dashboard query'lari agregat jadvaldan (sekundlar emas, millisekundlar), ad-hoc query'lar xom ma'lumotdan lekin kvota bilan (vaqt/skan hajmi limiti, aks holda bitta mijoz klasterni band qiladi)","Tenant izolyatsiyasi: query kvotasi, alohida query pool, va kritik mijozlar uchun ajratilgan klaster (noisy neighbour muammosi bu yerda asosiy xatar)","Aniqlik/narx: taxminiy aniqlik yetarli bo'lgan joyda HyperLogLog (unique count) va sampling — xarajatni bir necha barobar kamaytiradi","Retention va narx: xom ma'lumot 30-90 kun, agregatlar yillar; sovuq ma'lumot obyekt saqlashda (S3) va kamdan-kam so'raladi","Kechikkan hodisalar: mobil qurilma offline bo'lib 3 kundan keyin yuboradi — agregatlarni qayta hisoblash oynasi (late arrival window) va idempotent qayta yozish kerak","Kuzatuv: ingest lag, dropped events, query p95 tenant bo'yicha, xarajat/tenant (unit economics)"],"e":"Farqlovchi detallar: oldindan agregatlash, tenant kvotalari (noisy neighbour), kechikkan hodisalarni qayta hisoblash, va HyperLogLog bilan aniqlikni narxga almashtirish. 'PostgreSQL'da `GROUP BY` qilaman' javobi bu hajmda ishlamaydi."},{"l":"S","t":"open","tp":"Case","d":"sys","id":30385,"n":"SN386","q":"Hujjat ustida real-time birgalikda ishlash (Google Docs uslubida) — asosiy qarorlar?","m":["Konflikt modeli: OT (operational transformation) yoki CRDT. CRDT — markazsiz, birlashtirish matematik kafolatlangan, lekin metadata o'sadi (tombstone); OT — ixchamroq lekin markaziy server va murakkab transformatsiyalar talab qiladi","Transport: WebSocket bilan kichik operatsiyalar (insert/delete pozitsiya bilan), har client uchun versiya/vektor; offline'dan keyin qayta birlashtirish ishlashi kerak","Kursorlar va presence: alohida yengil kanal, tez-tez lekin ishonchsiz (yo'qolsa muammo emas)","Doimiylik: operatsiyalar jurnali (append-only) + davriy snapshot — yuklashda snapshot + keyingi operatsiyalar qo'llanadi; bu event sourcing'ning tabiiy qo'llanishi","Tarix va undo: jurnal bo'yicha versiyalar, foydalanuvchi bo'yicha undo (o'z operatsiyalarini teskari qilish — CRDT'da nozik masala)","Miqyos: bitta hujjat = bitta koordinator (shard by document) — shu bilan tartib va konflikt hal qilish arzon bo'ladi; hujjatlar bo'ylab esa gorizontal","Ruxsat: har operatsiyada tekshirish (faqat ochilishda emas), havola bilan bo'lishish modeli, va audit"],"e":"Kutilayotgan asosiy qaror — OT va CRDT o'rtasidagi tanlov va uning sababi, hamda 'bitta hujjat bitta koordinatorda' shardlash g'oyasi. Snapshot + operatsiya jurnali esa yuklash tezligini hal qiladi."},{"l":"St","t":"open","tp":"Case","d":"sys","id":30480,"n":"SN481","q":"API gateway loyihalang: 50 ta ichki servis, tashqi mijozlar, kvota va autentifikatsiya.","m":["Vazifalar: TLS termination, autentifikatsiya (JWT/JWKS yoki mTLS), avtorizatsiya (route darajasida scope), rate limit/kvota, routing va versiyalash, request/response transformatsiya (minimal), observability (trace boshlanishi, log, metrika)","Nima gateway'da BO'LMASLIGI kerak: biznes mantiqi, ma'lumot agregatsiyasi (bu BFF vazifasi), servislararo murakkab orkestratsiya — aks holda gateway monolitga aylanadi va har jamoa uni o'zgartirishga navbat kutadi","Konfiguratsiya: deklarativ (route, siyosat) va versiyalangan, har servis jamoasi o'z route'ini PR bilan qo'shadi (self-service), CI'da validatsiya","Rate limit: per-key/per-tenant, og'ir endpointga ko'proq 'narx', 429 + Retry-After; holat Redis'da yoki mahalliy approximate + markaziy sinxronlash","Ishonchlilik: gateway stateless va gorizontal skale, timeout/retry/breaker downstream bo'yicha, load shedding va prioritet; gateway yiqilsa hamma yiqiladi — shuning uchun oddiy va yaxshi testlangan bo'lishi kerak","Xavfsizlik: JWKS keshi, noma'lum kid rate limit, header tozalash (client yuborgan `X-User-Id` ni tashlash — spoofing), request size limit, WAF qatlami","Migratsiya va versiyalash: `/v1`/`/v2` routing, deprecation header va ishlatilishni o'lchash","Tanlov: tayyor yechim (Envoy/Kong/APISIX) vs o'z gateway — 50 servisda tayyor yechim va yupqa kengaytmalar afzal"],"e":"Bu keysda eng ko'p baholanadigan narsa — chegarani belgilash: gateway'ga nima kirmasligi kerakligini aytish va 'gateway yagona nuqtada nosozlik' xavfini boshqarish."},{"l":"St","t":"open","tp":"Case","d":"sys","id":30481,"n":"SN482","q":"Near-real-time fraud skoring loyihalang: to'lov oqimida 100ms budjet.","m":["Budjet taqsimoti: 100ms ichida feature yig'ish (~30ms), model inference (~20ms), qoidalar (~10ms), zaxira (~40ms) — har bosqichga qat'iy timeout va fail-open/fail-close siyosati","Feature store: real-time xususiyatlar (oxirgi 5 daqiqadagi urinishlar soni, qurilma, geo) past latency store'da (Redis) oldindan hisoblanadi — oqim ishlovi (Kafka consumer) yozib boradi; tarixiy xususiyatlar batch bilan","Training/serving skew: bir xil feature hisoblash mantiqi ikkala yo'lda ham ishlatilishi kerak (umumiy kutubxona yoki feature store) — aks holda model productionda yomonlashadi","Qaror: model skori + qat'iy qoidalar (qora ro'yxat, velocity limit) birga; natija uch holat — o'tkazish, challenge (3DS), rad etish; qaror va sabab audit uchun saqlanadi","Asinxron chuqur tahlil: 100ms ga sig'maydigan og'ir tekshiruvlar keyin ishlaydi va kerak bo'lsa ushlab qolish/qaytarish qarorini beradi","Fikr-mulohaza sikli: chargeback va qo'lda ko'rib chiqish natijalari yorliq (label) sifatida qaytadi — model qayta o'qitiladi, drift kuzatiladi","Ishonchlilik: model servisi yiqilsa qoidalar bilan davom etish (degradatsiya), shadow rejimda yangi modelni solishtirish, va A/B bilan chiqarish","Metrikalar: false positive narxi (bloklangan haqiqiy mijoz), fraud rate, p99 latency, model drift"],"e":"Kutiladigan senior signallari: latency budjetini bo'lish, fail-open/fail-close qarorini oshkora aytish, training/serving skew, va degradatsiya rejasi. Faqat 'model qo'yamiz' javobi yetarli emas."},{"l":"St","t":"open","tp":"Case","d":"sys","id":30533,"n":"SN534","q":"Ko'p tenant'li SaaS'da bitta yirik mijoz butun tizimni sekinlashtirmoqda. Qanday hal qilasiz?","m":["Diagnoz: tenant bo'yicha metrikalar (RPS, query vaqti, xotira, navbat ulushi) — kim, qayerda va qancha iste'mol qilyapti; tenant ID har log/metrika/trace'da bo'lishi shart (aks holda javob berib bo'lmaydi)","Tez chora: shu tenant uchun rate limit/kvota, og'ir endpointlarga alohida limit, va ularning fon ishlarini past prioritetli navbatga o'tkazish","Izolyatsiya: bulkhead — tenant sinfi bo'yicha alohida worker pool/instansiya; DB tomonda alohida ulanish pooli yoki replica; eng yirik mijozlar uchun ajratilgan (dedicated) resurs","Ma'lumot qatlami: hot tenant partitioni (`tenant_id` bo'yicha), kerak bo'lsa alohida shard yoki DB — hybrid model","Mahsulot tomoni: kvota va narx rejasi (fair use), mijoz bilan muloqot; texnik yechim biznes modeliga mos bo'lishi kerak","Profilaktika: yangi tenant onboarding'da kutilgan hajm, yuk testi, va tenant bo'yicha anomaliya alerti"],"e":"Kutiladigan asosiy g'oya — noisy neighbour muammosi va uch darajali yechim: kuzatuv (tenant o'lchovi), cheklash (kvota) va izolyatsiya (bulkhead/dedicated). Tenant ID ni telemetriyaga qo'shish birinchi qadam sifatida aytilishi kerak."},{"l":"S","t":"open","tp":"Case","d":"sys","id":30534,"n":"SN535","q":"Legacy monolitga yangi funksiya qo'shish kerak, lekin test yo'q va deploy haftada bir marta. Nima qilasiz?","m":["Birinchi navbatda xavfni kamaytirish: o'zgartiriladigan joyga characterization test yozish (mavjud xatti-harakatni qotirish), keyin o'zgartirish","Chegara yaratish: yangi mantiqni alohida modul/paketga yozib, monolitdan faqat bitta nuqtada chaqirish — keyin kerak bo'lsa servisga ajratish oson bo'ladi","Feature flag bilan chiqarish: deploy siyrak bo'lsa ham, yoqish/o'chirish darhol bo'ladi — bu haftalik reliz xavfini keskin kamaytiradi","Deploy chastotasini oshirishga birinchi qadam: pipeline vaqtini o'lchash, eng og'ir/flaky testlarni tuzatish, migratsiyalarni expand-contract qilish — bu alohida ish sifatida rejalashtiriladi","Kuzatuv qo'shish: yangi kod yo'liga metrika va log (trace_id bilan) — legacy'da ko'pincha yo'q, va incidentda birinchi kerak bo'ladi","Kutishlarni boshqarish: 'tez qilaman' o'rniga 'shu qadamlar bilan xavfsiz qilaman' deb muddatni asoslash"],"e":"Bu real ish sharoitini tekshiradigan savol. Kuchli javob: to'liq qayta yozishni taklif qilmaslik, xavfni bosqichma-bosqich kamaytirish, va feature flag bilan reliz chastotasi muammosini aylanib o'tish."},{"l":"S","t":"code","tp":"System gotcha","d":"sys","id":8018,"n":"T19","q":"Redis'da natija: TTL qanday bo'ladi?","c":"SET session:1 \"data\" EX 600\n# 5 daqiqa o'tdi\nSET session:1 \"yangi-data\"\nTTL session:1","o":["300 — qolgan TTL saqlanadi","-1 — oddiy SET key'ni qayta yozadi va TTL ni butunlay olib tashlaydi (key abadiy qoladi)","600 ga qayta tiklanadi","-2 — key o'chadi"],"a":1,"e":"TTL ni saqlash uchun: SET key val KEEPTTL, yoki qayta yozishda muddatni ham berish (EX). Bu sessiya va lock'larda xavfli bug manbai: memory asta to'ladi yoki lock abadiy qoladi. Eslatma: GETSET, SETRANGE kabi ba'zi buyruqlar ham TTL bilan turlicha ishlaydi — hujjatdan tekshiring.","src":"https://redis.io/docs/latest/commands/set/"},{"l":"S","t":"mcq","tp":"System gotcha","d":"sys","id":8019,"n":"T20","q":"Cache invalidatsiyasi: DB'ga yozganda cache'ni qachon o'chirish kerak?","o":["Transaction ichida, yozishdan oldin","Transaction COMMIT bo'lgandan keyin. Commit'dan oldin o'chirilsa, boshqa query eski qiymatni o'qib cache'ga qaytadan yozib qo'yishi mumkin — cache abadiy eskirgan qoladi","Umuman o'chirmaslik, faqat TTL'ga tayanish","Cache'ni yangilash (set), o'chirish emas"],"a":1,"e":"Ketma-ketlik: transaction → commit → cache key'ini DELETE (update emas). Yana bir himoya: qisqa TTL va kritik joylarda versiyalangan key (user:42:v7). To'liq yechim uchun: yozishdan keyin key'ni qisqa muddatga 'bloklash' (delayed double delete) yoki CDC orqali invalidatsiya."},{"l":"S","t":"mcq","tp":"System gotcha","d":"sys","id":8020,"n":"T21","q":"Client timeout olib, <code>DELETE /orders/42</code> ni qayta yubordi. Server 404 qaytardi. Bu to'g'rimi?","o":["Ha, resurs yo'q — 404 to'g'ri","Texnik jihatdan to'g'ri, lekin client uchun yomon: birinchi query success'li bo'lgan bo'lsa ham u xato ko'radi. Idempotent DELETE uchun 204 (yoki 200) qaytarish va 'allaqachon o'chirilgan' holatini success deb hisoblash yaxshiroq","Har doim 500 qaytarish kerak","DELETE ni retry qilish taqiqlangan"],"a":1,"e":"Idempotentlik faqat 'ma'lumot buzilmasligi' emas — client uchun natija ham bir xil bo'lishi kerak. Shunga o'xshash holatlar: PUT takrorlansa 200, POST uchun Idempotency-Key bilan saqlangan javobni qaytarish. Aks holda retry mantig'i 'xato' deb yozib, alert va noto'g'ri statistika yaratadi."},{"l":"S","t":"mcq","tp":"System gotcha","d":"sys","id":8021,"n":"T22","q":"Kafka consumer og'ir xabarni 10 daqiqa ishlayapti, <code>max.poll.interval.ms</code> 5 daqiqa. Nima bo'ladi?","o":["Hech narsa, ishlov tugaydi","Broker consumer'ni o'lgan deb hisoblab group'dan chiqaradi va rebalance boshlanadi; ishlov tugagach commit rad etiladi va xabar boshqa consumer'da qaytadan ishlanadi — cheksiz sikl bo'lishi mumkin","Xabar DLQ'ga ketadi","Consumer avtomatik ko'proq vaqt oladi"],"a":1,"e":"Yechimlar: max.poll.interval.ms ni real ishlov vaqtidan katta qilish, max.poll.records ni kamaytirish, yoki og'ir ishni alohida worker pool'ga berib, poll siklini bo'sh tutish (lekin unda offset boshqaruvi murakkablashadi). Aynan shu sabab 'xabarlar ikki-uch marta ishlanyapti' shikoyatining eng ko'p uchraydigan ildizi."},{"l":"S","t":"mcq","tp":"System gotcha","d":"sys","id":8022,"n":"T23","q":"Saytda <code>301 Moved Permanently</code> qaytarildi, keyin bu xato ekani aniqlandi. Muammo nimada?","o":["Muammo yo'q, o'zgartirish yetarli","Brauzerlar 301 ni uzoq muddat (ba'zan cheksiz) keshlaydi — foydalanuvchilar eski qayta yo'naltirishda qolib ketadi va serverdagi tuzatish ularga yetmaydi. Vaqtinchalik holatlar uchun 302/307 ishlatish kerak","301 keshlanmaydi","302 doimiy, 301 vaqtinchalik"],"a":1,"e":"Tiklash juda qiyin: foydalanuvchi brauzer cache'ini tozalashi kerak. Shuning uchun 301 faqat haqiqatan abadiy o'zgarishlarda (domen ko'chishi). 307/308 — metodni saqlaydigan variantlar (POST POST bo'lib qoladi), 302 esa amalda ko'pincha GET'ga o'zgartiradi."},{"l":"St","t":"mcq","tp":"System gotcha","d":"sys","id":8023,"n":"T24","q":"Kunlik cron 02:30 da ishlaydi. DST o'tishida nima bo'lishi mumkin?","o":["Hech narsa","Soat orqaga surilganda 02:30 ikki marta keladi — vazifa ikki marta bajariladi; oldinga surilganda esa 02:30 umuman bo'lmaydi va vazifa o'tkazib yuboriladi","Cron avtomatik tuzatadi","Faqat yillik ishlarda muammo"],"a":1,"e":"Yechimlar: serverni va cron'ni UTC'da ishlatish, vazifalarni idempotent qilish (bir kunda bir marta bajarilganini DB'da belgilash), va DST o'tish soatlariga (00:00–04:00) muhim ishlarni qo'ymaslik. Xuddi shu muammo 'har oyning 31-kuni' va kabisa soniyalarida ham chiqadi."},{"l":"St","t":"mcq","tp":"System gotcha","d":"sys","id":8024,"n":"T25","q":"PK sifatida UUIDv4 tanlandi va table 100 mln row'ga yetdi. Qanday muammo kutiladi?","o":["Hech qanday","Tasodifiy tartib tufayli index page'lariga yozish sochilib ketadi: cache samarasi tushadi, page bo'linishlari va index hajmi ortadi (ayniqsa InnoDB clustered indexda). Yechim: vaqt bo'yicha tartiblangan identifikator — UUIDv7, ULID yoki Snowflake","UUID qisqa bo'lgani uchun to'qnashuv bo'ladi","Faqat JOIN sekinlashadi"],"a":1,"e":"UUIDv4 ning afzalligi bor (client tomonda generatsiya, ketma-ketlikni oshkor qilmaslik), shuning uchun tanlov UUIDv7 kabi variant bilan ikkalasini birlashtiradi. Postgres'da saqlash uchun uuid tipi (16 bayt) ishlating — text sifatida saqlash 37 bayt va sekinroq taqqoslash degani."},{"l":"S","t":"mcq","tp":"System gotcha","d":"sys","id":30149,"n":"SN150","q":"Servis `context.Background()` bilan DB query qiladi (HTTP handler ichida). Nima yo'qoladi?","o":["Hech narsa","Cancellation: client ketganda yoki deadline o'tganda query to'xtamaydi — DB va goroutine bekorga ishlaydi, yuk ostida bu resurs tugashiga olib keladi","Tracing faqat","Metrikalar"],"a":1,"e":"`r.Context()` uzatilishi kerak: client uzilsa `ctx` bekor bo'ladi, `database/sql` query'ni cancel qiladi (PostgreSQL'da cancel request yuboriladi). `context.Background()` — faqat haqiqatan mustaqil fon ishi uchun, va u holda ham o'z deadline'i va shutdown'da to'xtash mexanizmi bo'lishi kerak."},{"l":"S","t":"mcq","tp":"System gotcha","d":"sys","id":30150,"n":"SN151","q":"Graceful shutdown yozilgan, lekin deploy paytida so'rovlar uziladi. Eng ko'p uchraydigan sabab?","o":["`http.Server.Shutdown` ishlamaydi","SIGTERM kelishi bilan darhol shutdown boshlanadi, lekin LB/endpoint ro'yxati hali yangilanmagan — `preStop` kutish (yoki readiness'ni avval false qilish) qo'shilmagan","Timeout kichik","Port band"],"a":1,"e":"Tartib muhim: (1) readiness false / preStop sleep — yangi trafik kelishi to'xtaydi, (2) `srv.Shutdown(ctx)` mavjud so'rovlarni tugatadi, (3) background workerlar `ctx` bilan to'xtaydi, (4) DB pool yopiladi. `terminationGracePeriodSeconds` shu jamiga yetishi kerak, aks holda SIGKILL keladi."},{"l":"St","t":"mcq","tp":"System gotcha","d":"sys","id":30151,"n":"SN152","q":"Servis xotirasi asta o'sadi, pprof heap'da hech narsa ko'rinmaydi. Qaysi variantni tekshirasiz?","o":["Faqat GOGC","Go heap tashqarisidagi o'sish: goroutine leak (stack), `mmap`/cgo ajratmalari, fayl deskriptorlari, yoki fragmentatsiya — `runtime.NumGoroutine()`, `/debug/pprof/goroutine`, RSS va `runtime.MemStats` (HeapSys vs HeapInuse) solishtiriladi","Faqat CPU profili","Disk"],"a":1,"e":"Heap profil faqat Go ajratmalarini ko'rsatadi. Tekshirish zanjiri: goroutine soni (eng ko'p uchraydigan sabab — bloklangan kanal yoki yopilmagan `resp.Body`), `HeapReleased`/RSS farqi (OS xotirani qaytarmagan), cgo yoki `mmap` ishlatadigan kutubxona, va bir marta katta ajratilgan buferlar (pool ichida ushlanib qolgan)."},{"l":"S","t":"mcq","tp":"System gotcha","d":"sys","id":30299,"n":"SN300","q":"Servis `context.Background()` bilan DB query qiladi (HTTP handler ichida). Nima yo'qoladi?","o":["Hech narsa","Cancellation: client ketganda yoki deadline o'tganda query to'xtamaydi — DB va goroutine bekorga ishlaydi, yuk ostida bu resurs tugashiga olib keladi","Tracing faqat","Metrikalar"],"a":1,"e":"`r.Context()` uzatilishi kerak: client uzilsa `ctx` bekor bo'ladi, `database/sql` query'ni cancel qiladi (PostgreSQL'da cancel request yuboriladi). `context.Background()` — faqat haqiqatan mustaqil fon ishi uchun, va u holda ham o'z deadline'i va shutdown'da to'xtash mexanizmi bo'lishi kerak."},{"l":"S","t":"mcq","tp":"System gotcha","d":"sys","id":30300,"n":"SN301","q":"Graceful shutdown yozilgan, lekin deploy paytida so'rovlar uziladi. Eng ko'p uchraydigan sabab?","o":["`http.Server.Shutdown` ishlamaydi","SIGTERM kelishi bilan darhol shutdown boshlanadi, lekin LB/endpoint ro'yxati hali yangilanmagan — `preStop` kutish (yoki readiness'ni avval false qilish) qo'shilmagan","Timeout kichik","Port band"],"a":1,"e":"Tartib muhim: (1) readiness false / preStop sleep — yangi trafik kelishi to'xtaydi, (2) `srv.Shutdown(ctx)` mavjud so'rovlarni tugatadi, (3) background workerlar `ctx` bilan to'xtaydi, (4) DB pool yopiladi. `terminationGracePeriodSeconds` shu jamiga yetishi kerak, aks holda SIGKILL keladi."},{"l":"St","t":"mcq","tp":"System gotcha","d":"sys","id":30301,"n":"SN302","q":"Servis xotirasi asta o'sadi, pprof heap'da hech narsa ko'rinmaydi. Qaysi variantni tekshirasiz?","o":["Faqat GOGC","Go heap tashqarisidagi o'sish: goroutine leak (stack), `mmap`/cgo ajratmalari, fayl deskriptorlari, yoki fragmentatsiya — `runtime.NumGoroutine()`, `/debug/pprof/goroutine`, RSS va `runtime.MemStats` (HeapSys vs HeapInuse) solishtiriladi","Faqat CPU profili","Disk"],"a":1,"e":"Heap profil faqat Go ajratmalarini ko'rsatadi. Tekshirish zanjiri: goroutine soni (eng ko'p uchraydigan sabab — bloklangan kanal yoki yopilmagan `resp.Body`), `HeapReleased`/RSS farqi (OS xotirani qaytarmagan), cgo yoki `mmap` ishlatadigan kutubxona, va bir marta katta ajratilgan buferlar (pool ichida ushlanib qolgan)."},{"l":"J","t":"mcq","tp":"Arrays","d":"alg","id":4000,"n":"A1","q":"Two Sum (massivda yig'indisi target bo'lgan ikki indeks). Eng yaxshi vaqt murakkabligi va usul?","o":["O(n²) — ikki sikl, boshqa yo'l yo'q","O(n) — hash map'da 'target - x' ni qidirish (bitta o'tishda), memory O(n)","O(log n) — binary search","O(n log n) — saralash shart"],"a":1,"e":"Bitta o'tish: har x uchun map'da target-x bormi deb qaraysiz, bo'lmasa x ni map'ga qo'yasiz. Massiv saralangan bo'lsa — ikki ko'rsatkich (two pointers) bilan O(n) vaqt va O(1) memory. Bu savol 'vaqt va memory almashuvi'ni tushunasizmi degan tekshiruv.","src":"https://neetcode.io/practice/practice/blind75"},{"l":"M","t":"mcq","tp":"Linked list","d":"alg","id":4001,"n":"A2","q":"Bog'langan ro'yxatda sikl (cycle) bor-yo'qligini O(1) qo'shimcha memory bilan qanday aniqlaysiz?","o":["Hamma tugunlarni set'ga yig'ib (O(n) memory)","Floyd's cycle detection: sekin (1 qadam) va tez (2 qadam) ko'rsatkichlar — uchrashsa sikl bor; vaqt O(n), memory O(1)","Ro'yxatni saralab","Rekursiya bilan"],"a":1,"e":"'Toshbaqa va quyon'. Siklning boshlanish tugunini topish uchun: uchrashgandan keyin bitta ko'rsatkichni boshga qaytarib, ikkalasini 1 qadamdan yurgizasiz — yana uchrashgan joy sikl boshi. Set bilan yechim ham to'g'ri, lekin intervyuda O(1) memory kutiladi.","src":"https://neetcode.io/practice/practice/blind75"},{"l":"M","t":"mcq","tp":"Sliding window","d":"alg","id":4002,"n":"A3","q":"Takrorlanmaydigan belgilardan iborat eng uzun substring uzunligi. Samarali yechim?","o":["Hamma substringlarni tekshirish — O(n³)","Sliding window: o'ng chegarani surib, takror uchrasa chap chegarani oxirgi uchrash joyidan keyingi pozitsiyaga ko'chirish; har belgi ko'pi bilan ikki marta ko'riladi — O(n)","Saralas
