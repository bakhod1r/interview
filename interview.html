:"mcq","tp":"Messaging gotcha","d":"msg","id":17005,"n":"E43","q":"Kafka'da partition sonini oshirdingiz. Nima buzildi?","o":["Key bo'yicha partition taqsimoti o'zgaradi (hash % partitions) — bir key endi boshqa partition'ga tushadi va tartib kafolati buziladi","Hech narsa, xavfsiz operatsiya","Eski xabarlar o'chadi","Consumer group avtomatik qayta balanslamaydi"],"a":0,"e":"Tartib faqat partition ichida kafolatlanadi. Partition qo'shilganda eski xabarlar ko'chmaydi, lekin yangi xabarlar boshqa partition'ga borishi mumkin — natijada bir entity uchun eski va yangi eventlar turli partition'larda, ular parallel iste'mol qilinadi. Yechim: boshidan yetarli partition rejalash, yoki yangi topic'ga migratsiya, yoki consumer'da versiya/timestamp bilan eski eventni rad etish. Partition sonini kamaytirib bo'lmaydi."},{"l":"P","t":"mcq","tp":"Messaging gotcha","d":"msg","id":17006,"n":"E44","q":"Consumer'da bitta 'zaharli' (poison) xabar butun partition'ni to'xtatib qo'ydi. Nima qilasan?","o":["Retry limitidan keyin xabarni DLQ'ga (dead letter topic) yuborib, offset'ni commit qilish va davom etish; DLQ'ni alert va qo'lda qayta ishlash bilan kuzatish","Cheksiz retry qilish","Offset'ni qo'lda oldinga surib, xabarni jimgina tashlash","Consumer group'ni o'chirish"],"a":0,"e":"Kafka'da head-of-line blocking: partition ketma-ket o'qiladi, bitta xabar qayta-qayta yiqilsa lag cheksiz o'sadi. Naqsh: in-memory retry (bir necha marta, backoff bilan) — keyin retry topic (kechikish bilan) — keyin DLQ. DLQ'da xabar bilan birga xato sababi, stack, original offset/partition/timestamp saqlanadi. Muhim: DLQ'ga yuborish ham xato bersa nima bo'lishini hal qilish kerak."},{"l":"P","t":"mcq","tp":"Messaging gotcha","d":"msg","id":17007,"n":"E45","q":"Consumer group doim rebalance bo'lyapti (lag o'syapti). Eng ehtimolli sabab?","o":["Ishlov berish max.poll.interval.ms dan uzoq davom etyapti — broker consumer'ni o'lik deb hisoblab guruhni qayta balanslaydi; batch hajmini kamaytirish yoki ishni asinxron qilish kerak","Partition soni ko'p","Xabar hajmi kichik","Producer acks=all"],"a":0,"e":"Ikki xil timeout: session.timeout.ms (heartbeat, alohida thread) va max.poll.interval.ms (ikki poll orasidagi maksimal vaqt). Sekin ishlov berish ikkinchisini buzadi. Yechimlar: max.poll.records kamaytirish, ishni worker pool'ga berib offset'ni faqat tugagach commit qilish, incremental cooperative rebalancing (CooperativeStickyAssignor) yoqish — u to'liq stop-the-world rebalance'ni yo'qotadi."},{"l":"S","t":"mcq","tp":"Messaging gotcha","d":"msg","id":17008,"n":"E46","q":"RabbitMQ'da consumer ack yubormay crash bo'ldi. Xabar nima bo'ladi?","o":["Kanal uzilganda xabar requeue qilinadi va boshqa consumer'ga beriladi (manual ack rejimida)","Xabar yo'qoladi","Xabar abadiy 'unacked' qoladi","Avtomatik DLQ'ga ketadi"],"a":0,"e":"autoAck=false bo'lsa broker ack kutadi; connection/channel yopilganda unacked xabarlar navbatga qaytadi. Tuzoqlar: autoAck=true bilan crash — xabar yo'qoladi; prefetch (QoS) o'rnatilmasa bitta consumer barcha xabarlarni tortib oladi va yuk taqsimlanmaydi; cheksiz requeue looplarni to'xtatish uchun x-death header hisobi bilan DLX ishlatiladi."},{"l":"P","t":"open","tp":"Messaging gotcha","d":"msg","id":17009,"n":"E47","q":"Outbox pattern joriy qildingiz, lekin ba'zi eventlar publish bo'lmayapti. Qayerdan qidirasan?","m":"1) Publisher'ning tanlovi: 'FOR UPDATE SKIP LOCKED' bilan bir nechta publisher instansiyasi ishlayaptimi — lock'siz bo'lsa eventlar ikki marta yoki hech qachon olinmasligi mumkin. 2) Status yangilash tranzaksiyasi: publish'dan keyin 'sent' belgilash publish bilan atomik emas — crash bo'lsa qayta yuboriladi (bu at-least-once, normal), lekin publish'dan OLDIN belgilansa event yo'qoladi. 3) Poller intervali va xato holati: broker xatosi retry qilinayaptimi yoki row 'failed' bo'lib qolyaptimi (alert kerak). 4) Tartib: partition key bo'yicha bir entity eventlari ketma-ket yuborilyaptimi. 5) Kuzatuv: outbox'da eng eski 'pending' row yoshi (age) metrikasi va unga alert — bu eng muhim signal. 6) Tozalash job'i yuborilmagan row'ni o'chirib yubormayaptimi.","e":"Outbox g'oyasi: biznes o'zgarishi va event bitta DB tranzaksiyasida yoziladi (dual write muammosi yo'q), keyin alohida jarayon (poller yoki CDC/Debezium) brokerga uzatadi. Kafolat — at-least-once, shuning uchun consumer idempotent bo'lishi shart."},{"l":"S","t":"mcq","tp":"Messaging gotcha","d":"msg","id":30166,"n":"SN167","q":"Consumer xabarni oldi, DB'ga yozdi, keyin ack yuborishdan oldin yiqildi. Nima bo'ladi?","o":["Xabar yo'qoladi","Xabar qayta yetkaziladi va DB yozuvi ikkinchi marta bajariladi — shuning uchun handler idempotent bo'lishi shart (unique kalit yoki inbox jadval)","Broker o'zi dedupe qiladi","Tranzaksiya rollback bo'ladi"],"a":1,"e":"Ack va DB commit atomik emas — bu dual-write muammosining ikkinchi yuzi. Yechim: xabar ID'sini biznes tranzaksiyasi ichida `processed_messages` jadvaliga unique yozish (inbox pattern); ikkinchi urinishda konflikt bo'ladi va ish o'tkazib yuboriladi. Teskari tartib (avval ack, keyin yozish) esa ma'lumot yo'qotadi."},{"l":"S","t":"mcq","tp":"Messaging gotcha","d":"msg","id":30167,"n":"SN168","q":"RabbitMQ'da `prefetch` (QoS) sozlanmagan. Natija?","o":["Hech narsa","Broker consumer'ga cheksiz xabar yuboradi: bitta consumer navbatni o'ziga tortadi, xotira to'ladi va yuk taqsimlanmaydi (sekin consumer boshqalarni kutishga majbur qilmaydi lekin o'zida ushlab qoladi)","Xabarlar yo'qoladi","Tartib buziladi"],"a":1,"e":"`basic.qos(prefetch=N)` — oqim nazorati: N ta ack qilinmagan xabardan ko'p berilmaydi. Kichik N (1-10) adolatli taqsimot va tez failover beradi, katta N throughputni oshiradi. Shu bilan birga `ack` qo'lda bo'lishi (`autoAck=false`) va xato bo'lganda `nack` + DLX (dead letter exchange) sozlanishi kerak."},{"l":"St","t":"mcq","tp":"Messaging gotcha","d":"msg","id":30168,"n":"SN169","q":"Retry uchun xabar qayta navbatga qo'yiladi (`requeue=true`). Qanday tuzoq bor?","o":["Tuzoq yo'q","Xabar darhol boshiga qaytib cheksiz aylanadi (hot loop, CPU va broker yuki) — kechiktirilgan retry kerak: DLX + TTL bilan 'retry queue' yoki alohida delay navbatlari, va urinish sonini headerda hisoblash","Xabar o'chib ketadi","Tartib saqlanadi"],"a":1,"e":"RabbitMQ'da tabiiy 'delayed retry' yo'q, shuning uchun naqsh: asosiy navbat → nack → DLX → TTL'li retry navbati → qaytib asosiy navbatga. Urinish soni `x-death` yoki o'z headerida saqlanadi va N dan keyin DLQ'ga o'tadi. Kafka'da esa retry topic'lari (`topic.retry.5m`) shu maqsadda ishlatiladi."},{"l":"S","t":"mcq","tp":"Messaging gotcha","d":"msg","id":30316,"n":"SN317","q":"Consumer xabarni oldi, DB'ga yozdi, keyin ack yuborishdan oldin yiqildi. Nima bo'ladi?","o":["Xabar yo'qoladi","Xabar qayta yetkaziladi va DB yozuvi ikkinchi marta bajariladi — shuning uchun handler idempotent bo'lishi shart (unique kalit yoki inbox jadval)","Broker o'zi dedupe qiladi","Tranzaksiya rollback bo'ladi"],"a":1,"e":"Ack va DB commit atomik emas — bu dual-write muammosining ikkinchi yuzi. Yechim: xabar ID'sini biznes tranzaksiyasi ichida `processed_messages` jadvaliga unique yozish (inbox pattern); ikkinchi urinishda konflikt bo'ladi va ish o'tkazib yuboriladi. Teskari tartib (avval ack, keyin yozish) esa ma'lumot yo'qotadi."},{"l":"S","t":"mcq","tp":"Messaging gotcha","d":"msg","id":30317,"n":"SN318","q":"RabbitMQ'da `prefetch` (QoS) sozlanmagan. Natija?","o":["Hech narsa","Broker consumer'ga cheksiz xabar yuboradi: bitta consumer navbatni o'ziga tortadi, xotira to'ladi va yuk taqsimlanmaydi (sekin consumer boshqalarni kutishga majbur qilmaydi lekin o'zida ushlab qoladi)","Xabarlar yo'qoladi","Tartib buziladi"],"a":1,"e":"`basic.qos(prefetch=N)` — oqim nazorati: N ta ack qilinmagan xabardan ko'p berilmaydi. Kichik N (1-10) adolatli taqsimot va tez failover beradi, katta N throughputni oshiradi. Shu bilan birga `ack` qo'lda bo'lishi (`autoAck=false`) va xato bo'lganda `nack` + DLX (dead letter exchange) sozlanishi kerak."},{"l":"St","t":"mcq","tp":"Messaging gotcha","d":"msg","id":30318,"n":"SN319","q":"Retry uchun xabar qayta navbatga qo'yiladi (`requeue=true`). Qanday tuzoq bor?","o":["Tuzoq yo'q","Xabar darhol boshiga qaytib cheksiz aylanadi (hot loop, CPU va broker yuki) — kechiktirilgan retry kerak: DLX + TTL bilan 'retry queue' yoki alohida delay navbatlari, va urinish sonini headerda hisoblash","Xabar o'chib ketadi","Tartib saqlanadi"],"a":1,"e":"RabbitMQ'da tabiiy 'delayed retry' yo'q, shuning uchun naqsh: asosiy navbat → nack → DLX → TTL'li retry navbati → qaytib asosiy navbatga. Urinish soni `x-death` yoki o'z headerida saqlanadi va N dan keyin DLQ'ga o'tadi. Kafka'da esa retry topic'lari (`topic.retry.5m`) shu maqsadda ishlatiladi."},{"l":"S","t":"mcq","tp":"Messaging gotcha","d":"msg","id":30502,"n":"SN503","q":"Consumer xabarni ishlashda tashqi API'ni chaqiradi va u sekin. Nima bo'ladi?","o":["Broker tezlashtiradi","Lag o'sadi va (Kafka'da) `max.poll.interval.ms` oshib rebalance boshlanadi; yechim — parallelizm (partition ichida ham worker pool + tartib kerak bo'lsa kalit bo'yicha), batch chaqiruv, yoki ishni ikki bosqichga bo'lish (qabul qilib navbatga, keyin ishlash)","Xabarlar yo'qoladi","Broker xabarni tashlaydi"],"a":1,"e":"Nozik joy: poll'dan keyin ishni background'ga berib darhol poll qilish lag'ni yashiradi, lekin offset commit mantiqini buzishi mumkin (ish tugamasdan commit — ma'lumot yo'qoladi). To'g'ri: offset faqat ish tugagach commit qilinadi, oqim nazorati `max.poll.records` va ichki navbat hajmi bilan boshqariladi."},{"l":"St","t":"mcq","tp":"Messaging gotcha","d":"msg","id":30503,"n":"SN504","q":"DLQ to'lib ketdi va hech kim sezmadi. Qanday oldini olinadi?","o":["DLQ'ni o'chirish","DLQ — metrikali va egali obyekt: xabarlar soni/yoshi bo'yicha alert, sabablar bo'yicha guruhlash (top xato turlari), qayta o'ynatish vositasi va davriy ko'rib chiqish jarayoni; aks holda DLQ 'ma'lumot qabristoni' bo'lib qoladi","Cheksiz retry","Xabarlarni o'chirib tashlash"],"a":1,"e":"Amaliy talablar: DLQ xabari original kontekst bilan saqlanadi (topic, partition, offset, headerlar, xato matni, urinishlar soni), replay skripti idempotent (dublikat yaratmaydi), va DLQ'ga tushish sabablari dashboardda ko'rinadi. Alert 'DLQ'da xabar bor' emas, 'DLQ o'smoqda / eng eski xabar N soatdan oshdi' bo'lishi kerak."},{"l":"J","t":"mcq","tp":"HTTP","d":"api","id":1000,"n":"B1","q":"Qaysi HTTP metodlar <b>idempotent</b>?","o":["GET, POST","GET, PUT, DELETE","POST, PATCH","Faqat GET"],"a":1,"e":"Idempotent: bir xil query'ni N marta yuborish natijasi 1 marta yuborish bilan bir xil. GET, HEAD, PUT, DELETE, OPTIONS — idempotent. POST emas (har safar yangi resurs). PATCH — kafolatlanmagan ('+1' patch idempotent emas). Retry qilish xavfsizligi aynan shunga bog'liq."},{"l":"J","t":"mcq","tp":"HTTP","d":"api","id":1001,"n":"B2","q":"401 va 403 status kodlari farqi?","o":["Farqi yo'q","401 — kim ekanligingiz noma'lum (autentifikatsiya yo'q/yaroqsiz); 403 — kimligingiz ma'lum, lekin ruxsat yo'q","401 — server xatosi, 403 — client xatosi","403 — resurs topilmadi"],"a":1,"e":"401 Unauthorized aslida 'unauthenticated' — token yo'q yoki muddati o'tgan, qayta login. 403 Forbidden — token to'g'ri, lekin rol yetmaydi. Maxfiy resurs mavjudligini yashirish uchun ba'zan 404 qaytariladi (BOLA himoyasi)."},{"l":"J","t":"code","tp":"REST","d":"api","id":1002,"n":"B3","q":"Yangi user success'li yaratildi. Eng to'g'ri javob?","c":"POST /users\nContent-Type: application/json\n\n{\"email\": \"ali@x.uz\"}","o":["200 OK, bo'sh body","201 Created + Location: /users/42 header + yaratilgan resurs","204 No Content","302 Found → /users/42"],"a":1,"e":"201 Created — yangi resurs yaratildi; Location header uning URLini beradi. 200 ham ishlaydi, lekin semantik aniq emas. 204 — body yo'q (odatda DELETE/PUT). Validatsiya xatosi — 400/422, email band — 409 Conflict."},{"l":"J","t":"mcq","tp":"REST","d":"api","id":1003,"n":"B4","q":"REST resurs nomlashda eng yaxshi variant?","o":["POST /createUser","GET /getUsersList","GET /users/42/orders","POST /users/42/deleteOrder?id=7"],"a":2,"e":"Resurslar — ot, ko'plikda; amal — HTTP metodi. /users/42/orders — 42-userning orderlari. O'chirish: DELETE /orders/7. Fe'l URLda (createUser) — RPC uslubi, REST emas. Istisno: resursga tushmaydigan amallar (POST /orders/7/cancel) — qabul qilinadi."},{"l":"J","t":"open","tp":"HTTP","d":"api","id":1004,"n":"B5","q":"Brauzerga URL yozib Enter bosganda nima sodir bo'ladi (backend nuqtai nazaridan)?","m":["DNS resolve (cache → resolver → IP)","TCP connection (3-way handshake), TLS handshake (sertifikat, key kelishuvi)","HTTP query → CDN / load balancer → reverse proxy (nginx) → ilova serveri","Ilova: routing, middleware (auth, log), biznes logika, DB/cache","Javob: status, header (cache-control, cookie), body; brauzer render qiladi, qo'shimcha resurslar yuklanadi"],"e":"Klassik savol — chuqurlik darajangizni ko'rsatadi. Backend uchun LB, proxy, keep-alive, cache qatlamlarini aytish muhim."},{"l":"J","t":"mcq","tp":"API","d":"api","id":1005,"n":"B6","q":"'Stateless' server nimani anglatadi?","o":["Server DB ishlatmaydi","Har query o'zi uchun kerakli hamma kontekstni (token va h.k.) olib keladi; server query'lar orasida client sessiyasini memory'da saqlamaydi","Server hech narsa loglamaydi","Server faqat GET qabul qiladi"],"a":1,"e":"Stateless servis gorizontal masshtablanadi: har qanday instance har qanday query'ni qabul qiladi, LBda sticky session kerak emas. Holat DB/Redis/token ichida saqlanadi. Stateful (WebSocket, in-memory session) masshtablashni qiyinlashtiradi."},{"l":"M","t":"open","tp":"API","d":"api","id":1011,"n":"B12","q":"Katta ro'yxat uchun API pagination'ni qanday loyihalaysiz?","m":["Offset/limit: oddiy, page'ga sakrash mumkin; katta offsetda sekin, yozishlarda row'lar siljiydi","Cursor (keyset): ?cursor=opaque_token&limit=20 — barqaror va tez, sakrash yo'q","Javobda next_cursor / has_more; total count qimmat — ixtiyoriy yoki taxminiy","limit uchun maksimum (masalan 100)","Barqaror tartib: sort + unique tie-breaker (id)"],"e":"Cursor'ni opaque (base64) qilish ichki strukturani keyin o'zgartirishga imkon beradi. Feed/timeline — cursor; admin table — offset yetarli."},{"l":"S","t":"open","tp":"API","d":"api","id":1016,"n":"B17","q":"Public API versiyalash va breaking change'ni qanday boshqarasiz?","m":["Breaking bo'lmaganlar: yangi ixtiyoriy maydon, yangi endpoint — versiyasiz qo'shiladi (client noma'lum maydonlarni e'tiborsiz qoldiradi)","Breaking: maydonni o'chirish/nomini o'zgartirish, tipini o'zgartirish, majburiy parametr","Usullar: URL (/v2), header (Accept version), sana bo'yicha (Stripe)","Deprecation: Deprecation/Sunset header, changelog, foydalanish metrikasi, muddat","Eski versiyani adapter qatlami bilan qo'llash — ichki kod bitta"],"e":"Senior signal: versiyalashdan ko'ra breaking change'dan qochish; va eski versiya kim tomonidan ishlatilayotganini o'lchash."},{"l":"M","t":"mcq","tp":"HTTP","d":"api","id":6002,"n":"F3","q":"HTTP/1.1, HTTP/2 va HTTP/3 farqi?","o":["Faqat tezlik raqami","HTTP/1.1 — bitta connection'da queue bilan (head-of-line blocking, brauzer 6 ta connection ochadi). HTTP/2 — bitta TCP connection'da multiplekslash va header siqish, lekin TCP darajasidagi HOL saqlanadi. HTTP/3 — QUIC (UDP) ustida: oqimlar mustaqil, connection tezroq o'rnatiladi va IP o'zgarganda ham saqlanadi","HTTP/2 shifrlanmagan","HTTP/3 TCP ustida ishlaydi"],"a":1,"e":"Amaliy natija: HTTP/2'da ko'p kichik query arzonlashadi (domain sharding va fayllarni birlashtirish kerakmas bo'lib qoldi). gRPC aynan HTTP/2 ustida qurilgan. HTTP/3 mobil network'larda (paket yo'qolishi ko'p) sezilarli yutuq beradi."},{"l":"M","t":"mcq","tp":"HTTP","d":"api","id":6004,"n":"F5","q":"Load balancer ortidagi servis vaqti-vaqti bilan 502/504 beryapti, loglarda panic yo'q. Tipik sabab?","o":["Kod xatosi","Timeout va keep-alive mos emas: LB idle timeout serverning keep-alive timeout'idan uzun bo'lsa, server connection'ni yopgan paytda LB o'sha connection'dan foydalanib 502 oladi. Server timeout'ini LB'nikidan biroz UZUN qilish kerak","Sertifikat eskirgan","DNS ishlamayapti"],"a":1,"e":"AWS ALB uchun klassik maslahat: server (Go'da http.Server.IdleTimeout) qiymati ALB idle timeout'idan katta bo'lsin. 504 — LB backend'dan javob kutib timeout bo'lgani. Bu turdagi failure'lar 'tasodifiy' ko'rinadi, shuning uchun timeout zanjirini yozib chiqish kerak: client → LB → servis → DB."},{"l":"M","t":"mcq","tp":"API design","d":"api","id":6006,"n":"F7","q":"REST, gRPC va GraphQL — qachon qaysi biri?","o":["gRPC har doim yaxshi","REST — public API, brauzer, keshlash va soddalik kerak bo'lsa. gRPC — ichki servislararo aloqa: past latency, qat'iy kontrakt, streaming. GraphQL — client turli shakldagi ma'lumotni o'zi tanlashi kerak bo'lsa (mobil/frontend, ko'p manbani birlashtirish)","GraphQL faqat ma'lumotlar bazasi uchun","REST eskirgan"],"a":1,"e":"Ko'p kompaniyada aralash: tashqariga REST/GraphQL, ichkarida gRPC. GraphQL narxi: N+1 resolver muammosi (DataLoader), keshlash qiyin, query murakkabligini cheklash kerak. Tanlovni 'moda' emas, iste'molchi va talab belgilaydi."},{"l":"S","t":"open","tp":"HTTP","d":"api","id":6010,"n":"F11","q":"'API sekin' degan shikoyat keldi. Network level'ida qanday diagnostika qilasiz?","m":["Bosqichlarni ajratish: DNS → TCP connect → TLS → query yuborish → TTFB (birinchi bayt) → yuklab olish; curl -w '%{time_namelookup} %{time_connect} %{time_appconnect} %{time_starttransfer} %{time_total}'","TTFB katta bo'lsa — server tomonidagi ishlov (DB, tashqi chaqiruv); download uzoq bo'lsa — javob hajmi yoki kanal","Client va server metrikasini solishtirish: server p99 yaxshi, client yomon bo'lsa — network, LB, DNS yoki queueing","Connection qayta ishlatilyaptimi (keep-alive), pool hajmi, TLS handshake har query'da takrorlanmayaptimi","Geografiya: RTT va CDN; katta javoblar uchun siqish (gzip/br) va pagination","Chuqurroq: tcpdump/ss bilan retransmit va queue'larni ko'rish, tracing bilan servis ichidagi qadamlar"],"e":"Kuchli javob — 'qayerda vaqt ketyapti' savolini bosqichlarga bo'lib o'lchash. Ko'p hollarda sabab: keep-alive yo'qligi, N+1 chaqiruvlar yoki katta javob hajmi."},{"l":"J","t":"mcq","tp":"HTTP methods","d":"api","id":11000,"n":"M1","q":"Qaysi metodlar <b>safe</b> (server holatini o'zgartirmaydi) hisoblanadi?","o":["GET, POST","GET, HEAD, OPTIONS (va TRACE) — ular faqat o'qiydi; POST, PUT, PATCH, DELETE holatni o'zgartiradi","Faqat GET","Hammasi safe"],"a":1,"e":"Safe metodlarni brauzer, proxy va crawler'lar erkin chaqirishi mumkin — shuning uchun GET bilan ma'lumot o'chiradigan endpoint (/delete?id=5) xavfli: prefetch yoki crawler uni chaqirib qo'yadi. Safe ≠ idempotent: har safe metod idempotent, lekin har idempotent metod safe emas (DELETE idempotent, lekin safe emas).","src":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Methods"},{"l":"M","t":"mcq","tp":"HTTP methods","d":"api","id":11001,"n":"M2","q":"PUT va PATCH farqi?","o":["Bir xil, faqat nomi boshqa","PUT — resursni to'liq almashtiradi (yuborilmagan maydonlar o'chadi yoki default bo'ladi) va idempotent; PATCH — qisman o'zgartirish va umumiy holda idempotent emas","PATCH resursni yaratadi","PUT faqat yangi resurs uchun"],"a":1,"e":"Amaliy tuzoq: PUT bilan faqat bitta maydon yuborib, qolganini nechtaligini bilmay o'chirib yuborish. PATCH formatlari: JSON Merge Patch (RFC 7386 — oddiy, null bilan o'chirish) va JSON Patch (RFC 6902 — op/path/value, massiv bilan ishlash uchun). PATCH'ni idempotent qilish mumkin, agar operatsiya 'qiymatni o'rnat' bo'lsa; 'increment' bo'lsa — yo'q."},{"l":"M","t":"mcq","tp":"HTTP methods","d":"api","id":11002,"n":"M3","q":"Bir xil resursni ikki foydalanuvchi bir vaqtda tahrirlamoqda. HTTP darajasida qanday himoya bor?","o":["Hech qanday, faqat DB lock","Shartli so'rovlar: server ETag beradi, client keyingi yozishda <code>If-Match: \"etag\"</code> yuboradi — resurs o'zgargan bo'lsa server 412 Precondition Failed qaytaradi (optimistic locking)","POST ishlatish kerak","Faqat WebSocket bilan"],"a":1,"e":"Bu — HTTP darajasidagi optimistic concurrency. Yangi resurs yaratishda takrorni to'sish uchun If-None-Match: *. ETag versiya ustuni yoki kontent hash'idan olinadi. Keshlashda ham ishlatiladi: client If-None-Match yuboradi, o'zgarmagan bo'lsa 304 Not Modified (tanasiz javob)."},{"l":"M","t":"mcq","tp":"HTTP methods","d":"api","id":11003,"n":"M4","q":"HEAD va OPTIONS nima uchun kerak?","o":["Ular eskirgan","HEAD — GET bilan bir xil, lekin faqat header qaytadi (hajm, ETag, mavjudlikni tekshirish uchun). OPTIONS — qo'llab-quvvatlanadigan metodlar va CORS preflight uchun","HEAD faqat brauzerlarda","OPTIONS resursni o'chiradi"],"a":1,"e":"CORS preflight aynan OPTIONS bilan ketadi va u autentifikatsiyasiz o'tishi kerak — auth middleware OPTIONS so'rovini 401 bilan to'ssa, brauzerdan hech qanday cross-origin so'rov ishlamaydi. Bu 'CORS ishlamayapti' shikoyatining ko'p uchraydigan sababi."},{"l":"M","t":"mcq","tp":"HTTP methods","d":"api","id":11004,"n":"M5","q":"Server 405 va 501 statuslarini qachon qaytaradi?","o":["Ikkalasi ham 'topilmadi' degani","405 Method Not Allowed — resurs mavjud, lekin bu metod unga ruxsat etilmagan (javobda Allow header bo'lishi shart); 501 Not Implemented — server bu metodni umuman qo'llab-quvvatlamaydi","405 — server xatosi","501 — client xatosi"],"a":1,"e":"To'g'ri status kodlar client uchun muhim: 4xx — client tuzatishi kerak, 5xx — retry qilish mantiqiy. Yana: 404 va 403 tanlovi (resurs mavjudligini yashirish kerakmi), 409 Conflict (holat to'qnashuvi), 422 (validatsiya), 429 (rate limit)."},{"l":"S","t":"mcq","tp":"HTTP methods","d":"api","id":11005,"n":"M6","q":"Katta qidiruv filtrlari GET query string'ga sig'maydi. To'g'ri yechim qaysi?","o":["GET body bilan yuborish","POST /search bilan yuborish (tan olingan amaliyot, lekin keshlash yo'qoladi) yoki filtrni saqlab qisqa id bilan GET qilish; GET body esa ko'p proxy va client tomonidan e'tiborsiz qoldiriladi","URL uzunligi cheksiz, muammo yo'q","DELETE ishlatish"],"a":1,"e":"URL uzunligi standartda cheklanmagan, lekin amalda brauzer/proxy/server limitlari bor (~2–8 KB). GET so'rovida body texnik jihatdan taqiqlanmagan, ammo xulq aniqlanmagan — ishlatmang. Keshlash muhim bo'lsa: filtrni normalizatsiya qilib hash bilan GET /search/{hash}."},{"l":"M","t":"mcq","tp":"REST","d":"api","id":13000,"n":"K1","q":"REST va 'RESTful' farqi nima (Richardson maturity model)?","o":["Bir xil narsa","REST — Roy Fielding ta'riflagan arxitektura uslubi va uning cheklovlari; 'RESTful' esa amalda shu cheklovlarga qanchalik rioya qilinganini bildiradi. Richardson modeli: 0-daraja — bitta endpoint (RPC), 1 — resurslar, 2 — HTTP metodlari va status kodlari, 3 — HATEOAS (javobda keyingi harakat havolalari)","RESTful faqat JSON ishlatadi","REST — protokol, RESTful — kutubxona"],"a":1,"e":"Amalda ko'p 'REST API'lar 2-darajada to'xtaydi va bu normal deb qabul qilingan; HATEOAS kamdan-kam qo'llanadi. REST cheklovlari: client-server, stateless, cacheable, uniform interface, layered system va ixtiyoriy code-on-demand. Intervyuda kuchli javob: darajalarni aytib, 'bizning API 2-darajada, chunki HATEOAS qiymatdan ko'ra murakkablik qo'shardi' deb asoslash.","src":"https://martinfowler.com/articles/richardsonMaturityModel.html"},{"l":"M","t":"mcq","tp":"API","d":"api","id":13007,"n":"K8","q":"Sinxron va asinxron aloqa: qachon qaysi biri?","o":["Asinxron har doim yaxshi","Sinxron — foydalanuvchi natijani darhol kutayotganda va javob kerak bo'lganda (o'qish, validatsiya). Asinxron — natija darhol kerak bo'lmasa (email, hisobot, integratsiya), yuk cho'qqisini tekislash va bog'liqlik nosozligidan ajralish uchun","Sinxron ishonchliroq","Asinxron faqat Kafka bilan bo'ladi"],"a":1,"e":"Asinxronning narxi: eventual consistency, kuzatuv va debug murakkabligi, holatni kuzatish uchun qo'shimcha UI/API (job status). Amaliy naqsh: so'rovni qabul qilib 202 Accepted va status havolasini qaytarish. Sinxron zanjirni uzaytirish esa mavjudlikni ko'paytiradi (0.99^n)."},{"l":"M","t":"mcq","tp":"API","d":"api","id":13011,"n":"K12","q":"Polling va webhook: qaysi birini tanlaysiz?","o":["Polling har doim oddiy va yaxshi","Webhook — hodisa yuz berganda darhol xabar (kam kechikish, kam so'rov), lekin siz endpoint ochishingiz, imzo tekshirishingiz va takrorlarga chidashingiz kerak. Polling — boshqarish oson va nosozlikka chidamli, lekin kechikish va keraksiz so'rovlar ko'p","Webhook faqat ichki tizimlarda","Polling real vaqt beradi"],"a":1,"e":"Ishonchli integratsiya ko'pincha ikkalasini birga ishlatadi: webhook tezlik uchun, davriy reconciliation esa yo'qolgan hodisalarni yopish uchun. Webhook uchun majburiy: imzo, idempotentlik, tez 2xx javob va og'ir ishni navbatga qo'yish."},{"l":"S","t":"mcq","tp":"API design","d":"api","id":14011,"n":"SR12","q":"GraphQL API'ni og'ir so'rovlardan qanday himoya qilasiz?","o":["Himoya kerak emas, client o'zi biladi","Query chuqurligi va murakkabligi (complexity/cost) bo'yicha limit, persisted queries (faqat oldindan ro'yxatdan o'tgan so'rovlar), timeout, va resolver darajasida DataLoader bilan batching","Faqat rate limit yetarli","Introspection'ni yoqib qo'yish"],"a":1,"e":"GraphQL'da bitta so'rov o'nlab jadvalga N+1 query yasashi mumkin — shuning uchun DataLoader majburiy. Public API'da introspection va xato tafsilotlarini o'chirish, mutation'larga alohida limit. REST'dagi endpoint bo'yicha rate limit bu yerda yetarli emas: narx so'rov shakliga bog'liq."},{"l":"S","t":"open","tp":"API","d":"api","id":14012,"n":"SR13","q":"Idempotency qatlamini alohida subsystem sifatida loyihalang (senior intervyuda tez-tez so'raladi).","m":["Kontrakt: client Idempotency-Key yuboradi; kalit + endpoint + so'rov hash birga saqlanadi","Saqlash: idempotency_keys(key PK, status, response, created_at) — INSERT ... ON CONFLICT DO NOTHING bilan 'birinchi' aniqlanadi","Holatlar: in_progress (parallel takror → 409 yoki kutish), completed (saqlangan javob qaytariladi), failed (retry ruxsat)","Bir xil kalit, boshqa body → 422: bu client xatosi","TTL va tozalash (masalan 24 soat), saqlash hajmini nazorat qilish","Tashqi provayderga ham o'sha kalitni uzatish; webhook va retry bilan birga ishlashi"],"e":"L5+ intervyularda katta tizim o'rniga aynan shunday kichik subsystem so'ralishi mumkin. Kuchli javob poyga holatini unique constraint bilan yopadi va 'in_progress' stsenariysini aniq aytadi."},{"l":"S","t":"open","tp":"API","d":"api","id":14015,"n":"SR16","q":"Uzoq davom etadigan operatsiya (hisobot, import) uchun API'ni qanday loyihalaysiz?","m":["So'rov qabul qilinadi va darhol 202 Accepted + job_id va status havolasi qaytadi","Status endpoint: holat (queued/running/succeeded/failed), progress, natija havolasi, xato sababi","Bajarilish: navbat + worker; idempotentlik (bir xil kirish uchun takror job yaratmaslik)","Bekor qilish va qayta urinish API'si; timeout va maksimal davomiylik","Natija: obyekt saqlashda vaqtinchalik havola (pre-signed), katta natija uchun stream/bo'laklash","Xabar berish: webhook yoki push, lekin polling ham qo'llab-quvvatlansin"],"e":"Sinxron HTTP so'rovda 5 daqiqalik ishni bajarish — klassik xato: timeout'lar, retry va yo'qolgan natijalar. 202 + status pattern'i barcha yirik API'larda (Stripe, AWS) shu tarzda."},{"l":"S","t":"open","tp":"API","d":"api","id":14016,"n":"SR17","q":"Yuqori yukda fayl yuklash oqimini loyihalang (100 MB gacha fayllar).","m":["Client to'g'ridan-to'g'ri obyekt saqlashga yuklaydi (pre-signed URL) — backend trafikni o'tkazmaydi","Katta fayllar uchun multipart/resumable upload; tarmoq uzilsa davom ettirish","Validatsiya: hajm limiti, MIME/kontent tekshiruvi (kengaytmaga ishonmaslik), virus skan — yuklangandan keyin async","Metadata DB'da: status (pending → ready), egalik, checksum; faqat ready bo'lgach foydalanishga ruxsat","Tozalash: yarim qolgan yuklamalar uchun lifecycle qoidasi","Xavfsizlik: pre-signed URL qisqa muddatli va cheklangan (metod, kalit, hajm shart)"],"e":"Kuchli javob backend orqali o'tkazmaslikni birinchi aytadi va 'yuklandi' bilan 'foydalanishga tayyor' holatlarini ajratadi."},{"l":"S","t":"mcq","tp":"API","d":"api","id":14019,"n":"SR20","q":"Ommaviy (bulk) API'ni qanday loyihalaysiz — 10 000 yozuvni bir so'rovda yaratish?","o":["Oddiy POST bilan hammasini bitta tranzaksiyada","Chegaralangan partiya (masalan 500 tagacha), qisman muvaffaqiyat natijasi (har element uchun status), idempotentlik kaliti, va juda katta hajm uchun async job (202 + status)","Har yozuvni alohida so'rov bilan","Cheksiz hajm, timeout'ni oshirish"],"a":1,"e":"Muhim qaror: 'hammasi yoki hech narsa' (atomik) yoki 'qisman muvaffaqiyat'. Atomik bo'lsa katta tranzaksiya va lock muammosi; qisman bo'lsa client uchun aniq natija formati kerak (index → xato). Har ikkala holatda ham partiya hajmi cheklanadi."},{"l":"S","t":"mcq","tp":"API design","d":"api","id":30281,"n":"SN282","q":"API versiyalash: qaysi yondashuv va breaking change'ni qanday boshqarasiz?","o":["Hech qachon o'zgartirmaslik","URL yoki header bilan major versiya (`/v2`), lekin asosiy intizom — additive o'zgarishlar (yangi maydon majburiy emas), eski versiyani deprecation muddati bilan qo'llab-turish (`Deprecation`/`Sunset` header, mijozlarga xabar, ishlatilishni metrikada kuzatish)","Har o'zgarishda yangi versiya","Faqat frontendni yangilash"],"a":1,"e":"Ko'p versiyani parallel ushlash qimmat — shuning uchon maqsad versiyalarni kamaytirish: yangi maydon qo'shish, ixtiyoriy parametrlar, va xatti-harakatni flag bilan boshqarish. Eski versiyani o'chirishdan oldin haqiqiy ishlatilishni o'lchash shart (kim, qancha) — aks holda jim buzilish bo'ladi."},{"l":"S","t":"mcq","tp":"API design","d":"api","id":30282,"n":"SN283","q":"Ro'yxat endpoint'i uchun cursor va offset pagination tanlovi?","o":["Offset har doim qulay","Cursor (keyset): barqaror natija, chuqurlikda ham tez — oqim/cheksiz scroll uchun to'g'ri; offset: sahifa raqami va umumiy soni kerak bo'lgan admin UI uchun qulay, lekin chuqurlikda sekin va ma'lumot o'zgarganda qatorlar surilib ketadi","Cursor faqat Kafka'da","Farqi yo'q"],"a":1,"e":"Amaliy kelishuv: public API va mobil ro'yxatlarda cursor (opaque token — ichida sort kaliti va yo'nalish, imzolangan bo'lsa yaxshi), admin panelda offset lekin chuqurlik limiti bilan. Umumiy `total` soni qimmat bo'lsa taxminiy qiymat berish yoki umuman bermaslik — bu ham API kontrakti qarori."},{"l":"S","t":"mcq","tp":"API design","d":"api","id":30283,"n":"SN284","q":"Bulk/batch endpoint dizaynida qanday qarorlar kerak?","o":["Faqat massiv qabul qilish yetarli","Qisman muvaffaqiyat semantikasi (hammasi-yoki-hech narsa yoki per-element natija va status ro'yxati), element soni limiti, idempotency key butun batch va/yoki har element uchun, va javobda har element bo'yicha xato sababi","Har doim tranzaksion bo'lishi kerak","Batch kerak emas"],"a":1,"e":"Eng ko'p unutiladigan qism — qisman xato. `207`/`200` bilan per-element natija qaytarish mijozga qayta urinish imkonini beradi (faqat yiqilganlarini). Tranzaksion 'hammasi-yoki-hech narsa' oddiy, lekin katta batch'da bitta noto'g'ri yozuv butun ishni to'xtatadi — shuning uchun tanlov biznes talabidan kelib chiqadi va hujjatlashtiriladi."},{"l":"M","t":"mcq","tp":"gRPC","d":"api","id":6005,"n":"F6","q":"gRPC nima ustiga qurilgan?","o":["HTTP/1.1 va JSON","HTTP/2 va Protocol Buffers: ikkilik (binary) format, kodni .proto dan generatsiya qilish, to'rt chaqiruv turi — unary, server-stream, client-stream, bidirectional","WebSocket va XML","TCP ustida o'z protokoli"],"a":1,"e":"Afzalliklar: kichik va tez serializatsiya, qat'iy kontrakt, kod generatsiyasi, streaming, deadline va cancel protokol ichida. Kamchiliklar: brauzerdan to'g'ridan-to'g'ri ishlamaydi (gRPC-Web yoki gateway kerak), inson o'qiy olmaydi (debug uchun grpcurl), oraliq proxy'lar HTTP/2 va trailers'ni qo'llashi shart.","src":"https://grpc.io/docs/what-is-grpc/core-concepts/"},{"l":"S","t":"mcq","tp":"gRPC","d":"api","id":6007,"n":"F8","q":"Protobuf'da orqaga moslikni (backward compatibility) saqlash qoidasi?","o":["Maydon nomini o'zgartirmaslik yetarli","Maydon RAQAMI (tag) kontraktning o'zi: raqamni qayta ishlatmaslik kerak, o'chirilgan maydonlar uchun reserved yozish; yangi maydon qo'shish xavfsiz, majburiy semantika qo'shish esa buzadi. Nomi esa (binar formatda) muhim emas","Har o'zgarishda yangi versiya kerak","Maydon tipini bemalol o'zgartirish mumkin"],"a":1,"e":"Bir raqamni boshqa maydonga berish — eski clientlar ma'lumotni noto'g'ri o'qiydi (jim buziladi, xato bermaydi). Shuning uchun: reserved 5, 7; reserved \"old_name\";. Enum'da ham 0 qiymati default bo'lishi shart. Kontrakt tekshiruvi CI'da avtomatlashtiriladi (buf breaking).","src":"https://protobuf.dev/programming-guides/proto3/"},{"l":"S","t":"mcq","tp":"gRPC","d":"api","id":6008,"n":"F9","q":"gRPC'da timeout qanday ishlaydi?","o":["Har servis o'z timeout'ini mustaqil qo'yadi","Deadline chaqiruv bilan birga uzatiladi: A servis 2s deadline qo'ysa, B va undan keyingi chaqiruvlar qolgan vaqtni biladi va muddat tugaganda hamma zanjir DEADLINE_EXCEEDED bilan to'xtaydi","Timeout yo'q","Faqat client tomonda ishlaydi"],"a":1,"e":"Bu oddiy HTTP'dan katta afzallik: deadline tarqaladi va 'yetim' ish qolmaydi. Go'da context bilan tabiiy bog'lanadi: ctx, cancel := context.WithTimeout(...) va shu ctx chaqiruvga uzatiladi. Qoida: har chaqiruvda deadline bo'lsin va ichkariga kirgan sari kamaysin."},{"l":"S","t":"mcq","tp":"gRPC","d":"api","id":6009,"n":"F10","q":"gRPC servis Kubernetes'da bitta podga yuk to'plab qolyapti, boshqalari bo'sh. Sabab?","o":["gRPC yomon masshtablanadi","gRPC HTTP/2 da uzoq yashaydigan bitta connection'dan foydalanadi — L4 (TCP) balanslovchi connection'ni bir marta taqsimlaydi va keyingi hamma chaqiruv shu podga tushadi. Yechim: client-side load balancing (DNS/headless service bilan), L7 proxy (Envoy/mesh) yoki connection'ni davriy uzish (MAX_CONNECTION_AGE)","Pod resurslari kam","DNS cache"],"a":1,"e":"Kubernetes Service — L4, shuning uchun gRPC va boshqa uzoq connection'lar (WebSocket) uchun yetarli emas. Amaliy variantlar: grpc-go'da round_robin balanser + headless service, yoki service mesh sidecar'i. Serverda keepalive va MAX_CONNECTION_AGE_GRACE qo'yish yangi podlarga yuk kelishini ta'minlaydi."},{"l":"S","t":"mcq","tp":"gRPC","d":"api","id":30000,"n":"SN1","q":"gRPC'da <b>deadline</b> va <b>timeout</b> orasidagi amaliy farq nima?","o":["Farqi yo'q, sinonim","Deadline — absolute vaqt nuqtasi, chaqiruv zanjiri bo'ylab propagate qilinadi; timeout — har hop uchun alohida nisbiy muddat","Timeout serverda, deadline clientda ishlaydi","Deadline faqat streaming RPC uchun"],"a":1,"e":"gRPC wire'da `grpc-timeout` header ketadi, lekin semantikasi deadline: A→B→C zanjirida qolgan budjet kamayib boradi va C o'zi uchun yangi 5s olmaydi. Go'da `context.WithDeadline` interceptor orqali avtomatik uzatiladi. Har servisda mustaqil timeout qo'yilsa — zanjir budjeti ko'payib ketadi (5s+5s+5s) va client allaqachon ketgan bo'lsa ham server ishlashda davom etadi (ishlab chiqarishda 'ghost work')."},{"l":"S","t":"mcq","tp":"gRPC","d":"api","id":30001,"n":"SN2","q":"Protobuf sxemasida maydonni o'chirish kerak. Eng xavfsiz yo'l?","o":["Maydonni o'chirib, raqamni keyingi yangi maydonga berish","Maydonni o'chirib `reserved 5; reserved \"old_field\";` qo'yish","Maydon turini `bytes` ga o'zgartirish","Maydonni `optional` qilish yetarli"],"a":1,"e":"Wire formatda maydon nomi emas, <b>tag raqami</b> muhim. Raqam qayta ishlatilsa eski client yangi ma'noni eski tur deb o'qiydi — jim data corruption. `reserved` compile-time'da qayta ishlatishni bloklaydi. Qo'shimcha qoida: required yo'q (proto3), tur o'zgartirish breaking (int32↔string), enum'ga qiymat qo'shish mumkin lekin default 0 saqlanadi."},{"l":"S","t":"mcq","tp":"gRPC","d":"api","id":30002,"n":"SN3","q":"gRPC client Kubernetes'da `Service` (ClusterIP) orqali 10 podga ulangan. Yuklama bitta podga tushib qolgan. Sabab?","o":["gRPC UDP ishlatadi","HTTP/2 bitta uzoq yashovchi TCP ulanishda multiplexing qiladi; L4 ClusterIP faqat ulanishni balanslaydi, request'ni emas","ClusterIP round-robin qilmaydi umuman","Pod readiness probe yo'q"],"a":1,"e":"kube-proxy L4 balanslaydi: bir marta ulanish o'rnatiladi, keyingi barcha request'lar shu TCP orqali ketadi. Yechimlar: (1) client-side balansirovka — `dns:///headless-service:port` + `round_robin`, (2) service mesh yoki L7 proxy (Envoy/Linkerd), (3) `MAX_CONNECTION_AGE` serverda — ulanishlar davriy qayta tarqaladi. Faqat headless Service DNS barcha pod IP'larini qaytaradi."},{"l":"S","t":"open","tp":"gRPC","d":"api","id":30003,"n":"SN4","q":"gRPC servisda retry siyosatini qanday quramiz — xavfsiz va DDoS'ga aylanmaydigan?","m":["Faqat idempotent metodlarni retry qilish; mutatsiyalarda idempotency key yoki `SafeToRetry` belgisi","Retryable status kod ro'yxati: UNAVAILABLE, DEADLINE_EXCEEDED (ehtiyotkorlik bilan), RESOURCE_EXHAUSTED faqat backoff bilan. INVALID_ARGUMENT, NOT_FOUND, PERMISSION_DENIED — hech qachon","Exponential backoff + jitter; maxAttempts 3-4 dan oshmasin","Retry budget (mesh darajasida ~10-20% trafik) — cascading retry storm oldini oladi","Deadline umumiy: retry qolgan budjet ichida bo'lishi kerak, yangi deadline berilmaydi","Server tomonda `RESOURCE_EXHAUSTED` + backoff hint, va circuit breaker client'da"],"e":"Asosiy xato: har qatlamda 3 marta retry — 3 qatlam = 27x amplifikatsiya, sekin servis butunlay o'ladi. gRPC `retryPolicy` service config'da deklarativ beriladi, lekin budjet va idempotentlikni siz kafolatlaysiz."},{"l":"S","t":"mcq","tp":"gRPC","d":"api","id":30004,"n":"SN5","q":"Server-streaming RPC'da client sekin o'qiydi, server tez yozadi. Nima bo'ladi?","o":["Ma'lumot yo'qoladi","HTTP/2 flow control oynasi to'ladi va `Send` bloklanadi — backpressure client'gacha yetadi","Server panic qiladi","gRPC avtomatik diskka bufferlaydi"],"a":1,"e":"HTTP/2 per-stream va per-connection WINDOW_UPDATE mexanizmi bor, shu bilan backpressure tabiiy ishlaydi. Xavf: `Send` bloklangan goroutine context bekor bo'lishini tekshirmasa — goroutine leak. Shuning uchun stream ichida ham `ctx.Done()` kuzatiladi va yozish deadline'ga bog'lanadi."},{"l":"St","t":"mcq","tp":"gRPC","d":"api","id":30005,"n":"SN6","q":"REST'dan gRPC'ga ko'chishda tashqi (public) API uchun asosiy cheklov?","o":["gRPC sekinroq","Brauzer to'g'ridan-to'g'ri gRPC qila olmaydi (grpc-web + proxy kerak), o'tkazuvchi infra HTTP/2 trailer va binary payload'ni har doim qo'llamaydi","gRPC'da autentifikatsiya yo'q","gRPC faqat Go'da ishlaydi"],"a":1,"e":"Brauzer fetch API HTTP/2 trailer'larga kira olmaydi — shuning uchun grpc-web va Envoy translation kerak. Qo'shimcha: debugging qiyin (binary), corporate proxy/WAF'lar buzishi mumkin, CDN kesh qilmaydi. Amaliy yechim: ichkarida gRPC, tashqarida REST/JSON gateway (grpc-gateway yoki Connect protokoli)."},{"l":"St","t":"mcq","tp":"gRPC","d":"api","id":30440,"n":"SN441","q":"gRPC keepalive sozlamalari nega muhim?","o":["Faqat statistika uchun","Uzun yashovchi HTTP/2 ulanishlar NAT/LB tomonidan jim uzilishi mumkin — client `keepalive.ClientParameters` (Time/Timeout) bilan tirikligini tekshiradi; server tomonda `EnforcementPolicy` juda tez-tez pinglarni rad etadi (`ENHANCE_YOUR_CALM` bilan ulanish uziladi), shuning uchun ikki tomon sozlamalari mos bo'lishi shart","Keepalive kerak emas","Faqat streaming uchun"],"a":1,"e":"Klassik incident: client `Time: 10s` qo'yadi, server `MinTime: 5m` talab qiladi — server ulanishni uzadi, client qayta ulanadi, sikl davom etadi va latency sakraydi. To'g'ri: server `MinTime` client intervalidan kichik, `PermitWithoutStream` ehtiyotkorlik bilan, va `MaxConnectionAge` bilan ulanishlarni davriy qayta tarqatish (balansirovka uchun ham foydali)."},{"l":"S","t":"mcq","tp":"gRPC","d":"api","id":30441,"n":"SN442","q":"gRPC xato modeli: status kodlar va boy xato detallari qanday ishlatiladi?","o":["Faqat `Internal` qaytarish","Standart kodlar semantikaga mos tanlanadi (`InvalidArgument` vs `FailedPrecondition` vs `Aborted` — retry xatti-harakati shunga bog'liq), va `google.rpc.ErrorDetails` bilan mashinaga o'qiladigan kontekst (qaysi maydon xato, retry-after, kvota ma'lumoti) qo'shiladi","HTTP status kodlar ishlatiladi","Xato matnida JSON yuborish"],"a":1,"e":"Farqlar muhim: `FailedPrecondition` — holat to'g'rilanmaguncha retry befoyda; `Aborted` — konkurentlik konflikti, retry o'rinli; `Unavailable` — vaqtinchalik, backoff bilan retry. Bu kodlar mijoz kutubxonasining avtomatik retry siyosatini boshqaradi, shuning uchun noto'g'ri kod retry bo'roni yoki jim yo'qotish keltiradi."},{"l":"S","t":"mcq","tp":"gRPC","d":"api","id":30526,"n":"SN527","q":"gRPC'da katta fayl yoki katta ro'yxat qanday uzatiladi?","o":["Bitta katta xabarda","Streaming bilan bo'laklarga bo'lib (server/client streaming) — default maksimal xabar hajmi 4 MB va uni cheksiz oshirish xotira xavfi; ro'yxatlar uchun pagination (cursor) yoki server streaming, fayllar uchun esa ko'pincha obyekt saqlash + imzolangan URL to'g'riroq","Base64 qilib","Limitni 1 GB qilish"],"a":1,"e":"Xabar hajmi limitini oshirish (`MaxRecvMsgSize`) vaqtinchalik yechim: bitta so'rov butun heapni yeydi va p99 ni buzadi. Streaming bilan doimiy xotira sarfi bo'ladi; lekin stream davomida xato bo'lsa qisman natija muammosi paydo bo'ladi — shuning uchun chunk'lar idempotent va davom ettiriladigan bo'lishi kerak."},{"l":"M","t":"mcq","tp":"Realtime","d":"api","id":89,"n":90,"q":"Short polling, long polling, SSE va WebSocket — farqi?","o":["Hammasi bir xil","Short polling — client doim qayta so'raydi (oddiy, isrofgarchilik). Long polling — server ma'lumot paydo bo'lguncha javobni ushlab turadi. SSE — serverdan clientga bir tomonlama uzluksiz oqim (HTTP ustida, avtomatik qayta connection). WebSocket — ikki tomonlama doimiy connection","SSE ikki tomonlama","WebSocket HTTP emas va proxy'lardan o'tmaydi"],"a":1,"e":"Tanlov qoidasi: faqat serverdan yangilik kerakmi (narx, bildirishnoma, progress) — SSE yetarli va soddaroq; chat, o'yin, hamkorlikdagi tahrir kabi ikki tomonlama aloqa kerakmi — WebSocket. Long polling — eski client/proxy'lar uchun zaxira variant.","src":"https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events"},{"l":"S","t":"mcq","tp":"Realtime","d":"api","id":90,"n":91,"q":"SSE ning WebSocket'ga nisbatan amaliy afzalligi?","o":["Ikki tomonlama aloqa","Oddiy HTTP: mavjud autentifikatsiya, proxy va load balancer bilan muammosiz ishlaydi, avtomatik qayta connection va Last-Event-ID bilan uzilgan joydan davom etish qo'llab-quvvatlanadi","Ko'proq ma'lumot uzatadi","Brauzerda qo'llab-quvvatlanmaydi"],"a":1,"e":"Cheklovlari: faqat matn (UTF-8), HTTP/1.1 da domenga connection'lar soni cheklangan (HTTP/2 da bu muammo yo'q), ba'zi proxy'lar javobni buferlashi mumkin (nginx'da proxy_buffering off). Serverda har connection resurs — goroutine/thread modeli va connection'lar soni rejalashtirilishi kerak."},{"l":"S","t":"open","tp":"Realtime","d":"api","id":91,"n":92,"q":"WebSocket'li servisni masshtablashda qanday muammolar chiqadi?","m":["Connection stateful: LB sticky bo'lishi yoki connection qayerdaligini bilish kerak (presence/registry)","Bir foydalanuvchiga xabar yuborish uchun uning qaysi instance'ga ulanganini topish — odatda Redis Pub/Sub yoki mesh orqali fan-out","Deploy: har deployda hamma connection uziladi — client tomonda backoff bilan qayta connection va holatni tiklash shart","Resurs: har connection memory va fayl deskriptori; connection'lar soniga limit va gorizontal masshtab","Sog'liq: heartbeat/ping-pong bilan o'lik connection'larni tozalash; idle timeout'lar LB bilan muvofiq","Backpressure: sekin client uchun bufer cheklovi va uzish siyosati"],"e":"Senior signal: 'stateful connection stateless servis modelini buzadi' va deploy/qayta connection strategiyasini aytish. Ko'pincha soddaroq yechim — SSE yoki push notification."},{"l":"S","t":"mcq","tp":"Realtime","d":"api","id":18033,"n":"GR34","q":"WebSocket, SSE va long polling — Go'da qaysi biri qachon?","o":["SSE — faqat serverdan clientga oqim (oddiy, HTTP ustida, avtomatik qayta ulanish); WebSocket — ikki tomonlama (chat, o'yin); long polling — eski clientlar uchun zaxira; tanlov yo'nalish va infratuzilmaga (proxy, LB timeout) bog'liq","WebSocket har doim to'g'ri tanlov","SSE ikki tomonlama","Long polling WebSocket'dan tez"],"a":0,"e":"Go'da: SSE — oddiy handler + http.Flusher (yoki ResponseController), hech qanday kutubxona kerak emas; WebSocket — nhooyr/coder websocket yoki gorilla. Masshtablashda asosiy muammo — holat: ulanish bitta podda, shuning uchun Redis pub/sub yoki Centrifugo kabi broker orqali fan-out kerak. LB/proxy idle timeout'idan qisqa heartbeat (ping) yuborilishi shart."},{"l":"S","t":"mcq","tp":"Realtime","d":"api","id":30006,"n":"SN7","q":"WebSocket bilan 200k ulanishni bir necha podda ushlab turasiz. Foydalanuvchiga xabar yuborish kerak, lekin u qaysi podda ekani noma'lum. Eng to'g'ri arxitektura?","o":["Barcha podlarni ketma-ket so'rash","Pub/Sub (Redis/NATS/Kafka) fan-out: har pod o'zining ulanishlariga tegishli kanalga subscribe bo'ladi","Sticky session cookie yetarli","Har pod barcha foydalanuvchilar ulanishini saqlaydi"],"a":1,"e":"Standart pattern: ulanish holati podda (local), yo'naltirish pub/sub orqali. Redis pub/sub oddiy lekin at-most-once — pod ulanmagan payt xabar yo'qoladi; kafolat kerak bo'lsa Kafka/NATS JetStream + per-user offset. Presence uchun TTL'li Redis kalit (`presence:user:42 -> podID`, heartbeat bilan yangilanadi)."},{"l":"S","t":"mcq","tp":"Realtime","d":"api","id":30007,"n":"SN8","q":"WebSocket ulanish 60 sekunddan keyin jim uziladi, xato log yo'q. Eng ehtimolli sabab?","o":["TLS sertifikat muddati","Oradagi L7 proxy/LB yoki NAT idle timeout — ping/pong keepalive yo'q","Brauzer bug'i","Payload juda katta"],"a":1,"e":"nginx `proxy_read_timeout` default 60s, ALB idle timeout 60s, NAT/conntrack jadvali ham idle flow'ni tashlaydi. Yechim: server tomondan davriy `ping` (20-30s) va `pong` deadline; proxy timeout'ni ping intervalidan katta qilish. Bundan tashqari client'da exponential backoff + resume token bilan reconnect kerak."},{"l":"S","t":"mcq","tp":"Realtime","d":"api","id":30008,"n":"SN9","q":"Realtime kanalda <b>at-least-once</b> yetkazib berish kerak. Client reconnect qilganda xabarlar yo'qolmasligi uchun?","o":["Faqat qayta yuborish","Har xabarga monoton `seq`/offset berish; client oxirgi ko'rgan seq'ni reconnect'da yuborib, serverdan qolganini so'raydi","TCP o'zi kafolatlaydi","WebSocket'da yo'qolish bo'lmaydi"],"a":1,"e":"TCP faqat ulanish ichida tartib beradi — uzilish oralig'idagi xabarlar yo'q. Shuning uchun per-kanal cursor: server oxirgi N xabarni (yoki stream'ni) saqlaydi, client `Last-Event-ID`/seq bilan resume qiladi (SSE'da bu standart). Dublikat bo'lishi mumkin — client dedupe qiladi, ya'ni idempotent qo'llash."},{"l":"S","t":"mcq","tp":"Realtime","d":"api","id":30009,"n":"SN10","q":"Bir yo'nalishli server→client oqim uchun SSE va WebSocket qaysi holatda afzal?","o":["SSE har doim yomon","SSE: faqat server→client, HTTP/1.1+ oddiy, avtomatik reconnect va Last-Event-ID bor, proxy'lar bilan do'st; WebSocket: ikki yo'nalishli, binary, past latency","WebSocket faqat chatda ishlaydi","SSE binary uzatishga optimal"],"a":1,"e":"Notification/progress/feed uchun SSE arzon va operatsion jihatdan sodda (oddiy HTTP, LB muammosi kam, auth cookie/header ishlaydi). Cheklov: HTTP/1.1'da brauzer per-domen ulanish limiti (~6) va faqat text; HTTP/2 multiplexing bilan bu yengillashadi. Ikki yo'nalish yoki juda tez almashinuv kerak bo'lsa — WebSocket."},{"l":"St","t":"open","tp":"Realtime","d":"api","id":30010,"n":"SN11","q":"WebSocket gateway'ni deploy qilayotganda 200k ulanish bir zumda uzilib, hammasi qayta ulanadi (thundering herd). Qanday oldini olasiz?","m":["Graceful drain: pod `SIGTERM` olgach yangi ulanish qabul qilmaydi, mavjudlarini bosqichma-bosqich (masalan 1-2% / sekund) yopadi va client'ga 'reconnect after N' hint yuboradi","Client'da jitterli exponential backoff — barchasi bir vaqtda qaytmasin","preStop hook + `terminationGracePeriodSeconds` yetarlicha uzun (30-120s)","Rolling deploy: maxUnavailable kichik, surge cheklangan; kanareyka bilan avval 5% pod","Auth/handshake narxi katta bo'lsa — resume token bilan arzon reconnect yo'li","Reconnect paytdagi 'catch-up' o'qishni rate-limit va cache orqali berish, DB'ga to'g'ridan-to'g'ri urmaslik"],"e":"Reconnect bo'roni ko'pincha o'zi incident'ni keltiradi: handshake + auth + state yuklash bir vaqtda kelib DB va identity servisini o'ldiradi. Shuning uchun uzish ham, qaytish ham asta bo'lishi kerak."},{"l":"S","t":"mcq","tp":"Realtime","d":"api","id":30011,"n":"SN12","q":"WebSocket'da autentifikatsiya: qaysi yondashuv to'g'ri?","o":["Token'ni query string'da yuborish eng yaxshi","Handshake'da (header yoki qisqa muddatli ticket) tekshirish, ulanish davomida token muddati tugashini alohida kuzatib davriy re-auth qilish","Bir marta auth qilib umrbod ishonish","Har xabarda JWT tekshirish shart"],"a":1,"e":"Brauzer WebSocket API custom header bermaydi, shuning uchun qisqa TTL'li (10-60s) bir martalik ticket olinadi va `?ticket=` bilan ulanadi (query'dagi uzoq muddatli JWT log'larga tushadi — leak). Ulanish uzoq yashaydi: token/scope o'zgarsa yoki muddati tugasa — server ulanishni yopadi yoki re-auth frame talab qiladi, aks holda revoke ishlamaydi."},{"l":"St","t":"mcq","tp":"Realtime","d":"api","id":30442,"n":"SN443","q":"WebSocket gateway'da per-client backpressure qanday qilinadi?","o":["Hech narsa qilinmaydi","Har client uchun chegaralangan yozuv navbati: to'lsa — eski xabarlarni tashlash (fan-out telemetriya uchun), yoki snapshot bilan almashtirish (holat oqimida), yoki ulanishni uzish (slow consumer); yozuvda deadline (`SetWriteDeadline`) majburiy","Navbatni cheksiz qilish","Faqat TCP buferi yetarli"],"a":1,"e":"Cheksiz bufer — OOM va butun gateway yiqilishi. Siyosat ma'lumot turiga bog'liq: narx oqimida oxirgi qiymat muhim (conflate — eskisini yangisi bilan almashtirish), chatda esa yo'qotish mumkin emas (shuning uchun clientni uzib, u qayta ulanib kursordan davom etadi). Metrikalar: tashlangan xabarlar, navbat uzunligi taqsimoti, uzilgan sekin clientlar."},{"l":"S","t":"mcq","tp":"Realtime","d":"api","id":30507,"n":"SN508","q":"Real-time tizimda 'presence' (kim onlayn) nega qiyin?","o":["Oddiy masala","Ulanish uzilishini darhol bilib bo'lmaydi (TCP jim o'ladi) — heartbeat + TTL kerak; N foydalanuvchi × M kuzatuvchi fan-out portlashi; va tez-tez o'zgaruvchi holat (flapping) — shuning uchun debounce, faqat ko'rinadigan kontaktlarga yuborish va taxminiy holat qabul qilinadi","Faqat WebSocket bilan mumkin","DB'da flag yetarli"],"a":1,"e":"Amaliy dizayn: Redis'da `presence:<user>` kaliti TTL bilan (heartbeat har 20-30s yangilaydi), o'zgarishlar pub/sub orqali faqat kerakli kuzatuvchilarga, va 'last seen' taxminiy aniqlik bilan. Aniq real-time presence katta miqyosda juda qimmat — mahsulot talabini yumshatish (masalan '5 daqiqa ichida faol') to'g'ri muhandislik qarori."},{"l":"S","t":"mcq","tp":"Realtime","d":"api","id":30508,"n":"SN509","q":"WebSocket o'rniga long polling qachon hali ham to'g'ri tanlov?","o":["Hech qachon","Eski/cheklangan infratuzilma (WebSocket'ni o'tkazmaydigan proksi), juda kam va noregulyar yangilanishlar, yoki mavjud HTTP autentifikatsiya/kesh qatlamidan foydalanish kerak bo'lganda; shuningdek fallback sifatida","Har doim","Faqat mobil ilovada"],"a":1,"e":"Long polling narxi: har sikl yangi so'rov (header overhead, ulanish o'rnatish), server tomonda uzoq ochiq so'rovlar (goroutine va timeout boshqaruvi). Lekin operatsion jihatdan oddiy: oddiy HTTP monitoringi, LB va auth ishlaydi. Ko'p tizim SSE'ni o'rtacha yechim sifatida tanlaydi — bir yo'nalishli oqim uchun yetarli va sodda."},{"l":"St","t":"mcq","tp":"Realtime","d":"api","id":30509,"n":"SN510","q":"Real-time narx oqimida (masalan birja) sekin client uchun to'g'ri strategiya?","o":["Barcha yangilanishni navbatda saqlash","Conflation: oxirgi qiymat muhim — har instrument uchun navbatda faqat oxirgi yangilanish saqlanadi (eskisi almashtiriladi), va yuborish chastotasi cheklanadi (masalan 10 Hz); shunda sekin client eskirgan ma'lumot to'plamaydi","Clientni darhol uzish","Barchaga bir xil tezlikda yuborish"],"a":1,"e":"Bu naqsh moliyaviy va telemetriya oqimlarida standart: navbat o'rniga `map[instrument]lastValue` + davriy flush. Chat yoki buyurtma eventlarida esa conflation mumkin emas (har xabar muhim) — u yerda backpressure boshqacha hal qilinadi (uzish + kursordan tiklanish)."},{"l":"M","t":"mcq","tp":"Auth","d":"api","id":78,"n":79,"q":"OAuth2 authorization code flow qanday ishlaydi?","o":["Client foydalanuvchi parolini olib API'ga yuboradi","Foydalanuvchi provayderda (Google) autentifikatsiyadan o'tadi → client qisqa muddatli authorization code oladi → server o'sha code'ni o'z client_secret'i bilan token'ga almashtiradi. Brauzer/mobil ilova uchun PKCE qo'shiladi","Token URL'da ochiq uzatiladi","Faqat backend servislar uchun"],"a":1,"e":"Nima uchun code almashinuvi: token brauzer tarixida va log'da qolmasligi uchun. Public client (SPA, mobil) client_secret saqlay olmaydi — shuning uchun PKCE majburiy. Boshqa grant'lar: client_credentials (servis-servis), refresh_token. Implicit flow eskirgan va tavsiya etilmaydi.","src":"https://datatracker.ietf.org/doc/html/rfc6749"},{"l":"M","t":"mcq","tp":"Security","d":"api","id":79,"n":80,"q":"OWASP nuqtai nazaridan qaysi juftlik to'g'ri?","o":["SQL injection — faqat eski tizimlarda","Injection — parametrlangan query'lar bilan; Broken Access Control (IDOR) — har query'da obyekt egaligini tekshirish; XSS — chiqishda kontekstga mos qochirish va CSP; SSRF — chiquvchi query'larni allowlist bilan cheklash","XSS — bu server xatosi","CSRF JSON API'da doim bo'ladi"],"a":1,"e":"Eng ko'p uchraydigan real bug — Broken Access Control: /orders/123 ni boshqa foydalanuvchi ochishi. Uni framework o'zi hal qilmaydi — har query'da tenant/egalik tekshiruvi va test kerak. Qo'shimcha: sirlarni kodda saqlamaslik, bog'liqliklarni yangilash (SCA), xavfsiz default sozlamalar.","src":"https://owasp.org/www-project-top-ten/"},{"l":"M","t":"open","tp":"Auth","d":"api","id":1007,"n":"B8","q":"JWT: qayerda saqlaysiz va uni qanday bekor qilasiz (revoke)?","m":["Access token qisqa muddatli (5–15 daq), refresh token uzoq","Brauzerda: HttpOnly + Secure + SameSite cookie (XSS o'g'irlay olmaydi); localStorage XSSga ochiq","JWT stateless — o'z-o'zidan bekor qilib bo'lmaydi","Revoke: refresh tokenni DBda saqlash va o'chirish; rotation + reuse detection; kerak bo'lsa jti denylist (Redis, TTL = token muddati)","Cookie ishlatilsa CSRF himoyasi (SameSite, CSRF token)"],"e":"Middle signal: JWTning 'bekor qilib bo'lmaslik' kamchiligini bilish. Ko'p ilovalar uchun oddiy server session (Redis) JWTdan soddaroq va xavfsizroq."},{"l":"M","t":"mcq","tp":"Security","d":"api","id":1009,"n":"B10","q":"Frontend app.uz, API api.uz. Brauzer 'blocked by CORS policy' xatosi berdi. To'g'ri tushuncha?","o":["CORS — server xavfsizligi, query serverga yetib bormaydi","CORS — brauzer mexanizmi; server Access-Control-Allow-Origin: https://app.uz qaytarishi kerak; curl/Postmanda CORS yo'q","Frontendda mode:'no-cors' qo'yish yechim","Access-Control-Allow-Origin: * credentials bilan ham ishlaydi"],"a":1,"e":"CORS serverni himoya qilmaydi — brauzerdagi foydalanuvchini himoya qiladi. Oddiy bo'lmagan query'larda (PUT, JSON, custom header) avval OPTIONS preflight ketadi. Cookie/credentials bilan * ishlamaydi — aniq origin kerak. no-cors — javobni o'qib bo'lmaydigan opaque qiladi."},{"l":"J","t":"mcq","tp":"Auth","d":"api","id":13002,"n":"K3","q":"Authentication va authorization farqi?","o":["Bir xil narsaning ikki nomi","Authentication — 'siz kimsiz' (login, token tekshiruvi). Authorization — 'sizga nimaga ruxsat bor' (rol, egalik, siyosat). Token yaroqli bo'lishi bu amalga ruxsat degani EMAS","Authorization avval bajariladi","Authentication faqat parol bilan bo'ladi"],"a":1,"e":"Ikkisini aralashtirish — eng ko'p uchraydigan xavfsizlik bug'i (Broken Access Control). Modellar: RBAC (rol bo'yicha), ABAC (atributlar: tenant, egalik, vaqt), ACL (resurs bo'yicha ro'yxat). Amaliy qoida: authorization ma'lumotga eng yaqin joyda (query darajasida) ham tekshirilsin, faqat middleware'ga tayanmasin."},{"l":"M","t":"mcq","tp":"Auth","d":"api","id":13008,"n":"K9","q":"Server session va token (JWT) asosidagi autentifikatsiya farqi?","o":["Token har doim yaxshiroq","Session: holat serverda (Redis/DB), cookie'da faqat id — bekor qilish oson, lekin umumiy saqlash kerak. JWT: holat token ichida — masshtablash oson, lekin bekor qilish qiyin va token o'lchami katta","Session stateless","JWT shifrlangan bo'ladi"],"a":1,"e":"Amaliy tanlov: bitta mahsulot va brauzer mijozi bo'lsa — server session (Redis) soddaroq va xavfsizroq. Ko'p servis/mobil/uchinchi tomon uchun — qisqa muddatli JWT + refresh token rotatsiyasi. JWT payload shifrlanmagan — faqat imzolangan; maxfiy ma'lumot solmang."},{"l":"S","t":"mcq","tp":"Auth","d":"api","id":30012,"n":"SN13","q":"Access token 15 daqiqa yashaydi, foydalanuvchi bloklandi. Qanday qilib darhol kirishni to'xtatamiz?","o":["Kutamiz, 15 daqiqada o'zi tugaydi","Revocation qatlami: `jti`/session ID'ni deny-list (Redis, TTL=token qolgan muddati) yoki `token_version` claim — har request'da tekshiriladi","JWT secret'ni almashtiramiz","Refresh token'ni o'chirish yetarli"],"a":1,"e":"Stateless JWT'ning asosiy narxi — bekor qilish qiyinligi. Amaliy yechimlar: (1) qisqa TTL + refresh rotation, (2) `sid`/`jti` deny-list Redis'da faqat bekor qilinganlar uchun (kichik hajm), (3) user'da `token_version` — token'dagi versiya mos kelmasa rad etiladi. Secret rotation hammani logout qiladi — bu blunt instrument. Muhim resurslarda (pul o'tkazish) har doim serverda holat tekshiriladi."},{"l":"S","t":"mcq","tp":"Auth","d":"api","id":30013,"n":"SN14","q":"Refresh token rotation'da <b>reuse detection</b> nima qiladi?","o":["Token'ni uzaytiradi","Bir marta ishlatilgan refresh token qayta kelsa — o'g'irlangan deb hisoblab, butun token family/session'ni bekor qiladi","Har request'da yangi access beradi","Token hajmini kamaytiradi"],"a":1,"e":"Rotation: har refresh'da yangi refresh beriladi, eskisi ishlatilgan deb belgilanadi. Eski token qayta kelishi ikki holatni bildiradi — o'g'ri yoki tarmoq retry. Ikkinchisini yumshatish uchun kichik grace oyna (bir necha sekund, bir xil javobni qaytarish) qo'yiladi, aks holda barcha family bekor qilinib foydalanuvchi logout bo'ladi va xavfsizlik hodisasi log'lanadi."},{"l":"S","t":"mcq","tp":"Auth","d":"api","id":30014,"n":"SN15","q":"JWT'ni tekshirishda qaysi xato eng xavfli?","o":["`exp`ni tekshirmaslik","Token'ning o'z `alg` headeriga ishonish (`none` yoki RS256→HS256 confusion) va `iss`/`aud`ni tekshirmaslik","Token juda uzun bo'lishi","Payload'da user ID saqlash"],"a":1,"e":"Klassik hujum: RS256 uchun public key bilan HS256 imzolangan token yuborish — kutubxona `alg`ga ishonsa, public key HMAC siri bo'lib qoladi. To'g'ri: kutilayotgan algoritmni kodda qattiq belgilash, `kid`ni ishonchli JWKS bilan moslash, `iss`, `aud`, `exp`, `nbf` va kerakli `scope`ni tekshirish. `none` algoritmi har doim o'chirilgan bo'lsin."},{"l":"S","t":"mcq","tp":"Auth","d":"api","id":30015,"n":"SN16","q":"Servis-servis autentifikatsiyasi uchun senior tanlovi?","o":["Umumiy statik API key barcha servislarda","mTLS (SPIFFE/mesh identity) yoki qisqa muddatli imzolangan token — har servisga alohida identity va avtomatik rotation","IP allowlist yetarli","Basic auth ichki tarmoqda xavfsiz"],"a":1,"e":"Statik umumiy sir: rotation amalda qilinmaydi, kim nima qilganini bilib bo'lmaydi, leak bo'lsa hamma yoqda. mTLS har workload'ga sertifikat beradi (mesh avtomatik rotate qiladi), yoki OAuth2 client credentials bilan qisqa TTL token. Ustiga authorization: har chaqiruvga ruxsat berilgan metod ro'yxati (least privilege), ichki tarmoq 'ishonchli' deb hisoblanmaydi (zero trust)."},{"l":"S","t":"mcq","tp":"Security","d":"api","id":30016,"n":"SN17","q":"Ko'p tenant'li API'da eng ko'p uchraydigan jiddiy zaiflik (OWASP API #1) va uning tizimli yechimi?","o":["Rate limit yo'qligi — nginx qo'yish","BOLA/IDOR: obyekt egaligini tekshirmaslik. Yechim — har query'ga tenant/owner filtri (repository qatlamida majburiy), ID'ni URL'dan emas, sessiyadan olish","XSS — output escaping","SQL injection — ORM ishlatish"],"a":1,"e":"`GET /orders/1042` — token to'g'ri, lekin order boshqa tenantga tegishli. Bitta joyda tekshirish yetmaydi, chunki yangi endpoint yozilganda esdan chiqadi. Tizimli yo'l: `WHERE tenant_id = $current` ni repository/DAO darajasida yoki PostgreSQL RLS bilan majburiy qilish, tashqi ID'larni taxmin qilinmas (UUID/ULID) qilish, va avtotest: A tenant token bilan B resursiga so'rov 404 qaytarishi kerak."},{"l":"St","t":"open","tp":"Security","d":"api","id":30017,"n":"SN18","q":"Public API'da API key'lar leak bo'lgani ma'lum bo'ldi (GitHub'da topildi). Qanday harakat qilasiz?","m":["Darhol: leak bo'lgan kalitlarni revoke qilish, ta'sir doirasini aniqlash — audit log bo'yicha kalit bilan qilingan so'rovlar, IP va hajm anomaliyasi","Mijozlarga yangi kalit chiqarish yo'li (dual-key: eski va yangi bir vaqtda ishlaydi, so'ng eski o'chiriladi) — downtime'siz rotation","Kalit formatiga prefiks qo'shish (`sk_live_...`) — GitHub secret scanning va o'z scanner'imiz avtomatik topadi","Kalit hash'da saqlanadi (plaintext emas), scope va IP cheklovi, per-key rate limit","Log va error'larda kalit maskalash; kalitni query string'da emas, headerda qabul qilish","Postmortem: nega leak bo'ldi (CI log, commit), pre-commit hook + CI secret scan, va kalit o'rniga OAuth/mTLS'ga o'tish rejasi"],"e":"Bu incident + dizayn savoli birga. Intervyuda kutiladigan tartib: containment (revoke) → impact assessment (audit) → mijozga ta'sir (rotation yo'li) → sistemali profilaktika. Faqat 'kalitni o'chiraman' javobi senior darajaga yetmaydi."},{"l":"S","t":"mcq","tp":"Security","d":"api","id":30018,"n":"SN19","q":"OAuth2'da SPA (brauzer) uchun to'g'ri flow va token saqlash joyi?","o":["Implicit flow, token localStorage'da","Authorization Code + PKCE; token'ni memory'da ushlash, refresh'ni HttpOnly+Secure+SameSite cookie yoki BFF orqali","Resource Owner Password Credentials","Client secret'ni JS bundle'ga qo'yish"],"a":1,"e":"Implicit flow eskirgan (token URL fragment'da leak bo'ladi), ROPC ham tavsiya etilmaydi. PKCE authorization code'ni ushlab olishdan himoya qiladi (public client secret saqlay olmaydi). localStorage XSS'da to'liq o'qiladi; eng mustahkam yo'l — BFF pattern: token serverda, brauzerda faqat HttpOnly session cookie + CSRF himoyasi."},{"l":"S","t":"mcq","tp":"Auth","d":"api","id":30019,"n":"SN20","q":"RBAC yetmay qoldi: 'menejer faqat o'z filialining buyurtmalarini ko'radi'. Qanday model?","o":["Yana bir nechta rol qo'shish","ABAC/ReBAC: qaror atributlar (tenant, filial, resurs egasi) yoki munosabatlar grafi bo'yicha; policy markazlashtiriladi (OPA/Cedar/Zanzibar uslubi) va ma'lumot qatlamida filtr sifatida ham qo'llanadi","Har endpoint'da qo'lda if yozish","Faqat frontendda yashirish"],"a":1,"e":"Rol portlashi (role explosion) — RBAC'ning klassik cheklovi. ABAC/ReBAC'da ruxsat resurs atributiga bog'lanadi. Muhim amaliy nuqta: ro'yxat endpoint'larida ruxsatni 'tekshirish' emas, 'filtrlash' kerak (aks holda pagination va count buziladi) — shuning uchun policy'dan ma'lumot filtri (masalan ruxsat berilgan branch ID'lari) chiqarilishi kerak."},{"l":"S","t":"mcq","tp":"Auth","d":"api","id":30459,"n":"SN460","q":"JWKS bilan kalit rotatsiyasi qanday to'g'ri qilinadi?","o":["Kalitni almashtirib darhol eskisini o'chirish","Yangi kalit JWKS'ga qo'shiladi (ikki kalit birga) → yangi tokenlar yangi `kid` bilan imzolanadi → eski tokenlar muddati tugagach eski kalit olib tashlanadi; resurs server JWKS'ni keshlaydi va noma'lum `kid` kelsa cheklangan chastotada qayta yuklaydi","Har so'rovda JWKS yuklash","Kalitni koddan o'qish"],"a":1,"e":"Ikki tuzoq: (1) eski kalitni erta o'chirish — muddati tugamagan tokenlar yaroqsiz bo'ladi va foydalanuvchilar chiqib ketadi; (2) JWKS'ni har noma'lum `kid` da qayta yuklash — hujumchi tasodifiy `kid` bilan so'rov yuborib identity provayderni DDoS qilishi mumkin (shuning uchun rate limit va negative cache)."},{"l":"S","t":"mcq","tp":"Auth","d":"api","id":30460,"n":"SN461","q":"OAuth2 grant turlari: qaysi holatda qaysi biri?","o":["Har doim password grant","Authorization Code + PKCE — foydalanuvchi ishtirokidagi ilovalar (web, mobil, SPA); Client Credentials — servis-servis (foydalanuvchi yo'q); Device Code — klaviaturasiz qurilma (TV, CLI); Refresh Token — sessiyani uzaytirish. Password (ROPC) va Implicit eskirgan","Client credentials foydalanuvchi uchun","Device code xavfsiz emas"],"a":1,"e":"Backend nuqtai nazaridan muhim farq: client credentials'da token subyekti — servis (`sub` = client_id), shuning uchun foydalanuvchi huquqlari tekshirilmaydi; foydalanuvchi nomidan ish qilish kerak bo'lsa token exchange yoki on-behalf-of naqshi ishlatiladi. Aks holda 'confused deputy' — servis o'z keng huquqlari bilan foydalanuvchi so'ragan ishni tekshirmay bajaradi."},{"l":"St","t":"mcq","tp":"Security","d":"api","id":30461,"n":"SN462","q":"Ko'p tenant'li tizimda 'confused deputy' muammosi qanday oldini olinadi?","o":["Servisga to'liq huquq berish","So'rovni boshlagan sub'ekt kontekstini oxirigacha olib borish (token exchange / on-behalf-of yoki imzolangan so'rov konteksti) va har qatlamda ruxsatni shu sub'ekt bo'yicha tekshirish — ichki servis o'z admin huquqi bilan tekshiruvsiz ish bajarmasligi kerak","Faqat gateway'da tekshirish","IP bo'yicha ajratish"],"a":1,"e":"Tipik zaiflik: gateway foydalanuvchini tekshiradi, ichkarida esa servislar bir-biriga 'ishonadi' va faqat `user_id` parametrini oladi — bitta ichki endpoint ochilib qolsa istalgan foydalanuvchi ma'lumotini olish mumkin. To'g'ri yondashuv: ichki chaqiruvlarda ham subyekt tokeni (yoki imzolangan kontekst) va tenant tekshiruvi — zero trust."},{"l":"M","t":"mcq","tp":"Resilience","d":"api","id":1008,"n":"B9","q":"Token bucket rate limiting qanday ishlaydi?","o":["Har query bucketga token qo'shadi, bucket to'lsa bloklanadi","Bucketga doimiy tezlikda token tushadi (masalan 10/s, max 100); har query bitta token oladi; token yo'q bo'lsa 429","Har daqiqa boshida hisoblagich 0 ga tushadi","Query'lar queue'da turadi va doimiy tezlikda chiqadi"],"a":1,"e":"Token bucket burst'ga ruxsat beradi (capacity gacha), o'rtacha tezlikni cheklaydi. Fixed window — oyna chegarasida 2x burst muammosi. Leaky bucket — chiqishni tekislaydi (4-variant). Javobda 429 + Retry-After header."},{"l":"M","t":"code","tp":"Resilience","d":"api","id":1010,"n":"B11","q":"Bu kodning muammosi nima?","c":"for attempt in range(5):\n    try:\n        return payments.charge(user_id, amount)   # POST\n    except Timeout:\n        continue","o":["Hech qanday muammo yo'q","Timeout — to'lov o'tmadi degani emas; idempotency key'siz retry ikki marta yechishi mumkin; backoff ham yo'q","5 marta kam, 10 kerak","except juda keng"],"a":1,"e":"Timeout = natija noma'lum. Idempotent bo'lmagan operatsiyani retry qilishdan oldin Idempotency-Key yuborish kerak. Yana: darhol retry — tushib qolgan servisni bosadi; exponential backoff + jitter va umumiy deadline kerak."},{"l":"S","t":"mcq","tp":"Resilience","d":"api","id":1012,"n":"B13","q":"Circuit breaker'ning 'half-open' holati nima uchun?","o":["Faqat yarim query'larni o'tkazadi doim","Open holatdan keyin timeout o'tgach bir nechta sinov query'ini o'tkazadi: success'li bo'lsa closed, bo'lmasa yana open","Servis yarim quvvatda ishlayotganini bildiradi","Loglashni yarimga kamaytiradi"],"a":1,"e":"Closed — normal; xatolar chegarasidan oshsa Open — query'lar darhol fail (fallback), bog'liq servisga dam beradi. Half-open — tiklanganini tekshirish. Maqsad: cascading failure va thread/connection pool tugashining oldini olish."},{"l":"S","t":"mcq","tp":"Resilience","d":"api","id":1015,"n":"B16","q":"Retry'da nega exponential backoff'ga <b>jitter</b> qo'shiladi?","o":["Kodni murakkablashtirish uchun","Barcha clientlar bir vaqtda xato olib, bir xil vaqtda qayta urinmasligi uchun — sinxron to'lqinlarni sochib yuboradi","Retry sonini kamaytirish uchun","Latency'ni kamaytirish uchun"],"a":1,"e":"Jitter'siz 1000 client 1s, 2s, 4s da birga uradi — tiklanayotgan servisni qayta yiqitadi. Full jitter: sleep = random(0, base*2^n). Retry budget (masalan query'larning 10%idan ko'p emas) retry storm'ning oldini oladi."},{"l":"St","t":"open","tp":"Resilience","d":"api","id":1020,"n":"B21","q":"Ko'p instance'li API uchun distributed rate limiter loyihalang.","m":["Key: user/API key/IP + endpoint; limitlar tariflarga bog'liq","Redis: sliding window (sorted set) yoki token bucket — Lua skript bilan atomik","Har query'ga Redis round-trip narxi; lokal token + davriy sinxron (aniqlik vs latency)","Redis yiqilsa: fail-open (mavjudlik) yoki fail-closed (security) — ongli tanlov","Qatlamlar: edge/gateway (qo'pol), servis (aniq); javob 429 + RateLimit header'lar"],"e":"Staff level'da kutiladi: aniqlik va latency trade-off, failure rejimi, multi-region (global vs regional limit)."},{"l":"St","t":"mcq","tp":"Resilience","d":"api","id":1021,"n":"B22","q":"Backpressure nima?","o":["Serverni tezlashtirish texnikasi","Tizim yuk ko'tara olmayotganini yuqoriga signal qilish mexanizmi — cheklangan queue, query'ni rad etish (429/503), consumer tezligiga moslash","Cache strategiyasi","DB replikatsiya turi"],"a":1,"e":"Cheksiz queue — backpressure yo'qligi: memory tugaydi, latency cheksiz o'sadi. Yaxshisi — tez va aniq rad etish (load shedding) va bounded queue. Reactive streams, TCP flow control — misollar."},{"l":"S","t":"mcq","tp":"Resilience","d":"api","id":14030,"n":"SR31","q":"Go'da client tomonda rate limiting uchun standart yechim?","o":["time.Sleep bilan kutish","golang.org/x/time/rate — token bucket: limiter.Wait(ctx) yoki Allow(); burst va tezlikni alohida sozlash mumkin, context bilan bekor qilinadi","Har so'rovdan keyin 1 soniya kutish","Faqat server tomonda cheklanadi"],"a":1,"e":"Tashqi API limitiga rioya qilish uchun ayni muddao. Server tomonda esa taqsimlangan limiter kerak (Redis). Diqqat: Wait(ctx) navbatga qo'yadi — deadline bo'lmasa goroutine'lar yig'ilib qoladi; shuning uchun context deadline bilan ishlating.","src":"https://pkg.go.dev/golang.org/x/time/rate"},{"l":"S","t":"mcq","tp":"Resilience","d":"api","id":30020,"n":"SN21","q":"Circuit breaker qo'ydingiz, lekin baribir cascading failure bo'ldi. Nega?","o":["Breaker keraksiz","Breaker per-instance/per-endpoint emas, yoki threshold sekin javoblarni (latency) hisobga olmaydi; bulkhead va timeout yo'q — thread/goroutine pool to'lib boshqa yo'nalishlar ham o'ladi","Breaker faqat HTTP 500 bilan ishlaydi","Retry breaker bilan mos kelmaydi"],"a":1,"e":"Tizim ko'pincha 'error' emas, 'sekin' bo'lib o'ladi: timeout uzun bo'lsa so'rovlar yig'ilib resursni yeydi. Kerak: agressiv timeout (p99 asosida), concurrency cheklovi/bulkhead (bir dependency uchun ajratilgan budjet), latency asosidagi breaker, load shedding va degradatsiya yo'li (kesh yoki qisqartirilgan javob). Breaker yolg'iz yetmaydi."},{"l":"S","t":"mcq","tp":"Resilience","d":"api","id":30021,"n":"SN22","q":"Yuk ostida servis butunlay yiqilmasligi uchun <b>load shedding</b> qanday qilinadi?","o":["Barcha so'rovni navbatga qo'yish","Navbat uzunligi/kutish vaqti chegaradan oshsa, so'rovni tez 503 + Retry-After bilan rad etish; prioritet bo'yicha (kritik yo'nalish oxirida tashlanadi)","Replikani ko'paytirish yetarli","Timeout'ni uzaytirish"],"a":1,"e":"Cheksiz navbat = latency portlashi va bufferbloat: barcha so'rov deadline'dan oshib ketadi, ish bekorga ketadi (`queueing collapse`). To'g'ri: kichik, chegarali navbat + CoDel uslubidagi kutish vaqti bo'yicha tashlash, prioritetlash (health/checkout > analytics), va client'ga aniq backoff signal. Tashlangan so'rov arzon, o'lgan servis qimmat."},{"l":"S","t":"mcq","tp":"Resilience","d":"api","id":30022,"n":"SN23","q":"Downstream servis 30% xatolik beradi. Client'da qaysi kombinatsiya to'g'ri?","o":["Cheksiz retry","Retry budget (masalan trafikning 10%) + jitterli backoff + breaker + idempotency key","Har xatoda darhol 5 marta retry","Retry'ni butunlay o'chirish"],"a":1,"e":"30% xatolikda ko'r-ko'rona retry yukni ~1.4x oshiradi va servis tiklanishiga yo'l bermaydi. Retry budget global cheklov beradi, jitter sinxron bo'ronni yo'qotadi, breaker umidsiz holatda tezda tushadi, idempotency key esa mutatsiyalarda dublikat effektni oldini oladi."},{"l":"St","t":"open","tp":"Resilience","d":"api","id":30023,"n":"SN24","q":"Timeout budjetini butun zanjir uchun qanday taqsimlaysiz? (client → gateway → A → B → DB)","m":["Boshi: foydalanuvchi SLO'si, masalan 1s p99. Gateway shu budjetni oladi va deadline sifatida propagate qiladi","Har hop qolgan budjetdan kichik ulush oladi; retry ham shu budjet ichida (2 urinish = har biri ~budjet/2 dan kam)","Har chaqiruvdan oldin: qolgan vaqt minimal ishga yetmasa — darhol rad etish (`deadline exceeded` oldindan), bekorga ish qilmaslik","DB uchun `statement_timeout`/query timeout budjetdan kichik; lock kutish alohida cheklanadi","Cancellation propagatsiyasi: context bekor bo'lganda pastdagi barcha ish to'xtaydi (Go'da `ctx` har qatlamda)","Backgroundga surish: budjetga sig'maydigan ish (email, hisobot) async queue'ga chiqariladi","Monitoring: budjet oshib ketish nisbati va qaysi hop yedi — tracing bo'yicha"],"e":"Senior'dan kutilayotgani: timeout mustaqil konstantalar to'plami emas, taqsimlanadigan budjet. Aks holda 'har joyda 5s' → foydalanuvchi 20s kutadi yoki client ketgach server ishlashda davom etadi."},{"l":"S","t":"mcq","tp":"Resilience","d":"api","id":30024,"n":"SN25","q":"Idempotency key qanday to'g'ri implement qilinadi (to'lov API'si)?","o":["Key'ni logga yozib qo'yish","Key + request fingerprint DB'da unique constraint; birinchi so'rov natijasi saqlanadi, takror so'rovga aynan shu natija qaytariladi, boshqa payload bilan kelsa 409","Faqat keshda 5 daqiqa ushlash","Client har retry'da yangi key yuborishi kerak"],"a":1,"e":"Muhim detallar: (1) yozuv atomik bo'lishi kerak — `INSERT ... ON CONFLICT DO NOTHING` bilan 'birinchi kim keldi' aniqlanadi, aks holda parallel retry ikki to'lov qiladi; (2) javob saqlanadi (status va body), shuning uchun takror so'rov yangi effekt bermaydi; (3) TTL biznes talabiga qarab (24h+); (4) bir xil key boshqa payload bilan — mijoz xatosi, 409/422."},{"l":"S","t":"mcq","tp":"Resilience","d":"api","id":30524,"n":"SN525","q":"Graceful degradation amalda qanday loyihalanadi?","o":["Xato sahifasini chiroyli qilish","Har dependency uchun oldindan belgilangan zaxira xatti-harakat: tavsiyalar servisi yiqilsa — statik ro'yxat, reyting yo'q bo'lsa — maydon ko'rsatilmaydi, kesh eskirgan bo'lsa — stale ma'lumot 'yangilanmoqda' belgisi bilan; kritik yo'l (checkout) esa hech qachon ixtiyoriy dependency'ga bog'lanmaydi","Barcha xatoni yashirish","Faqat retry"],"a":1,"e":"Amaliy qadam: dependency'larni 'kritik' va 'ixtiyoriy' deb tasniflash va buni kodda ifodalash (ixtiyoriy chaqiruv qisqa timeout + xatoni yutish + metrika). Test: chaos mashqida har ixtiyoriy dependency'ni o'chirib, asosiy oqim ishlashini tekshirish — aks holda 'ixtiyoriy' faqat qog'ozda qoladi."},{"l":"St","t":"mcq","tp":"Resilience","d":"api","id":30525,"n":"SN526","q":"Bulkhead (to'siq) naqshi qanday amalga oshiriladi?","o":["Alohida server sotib olish","Resurslarni ajratish: har downstream dependency uchun alohida konkurentlik limiti/pool (semaphore), kritik va kritik bo'lmagan trafik uchun alohida worker pool yoki instansiya guruhi — bitta sekin dependency butun servisni yeb qo'ymaydi","Faqat timeout","Faqat breaker"],"a":1,"e":"Klassik ssenariy: hisobot endpointi sekin DB query bilan barcha goroutine va DB poolni band qiladi — checkout ham o'ladi. Bulkhead bilan hisobotga masalan pool'ning 20% ajratiladi. Kubernetes darajasida ham qo'llanadi: og'ir endpointlarni alohida Deployment'ga ajratish (bir xil kod, boshqa resurs va HPA)."},{"l":"M","t":"mcq","tp":"API gotcha","d":"api","id":16027,"n":"E28","q":"Client timeout bilan uzildi, lekin server buyurtmani yaratib bo'lgan edi. Client retry qiladi. Nima kerak?","o":["Idempotency-Key: client generatsiya qilgan kalit, server natijani kalit bo'yicha saqlaydi va takrorda o'shani qaytaradi","POST'ni GET'ga almashtirish","Retry'ni butunlay o'chirish","Faqat timeout'ni oshirish"],"a":0,"e":"Tarmoq xatosi 'bajarilmadi' degani emas — javob yo'qolgan bo'lishi mumkin. Idempotency kaliti unique constraint bilan saqlanadi: birinchi so'rov natijani yozadi, takrorlanganida o'sha javob qaytariladi (Stripe modeli). Kalit request body hash'i bilan bog'lanadi — bir xil kalit boshqa body bilan kelsa 422 qaytariladi. TTL odatda 24 soat."},{"l":"S","t":"mcq","tp":"API gotcha","d":"api","id":16028,"n":"E29","q":"Retry qilish xavfsiz bo'lgan HTTP holatlar qaysi?","o":["408, 429, 502, 503, 504 va tarmoq xatolari (idempotent so'rovda); 400/401/403/404/409 — retry foydasiz","Har qanday 5xx, shu jumladan 501","Faqat 500","Hammasini retry qilish mumkin"],"a":0,"e":"5xx ichida 501 Not Implemented va 505 doimiy xato — retry mantiqsiz. 429 va 503 Retry-After header'ini berishi mumkin — unga bo'ysuning. Har doim exponential backoff + full jitter, retry budjeti (masalan so'rovlarning 10%) va circuit breaker bilan birga; aks holda retry storm downstream'ni o'ldiradi.","src":"https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/"},{"l":"M","t":"mcq","tp":"API gotcha","d":"api","id":16029,"n":"E30","q":"gRPC'da deadline berilmasa nima bo'ladi?","o":["So'rov cheksiz kutadi — server resursi va goroutine to'planadi; har chaqiruvda context.WithTimeout majburiy","Default 30s qo'llaniladi","Kanal avtomatik yopiladi","Client darhol xato qaytaradi"],"a":0,"e":"gRPC default deadline yo'q. Deadline metadata sifatida zanjir bo'ylab uzatiladi — A 500ms bersa, B ham qolgan vaqtni oladi va kech javobni hisoblamaydi. Server tomonda ctx.Err() == context.DeadlineExceeded bo'lsa ishni to'xtatish kerak (DB query'ga ham shu ctx uzatiladi). Qoida: deadline chaqiruvchida o'rnatiladi, ichkarida faqat qisqartiriladi."},{"l":"S","t":"code","tp":"API gotcha","d":"api","id":16030,"n":"E31","q":"Bu handler'da qanday muammo bor?","c":"func h(w http.ResponseWriter, r *http.Request) {\n    if err := do(r); err != nil {\n        w.Write([]byte(\"error\"))\n        w.WriteHeader(500)\n        return\n    }\n}","o":["WriteHeader Write'dan KEYIN chaqirilgan — birinchi Write allaqachon 200 yuboradi, 500 e'tiborsiz qoladi ('superfluous WriteHeader call' log'i)","500 o'rniga 400 kerak","Content-Type yetishmayapti, qolgani to'g'ri","Hech qanday muammo yo'q"],"a":0,"e":"net/http birinchi Write chaqirilganda header'larni flush qiladi. To'g'ri tartib: header'larni o'rnatish, WriteHeader(code), keyin Write. Shuningdek: status yozilgandan keyin xato yuz bersa kodni o'zgartirib bo'lmaydi — shuning uchun javobni oldin buferlab, keyin yozish naqshi (yoki handler'dan error qaytarib, markazda yozish) ishlatiladi."},{"l":"P","t":"open","tp":"API gotcha","d":"api","id":16031,"n":"E32","q":"Public API'da yangi majburiy maydon qo'shish kerak. Eski clientlarni buzmasdan qanday chiqarasan?","m":"1) Maydonni avval IXTIYORIY qilib qo'shish, server default bilan to'ldiradi. 2) Telemetriya: nechta so'rov maydonsiz kelayapti, qaysi client versiyasi/API kaliti — metrika va log. 3) Deprecation e'loni: changelog, Deprecation/Sunset header'lari (RFC 8594), email. 4) Migratsiya davri (odatda 3-6 oy), integratorlarga yordam. 5) Trafik nolga yaqinlashgach majburiy qilish, yoki yangi versiyada (/v2 yoki media type versioning) majburiy, eskisi default bilan qolaveradi. Hech qachon: jimgina majburiy qilish, yoki bir kechada 400 qaytarishni yoqish.","e":"Backward compatibility qoidalari: maydon qo'shish — mos (client noma'lumni e'tiborsiz qoldirsa); maydon o'chirish/nomini o'zgartirish/tipini o'zgartirish/majburiy qilish/enum qiymat qo'shish (client strict bo'lsa) — mos emas. Protobuf'da ham xuddi shu: field raqamini qayta ishlatmang, `reserved` qiling."},{"l":"S","t":"mcq","tp":"API gotcha","d":"api","id":30158,"n":"SN159","q":
