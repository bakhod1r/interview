da. 8) Sirlar kodda emas — Vault/Secrets Manager.","e":"Asosiy g'oya: kichik, mustaqil state'lar va hamma o'zgarish PR orqali. Monolit state — har apply butun infratuzilmani xavf ostiga qo'yadi."},{"l":"J","t":"mcq","tp":"Linux","d":"infra","id":30541,"n":"DO7","q":"Serverda disk to'lib qoldi. Birinchi qaysi buyruqlar?","o":["reboot","`df -h` (qaysi fayl tizimi to'la), `du -sh /* | sort -h` (qaysi katalog), `df -i` (inode tugagan bo'lishi mumkin)","`rm -rf /var`","`top`"],"a":1,"e":"Klassik tuzoq: log fayl o'chirilgan, lekin jarayon uni hali ochiq ushlab turibdi — joy bo'shamaydi. `lsof +L1` bilan topiladi; jarayonni qayta ishga tushirish yoki `> file` bilan truncate qilish kerak. Oldini olish: logrotate, alert 80%da."},{"l":"M","t":"mcq","tp":"Linux","d":"infra","id":30542,"n":"DO8","q":"Load average 16, CPU foydalanish esa 10%. Nima bo'lishi mumkin?","o":["Hisoblagich xato","Load average D-holatdagi (uninterruptible, odatda I/O kutayotgan) jarayonlarni ham hisoblaydi — disk yoki NFS sekin; `iostat -x`, `vmstat` (wa ustuni), `ps -eo state` bilan tekshiriladi","CPU yetishmayapti","Xotira ko'p"],"a":1,"e":"Linux'da load = running + runnable + D-state. Yuqori iowait, to'yingan disk (%util ~100) yoki osilib qolgan tarmoq fayl tizimi odatiy sabablar. Load'ni yadrolar soni bilan solishtiring (`nproc`)."},{"l":"M","t":"mcq","tp":"Linux","d":"infra","id":30543,"n":"DO9","q":"Servis `kill -9` o'rniga `kill -15` (SIGTERM) bilan to'xtatilishi nega muhim?","o":["Farqi yo'q","SIGTERM jarayonga graceful shutdown imkonini beradi (so'rovlarni tugatish, ulanishlarni yopish, bufferni yozish); SIGKILL ushlab bo'lmaydi — jarayon darhol o'ladi","SIGKILL xavfsizroq","SIGTERM faqat root uchun"],"a":1,"e":"Kubernetes ham avval SIGTERM yuboradi, terminationGracePeriodSeconds (default 30s)dan keyin SIGKILL. Konteynerda PID 1 muammosi: shell-form ENTRYPOINT signalni ilovaga uzatmaydi — exec-form yoki tini ishlating."},{"l":"S","t":"open","tp":"Linux","d":"infra","id":30544,"n":"DO10","q":"Production serverda ilova sekinlashdi. Linux darajasida qanday tekshirasan?","m":"USE metodi (Utilization, Saturation, Errors) har resurs uchun: 1) `uptime` — load trend. 2) `dmesg -T | tail` — OOM killer, disk xatolari. 3) `vmstat 1` — r (run queue), wa, swap si/so. 4) `mpstat -P ALL 1` — bitta yadro 100%mi. 5) `pidstat 1` — qaysi jarayon. 6) `iostat -xz 1` — disk latency va %util. 7) `free -m` — page cache, swap. 8) `sar -n DEV 1`, `ss -s` — tarmoq, TIME_WAIT, ulanishlar soni. 9) `top`/`htop`. Keyin chuqurroq: perf, strace (ehtiyot — sekinlashtiradi), eBPF vositalar.","e":"Brendan Gregg'ning '60 soniyada Linux tahlili' ro'yxati — intervyuda tizimli yondashuvni ko'rsatish muhim, tasodifiy buyruqlarni emas.","src":"https://www.brendangregg.com/usemethod.html"},{"l":"M","t":"mcq","tp":"Linux","d":"infra","id":30545,"n":"DO11","q":"systemd servisi crash bo'lsa avtomatik qayta ishga tushishi uchun?","o":["cron har daqiqada tekshiradi","Unit faylda `Restart=on-failure` (va `RestartSec=`); loglar `journalctl -u servis -f` bilan","nohup bilan ishga tushirish","/etc/rc.local"],"a":1,"e":"`StartLimitIntervalSec`/`StartLimitBurst` cheksiz restart tsiklini to'xtatadi. Resurs cheklovlari ham unit'da: MemoryMax, CPUQuota (cgroups). Xavfsizlik: User=, NoNewPrivileges=yes, ProtectSystem=strict."},{"l":"J","t":"mcq","tp":"Git","d":"infra","id":30546,"n":"DO12","q":"`git merge` va `git rebase` farqi?","o":["Bir xil","merge — ikki tarixni merge commit bilan birlashtiradi (tarix saqlanadi); rebase — commitlarni boshqa bazaga qayta yozadi (chiziqli tarix, lekin hash'lar o'zgaradi)","rebase faylarni o'chiradi","merge faqat main uchun"],"a":1,"e":"Oltin qoida: umumiy (push qilingan, boshqalar ishlatayotgan) branchni rebase qilmang — boshqalar tarixi buziladi. O'z feature branchingizni main ustiga rebase qilish odatiy. Majburiy push kerak bo'lsa `--force-with-lease` (boshqaning commitini ustidan yozib yubormaydi)."},{"l":"M","t":"mcq","tp":"Git","d":"infra","id":30547,"n":"DO13","q":"Tasodifan secret (API kalit) commit qilinib, push bo'ldi. To'g'ri harakat?","o":["Keyingi commitda o'chirish yetarli","Avvalo kalitni darhol bekor qilish (rotate) — u allaqachon oshkor; keyin tarixdan tozalash (git filter-repo/BFG) ixtiyoriy","Repo'ni private qilish","git revert"],"a":1,"e":"Tarix tozalansa ham fork, klon, CI keshi, GitHub cache'da qolishi mumkin — shuning uchun rotatsiya birinchi. Oldini olish: pre-commit gitleaks/trufflehog, GitHub push protection, sirlarni .env + .gitignore emas, secret manager'da saqlash."},{"l":"M","t":"code","tp":"Git","d":"infra","id":30548,"n":"DO14","q":"Qaysi commit bug keltirganini 500 ta commit ichidan tez topish?","c":"git bisect start\ngit bisect bad HEAD\ngit bisect good v1.4.0\n# har qadamda test qilib: git bisect good | bad\n# yoki avtomatik:\ngit bisect run ./test.sh","o":["Bu ikkilik qidiruv — ~9 qadamda (log2 500) aybdor commit topiladi; `bisect run` skript exit code bo'yicha avtomatlashtiradi","Bu barcha commitlarni ketma-ket tekshiradi","Bu faqat merge commitlarni ko'radi","Bu commitlarni o'chiradi"],"a":0,"e":"Skript exit 0 = good, 1–127 = bad, 125 = skip (build bo'lmaydigan commit). Tugagach `git bisect reset`. Kichik, atomar commitlar bisect'ni foydali qiladi."},{"l":"S","t":"mcq","tp":"Git","d":"infra","id":30549,"n":"DO15","q":"Trunk-based development va GitFlow — CI/CD uchun qaysi biri va nega?","o":["GitFlow har doim yaxshi","Trunk-based: qisqa umrli branchlar (1–2 kun), tez-tez main'ga merge, tugallanmagan ish feature flag ortida — continuous delivery'ga mos; GitFlow uzoq branchlar bilan relizli (masalan, box mahsulot) loyihalarga","Farqi yo'q","Trunk-based faqat bitta dasturchi uchun"],"a":1,"e":"DORA tadqiqotlari trunk-based'ni yuqori samarali jamoalar bilan bog'laydi. Talab: kuchli avtotestlar, main har doim deploy qilinadigan holatda, branch protection va majburiy CI."},{"l":"M","t":"mcq","tp":"GitOps","d":"infra","id":30550,"n":"DO16","q":"GitOps nima?","o":["GitHub'da CI ishlatish","Kerakli holat (K8s manifestlari) Git'da saqlanadi; klaster ichidagi agent (Argo CD, Flux) uni doimiy ravishda Git bilan solishtirib, farqni o'zi tuzatadi (pull model)","Git hook'lar bilan deploy","Faqat Helm ishlatish"],"a":1,"e":"Afzalliklar: CI'ga klaster kalitlari berilmaydi (pull), audit — git log, rollback — git revert, drift avtomatik tuzatiladi. CI image build qilib, config repo'dagi image tegini yangilaydi; CD'ni agent bajaradi."},{"l":"M","t":"mcq","tp":"GitOps","d":"infra","id":30551,"n":"DO17","q":"Helm chart'da `values.yaml` va muhitlar?","o":["Har muhitga alohida chart nusxasi","Bitta chart, muhitga xos values fayllar (`-f values-prod.yaml`); `helm template` / `helm diff` bilan oldindan ko'rish; chart versiyalanadi","values faqat dev uchun","Helm muhitlarni qo'llab-quvvatlamaydi"],"a":1,"e":"Alternativa — Kustomize (base + overlays, shablonsiz patch). `helm upgrade --install --atomic` xato bo'lsa o'zi rollback qiladi. Sirlarni values'da ochiq saqlamang: sealed-secrets, external-secrets yoki SOPS."},{"l":"S","t":"open","tp":"GitOps","d":"infra","id":30552,"n":"DO18","q":"Noldan servis uchun CI/CD pipeline'ni loyihala: commit'dan production'gacha.","m":"1) PR: lint, unit test, SAST, dependency scan, build. 2) Merge: image build (multi-stage, distroless), tag = git SHA (latest emas), SBOM va imzo (cosign), image scan (trivy), registry'ga push. 3) Integratsiya testlari staging'da, migration'lar oldinga-orqaga mos (expand/contract). 4) Deploy: GitOps — config repo'da tegni yangilash, Argo CD sinxronlaydi. 5) Progressive delivery: canary (Argo Rollouts/Flagger) SLO metrikalari bo'yicha avtomatik analiz va rollback. 6) Prod uchun approval yoki avtomatik (jamoa etukligiga qarab). 7) Kuzatuv: deploy markerlari dashboard'da, DORA metrikalari (deploy chastotasi, lead time, change failure rate, MTTR).","e":"Intervyuda ta'kidlanadigan jihatlar: immutable artefakt (bir image hamma muhitdan o'tadi), tez rollback, xavfsizlik (supply chain), va o'lchanadigan natija."},{"l":"S","t":"mcq","tp":"GitOps","d":"infra","id":30553,"n":"DO19","q":"Docker image'ni `latest` tegi bilan deploy qilishning muammosi?","o":["Muammo yo'q","Teg o'zgaruvchan — qaysi versiya ishlayotgani noma'lum, rollback qiyin, node'lar turli image olishi mumkin (imagePullPolicy); SHA yoki semver teg, eng ishonchlisi digest (@sha256:...)","latest sekinroq yuklanadi","latest faqat Docker Hub'da ishlaydi"],"a":1,"e":"Reproducibility: prod'da nima ishlayotganini aniq bilish kerak. Digest bo'yicha pin qilish registry'da tegni ustidan yozib yuborishdan ham himoyalaydi."},{"l":"St","t":"open","tp":"GitOps","d":"infra","id":30554,"n":"DO20","q":"DevOps madaniyatini jamoaga qanday joriy qilasan? DevOps va SRE farqi nima?","m":"DevOps — vosita emas, madaniyat: dasturchi va operatsiya umumiy mas'uliyati ('you build it, you run it'), kichik tez-tez relizlar, avtomatlashtirish, fikr-mulohaza tsikllari (monitoring, blameless postmortem). Joriy qilish: 1) DORA metrikalarini o'lchashdan boshlash. 2) Eng og'riqli qo'lda jarayonni avtomatlashtirish (deploy). 3) Platform jamoa — golden path (shablon repo, pipeline, observability tayyor), self-service. 4) On-call dasturchilar bilan, runbook'lar. 5) Blameless postmortem. SRE — Google'ning DevOps'ni amalga oshirish usuli: SLO/SLI, error budget (budget tugasa feature o'rniga ishonchlilik), toil'ni 50%dan kam ushlash.","e":"'class SRE implements DevOps' — mashhur ibora. Intervyuda konkret metrika va misol bilan javob kuchli ko'rinadi.","src":"https://sre.google/sre-book/table-of-contents/"},{"l":"M","t":"mcq","tp":"Infra gotcha","d":"infra","id":17014,"n":"E52","q":"Konteynerdagi Go ilova SIGTERM'ga javob bermayapti, Kubernetes 30s kutib SIGKILL beryapti. Sabab?","o":["Ilova PID 1 emas yoki shell orqali ishga tushirilgan (shell form CMD) — signal jarayonga yetib bormaydi; exec form CMD [\"/app\"] ishlatish kerak","Kubernetes signal yubormaydi","Go signal'ni qo'llab-quvvatlamaydi","terminationGracePeriodSeconds kichik"],"a":0,"e":"`CMD /app` shell form /bin/sh -c orqali ishga tushadi: PID 1 — shell, u signal'ni bolaga uzatmaydi. Yechim: exec form yoki tini kabi init. Go tomonda: signal.NotifyContext(ctx, syscall.SIGTERM, os.Interrupt) va srv.Shutdown(ctx) bilan graceful shutdown; readiness probe'ni oldin false qilib, kutilayotgan so'rovlarni tugatish (preStop hook bilan bir necha soniya kutish LB'dan chiqishga ulguradi)."},{"l":"M","t":"mcq","tp":"Infra gotcha","d":"infra","id":17015,"n":"E53","q":"CPU limit 1 core bo'lgan podda Go ilova sekin. Nima tekshiriladi?","o":["GOMAXPROCS host CPU soniga (masalan 64) teng bo'lib qoladi — ortiqcha kontekst almashinuvi va CFS throttling; automaxprocs bilan cgroup limitiga moslash kerak","Go konteynerda ishlamaydi","GC o'chirilgan","Faqat tarmoq muammosi"],"a":0,"e":"Go runtime cgroup CPU kvotasini ko'rmaydi (Go 1.25 gacha; hozircha uber-go/automaxprocs standart yechim). GOMAXPROCS=64 bo'lsa runtime 64 P yaratadi, ular kvota 1 CPU bo'lgan joyda urishadi va CFS period ichida throttle bo'ladi — p99 latency sakraydi. Tekshiruv: container_cpu_cfs_throttled_seconds_total metrikasi.","src":"https://github.com/uber-go/automaxprocs"},{"l":"M","t":"mcq","tp":"Infra gotcha","d":"infra","id":17016,"n":"E54","q":"Docker image 900 MB. Eng katta ta'sir qiladigan o'zgarish?","o":["Multi-stage build: kompilyatsiya golang image'da, natija distroless/scratch'ga ko'chiriladi (CGO_ENABLED=0 statik binary) — o'nlab MB qoladi","Faqat .dockerignore qo'shish","Alpine'ga o'tish yetarli","Layer'larni birlashtirish"],"a":0,"e":"Go uchun final image — binary + CA sertifikatlar + (kerak bo'lsa) tzdata. scratch'da: ca-certificates.crt ni ko'chirish yoki `import _ \"time/tzdata\"`. Alpine musl libc bilan cgo muammolari (DNS resolver farqi) beradi. Bonus: kichik image tezroq pull, kamroq CVE, layer keshini to'g'ri tartiblash (go.mod/go.sum avval, keyin kod) build vaqtini keskin kamaytiradi."},{"l":"P","t":"mcq","tp":"Infra gotcha","d":"infra","id":17017,"n":"E55","q":"Liveness probe noto'g'ri sozlanganda eng xavfli stsenariy?","o":["Probe DB'ga bog'liq bo'lsa — DB sekinlashganda barcha podlar 'sog'lom emas' deb qayta ishga tushadi va yuk yanada yomonlashadi (cascading restart)","Probe juda tez ishlaydi","Probe HTTP o'rniga TCP","Probe port noto'g'ri"],"a":0,"e":"Qoida: liveness — faqat 'jarayon o'zi tirikmi' (deadlock emasmi); tashqi bog'liqliklarni tekshirmaydi. Readiness — 'trafik qabul qila olamanmi' (DB, migratsiya, cache warm-up shu yerda). Startup probe — sekin start uchun, liveness'ni kechiktiradi. Liveness'ga bog'liqlik qo'shish incident paytida restart to'lqini keltiradi."},{"l":"S","t":"mcq","tp":"Infra gotcha","d":"infra","id":30103,"n":"SN104","q":"Konteynerda Go jarayoni `GOMAXPROCS` 64 deb ko'rsatadi, lekin CPU limiti 2. Nima bo'ladi?","o":["Hech narsa, Go o'zi tushunadi","Runtime node CPU'sini ko'radi: ortiqcha parallelizm, kontekst almashinish va CFS throttling — latency oshadi. `automaxprocs` yoki aniq `GOMAXPROCS` qo'yiladi","Jarayon ishga tushmaydi","Xotira oshadi faqat"],"a":1,"e":"Go 1.21 gacha (va cgroup'ni bilmagan holatlarda) runtime `nproc`ga qaraydi. Natija: 64 P, 64 goroutine parallel ishlashga urinadi, kvota 200ms/period — throttle. `go.uber.org/automaxprocs` cgroup kvotasini o'qib to'g'rilaydi. Xuddi shunday `GOMEMLIMIT` memory limitga moslanadi."},{"l":"S","t":"mcq","tp":"Infra gotcha","d":"infra","id":30104,"n":"SN105","q":"Pod `Evicted` bo'ldi, log'da OOM yo'q. Ehtimolli sabab?","o":["Faqat CPU yetishmasligi","Node darajasida resurs siqilishi (disk/ephemeral-storage yoki memory pressure) — kubelet eviction; `requests` past yoki log/tmp fayllar diskni to'ldirgan (emptyDir limitsiz)","Image topilmadi","Probe xato"],"a":1,"e":"Eviction OOMKilled'dan farq qiladi: OOMKill konteyner cgroup limitida, eviction esa kubelet qarori (`node.kubernetes.io/disk-pressure`). Tekshirish: `kubectl describe node` shartlari va `kubectl describe pod` eventlari. Choralar: `ephemeral-storage` requests/limits, log rotation, `emptyDir.sizeLimit`, va QoS klassi (`Guaranteed` oxirida chiqariladi)."},{"l":"S","t":"mcq","tp":"Infra gotcha","d":"infra","id":30482,"n":"SN483","q":"Dockerfile'da `COPY . .` birinchi qatorlarda turibdi. Nima yomon?","o":["Hech narsa","Har kod o'zgarishida keyingi barcha qatlamlar keshdan tushadi — `go mod download` qayta ishlaydi va build daqiqalarga cho'ziladi; avval `go.mod`/`go.sum` ko'chirilib bog'liqliklar yuklanadi, keyin manba","Xotira ko'p ketadi","Image ishlamaydi"],"a":1,"e":"Qo'shimcha: `.dockerignore` bo'lmasa `.git`, `node_modules`, test ma'lumotlari ham kontekstga kiradi — build sekinlashadi va maxfiy fayllar image'ga tushishi mumkin. Kesh tartibi qoidasi: kam o'zgaradigan narsa yuqorida, tez-tez o'zgaradigan pastda."},{"l":"S","t":"mcq","tp":"Infra gotcha","d":"infra","id":30483,"n":"SN484","q":"`kubectl apply` bilan deploy qilindi, lekin pod eski image bilan ishlayapti. Sabab?","o":["Kubernetes bug'i","`latest` kabi mutable tag ishlatilgan va `imagePullPolicy` mos emas — manifest o'zgarmagani uchun Deployment yangi ReplicaSet yaratmaydi; yechim — image tagida commit SHA yoki digest","Node xotirasi","Namespace xato"],"a":1,"e":"`latest` bilan yana bir xavf: har node turli vaqtda pull qilib turli versiyani ishlatishi mumkin — debug qilib bo'lmaydigan holat. To'g'ri amaliyot: `app:git-<sha>` yoki `@sha256:...`, `imagePullPolicy: IfNotPresent` (digest bilan xavfsiz), va deploy natijasini `kubectl rollout status` bilan tekshirish."},{"l":"St","t":"mcq","tp":"Infra gotcha","d":"infra","id":30484,"n":"SN485","q":"ConfigMap o'zgartirildi, lekin ilova eski konfiguratsiya bilan ishlayapti. Nega?","o":["ConfigMap ishlamaydi","Env sifatida ulangan ConfigMap pod ishga tushganda o'qiladi — yangilanish uchun pod qayta yaratilishi kerak; volume sifatida ulansa fayl yangilanadi (kechikish bilan), lekin ilova uni qayta o'qishi shart","Faqat Secret yangilanadi","Restart avtomatik bo'ladi"],"a":1,"e":"Amaliy yechimlar: konfiguratsiya hash'ini Deployment annotatsiyasiga qo'yish (o'zgarsa rolling update avtomatik bo'ladi), yoki ilovada fayl kuzatuvi (fsnotify) bilan qayta yuklash. Ikkinchisi tez, lekin har sozlamani issiq qayta yuklash xavfsiz emas — qaysi sozlama issiq o'zgarishi mumkinligi aniq belgilanishi kerak."},{"l":"S","t":"mcq","tp":"Infra gotcha","d":"infra","id":30485,"n":"SN486","q":"Alpine asosidagi Go image'da DNS yoki TLS kutilmagan tarzda ishlamayapti. Sabab?","o":["Alpine buzuq","musl libc va glibc farqi (cgo bilan qurilganda DNS resolver xatti-harakati boshqacha), hamda `ca-certificates` paketi yo'qligi — TLS sertifikat tekshiruvi yiqiladi. Yechim: `CGO_ENABLED=0` bilan sof Go resolver, distroless image yoki `ca-certificates` o'rnatish","Faqat DNS muammosi","Alpine TLS'ni qo'llamaydi"],"a":1,"e":"Go'da `CGO_ENABLED=1` bo'lsa tizim resolveri ishlatiladi (`/etc/nsswitch.conf`, musl'da xatti-harakat farq qiladi); `CGO_ENABLED=0` bilan sof Go resolver ishlaydi va natija bashorat qilinadigan bo'ladi. `scratch`/distroless image'da esa `ca-certificates` va timezone ma'lumotlarini aniq ko'chirish kerak (`tzdata` yoki `time/tzdata` import)."},{"l":"P","t":"mcq","tp":"Network gotcha","d":"infra","id":17022,"n":"E60","q":"TCP connection 'tirik' ko'rinadi, lekin qarshi tomon allaqachon o'lgan. Nega va nima qilinadi?","o":["TCP o'zi trafik bo'lmasa uzilishni sezmaydi — yarim ochiq (half-open) ulanish; keep-alive, ilova darajasidagi ping/heartbeat va read/write deadline kerak","Operatsion tizim darhol xabar beradi","TCP har doim FIN yuboradi","Faqat UDP'da shunday"],"a":0,"e":"Qarshi tomon crash bo'lsa yoki tarmoq uzilsa FIN/RST kelmaydi — soket ochiq ko'rinadi va o'qish abadiy kutadi. Shuning uchun har doim: SetReadDeadline/SetWriteDeadline, HTTP client'da Timeout, gRPC'da keepalive parametrlari, load balancer idle timeout'idan qisqa ilova idle timeout. Bulutda NAT/LB idle timeout (ko'pincha 60-350s) jimgina ulanishni uzadi — 'birinchi so'rov xato beradi' muammosining sababi shu."},{"l":"P","t":"mcq","tp":"Network gotcha","d":"infra","id":17023,"n":"E61","q":"Yuk ostida 'connection reset by peer' va TIME_WAIT ko'payyapti. Sabab?","o":["Har so'rovga yangi TCP ulanish ochilyapti — keep-alive ishlamayapti (http.Client qayta ishlatilmagan yoki MaxIdleConnsPerHost kichik, yoki Body yopilmagan/oxirigacha o'qilmagan)","Server RAM yetishmayapti","DNS sekin","TLS versiyasi eski"],"a":0,"e":"Go'da har so'rovda yangi http.Client yaratish — Transport va ulanish pool'i ham yangi bo'ladi. To'g'risi: bitta Client'ni ulashib ishlatish, MaxIdleConnsPerHost'ni RPS'ga moslash (default 2 — mikroservislar uchun kam), javob Body'sini io.Copy(io.Discard, body) bilan tugatib yopish. TIME_WAIT ulanishni AKTIV yopgan tomonda 2*MSL turadi."},{"l":"M","t":"mcq","tp":"Network gotcha","d":"infra","id":17024,"n":"E62","q":"Bir service DNS orqali boshqasini chaqiradi. Deploy paytida eski podlarga trafik ketyapti. Nega?","o":["DNS keshi va ulanish pool'i: mavjud keep-alive ulanishlar eski IP'ga ochiq qoladi, DNS TTL esa hal qilmaydi","DNS hech qachon keshlanmaydi","Kubernetes IP'ni qayta ishlatmaydi","Bu faqat HTTP/2 muammosi"],"a":0,"e":"Go'da DNS javobi ulanish o'rnatishda hal qilinadi; pool'dagi tayyor ulanish qayta hal qilinmaydi. Shuning uchun: Service (ClusterIP) orqali yurish — IP barqaror; yoki headless DNS ishlatilsa client-side load balancing (gRPC resolver) kerak; MaxConnLifetime/IdleConnTimeout bilan ulanishlarni davriy yangilash; graceful shutdown bilan eski pod o'zi GOAWAY/FIN yuborishi."},{"l":"P","t":"open","tp":"Network gotcha","d":"infra","id":17025,"n":"E63","q":"p99 latency 2 sekund, p50 esa 20 ms. Qayerdan boshlaysan?","m":"1) O'rtacha emas, taqsimotga qarash: histogram va heatmap — ikki cho'qqili bo'lsa ikki xil yo'l bor (cache hit/miss, retry, cold start). 2) Tail'ni ajratish: trace'larni p99 bo'yicha filtrlash (tail-based sampling) va sekin span'ni topish. 3) Tipik sabablar: navbat (DB pool, worker pool, CFS throttling), GC pauza emas balki GC assist, lock contention (mutex profil), retry+timeout zanjiri, sovuq kesh, katta javob serializatsiyasi, N+1 query, DNS/TLS handshake. 4) Yuk manbai: bitta 'og'ir' tenant yoki kalit (hot partition). 5) Little's law bilan tekshirish: L = λ·W — konkurentlik chegarasi p99'ni tushuntiradimi. 6) Tuzatgach: SLO va error budget bilan kuzatuvga qo'yish.","e":"Tail latency alohida hodisa: o'rtacha yuk past bo'lsa ham navbat nazariyasi bo'yicha foydalanish darajasi 70-80% dan oshganda kutish vaqti eksponensial o'sadi. Amaliy vositalar: hedged requests (Google 'The Tail at Scale'), load shedding, konkurentlikni cheklash (adaptive concurrency), per-tenant kvota."},{"l":"S","t":"mcq","tp":"Network gotcha","d":"infra","id":30107,"n":"SN108","q":"Go'da HTTP client bilan ko'p so'rov qilinadi, `time.Sleep` yo'q, lekin latency vaqti-vaqti bilan portlaydi. Klassik sabab?","o":["GC","`http.DefaultTransport` limitlari: `MaxIdleConnsPerHost` = 2 — ulanishlar qayta ishlatilmay yangi handshake qilinadi; yoki `resp.Body` yopilmagani uchun ulanish poolga qaytmaydi","DNS keshi yo'q","TLS 1.3 sekin"],"a":1,"e":"Ikki eng ko'p uchraydigan xato: (1) `defer resp.Body.Close()` yo'q yoki body to'liq o'qilmagan — keep-alive buziladi va FD leak bo'ladi; (2) per-host idle limit past bo'lgani uchun yuqori parallelizmda har so'rov yangi TCP+TLS. To'g'ri: bitta umumiy `http.Client` (timeout bilan) va sozlangan `Transport`."},{"l":"S","t":"mcq","tp":"Network gotcha","d":"infra","id":30108,"n":"SN109","q":"`http.Client{}` timeout'siz ishlatilgan. Eng xavfli natija?","o":["Faqat sekin javob","Goroutine va ulanish cheksiz kutadi — leak, FD tugashi, va cascading hang (butun servis javob bermay qoladi). Har client'da `Timeout` yoki `context` deadline bo'lishi shart","Xato qaytmaydi","Faqat testda muammo"],"a":1,"e":"Default `http.Client` timeout'i yo'q — TCP osilib qolsa goroutine abadiy turadi. Aniq sozlash kerak: umumiy `Timeout`, `DialContext` timeout, `TLSHandshakeTimeout`, `ResponseHeaderTimeout`, va per-request `context.WithTimeout` (deadline propagatsiyasi uchun). Serverda ham `ReadHeaderTimeout`/`WriteTimeout` — Slowloris himoyasi."},{"l":"S","t":"mcq","tp":"Network gotcha","d":"infra","id":30489,"n":"SN490","q":"Go'da DNS natijalari keshlanmaydi. Bu nimaga olib keladi?","o":["Hech narsaga","Har yangi ulanishda resolver so'rovi — yuqori RPS'da DNS serveriga bosim va latency qo'shiladi; ayniqsa Kubernetes'da `ndots` bilan bir necha so'rov. Yechim: ulanishlarni qayta ishlatish (keep-alive), NodeLocal DNSCache, yoki ilovada resolver keshi","Go DNS'ni qo'llamaydi","Faqat Windows'da"],"a":1,"e":"Ikkinchi tomoni ham bor: kesh bo'lmagani uchun DNS o'zgarishi (failover, yangi endpoint) tez ko'rinadi — bu afzallik. Muammo faqat ulanishlar qisqa umrli bo'lganda paydo bo'ladi. Uzoq yashovchi ulanishlarda esa teskari xavf: eski IP'ga yopishib qolish (shu sabab `MaxConnectionAge` yoki davriy qayta ulanish)."},{"l":"S","t":"mcq","tp":"Network gotcha","d":"infra","id":30490,"n":"SN491","q":"Load balancer orqasida barcha so'rovlar bitta IP'dan kelayotgandek ko'rinadi. Oqibati?","o":["Muammo yo'q","Rate limit, geo-mantiq, fraud va audit noto'g'ri ishlaydi — haqiqiy client IP `X-Forwarded-For`/`X-Real-IP` yoki PROXY protokol orqali olinadi; lekin bu headerlarga faqat ishonchli proksidan kelganda ishonish mumkin (aks holda spoofing)","Faqat log muammosi","TLS buziladi"],"a":1,"e":"To'g'ri implementatsiya: ishonchli proksi ro'yxati (`trusted proxies`) va `X-Forwarded-For` zanjirining o'ngdan chapga o'qilishi — client tomonidan qo'shilgan soxta qiymatlar tashlanadi. Aks holda hujumchi `X-Forwarded-For: 1.2.3.4` yuborib rate limit va bloklashni aylanib o'tadi."},{"l":"St","t":"mcq","tp":"Network gotcha","d":"infra","id":30491,"n":"SN492","q":"Servis o'z-o'ziga (ichki Service DNS orqali) so'rov yuboradi va vaqti-vaqti bilan timeout oladi. Klassik sabab?","o":["Kod xatosi","Hairpin/NAT va conntrack muammolari yoki pod o'ziga ClusterIP orqali kelganda manba/manzil NAT konflikti; shuningdek `conntrack table full` bo'lsa paketlar jim tashlanadi (`nf_conntrack: table full, dropping packet` dmesg'da)","DNS yo'q","Faqat Istio'da"],"a":1,"e":"Diagnostika: node'da `conntrack -S` (insert_failed, drop), `dmesg` xabarlari, va `nf_conntrack_max` sozlamasi. Yuqori RPS'li qisqa ulanishlar conntrack jadvalini to'ldiradi — keep-alive bilan ulanish sonini kamaytirish eng samarali chora. Ba'zi holatlarda UDP DNS bilan parallel so'rovlar race'i (`--random-fully` tuzatishi) ham shu simptomni beradi."},{"l":"P","t":"open","tp":"Strategy","d":"arch","id":50,"n":51,"q":"Yangi mahsulot uchun DB tanlashda (PostgreSQL vs DynamoDB vs Cassandra vs ...) qaror freymvorkingiz qanday?","m":["Access pattern'lardan boshlash: query'lar oldindan ma'lummi (key-value) yoki ad-hoc/relational?","Konsistentlik talablari: pul/inventar → kuchli transaction'lar","Masshtab realistik prognozi — ko'p kompaniyaga bitta yaxshi sozlangan Postgres yetadi","Jamoa tajribasi va operatsion narx (on-call, backup, tooling)","Vendor lock-in, narx modeli (DynamoDB — query bo'yicha), region talablari","Default: 'boring technology' — Postgres; boshqasiga o'tish uchun aniq sabab va ADR"],"e":"Principal level'da texnologiya emas, qaror jarayoni baholanadi: trade-off'ni hujjatlash (ADR), qaytarish narxi, jamoaning innovation token'larini tejash."},{"l":"P","t":"open","tp":"Org","d":"arch","id":53,"n":54,"q":"200+ muhandisli tashkilotda DB sxema o'zgarishlari va ma'lumot egaligini qanday boshqarasiz?","m":["Har table/sxemaning aniq egasi (servis/jamoa), boshqa jamoa to'g'ridan-to'g'ri kirmaydi — kontrakt orqali","Migratsiyalar CI'da avtomatik tekshiriladi: lint (xavfli ALTER, CONCURRENTLY'siz index, NOT NULL default), lock_timeout","Paved road: standart migratsiya tooling, shablon, runbook — to'g'ri yo'l eng oson yo'l bo'lsin","Katta xavfli o'zgarishlar uchun review (DB guild), lekin bottleneck bo'lmasligi kerak","Kuzatuv: sekin query'lar, bloat, index'lar bo'yicha jamoalarga dashboard","Incident'lardan keyin qoidani avtomatlashtirish"],"e":"Principal signal: odamlar review'iga emas, avtomatik guardrail'larga tayanish va tashkiliy masshtab — markaziy DBA jamoasi bottleneck bo'lmasligi."},{"l":"P","t":"mcq","tp":"Architecture","d":"arch","id":54,"n":55,"q":"Event sourcing'ning production'dagi eng katta uzoq muddatli narxi odatda nima?","o":["Diskda joy ko'p ketadi","Event sxemasi evolyutsiyasi (versiyalash/upcasting), projection'larni qayta qurish va eventual consistency murakkabligi","Yozish sekin","SQL ishlatib bo'lmaydi"],"a":1,"e":"Eventlar o'zgarmas — 3 yil oldingi event formatini ham abadiy qo'llash kerak. Read model'lar kechikadi, qayta qurish soatlab ketishi mumkin. Shuning uchun ES faqat audit/tarix biznes qiymat bo'lgan bounded context'ga — butun tizimga emas."},{"l":"P","t":"open","tp":"Strategy","d":"arch","id":59,"n":60,"q":"Managed DB (RDS/Aurora/Cloud SQL) vs self-hosted (Kubernetes/VM'da Postgres) — qanday qaror qilasiz?","m":["Managed: backup, failover, patching tayyor — jamoa mahsulotga fokus","Narx: katta masshtabda managed 2–3x qimmat bo'lishi mumkin, lekin DBA/SRE maoshi bilan solishtirish kerak (TCO)","Nazorat: extension'lar, superuser, versiya, tuning chegaralari","Compliance/on-prem talablar","Qaror qaytarilishi: chiqish (egress, migratsiya) narxi","Odatda: managed bilan boshlash; aniq masshtab/narx signali bo'lganda qayta ko'rib chiqish"],"e":"Principal javob TCO va jamoa imkoniyatlariga asoslanadi, 'arzonroq' degan birgina metrikaga emas."},{"l":"St","t":"open","tp":"Microservices","d":"arch","id":1018,"n":"B19","q":"Saga: orchestration va choreography farqi, qachon qaysi biri?","m":["Saga — distributed transaction o'rniga lokal transaction'lar ketma-ketligi + compensating action'lar","Choreography: servislar eventlarga reaksiya qiladi — kam coupling, lekin oqim ko'rinmaydi, siklik bog'liqlik xavfi","Orchestration: markaziy koordinator (Temporal, Step Functions) — oqim aniq, monitoring oson, orkestrator — qo'shimcha komponent","Compensation idempotent bo'lishi shart; ba'zi amallarni qaytarib bo'lmaydi (email) — oxiriga qo'yish","Oddiy 2–3 qadam — choreography; murakkab biznes oqim — orchestration"],"e":"Staff signal: 'izolatsiya yo'q' kamchiligini aytish — saga o'rtasida boshqalar oraliq holatni ko'radi (semantic lock, pending status bilan yechiladi)."},{"l":"St","t":"mcq","tp":"Microservices","d":"arch","id":1023,"n":"B24","q":"API gateway'ga qaysi mas'uliyat <b>tegishli emas</b>?","o":["Autentifikatsiya, rate limiting","Routing, TLS termination","Biznes logika (masalan order narxini hisoblash)","Request/response logging, metrikalar"],"a":2,"e":"Gateway — cross-cutting concerns uchun. Biznes logika gateway'ga tushsa u 'yangi monolit' va bottleneck bo'ladi. BFF (backend for frontend) — client'ga moslashtirish uchun alohida qatlam."},{"l":"P","t":"open","tp":"Microservices","d":"arch","id":1024,"n":"B25","q":"Monolit vs mikroservislar: yangi kompaniya yoki mavjud monolit uchun qanday qaror qilasiz?","m":["Mikroservislar — tashkiliy masshtab muammosini hal qiladi (Conway qonuni), texnik emas","Narx: distributed tizim murakkabligi, network, observability, deploy infratuzilmasi","Boshlash: modular monolit — aniq modul chegaralari, keyinroq ajratish oson","Ajratish signallari: mustaqil deploy kerak, turlicha masshtab, jamoalar bir-birini bloklaydi","Ajratish tartibi: eng mustaqil, aniq bounded context'dan; strangler fig"],"e":"Principal javob: 'bu arxitektura emas, tashkiliy qaror' va teskari yo'l (mikroservislardan qayta birlashtirish) holatlarini ham tan olish."},{"l":"P","t":"open","tp":"Microservices","d":"arch","id":1027,"n":"B28","q":"Multi-tenant SaaS'da tenant izolatsiyasini (security va 'noisy neighbor') qanday ta'minlaysiz?","m":["Modellar: shared DB + tenant_id; schema per tenant; DB per tenant — narx va izolatsiya trade-off","Ma'lumot izolatsiyasi: har query'da tenant konteksti majburiy (Postgres RLS, ORM default scope), testlar","Noisy neighbor: tenant bo'yicha rate limit, kvota, alohida queue/worker pool","Katta enterprise mijozlar uchun dedicated tier (cell architecture)","Observability tenant bo'yicha: narx va yuk attributsiyasi"],"e":"Principal signal: bitta model hammaga emas — tier'lar va cell-based arxitektura; va security'ni kod review'ga emas, RLS kabi tizimli mexanizmga yuklash."},{"l":"J","t":"mcq","tp":"Patterns","d":"arch","id":2000,"n":"I1","q":"Mikroservis arxitekturasining monolitdan asosiy farqi?","o":["Kod hajmi kichikroq","Har servis mustaqil deploy qilinadi, o'z ma'lumot bazasiga ega va network orqali muloqot qiladi","Faqat bulutda ishlaydi","DB kerak emas"],"a":1,"e":"Asosiy mezon — mustaqil deploy. Agar 5 ta 'servis'ni birga deploy qilish kerak bo'lsa, bu distributed monolit: mikroservis narxini to'laysiz, foydasini olmaysiz. Umumiy DB ham shu belgi. Foyda: jamoalar mustaqil ishlaydi, alohida masshtab. Narx: network failure'lari, tracing, deploy infratuzilmasi."},{"l":"M","t":"mcq","tp":"Discovery","d":"arch","id":2001,"n":"I2","q":"Servis boshqa servisning manzilini qanday topadi (service discovery)?","o":["Manzillar konfiguratsiya faylida qo'lda yoziladi","Registry (Consul, etcd) yoki platforma DNS'i orqali: Kubernetes'da Service nomi (orders.default.svc) barqaror virtual IP beradi, podlar almashsa ham nom o'zgarmaydi","Har safar butun network'ni skanerlaydi","Faqat IP bo'yicha"],"a":1,"e":"Client-side discovery: client registry'dan ro'yxat olib, o'zi balanslaydi (Eureka+Ribbon). Server-side: LB/Service orqali (Kubernetes). Podlar o'ladi va yangi IP oladi — shuning uchun qat'iy IP yozish ishlamaydi. DNS cache'i va TTL — tipik tuzoq (JVM'da DNS cache abadiy bo'lishi mumkin)."},{"l":"M","t":"open","tp":"Patterns","d":"arch","id":2002,"n":"I3","q":"Servis chegarasini (qaysi kod qaysi servisga tegishli) qanday aniqlaysiz?","m":["Bounded context bo'yicha — biznes qobiliyati, texnik qatlam emas ('order' servisi, 'database' servisi emas)","Ma'lumot egaligi: bitta table'ni ikki servis yozmaydi","Birga o'zgaradigan kod birga tursin (bitta feature 3 servisga deploy talab qilsa — chegara noto'g'ri)","Jamoa strukturasi (Conway qonuni) va mustaqil ishlash imkoni","Masshtab va SLA farqi: og'ir yuk yoki boshqa ishonchlilik talabi ajratishga sabab","Shubha bo'lsa — kattaroq servis: ajratish birlashtirishdan oson"],"e":"Middle/Senior signal: 'birga o'zgaradigan narsa birga tursin' mezoni. Yomon chegara alomati: har release'da 4 ta servisni muvofiqlashtirish, servislar orasida chatty (juda ko'p) chaqiruvlar."},{"l":"S","t":"mcq","tp":"Mesh","d":"arch","id":2003,"n":"I4","q":"Service mesh (Istio, Linkerd) nima beradi?","o":["Ilova kodini tezlashtiradi","Sidecar proxy orqali kodga tegmasdan: mTLS, retry/timeout, circuit breaking, trafik bo'lish (canary), va avtomatik metrika/tracing","DB replikatsiyasini boshqaradi","CI/CD pipeline"],"a":1,"e":"Bu imkoniyatlarni kutubxona bilan ham olish mumkin (Resilience4j), lekin har til uchun alohida. Mesh — infratuzilma qatlamida, tilga bog'liq emas. Narxi: har podda qo'shimcha proxy (latency, memory), murakkab debugging, control plane. Kichik tizimda ortiqcha — 10+ servis va ko'p tilli muhitda ma'noga ega."},{"l":"S","t":"open","tp":"Patterns","d":"arch","id":2004,"n":"I5","q":"Servislar orasida umumiy kod (shared library) ishlatish kerakmi?","m":["Texnik kutubxonalar (logging, tracing, HTTP client) — ha, versiyalangan paket sifatida","Biznes logika va domain modeli — yo'q: umumiy kutubxona servislarni bir-biriga bog'lab qo'yadi, har o'zgarishda hammasini yangilash kerak","DTO/kontraktlar: generatsiya qilingan client (OpenAPI, protobuf) — maqbul, lekin versiyalash bilan","Ba'zi takrorlanish mikroservisda normal — coupling'dan arzonroq","Majburiy yangilanish talab qilmaslik: eski versiyani qo'llab turish"],"e":"Senior signal: DRY'ni mikroservis chegarasidan o'tkazmaslik. 'Shared domain library' — distributed monolitga olib boradigan eng tez yo'l."},{"l":"St","t":"mcq","tp":"Patterns","d":"arch","id":2005,"n":"I6","q":"Strangler fig pattern nima?","o":["Eski tizimni o'chirib, yangisini bir kunda yoqish","Eski tizim oldiga proxy qo'yib, funksiyani bo'lak-bo'lak yangi servisga ko'chirish; trafik asta-sekin o'tadi, eski tizim bo'shab qolgach o'chiriladi","Ikki tizimni doim parallel ishlatish","Ma'lumotni faqat o'qish rejimiga o'tkazish"],"a":1,"e":"'Big bang rewrite' deyarli doim kechikadi va biznes yangi featurelarsiz qoladi. Strangler: har qadam alohida qiymat beradi va rollback qilinadi. Kerakli elementlar: routing qatlami (proxy/gateway), ma'lumot sinxronizatsiyasi (CDC yoki dual write), va o'chirish rejasi — aks holda ikki tizim abadiy qoladi."},{"l":"S","t":"mcq","tp":"Microservices","d":"arch","id":14014,"n":"SR15","q":"API gateway, BFF va service mesh o'rtasidagi farq?","o":["Uchalasi bir xil ishni qiladi","Gateway — tashqi kirish nuqtasi (auth, rate limit, routing). BFF — har client turi (mobil, web) uchun moslashtirilgan agregatsiya qatlami. Mesh — servislararo (east-west) trafik uchun sidecar: mTLS, retry, kuzatuv","BFF — bu gateway'ning yangi nomi","Mesh tashqi trafikni boshqaradi"],"a":1,"e":"Tanlovda xato: hamma narsani gateway'ga solish (biznes logika) yoki kichik tizimga mesh o'rnatish. BFF foydali bo'ladigan holat: mobil client kam so'rov bilan ko'p ma'lumot olishi kerak — lekin har BFF alohida qo'llab-quvvatlanadigan kod."},{"l":"S","t":"mcq","tp":"Microservices","d":"arch","id":30217,"n":"SN218","q":"'Distributed monolith' belgilari qaysilar?","o":["Ko'p servis bo'lishi","Servislar birgalikda deploy qilinishi shart, bitta DB/jadvalni bo'lishishi, har o'zgarish bir necha repo'ni talab qilishi, sinxron chaqiruv zanjirlari va umumiy kutubxonada biznes mantiqi — ya'ni mustaqillik yo'q, lekin tarmoq narxi bor","Har servisda alohida DB","Event ishlatish"],"a":1,"e":"Bu eng qimmat holat: monolitning bog'liqligi + taqsimlangan tizimning murakkabligi. Test: 'shu servisni boshqalarni deploy qilmasdan chiqara olamanmi?' va 'kontrakt o'zgarmasa boshqalar buziladimi?'. Tuzatish yo'li ko'pincha chegaralarni qayta chizish (ma'lumot egaligi bo'yicha) yoki ortiqcha servislarni qayta birlashtirish."},{"l":"St","t":"open","tp":"Architecture","d":"arch","id":30218,"n":"SN219","q":"Yangi jamoa uchun servis shabloni (template) tuzyapsiz. Nima bo'lishi kerak?","m":["Struktura: `cmd/`, `internal/domain|application|adapters`, migratsiyalar, `Makefile` — qatlam chegaralari import linter bilan majburlangan","Kuzatuv standart holda: strukturaviy log (trace_id bilan), Prometheus metrikalari (RED: rate/errors/duration), OTel tracing, `/healthz` va `/readyz` (dependency semantikasi to'g'ri)","Ishonchlilik primitivlari: HTTP client timeout va retry/breaker bilan o'ralgan, DB pool sozlamalari, graceful shutdown, panic recovery","Konfiguratsiya: env orqali, validatsiya ishga tushishda (fail fast), sirlar secret manager'dan","CI: lint (`golangci-lint`), `go test -race`, `govulncheck`, migratsiya tekshiruvi, konteyner qurilishi (distroless, nonroot), SBOM","Deploy: Helm/Kustomize bazasi, resurs requests/limits, `GOMEMLIMIT`/`automaxprocs`, HPA, PDB, topologySpread","Hujjat: README (qanday ishga tushirish, kim ega), ADR papkasi, runbook shabloni, alert va SLO bazasi","Maqsad: yangi servis birinchi kunida productionga chiqishga tayyor — 'platforma sifatida standart', har jamoa o'zi ixtiro qilmaydi"],"e":"Staff darajadagi savol: javob kod strukturasidan boshlanmasligi kerak, balki 'productionda ishlash uchun nima majburiy' ro'yxatidan. Shablonning qiymati — takrorlanuvchi qarorlarni bir marta to'g'ri qilib qotirish."},{"l":"S","t":"mcq","tp":"Microservices","d":"arch","id":30367,"n":"SN368","q":"'Distributed monolith' belgilari qaysilar?","o":["Ko'p servis bo'lishi","Servislar birgalikda deploy qilinishi shart, bitta DB/jadvalni bo'lishishi, har o'zgarish bir necha repo'ni talab qilishi, sinxron chaqiruv zanjirlari va umumiy kutubxonada biznes mantiqi — ya'ni mustaqillik yo'q, lekin tarmoq narxi bor","Har servisda alohida DB","Event ishlatish"],"a":1,"e":"Bu eng qimmat holat: monolitning bog'liqligi + taqsimlangan tizimning murakkabligi. Test: 'shu servisni boshqalarni deploy qilmasdan chiqara olamanmi?' va 'kontrakt o'zgarmasa boshqalar buziladimi?'. Tuzatish yo'li ko'pincha chegaralarni qayta chizish (ma'lumot egaligi bo'yicha) yoki ortiqcha servislarni qayta birlashtirish."},{"l":"St","t":"open","tp":"Architecture","d":"arch","id":30368,"n":"SN369","q":"Yangi jamoa uchun servis shabloni (template) tuzyapsiz. Nima bo'lishi kerak?","m":["Struktura: `cmd/`, `internal/domain|application|adapters`, migratsiyalar, `Makefile` — qatlam chegaralari import linter bilan majburlangan","Kuzatuv standart holda: strukturaviy log (trace_id bilan), Prometheus metrikalari (RED: rate/errors/duration), OTel tracing, `/healthz` va `/readyz` (dependency semantikasi to'g'ri)","Ishonchlilik primitivlari: HTTP client timeout va retry/breaker bilan o'ralgan, DB pool sozlamalari, graceful shutdown, panic recovery","Konfiguratsiya: env orqali, validatsiya ishga tushishda (fail fast), sirlar secret manager'dan","CI: lint (`golangci-lint`), `go test -race`, `govulncheck`, migratsiya tekshiruvi, konteyner qurilishi (distroless, nonroot), SBOM","Deploy: Helm/Kustomize bazasi, resurs requests/limits, `GOMEMLIMIT`/`automaxprocs`, HPA, PDB, topologySpread","Hujjat: README (qanday ishga tushirish, kim ega), ADR papkasi, runbook shabloni, alert va SLO bazasi","Maqsad: yangi servis birinchi kunida productionga chiqishga tayyor — 'platforma sifatida standart', har jamoa o'zi ixtiro qilmaydi"],"e":"Staff darajadagi savol: javob kod strukturasidan boshlanmasligi kerak, balki 'productionda ishlash uchun nima majburiy' ro'yxatidan. Shablonning qiymati — takrorlanuvchi qarorlarni bir marta to'g'ri qilib qotirish."},{"l":"St","t":"mcq","tp":"Patterns","d":"arch","id":30475,"n":"SN476","q":"Strangler fig migratsiyasida trafikni qanday bosqichma-bosqich ko'chirasiz?","o":["Bir kunda hammasini","Proxy/gateway orqasida yo'l bo'yicha ko'chirish: avval o'qish endpoint'lari 1% → 50% → 100% (shadow/dual-read bilan natijalarni solishtirish), keyin yozuv (dual-write yoki yangi tizim yagona yozuvchi), har bosqichda rollback imkoniyati va metrikalar taqqoslanadi","Faqat yangi funksiyalarni yangi tizimda","DNS almashtirish"],"a":1,"e":"Kritik detal — ma'lumot: dual-write nomuvofiqlik keltiradi, shuning uchun ko'pincha bitta yozuvchi + CDC bilan ikkinchisini to'ldirish afzal. Shadow read (ikkalasini chaqirib natijani solishtirish, eskisini qaytarish) farqlarni productionda xavfsiz topadi. Har bosqich uchun 'muvaffaqiyat mezoni' oldindan yoziladi."},{"l":"J","t":"mcq","tp":"OOP","d":"arch","id":6021,"n":"F22","q":"OOP'ning to'rt asosiy tushunchasi nima?","o":["Sinf, funksiya, o'zgaruvchi, sikl","Inkapsulyatsiya (holatni yashirish va nazorat qilingan interfeys), abstraksiya (muhimini ko'rsatib, tafsilotni yashirish), meros (umumiy xulqni kengaytirish), polimorfizm (bir interfeys — turli implementatsiya)","Massiv, ro'yxat, table, daraxt","Kompilyatsiya, bajarilish, test, deploy"],"a":1,"e":"Go'da klassik meros yo'q — o'rniga embedding (kompozitsiya) va implicit interfeyslar bor; polimorfizm interfeys orqali ishlaydi. Shuning uchun intervyuda ta'rifni ayting va 'Go'da bu qanday ifodalanadi' deb davom eting — bu tilni tushunganingizni ko'rsatadi."},{"l":"J","t":"mcq","tp":"OOP","d":"arch","id":6022,"n":"F23","q":"'Composition over inheritance' nimani anglatadi?","o":["Meros umuman ishlatilmaydi","Xulqni chuqur meros iyerarxiyasi orqali emas, obyektlarni birlashtirib (has-a) qurish afzal: bog'liqlik zaifroq, o'zgartirish oson, 'mo'rt asosiy sinf' muammosi yo'q","Kompozitsiya tezroq ishlaydi","Faqat Go'da to'g'ri"],"a":1,"e":"Chuqur meros muammosi: ota sinfdagi kichik o'zgarish hamma avlodni buzadi; xulqni ishlatish uchun ortiqcha bog'liqlik ham meros bilan keladi. Kompozitsiya + kichik interfeyslar testni ham osonlashtiradi (bog'liqlikni almashtirish). Go bu yondashuvni tilga singdirgan."},{"l":"M","t":"mcq","tp":"SOLID","d":"arch","id":6023,"n":"F24","q":"Single Responsibility Principle (S) nimani talab qiladi?","o":["Har sinfda faqat bitta metod bo'lsin","Modul o'zgarishining faqat bitta sababi bo'lsin — ya'ni u bitta manfaatdor tomon/vazifaga xizmat qilsin (masalan hisob-kitob mantig'i, formatlash va DB'ga yozish bir joyda bo'lmasin)","Har fayl 100 row'dan oshmasin","Har funksiya bitta argument olsin"],"a":1,"e":"Amaliy mezon: 'bu kodni o'zgartirishni kim so'raydi?' Agar javob ikki xil (moliyachi va dizayner) bo'lsa — ajratish kerak. Buzilish alomati: bitta struct ichida validatsiya, SQL, HTTP javob formati va biznes qoidasi aralash. Haddan oshirish ham zarar: har narsani bitta metodli sinflarga bo'lib tashlash o'qishni qiyinlashtiradi."},{"l":"M","t":"mcq","tp":"SOLID","d":"arch","id":6024,"n":"F25","q":"Open/Closed Principle (O) misoli qaysi?","o":["Har yangi to'lov turi uchun switch/if zanjiriga yangi shart qo'shish","PaymentMethod interfeysi bo'lib, yangi to'lov turi yangi implementatsiya sifatida qo'shiladi — mavjud kod o'zgarmaydi","Hamma maydonlarni public qilish","Funksiyalarni doim o'zgartirib turish"],"a":1,"e":"Kengaytirishga ochiq, o'zgartirishga yopiq. Go'da bu interfeys + registry/strategiya bilan tabiiy chiqadi. Lekin mavhumlikni oldindan qurmang: ikki-uchinchi holat paydo bo'lganda ajratish (rule of three) — birinchi kundanoq 'kelajak uchun' interfeys yozish ko'pincha ortiqcha murakkablik."},{"l":"M","t":"mcq","tp":"SOLID","d":"arch","id":6025,"n":"F26","q":"Liskov Substitution Principle (L) buzilishiga misol?","o":["Interfeysda ko'p metod bo'lishi","Square sinfi Rectangle'dan meros olib, setWidth qilganda balandlikni ham o'zgartiradi — Rectangle kutayotgan kod (kenglikni o'zgartirsam balandlik saqlanadi) buziladi; ya'ni avlod ota kontraktini buzadi","Sinf nomining uzunligi","Ko'p konstruktor bo'lishi"],"a":1,"e":"Boshqa tipik buzilishlar: avlod metodi ota ruxsat bermagan xato (exception) tashlashi, shartlarni kuchaytirishi yoki 'not implemented' qaytarishi (masalan ReadOnlyList.Add). Mezon: ota tipini kutayotgan kod avlodni bilmasdan ishlatganda to'g'ri ishlashi kerak."},{"l":"M","t":"mcq","tp":"SOLID","d":"arch","id":6026,"n":"F27","q":"Interface Segregation (I) nimani aytadi?","o":["Interfeys ko'p metodli bo'lishi kerak","Client o'ziga keraksiz metodlarga bog'lanmasin — katta interfeysni kichik, maqsadli interfeyslarga bo'lish kerak","Interfeys faqat bitta bo'lsin","Har sinf interfeys implement qilsin"],"a":1,"e":"Go bu tamoyilning eng yaxshi namunasi: io.Reader, io.Writer — bittadan metod, va ular istalgancha birlashtiriladi (io.ReadWriter). Amaliy foyda: testda faqat kerakli metodni mock qilasiz. 'Accept interfaces, return structs' shiori ham shu bilan bog'liq."},{"l":"M","t":"mcq","tp":"SOLID","d":"arch","id":6027,"n":"F28","q":"Dependency Inversion (D) va Dependency Injection farqi?","o":["Bir xil narsa","DIP — tamoyil: yuqori darajadagi modul konkret implementatsiyaga emas, mavhumlikka (interfeys) bog'lansin va interfeys iste'molchiga tegishli bo'lsin. DI — shu bog'liqlikni tashqaridan (konstruktor/parametr orqali) uzatish texnikasi","DI faqat framework bilan mumkin","DIP faqat Java'da"],"a":1,"e":"Go'da: application qatlami OrderRepository interfeysini o'zi e'lon qiladi, postgres paketi uni implement qiladi, main esa ulaydi (qo'lda yoki wire bilan). Natija: domain kodni DB'siz test qilish mumkin va DB'ni almashtirish domainga tegmaydi. Framework shart emas — konstruktor yetarli."},{"l":"M","t":"open","tp":"SOLID","d":"arch","id":6028,"n":"F29","q":"SOLID'ni klasssiz tilda (Go) qanday qo'llaysiz?","m":["S: paket va struct bitta vazifaga; HTTP handler, biznes qoida va SQL alohida","O: yangi xulq yangi tip sifatida qo'shiladi (interfeys implementatsiyasi), mavjud funksiya o'zgarmaydi","L: interfeys kontraktini buzmaslik — 'not implemented' qaytaradigan implementatsiya alomat","I: kichik interfeyslar (1–3 metod), iste'molchi paketda e'lon qilinadi","D: konstruktorga interfeys uzatish, konkret tipni main'da ulash","Go'ga xos: embedding bilan xulqni birlashtirish, lekin meros iyerarxiyasi qurmaslik"],"e":"Intervyuda kuchli javob — tamoyilni ta'riflash emas, kodda qanday ko'rinishini va qachon ortiqcha bo'lishini aytish."},{"l":"S","t":"mcq","tp":"SOLID","d":"arch","id":30213,"n":"SN214","q":"Dependency Inversion amalda Go'da qanday ko'rinadi?","o":["Har joyda interfeys yaratish","Yuqori qatlam (use case) o'ziga kerakli interfeysni e'lon qiladi, past qatlam (Postgres adapter) uni implement qiladi — bog'liqlik yo'nalishi ichkariga qaraydi va domain infrastrukturani bilmaydi; ulash `main`/wiring'da","DI freymvork o'rnatish","Global o'zgaruvchilar"],"a":1,"e":"Muhim farq: DI (bog'liqlikni tashqaridan berish) va DIP (abstraksiyaga bog'lanish) — bir narsa emas. Go'da freymvork kerak emas: konstruktorlar va `main`da yig'ish yetarli. Signal: `domain` paketi `database/sql` yoki `net/http`ni import qilmasligi kerak — buni hatto linter qoidasi bilan majburlash mumkin."},{"l":"S","t":"mcq","tp":"OOP","d":"arch","id":30214,"n":"SN215","q":"Composition va inheritance: Go'da nega embedding ham ehtiyotkorlik talab qiladi?","o":["Embedding = inheritance, muammo yo'q","Embedding metodlarni yuqoriga ko'taradi — tashqi turning API'si kutilmaganda kengayadi (ichki turning barcha public metodlari oqib chiqadi) va keyinchalik ichki turni almashtirish breaking bo'ladi; aniq delegatsiya xavfsizroq","Embedding sekin","Faqat interfeyslarda ishlaydi"],"a":1,"e":"Misol: `struct{ sync.Mutex }` embed qilinsa `Lock`/`Unlock` tashqariga chiqadi va tashqi kod ichki qulfni boshqaradi. Shuning uchun `mu sync.Mutex` nomli maydon afzal. Embedding mos keladigan joy — haqiqiy 'is-a' emas, balki interfeys implementatsiyasini qayta ishlatish yoki dekorator qurish."},{"l":"S","t":"mcq","tp":"SOLID","d":"arch","id":30363,"n":"SN364","q":"Dependency Inversion amalda Go'da qanday ko'rinadi?","o":["Har joyda interfeys yaratish","Yuqori qatlam (use case) o'ziga kerakli interfeysni e'lon qiladi, past qatlam (Postgres adapter) uni implement qiladi — bog'liqlik yo'nalishi ichkariga qaraydi va domain infrastrukturani bilmaydi; ulash `main`/wiring'da","DI freymvork o'rnatish","Global o'zgaruvchilar"],"a":1,"e":"Muhim farq: DI (bog'liqlikni tashqaridan berish) va DIP (abstraksiyaga bog'lanish) — bir narsa emas. Go'da freymvork kerak emas: konstruktorlar va `main`da yig'ish yetarli. Signal: `domain` paketi `database/sql` yoki `net/http`ni import qilmasligi kerak — buni hatto linter qoidasi bilan majburlash mumkin."},{"l":"S","t":"mcq","tp":"OOP","d":"arch","id":30364,"n":"SN365","q":"Composition va inheritance: Go'da nega embedding ham ehtiyotkorlik talab qiladi?","o":["Embedding = inheritance, muammo yo'q","Embedding metodlarni yuqoriga ko'taradi — tashqi turning API'si kutilmaganda kengayadi (ichki turning barcha public metodlari oqib chiqadi) va keyinchalik ichki turni almashtirish breaking bo'ladi; aniq delegatsiya xavfsizroq","Embedding sekin","Faqat interfeyslarda ishlaydi"],"a":1,"e":"Misol: `struct{ sync.Mutex }` embed qilinsa `Lock`/`Unlock` tashqariga chiqadi va tashqi kod ichki qulfni boshqaradi. Shuning uchun `mu sync.Mutex` nomli maydon afzal. Embedding mos keladigan joy — haqiqiy 'is-a' emas, balki interfeys implementatsiyasini qayta ishlatish yoki dekorator qurish."},{"l":"S","t":"mcq","tp":"OOP","d":"arch","id":30472,"n":"SN473","q":"Anemic domain model nima va qachon maqbul?","o":["Har doim yomon","Ma'lumot va xatti-harakat ajralgan (getter/setter'li struct + service'da barcha mantiq). Murakkab invariantli domenlarda yomon (qoidalar tarqalib ketadi, invariantni kim saqlashi noaniq), lekin oddiy CRUD yoki ma'lumot o'tkazuvchi servislarda ortiqcha abstraksiyadan ko'ra sodda va maqbul","Har doim yaxshi","Faqat Java'da"],"a":1,"e":"Qaror mezoni — invariantlar soni va murakkabligi. 'Buyurtma faqat `paid` holatida jo'natilishi mumkin' kabi qoidalar bo'lsa, ular entity ichida bo'lishi kerak (holatni o'zgartiruvchi metodlar). Oddiy ma'lumot o'tkazuvchi (CRUD) servisda esa DDD to'liq apparati ortiqcha — bu ham senior darajadagi to'g'ri javob."},{"l":"S","t":"mcq","tp":"SOLID","d":"arch","id":30473,"n":"SN474","q":"Liskov substitution printsipi buzilishining amaliy belgisi?","o":["Ko'p interfeys","Subtip kutilmagan xatti-harakat keltiradi: kuchliroq old shart talab qiladi, zaifroq natija beradi yoki kutilmagan xato tashlaydi — natijada chaqiruvchi kod `if type == X` bilan tekshira boshlaydi (bu belgi)","Ko'p meros","Interfeys kichik"],"a":1,"e":"Go'da tipik misol: `io.Writer` implementatsiyasi qisman yozib xato qaytarmaydi yoki `Close`dan keyin ham yozishga ruxsat beradi — chaqiruvchi shartnomaga tayana olmaydi. Amaliy tekshiruv: bir xil test to'plamini barcha implementatsiyaga qo'llash (contract test) — o'tmasa LSP buzilgan."},{"l":"S","t":"mcq","tp":"Pattern","d":"arch","id":6029,"n":"F30","q":"Strategy pattern qachon kerak?","o":["Obyektni bitta nusxada saqlash uchun","Bir vazifani bajarishning bir nechta almashtiriladigan algoritmi bo'lsa (turli chegirma hisoblash, turli saralash, turli to'lov provayderi) — algoritm interfeys ortiga olinadi va ish vaqtida tanlanadi","Obyekt yaratishni yashirish uchun","Interfeysni moslashtirish uchun"],"a":1,"e":"Go'da strategiya ko'pincha oddiy funksiya tipi bilan ifodalanadi (type Discount func(Order) Money) — alohida struct shart emas. Alomat: uzun switch zanjiri har yangi holatda o'sib boryapti. Lekin ikki holat bo'lsa oddiy if ham yetarli — pattern o'zi maqsad emas."},{"l":"S","t":"mcq","tp":"Pattern","d":"arch","id":6030,"n":"F31","q":"Decorator pattern va HTTP middleware qanday bog'liq?","o":["Bog'liq emas","Middleware — decorator'ning aynan o'zi: mavjud handler'ni o'rab, uning oldidan/keyinidan xulq qo'shadi (log, auth, metrika) va asosiy interfeysni o'zgartirmaydi; ular zanjir bo'lib joylashadi","Middleware — bu singleton","Decorator faqat UI uchun"],"a":1,"e":"Go'da: func Logging(next http.Handler) http.Handler — kirish va chiqish bir xil tip, shuning uchun istalgancha zanjirlash mumkin. Tartib muhim: recover → request id → log → auth → rate limit → handler. Xuddi shu yondashuv gRPC interceptor va DB qatlamida ham ishlatiladi."},{"l":"S","t":"mcq","tp":"Pattern","d":"arch","id":6031,"n":"F32","q":"Singleton nega ko'pincha anti-pattern deb ataladi?","o":["Sekin ishlagani uchun","Global holat va yashirin bog'liqlik keltiradi: testda almashtirish qiyin, parallel testlar bir-biriga ta'sir qiladi, ishga tushish tartibi va konkurentlik muammolari paydo bo'ladi. Yaxshiroq: bitta nusxani main'da yaratib, bog'liqlik sifatida uzatish","Ko'p memory olgani uchun","Faqat Java'da muammo"],"a":1,"e":"Go'da tipik ko'rinishi: paket darajasidagi global DB yoki logger. Kichik ilovada qulay, lekin o'sgan sari og'riq beradi. init() ichida connection ochish — ayniqsa yomon: xatoni boshqarib bo'lmaydi va test uchun boshqa konfiguratsiya berib bo'lmaydi."},{"l":"S","t":"open","tp":"Pattern","d":"arch","id":6032,"n":"F33","q":"Jamoada 'hamma joyda pattern ishlatamiz' degan kod paydo bo'ldi — 5 row'lik mantiq uchun factory, builder va interfeys. Qanday yondashasiz?","m":["Pattern — muammoga javob, bezak emas: har mavhumlik uchun 'qanday real o'zgarish kutilyapti?' deb so'rash","YAGNI va rule of three: ikkinchi-uchinchi holat paydo bo'lgach umumlashtirish","O'lchov: kodni o'qib tushunish vaqti, o'zgartirish uchun nechta faylga tegish kerakligi","Review'da standart: yangi mavhumlik kiritilsa, uning sababini PR tavsifida yozish","Teskari tomon ham xavfli — takrorlanuvchi if zanjirlari; muvozanat konkret misollarda muhokama qilinadi","Jamoaviy kelishuv: kod uslubi hujjati va misollar"],"e":"Senior/Staff signal: 'to'g'ri' javobni emas, jamoada qaror qabul qilish yo'lini ko'rsatish. Ortiqcha mavhumlik ham, uning yo'qligi ham bir xil zarar — muhimi, o'zgarish ehtimoli asosida qaror qilish."},{"l":"S","t":"mcq","tp":"Pattern","d":"arch","id":30079,"n":"SN80","q":"Go'da tashqi API client uchun qaysi pattern kombinatsiyasi amaliy?","o":["Singleton + global o'zgaruvchi","Interface (port) + adapter, dekorator zanjiri (retry, circuit breaker, metrics, logging), va `Options` pattern bilan konfiguratsiya","Abstract factory har doim","Visitor"],"a":1,"e":"Dekorator zanjiri kesishuvchi masalalarni biznes mantiqdan ajratadi: `Metrics(Retry(Breaker(HTTPClient)))` — har qatlam mustaqil test qilinadi. Interface iste'molchi tomonda e'lon qilinadi (Go idiomasi), shuning uchun mock oson. Global singleton testni buzadi va lifecycle (shutdown, pool) boshqarilmaydi."},{"l":"S","t":"mcq","tp":"Pattern","d":"arch","id":30080,"n":"SN81","q":"Strategy pattern'ni qachon ishlatmaslik kerak?","o":["Har doim ishlatilsin","Variantlar 2 ta va o'zgarmasa — oddiy `if` yoki funksiya argumenti yetarli; abstraksiya faqat haqiqiy o'zgarish o'qi mavjud bo'lganda (uchinchi variant kelganida) qo'shiladi","Faqat Java'da","Test yozilmasa"],"a":1,"e":"Pattern narxi — indirection va o'qilishning pasayishi. 'Rule of three': uchinchi variant paydo bo'lganda abstraksiya real ehtiyojni aks ettiradi. Oldindan qo'yilgan interfeys ko'pincha noto'g'ri chiziqda bo'ladi va keyin refactor uni buzishdan ko'ra qiyinroq bo'ladi."},{"l":"S","t":"mcq","tp":"Pattern","d":"arch","id":30081,"n":"SN82","q":"Repository pattern'da eng ko'p uchraydigan xato?","o":["Interface ishlatish","Leaky abstraction: repository'dan ORM query builder yoki `*sql.Tx` chiqib ketadi, yoki har use case uchun `GetByXWithYSortedByZ` metodlar portlashi — natijada abstraksiya foyda bermaydi","DB'ni almashtirmaslik","Testda mock ishlatish"],"a":1,"e":"Repository maqsadi — domainni persistensiyadan ajratish, DB'ni almashtirish emas. Sog'lom yondashuv: domain atamalaridagi cheklangan metodlar to'plami (`FindActiveByTenant`), murakkab o'qishlar uchun alohida query/read model (CQRS yengil ko'rinishi), transaksiya boshqaruvi application qatlamida (Unit of Work) — domain uni bilmaydi."},{"l":"St","t":"mcq","tp":"Pattern","d":"arch","id":30082,"n":"SN83","q":"Outbox, Saga, CQRS — qaysi muammoni yechadi va narxi nima?","o":["Uchtasi ham bir xil","Outbox — dual write atomikligi (narxi: publisher va lag); Saga — taqsimlangan jarayon izchilligi (narxi: compensation mantiqi va eventual consistency); CQRS — o'qish/yozuv modellarini ajratish (narxi: sinxronlash kechikishi va ikki model)","Faqat CQRS amaliy","Narxi yo'q, hammasi foyda"],"a":1,"e":"Senior'dan farqlovchi savol: har pattern konkret muammoga javob, universal yaxshilanish emas. CQRS'ni event sourcing bilan aralashtirmaslik kerak — CQRS eventsiz ham (materiallashgan view/read replica) ishlaydi. Ular kiritilgandan keyin operatsion yuk (lag monitoringi, replay vositalari) paydo bo'ladi."},{"l":"S","t":"mcq","tp":"Pattern","d":"arch","id":30474,"n":"SN475","q":"Go'da funksional opsiyalar (functional options) naqshi qachon oqlanadi?","o":["Har konstruktorda","Ko'p ixtiyoriy parametrli va kelajakda kengayadigan komponentlarda (client, server, pool): `New(addr, WithTimeout(5*time.Second), WithRetry(3))` — orqaga moslik saqlanadi va nol qiymatlar aniq bo'ladi; 2-3 parametrli oddiy holatda esa struct config yetarli","Hech qachon","Faqat kutubxonalarda"],"a":1,"e":"Almashinuv: opsiyalar API'ni kengaytiriladigan qiladi, lekin kod hajmi va IDE orqali 'qanday parametrlar bor' savoli qiyinlashadi. Muqobil — `Config` struct + validatsiya (oddiy va o'qilishi oson), yoki ikkisining kombinatsiyasi: `New(cfg Config, opts ...Option)`."},{"l":"S","t":"mcq","tp":"Pattern","d":"arch","id":30504,"n":"SN505","q":"Circuit breaker'ning uch holati qanday ishlaydi?","o":["Ikki holat: ochiq va yopiq","Closed (so'rovlar o'tadi, xatolar sanaladi) → Open (chegaradan oshgach so'rovlar darhol rad etiladi, tiklanish taymeri ishlaydi) → Half-Open (cheklangan sinov so'rovlari; muvaffaqiyatli bo'lsa Closed, aks holda yana Open)","Faqat timeout bilan","Har doim ochiq"],"a":1,"e":"Amaliy sozlash nuqtalari: xato chegarasi nisbat bo'yicha (masalan 50% oxirgi 100 so'rovdan) va minimal so'rov soni bilan (kam trafikda tasodifan ochilmasin); Half-Open'da bir vaqtda faqat bir necha so'rov (aks holda qayta tiklanayotgan servisni yana yiqitasiz); va slow-call (latency) ham xato sifatida hisoblanishi kerak."},{"l":"S","t":"mcq","tp":"Pattern","d":"arch","id":30505,"n":"SN506","q":"Saga orchestrator'ni holat mashinasi sifatida qanday implement qilasiz?","o":["Cron bilan tekshirish","Har saga instansiyasi DB'da: joriy qadam, holat, retry soni, timeout vaqti; har tashqi javob (event/callback) holatni o'zgartiradi, o'tishlar idempotent; timeout bo'yicha compensation ishga tushadi; jarayon qayta ishga tushganda holatdan davom etadi","Xotirada ushlash","Faqat eventlar bilan, holat saqlamasdan"],"a":1,"e":"Holatsiz choreography'da 'buyurtma qaysi bosqichda qotib qoldi' savoliga javob yo'q — shuning uchun pul bilan bog'liq jarayonlarda orkestratsiya afzal. Tayyor vositalar (Temporal) shu mantiqni (durable execution, retry, timeout, versiyalash) o'zi beradi; o'z yechimida esa timeout skaneri va idempotentlik eng ko'p unutiladigan qismlar."},{"l":"St","t":"mcq","tp":"Pattern","d":"arch","id":30506,"n":"SN507","q":"Ports & adapters (hexagonal) arxitekturasi Go loyihada nimani beradi?","o":["Ko'proq fayl","Domen tashqi texnologiyadan mustaqil bo'ladi: portlar (interfeyslar) domen tomonidan e'lon qilinadi, adapterlar (Postgres, Kafka, HTTP) ularni implement qiladi — natijada domen testlari infrastrukturasiz ishlaydi va texnologiya almashtirish lokal bo'ladi","DB'ni almashtirish oson bo'ladi faqat","Performansni oshiradi"],"a":1,"e":"Amaliy foyda 'DB almashtirish' emas (bu kamdan-kam bo'ladi), balki tez va barqaror testlar hamda chegaralarning aniqligi. Narxi — ortiqcha qatlam: kichik CRUD servisda bu byurokratiyaga aylanadi. Qoida: murakkab domen mantiqi bor joyda qo'llash, oddiy o'tkazuvchi servislarda yo'q."},{"l":"M","t":"mcq","tp":"Clean code","d":"arch","id":6011,"n":"F12","q":"Coupling (bog'lanish) va cohesion (yaxlitlik) haqida to'g'ri gap?","o":["Ikkalasi ham yuqori bo'lishi kerak","Maqsad: past coupling (modullar bir-biriga kam bog'liq) va yuqori cohesion (bitta modul ichidagi kod bitta maqsadga xizmat qiladi)","Ikkalasi ham past bo'lishi kerak","Bular bir xil narsa"],"a":1,"e":"Amaliy o'lchov: bitta biznes o'zgarishi uchun nechta modulga tegish kerak (kam bo'lsa yaxshi), va modul ichidagi narsalar birga o'zgaradimi. Yuqori coupling alomatlari: umumiy 'utils' paketi hamma narsani biladi, modullar bir-birining ichki tuzilmasiga tayanadi, aylanma bog'liqliklar. Go'da import grafigi buni ko'rsatib beradi."},{"l":"M","t":"mcq","tp":"Clean code","d":"arch","id":6012,"n":"F13","q":"KISS, DRY va YAGNI tamoyillari orasidagi ziddiyat qanday hal qilinadi?","o":["DRY har doim column","DRY'ni ko'r-ko'rona qo'llash noto'g'ri mavhumlik yaratadi: tasodifan o'xshash ikki kod bir xil sabab bilan o'zgarmasa, ularni birlashtirmaslik kerak. Qoida: takrorlanish bilimda (biznes qoidasida) bo'lsa yomon, shaklda bo'lsa bardoshli","YAGNI faqat startaplarda","KISS kod qisqa bo'lishini anglatadi"],"a":1,"e":"Mashhur formulalar: 'duplication is far cheaper than the wrong abstraction' (Sandi Metz) va rule of three — uchinchi takrorda umumlashtirish. YAGNI: kelajakda kerak bo'lishi mumkin degan funksiyani bugun yozmaslik. KISS — soddalik: o'qiydigan odam uchun tushunarli yechim, eng aqlli yechim emas."},{"l":"M","t":"mcq","tp":"Architecture style","d":"arch","id":6013,"n":"F14","q":"Layered (qatlamli) va hexagonal (ports & adapters) arxitektura farqi?","o":["Bir xil narsa","Qatlamlida bog'liqlik yuqoridan pastga ketadi va domain ko'pincha DB qatlamiga tayanadi. Hexagonal'da domain markazda: u interfeys (port) e'lon qiladi, DB va HTTP esa tashqi adapterlar — bog'liqlik faqat ichkariga qaraydi","Hexagonal faqat oltita modul degani","Qatlamli arxitektura testlanmaydi"],"a":1,"e":"Clean/onion arxitektura ham shu g'oyaning variantlari: dependency inversion orqali domainni infratuzilmadan ajratish. Amaliy foyda: DB yoki transportni almashtirganda biznes qoidalar tegilmaydi va domain testlari infratuzilmasiz ishlaydi. Xavf: kichik CRUD servis uchun ortiqcha qatlam va mapping."},{"l":"S","t":"mcq","tp":"Architecture style","d":"arch","id":6014,"n":"F15","q":"CQRS nima va qachon oqlanadi?","o":["Ma'lumotni shifrlash usuli","O'qish va yozish modellarini ajratish: yozish tomoni invariantlarni himoya qiladi, o'qish tomoni query'ga moslangan (denormallashgan) model bilan ishlaydi. Oqlanadi: o'qish va yozish yuklari/modellari keskin farq qilganda","Har loyihada majburiy","Faqat event sourcing bilan ishlaydi"],"a":1,"e":"CQRS event sourcing'ni talab qilmaydi — eng sodda ko'rinishi: bir xil DB, lekin alohida read model (view yoki materialized view). To'liq ajratilgan read store bo'lsa — eventual consistency va sinxronizatsiya narxi paydo bo'ladi. Ko'p tizim uchun oddiy repository yetarli; CQRS'ni aniq muammo asoslashi kerak.","src":"https://martinfowler.com/bliki/CQRS.html"},{"l":"S","t":"mcq","tp":"Architecture style","d":"arch","id":6015,"n":"F16","q":"Repository va Active Record patternlari farqi?","o":["Bir xil","Active Record: obyekt o'z saqlanishini biladi (user.Save()) — sodda va tez, lekin domain va DB aralashadi. Repository: domain obyekti sof qoladi, saqlash alohida interfeys ortida — testlash va DDD uchun qulay, lekin ko'proq kod","Repository faqat NoSQL uchun","Active Record ORM emas"],"a":1,"e":"Tanlov kontekstga bog'liq: CRUD ko'p bo'lgan ilovada Active Record (Rails, Django) tez natija beradi; murakkab domen qoidalari bo'lsa Repository + Unit of Work afzal. Go'da odatda Repository interfeysi va sqlc/pgx implementatsiyasi ishlatiladi."},{"l":"S","t":"open","tp":"ADR","d":"arch","id":6016,"n":"F17","q":"Arxitektura qarorini qanday hujjatlashtirasiz?","m":["ADR (Architecture Decision Record): kontekst, ko'rib chiqilgan variantlar, qaror, oqibatlar va status","Har ADR qisqa (1 page) va kod bilan birga repo'da saqlanadi (docs/adr/0007-....md)","Muhimi — nima uchun rad etilganini yozish: keyin jamoa savolni qayta ochmaydi","Qaror o'zgarsa eski ADR o'chirilmaydi — 'superseded by 0012' deb belgilanadi","Qarashlarni oldindan kelishish uchun RFC/dizayn hujjati va jamoa review'i","Katta qarorlar uchun: xavflar, qaytarib olish narxi va o'lchanadigan mezonlar"],"e":"Senior/Staff signal: qarorning o'zi emas, jarayon va oqibatlar. Intervyuda 'siz qabul qilgan katta qarorni va uning oqibatlarini ayting' savoliga ADR strukturasi bilan javob berish juda yaxshi ishlaydi.","src":"https://adr.github.io/"},{"l":"S","t":"mcq","tp":"Architecture style","d":"arch","id":6017,"n":"F18","q":"Quality attribute'lar (performance, scalability, availability, maintainability, security) o'rtasida ziddiyat bo'lsa nima qilasiz?","o":["Hammasini maksimal level'da ta'minlash","Ular bir-biriga zid bo'lishi mumkin (masalan kuchli konsistentlik ↔ mavjudlik va latency): biznes talabiga qarab ustuvorlikni aniq belgilash, o'lchanadigan mezon qo'yish va trade-off'ni ADR'da yozish","Texnik jamoa o'zi hal qiladi, biznes bilmaydi","Doim performance column"],"a":1,"e":"Amaliy yondashuv: har atribut uchun raqam ('p99 < 300 ms', '99.9% availability', 'yangi feature 2 haftada') va shu raqamlarga arxitekturani moslash. 'Hammasi muhim' degan javob — yetuk bo'lmagan javob; intervyuchi aynan tanlov qila olishingizni ko'radi."},{"l":"S","t":"open","tp":"Refactoring","d":"arch","id":6018,"n":"F19","q":"Legacy kodga yangi feature qo'shish kerak, testlar yo'q. Qanday yondashasiz?","m":["Avval xulqni muzlatish: mavjud xulq uchun characterization test (hozirgi natijani qayd qiluvchi test) yozish","Seam topish: o'zgartirmoqchi bo'lgan joyni ajratib olish (interfeys kiritish, bog'liqlikni parametrga chiqarish)","Kichik, xavfsiz refactoring qadamlari — har qadamdan keyin testlar yashil","Yangi kodni yangi, toza modulda yozib, eskisiga minimal tegish (strangler)","Katta qayta yozishni taklif qilishdan oldin: risk, muddat va biznes qiymatini solishtirish","Monitoring va feature flag bilan bosqichli chiqarish"],"e":"Senior signal: 'hammasini qayta yozamiz' emas, xavfni boshqarish. Michael Feathers'ning 'legacy code = testsiz kod' ta'rifini aytish ham yaxshi taassurot qoldiradi."},{"l":"M","t":"mcq","tp":"Clean code","d":"arch","id":6019,"n":"F20","q":"Technical debt (texnik qarz) haqida qaysi yondashuv to'g'ri?","o":["Texnik qarz — har doim yomon kod","Qarz ongli ham bo'lishi mumkin (muddatga yetish uchun soddalashtirilgan yechim) — muhimi uni ko'rinadigan qilish: backlog'da vazifa, sababi va to'lash rejasi bilan; foizi esa sekinlashuv va incidentlarda ko'rinadi","Qarzni faqat refactoring sprintida to'lash mumkin","Qarz haqida biznesga aytmaslik kerak"],"a":1,"e":"Amaliy usul: har sprintda ma'lum ulush (masalan 10–20%) qarzga ajratish va qarzni biznes tilida tushuntirish ('bu joy tufayli har feature 2 kun ko'p vaqt oladi'). Ko'rinmas qarz — eng qimmati: hech kim uni rejalashtirmaydi, lekin hamma unga to'laydi."},{"l":"M","t":"mcq","tp":"Architecture style","d":"arch","id":6020,"n":"F21","q":"12-factor app tamoyillaridan qaysi biri to'g'ri?","o":["Konfiguratsiya kodga yoziladi","Konfiguratsiya muhitdan (env) olinadi, jarayonlar stateless va bo'lishadigan holatni backing service'da saqlaydi, loglar stdout'ga oqim sifatida yoziladi, dev va prod muhitlar iloji boricha yaqin","Har muhit uchun alohida build","Loglar fayllarga yozilib, o'zi boshqariladi"],"a":1,"e":"Bu tamoyillar konteyner va Kubernetes bilan tabiiy mos keladi: stateless jarayon — istalgancha nusxalash mumkin; env konfiguratsiya — bitta image hamma muhitda; stdout log — platforma yig'adi. Qo'shimcha muhim band: graceful shutdown (disposability) va admin vazifalarni bir martalik jarayon sifatida bajarish.","src":"https://12factor.net/"},{"l":"S","t":"mcq","tp":"Clean code","d":"arch","id":30215,"n":"SN216","q":"Funksiya 200 qator. Uni bo'lishning to'g'ri mezoni nima?","o":["Har 20 qatorda yangi funksiya","Mavhumlik darajasi bo'yicha: bir funksiya bir darajadagi qarorlarni bajarsin, ajratilgan qism mustaqil nom oladigan ma'noga ega bo'lsin; sun'iy bo'lish (faqat qator soni uchun) o'qishni yomonlashtiradi","Uzunlik muhim emas","Faqat testlash uchun bo'lish"],"a":1,"e":"Yaxshi ajratish belgisi: yangi funksiyaga aniq nom topiladi va u 3-4 argumentdan ko'p talab qilmaydi. Yomon ajratish belgisi: `processPart2(a, b, c, d, e, f)` — holat argumentlar orqali sudralib yuradi. Amaliy yondashuv: avval nomlash (nima qilinadi), keyin chegara — shunda kod o'qilishi hikoya kabi bo'ladi."},{"l":"S","t":"mcq","tp":"ADR","d":"arch","id":30216,"n":"SN217","q":"ADR (Architecture Decision Record) nimani o'z ichiga olishi kerak?","o":["Faqat tanlangan texnologiya nomi","Kontekst (qanday muammo va cheklovlar), ko'rib chiqilgan variantlar va ularning almashinuvlari, qabul qilingan qaror va sabab, natijalar/oqibatlar, holat (taklif/qabul/bekor) va sana","UML diagramma","Kod namunasi"],"a":1,"e":"ADR'ning qiymati — 'nega' ni saqlash: 6 oydan keyin kelgan odam qarorni takrorlamasdan qayta ko'rib chiqa oladi. Eng ko'p tashlab ketiladigan qism — rad etilgan variantlar va ularning sababi. ADR qisqa (1 sahifa), repo ichida versiyalangan va o'zgarganda yangi ADR bilan bekor qilinadi (tahrir qilinmaydi)."},{"l":"S","t":"mcq","tp":"Clean code","d":"arch","id":30279,"n":"SN280","q":"Code review'da nimalarga birinchi qaraladi?","o":["Formatlash va o'zgaruvchi nomlari","To'g'rilik va xavfsizlik (race, ruxsat tekshiruvi, SQL/input validatsiya, xato ishlovi), keyin kontrakt/dizayn (API va sxema o'zgarishi mos keladimi, migratsiya xavfsizmi), keyin testlar, keyin o'qilishi; formatlash va uslub linter/formatter zimmasida","Faqat testlar soni","Faqat performance"],"a":1,"e":"Senior review'ning qiymati aynan yuqori qatlamda: bu o'zgarish rollback qilinsa nima bo'ladi, migratsiya qulf oladimi, yangi endpoint ruxsatni tekshiradimi, xato qanday kuzatiladi. Nit'lar `nit:` deb belgilanadi va bloklamaydi; katta dizayn e'tirozi esa PR'da emas, oldindan (ADR/dizayn muhokamasi) aytilishi kerak."},{"l":"St","t":"mcq","tp":"Refactoring","d":"arch","id":30280,"n":"SN281","q":"Katta legacy modulni xavfsiz refactor qilish strategiyasi?","o":["Bir relizda qayta yozish","Avval xatti-harakatni qotirish (characterization testlar), keyin kichik qadamlar: seam/abstraksiya qo'shish (branch-by-abstraction), yangi implementatsiyani flag ostida yonma-yon ishlatish (shadow/dual-run bilan natijalarni solishtirish), so'ng eskisini o'chirish","Testlarni keyin yozish","Faqat yangi kodni yozib eskisini qoldirish"],"a":1,"e":"Katta 'big bang' qayta yozish deyarli har doim muddatdan chiqadi va bir vaqtda ikki tizimni saqlashga olib keladi. Shadow run (ikkalasini ishlatib natijalarni solishtirish, faqat eskisining javobini qaytarish) — pul yoki hisob-kitobga tegishli modullarda eng xavfsiz usul. Har qadamda deploy qilinadigan holat saqlanadi."},{"l":"S","t":"mcq","tp":"Clean code","d":"arch","id":30365,"n":"SN366","q":"Funksiya 200 qator. Uni bo'lishning to'g'ri mezoni nima?","o":["Har 20 qatorda yangi funksiya","Mavhumlik darajasi bo'yicha: bir funksiya bir darajadagi qarorlarni bajarsin, ajratilgan qism mustaqil nom oladigan ma'noga ega bo'lsin; sun'iy bo'lish (faqat qator soni uchun) o'qishni yomonlashtiradi","Uzunlik muhim emas","Faqat testlash uchun bo'lish"],"a":1,"e":"Yaxshi ajratish belgisi: yangi funksiyaga aniq nom topiladi va u 3-4 argumentdan ko'p talab qilmaydi. Yomon ajratish belgisi: `processPart2(a, b, c, d, e, f)` — holat argumentlar orqali sudralib yuradi. Amaliy yondashuv: avval nomlash (nima qilinadi), keyin chegara — shunda kod o'qilishi hikoya kabi bo'ladi."},{"l":"S","t":"mcq","tp":"ADR","d":"arch","id":30366,"n":"SN367","q":"ADR (Architecture Decision Record) nimani o'z ichiga olishi kerak?","o":["Faqat tanlangan texnologiya nomi","Kontekst (qanday muammo va cheklovlar), ko'rib chiqilgan variantlar va ularning almashinuvlari, qabul qilingan qaror va sabab, natijalar/oqibatlar, holat (taklif/qabul/bekor) va sana","UML diagramma","Kod namunasi"],"a":1,"e":"ADR'ning qiymati — 'nega' ni saqlash: 6 oydan keyin kelgan odam qarorni takrorlamasdan qayta ko'rib chiqa oladi. Eng ko'p tashlab ketiladigan qism — rad etilgan variantlar va ularning sababi. ADR qisqa (1 sahifa), repo ichida versiyalangan va o'zgarganda yangi ADR bilan bekor qilinadi (tahrir qilinmaydi)."},{"l":"M","t":"mcq","tp":"Testing","d":"arch","id":80,"n":81,"q":"Test piramidasi nimani anglatadi?","o":["Ko'p E2E test, kam unit test","Ko'p tez unit test (asos), o'rtada integratsiya/kontrakt testlari, eng yuqorida kam sonli E2E test — chunki E2E sekin va mo'rt (flaky)","Faqat E2E yetarli","Testlar soni ahamiyatsiz"],"a":1,"e":"Mikroservislarda kontrakt testlari alohida muhim (Pact yoki OpenAPI/proto asosida): servislarni birga ko'tarmasdan moslikni tekshiradi. Flaky testlar — alohida muammo: ularni ajratib, sababini tuzatish kerak, aks holda jamoa CI natijasiga ishonmay qo'yadi."},{"l":"J","t":"mcq","tp":"TDD","d":"arch","id":5022,"n":"V23","q":"TDD sikli qanday?","o":["Kod yoz → test yoz → refactor","Red (yiqiladigan test yoz) → Green (o'tkazadigan eng sodda kodni yoz) → Refactor (testlar yashil turganda tozala)","Test yoz → deploy → tuzat","Faqat integratsiya testlari yozish"],"a":1,"e":"Maqsad — test yozish emas, dizaynni tashqaridan boshlash va har qadamda ishlaydigan kodga ega bo'lish. Qadamlar kichik bo'lishi shart. Test avval yozilganda kod tabiiy ravishda mock qilinadigan chegaralarga (interfeys) ega bo'ladi. Go'da: table'li testlar (table-driven), t.Run bilan subtest, testify ixtiyoriy."},{"l":"M","t":"mcq","tp":"TDD","d":"arch","id":5023,"n":"V24","q":"Nimani mock qilish kerak?","o":["Hamma narsani — har bog'liqlikni","Tashqi chegaralarni: network chaqiruvlari, to'lov provayderi, soat/tasodif. DB va queue uchun ko'pincha real instance (testcontainers) yaxshiroq. O'z domain kodingizni mock qilish — testni implementatsiyaga bog'lab qo'yadi","Faqat DB ni","Hech narsani, doim real tizim"],"a":1,"e":"Ortiqcha mock alomati: refactor qilganda mantiq o'zgarmasa ham o'nlab test yiqiladi — testlar xulqni emas, ichki tuzilmani tekshiryapti. Amaliyot: domain sof funksiyalarda (mock kerak emas), adapterlar uchun kontrakt testlari, kritik oqim uchun testcontainers bilan integratsiya testi."},{"l":"M","t":"open","tp":"BDD","d":"arch","id":5024,"n":"V25","q":"BDD nima va TDD dan farqi nimada?","m":["BDD — xulqni biznes tilida tasvirlash: Given (boshlang'ich holat) / When (harakat) / Then (kutilgan natija)","Asosiy qiymat — hujjat va umumiy til: PO, QA va dasturchi bir xil ssenariyni o'qiydi","TDD — dasturchi uchun dizayn texnikasi (unit level); BDD — xulq va qabul mezoni (feature level)","Ssenariylar birgalikda yoziladi (three amigos), keyin avtomatlashtiriladi (Cucumber, Go'da godog)","Xavf: Gherkin'ni texnik qadamlar bilan to'ldirib yuborish — u biznes tilida qolishi kerak"],"e":"Vakansiyada TDD/BDD/DDD birga turibdi — javobda uchalasi bir-birini qanday to'ldirishini ayting: DDD — til va model, BDD — xulq mezoni, TDD — implementatsiya ritmi."},{"l":"S","t":"mcq","tp":"DDD","d":"arch","id":5025,"n":"V26","q":"DDD'da aggregate uchun asosiy qoida?","o":["Har table — alohida aggregate","Aggregate — konsistentlik chegarasi: invariantlar uning ichida saqlanadi, tashqaridan faqat root orqali kirasiz, boshqa aggregate'ga faqat ID bilan ishora qilinadi va bitta transaction'da bitta aggregate o'zgartiriladi","Aggregate'lar bir-birini to'g'ridan-to'g'ri o'zgartiradi","Aggregate — bu DTO"],"a":1,"e":"Bitta transaction'da bitta aggregate qoidasi lock contention va masshtabni hal qiladi; aggregate'lar orasidagi konsistentlik — domain event orqali eventual. Order aggregate ichida OrderLine'lar bo'ladi, lekin Customer — ID bilan. Aggregate kattalashsa — transaction og'irlashadi; kichik bo'lsa — invariantni saqlash qiyin.","src":"https://martinfowler.com/bliki/DDD_Aggregate.html"},{"l":"S","t":"open","tp":"DDD","d":"arch","id":5026,"n":"V27","q":"Go loyihasini DDD/hexagonal (ports & adapters) uslubida qanday tashkil qilasiz?","m":["domain: entity, value object, domain servis, domain event — tashqi kutubxonalarsiz (sql, http, kafka importi yo'q)","application (use case): transaction chegarasi, repository interfeyslari shu yerda e'lon qilinadi (port)","adapters/infrastructure: postgres repository, kafka producer/consumer, http handler (driven va driving adapterlar)","Bog'liqlik yo'nalishi faqat ichkariga: domain hech kimni bilmaydi; wire/konstruktorda ulanadi","Go amaliyoti: interfeys iste'molchi paketda, kichik interfeyslar; /internal ostida bounded context bo'yicha papkalar (order/, billing/)","Test: domain — sof unit test, adapter — testcontainers bilan integratsiya"],"e":"Vakansiyada DDD alohida ko'rsatilgan — bu javob to'g'ridan-to'g'ri baholanadi. Kuchli signal: 'papka nomi emas, bog'liqlik yo'nalishi muhim' va ubiquitous language (kod nomlari biznes atamalari bilan bir xil)."},{"l":"S","t":"open","tp":"Testing","d":"arch","id":14020,"n":"SR21","q":"Backend servis uchun test strategiyasini tuzing (senior darajada kutiladigan javob).","m":["Unit: sof domain mantiq, tez va bog'liqliksiz — eng ko'p sonli qatlam","Integratsiya: real DB va broker bilan (testcontainers), migratsiyalar ham test qilinadi","Kontrakt: servislararo (Pact yoki OpenAPI/proto asosida) — servislarni birga ko'tarmasdan","E2E: kam sonli, eng muhim foydalanuvchi oqimlari; flaky bo'lsa darhol tuzatish yoki o'chirish","Nofunksional: yuk testi (p99 va to'yinish nuqtasi), xaos/nosozlik testlari, xavfsizlik skanlari","CI: -race, coverage o'sishini kuzatish (maqsad emas), test ma'lumotini tozalash va izolyatsiya"],"e":"Kuchli javob testlarni 'ishonch narxi' nuqtai nazaridan tushuntiradi: qaysi xatoni qaysi qatlam ushlaydi va har qatlam qancha vaqt oladi."},{"l":"S","t":"mcq","tp":"Testing","d":"arch","id":14023,"n":"SR24","q":"Go'da DB bilan ishlaydigan kodni qanday test qilasiz?","o":["Har narsani mock qilish","Repository interfeysini mock qilish — biznes mantiq uchun; DB bilan ishlashning o'zini esa real Postgres bilan (testcontainers yoki lokal instance) integratsiya testida: SQL, migratsiya va indekslar faqat shunda tekshiriladi","Faqat production'da tekshirish","sqlmock bilan hamma narsani qoplash"],"a":1,"e":"sqlmock SQL matnini solishtiradi — refactor'da sinadi va real xulqni tekshirmaydi (constraint, tip, tranzaksiya). Amaliy taqsimot: domain — unit test, repository — integratsiya testi, handler — httptest bilan. Har test o'z sxemasi yoki tranzaksiya rollback'i bilan izolyatsiya qilinadi."},{"l":"S","t":"mcq","tp":"Testing","d":"arch","id":14024,"n":"SR25","q":"Go'da benchmark va fuzzing qachon ishlatiladi?","o":["Faqat kutubxona mualliflari uchun","Benchmark (go test -bench -benchmem) — optimizatsiyadan oldin va keyin o'lchash uchun; fuzzing (go test -fuzz) — parser, validator, kodlash/dekodlash kabi kirishga bog'liq kod uchun: kutilmagan panic va chegara holatlarini topadi","Benchmark kod to'g'riligini tekshiradi","Fuzzing faqat xavfsizlik jamoasi ishi"],"a":1,"e":"Amaliy qoida: 'optimallashtirdim' degan har da'vo benchmark bilan isbotlanadi (benchstat bilan taqqoslash). Fuzzing Go 1.18 dan standart: topilgan har holat testdata'ga tushadi va regressiya testiga aylanadi.","src":"https://go.dev/doc/tutorial/fuzz"},{"l":"S","t":"mcq","tp":"Testing","d":"arch","id":30083,"n":"SN84","q":"Integratsion testlarda DB uchun eng ishonchli yondashuv?","o":["Mock DB (sqlmock) hamma joyda","Haqiqiy DB (testcontainers/docker) + har test uchun izolyatsiya: transaksiyada bajarib rollback qilish yoki har testga alohida sxema/DB; migratsiyalar test boshida ishga tushiriladi","SQLite'ni PostgreSQL o'rniga","Umumiy stage DB'ga ulanish"],"a":1,"e":"sqlmock faqat chaqiruv satrini tekshiradi — SQL to'g'riligini, indeks, constraint, isolation xatti-harakatini ko'rsatmaydi. SQLite dialekt farqlari sabab yolg'on ishonch beradi. Parallel testlarda transaksiya-rollback eng tez (lekin commit xatti-harakati va trigger testida yaramaydi), aks holda sxema-per-test."},{"l":"S","t":"mcq","tp":"TDD","d":"arch","id":30084,"n":"SN85","q":"Test yozildi, lekin refactor qilganda barcha test buziladi. Nima noto'g'ri?","o":["Refactor qilmaslik kerak","Testlar implementatsiyaga bog'langan (mock chaqiruvlar ketma-ketligi, ichki metodlar) — xatti-harakat (observable behaviour) emas; testlar public kontrakt orqali yozilishi kerak","Mock kam ishlatilgan","Test soni kam"],"a":1,"e":"Yaxs
