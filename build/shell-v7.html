<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Interview Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#eef2f1; --panel:#ffffff; --ink:#15211f; --muted:#5b6b68; --line:#d5dedb;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#d7efec;
  --code-bg:#12201e; --code-ink:#d6ebe7;
  --ok:#15803d; --ok-soft:#dcf3e3; --bad:#b91c1c; --bad-soft:#fbe3e3; --mid:#b45309; --mid-soft:#fbeed8;
  --sans:"Manrope",system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1413; --panel:#141f1d; --ink:#e3eeeb; --muted:#93a7a2; --line:#263633;
  --accent:#2dd4bf; --accent-ink:#06201d; --accent-soft:#123a36;
  --code-bg:#071010; --code-ink:#cfe7e2;
  --ok:#4ade80; --ok-soft:#12321f; --bad:#f87171; --bad-soft:#3a1616; --mid:#fbbf24; --mid-soft:#3a2a0f;
}}
:root[data-theme="dark"]{
  --bg:#0c1413; --panel:#141f1d; --ink:#e3eeeb; --muted:#93a7a2; --line:#263633;
  --accent:#2dd4bf; --accent-ink:#06201d; --accent-soft:#123a36;
  --code-bg:#071010; --code-ink:#cfe7e2;
  --ok:#4ade80; --ok-soft:#12321f; --bad:#f87171; --bad-soft:#3a1616; --mid:#fbbf24; --mid-soft:#3a2a0f;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:start}
@media (max-width:820px){.wrap{grid-template-columns:1fr}}
header.top{max-width:1080px;margin:0 auto 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0}
h1 span{font-family:var(--mono);font-weight:600;color:var(--accent);font-size:.8em}
.sub{color:var(--muted);margin:0;font-size:14px}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:grid;gap:18px}
@media (max-width:820px){aside{position:static}}
.group h3{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 13px var(--sans);padding:5px 10px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:focus-visible,.btn:focus-visible,.opt:focus-visible,textarea:focus-visible,.dot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.acc{display:grid;gap:6px}
.acc-all{text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:700 13px var(--sans);padding:8px 12px;border-radius:8px;cursor:pointer}
.acc-all[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.acc-item{border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.acc-item.on{border-color:var(--accent)}
.acc-item summary{list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 12px;cursor:pointer;font-weight:700;font-size:13px}
.acc-item summary::-webkit-details-marker{display:none}
.acc-item summary::before{content:"▸";color:var(--muted);margin-right:6px;transition:transform .15s}
.acc-item[open] summary::before{transform:rotate(90deg)}
.acc-item summary span{flex:1}
.acc-item summary b{font:600 11px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.acc-item summary:focus-visible,.acc-all:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.acc-body{display:grid;gap:6px;padding:0 10px 10px}
.acc-dom>summary{font-size:14px;letter-spacing:.01em}
.acc-dom .acc-item{background:var(--bg)}
.acc-item .chips{padding:0 2px 2px}
.acc-item .chip{font-size:12px;padding:4px 9px}
.stats{display:grid;gap:6px;font-size:13px}
.srow{display:grid;grid-template-columns:70px 1fr 48px;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.srow b{text-align:right;font-weight:600;color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dot{width:22px;height:22px;border-radius:5px;border:1px solid var(--line);background:var(--panel);font:600 10px var(--mono);color:var(--muted);cursor:pointer;padding:0}
.dot.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.dot.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.dot.mid{background:var(--mid-soft);border-color:var(--mid);color:var(--mid)}
.dot.cur{outline:2px solid var(--ink);outline-offset:1px}
main.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;min-width:0}
@media (max-width:500px){main.card{padding:18px}}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;font-size:12px}
.tag{font:600 11px var(--mono);padding:3px 8px;border-radius:4px;background:var(--accent-soft);color:var(--ink);letter-spacing:.02em}
.tag.lvl{background:var(--ink);color:var(--panel)}
.meta .pos{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.q{font-size:18px;font-weight:700;line-height:1.45;margin:0 0 14px;text-wrap:balance}
pre{background:var(--code-bg);color:var(--code-ink);font:13px/1.55 var(--mono);padding:14px 16px;border-radius:8px;overflow-x:auto;margin:0 0 16px;white-space:pre}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 15px/1.5 var(--sans);padding:11px 14px;border-radius:9px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font:600 12px var(--mono);width:24px;height:24px;display:grid;place-items:center;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.opt code,.exp code,.q code{font-family:var(--mono);font-size:.88em;background:var(--accent-soft);padding:1px 5px;border-radius:4px}
textarea{width:100%;min-height:130px;resize:vertical;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);padding:12px}
textarea.sql{font-family:var(--mono);font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:700 14px var(--sans);padding:9px 16px;border-radius:8px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:default}
.spacer{flex:1}
.hint{font-size:12px;color:var(--muted)}
.verdict{margin-top:18px;padding:12px 14px;border-radius:9px;font-weight:700}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict.mid{background:var(--mid-soft);color:var(--mid)}
.exp{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}
.exp h4{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.exp p{margin:0 0 10px;max-width:68ch;white-space:pre-line}
.exp ul{margin:0 0 12px;padding-left:20px}
.src{font-size:12px;color:var(--muted);word-break:break-all;margin:0 0 4px}
.src a{color:var(--accent);font-weight:700}
.src span{opacity:.75}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.keys span{font:600 12px var(--mono);padding:2px 8px;border-radius:4px;border:1px solid var(--line)}
.keys span.hit{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.keys span.miss{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.self{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
@media (prefers-reduced-motion:no-preference){.opt,.chip,.btn{transition:background .15s,border-color .15s}}
</style>

<header class="top">
  <div>
    <h1>Interview Drill <span>DB + Backend</span></h1>
    <p class="sub">Junior → Principal · ABC, kod, SQL yozish, ochiq savol · tekshirgandan keyin izoh</p>
  </div>
  <p class="sub">Klaviatura: <b>1–4</b> tanlash · <b>Enter</b> tekshirish · <b>← →</b> savol</p>
</header>

<div class="wrap">
  <aside>
    <div class="group"><h3>Bo'limlar</h3><div class="acc" id="acc"></div></div>
    <div class="group"><h3>Daraja</h3><div class="chips" id="f-lvl"></div></div>
    <div class="group"><h3>Savol turi</h3><div class="chips" id="f-type"></div></div>
    <div class="group"><h3>Ko'rsatish</h3><div class="chips" id="f-show"></div></div>
    <div class="group"><h3>Natija (daraja bo'yicha)</h3><div class="stats" id="stats"></div></div>
    <div class="group"><h3>Savollar</h3><div class="dots" id="dots"></div></div>
    <div class="group"><button class="btn" id="reset" type="button">Natijani tozalash</button></div>
  </aside>
  <main class="card" id="card"></main>
</div>

<script>
const LV={J:"Junior",M:"Middle",S:"Senior",St:"Staff",P:"Principal"};
const TY={mcq:"ABC",code:"Kod",sql:"SQL yoz",open:"Ochiq"};
const QD=[
// ---------- JUNIOR ----------
{l:"J",t:"mcq",tp:"Keys",q:"PRIMARY KEY va UNIQUE constraint o'rtasidagi asosiy farq?",
 o:["Farqi yo'q, ikkalasi ham bir xil","PRIMARY KEY NULL qabul qilmaydi va jadvalda faqat bitta bo'ladi; UNIQUE bir nechta bo'lishi va (ko'p DBda) NULL qabul qilishi mumkin","UNIQUE index yaratmaydi, PRIMARY KEY yaratadi","PRIMARY KEY faqat integer bo'lishi mumkin"],a:1,
 e:"PRIMARY KEY = UNIQUE + NOT NULL, jadvalda bittagina. UNIQUE constraint bir nechta bo'lishi mumkin va Postgres/MySQLda bir nechta NULL qiymatga ruxsat beradi (NULL ≠ NULL). Ikkalasi ham ostida unique index yaratadi. PK har qanday tipda bo'lishi mumkin (uuid, text, composite)."},
{l:"J",t:"mcq",tp:"JOIN",q:"Chap jadvaldagi <b>barcha</b> qatorlarni, o'ngda mos kelmasa ham, qaytaradigan JOIN?",
 o:["INNER JOIN","LEFT JOIN","RIGHT JOIN","CROSS JOIN"],a:1,
 e:"LEFT JOIN chap tomonning hamma qatorini qaytaradi; o'ngda mos yo'q bo'lsa o'ng ustunlar NULL bo'ladi. INNER faqat mos kelganlarini, CROSS Dekart ko'paytmani beradi. Tipik tuzoq: LEFT JOINdan keyin WHERE da o'ng jadval ustunini filtrlash uni amalda INNER JOINga aylantiradi — shartni ON ga qo'yish kerak."},
{l:"J",t:"code",tp:"NULL",q:"Natija nima bo'ladi?",c:"CREATE TABLE t(x int);\nINSERT INTO t VALUES (1),(NULL),(3);\n\nSELECT COUNT(*), COUNT(x), SUM(x), AVG(x) FROM t;",
 o:["3, 3, 4, 1.33","3, 2, 4, 2","2, 2, 4, 2","3, 2, NULL, NULL"],a:1,
 e:"COUNT(*) qatorlarni sanaydi (3). COUNT(x), SUM, AVG kabi aggregatlar NULLni e'tiborsiz qoldiradi: COUNT(x)=2, SUM=4, AVG=4/2=2. Intervyuda ko'p so'raladi: AVG NULLni 0 deb hisoblamaydi — kerak bo'lsa AVG(COALESCE(x,0))."},
{l:"J",t:"mcq",tp:"SQL",q:"WHERE va HAVING farqi?",
 o:["Farqi yo'q","WHERE guruhlashdan oldin qatorlarni, HAVING guruhlashdan keyin guruhlarni filtrlaydi","HAVING faqat JOIN bilan ishlaydi","WHERE aggregat funksiyalar bilan ishlaydi, HAVING ishlamaydi"],a:1,
 e:"Mantiqiy tartib: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT. Shuning uchun WHERE ichida COUNT(*) yozib bo'lmaydi, HAVING da esa mumkin. Performance maslahati: aggregatsiz shartni HAVING emas WHERE ga qo'ying — kamroq qator guruhlanadi."},
{l:"J",t:"sql",tp:"GROUP BY",q:"<code>employees(id, name, department_id, salary)</code>. 5 tadan ko'p xodimi bor bo'limlarni va xodimlar sonini qaytaring.",
 m:"SELECT department_id, COUNT(*) AS cnt\nFROM employees\nGROUP BY department_id\nHAVING COUNT(*) > 5;",k:["GROUP BY","HAVING","COUNT"],
 e:"Guruh bo'yicha shart — HAVING. Ko'p xato: WHERE COUNT(*) > 5 — bu xato beradi. Qo'shimcha: bo'lim nomi kerak bo'lsa departments bilan JOIN qilib, GROUP BY ga d.id, d.name qo'shiladi."},
{l:"J",t:"open",tp:"Design",q:"Normalizatsiya nima? 1NF, 2NF, 3NF ni misol bilan tushuntiring.",
 m:["1NF: har katakda atomar qiymat, takrorlanuvchi guruh yo'q (phones='1,2,3' — yomon)","2NF: 1NF + composite key bo'lsa, har non-key ustun butun keyga bog'liq (qisman bog'liqlik yo'q)","3NF: 2NF + tranzitiv bog'liqlik yo'q (orders.customer_city — customer orqali bog'liq, alohida jadvalga)","Maqsad: takrorlanishni va update/insert/delete anomaliyalarini kamaytirish","Trade-off: ko'p JOIN; o'qish og'ir tizimlarda ongli denormalizatsiya qilinadi"],
 e:"Intervyuchi ta'rifni emas, anomaliyani tushunishingizni tekshiradi: bitta faktni ikki joyda saqlasangiz, bittasini yangilab ikkinchisini unutasiz. Qisqa formula: 'kalitga, butun kalitga va faqat kalitga bog'liq'."},
{l:"J",t:"mcq",tp:"NULL",q:"<code>SELECT NULL = NULL;</code> nima qaytaradi?",
 o:["TRUE","FALSE","NULL (unknown)","Xato"],a:2,
 e:"SQL uch qiymatli mantiqda ishlaydi: TRUE/FALSE/UNKNOWN. NULL bilan har qanday taqqoslash NULL beradi. Shuning uchun IS NULL / IS DISTINCT FROM ishlatiladi. WHERE faqat TRUE qatorlarni o'tkazadi — UNKNOWN tushib qoladi."},
{l:"J",t:"mcq",tp:"Transactions",q:"ACID dagi <b>A</b> nimani anglatadi?",
 o:["Availability — tizim doim ishlaydi","Atomicity — tranzaksiya yo to'liq bajariladi, yo umuman bajarilmaydi","Authorization — ruxsat tekshiriladi","Asynchrony — asinxron yozish"],a:1,
 e:"Atomicity: hammasi yoki hech narsa (pul o'tkazmasida debit va credit birga). C — Consistency (constraintlar buzilmaydi), I — Isolation (parallel tranzaksiyalar bir-birini ko'rmaydi), D — Durability (commit bo'lgan narsa crashdan keyin ham qoladi, WAL orqali). Availability — bu CAP dan, ACID dan emas."},
{l:"J",t:"mcq",tp:"SQL",q:"DELETE, TRUNCATE, DROP farqi bo'yicha qaysi to'g'ri?",
 o:["Uchalasi ham faqat ma'lumotni o'chiradi","DELETE qatorlarni WHERE bilan o'chiradi (trigger ishlaydi); TRUNCATE hamma qatorni tez o'chiradi, struktura qoladi; DROP jadvalni butunlay o'chiradi","TRUNCATE jadval strukturasini o'chiradi","DROP ni rollback qilib bo'lmaydi, DELETE ni ham"],a:1,
 e:"DELETE qatorma-qator, loglanadi, ROW triggerlar ishlaydi, sekin. TRUNCATE sahifalarni tashlaydi — tez, lekin kuchli lock oladi. DROP — jadval, index, constraint hammasi yo'q. Postgresda TRUNCATE va DROP ham tranzaksiya ichida rollback qilinadi (MySQLda DDL implicit commit)."},
{l:"J",t:"sql",tp:"Subquery",q:"<code>employees(salary)</code> dan ikkinchi eng katta maoshni toping (takror maoshlar bo'lishi mumkin).",
 m:"SELECT MAX(salary) FROM employees\nWHERE salary < (SELECT MAX(salary) FROM employees);\n\n-- yoki\nSELECT DISTINCT salary FROM employees\nORDER BY salary DESC OFFSET 1 LIMIT 1;",k:["MAX|DENSE_RANK|OFFSET","DISTINCT|<|DENSE_RANK"],
 e:"Klassik savol. DISTINCT'siz ORDER BY ... OFFSET 1 xato beradi agar top maosh ikki kishida bo'lsa. N-chi uchun eng umumiy yechim: DENSE_RANK() OVER (ORDER BY salary DESC) = N. Ikkinchi maosh bo'lmasa MAX variant NULL qaytaradi — bu odatda kerakli xulq."},
{l:"J",t:"mcq",tp:"Keys",q:"FOREIGN KEY asosan nima uchun kerak?",
 o:["Qidiruvni tezlashtirish uchun","Referential integrity: bola jadvaldagi qiymat ota jadvalda mavjud bo'lishini kafolatlash","Ma'lumotni shifrlash uchun","Jadvalni shard qilish uchun"],a:1,
 e:"FK mavjud bo'lmagan user_id bilan order yaratishga yo'l qo'ymaydi, ON DELETE CASCADE/RESTRICT/SET NULL xulqini beradi. Diqqat: Postgres FK ustunga avtomatik index yaratmaydi — bola jadvaldagi FK ustunga index qo'yish kerak, aks holda ota qatorni o'chirishda seq scan va lock muammosi."},
{l:"J",t:"code",tp:"NULL",q:"PostgreSQLda natija tartibi qanday?",c:"-- names: 'Ali', NULL, 'Bek'\nSELECT name FROM users ORDER BY name;",
 o:["NULL, Ali, Bek","Ali, Bek, NULL","Ali, NULL, Bek","Xato: NULL tartiblanmaydi"],a:1,
 e:"Postgres NULLni eng katta qiymat deb hisoblaydi: ASC da oxirida, DESC da boshida. MySQL/SQLite aksincha (NULL eng kichik). Aniq boshqarish: ORDER BY name NULLS FIRST / NULLS LAST. Index ham shu tartibda bo'lishi kerak, aks holda index ishlatilmasligi mumkin."},
{l:"J",t:"open",tp:"Index",q:"Index nima, qanday ishlaydi va uning narxi nima?",
 m:["Alohida saralangan struktura (odatda B-tree): kalit → qator manzili (TID)","Qidiruv O(n) seq scan o'rniga O(log n)","WHERE, JOIN, ORDER BY ni tezlashtiradi","Narx: har INSERT/UPDATE/DELETE indexni ham yangilaydi — yozish sekinlashadi","Disk/xotira egallaydi; past selektivlikdagi ustunda (masalan boolean) foyda kam"],
 e:"Yaxshi javob 'kitob oxiridagi mundarija' o'xshatishi + trade-off. Senior signal: write amplification, selektivlik, va 'ishlatilmayotgan indexlarni pg_stat_user_indexes bilan topib o'chiraman' deyish."},
{l:"J",t:"mcq",tp:"SQL",q:"UNION va UNION ALL farqi?",
 o:["UNION ALL dublikatlarni olib tashlaydi","UNION dublikatlarni olib tashlaydi (sort/hash qiladi), UNION ALL hammasini qaytaradi va tezroq","Ikkalasi ham bir xil","UNION faqat ikki jadval bilan ishlaydi"],a:1,
 e:"UNION = UNION ALL + DISTINCT, ya'ni qo'shimcha sort yoki hash. Dublikat bo'lmasligini bilsangiz (masalan turli sanalar oralig'i) doim UNION ALL — arzonroq."},
// ---------- MIDDLE ----------
{l:"M",t:"mcq",tp:"Index",q:"<code>CREATE INDEX ON orders(customer_id, created_at)</code>. Qaysi so'rov bu indexdan <b>samarali</b> foydalana olmaydi?",
 o:["WHERE customer_id = 5","WHERE customer_id = 5 AND created_at > now() - interval '1 day'","WHERE created_at > now() - interval '1 day'","WHERE customer_id = 5 ORDER BY created_at DESC"],a:2,
 e:"Composite B-tree 'leftmost prefix' qoidasi: index avval customer_id, keyin ichida created_at bo'yicha saralangan. Faqat created_at bo'yicha filtrda boshlang'ich nuqta yo'q. Ustun tartibi qoidasi: tenglik (=) ustunlari oldin, diapazon/sort ustuni keyin. (Postgres ba'zan butun indexni skan qiladi, lekin bu samarali emas.)"},
{l:"M",t:"mcq",tp:"Isolation",q:"Qaysi eng past isolation darajasi <b>non-repeatable read</b> ni oldini oladi?",
 o:["READ UNCOMMITTED","READ COMMITTED","REPEATABLE READ","Hech biri, faqat SERIALIZABLE"],a:2,
 e:"Dirty read — READ COMMITTED da yo'q. Non-repeatable read (bir qatorni ikki marta o'qisang boshqa qiymat) — REPEATABLE READ da yo'q. Phantom — standart bo'yicha SERIALIZABLE da, lekin Postgres REPEATABLE READ (snapshot) phantomni ham oldini oladi. Postgres default: READ COMMITTED; MySQL InnoDB default: REPEATABLE READ."},
{l:"M",t:"code",tp:"Window",q:"<code>salary</code>: 100, 100, 90, 80. Natija ustunlari (rn, rk, drk)?",c:"SELECT salary,\n  ROW_NUMBER() OVER (ORDER BY salary DESC) rn,\n  RANK()       OVER (ORDER BY salary DESC) rk,\n  DENSE_RANK() OVER (ORDER BY salary DESC) drk\nFROM emp;",
 o:["rn:1,2,3,4 · rk:1,1,3,4 · drk:1,1,2,3","rn:1,1,2,3 · rk:1,1,3,4 · drk:1,2,3,4","rn:1,2,3,4 · rk:1,1,2,3 · drk:1,1,3,4","rn:1,2,3,4 · rk:1,2,3,4 · drk:1,1,2,3"],a:0,
 e:"ROW_NUMBER — doim unikal ketma-ketlik (tenglarda tartib aniqlanmagan!). RANK — tenglarga bir xil raqam, keyin sakrash (1,1,3). DENSE_RANK — sakrashsiz (1,1,2). 'Top-N per group' da tenglar ham kirishi kerak bo'lsa DENSE_RANK."},
{l:"M",t:"sql",tp:"Window",q:"Har bir bo'limdan eng ko'p maosh oladigan 3 xodimni qaytaring. <code>employees(id, name, department_id, salary)</code>",
 m:"SELECT id, name, department_id, salary\nFROM (\n  SELECT e.*,\n         DENSE_RANK() OVER (PARTITION BY department_id\n                            ORDER BY salary DESC) AS r\n  FROM employees e\n) x\nWHERE r <= 3;",k:["OVER","PARTITION BY","ORDER BY","RANK|ROW_NUMBER"],
 e:"Window funksiyani WHERE da to'g'ridan-to'g'ri ishlatib bo'lmaydi (WHERE SELECTdan oldin bajariladi) — shuning uchun subquery/CTE. Postgresda alternativ: LATERAL join bilan har bo'limga LIMIT 3 — (department_id, salary DESC) index bo'lsa juda tez."},
{l:"M",t:"open",tp:"ORM",q:"N+1 query muammosi nima va uni qanday hal qilasiz?",
 m:["1 so'rov ro'yxatni oladi, keyin har element uchun alohida so'rov → N+1 round trip","Odatda ORM lazy loading sababli (post.author har loopda)","Yechim: eager loading (JOIN yoki WHERE id IN (...) batch) — include/prefetch_related/joinedload","GraphQL da DataLoader bilan batching","Aniqlash: query log, APM, testda so'rov sonini assert qilish"],
 e:"Muhim nuqta: muammo har so'rov sekinligida emas, round-trip soni va latencyda. 100 ta 1ms so'rov + tarmoq = 100ms+. Yaxshi javob aniqlash usulini ham aytadi."},
{l:"M",t:"mcq",tp:"Planner",q:"<code>status</code> ustunida index bor, lekin <code>WHERE status='active'</code> uchun EXPLAIN <b>Seq Scan</b> ko'rsatyapti. Eng ehtimoliy sabab?",
 o:["Index buzilgan","Qatorlarning katta qismi (masalan 90%) 'active' — planner seq scanni arzonroq deb hisoblaydi","Postgres string ustunda index ishlatmaydi","WHERE da tirnoq noto'g'ri"],a:1,
 e:"Past selektivlikda random I/O (index → heap) ketma-ket o'qishdan qimmat. Planner statistikaga (pg_stats) tayanadi. Agar kam uchraydigan qiymat bo'yicha qidirsangiz — partial index: CREATE INDEX ... WHERE status='pending'. Statistika eskirgan bo'lsa ANALYZE."},
{l:"M",t:"code",tp:"Index",q:"<code>users(email)</code> da B-tree index bor. Bu so'rov indexni ishlatadimi?",c:"SELECT * FROM users WHERE LOWER(email) = 'ali@x.uz';",
 o:["Ha, har doim","Yo'q — ustunga funksiya qo'llangan; expression index kerak: CREATE INDEX ON users (LOWER(email))","Ha, lekin faqat MySQLda","Yo'q, chunki = operatori index ishlatmaydi"],a:1,
 e:"Index email qiymatlari bo'yicha saralangan, LOWER(email) bo'yicha emas — 'non-sargable' predicate. Yechimlar: expression index, citext tipi, yoki yozishda normalizatsiya (emailni doim lowercase saqlash). Xuddi shu: WHERE created_at::date = ... yoki WHERE col + 1 = 5."},
{l:"M",t:"mcq",tp:"Locking",q:"<code>SELECT ... FOR UPDATE</code> qaysi yondashuvga misol?",
 o:["Optimistic locking","Pessimistic locking — qator o'qilganda lock olinadi, boshqa yozuvchilar kutadi","MVCC snapshot","Advisory lock"],a:1,
 e:"Pessimistic: konflikt ko'p bo'lganda (masalan inventar kamaytirish). Optimistic: version ustuni, UPDATE ... WHERE id=? AND version=? — 0 qator yangilansa retry. Konflikt kam, o'qish ko'p bo'lsa optimistic. FOR UPDATE SKIP LOCKED — navbat (job queue) uchun klassik pattern."},
{l:"M",t:"open",tp:"Locking",q:"Deadlock nima, DB uni qanday aniqlaydi va siz qanday oldini olasiz?",
 m:["Ikki tranzaksiya bir-birining lockini kutadi: T1 A→B, T2 B→A","DB wait-for graph orqali aniqlaydi va birini abort qiladi (Postgres deadlock_timeout)","Oldini olish: resurslarni doim bir xil tartibda lock qilish (masalan id bo'yicha sort)","Tranzaksiyani qisqa qilish, tashqi HTTP chaqiruvni tranzaksiya ichida qilmaslik","Ilovada deadlock/serialization xatosini retry qilish"],
 e:"Deadlockni butunlay yo'q qilib bo'lmaydi — shuning uchun retry logika majburiy. Pul o'tkazmada: ikki hisobni doim kichik id birinchi tartibda lock qilish klassik javob."},
{l:"M",t:"sql",tp:"GROUP BY",q:"<code>users(id, email)</code> da takrorlangan emaillarni va necha marta takrorlanganini toping (katta-kichik harf farqsiz).",
 m:"SELECT LOWER(email) AS email, COUNT(*) AS n\nFROM users\nGROUP BY LOWER(email)\nHAVING COUNT(*) > 1\nORDER BY n DESC;",k:["GROUP BY","HAVING","COUNT","LOWER"],
 e:"Keyingi savol ko'pincha: 'dublikatlarni o'chiring, eng eskisini qoldiring' — ROW_NUMBER() OVER (PARTITION BY LOWER(email) ORDER BY id) > 1 bo'lganlarni DELETE. Keyin UNIQUE INDEX ON users(LOWER(email)) qo'yib muammoni ildizdan yopish."},
{l:"M",t:"mcq",tp:"Index",q:"'Covering index' (index-only scan) nima?",
 o:["Jadvaldagi hamma ustunni o'z ichiga olgan index","So'rovga kerak bo'lgan hamma ustun indexda bor — heapga murojaat qilmasdan javob beriladi","Bir nechta jadvalni qamragan index","Primary key indexi"],a:1,
 e:"Postgres 11+: CREATE INDEX ON orders(customer_id) INCLUDE (total, status). Ogohlantirish: Postgresda index-only scan visibility map'ga bog'liq — VACUUM yaqinda ishlamagan bo'lsa baribir heapga boradi (EXPLAIN dagi 'Heap Fetches')."},
{l:"M",t:"code",tp:"NULL",q:"<code>banned(user_id)</code> da bitta NULL qiymat bor. Natija?",c:"SELECT * FROM users\nWHERE id NOT IN (SELECT user_id FROM banned);",
 o:["Banned bo'lmagan hamma userlar","Bo'sh natija — hech qanday qator","Xato","Faqat NULL id'li userlar"],a:1,
 e:"id NOT IN (1, NULL) ≡ id<>1 AND id<>NULL → ... AND UNKNOWN → hech qachon TRUE emas. Mashhur tuzoq. Yechim: NOT EXISTS (SELECT 1 FROM banned b WHERE b.user_id = u.id) — NULL xavfsiz va odatda anti-join sifatida yaxshi rejalanadi."},
{l:"M",t:"mcq",tp:"Types",q:"PostgreSQLda <code>VARCHAR(255)</code> va <code>TEXT</code> performance farqi?",
 o:["VARCHAR ancha tez","TEXT ancha tez","Amalda farq yo'q — ikkalasi bir xil saqlanadi; VARCHAR(n) faqat uzunlik tekshiruvi qo'shadi","TEXT index qilinmaydi"],a:2,
 e:"Postgresda ikkalasi ham varlena. 255 — MySQL odati. Uzunlik chekloviga ehtiyoj bo'lsa CHECK (length(x) <= n) ham ishlaydi va o'zgartirish osonroq. CHAR(n) esa padding qiladi — deyarli hech qachon kerak emas."},
{l:"M",t:"open",tp:"Design",q:"Soft delete (deleted_at ustuni) — afzalliklari va kamchiliklari?",
 m:["+ Qayta tiklash, audit, tarix saqlanadi","− Har so'rovga WHERE deleted_at IS NULL — unutish xavfi (data leak)","− UNIQUE constraint buziladi: o'chirilgan email bilan qayta ro'yxatdan o'tish → partial unique index WHERE deleted_at IS NULL","− FK/cascade ishlamaydi, jadval shishadi","Alternativ: archive jadvalga ko'chirish yoki event/audit log; GDPR 'unutilish huquqi' — haqiqiy o'chirish kerak"],
 e:"Middle/Senior farqi: kamchiliklarni aniq nomlash (unique index, GDPR). Yaxshi javob: 'default bo'yicha qilmayman, biznes talab bo'lsa partial index + view/ORM default scope bilan'."},
// ---------- SENIOR ----------
{l:"S",t:"mcq",tp:"MVCC",q:"PostgreSQL MVCC da <code>UPDATE</code> ichkarida nima qiladi?",
 o:["Qatorni joyida o'zgartiradi","Yangi tuple versiyasini yozadi, eskisini 'dead' deb belgilaydi; VACUUM keyin tozalaydi","Qatorni o'chirib, undo logga yozadi","Butun sahifani nusxalaydi"],a:1,
 e:"Postgres UPDATE = DELETE + INSERT (xmin/xmax). Oqibatlari: tez-tez yangilanadigan jadvalda bloat, autovacuum tuning muhim; har yangi versiya barcha indexlarni yangilaydi (HOT update bundan istisno — indexlangan ustun o'zgarmasa va sahifada joy bo'lsa, fillfactor). MySQL InnoDB esa joyida yangilaydi, eski versiya undo logda."},
{l:"S",t:"open",tp:"Migrations",q:"Production'da katta jadvaldagi ustun nomini downtime'siz qanday o'zgartirasiz?",
 m:["To'g'ridan-to'g'ri RENAME — eski kod versiyasi darhol sinadi (deploy paytida ikki versiya ishlaydi)","Expand–contract: 1) yangi ustun qo'shish (nullable, default'siz)","2) Ilova ikkala ustunga yozadi (dual write) yoki trigger","3) Eski ma'lumotni batchlab backfill (kichik batch, throttle)","4) O'qishni yangi ustunga o'tkazish, 5) eski ustundan yozishni to'xtatish, 6) keyinroq DROP","lock_timeout qo'yish; ALTER qisqa ACCESS EXCLUSIVE lock kutib, butun trafikni bloklashi mumkin"],
 e:"Senior signal: deploy vaqtida eski va yangi kod parallel ishlashini hisobga olish, backfill'ni bitta ulkan UPDATE emas batch bilan qilish va lock_timeout. Har bosqich alohida deploy va alohida rollback qilinadi."},
{l:"S",t:"mcq",tp:"Isolation",q:"Ikki shifokor navbatchilikdan chiqadi: har biri 'kamida bitta navbatchi qolyaptimi?' deb tekshiradi, ikkalasi ham ha deb ko'radi va o'zini olib tashlaydi. Natijada 0 navbatchi. Bu anomaliya va uni kafolatli oldini oladigan daraja?",
 o:["Dirty read — READ COMMITTED","Lost update — REPEATABLE READ","Write skew — SERIALIZABLE (yoki tekshirilgan qatorlarni FOR UPDATE bilan lock qilish)","Phantom read — READ UNCOMMITTED"],a:2,
 e:"Write skew: ikki tranzaksiya bir xil to'plamni o'qiydi, turli qatorlarni yozadi — snapshot isolation (Postgres REPEATABLE READ) buni ushlamaydi. Postgres SERIALIZABLE (SSI) konfliktni aniqlab bittasini serialization failure bilan abort qiladi — ilova retry qilishi shart."},
{l:"S",t:"code",tp:"Concurrency",q:"Ikki so'rov bir vaqtda ishlaydi, boshlang'ich balans 100. READ COMMITTED. Yakuniy balans va to'g'ri tuzatish?",c:"-- ilova kodi (ikkala so'rovda bir xil)\nbal = SELECT balance FROM accounts WHERE id = 1;   -- 100\nUPDATE accounts SET balance = :bal - 10 WHERE id = 1;",
 o:["80 — hammasi to'g'ri","90 (lost update). Tuzatish: UPDATE accounts SET balance = balance - 10 WHERE id=1 (atomik) yoki SELECT ... FOR UPDATE","90, tuzatish: indexni qo'shish","Deadlock bo'ladi"],a:1,
 e:"Read-modify-write ilova tomonida — klassik lost update. Atomik UPDATE balance = balance - 10 qatorni lock qilib, commit bo'lgan oxirgi qiymatni qayta o'qiydi. Qo'shimcha himoya: CHECK (balance >= 0) yoki WHERE balance >= 10 va yangilangan qatorlar sonini tekshirish."},
{l:"S",t:"mcq",tp:"Replication",q:"Asinxron replikatsiyaning asosiy xavfi?",
 o:["Yozish sekinlashadi","Failover paytida primary'da commit bo'lgan, lekin replicaga yetib bormagan ma'lumot yo'qoladi (RPO > 0)","Replica yozishni qabul qiladi","Indexlar replicaga ko'chmaydi"],a:1,
 e:"Sinxron replikatsiya: commit kamida bitta replica tasdiqlagach — RPO=0, lekin latency oshadi va replica o'lsa yozish to'xtashi mumkin. Amaliy kompromis: quorum/semi-sync (Postgres synchronous_standby_names = ANY 1 (...)). Async'da replica lag ham o'qishlarda eskirgan ma'lumot beradi."},
{l:"S",t:"open",tp:"Replication",q:"Read replica ishlatyapsiz. User profilini yangiladi, sahifa yangilanganda eski ma'lumot ko'rindi. Sabab va yechimlar?",
 m:["Sabab: replication lag — o'qish replicadan, yozish primary'dan","Read-your-writes: yozgan userning keyingi N soniyadagi o'qishlarini primary'ga yo'naltirish","LSN tracking: yozishdan keyin LSN ni saqlash, replica shu LSN ga yetguncha kutish yoki primary'ga o'tish","Kritik o'qishlar (to'lov, balans) doim primary'dan","Lag monitoringi va alert (pg_stat_replication replay_lag)"],
 e:"Yaxshi javob biznesga qarab tabaqalaydi: ko'p o'qishlar eventual consistency'ga chidaydi, faqat 'o'z yozganini ko'rish' kerak. Sticky session / LSN-based routing — Staff darajadagi detal."},
{l:"S",t:"mcq",tp:"Partitioning",q:"Katta <code>events</code> jadvalini <code>created_at</code> bo'yicha oylik RANGE partition qilishning eng katta foydasi?",
 o:["Har qanday so'rov tezlashadi","Partition pruning (sana bo'yicha so'rov faqat kerakli partitionni o'qiydi) va eski ma'lumotni DROP/DETACH PARTITION bilan bir zumda o'chirish","UNIQUE constraint'lar osonlashadi","Replikatsiya kerak bo'lmay qoladi"],a:1,
 e:"DELETE WHERE created_at < ... millionlab dead tuple va WAL yaratadi; DROP PARTITION — metadata operatsiya. Kamchiliklar: partition key'siz so'rovlar hamma partitionni skan qiladi; unique/PK partition key'ni o'z ichiga olishi shart; juda ko'p partition planner'ni sekinlatadi."},
{l:"S",t:"sql",tp:"Pagination",q:"<code>posts(id, created_at, ...)</code> — OFFSET 100000 sekin. Keyset (cursor) pagination bilan keyingi 20 ta postni oling (oxirgi ko'rilgan: :last_created, :last_id).",
 m:"SELECT id, created_at, title\nFROM posts\nWHERE (created_at, id) < (:last_created, :last_id)\nORDER BY created_at DESC, id DESC\nLIMIT 20;\n\n-- index: CREATE INDEX ON posts (created_at DESC, id DESC);",k:["WHERE","<|>","ORDER BY","LIMIT","id"],
 e:"OFFSET N hali ham N qatorni o'qib tashlaydi — O(N). Keyset indexdan to'g'ridan-to'g'ri joyga sakraydi — O(log n). id tie-breaker shart, aks holda bir xil created_at'li qatorlar tushib qoladi yoki takrorlanadi. Kamchilik: ixtiyoriy sahifaga sakrab bo'lmaydi."},
{l:"S",t:"mcq",tp:"Index",q:"<code>jsonb</code> ustunda <code>data @> '{\"tags\":[\"sql\"]}'</code> va full-text qidiruv uchun qaysi index turi mos?",
 o:["B-tree","Hash","GIN","BRIN"],a:2,
 e:"GIN — inverted index: bitta qatorda ko'p kalit (array elementlari, jsonb kalitlari, lexeme'lar). B-tree — tartib/diapazon. BRIN — juda katta, tabiiy tartiblangan (append-only vaqt) jadvallar uchun juda kichik index. GiST — geometriya, range, nearest-neighbor. GIN kamchiligi: yozish qimmat (fastupdate/pending list)."},
{l:"S",t:"open",tp:"Ops",q:"Connection pool hajmini qanday tanlaysiz? PgBouncer transaction mode'ning tuzoqlari nima?",
 m:["Postgres har ulanishga process ochadi — minglab ulanish xotira va context switch muammosi","Formula boshlang'ich nuqta: ~ (CPU yadro × 2) + disk; ko'proq ulanish ≠ ko'proq throughput","Ilova instance'lari × pool size ≤ max_connections (replica, admin uchun zaxira)","Transaction mode: session state yo'qoladi — SET, advisory lock, LISTEN, temp table, session-level prepared statement ishlamaydi (PgBouncer 1.21+ protocol-level prepared statement'larni qo'llaydi)","Pool kutish vaqtini (wait time) monitoring qilish"],
 e:"Senior signal: 'pool'ni oshiraylik' refleksiga qarshi turish — DB to'yingan bo'lsa ko'proq ulanish latency'ni oshiradi. Queueing ilovada bo'lgani yaxshiroq."},
{l:"S",t:"mcq",tp:"Migrations",q:"50M qatorli jadvalga production'da <code>CREATE INDEX</code> ishga tushirildi. Nima bo'ladi va to'g'ri yo'l?",
 o:["Hech narsa, indexlar fon rejimida quriladi","Jadvalga yozish (INSERT/UPDATE/DELETE) index qurilguncha bloklanadi; to'g'ri yo'l — CREATE INDEX CONCURRENTLY","O'qish ham, yozish ham bloklanmaydi","Jadval o'chib ketadi"],a:1,
 e:"Oddiy CREATE INDEX SHARE lock oladi — o'qish mumkin, yozish yo'q. CONCURRENTLY sekinroq, tranzaksiya ichida ishlamaydi va muvaffaqiyatsiz bo'lsa INVALID index qoldiradi (DROP qilib qayta urinish kerak). Migratsiya toollari (Rails, Django) uchun buni alohida belgilash kerak."},
{l:"S",t:"mcq",tp:"Distributed",q:"CAP teoremasiga ko'ra network partition paytida tizim nimani tanlashi kerak?",
 o:["Consistency va Availability ikkalasini","Consistency yoki Availability — biri qurbon qilinadi","Partition tolerance'ni o'chirish","Latency va throughput"],a:1,
 e:"P ixtiyoriy emas — tarmoq baribir bo'linadi. CP: ozchilik tomon so'rovlarni rad etadi (etcd, ZooKeeper). AP: har ikki tomon javob beradi, keyin konfliktni hal qiladi (Cassandra, Dynamo). Ko'proq nozik model — PACELC: partition bo'lmaganda ham Latency vs Consistency tanlovi bor."},
// ---------- STAFF ----------
{l:"St",t:"open",tp:"Sharding",q:"Multi-tenant SaaS uchun sharding strategiyasini loyihalang. Shard key, 'hot tenant' va rebalancing?",
 m:["Shard key: tenant_id — tenant ichidagi so'rovlar bitta shardda, JOIN va tranzaksiya lokal","Cross-tenant so'rovlar (analitika) — alohida DWH/CDC orqali, OLTP'da emas","Hot/katta tenant: alohida dedicated shard; directory-based (lookup) mapping hash'dan moslashuvchan","Rebalancing: tenant'ni ko'chirish — logical replication/dual-write + cutover, qisqa read-only oyna","Global jadvallar (plans, config) — har shardga replikatsiya","Avval vertikal masshtab, read replica, partitioning — sharding oxirgi chora (operatsion narx)"],
 e:"Staff signal: 'sharding kerakmi?' degan savoldan boshlash va operatsion narxni aytish. Directory mapping (tenant → shard jadvali) consistent hashing'dan ko'ra tenant ko'chirishni osonlashtiradi. Citus, Vitess misol sifatida."},
{l:"St",t:"mcq",tp:"Integration",q:"Servis DBga order yozadi va Kafka'ga event yuboradi. Biri muvaffaqiyatli, ikkinchisi yiqilishi mumkin. Qaysi pattern buni hal qiladi?",
 o:["Two-phase commit har doim","Transactional outbox: event ham shu DB tranzaksiyasida outbox jadvaliga yoziladi, relay (polling yoki CDC) keyin Kafka'ga yuboradi","Kafka'ga avval, keyin DB'ga yozish","Retry bilan ikkalasiga ketma-ket yozish"],a:1,
 e:"Dual-write muammosi. Outbox atomiklikni DB tranzaksiyasiga keltiradi. Kafolat — at-least-once, shuning uchun consumer'lar idempotent bo'lishi kerak (event_id bo'yicha dedup). 2PC Kafka bilan amalda qo'llanmaydi va availability'ni tushiradi."},
{l:"St",t:"open",tp:"Migration",q:"Monolit bitta umumiy DB'dan mikroservislarga har servisga o'z DB bilan o'tishni qanday rejalashtirasiz?",
 m:["Avval bounded context bo'yicha jadval egaligini aniqlash; boshqa servis jadvaliga to'g'ridan-to'g'ri JOIN'larni topish","Strangler fig: bitta context'ni ajratish, avval kod darajasida (modul), keyin DB","Ma'lumot ko'chirish: CDC (Debezium) bilan yangi DB'ga sinxron, keyin read switch, keyin write switch","JOIN'lar o'rniga API chaqiruv yoki lokal read-model (event orqali)","Tranzaksiyalar → saga + outbox; konsistentlik chegarasi o'zgaradi — biznes bilan kelishish","Har qadam rollback qilinadigan, feature flag bilan"],
 e:"Staff darajada kutiladi: 'big bang' emas, bosqichli; va texnik bo'lmagan narx — cross-servis hisobotlar, eventual consistency'ni biznes qabul qilishi. Shared DB — integratsiya anti-pattern, lekin tezda ajratish ham xavfli."},
{l:"St",t:"mcq",tp:"CDC",q:"Debezium kabi CDC toollari Postgres'dan o'zgarishlarni qanday oladi?",
 o:["Har soniyada jadvalni polling qiladi","Triggerlar orqali","WAL'ni logical decoding (replication slot) orqali o'qiydi","Ilova loglarini parse qiladi"],a:2,
 e:"Logical replication slot WAL'ni consumer o'qiguncha saqlaydi. Xavf: consumer to'xtasa slot WAL'ni ushlab turadi va disk to'lib, primary yiqiladi — slot lag monitoringi va max_slot_wal_keep_size majburiy. Afzallik: ilovaga o'zgarish kerak emas, commit tartibi saqlanadi."},
{l:"St",t:"open",tp:"Idempotency",q:"To'lov API'sini idempotent qiling: client timeout olib qayta yuboradi — ikki marta yechilmasligi kerak. DB darajasida dizayn?",
 m:["Client Idempotency-Key yuboradi (UUID)","idempotency_keys(key PK, request_hash, status, response, created_at) jadvali","Tranzaksiya: INSERT key ON CONFLICT DO NOTHING — kim birinchi kiritsa o'sha bajaradi","Takror so'rov: saqlangan javobni qaytarish; key bir xil, body boshqa bo'lsa — 422","'in_progress' holatini boshqarish (parallel takror → 409 yoki kutish); TTL bilan tozalash","Tashqi provayderga ham o'sha kalitni uzatish"],
 e:"Asosiy fikr: idempotentlikni unique constraint kafolatlaydi, ilovadagi 'avval tekshir, keyin yoz' emas (race condition). Business-level unique (order_id bo'yicha bitta payment) qo'shimcha himoya."},
{l:"St",t:"code",tp:"Upsert",q:"<code>key</code> allaqachon mavjud bo'lsa, bu so'rov nima qaytaradi?",c:"INSERT INTO idempotency_keys(key, status)\nVALUES ('abc', 'in_progress')\nON CONFLICT (key) DO NOTHING\nRETURNING key;",
 o:["'abc' — mavjud qator qaytadi","Hech qanday qator (0 rows) — shu orqali 'men birinchi emasman' deb bilinadi","Unique violation xatosi","Qator yangilanadi va qaytadi"],a:1,
 e:"DO NOTHING konfliktda qator qaytarmaydi — bu 'lock olish' signali sifatida qulay. Mavjud qatorni ham olish kerak bo'lsa: DO UPDATE SET key = EXCLUDED.key RETURNING ... (lekin bu keraksiz yozish/dead tuple yaratadi) yoki keyin alohida SELECT."},
{l:"St",t:"mcq",tp:"MVCC",q:"Postgres'da 'transaction ID wraparound' xavfi nima va nima uning oldini oladi?",
 o:["Disk to'lishi; oldini olish — TRUNCATE","32-bit XID tugaydi, eski qatorlar 'kelajakdagi' bo'lib ko'rinadi; himoya uchun DB yozishni to'xtatadi. Oldini olish — autovacuum freeze ishlashini ta'minlash","Replica sinxronligi yo'qoladi","Indexlar buziladi, REINDEX kerak"],a:1,
 e:"VACUUM FREEZE eski tuple'larni 'frozen' deb belgilaydi. Uzoq ochiq tranzaksiyalar, unutilgan replication slot yoki prepared transaction vacuum'ni bloklaydi — age(datfrozenxid) monitoringi kerak. Real incidentlar (Sentry, Mailchimp) aynan shu bilan bo'lgan."},
{l:"St",t:"open",tp:"Backup",q:"Muhim DB uchun backup/DR strategiyasini loyihalang. RPO va RTO qanday belgilanadi?",
 m:["RPO — qancha ma'lumot yo'qotishga chidaymiz; RTO — qancha vaqtda tiklanamiz; biznes bilan kelishiladi","Base backup + WAL arxiv (pgBackRest/WAL-G) → PITR (masalan xato DELETE'dan oldingi daqiqaga)","Replika backup emas: DROP TABLE replicaga ham ketadi; delayed replica qo'shimcha himoya","Backup'lar boshqa region/akkauntda, shifrlangan, immutable (ransomware)","Tiklashni muntazam test qilish — tekshirilmagan backup = backup yo'q","Tiklash vaqtini o'lchash, runbook"],
 e:"Staff javobning o'zagi: 'backup'ni qilish emas, tiklashni isbotlash'. RPO/RTO'ni texnik emas biznes qarori sifatida qo'yish."},
{l:"St",t:"mcq",tp:"Sharding",q:"Consistent hashing'ning oddiy <code>hash(key) % N</code> ga nisbatan asosiy afzalligi?",
 o:["Hash tezroq hisoblanadi","Node qo'shilganda/olib tashlanganda kalitlarning faqat ~1/N qismi ko'chadi (% N da deyarli hammasi ko'chadi)","Hot key muammosini butunlay hal qiladi","Replikatsiya kerak emas"],a:1,
 e:"% N da N o'zgarsa deyarli hamma kalit boshqa node'ga tushadi — kesh yoki shard uchun halokat. Virtual node'lar yukni tekisroq taqsimlaydi. Hot key muammosini hal qilmaydi — buning uchun key splitting yoki keshlash kerak."},
{l:"St",t:"sql",tp:"Upsert",q:"<code>page_views(page_id PK, views)</code> — bir vaqtda minglab so'rov keladi. Hisoblagichni atomik oshiring (qator bo'lmasa yarating).",
 m:"INSERT INTO page_views(page_id, views)\nVALUES (:id, 1)\nON CONFLICT (page_id)\nDO UPDATE SET views = page_views.views + 1;",k:["INSERT","ON CONFLICT","DO UPDATE","+ 1|+1"],
 e:"SELECT → UPDATE/INSERT ilovada race condition beradi. Upsert atomik. Staff davomi: juda hot qatorda bitta qator lock contention'ga aylanadi — yechim: counter'ni N ta shard qatorga bo'lib SUM qilish, yoki Redis INCR + davriy flush."},
// ---------- PRINCIPAL ----------
{l:"P",t:"open",tp:"Strategy",q:"Yangi mahsulot uchun DB tanlashda (PostgreSQL vs DynamoDB vs Cassandra vs ...) qaror freymvorkingiz qanday?",
 m:["Access pattern'lardan boshlash: so'rovlar oldindan ma'lummi (key-value) yoki ad-hoc/relational?","Konsistentlik talablari: pul/inventar → kuchli tranzaksiyalar","Masshtab realistik prognozi — ko'p kompaniyaga bitta yaxshi sozlangan Postgres yetadi","Jamoa tajribasi va operatsion narx (on-call, backup, tooling)","Vendor lock-in, narx modeli (DynamoDB — so'rov bo'yicha), region talablari","Default: 'boring technology' — Postgres; boshqasiga o'tish uchun aniq sabab va ADR"],
 e:"Principal darajada texnologiya emas, qaror jarayoni baholanadi: trade-off'ni hujjatlash (ADR), qaytarish narxi, jamoaning innovation token'larini tejash."},
{l:"P",t:"open",tp:"Distributed",q:"Global active-active multi-region DB arxitekturasi: qaysi muammolar yuzaga keladi va qanday hal qilasiz?",
 m:["Yozish konfliktlari: LWW (soat drift xavfi), CRDT, yoki ma'lumotni region/user bo'yicha 'home region'ga bog'lash (konfliktdan qochish)","Kuchli konsistentlik kerak bo'lsa — konsensus (Spanner, CockroachDB), lekin cross-region yozish latency 100ms+","Data residency (GDPR, mahalliy qonunlar) — ma'lumot qayerda saqlanishi majburiy","Failover va split-brain, regionlararo trafik narxi","Ko'p hollarda active-passive yoki 'active-active o'qish, bitta regionda yozish' yetarli — murakkablikni asoslash"],
 e:"Eng kuchli javob: 'active-active kerakmi?' degan savolni biznes SLA orqali tekshirish. Konfliktlarni hal qilishdan ko'ra ularning oldini olish (partitioning by home region) arzonroq."},
{l:"P",t:"mcq",tp:"Distributed",q:"Google Spanner global external consistency'ga (linearizable commit tartibi) qanday erishadi?",
 o:["Hamma yozishlar bitta global lider orqali","TrueTime (GPS/atom soatlar, noaniqlik oralig'i) + commit wait — noaniqlik tugaguncha kutish","Vector clock","Eventual consistency bilan"],a:1,
 e:"TrueTime [earliest, latest] oralig'ini beradi; commit timestamp tanlangach, oraliq o'tguncha kutiladi — shuning uchun keyingi tranzaksiya kattaroq timestamp oladi. Har shard ichida Paxos. CockroachDB aniq soatlarsiz HLC va uncertainty restart'lardan foydalanadi — kafolati biroz zaifroq."},
{l:"P",t:"open",tp:"Org",q:"200+ muhandisli tashkilotda DB sxema o'zgarishlari va ma'lumot egaligini qanday boshqarasiz?",
 m:["Har jadval/sxemaning aniq egasi (servis/jamoa), boshqa jamoa to'g'ridan-to'g'ri kirmaydi — kontrakt orqali","Migratsiyalar CI'da avtomatik tekshiriladi: lint (xavfli ALTER, CONCURRENTLY'siz index, NOT NULL default), lock_timeout","Paved road: standart migratsiya tooling, shablon, runbook — to'g'ri yo'l eng oson yo'l bo'lsin","Katta xavfli o'zgarishlar uchun review (DB guild), lekin bottleneck bo'lmasligi kerak","Kuzatuv: sekin so'rovlar, bloat, index'lar bo'yicha jamoalarga dashboard","Incident'lardan keyin qoidani avtomatlashtirish"],
 e:"Principal signal: odamlar review'iga emas, avtomatik guardrail'larga tayanish va tashkiliy masshtab — markaziy DBA jamoasi bottleneck bo'lmasligi."},
{l:"P",t:"mcq",tp:"Architecture",q:"Event sourcing'ning production'dagi eng katta uzoq muddatli narxi odatda nima?",
 o:["Diskda joy ko'p ketadi","Event sxemasi evolyutsiyasi (versiyalash/upcasting), projection'larni qayta qurish va eventual consistency murakkabligi","Yozish sekin","SQL ishlatib bo'lmaydi"],a:1,
 e:"Eventlar o'zgarmas — 3 yil oldingi event formatini ham abadiy qo'llash kerak. Read model'lar kechikadi, qayta qurish soatlab ketishi mumkin. Shuning uchun ES faqat audit/tarix biznes qiymat bo'lgan bounded context'ga — butun tizimga emas."},
{l:"P",t:"open",tp:"Cost",q:"DB xarajati yiliga $2M ga yetdi. Uni qanday kamaytirasiz?",
 m:["Avval o'lchash: qaysi servis/so'rov/jadval qancha resurs yeydi (pg_stat_statements, cost attribution)","Qimmat so'rovlar: indexlar, N+1, keraksiz polling; kesh qatlami","Ma'lumot lifecycle: eski ma'lumot → arzon storage (S3/Parquet), partition drop","Right-sizing: haddan tashqari instance, ishlatilmagan replica; reserved/savings plan","Analitik yukni OLTP'dan DWH'ga ko'chirish","Har tejash taklifini risk va muhandislik vaqti bilan solishtirish"],
 e:"Principal javob: tartib — o'lchash, eng katta ulushdan boshlash, unit economics (so'rov/user boshiga narx) ni kuzatish, va tejash reliability'ni buzmasligi."},
{l:"P",t:"mcq",tp:"Distributed",q:"Linearizability va serializability farqi?",
 o:["Bir xil narsa","Serializability — ko'p obyektli tranzaksiyalar qandaydir ketma-ket tartibga ekvivalent; linearizability — bitta obyekt operatsiyalari real vaqt tartibiga mos (recency kafolati)","Linearizability faqat SQL DB'larda","Serializability real vaqt tartibini kafolatlaydi"],a:1,
 e:"Serializability real vaqt haqida hech narsa demaydi — tranzaksiya eskirgan snapshot'da ham serializable bo'lishi mumkin. Ikkalasi birga — strict serializability (Spanner). Principal darajada bu terminlarni aralashtirmaslik muhim."},
{l:"P",t:"open",tp:"Incident",q:"Peak vaqtida DB CPU 100%, API latency 10x oshdi. Birinchi 15 daqiqada nima qilasiz?",
 m:["Incident e'lon qilish, rollarni belgilash (IC, comms), status sahifa","Oxirgi o'zgarishlar: deploy, migratsiya, feature flag — shubha bo'lsa rollback","pg_stat_activity: uzoq so'rovlar, lock kutish; pg_stat_statements: top so'rovlar","Tez yengillatish: aybdor so'rovni o'ldirish, og'ir feature/cron'ni o'chirish, rate limit, load shedding","Stabilizatsiyadan keyin ildiz sabab; blameless postmortem va takrorlanmaslik choralari"],
 e:"Principal signal: avval mitigatsiya, keyin tahlil; kommunikatsiya; 'nima o'zgardi?' birinchi savol. Instance'ni kattalashtirish — oxirgi chora, chunki vaqt oladi va sababni yashiradi."},
{l:"P",t:"mcq",tp:"Design",q:"Denormalizatsiya qachon eng asosli?",
 o:["Har doim — JOIN sekin","O'qish yozishdan ancha ko'p, JOIN o'lchangan bottleneck, va nusxani sinxron saqlash mexanizmi aniq (trigger, event, materialized view)","Hech qachon","Faqat NoSQL'da"],a:1,
 e:"Denormalizatsiya — konsistentlik narxiga performance sotib olish. Asosiy savol: 'nusxa eskirsa kim, qanday tuzatadi?'. Birinchi qadam — materialized view yoki read model; qo'lda nusxa oxirgi chora."},
{l:"P",t:"open",tp:"Strategy",q:"Managed DB (RDS/Aurora/Cloud SQL) vs self-hosted (Kubernetes/VM'da Postgres) — qanday qaror qilasiz?",
 m:["Managed: backup, failover, patching tayyor — jamoa mahsulotga fokus","Narx: katta masshtabda managed 2–3x qimmat bo'lishi mumkin, lekin DBA/SRE maoshi bilan solishtirish kerak (TCO)","Nazorat: extension'lar, superuser, versiya, tuning chegaralari","Compliance/on-prem talablar","Qaror qaytarilishi: chiqish (egress, migratsiya) narxi","Odatda: managed bilan boshlash; aniq masshtab/narx signali bo'lganda qayta ko'rib chiqish"],
 e:"Principal javob TCO va jamoa imkoniyatlariga asoslanadi, 'arzonroq' degan birgina metrikaga emas."},
// ---------- QO'SHIMCHA: INDEX (chuqurroq) ----------
{l:"J",t:"mcq",tp:"Index",q:"B-tree index qidiruvni nega tezlashtiradi?",
 o:["Ma'lumotni siqadi","Qiymatlar saralangan daraxtda saqlanadi — har bosqichda qidiruv maydoni ko'p marta qisqaradi, 1 mln qatorda ~3–4 sahifa o'qish yetarli (O(log n))","Hamma qatorni xotiraga yuklaydi","Faqat hash hisoblaydi"],a:1,
 e:"O'xshatish: telefon kitobi alifbo tartibida — 'Karimov'ni topish uchun hamma sahifani o'qimaysiz, o'rtasini ochib, yarmini tashlaysiz. B-tree: root → ichki sahifalar → leaf; leaf'da kalit + qator manzili (TID). Leaf'lar bir-biriga ulangan — shuning uchun diapazon (BETWEEN, >, <) va ORDER BY ham tez. Indexsiz — Seq Scan: 1 mln qatorni birma-bir tekshirish."},
{l:"J",t:"mcq",tp:"Index",q:"<code>users</code> jadvali 10 mln qator. Qaysi ustunga index eng ko'p foyda beradi?",
 o:["is_active (true/false, 95% true)","gender (3 xil qiymat)","email (har user uchun unikal, login'da qidiriladi)","created_by_admin (hech qachon WHERE'da ishlatilmaydi)"],a:2,
 e:"Ikki savol bering: 1) Bu ustun WHERE/JOIN/ORDER BY'da tez-tez ishlatiladimi? 2) Selektivligi yuqorimi (bitta qiymat kam qatorni beradimi)? email — ikkalasiga ha. is_active=true 95% qatorni qaytaradi — index foydasiz, planner baribir Seq Scan tanlaydi. Istisno: kam qiymat (is_active=false 5%) bo'yicha qidirsangiz — partial index."},
{l:"M",t:"code",tp:"Index",q:"EXPLAIN natijasida quyidagilar nimani bildiradi?",c:"1) Seq Scan on orders\n2) Index Scan using orders_customer_idx on orders\n3) Index Only Scan using orders_cust_total_idx on orders\n4) Bitmap Heap Scan on orders\n     -> Bitmap Index Scan on orders_status_idx",
 o:["Hammasi bir xil, faqat nomi boshqa","1 — butun jadval ketma-ket; 2 — indexdan topib har qator uchun jadvalga boradi; 3 — javob faqat indexdan, jadvalga bormaydi; 4 — indexdan manzillarni yig'ib, sahifalarni tartib bilan o'qiydi (o'rta selektivlik uchun)","2 va 3 da jadval o'qilmaydi","4 — xato, index buzilgan"],a:1,
 e:"Tezlik taxminan: Index Only < Index Scan < Bitmap < Seq Scan (kam qator uchun). Lekin ko'p qator kerak bo'lsa Seq Scan eng arzon bo'lishi mumkin — planner to'g'ri qilgan. Bitmap — 'qaysi sahifalar kerak'ni avval belgilab, keyin har sahifani bir marta o'qiydi; bir nechta indexni AND/OR bilan birlashtira oladi. EXPLAIN ANALYZE haqiqiy vaqt va qator sonini ko'rsatadi — 'rows' taxmini va 'actual rows' keskin farq qilsa, statistika eskirgan (ANALYZE)."},
{l:"M",t:"mcq",tp:"Index",q:"<code>name</code> ustunida B-tree index bor. Qaysi so'rov indexdan foydalana <b>olmaydi</b>?",
 o:["WHERE name = 'Ali'","WHERE name LIKE 'Ali%'","WHERE name LIKE '%li'","WHERE name > 'A' AND name < 'B'"],a:2,
 e:"B-tree prefiks bo'yicha saralangan — 'Ali%' boshlanishini biladi, '%li' esa istalgan joyda bo'lishi mumkin, boshlang'ich nuqta yo'q. (Postgres'da 'Ali%' uchun ham C collation yoki text_pattern_ops kerak bo'lishi mumkin.) '%li%' qidiruv uchun: pg_trgm + GIN index yoki full-text search."},
{l:"M",t:"mcq",tp:"Index",q:"<code>jobs</code> jadvalida 50 mln qator, faqat ~1000 tasi <code>status='pending'</code>. Worker'lar doim pending'larni oladi. Eng yaxshi index?",
 o:["CREATE INDEX ON jobs(status)","CREATE INDEX ON jobs(created_at) WHERE status = 'pending'","Index kerak emas","CREATE INDEX ON jobs USING hash(id)"],a:1,
 e:"Partial index faqat shartga mos qatorlarni saqlaydi — 50 mln emas, ~1000 yozuv: juda kichik, tez, xotirada turadi. Job bajarilib status o'zgarsa, yozuv indexdan chiqadi. So'rov: WHERE status='pending' ORDER BY created_at LIMIT 10 FOR UPDATE SKIP LOCKED — navbat uchun klassik. Shart: so'rovdagi WHERE index shartiga mos bo'lishi kerak."},
{l:"M",t:"code",tp:"Index",q:"Index: <code>(a, b, c)</code>. Qaysi so'rovlar indexdan to'liq (hamma shart uchun) foydalanadi?",c:"Q1: WHERE a = 1 AND b = 2 AND c = 3\nQ2: WHERE a = 1 AND c = 3\nQ3: WHERE b = 2 AND c = 3\nQ4: WHERE a = 1 AND b > 5 AND c = 3",
 o:["Hammasi","Faqat Q1 to'liq; Q2 va Q4 — faqat boshlang'ich qismi bilan qidiradi (a / a,b), qolgan shart index ichida filtr; Q3 — samarali emas","Q1 va Q3","Faqat Q3"],a:1,
 e:"Composite index telefon kitobiga o'xshaydi: familiya (a) → ism (b) → otasining ismi (c). Familiyasiz (Q3) ism bo'yicha qidirib bo'lmaydi. Q2: b tashlab ketilgan — a bo'yicha topadi, c ni birma-bir tekshiradi. Q4: b diapazon — diapazondan keyingi ustun (c) qidiruvda ishlatilmaydi. Qoida: tenglik ustunlari oldinga, diapazon oxiriga: (a, c, b) Q4 uchun yaxshiroq."},
{l:"M",t:"sql",tp:"Index",q:"Bu so'rov uchun eng mos indexni yozing:<br><code>SELECT * FROM orders WHERE customer_id = $1 AND status = 'paid' ORDER BY created_at DESC LIMIT 10;</code>",
 m:"CREATE INDEX CONCURRENTLY orders_cust_status_created_idx\n  ON orders (customer_id, status, created_at DESC);",k:["CREATE INDEX","customer_id","status","created_at"],
 e:"Tartib: avval tenglik ustunlari (customer_id, status), keyin ORDER BY ustuni (created_at). Shunda DB indexda to'g'ri joyga sakraydi va 10 ta qatorni tayyor tartibda oladi — alohida Sort yo'q, LIMIT darhol to'xtaydi. Agar created_at birinchi bo'lsa — butun indexni aylanib chiqish kerak bo'lardi. Production'da CONCURRENTLY — yozishni bloklamaslik uchun."},
{l:"S",t:"mcq",tp:"Index",q:"Jadvalda 15 ta index bor, INSERT/UPDATE sekinlashdi. Asosiy sabab va birinchi qadam?",
 o:["Index ko'pligi faqat disk joyiga ta'sir qiladi","Har yozish har bir indexni yangilaydi (write amplification), HOT update imkoniyati kamayadi; pg_stat_user_indexes'da idx_scan = 0 bo'lgan va dublikat (prefiks bir xil) indexlarni topib o'chirish","Hamma indexni REINDEX qilish","Jadvalni partition qilish"],a:1,
 e:"Index (a) va (a, b) bo'lsa — (a) ko'pincha ortiqcha. idx_scan = 0 — hech kim ishlatmagan (lekin statistika reset vaqtini va replicalarni tekshiring). Har index bufer xotirani ham egallaydi. O'chirishdan oldin: unique/constraint indexlarga tegmang."},
{l:"J",t:"open",tp:"Planner",q:"EXPLAIN va EXPLAIN ANALYZE farqi nima va natijada nimalarga qaraysiz?",
 m:["EXPLAIN — reja va taxminiy narx, so'rov bajarilmaydi; EXPLAIN ANALYZE — haqiqatda bajaradi (UPDATE/DELETE'ni tranzaksiyada ROLLBACK bilan!)","Scan turi: Seq Scan katta jadvalda — shubhali","rows (taxmin) va actual rows farqi katta bo'lsa — statistika eskirgan, ANALYZE","Eng qimmat tugun (actual time), Sort / Hash diskka tushishi (external merge)","BUFFERS opsiyasi — qancha sahifa o'qildi"],
 e:"Rejani ichkaridan tashqariga (eng ichki tugundan) o'qing. Amaliy mashq: explain.depesz.com yoki explain.dalibo.com ga reja qo'yib ko'ring — vizual ko'rinadi."},
// ---------- PostgreSQL DBA (roadmap.sh/postgresql-dba) ----------
{l:"M",t:"mcq",tp:"Ops",q:"PostgreSQL'da <code>shared_buffers</code> va <code>work_mem</code> nima?",
 o:["Ikkalasi ham disk keshi","shared_buffers — butun instance uchun umumiy sahifa keshi (odatda RAM ning ~25%). work_mem — HAR sort/hash operatsiyasi uchun ajratiladigan xotira: ko'p parallel so'rovda ko'paytiriladi, shuning uchun ehtiyot bo'lib oshiriladi","work_mem butun server uchun","shared_buffers har ulanish uchun"],a:1,
 e:"work_mem yetmasa Sort/Hash diskka tushadi (EXPLAIN'da 'external merge Disk: ...'). Xavf: work_mem × parallel operatsiyalar soni × ulanishlar = OOM. Yaxshi amaliyot: global qiymatni mo''tadil qoldirib, og'ir hisobot uchun sessiyada oshirish (SET LOCAL work_mem). Boshqa muhim parametrlar: effective_cache_size (planner uchun maslahat), maintenance_work_mem (VACUUM/CREATE INDEX), max_connections.",src:"https://www.postgresql.org/docs/current/runtime-config-resource.html"},
{l:"S",t:"mcq",tp:"Ops",q:"WAL va checkpoint qanday bog'liq?",
 o:["Bog'liq emas","Har o'zgarish avval WAL'ga yoziladi (durability); checkpoint esa 'iflos' sahifalarni ma'lumot fayllariga tushiradi va tiklash uchun boshlanish nuqtasini belgilaydi. Checkpoint tez-tez bo'lsa I/O tepaligi, kam bo'lsa tiklash uzoq davom etadi","Checkpoint WAL'ni o'chiradi va ma'lumot yo'qoladi","WAL faqat replikatsiya uchun"],a:1,
 e:"Sozlamalar: max_wal_size, checkpoint_timeout, checkpoint_completion_target (yozishni vaqtga yoyish). 'checkpoints are occurring too frequently' logdagi ogohlantirish — max_wal_size ni oshirish signali. WAL shuningdek PITR va logical/physical replikatsiya asosi."},
{l:"S",t:"mcq",tp:"Ops",q:"Postgres'da xavfsizlikni qanday tashkil qilasiz (rollar va kirish)?",
 o:["Hamma ilovaga superuser berish","Eng kam huquq: ilova uchun alohida rol, faqat kerakli schema/jadval huquqlari; migratsiya uchun alohida rol; pg_hba.conf bilan kirish manbai va autentifikatsiya usuli (scram-sha-256), TLS majburiy; kerak bo'lsa Row Level Security (multi-tenant)","Faqat parol qo'yish yetarli","Ruxsatlar ilovada tekshirilsa kifoya"],a:1,
 e:"Rollar meros oladi (GRANT role TO role) — jamoaviy huquqlarni boshqarish uchun qulay. RLS multi-tenant izolyatsiyada kuchli: WHERE tenant_id unutilsa ham DB himoya qiladi. Yana: default privileges (kelajakdagi jadvallar uchun), audit (pgaudit), maxfiy ustunlar uchun shifrlash.",src:"https://www.postgresql.org/docs/current/ddl-rowsecurity.html"},
{l:"S",t:"mcq",tp:"Migrations",q:"Katta production DB'ni yangi major versiyaga (masalan 14 → 16) qanday ko'tarasiz?",
 o:["Faqat paketni yangilash yetarli","Variantlar: pg_upgrade (--link bilan tez, lekin qaytarish qiyin, downtime bor) yoki logical replication bilan yangi versiyaga ko'chirib, qisqa cutover qilish (deyarli nol downtime). Ikkala holatda ham: test muhitida mashq, ANALYZE ni qayta ishga tushirish, rollback rejasi","Major yangilanish ma'lumotni saqlab qolmaydi","Faqat dump/restore mumkin"],a:1,
 e:"Major yangilanishda ichki format o'zgaradi — oddiy restart yetarli emas. Yangilanishdan keyin statistikalar yo'qoladi: darhol ANALYZE (yoki vacuumdb --analyze-in-stages), aks holda so'rovlar sekin bo'ladi. Extension'lar va ularning versiyalari ham tekshiriladi."},
// ---------- Backend / System design roadmap mavzulari ----------
{l:"M",t:"mcq",tp:"Network",q:"CDN nima qiladi va qanday sozlanadi?",
 o:["Faqat rasmlarni siqadi","Kontentni foydalanuvchiga yaqin edge serverlarda keshlaydi: latency va origin yuki kamayadi. Boshqaruv Cache-Control/ETag headerlari, kesh kaliti (URL + tanlangan header) va invalidatsiya (purge yoki versiyalangan URL) orqali","Faqat statik saytlar uchun","DNS o'rnini bosadi"],a:1,
 e:"Amaliy qoidalar: o'zgarmas fayllarga uzoq max-age va fayl nomida hash (app.9f2a.js), HTML'ga qisqa yoki no-cache; dinamik javoblarni ham qisqa TTL bilan keshlash mumkin (stale-while-revalidate). Ehtiyot: shaxsiy ma'lumotli javoblar keshga tushmasin (Cache-Control: private, Vary: Authorization)."},
{l:"M",t:"mcq",tp:"Network",q:"Forward proxy va reverse proxy farqi?",
 o:["Bir xil","Forward proxy — client tomonida (chiquvchi trafikni boshqarish, filtrlash, anonimlik). Reverse proxy — server oldida (nginx, Envoy): TLS termination, marshrutlash, keshlash, rate limiting, yuk taqsimlash","Reverse proxy client tomonda bo'ladi","Proxy faqat VPN uchun"],a:1,
 e:"Reverse proxy backend'ni tashqi dunyodan yashiradi va cross-cutting vazifalarni ilovadan oladi. Tipik zanjir: CDN → LB → reverse proxy → ilova. Muhim tafsilot: client IP ni X-Forwarded-For orqali uzatish va ilovada uni to'g'ri o'qish (rate limit va audit uchun)."},
{l:"S",t:"mcq",tp:"System design",q:"Servis 99.9% SLA va'da qilgan. Bu oyiga qancha uzilish?",
 o:["Taxminan 5 daqiqa","Taxminan 43 daqiqa (30 kunlik oyda). 99.99% ≈ 4.3 daqiqa, 99% ≈ 7.2 soat","Taxminan 7 soat","Uzilish umuman bo'lmaydi"],a:1,
 e:"Zanjirdagi bog'liqliklar ko'paysa mavjudlik ko'paytiriladi: 99.9% bo'lgan 4 ta ketma-ket bog'liqlik ≈ 99.6%. Shuning uchun yuqori SLA uchun: ortiqchalik (redundancy), degradatsiya (bog'liqlik yiqilsa qisman ishlash), keshdan eski javob berish. SLA — tashqi va'da, SLO — ichki maqsad (odatda qattiqroq), SLI — o'lchov."},
{l:"S",t:"open",tp:"System design",q:"Capacity estimation: 10 mln kunlik aktiv foydalanuvchili ilova uchun QPS va saqlashni qanday baholaysiz?",
 m:["Foydalanuvchi xatti-harakatidan boshlash: kuniga o'rtacha nechta amal (masalan 20 so'rov) → 200 mln so'rov/kun","O'rtacha QPS = 200M / 86 400 ≈ 2 300; peak odatda 2–5x → ~10 000 QPS","Saqlash: har yozuv hajmi × kunlik yozuvlar soni × saqlash muddati (+ index va replikatsiya koeffitsienti ~2–3x)","Bandlik: javob hajmi × QPS (masalan 10 KB × 10 000 = 100 MB/s)","Xotira: issiq ma'lumot ulushi (80/20 qoidasi) — keshga sig'adimi","Raqamlarni yaxlitlash va taxminlarni ovoz chiqarib aytish; aniqlik emas, kattalik tartibi muhim"],
 e:"Intervyuda maqsad — arifmetika emas, mantiq. Har farazni aytib boring ('20 so'rov deb olamiz'), shunda intervyuchi kerak bo'lsa tuzatadi.",src:"https://github.com/donnemartin/system-design-primer"},
{l:"M",t:"mcq",tp:"System design",q:"Block, file va object storage farqi?",
 o:["Faqat narxda","Block (EBS) — xom disk bloklari, DB va OS uchun, past latency. File (NFS/EFS) — papka-fayl iyerarxiyasi, umumiy kirish. Object (S3) — kalit + metadata, HTTP API, deyarli cheksiz masshtab, rasm/video/backup uchun","Object storage DB o'rnini bosadi","File storage eng tez"],a:1,
 e:"Tanlov qoidasi: tez-tez qisman o'zgaradigan ma'lumot (DB fayllari) — block; ko'p mashina bir vaqtda o'qiydigan umumiy fayllar — file; katta, o'zgarmas fayllar va CDN bilan tarqatish — object. Object storage'da fayl 'o'zgartirilmaydi', qayta yoziladi; kataloglar esa faqat prefiks illyuziyasi."},
{l:"M",t:"mcq",tp:"Auth",q:"OAuth2 authorization code flow qanday ishlaydi?",
 o:["Client foydalanuvchi parolini olib API'ga yuboradi","Foydalanuvchi provayderda (Google) autentifikatsiyadan o'tadi → client qisqa muddatli authorization code oladi → server o'sha code'ni o'z client_secret'i bilan token'ga almashtiradi. Brauzer/mobil ilova uchun PKCE qo'shiladi","Token URL'da ochiq uzatiladi","Faqat backend servislar uchun"],a:1,
 e:"Nima uchun code almashinuvi: token brauzer tarixida va log'da qolmasligi uchun. Public client (SPA, mobil) client_secret saqlay olmaydi — shuning uchun PKCE majburiy. Boshqa grant'lar: client_credentials (servis-servis), refresh_token. Implicit flow eskirgan va tavsiya etilmaydi.",src:"https://datatracker.ietf.org/doc/html/rfc6749"},
{l:"M",t:"mcq",tp:"Security",q:"OWASP nuqtai nazaridan qaysi juftlik to'g'ri?",
 o:["SQL injection — faqat eski tizimlarda","Injection — parametrlangan so'rovlar bilan; Broken Access Control (IDOR) — har so'rovda obyekt egaligini tekshirish; XSS — chiqishda kontekstga mos qochirish va CSP; SSRF — chiquvchi so'rovlarni allowlist bilan cheklash","XSS — bu server xatosi","CSRF JSON API'da doim bo'ladi"],a:1,
 e:"Eng ko'p uchraydigan real bug — Broken Access Control: /orders/123 ni boshqa foydalanuvchi ochishi. Uni framework o'zi hal qilmaydi — har so'rovda tenant/egalik tekshiruvi va test kerak. Qo'shimcha: sirlarni kodda saqlamaslik, bog'liqliklarni yangilash (SCA), xavfsiz default sozlamalar.",src:"https://owasp.org/www-project-top-ten/"},
{l:"M",t:"mcq",tp:"Testing",q:"Test piramidasi nimani anglatadi?",
 o:["Ko'p E2E test, kam unit test","Ko'p tez unit test (asos), o'rtada integratsiya/kontrakt testlari, eng yuqorida kam sonli E2E test — chunki E2E sekin va mo'rt (flaky)","Faqat E2E yetarli","Testlar soni ahamiyatsiz"],a:1,
 e:"Mikroservislarda kontrakt testlari alohida muhim (Pact yoki OpenAPI/proto asosida): servislarni birga ko'tarmasdan moslikni tekshiradi. Flaky testlar — alohida muammo: ularni ajratib, sababini tuzatish kerak, aks holda jamoa CI natijasiga ishonmay qo'yadi."},
{l:"M",t:"mcq",tp:"OS",q:"Process va thread farqi (backend nuqtai nazaridan)?",
 o:["Farqi yo'q","Process — o'z xotira maydoniga ega, izolyatsiya kuchli, aloqa IPC orqali. Thread — bitta process ichida, xotirani bo'lishadi: almashinuv arzon, lekin umumiy holat uchun sinxronizatsiya kerak (race, deadlock)","Thread alohida xotira oladi","Process har doim tezroq"],a:1,
 e:"Go'da bunga qo'shimcha qatlam bor: goroutine'lar runtime tomonidan OS threadlarga taqsimlanadi. Konteynerda resurs cheklovlari (cgroup) aynan process darajasida qo'llanadi. Nginx/Postgres kabi tizimlar turli modellarni tanlagan: Postgres — har ulanishga process, shuning uchun ulanishlar qimmat."},
{l:"M",t:"mcq",tp:"OS",q:"UTF-8 haqida qaysi to'g'ri?",
 o:["Har belgi 1 bayt","O'zgaruvchan uzunlikdagi kodlash: ASCII 1 bayt, boshqa belgilar 2–4 bayt. Shuning uchun 'uzunlik' bayt, rune (kod nuqtasi) yoki foydalanuvchi ko'radigan grafема bo'lishi mumkin — ular teng emas","Har belgi 2 bayt","UTF-8 faqat ingliz tili uchun"],a:1,
 e:"Go'da: len(s) — baytlar soni, []rune(s) — kod nuqtalari, emoji yoki diakritik belgilar esa bir necha kod nuqtasidan iborat bo'lishi mumkin. Amaliy oqibatlar: DB'da VARCHAR(n) uzunligi (Postgres'da belgi bo'yicha), string kesish (yarim belgi qolmasin), qidiruvda normalizatsiya (NFC) va katta-kichik harf qoidalari tilga bog'liq."},
{l:"S",t:"mcq",tp:"System design",q:"Monolit, modular monolit, SOA, mikroservis va serverless — tanlovda asosiy mezon nima?",
 o:["Eng zamonaviysini tanlash","Jamoa hajmi va mustaqil deploy ehtiyoji, yuk profili, operatsion imkoniyat: kichik jamoa — modular monolit; ko'p jamoa va turlicha masshtab — mikroservis; hodisaga asoslangan, notekis yuk — serverless","Har doim mikroservis","Serverless har doim arzon"],a:1,
 e:"Intervyuda kuchli javob — bitta arxitekturani 'to'g'ri' deb e'lon qilmaslik, balki mezonlarni va o'tish yo'lini (modular monolitdan servislarni ajratib chiqish) aytish. Har variantning operatsion narxini nomlash ham muhim."},
// ---------- ORM, failure modes, profiling ----------
{l:"M",t:"mcq",tp:"ORM",q:"ORM ishlatishning asosiy xavfi nima?",
 o:["Sekin kompilyatsiya","Yaratilayotgan SQL ko'rinmay qoladi: N+1 so'rovlar, keraksiz ustunlar (SELECT *), lazy loading tranzaksiyadan tashqarida, va noto'g'ri tranzaksiya chegaralari","ORM'lar xavfsiz emas","ORM indexlarni o'chiradi"],a:1,
 e:"Amaliy qoida: ORM CRUD uchun, murakkab so'rov uchun qo'lda SQL (Go'da sqlc/sqlx, boshqa tillarda query builder). Har feature uchun log'da yaratilgan SQL'ni ko'rib chiqish odat bo'lishi kerak; testda so'rovlar sonini assert qilish N+1 ni qaytib kelishidan saqlaydi. ORM SQL bilishni almashtirmaydi — intervyuda aynan shuni tekshirishadi."},
{l:"S",t:"open",tp:"Ops",q:"DB bilan bog'liq qanday failure mode'larni bilasiz va har biriga qanday tayyorgarlik ko'rasiz?",
 m:["Primary yiqilishi — failover (Multi-AZ/Patroni), ilovada qayta ulanish va retry, RPO ni bilish","Ulanishlar tugashi — pool cheklovi, PgBouncer, timeout'lar","Disk to'lishi — WAL va log o'sishi, unutilgan replication slot; monitoring va alert","Uzoq tranzaksiya va lock zanjiri — lock_timeout, statement_timeout, idle_in_transaction_session_timeout","Sekin so'rov tufayli CPU 100% — pg_stat_statements, plan regressiya, so'rovni o'ldirish","Replica lag — o'qishni primary'ga qaytarish, lag alert","Inson xatosi (DROP/DELETE) — PITR, delayed replica, ruxsatlarni cheklash","Har biri uchun runbook va muntazam tiklash mashqi"],
 e:"Senior intervyusida 'nima bo'lishi mumkin va siz nima qilasiz' shaklida so'raladi. Kuchli javob har nosozlikka aniq mexanizm va o'lchov (alert) bog'laydi."},
{l:"M",t:"mcq",tp:"Planner",q:"Ilova sekin. DB tomonida profil qilishni qayerdan boshlaysiz (PostgreSQL)?",
 o:["Serverga ko'proq RAM qo'shish","pg_stat_statements — umumiy vaqt bo'yicha eng qimmat so'rovlarni topish (nafaqat eng sekin bitta bajarilish, balki chastota × vaqt), keyin o'sha so'rovlarga EXPLAIN (ANALYZE, BUFFERS)","Hamma jadvalga index qo'yish","Barcha so'rovlarni keshlash"],a:1,
 e:"Muhim nuqta: 5 ms lik so'rov soniyasiga 10 000 marta bajarilsa, 2 soniyalik hisobotdan qimmatroq. Qo'shimcha asboblar: auto_explain (sekin rejalarni logga yozish), log_min_duration_statement, pg_stat_activity (hozir nima ishlayapti), wait event'lar. Optimallashtirishdan oldin o'lchash — asosiy tartib."},
{l:"S",t:"mcq",tp:"Ops",q:"Kecha tez ishlagan so'rov bugun sekin (plan regressiya). Ehtimoliy sabablar?",
 o:["Faqat ma'lumot ko'payganligi","Statistika eskirgan (ANALYZE ishlamagan), ma'lumot taqsimoti o'zgargan, index bloat, parametr sniffing / noto'g'ri baholash, yoki yangi index/versiya planner tanlovini o'zgartirgan","Faqat tarmoq","DB versiyasi hech qachon ta'sir qilmaydi"],a:1,
 e:"Diagnostika: EXPLAIN (ANALYZE) da 'rows' taxmini va 'actual rows' farqi — statistikaga ishora; ANALYZE yoki ustun uchun statistika maqsadini oshirish (ALTER TABLE ... SET STATISTICS), ko'p ustunli bog'liqlik uchun CREATE STATISTICS. Vaqtinchalik chora sifatida so'rovni qayta yozish (masalan LATERAL yoki CTE MATERIALIZED) ishlatiladi."},
// ---------- Qidiruv va real vaqt ----------
{l:"M",t:"mcq",tp:"Elasticsearch",q:"Elasticsearch va Solr — ikkalasi ham Lucene ustida. Amalda qanday tanlanadi?",
 o:["Solr har doim tezroq","Ikkalasining yadro imkoniyatlari o'xshash (Lucene); tanlov ekotizim va operatsiyaga qarab: Elasticsearch — kengroq jamoa, Kibana/Beats bilan log analitikasi, bulutdagi managed variantlar; Solr — Apache ekotizimi, ZooKeeper bilan SolrCloud, mavjud tajriba bo'lsa","Solr JSON qo'llamaydi","Elasticsearch faqat loglar uchun"],a:1,
 e:"Intervyuda 'qaysi biri yaxshi' emas, 'nima uchun shu' javobi kutiladi: jamoa tajribasi, managed servis mavjudligi, litsenziya masalalari (Elastic litsenziya o'zgarishi va OpenSearch forki) va operatsion qo'llab-quvvatlash. Texnik farqlar ko'p hollarda hal qiluvchi emas."},
{l:"M",t:"mcq",tp:"Realtime",q:"Short polling, long polling, SSE va WebSocket — farqi?",
 o:["Hammasi bir xil","Short polling — client doim qayta so'raydi (oddiy, isrofgarchilik). Long polling — server ma'lumot paydo bo'lguncha javobni ushlab turadi. SSE — serverdan clientga bir tomonlama uzluksiz oqim (HTTP ustida, avtomatik qayta ulanish). WebSocket — ikki tomonlama doimiy ulanish","SSE ikki tomonlama","WebSocket HTTP emas va proxy'lardan o'tmaydi"],a:1,
 e:"Tanlov qoidasi: faqat serverdan yangilik kerakmi (narx, bildirishnoma, progress) — SSE yetarli va soddaroq; chat, o'yin, hamkorlikdagi tahrir kabi ikki tomonlama aloqa kerakmi — WebSocket. Long polling — eski client/proxy'lar uchun zaxira variant.",src:"https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events"},
{l:"S",t:"mcq",tp:"Realtime",q:"SSE ning WebSocket'ga nisbatan amaliy afzalligi?",
 o:["Ikki tomonlama aloqa","Oddiy HTTP: mavjud autentifikatsiya, proxy va load balancer bilan muammosiz ishlaydi, avtomatik qayta ulanish va Last-Event-ID bilan uzilgan joydan davom etish qo'llab-quvvatlanadi","Ko'proq ma'lumot uzatadi","Brauzerda qo'llab-quvvatlanmaydi"],a:1,
 e:"Cheklovlari: faqat matn (UTF-8), HTTP/1.1 da domenga ulanishlar soni cheklangan (HTTP/2 da bu muammo yo'q), ba'zi proxy'lar javobni buferlashi mumkin (nginx'da proxy_buffering off). Serverda har ulanish resurs — goroutine/thread modeli va ulanishlar soni rejalashtirilishi kerak."},
{l:"S",t:"open",tp:"Realtime",q:"WebSocket'li servisni masshtablashda qanday muammolar chiqadi?",
 m:["Ulanish stateful: LB sticky bo'lishi yoki ulanish qayerdaligini bilish kerak (presence/registry)","Bir foydalanuvchiga xabar yuborish uchun uning qaysi instance'ga ulanganini topish — odatda Redis Pub/Sub yoki mesh orqali fan-out","Deploy: har deployda hamma ulanish uziladi — client tomonda backoff bilan qayta ulanish va holatni tiklash shart","Resurs: har ulanish xotira va fayl deskriptori; ulanishlar soniga limit va gorizontal masshtab","Sog'liq: heartbeat/ping-pong bilan o'lik ulanishlarni tozalash; idle timeout'lar LB bilan muvofiq","Backpressure: sekin client uchun bufer cheklovi va uzish siyosati"],
 e:"Senior signal: 'stateful ulanish stateless servis modelini buzadi' va deploy/qayta ulanish strategiyasini aytish. Ko'pincha soddaroq yechim — SSE yoki push notification."},
// ---------- MongoDB ----------
{l:"J",t:"mcq",tp:"MongoDB",q:"MongoDB ma'lumotni qanday saqlaydi?",
 o:["Jadval va qatorlarda, qat'iy sxema bilan","Collection ichidagi hujjatlarda (BSON — binar JSON): sxema moslashuvchan, bitta collection'dagi hujjatlar turli maydonlarga ega bo'lishi mumkin","Faqat kalit-qiymat juftliklarida","Graf tugunlarida"],a:1,
 e:"'Sxema yo'q' emas — sxema ilovaga ko'chgan. Amalda sxema baribir bor, faqat uni DB tekshirmaydi; shuning uchun MongoDB'da schema validation (JSON Schema) yoqish tavsiya etiladi. Har hujjatda _id bor va unga avtomatik unique index yaratiladi."},
{l:"M",t:"mcq",tp:"MongoDB",q:"Ma'lumotni embed qilish (ichiga joylash) yoki reference (havola) — qanday tanlanadi?",
 o:["Doim embed qilish kerak","Birga o'qiladigan, cheklangan hajmdagi va bola obyekt mustaqil yashamaydigan bo'lsa — embed (bitta o'qishda hammasi keladi). Ro'yxat cheksiz o'sadigan, mustaqil so'raladigan yoki ko'p joyda takrorlanadigan bo'lsa — reference","Doim reference","Farqi yo'q"],a:1,
 e:"MongoDB'da modellashtirish so'rov shablonidan boshlanadi (normalizatsiyadan emas). Anti-pattern: cheksiz o'suvchi massiv (masalan postga barcha kommentlar) — hujjat 16MB limitiga urilади va har yangilanishda butun hujjat qayta yoziladi. Yechim: kommentlar alohida collection, postda oxirgi 5 tasi embed qilingan (gibrid).",src:"https://www.mongodb.com/docs/manual/data-modeling/"},
{l:"M",t:"mcq",tp:"MongoDB",q:"Compound index <code>{a: 1, b: 1}</code> qaysi so'rovlarni qo'llaydi?",
 o:["Faqat a va b birga ishlatilganini","Prefiks qoidasi (SQL'dagi kabi): {a}, {a,b} bo'yicha so'rovlarni qo'llaydi; faqat {b} bo'yicha samarali emas. ESR qoidasi: Equality, Sort, Range tartibida ustunlarni joylash","Hamma so'rovni","Faqat sort uchun ishlaydi"],a:1,
 e:"Tekshirish: explain(\"executionStats\") — totalKeysExamined va totalDocsExamined qaytarilgan hujjatlar soniga yaqin bo'lishi kerak; COLLSCAN ko'rinsa index yo'q. ESR: avval tenglik maydonlari, keyin sort maydoni, oxirida diapazon — bu Mongo hujjatidagi rasmiy tavsiya.",src:"https://www.mongodb.com/docs/manual/tutorial/equality-sort-range-guideline/"},
{l:"M",t:"mcq",tp:"MongoDB",q:"<code>writeConcern: {w: 1}</code> va <code>{w: \"majority\"}</code> farqi?",
 o:["Farqi yo'q","w:1 — faqat primary tasdiqlaydi: primary yiqilsa, replikaga yetmagan yozuv yo'qolishi mumkin (rollback). w:\"majority\" — ko'pchilik a'zo yozgach tasdiq, failover'da saqlanadi (sekinroq)","w:1 ishonchliroq","majority faqat sharding bilan ishlaydi"],a:1,
 e:"To'lov va buyurtma uchun w:\"majority\" (va kerak bo'lsa journal: true). O'qish tomonida readConcern: \"majority\" — faqat ko'pchilik tasdiqlagan ma'lumotni ko'rsatadi. MongoDB 5.0 dan beri default write concern majority. Read preference secondary bo'lsa — eskirgan ma'lumot kelishi mumkin.",src:"https://www.mongodb.com/docs/manual/reference/write-concern/"},
{l:"S",t:"mcq",tp:"MongoDB",q:"MongoDB'da tranzaksiyalar haqida qaysi to'g'ri?",
 o:["Umuman yo'q","Bitta hujjatga yozish har doim atomik; ko'p hujjatli ACID tranzaksiyalar 4.0 dan (replica set) va 4.2 dan (sharded klaster) mavjud, lekin qimmat — shuning uchun model ko'pincha 'bitta hujjat = bitta tranzaksiya chegarasi' bo'ladigan qilib quriladi","Faqat bitta collection ichida ishlaydi","Tranzaksiya tezroq ishlaydi"],a:1,
 e:"Tranzaksiyalarni doimiy ishlatish MongoDB'ning kuchli tomonini yo'qotadi. Dizayn maslahati: birga o'zgarishi kerak bo'lgan ma'lumotni bitta hujjatga joylang. Tranzaksiya kerak bo'lsa qisqa ushlang (default 60 soniya limiti bor) va TransientTransactionError uchun retry yozing."},
{l:"S",t:"mcq",tp:"MongoDB",q:"Shard key tanlashda eng tipik xato?",
 o:["Juda ko'p maydon olish","Monoton o'suvchi kalit (ObjectId yoki timestamp) — barcha yangi yozuvlar bitta shardga tushadi (hot shard). Yechim: hashed shard key yoki yuqori kardinallikdagi tabiiy kalit (tenant_id, user_id) bilan kombinatsiya","Hashed key ishlatish","tenant_id ni ishlatish"],a:1,
 e:"Yaxshi shard key: yuqori kardinallik, tekis taqsimot, va ko'p so'rovlarda mavjud (aks holda hamma shardga scatter-gather so'rov ketadi). MongoDB 5.0+ da shard key'ni o'zgartirish (resharding) mumkin, lekin qimmat — oldindan to'g'ri tanlash arzonroq.",src:"https://www.mongodb.com/docs/manual/core/sharding-choose-a-shard-key/"},
{l:"S",t:"mcq",tp:"MongoDB",q:"Aggregation pipeline'ni optimallashtirishning asosiy qoidasi?",
 o:["$lookup ni birinchi qo'yish","$match va $project ni imkon qadar boshiga qo'yish — hujjatlar soni va hajmi erta kamayadi va $match index'dan foydalana oladi; $sort katta natijada xotira limitiga urilishi mumkin (allowDiskUse)","Bosqichlar tartibi ahamiyatsiz","Har doim $group bilan boshlash"],a:1,
 e:"$lookup — SQL JOIN emas: sharded muhitda va katta collectionlarda qimmat; ko'pincha ma'lumotni embed qilish yoki ilovada birlashtirish afzal. explain bilan pipeline rejasini ko'rish mumkin. Og'ir hisobotlar uchun analitik nusxa (secondary yoki data warehouse) ishlatiladi."},
{l:"M",t:"mcq",tp:"MongoDB",q:"Replica set'da primary yiqilsa nima bo'ladi?",
 o:["Klaster to'xtaydi va qo'lda aralashuv kerak","A'zolar ovoz berib yangi primary saylaydi (odatda bir necha soniya); shu oraliqda yozish qabul qilinmaydi. Ko'pchilik bo'lmasa (masalan 3 tadan 2 tasi yo'qolsa) — primary saylanmaydi","Secondary avtomatik yozishni qabul qiladi","Ma'lumot butunlay yo'qoladi"],a:1,
 e:"Shuning uchun a'zolar soni toq bo'ladi (3, 5) yoki arbiter qo'shiladi (lekin arbiter ma'lumot saqlamaydi — majority write bilan birga muammo tug'dirishi mumkin, shuning uchun tavsiya etilmaydi). Client driver failover'ni o'zi kutadi — retryable writes yoqilgan bo'lsa yozuv qayta yuboriladi."},
{l:"S",t:"open",tp:"MongoDB",q:"MongoDB'ni qachon tanlaysiz, qachon PostgreSQL (JSONB bilan)?",
 m:["MongoDB: hujjat tabiatli ma'lumot, tez o'zgaruvchan sxema, gorizontal sharding boshidanoq kerak, so'rovlar asosan bitta hujjat/agregat bo'yicha","PostgreSQL: bir nechta obyekt o'rtasida murakkab JOIN va tranzaksiyalar, kuchli konsistentlik, ad-hoc analitik so'rovlar, hisobotlar","Postgres JSONB + GIN — moslashuvchan maydonlar uchun ko'p hollarda yetarli: bir tizimda ham relatsion, ham hujjat modeli","Jamoa tajribasi va operatsion narx (managed variantlar ikkalasida ham bor)","Amaliy yondashuv: default Postgres; MongoDB'ni aniq access pattern va masshtab talabi asoslaganda tanlash"],
 e:"Intervyuda kuchli javob 'qaysi yaxshi' emas, 'qaysi access pattern uchun' tarzida bo'ladi. Ikkalasini ham noto'g'ri ishlatish mumkinligini aytish (Mongo'da JOIN qilishga urinish, Postgres'ni sxemasiz saqlash omboriga aylantirish) — yetuklik belgisi."},
// ---------- QO'SHIMCHA: INDEX (2-to'plam) ----------
{l:"J",t:"mcq",tp:"Index",q:"PostgreSQL va MySQL (InnoDB) da primary key indexi qanday farq qiladi?",
 o:["Ikkalasida bir xil","Postgres: jadval — tartibsiz heap, hamma indexlar (PK ham) alohida strukturada va qator manzilini (TID) saqlaydi. InnoDB: jadval PK bo'yicha clustered — qatorlar PK tartibida saqlanadi, ikkilamchi indexlar esa PK qiymatini saqlaydi","Postgres'da index yo'q","InnoDB'da PK index yaratmaydi"],a:1,
 e:"Amaliy oqibat InnoDB'da: ikkilamchi index bo'yicha qidiruv ikki bosqichli (index → PK → clustered index), shuning uchun PK qisqa bo'lgani yaxshi (UUID v4 — yomon: katta va tasodifiy, sahifalarni parchalaydi). Postgres'da esa CLUSTER buyrug'i bir martalik va avtomatik saqlanmaydi."},
{l:"J",t:"mcq",tp:"Index",q:"<code>UNIQUE constraint</code> va <code>UNIQUE INDEX</code> farqi (PostgreSQL)?",
 o:["Umuman boshqa narsalar","Amalda constraint ostida unique index yaratiladi; farq — constraint katalogda e'lon qilinadi va FK uchun manba bo'la oladi, index esa partial (WHERE) yoki expression bo'lishi mumkin — constraint bunday bo'la olmaydi","Index tezroq tekshiradi","Constraint indexsiz ishlaydi"],a:1,
 e:"Shuning uchun 'faqat o'chirilmagan userlar orasida email unikal' talabi constraint bilan emas, partial unique index bilan yechiladi: CREATE UNIQUE INDEX ... ON users (email) WHERE deleted_at IS NULL. ON CONFLICT bilan ishlatish uchun index ifodasi so'rovdagi ifodaga mos bo'lishi kerak."},
