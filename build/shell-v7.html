{l:"M",t:"code",tp:"Index",q:"EXPLAIN quyidagini ko'rsatyapti. Muammo va yechim?",c:"EXPLAIN SELECT * FROM events ORDER BY created_at DESC LIMIT 10;\n\nLimit\n  ->  Sort  (cost=250000.00..250010.00)\n        Sort Key: created_at DESC\n        ->  Seq Scan on events  (rows=5000000)",
 o:["Hammasi normal, LIMIT 10 tez ishlaydi","5 mln qator o'qilib to'liq saralanmoqda, faqat keyin 10 tasi olinmoqda. created_at bo'yicha index qo'yilsa, planner indexdan tayyor tartibda 10 ta qatorni oladi va Sort yo'qoladi","LIMIT ni oshirish kerak","work_mem ni kamaytirish kerak"],a:1,
 e:"Rejadagi 'Sort' + 'Seq Scan' + ORDER BY + LIMIT — indexsizlikning klassik imzosi. B-tree ikki tomonlama o'qiy oladi, shuning uchun (created_at) indexi DESC uchun ham ishlaydi. Aralash tartib (ORDER BY a ASC, b DESC) bo'lsa — index ham (a ASC, b DESC) bo'lishi kerak."},
{l:"M",t:"mcq",tp:"Index",q:"<code>WHERE a = 1 AND b = 2</code> uchun bitta (a,b) index yaxshimi yoki alohida (a) va (b) indexlari?",
 o:["Alohida indexlar doim yaxshi","(a,b) composite yaxshiroq: bitta strukturadan to'g'ridan-to'g'ri kerakli qatorlar topiladi. Alohida indexlar bo'lsa Postgres BitmapAnd bilan birlashtiradi — ishlaydi, lekin sekinroq","Farqi yo'q","Ikkita index xotira tejaydi"],a:1,
 e:"Qoida: ko'p uchraydigan so'rov shablonini qoplaydigan composite index. Bonus: (a,b) indexi (a) bo'yicha so'rovlarni ham qoplaydi — alohida (a) index ortiqcha bo'lib qoladi. Lekin har xil shartlar ko'p bo'lsa (a=?, b=?, c=?) hammasi uchun alohida composite yaratish ham yozishni sekinlashtiradi — eng muhim 2–3 tasini tanlash kerak."},
{l:"M",t:"mcq",tp:"Index",q:"PostgreSQL B-tree indexi NULL qiymatlarni saqlaydimi?",
 o:["Yo'q, NULLlar indexga tushmaydi","Ha — shuning uchun WHERE col IS NULL ham indexdan foydalana oladi (Oracle'da esa oddiy B-tree NULLni saqlamaydi)","Faqat unique indexda saqlaydi","NULL indexni buzadi"],a:1,
 e:"Bog'liq nozik nuqta: unique index bir nechta NULLga ruxsat beradi, chunki NULL ≠ NULL. 'Bitta aktiv yozuv' talabi kerak bo'lsa NULLS NOT DISTINCT (Postgres 15+) yoki partial unique index ishlatiladi. Tartibda NULL joyi: ASC da oxirida, kerak bo'lsa NULLS FIRST/LAST bilan boshqariladi va index ham shu tartibda yaratilishi mumkin."},
{l:"M",t:"sql",tp:"Index",q:"Email katta-kichik harf farqisiz unikal bo'lsin, lekin faqat o'chirilmagan (deleted_at IS NULL) foydalanuvchilar orasida. Indexni yozing.",
 m:"CREATE UNIQUE INDEX CONCURRENTLY users_email_lower_active_idx\n  ON users (LOWER(email))\n  WHERE deleted_at IS NULL;",k:["CREATE UNIQUE INDEX","LOWER","WHERE","deleted_at"],
 e:"Bu bitta indexda ikki texnika: expression (LOWER) va partial (WHERE). So'rov ham shu ifodaga mos bo'lishi kerak: WHERE LOWER(email) = LOWER($1) AND deleted_at IS NULL. Muqobil: citext tipi yoki emailni yozishda normalizatsiya qilish (ko'pincha eng sodda va ishonchli yo'l)."},
{l:"S",t:"mcq",tp:"Index",q:"Milliardlab qatorli, faqat qo'shiladigan (append-only) va <code>created_at</code> bo'yicha tabiiy tartiblangan jadvalda sana diapazoni bo'yicha qidiruv uchun qaysi index turi juda kam joy egallaydi?",
 o:["B-tree","Hash","BRIN (Block Range INdex) — har blok diapazoni uchun min/max saqlaydi, hajmi juda kichik","GIN"],a:2,
 e:"BRIN faqat ma'lumot jismoniy tartibda saqlansa yaxshi ishlaydi (vaqt bo'yicha o'suvchi log jadvallari) — aks holda deyarli foydasiz. B-tree aniqroq, lekin katta jadvalda gigabaytlab joy oladi. Tez-tez UPDATE bo'ladigan jadvalda tartib buziladi va BRIN samarasi tushadi."},
{l:"S",t:"mcq",tp:"Index",q:"Index vaqt o'tib 'shishib' (bloat) ketdi va sekinlashdi. Production'da nima qilasiz?",
 o:["Indexni DROP qilib qayta yaratish (uzoq vaqt yozish bloklanadi)","REINDEX INDEX CONCURRENTLY (Postgres 12+) — yozishni bloklamaydi; sabablarini ham ko'rish kerak: tez-tez UPDATE, autovacuum yetishmasligi, uzoq tranzaksiyalar","VACUUM FULL har kuni ishlatish","Hech narsa qilib bo'lmaydi"],a:1,
 e:"Bloat sababi — MVCC: UPDATE yangi versiya yaratadi, eski index yozuvlari qoladi. Profilaktika: autovacuum sozlamalari (jadval darajasida scale_factor pasaytirish), fillfactor bilan HOT update imkoniyatini oshirish, uzoq tranzaksiyalarni cheklash. VACUUM FULL jadvalni to'liq qulflaydi — production'da odatda mumkin emas."},
{l:"S",t:"mcq",tp:"Index",q:"Standart (C bo'lmagan) collation'da <code>WHERE name LIKE 'Ali%'</code> uchun oddiy B-tree index ishlamadi. Sabab?",
 o:["LIKE hech qachon index ishlatmaydi","Prefiks qidiruvi uchun taqqoslash tartibi bayt tartibiga mos bo'lishi kerak: C/POSIX collation'da ishlaydi, boshqa collation'da esa text_pattern_ops bilan alohida index kerak: CREATE INDEX ON t (name text_pattern_ops)","name ustuni NULL bo'lgani uchun","Index buzilgan"],a:1,
 e:"Tekshirish: EXPLAIN bilan. Muhim: text_pattern_ops indexi faqat prefiks LIKE uchun ishlaydi, oddiy teng taqqoslash (=) va ORDER BY uchun asosiy index kerak bo'lib qolishi mumkin — ba'zan ikkala index ham saqlanadi. '%li%' kabi qidiruv uchun esa pg_trgm + GIN."},
{l:"S",t:"code",tp:"Index",q:"Index <code>(customer_id, created_at)</code> bor. Nega bu so'rovda hali ham 'Sort' bor?",c:"SELECT * FROM orders\nWHERE customer_id = 42\nORDER BY created_at DESC, id ASC\nLIMIT 20;",
 o:["Index umuman ishlamayapti","ORDER BY da qo'shimcha ustun (id) va aralash yo'nalish bor — index tartibi so'rov tartibiga to'liq mos emas. Mos index: (customer_id, created_at DESC, id ASC)","LIMIT 20 juda katta","created_at tipi noto'g'ri"],a:1,
 e:"Planner Sort'ni faqat index tartibi ORDER BY bilan to'liq mos kelganda olib tashlaydi (ustunlar ketma-ketligi va yo'nalishi). Bir tomonga teskari yo'nalish (hammasi DESC) muammo emas — index ikki tomonlama o'qiladi; aralash yo'nalish esa alohida index talab qiladi. Keyset pagination uchun ham aynan shu index kerak bo'ladi."},
// ---------- QO'SHIMCHA: ISOLATION (chuqurroq) ----------
{l:"J",t:"mcq",tp:"Isolation",q:"<b>Dirty read</b> nima?",
 o:["Diskdan buzilgan ma'lumot o'qish","Boshqa tranzaksiya hali COMMIT qilmagan o'zgarishni o'qish — u keyin ROLLBACK bo'lsa, siz hech qachon mavjud bo'lmagan ma'lumotni ko'rgan bo'lasiz","Eski index'dan o'qish","Keshdan o'qish"],a:1,
 e:"Misol: T1 balansni 100 → 1000 qildi (commit yo'q). T2 1000 ni ko'rib kredit berdi. T1 rollback. T2 'xayoliy' pul asosida qaror qildi. Faqat READ UNCOMMITTED ruxsat beradi — Postgres'da umuman yo'q (READ UNCOMMITTED ham READ COMMITTED kabi ishlaydi)."},
{l:"J",t:"mcq",tp:"Isolation",q:"Non-repeatable read va phantom read farqi?",
 o:["Bir xil narsa","Non-repeatable: <b>bitta qatorni</b> qayta o'qisangiz qiymati o'zgargan (UPDATE). Phantom: <b>shart bo'yicha to'plamni</b> qayta o'qisangiz yangi qatorlar paydo bo'lgan/yo'qolgan (INSERT/DELETE)","Phantom faqat indexlarda bo'ladi","Non-repeatable faqat DELETE da bo'ladi"],a:1,
 e:"Non-repeatable: SELECT balance WHERE id=1 → 100, boshqasi yangilab commit qildi, qayta → 200. Phantom: SELECT COUNT(*) WHERE dept=5 → 10, boshqasi yangi xodim qo'shdi, qayta → 11. Eslab qolish: non-repeatable — mavjud qator o'zgardi; phantom — to'plam tarkibi o'zgardi."},
{l:"M",t:"code",tp:"Isolation",q:"Postgres. T1 va T2 parallel. T1 ning ikkinchi SELECT'i nima qaytaradi: (a) READ COMMITTED da, (b) REPEATABLE READ da?",c:"-- boshida: accounts(id=1).balance = 100\nT1: BEGIN;\nT1: SELECT balance FROM accounts WHERE id = 1;   -- 100\n        T2: BEGIN;\n        T2: UPDATE accounts SET balance = 200 WHERE id = 1;\n        T2: COMMIT;\nT1: SELECT balance FROM accounts WHERE id = 1;   -- ?\nT1: COMMIT;",
 o:["(a) 100, (b) 100","(a) 200, (b) 100","(a) 200, (b) 200","(a) 100, (b) 200"],a:1,
 e:"Asosiy farq — snapshot qachon olinadi. READ COMMITTED: har <b>so'rov</b> boshida yangi snapshot — T2 commit qilgani ko'rinadi (200). REPEATABLE READ: tranzaksiyadagi <b>birinchi so'rovda</b> snapshot olinadi va oxirigacha o'sha — 100. Bu MVCC tufayli: eski versiya hali mavjud, T1 uni o'qiydi, hech kim bloklanmaydi."},
{l:"M",t:"mcq",tp:"Isolation",q:"Postgres REPEATABLE READ. T1 qatorni o'qidi, T2 o'sha qatorni yangilab commit qildi, endi T1 ham o'sha qatorni UPDATE qilmoqchi. Nima bo'ladi?",
 o:["T1 T2 ning o'zgarishini ustidan yozadi (lost update)","T1 xato oladi: 'could not serialize access due to concurrent update' — ilova tranzaksiyani boshidan retry qilishi kerak","T1 abadiy kutadi","T2 rollback bo'ladi"],a:1,
 e:"REPEATABLE READ lost update'ni oldini oladi — lekin xato orqali. Shuning uchun REPEATABLE READ / SERIALIZABLE ishlatsangiz, ilova SQLSTATE 40001 ni ushlab, butun tranzaksiyani qayta bajarishi SHART. READ COMMITTED da esa T1 kutadi, keyin T2 ning yangi qiymati ustida UPDATE'ni qayta baholaydi."},
{l:"M",t:"mcq",tp:"Isolation",q:"SQL standarti bo'yicha jadvalda qaysi qator to'g'ri? (✗ = anomaliya mumkin emas, ✓ = mumkin)",
 o:["READ COMMITTED: dirty ✓, non-repeatable ✗, phantom ✗","REPEATABLE READ: dirty ✗, non-repeatable ✗, phantom ✓","SERIALIZABLE: phantom ✓","READ UNCOMMITTED: hammasi ✗"],a:1,
 e:"Yodlash jadvali (standart):\n• READ UNCOMMITTED: dirty ✓, non-rep ✓, phantom ✓\n• READ COMMITTED: dirty ✗, non-rep ✓, phantom ✓\n• REPEATABLE READ: dirty ✗, non-rep ✗, phantom ✓\n• SERIALIZABLE: hammasi ✗ (+ write skew ham yo'q)\nHar pog'ona bitta anomaliyani yopadi. Postgres farqi: REPEATABLE READ phantom'ni ham yopadi (snapshot), lekin write skew'ni emas. Default'lar: Postgres — READ COMMITTED, MySQL — REPEATABLE READ."},
{l:"S",t:"mcq",tp:"Isolation",q:"Nega hamma joyda SERIALIZABLE ishlatilmaydi?",
 o:["Postgres'da mavjud emas","Konflikt ko'p bo'lganda tranzaksiyalar tez-tez serialization failure bilan abort bo'ladi — retry kerak, throughput tushadi; qo'shimcha kuzatuv (predicate lock) xarajati bor","U dirty read'ga ruxsat beradi","Faqat o'qish uchun ishlaydi"],a:1,
 e:"Amaliy yondashuv: default READ COMMITTED + kritik joylarda aniq himoya — atomik UPDATE (balance = balance - 10), SELECT ... FOR UPDATE, unique/check constraint. SERIALIZABLE — invariant bir nechta qatorga bog'liq va boshqa himoya murakkab bo'lganda (write skew). Intervyuda: 'kerakli joyda, retry logika bilan' deyish."},
{l:"M",t:"code",tp:"Isolation",q:"Omborda 1 ta mahsulot qoldi. READ COMMITTED da ikki xaridor bir vaqtda sotib oladi. Natija va tuzatish?",c:"BEGIN;\nSELECT stock FROM products WHERE id = 7;      -- ikkalasi 1 ko'radi\n-- ilova: if stock > 0 ...\nUPDATE products SET stock = stock - 1 WHERE id = 7;\nINSERT INTO orders ...;\nCOMMIT;",
 o:["Faqat bittasi sotib oladi — DB o'zi himoya qiladi","Ikkalasi sotib oladi, stock = -1 (oversell). Tuzatish: UPDATE ... SET stock = stock - 1 WHERE id = 7 AND stock > 0 va yangilangan qatorlar sonini tekshirish (0 bo'lsa — tugagan); yoki SELECT ... FOR UPDATE; yoki CHECK (stock >= 0)","Deadlock bo'ladi","Ikkinchisi xato oladi"],a:1,
 e:"'Tekshir-keyin-yoz' (check-then-act) ilovada — race condition. Eng sodda va tez yechim: shartni UPDATE ichiga qo'yish — DB qatorni lock qilib, commit bo'lgan oxirgi qiymat bilan shartni qayta tekshiradi. CHECK (stock >= 0) — oxirgi himoya chizig'i."},
{l:"M",t:"open",tp:"Isolation",q:"4 ta isolation darajasini va har biri qaysi anomaliyani yopishini xotiradan tushuntiring (jadval ko'rinishida).",
 m:["READ UNCOMMITTED — hech narsani yopmaydi (dirty read mumkin)","READ COMMITTED — dirty read yopiq; har so'rov yangi snapshot (Postgres default)","REPEATABLE READ — non-repeatable read yopiq; tranzaksiya bitta snapshot (MySQL default); Postgres'da phantom ham yopiq","SERIALIZABLE — hammasi + write skew; natija qandaydir ketma-ket bajarilishga teng; retry kerak","Trade-off: daraja oshgan sari konsistentlik oshadi, parallellik/throughput tushadi"],
 e:"Bu savolga 1 daqiqada aniq javob berish Middle darajaning minimumi. Mashq: jadvalni qog'ozga 3 marta xotiradan chizing, keyin har anomaliyaga bittadan misol ayting."},
// ---------- QO'SHIMCHA: TRANSACTIONS ----------
{l:"J",t:"mcq",tp:"Transactions",q:"<code>BEGIN</code> yozilmasa, Postgres'da har bir so'rov qanday bajariladi?",
 o:["Hech qachon commit bo'lmaydi","Autocommit: har so'rov o'zi alohida tranzaksiya — muvaffaqiyatli bo'lsa darhol commit","Keyingi BEGIN gacha kutadi","Faqat SELECT ishlaydi"],a:1,
 e:"Autocommit rejimida 3 ta alohida UPDATE — 3 ta alohida tranzaksiya: ikkinchisi yiqilsa, birinchisi allaqachon saqlangan. Bir-biriga bog'liq amallar (pul o'tkazish: debit + credit) bitta BEGIN ... COMMIT ichida bo'lishi shart. Diqqat: psql/driver sozlamasi autocommit'ni o'chirishi mumkin (Python psycopg2 default — autocommit OFF)."},
{l:"J",t:"code",tp:"Transactions",q:"Natijada <code>accounts</code> jadvalida nima qoladi?",c:"BEGIN;\nUPDATE accounts SET balance = balance - 100 WHERE id = 1;  -- OK\nUPDATE accounts SET balance = balance + 100 WHERE id = 99; -- 0 qator (id=99 yo'q)\nCOMMIT;",
 o:["Hech narsa o'zgarmaydi — 0 qator xato hisoblanadi, rollback bo'ladi","id=1 dan 100 yechildi, hech kimga qo'shilmadi — pul 'yo'qoldi'","Xato chiqadi","DB avtomatik id=99 ni yaratadi"],a:1,
 e:"0 qator yangilash — xato EMAS, shuning uchun tranzaksiya commit bo'ladi. Atomicity faqat xato bo'lganda ishlaydi. Ilova har UPDATE'ning ta'sir qilgan qatorlar sonini (rowcount) tekshirib, kutilmagan bo'lsa o'zi ROLLBACK qilishi kerak. FK/constraint bo'lsa ham bu holatni ushlamaydi — mantiqiy tekshiruv ilovada."},
{l:"J",t:"mcq",tp:"Transactions",q:"Postgres'da tranzaksiya ichida bitta so'rov xato berdi (masalan unique violation). Keyingi so'rovlar nima bo'ladi?",
 o:["Odatdagidek davom etadi","Tranzaksiya 'aborted' holatga o'tadi: 'current transaction is aborted, commands ignored until end of transaction block' — faqat ROLLBACK (yoki SAVEPOINT'ga qaytish) mumkin","Faqat xato bergan so'rov bekor bo'ladi, qolganlari commit bo'ladi","DB avtomatik retry qiladi"],a:1,
 e:"Postgres xatodan keyin butun tranzaksiyani yaroqsiz deb biladi (MySQL esa faqat o'sha statement'ni bekor qilib, davom etishga ruxsat beradi). Qisman davom etish kerak bo'lsa — SAVEPOINT sp; ... ROLLBACK TO SAVEPOINT sp; yoki INSERT ... ON CONFLICT bilan xatoning oldini olish."},
{l:"M",t:"code",tp:"Transactions",q:"SAVEPOINT bilan natija: qaysi qatorlar saqlanadi?",c:"BEGIN;\nINSERT INTO logs VALUES (1);\nSAVEPOINT a;\nINSERT INTO logs VALUES (2);\nROLLBACK TO SAVEPOINT a;\nINSERT INTO logs VALUES (3);\nCOMMIT;",
 o:["1, 2, 3","1, 3","Faqat 1","Hech narsa"],a:1,
 e:"ROLLBACK TO SAVEPOINT faqat savepoint'dan keyingi o'zgarishlarni bekor qiladi, tranzaksiya davom etadi. ORM'lardagi 'nested transaction' (Django atomic() ichida atomic(), Rails requires_new) aslida savepoint'lar. Postgres'da haqiqiy nested tranzaksiya yo'q. Ko'p savepoint — performance narxi bor (subtransaction SLRU muammosi)."},
{l:"M",t:"open",tp:"Transactions",q:"Uzoq davom etadigan (yoki 'idle in transaction') tranzaksiyalar nima uchun xavfli?",
 m:["Lock'larni ushlab turadi — boshqa so'rovlar navbatda kutadi, zanjir bo'lib butun servis to'xtashi mumkin","MVCC: VACUUM eski qator versiyalarini tozalay olmaydi — jadval va index shishadi (bloat), so'rovlar sekinlashadi","Connection pool'dan ulanishni band qiladi","Replica'da hot_standby_feedback bilan primary'ga ham ta'sir","Himoya: idle_in_transaction_session_timeout, statement_timeout, lock_timeout; tranzaksiya ichida tashqi HTTP chaqiruv qilmaslik; pg_stat_activity monitoringi"],
 e:"Klassik incident: kimdir psql'da BEGIN yozib, tushlikka ketdi. Tranzaksiya ichida tashqi API chaqiruv (to'lov provayder 30s javob bermaydi) — eng ko'p uchraydigan sabab. Qoida: tranzaksiya faqat DB ishini qamrab olsin, qisqa bo'lsin."},
{l:"M",t:"mcq",tp:"Transactions",q:"COMMIT qaytgandan keyin server elektr o'chib ketdi. Ma'lumot saqlanganmi va nima orqali?",
 o:["Yo'q, ma'lumot faqat xotirada edi","Ha — COMMIT WAL (write-ahead log) diskka fsync qilinganidan keyin qaytadi; qayta ishga tushganda WAL qayta o'ynaladi (redo)","Faqat checkpoint bo'lgan bo'lsa","Faqat replica bo'lsa"],a:1,
 e:"Durability = WAL. Ma'lumot sahifalari keyinroq (checkpoint'da) diskka yoziladi, lekin WAL darhol. synchronous_commit = off — commit tezroq, lekin crash'da oxirgi bir necha yuz ms yo'qolishi mumkin (DB buzilmaydi, faqat oxirgi commitlar). Log/analitika uchun qabul qilinadi, to'lov uchun yo'q."},
{l:"M",t:"code",tp:"Transactions",q:"Bu kodning muammosi nima?",c:"with db.transaction():\n    order = db.insert_order(cart)\n    payment = stripe.charge(card, order.total)   # HTTP, 2–30 s\n    db.mark_paid(order.id, payment.id)\n    email.send(user, \"Rahmat!\")",
 o:["Muammo yo'q","Tranzaksiya ichida tashqi chaqiruvlar: lock va ulanish uzoq band; charge o'tib, keyin DB rollback bo'lsa — pul yechilgan, order yo'q; email rollback'dan keyin ham ketgan bo'ladi","Faqat email async bo'lishi kerak","stripe.charge ikki marta chaqirilishi kerak"],a:1,
 e:"Tashqi side effect'ni rollback qilib bo'lmaydi. To'g'ri oqim: 1) order'ni 'pending' holatda commit qilish; 2) tranzaksiyadan tashqarida idempotency key bilan charge; 3) yangi qisqa tranzaksiyada 'paid' + outbox'ga 'send_email' event; 4) worker email yuboradi. Tiklash uchun 'pending' qolib ketganlarni tekshiruvchi job."},
{l:"S",t:"mcq",tp:"Transactions",q:"Two-phase commit (2PC) ning asosiy muammosi?",
 o:["Juda tez ishlaydi","Koordinator prepare'dan keyin yiqilsa, qatnashchilar 'in-doubt' holatda lock ushlab qoladi (blocking protocol); latency oshadi, har qatnashchi mavjud bo'lishi shart","Atomiklikni kafolatlamaydi","Faqat bitta DB bilan ishlaydi"],a:1,
 e:"2PC: prepare (hamma 'tayyorman' deydi va diskka yozadi) → commit. Koordinator o'rtada o'lsa — hamma kutadi. Postgres'da PREPARE TRANSACTION bor, lekin unutilgan prepared tx VACUUM'ni bloklaydi. Mikroservislarda odatda 2PC o'rniga saga + outbox."},
{l:"S",t:"mcq",tp:"Transactions",q:"Postgres'da DDL (ALTER TABLE, CREATE INDEX) tranzaksiya ichida qanday ishlaydi?",
 o:["DDL implicit commit qiladi (MySQL kabi)","Postgres'da DDL tranzaksion — BEGIN; ALTER ...; ROLLBACK; o'zgarishni to'liq bekor qiladi (CREATE INDEX CONCURRENTLY va ba'zi buyruqlar bundan mustasno)","DDL tranzaksiyada taqiqlangan","Faqat superuser uchun tranzaksion"],a:1,
 e:"Migratsiya uchun katta afzallik: ko'p qadamli migratsiya yarmida yiqilsa, hammasi qaytadi. MySQL/Oracle'da DDL implicit commit — yarim bajarilgan migratsiya qoladi. Ogohlantirish: ALTER ACCESS EXCLUSIVE lock oladi va tranzaksiya oxirigacha ushlab turadi — migratsiya tranzaksiyasini qisqa qiling, lock_timeout qo'ying."},
{l:"S",t:"open",tp:"Transactions",q:"Tranzaksiya chegarasini (boundary) qayerda qo'yasiz — repository, service yoki controller? DDD kontekstida tushuntiring.",
 m:["Chegara — use case (application service) darajasida: bitta biznes amal = bitta tranzaksiya","Repository o'zi commit qilmaydi — aks holda bir nechta repository'ni atomik birlashtirib bo'lmaydi (Unit of Work pattern)","Controller/HTTP qatlamida emas — tranzaksiya kerakidan uzun va tashqi chaqiruvlarni qamrab oladi","DDD: bitta tranzaksiyada bitta aggregate'ni o'zgartirish; boshqa aggregate'lar — domain event orqali, eventual","Tashqi side effect'lar commit'dan keyin (outbox)"],
 e:"Senior signal: 'bitta tranzaksiya — bitta aggregate' qoidasi va nega (lock contention, masshtab). Unit of Work — ORM session (SQLAlchemy Session, EF DbContext)."},
// ---------- QO'SHIMCHA: ISOLATION & LOCKING ----------
{l:"M",t:"mcq",tp:"Isolation",q:"<b>Read skew</b> (inconsistent read) qaysi holat?",
 o:["Bir qatorni ikki marta o'qish","T1 hisob A ni o'qiydi (500), T2 A dan B ga 100 o'tkazib commit qiladi, T1 endi B ni o'qiydi (yangi, 600) — T1 jami 1100 ko'radi, aslida 1000","Indexdan noto'g'ri o'qish","Replica'dan o'qish"],a:1,
 e:"READ COMMITTED da har so'rov yangi snapshot — shuning uchun turli qatorlar turli vaqt holatidan o'qiladi. Hisobot, backup, balans yig'indisi uchun xavfli. Yechim: REPEATABLE READ (bitta snapshot) yoki hammasini bitta so'rovda o'qish. pg_dump aynan shuning uchun REPEATABLE READ ishlatadi."},
{l:"M",t:"mcq",tp:"Isolation",q:"Snapshot isolation nimani anglatadi?",
 o:["DB diskining nusxasi","Tranzaksiya boshlangan paytdagi commit bo'lgan holatni ko'radi; o'quvchilar yozuvchilarni, yozuvchilar o'quvchilarni bloklamaydi (MVCC)","Hamma so'rovlar ketma-ket bajariladi","Faqat o'qish uchun rejim"],a:1,
 e:"'Readers don't block writers, writers don't block readers' — MVCC'ning asosiy afzalligi. Postgres REPEATABLE READ = snapshot isolation. U dirty, non-repeatable, phantom, lost update'ni yopadi, lekin write skew'ni emas. Oracle 'SERIALIZABLE' deb atagani aslida snapshot isolation."},
{l:"M",t:"mcq",tp:"Locking",q:"<code>FOR UPDATE</code> va <code>FOR SHARE</code> farqi?",
 o:["Farqi yo'q","FOR SHARE — boshqalar ham FOR SHARE olishi mumkin, lekin o'zgartira olmaydi; FOR UPDATE — eksklyuziv, boshqa FOR UPDATE/SHARE va UPDATE/DELETE kutadi","FOR SHARE jadvalni lock qiladi","FOR UPDATE o'qishni ham bloklaydi"],a:1,
 e:"Oddiy SELECT hech qanday row lock kutmaydi (MVCC). FOR SHARE: 'men o'qiyotganimda bu qator o'zgarmasin' (masalan FK tekshiruvi). FOR UPDATE: 'men buni o'zgartiraman'. Postgres'da yengilroq variantlar: FOR NO KEY UPDATE (FK'larni bloklamaydi), FOR KEY SHARE."},
{l:"M",t:"code",tp:"Locking",q:"10 ta worker bir jadvaldan job oladi. Qaysi variant to'g'ri va nima uchun?",c:"-- A\nSELECT * FROM jobs WHERE status='pending'\nORDER BY id LIMIT 1 FOR UPDATE;\n\n-- B\nSELECT * FROM jobs WHERE status='pending'\nORDER BY id LIMIT 1 FOR UPDATE SKIP LOCKED;\n\n-- C\nSELECT * FROM jobs WHERE status='pending'\nORDER BY id LIMIT 1 FOR UPDATE NOWAIT;",
 o:["A — eng xavfsiz","B — band qatorni o'tkazib yuborib keyingi bo'sh job'ni oladi; A'da hamma worker bitta qatorni kutib navbatga turadi; C band bo'lsa darhol xato beradi","C — eng tez","Uchalasi bir xil"],a:1,
 e:"SKIP LOCKED — Postgres'da navbat (queue) qurishning standart usuli: parallel worker'lar bir-birini kutmaydi. NOWAIT — 'kutmayman, darhol xato' (user interfeysda 'boshqa kishi tahrirlayapti' deyish uchun). Job'ni olgach status='running' qilib commit qiling yoki tranzaksiya ichida bajaring."},
{l:"S",t:"mcq",tp:"Isolation",q:"MySQL InnoDB REPEATABLE READ phantom'ni qanday oldini oladi (locking read'larda)?",
 o:["Hech qanday — phantom bo'ladi","Next-key lock (record lock + gap lock): indexdagi qator va undan oldingi 'bo'shliq'ni lock qiladi — boshqalar shu oraliqqa INSERT qila olmaydi","Jadvalni to'liq lock qiladi","Snapshot bilan, lock'siz"],a:1,
 e:"Oddiy SELECT — snapshot (MVCC). SELECT ... FOR UPDATE / UPDATE — next-key lock. Oqibat: index bo'lmagan ustun bo'yicha UPDATE WHERE butun jadvalni lock qilishi mumkin, gap lock'lar kutilmagan deadlock'lar beradi. Ko'p kompaniyalar MySQL'da READ COMMITTED'ga o'tadi — gap lock'lar yo'qoladi."},
{l:"S",t:"code",tp:"Isolation",q:"SERIALIZABLE bilan ishlaganda ilova kodi qanday bo'lishi kerak? Qaysi variant to'g'ri?",c:"# A\ntry:\n    with tx(isolation=\"serializable\"):\n        transfer(a, b, 100)\nexcept SerializationFailure:\n    log.error(\"xato\")\n\n# B\nfor attempt in range(5):\n    try:\n        with tx(isolation=\"serializable\"):\n            transfer(a, b, 100)\n        break\n    except SerializationFailure:   # SQLSTATE 40001\n        sleep(backoff(attempt))\nelse:\n    raise",
 o:["A — xatoni loglash yetarli","B — butun tranzaksiyani boshidan (qayta o'qish bilan) retry qilish, backoff va chegara bilan","Ikkalasi ham noto'g'ri — SERIALIZABLE xato bermaydi","A, chunki retry ikki marta o'tkazadi"],a:1,
 e:"40001 (serialization_failure) va 40P01 (deadlock) — 'normal' xatolar, qayta urinsa o'tadi. Muhim: faqat oxirgi so'rovni emas, butun tranzaksiyani qayta bajarish (ma'lumotni qayta o'qish). Tranzaksiya ichida tashqi side effect bo'lmasligi kerak — aks holda retry uni takrorlaydi."},
{l:"S",t:"mcq",tp:"MVCC",q:"Postgres qator versiyasi tranzaksiyaga ko'rinadimi-yo'qligini qanday aniqlaydi?",
 o:["Timestamp ustuni orqali","Har tuple'da xmin (yaratgan tx ID) va xmax (o'chirgan/yangilagan tx ID); snapshot'dagi faol tranzaksiyalar ro'yxati bilan solishtiriladi: xmin commit bo'lgan va snapshot'dan oldin, xmax esa yo'q yoki hali ko'rinmas bo'lsa — ko'rinadi","Index orqali","Lock jadvali orqali"],a:1,
 e:"SELECT xmin, xmax, * FROM t; — o'zingiz ko'ring. Snapshot = (xmin, xmax, faol tx ro'yxati). Shuning uchun uzoq tranzaksiya eski versiyalarni 'tirik' ushlab turadi — VACUUM ularni o'chira olmaydi. Bu isolation, VACUUM va bloat'ni bitta mexanizmga bog'laydi — senior intervyuda juda yaxshi signal."},
{l:"S",t:"mcq",tp:"Locking",q:"Production'da <code>ALTER TABLE users ADD COLUMN x int;</code> bir soniyalik operatsiya, lekin butun sayt 2 daqiqa to'xtadi. Sabab?",
 o:["ADD COLUMN butun jadvalni qayta yozadi","ALTER ACCESS EXCLUSIVE lock kutdi (uzoq SELECT ushlab turgan edi); navbatdagi ALTER o'zidan keyin kelgan HAMMA so'rovlarni ham bloklaydi — lock queue. Yechim: SET lock_timeout = '3s' va retry","Index qayta qurildi","Disk to'ldi"],a:1,
 e:"Lock queue — eng ko'p tushunilmaydigan mexanizm: kutayotgan eksklyuziv lock so'rovi keyingi oddiy SELECT'larni ham o'zidan o'tkazmaydi. Shuning uchun migratsiyalarda doim lock_timeout + retry. Postgres 11+ ADD COLUMN ... DEFAULT (volatile bo'lmagan) jadvalni qayta yozmaydi."},
{l:"St",t:"mcq",tp:"Locking",q:"Bir nechta servis instance'i bitta cron job'ni bir vaqtda bajarmasligi kerak. DB'da yengil yechim?",
 o:["Har instance'da boolean o'zgaruvchi","pg_try_advisory_lock(job_id) — kim olsa bajaradi, qolganlar false oladi va o'tkazib yuboradi; session tugasa lock avtomatik bo'shaydi","Jadvalni LOCK TABLE bilan lock qilish","sleep(random) qo'yish"],a:1,
 e:"Advisory lock — Postgres'ning ilova darajasidagi mutex'i, jadval qatorlariga bog'liq emas. Session-level va transaction-level (pg_advisory_xact_lock) turlari bor. PgBouncer transaction mode'da session-level advisory lock ishonchsiz — xact variantini ishlating. Ko'p node'li umumiy lock uchun alternativ — Redis/etcd lease."},
{l:"St",t:"open",tp:"Isolation",q:"Bank tizimi uchun isolation strategiyasini loyihalang: qaysi operatsiyaga qaysi daraja va mexanizm?",
 m:["Default READ COMMITTED — ko'p o'qish/yozish uchun yetarli va tez","Pul o'tkazish: atomik UPDATE balance = balance - x WHERE balance >= x, ikkala hisobni id tartibida lock (deadlock yo'q), CHECK (balance >= 0)","Ko'p qatorli invariantlar (limit, 'jami qarz ≤ N'): SERIALIZABLE + retry yoki umumiy qatorni FOR UPDATE bilan lock","Hisobot/reconciliation: REPEATABLE READ READ ONLY (bir xil snapshot) yoki replica","Ledger modeli: balansni UPDATE emas, append-only yozuvlar (double-entry) — audit va konkurentlik soddalashadi","Idempotency key har to'lov so'roviga"],
 e:"Staff signal: 'hammasiga SERIALIZABLE' emas — har operatsiya uchun eng arzon yetarli mexanizm. Append-only ledger lost update muammosining o'zini yo'q qiladi."},
];

{l:"J",t:"mcq",tp:"HTTP",q:"401 va 403 status kodlari farqi?",

{l:"J",t:"code",tp:"REST",q:"Yangi user muvaffaqiyatli yaratildi. Eng to'g'ri javob?",c:"POST /users\nContent-Type: application/json\n\n{\"email\": \"ali@x.uz\"}",

{l:"J",t:"open",tp:"HTTP",q:"Brauzerga URL yozib Enter bosganda nima sodir bo'ladi (backend nuqtai nazaridan)?",

{l:"J",t:"mcq",tp:"API",q:"'Stateless' server nimani anglatadi?",

{l:"M",t:"mcq",tp:"Resilience",q:"Token bucket rate limiting qanday ishlaydi?",

{l:"M",t:"mcq",tp:"Security",q:"Frontend app.uz, API api.uz. Brauzer 'blocked by CORS policy' xatosi berdi. To'g'ri tushuncha?",

{l:"M",t:"code",tp:"Resilience",q:"Bu kodning muammosi nima?",c:"for attempt in range(5):\n    try:\n        return payments.charge(user_id, amount)   # POST\n    except Timeout:\n        continue",

{l:"M",t:"open",tp:"API",q:"Katta ro'yxat uchun API pagination'ni qanday loyihalaysiz?",

{l:"P",t:"mcq",tp:"System design",q:"So'rov 100 ta backend'ga parallel fan-out qiladi, har birining p99 = 10ms. Umumiy so'rovning taxminiy xulqi?",

 e:"'Tail at scale' (Dean & Barroso). Yechimlar: hedged requests (sekin bo'lsa ikkinchi replikaga), tied requests, fan-out'ni kamaytirish, partial results bilan javob. Principal darajada p99'ni arxitektura muammosi sifatida ko'rish."},
{l:"P",t:"open",tp:"Microservices",q:"Multi-tenant SaaS'da tenant izolatsiyasini (xavfsizlik va 'noisy neighbor') qanday ta'minlaysiz?",
 m:["Modellar: shared DB + tenant_id; schema per tenant; DB per tenant — narx va izolatsiya trade-off","Ma'lumot izolatsiyasi: har so'rovda tenant konteksti majburiy (Postgres RLS, ORM default scope), testlar","Noisy neighbor: tenant bo'yicha rate limit, kvota, alohida navbat/worker pool","Katta enterprise mijozlar uchun dedicated tier (cell architecture)","Observability tenant bo'yicha: narx va yuk attributsiyasi"],
 e:"Principal signal: bitta model hammaga emas — tier'lar va cell-based arxitektura; va xavfsizlikni kod review'ga emas, RLS kabi tizimli mexanizmga yuklash."},
{l:"P",t:"open",tp:"SRE",q:"Tashkilot bo'ylab backend servislar sifatini qanday oshirasiz (50+ jamoa)?",
 m:["Paved road: standart servis shabloni — logging, tracing, metrikalar, health check, graceful shutdown tayyor","Production readiness checklist va avtomatik tekshiruvlar (CI)","SLO va on-call egalik har jamoada; blameless postmortem, takrorlanuvchi sabablar tahlili","Platforma jamoasi mahsulot sifatida — ichki mijozlar fikri","Metrikalar: DORA (deploy chastotasi, lead time, change failure rate, MTTR)"],
 e:"Principal javob — texnologiya emas, tizim: to'g'ri yo'lni eng oson yo'lga aylantirish va natijani o'lchash."},
{l:"P",t:"open",tp:"System design",q:"Sinxron REST zanjiridan (A→B→C→D) event-driven arxitekturaga o'tish kerakmi? Qanday qaror qilasiz?",
 m:["Muammo: sinxron zanjirda availability ko'paytiriladi (0.99^4 ≈ 96%), latency qo'shiladi","Event-driven: temporal decoupling, mustaqil masshtab; lekin eventual consistency, debugging qiyin, event sxemasi kontrakt","Hamma narsani emas: user darhol javob kutadigan query'lar — sinxron; side effect'lar (email, analitika) — async","Asoslar: outbox, idempotent consumer, schema registry, distributed tracing","Bosqichli: eng og'riqli zanjirdan boshlash va natijani o'lchash"],
 e:"Principal signal: 'yoki-yoki' emas — har o'zaro ta'sir uchun consistency va latency talabiga qarab tanlash; operatsion narxni tan olish."}
];

// ---------- bo'limlar ----------
const QI=[
// ================= MIKROSERVIS & INFRASTRUKTURA =================
// ---------- Mikroservis patternlari ----------
{l:"J",t:"mcq",tp:"Patterns",q:"Mikroservis arxitekturasining monolitdan asosiy farqi?",
 o:["Kod hajmi kichikroq","Har servis mustaqil deploy qilinadi, o'z ma'lumot bazasiga ega va tarmoq orqali muloqot qiladi","Faqat bulutda ishlaydi","DB kerak emas"],a:1,
 e:"Asosiy mezon — mustaqil deploy. Agar 5 ta 'servis'ni birga deploy qilish kerak bo'lsa, bu distributed monolit: mikroservis narxini to'laysiz, foydasini olmaysiz. Umumiy DB ham shu belgi. Foyda: jamoalar mustaqil ishlaydi, alohida masshtab. Narx: tarmoq nosozliklari, tracing, deploy infratuzilmasi."},
{l:"M",t:"mcq",tp:"Discovery",q:"Servis boshqa servisning manzilini qanday topadi (service discovery)?",
 o:["Manzillar konfiguratsiya faylida qo'lda yoziladi","Registry (Consul, etcd) yoki platforma DNS'i orqali: Kubernetes'da Service nomi (orders.default.svc) barqaror virtual IP beradi, podlar almashsa ham nom o'zgarmaydi","Har safar butun tarmoqni skanerlaydi","Faqat IP bo'yicha"],a:1,
 e:"Client-side discovery: client registry'dan ro'yxat olib, o'zi balanslaydi (Eureka+Ribbon). Server-side: LB/Service orqali (Kubernetes). Podlar o'ladi va yangi IP oladi — shuning uchun qat'iy IP yozish ishlamaydi. DNS keshi va TTL — tipik tuzoq (JVM'da DNS kesh abadiy bo'lishi mumkin)."},
{l:"M",t:"open",tp:"Patterns",q:"Servis chegarasini (qaysi kod qaysi servisga tegishli) qanday aniqlaysiz?",
 m:["Bounded context bo'yicha — biznes qobiliyati, texnik qatlam emas ('order' servisi, 'database' servisi emas)","Ma'lumot egaligi: bitta jadvalni ikki servis yozmaydi","Birga o'zgaradigan kod birga tursin (bitta feature 3 servisga deploy talab qilsa — chegara noto'g'ri)","Jamoa strukturasi (Conway qonuni) va mustaqil ishlash imkoni","Masshtab va SLA farqi: og'ir yuk yoki boshqa ishonchlilik talabi ajratishga sabab","Shubha bo'lsa — kattaroq servis: ajratish birlashtirishdan oson"],
 e:"Middle/Senior signal: 'birga o'zgaradigan narsa birga tursin' mezoni. Yomon chegara alomati: har release'da 4 ta servisni muvofiqlashtirish, servislar orasida chatty (juda ko'p) chaqiruvlar."},
{l:"S",t:"mcq",tp:"Mesh",q:"Service mesh (Istio, Linkerd) nima beradi?",
 o:["Ilova kodini tezlashtiradi","Sidecar proxy orqali kodga tegmasdan: mTLS, retry/timeout, circuit breaking, trafik bo'lish (canary), va avtomatik metrika/tracing","DB replikatsiyasini boshqaradi","CI/CD pipeline"],a:1,
 e:"Bu imkoniyatlarni kutubxona bilan ham olish mumkin (Resilience4j), lekin har til uchun alohida. Mesh — infratuzilma qatlamida, tilga bog'liq emas. Narxi: har podda qo'shimcha proxy (latency, xotira), murakkab debugging, control plane. Kichik tizimda ortiqcha — 10+ servis va ko'p tilli muhitda ma'noga ega."},
{l:"S",t:"open",tp:"Patterns",q:"Servislar orasida umumiy kod (shared library) ishlatish kerakmi?",
 m:["Texnik kutubxonalar (logging, tracing, HTTP client) — ha, versiyalangan paket sifatida","Biznes logika va domain modeli — yo'q: umumiy kutubxona servislarni bir-biriga bog'lab qo'yadi, har o'zgarishda hammasini yangilash kerak","DTO/kontraktlar: generatsiya qilingan client (OpenAPI, protobuf) — maqbul, lekin versiyalash bilan","Ba'zi takrorlanish mikroservisda normal — coupling'dan arzonroq","Majburiy yangilanish talab qilmaslik: eski versiyani qo'llab turish"],
 e:"Senior signal: DRY'ni mikroservis chegarasidan o'tkazmaslik. 'Shared domain library' — distributed monolitga olib boradigan eng tez yo'l."},
{l:"St",t:"mcq",tp:"Patterns",q:"Strangler fig pattern nima?",
 o:["Eski tizimni o'chirib, yangisini bir kunda yoqish","Eski tizim oldiga proxy qo'yib, funksiyani bo'lak-bo'lak yangi servisga ko'chirish; trafik asta-sekin o'tadi, eski tizim bo'shab qolgach o'chiriladi","Ikki tizimni doim parallel ishlatish","Ma'lumotni faqat o'qish rejimiga o'tkazish"],a:1,
 e:"'Big bang rewrite' deyarli doim kechikadi va biznes yangi featurelarsiz qoladi. Strangler: har qadam alohida qiymat beradi va rollback qilinadi. Kerakli elementlar: routing qatlami (proxy/gateway), ma'lumot sinxronizatsiyasi (CDC yoki dual write), va o'chirish rejasi — aks holda ikki tizim abadiy qoladi."},
// ---------- Konteyner & Kubernetes ----------
{l:"J",t:"mcq",tp:"Docker",q:"Konteyner va virtual mashina farqi?",
 o:["Konteyner o'z operatsion tizim yadrosini yuklaydi","Konteyner host yadrosini bo'lishadi va faqat jarayonni izolyatsiya qiladi (namespace, cgroup) — soniyalarda ishga tushadi, kam resurs; VM to'liq OS va yadro bilan, kuchliroq izolyatsiya","VM tezroq ishga tushadi","Farqi yo'q"],a:1,
 e:"Konteyner — o'ralgan jarayon, 'kichik VM' emas. Oqibatlari: yadro umumiy (xavfsizlik chegarasi zaifroq — shuning uchun ko'p tenantli muhitda gVisor/Firecracker), host yadrosiga bog'liqlik (Linux image Windows yadrosida ishlamaydi). Image — qatlamli fayl tizimi, konteyner esa shu image'dan ishga tushgan jarayon."},
{l:"J",t:"code",tp:"Docker",q:"Nega har kod o'zgarishida build 5 daqiqa ketadi? Tuzatish?",c:"FROM node:20\nWORKDIR /app\nCOPY . .\nRUN npm ci\nRUN npm run build\nCMD [\"node\", \"dist/main.js\"]",
 o:["npm sekin, chora yo'q","COPY . . hamma faylni oldin nusxalaydi — har o'zgarishda keyingi qatlamlar keshdan tushadi. Avval package*.json ni COPY qilib npm ci ni bajarish, keyin qolgan kodni COPY qilish kerak","FROM ni o'zgartirish kerak","CMD ni ENTRYPOINT qilish kerak"],a:1,
 e:"Docker qatlamlarni keshlaydi: qatlam inputi o'zgarmasa qayta bajarilmaydi. To'g'ri tartib: kam o'zgaradigan narsa yuqorida. Yana: .dockerignore (node_modules, .git), multi-stage build bilan yakuniy image'da faqat dist va production bog'liqliklar, root bo'lmagan user, aniq versiyali base image (node:20.11-alpine, latest emas)."},
{l:"M",t:"mcq",tp:"Docker",q:"Production image hajmini kamaytirishning eng samarali yo'li?",
 o:["Fayllarni gzip qilish","Multi-stage build: builder bosqichida kompilyatsiya, yakuniy bosqichga faqat artefakt ko'chiriladi (build toollari, dev bog'liqliklar, kesh qolmaydi)","RUN buyruqlarini ko'paytirish","Image'ni tez-tez qayta build qilish"],a:1,
 e:"Katta image — sekin deploy, sekin autoscaling, katta hujum yuzasi. Qo'shimcha: slim/alpine yoki distroless base, RUN'larni birlashtirib keshni o'chirish (apt-get clean), .dockerignore. Go uchun yakuniy image scratch/distroless'da bir necha MB bo'lishi mumkin."},
{l:"M",t:"mcq",tp:"Kubernetes",q:"Liveness va readiness probe farqi?",
 o:["Bir xil, ikkita nom","Readiness — pod trafik qabul qilishga tayyormi (tayyor bo'lmasa Service'dan chiqariladi); Liveness — jarayon osilib qolganmi (fail bo'lsa konteyner qayta ishga tushiriladi)","Liveness faqat startda ishlaydi","Readiness podni o'chiradi"],a:1,
 e:"Tipik xato: liveness probe'ni DB'ga bog'lash — DB bir daqiqa sekinlashса, Kubernetes hamma podlarni restart qilib incidentni kuchaytiradi. Qoida: liveness faqat 'jarayon tirikmi' (yengil, bog'liqliksiz), readiness bog'liqliklarni tekshirishi mumkin. Sekin startlar uchun startupProbe."},
{l:"M",t:"code",tp:"Kubernetes",q:"Pod tez-tez OOMKilled bo'lyapti va latency sakrayapti. Bu manifestda nima muammo?",c:"resources:\n  requests:\n    cpu: \"2\"\n    memory: \"2Gi\"\n  limits:\n    cpu: \"2\"\n    memory: \"256Mi\"",
 o:["Hech qanday muammo yo'q","memory limit (256Mi) request'dan (2Gi) kichik — konteyner limitga yetib OOMKill bo'ladi; CPU limit = request bo'lsa ham throttling bo'lishi mumkin. Memory limit ≈ request qilib real o'lchangan qiymatga qo'yish kerak","CPU juda kam","requests olib tashlash kerak"],a:1,
 e:"CPU — siqiladigan resurs: limitdan oshsa throttle (sekinlashadi). Memory — siqilmaydi: limitdan oshsa OOMKill. Amaliyot: memory request = limit (Guaranteed QoS), CPU request qo'yib limitni ko'pincha qo'ymaslik (throttling'dan qochish). Qiymatlarni taxmin emas, real profil (VPA yoki metrika) asosida."},
{l:"S",t:"mcq",tp:"Kubernetes",q:"Rolling update paytida qisqa uzilishlar bo'lyapti. Qaysi to'plam buni yopadi?",
 o:["replicas sonini oshirish","readinessProbe (tayyor bo'lmaguncha trafik yo'q) + preStop hook va graceful shutdown (SIGTERM'da joriy so'rovlarni tugatish) + maxUnavailable: 0 + PodDisruptionBudget","Faqat maxSurge: 5","livenessProbe'ni o'chirish"],a:1,
 e:"Uzilishning ikki sababi: 1) yangi pod tayyor bo'lmasdan trafik oldi (readiness yo'q), 2) eski pod so'rov o'rtasida o'ldirildi (graceful shutdown yo'q). PDB node drain/cluster upgrade paytida bir vaqtda qancha pod yo'qolishini cheklaydi. terminationGracePeriodSeconds shutdown vaqtidan katta bo'lsin."},
{l:"S",t:"open",tp:"Kubernetes",q:"Deployment va StatefulSet farqi? Postgres'ni Kubernetes'da ishlatasizmi?",
 m:["Deployment — o'zaro almashinadigan (stateless) podlar, tasodifiy nom, umumiy yoki hech qanday volume","StatefulSet — barqaror nom (db-0, db-1), har podga o'z PersistentVolume'i, tartibli ishga tushish/o'chish","Stateful workload: storage tezligi, failover, backup, versiya yangilash — hammasi o'zingizda","Amaliy qaror: jamoada Kubernetes operator tajribasi bo'lmasa — managed DB (RDS/Cloud SQL)","Ishlatilsa — yetuk operator (CloudNativePG, Zalando), tekshirilgan backup va failover mashqlari"],
 e:"Senior javob: 'mumkin, lekin kerakmi?' Konteyner DB'ni sekinlashtirmaydi — murakkablik operatsiyada. Test/dev muhit uchun — bemalol."},
// ---------- CI/CD & deploy ----------
{l:"J",t:"mcq",tp:"CI/CD",q:"Continuous Integration nimani anglatadi?",
 o:["Kodni haftada bir marta merge qilish","Har commit/PR avtomatik build va testdan o'tadi, kod tez-tez (kuniga) asosiy branchga qo'shiladi — integratsiya muammolari kechikmaydi","Serverga avtomatik deploy","Faqat testlarni yozish"],a:1,
 e:"CI — branch uzoq yashamasligi haqida. CD ikki ma'noda: Continuous Delivery (har build deploy qilishga tayyor, tugma bosiladi) va Continuous Deployment (avtomatik production'ga). Uzoq feature branch — merge do'zaxi; yechim: kichik PR + feature flag."},
{l:"M",t:"mcq",tp:"Deploy",q:"Blue-green va canary deploy farqi?",
 o:["Bir xil","Blue-green: ikkita to'liq muhit, trafik bir zumda yangisiga o'tadi (rollback — tezda qaytarish). Canary: yangi versiyaga trafikning kichik qismi (1–5%) beriladi, metrikalar kuzatilib asta oshiriladi","Canary faqat test muhitida","Blue-green rollback imkonsiz"],a:1,
 e:"Blue-green: tez rollback, lekin xato hamma userga birdan tegadi; ikki barobar resurs. Canary: xato ta'siri kichik, lekin trafik bo'lish mexanizmi va avtomatik metrika tahlili kerak; ikki versiya birga ishlaydi — DB sxemasi ikkalasiga mos bo'lishi shart (expand-contract). Uchinchisi — rolling update (Kubernetes default)."},
{l:"M",t:"open",tp:"Secrets",q:"Parol, API kalit va sertifikatlarni qanday boshqarasiz?",
 m:["Git'da hech qachon — hatto private repoda ham (tarixda qoladi); .gitignore + pre-commit scanner (gitleaks)","Markazlashgan secret store: Vault, AWS Secrets Manager, GCP Secret Manager","Kubernetes Secret — default'da faqat base64, shifrlanmagan: etcd encryption yoki External Secrets operator","Ilovaga yetkazish: env yoki mount; CI logida chop etilmasligi","Rotatsiya: muddat, avtomatik yangilash, sizib chiqqanda revoke tartibi (runbook)","Har muhit (dev/stage/prod) uchun alohida kalit; eng kam huquq prinsipi"],
 e:"Amaliy signal: 'git'ga tushib qolsa nima qilasiz?' — javob: darhol revoke/rotate, keyin tarixni tozalash (tozalash yetarli emas, kalit allaqachon ochiq)."},
{l:"S",t:"mcq",tp:"Deploy",q:"Qaysi yondashuv to'g'ri: artefakt va muhitlar haqida?",
 o:["Har muhit uchun alohida build qilish (dev, stage, prod)","Bir marta build qilib, o'sha immutable artefaktni (image digest bilan) hamma muhitdan o'tkazish; farq faqat konfiguratsiyada (env, secret)","Production'da to'g'ridan-to'g'ri kompilyatsiya qilish","latest tegidan foydalanish"],a:1,
 e:"Build once, deploy many: stage'da test qilingan narsa aynan prod'ga boradi. latest — aniqlikni yo'qotadi (qaysi kod ishlayotgani noma'lum, rollback qiyin); digest yoki semantik versiya bilan teglang. Konfiguratsiya image ichida emas, tashqarida (12-factor)."},
{l:"S",t:"open",tp:"Deploy",q:"DB migratsiyasi deploy pipeline'ining qaysi qadamida bajarilishi kerak?",
 m:["Migratsiya deploy'dan oldin, orqaga mos (backward compatible) holda — eski kod ham ishlashi kerak","Ikki versiya deploy vaqtida birga ishlaydi (rolling, canary) — bu asosiy cheklov","Expand-contract: ustun qo'shish → ikkala kod ishlaydi → eski kod chiqib ketgach tozalash (alohida release)","Uzoq migratsiya (backfill, index) deploy'dan ajratilgan job sifatida, batch va throttling bilan","Har migratsiyaga rollback rejasi; ma'lumot o'chiradigan qadamni kechiktirish","lock_timeout va statement_timeout qo'yish"],
 e:"Senior signal: 'migratsiya va kod deploy'i bir atomik qadam emas' degan tushuncha. Ma'lumot o'chirish (DROP COLUMN) odatda bir necha kun/hafta keyin, kuzatuvdan so'ng."},
{l:"St",t:"mcq",tp:"CI/CD",q:"Katta feature'ni uzoq branchda emas, feature flag bilan qilishning asosiy afzalligi?",
 o:["Kod tozaroq bo'ladi","Kod kichik bo'laklarda main'ga tushadi (merge konflikt kam), release deploy'dan ajraladi: yoqish/o'chirish bir zumda, canary va A/B imkoniyati","Testlar kerak emas","Rollback kerak emas"],a:1,
 e:"Narxi: flaglar texnik qarz — muddati o'tganini o'chirish tartibi bo'lishi kerak, aks holda kodda o'nlab shart qoladi. Kill switch sifatida ham qimmatli: incidentda deploy'siz o'chirish. Flag holati kuzatiladigan va audit qilinadigan bo'lsin."},
// ---------- Observability ----------
{l:"J",t:"mcq",tp:"Logging",q:"Log, metrika va trace farqi?",
 o:["Uchalasi bir xil ma'lumot","Log — alohida hodisa yozuvi (nima bo'ldi, kontekst bilan); metrika — vaqt bo'yicha agregat son (RPS, latency, xatolar %); trace — bitta so'rovning servislar bo'ylab yo'li va har qadamning vaqti","Metrika faqat CPU uchun","Trace — bu log fayli"],a:1,
 e:"Ishlatish tartibi: metrika 'muammo bor va qayerda' (alert), trace 'qaysi qadam sekin', log 'aniq nima bo'ldi'. Metrika arzon va agregat; log qimmat (hajm); trace odatda sampling bilan. Uchalasini bog'lovchi element — trace_id."},
{l:"M",t:"mcq",tp:"Logging",q:"Mikroservislarda loglarni tekshirishni haqiqatan osonlashtiradigan narsa?",
 o:["Har servisda o'z fayl formatida yozish","Strukturaviy (JSON) log + har so'rovga trace_id/correlation_id berib, uni hamma servisga header orqali uzatish; markaziy log tizimi","Ko'proq log yozish","Faqat xatolarni loglash"],a:1,
 e:"Bitta so'rov 6 ta servisdan o'tadi — trace_id'siz ularni bog'lab bo'lmaydi. Har logda: trace_id, service, level, user/tenant id (PII'siz), xabar. Qo'shimcha: sampling va log darajasi (debugni prodda yoqmaslik), maxfiy ma'lumotni maskalash, saqlash muddati va narxi."},
{l:"M",t:"code",tp:"Tracing",q:"Trace servis chegarasida uzilib qolyapti (har servis alohida trace ko'rsatadi). Sabab?",c:"// A servis\nspan = tracer.start_span(\"call_b\")\nresp = http.get(\"http://b/api/items\")   # header yo'q\nspan.end()",
 o:["B servisda tracing yoqilmagan","Trace konteksti (traceparent header) uzatilmagan — HTTP client'ga propagation qo'shish kerak (instrumented client yoki inject(headers))","Span nomi noto'g'ri","Sampling 0 ga teng"],a:1,
 e:"Distributed tracing — kontekstni uzatishga asoslangan (W3C traceparent). OpenTelemetry auto-instrumentation buni ko'pincha o'zi qiladi, lekin qo'lda yozilgan client, message queue (headerni xabar atributiga qo'yish) va async ish (goroutine/thread) — tipik uzilish nuqtalari."},
{l:"S",t:"mcq",tp:"Metrics",q:"Servis uchun qaysi to'plam asosiy metrika sifatida eng foydali (RED metodikasi)?",
 o:["CPU, RAM, disk","Rate (so'rov/s), Errors (xato %), Duration (latency taqsimoti: p50/p95/p99)","Faqat o'rtacha javob vaqti","Log qatorlari soni"],a:1,
 e:"RED — servis uchun (userga ko'rinadigan), USE (Utilization, Saturation, Errors) — resurs uchun. O'rtacha latency yashiradi: 100 ta so'rovdan 99 tasi 10ms, bittasi 5s bo'lsa o'rtacha 60ms — 'yaxshi', lekin p99 5s. Shuning uchun persentil va histogram; SLO ham persentilga qo'yiladi."},
{l:"S",t:"open",tp:"Alerting",q:"Alertlar juda ko'p, jamoa ularga e'tibor bermay qo'ydi. Nima qilasiz?",
 m:["Symptom-based alert: user his qiladigan narsa (xato %, latency, SLO burn rate) — sabab-based (CPU 80%) emas","Har alert harakat talab qilishi shart: harakat yo'q bo'lsa — dashboard yoki ticket, page emas","SLO va error budget burn rate bo'yicha ko'p tezlikli alert (tez yonish — darhol, sekin — ish vaqtida)","Shovqinlarni o'lchash: har alert bo'yicha 'foydali/bekor' statistikasi, muntazam tozalash","Har page uchun runbook havolasi; takrorlanuvchi alertlarni avtomatlashtirish","O'chirish/ta'mirlash oynasi (maintenance window), flapping uchun 'for' davri"],
 e:"Senior/Staff signal: alert charchashi — texnik emas, jarayon muammosi. O'lchov: haftada nechta page, nechtasi harakatga olib keldi."},
{l:"St",t:"open",tp:"Metrics",q:"Metrika tizimi hisobi keskin oshdi (kardinallik portlashi). Sabab va yechim?",
 m:["Har label kombinatsiyasi — alohida vaqt qatori; user_id, email, URL yo'li, trace_id kabi labellar millionlab qator yaratadi","Yechim: yuqori kardinallikdagi labellarni olib tashlash yoki bucketlash (/users/123 → /users/:id)","Bunday tafsilot metrikada emas, log/trace'da (exemplar bilan bog'lash)","Saqlash muddati va agregatsiya (downsampling) siyosati","Kardinallik limiti va monitoring: eng ko'p qator yaratayotgan metrikani kuzatish"],
 e:"Staff signal: observability xarajatini mahsulot xarajati sifatida boshqarish — qaysi signal qancha turadi va qancha qiymat beradi."},
// ---------- Tarmoq & bulut ----------
{l:"J",t:"mcq",tp:"Network",q:"L4 va L7 load balancer farqi?",
 o:["L4 tezroq, chunki ko'proq ish qiladi","L4 — TCP/UDP darajasida (IP va port bo'yicha), kontentni ko'rmaydi, juda tez; L7 — HTTP darajasida: URL yo'li, header, cookie bo'yicha marshrutlash, TLS termination, retry","L7 faqat ichki tarmoqda ishlaydi","Farqi faqat narxda"],a:1,

{l:"M",t:"mcq",tp:"Network",q:"Failover'ni faqat DNS o'zgartirish bilan qilishning muammosi?",

{l:"M",t:"code",tp:"Sync",q:"Bu kod qanday natija beradi?",c:"counter := 0\nvar wg sync.WaitGroup\nfor i := 0; i < 1000; i++ {\n    wg.Add(1)\n    go func() { defer wg.Done(); counter++ }()\n}\nwg.Wait()\nfmt.Println(counter)",
 o:["Doim 1000","1000 dan kichik va har safar boshqacha — counter++ atomik emas (o'qish-qo'shish-yozish); bu data race, go test -race aniqlaydi. Tuzatish: sync.Mutex yoki atomic.Int64","panic","Kompilyatsiya xatosi"],a:1,
 e:"Data race — aniqlanmagan xulq: natija noto'g'ri bo'lishi ham, kompilyator optimizatsiyasi tufayli yanada g'alati ko'rinishi ham mumkin. Yechimlar: var mu sync.Mutex bilan o'rash, yoki var counter atomic.Int64 va counter.Add(1) (Go 1.19+ tipli atomiklar). Har goroutine natijani kanalga yuborib, bitta joyda yig'ish ham to'g'ri yondashuv."},
{l:"M",t:"mcq",tp:"Sync",q:"Mutex va kanal — qachon qaysi biri?",
 o:["Doim kanal, mutex eskirgan","Mutex — umumiy holatni (struct maydoni, kesh, hisoblagich) himoya qilish uchun sodda va tez. Kanal — egalikni uzatish, ish taqsimlash va bosqichlarni bog'lash (pipeline) uchun","Doim mutex","Ikkalasi ham bir xil ishlaydi"],a:1,
 e:"'Share memory by communicating' — shior, qat'iy qoida emas; Go jamoasining o'z maslahati: oddiy holat himoyasi uchun mutex ishlating. sync.RWMutex — o'qish juda ko'p, yozish kam bo'lganda (lekin qisqa kritik bo'limda oddiy Mutex tezroq bo'lishi mumkin). Qoida: lock ushlab turganda tashqi chaqiruv (HTTP, DB) qilmang.",src:"https://go.dev/doc/effective_go#concurrency"},
{l:"S",t:"code",tp:"Context",q:"Worker'ni to'g'ri to'xtatish uchun qaysi variant to'g'ri?",c:"// A\nfor job := range jobs {\n    process(job)\n}\n\n// B\nfor {\n    select {\n    case job, ok := <-jobs:\n        if !ok { return }\n        process(ctx, job)\n    case <-ctx.Done():\n        return\n    }\n}",
 o:["A — soddaroq va yetarli","B — kanal yopilishini ham, context bekor qilinishini ham hisobga oladi: shutdown signalida worker joriy siklni tugatib chiqadi","Ikkalasi bir xil","A tezroq, shuning uchun to'g'ri"],a:1,
 e:"A varianti faqat kanal yopilganda tugaydi — graceful shutdown'da jo'natuvchi bloklangan bo'lsa, worker abadiy kutishi mumkin. Muhim tafsilot: process(ctx, job) — context ichkariga ham uzatiladi, aks holda uzoq DB so'rovi baribir kutadi. Shutdown deadline: context.WithTimeout bilan cheklab, tugamaganini majburan tark etish."},
{l:"S",t:"mcq",tp:"Concurrency",q:"Uzoq ishlaydigan siklda <code>case &lt;-time.After(1*time.Second):</code> ishlatishning muammosi?",
 o:["Muammo yo'q","Har iteratsiyada yangi Timer yaratiladi va u ishlab bo'lguncha (yoki GC yig'guncha) resurs ushlaydi — yuqori chastotali siklda sezilarli yuk; o'rniga time.NewTimer/NewTicker yaratib, Reset va Stop bilan boshqarish kerak","time.After noto'g'ri vaqt beradi","Faqat testda muammo"],a:1,
 e:"Eslatma: Go 1.23 dan boshlab timer'lar ishlatilmasa ham GC uchun erishiladigan bo'lib qolmaydi — bu eski 'time.After leak' muammosini ancha yumshatdi, lekin yuqori chastotali kodda Timer'ni qayta ishlatish baribir afzal. Ticker'ni to'xtatmaslik esa har doim leak: defer ticker.Stop()."},
{l:"S",t:"mcq",tp:"Concurrency",q:"<code>errgroup.Group</code> qanday ishlaydi?",
 o:["Hamma xatolarni ro'yxat qilib qaytaradi","g.Go(fn) bilan goroutine'lar ishga tushadi; g.Wait() hammasini kutib, birinchi qaytgan xatoni qaytaradi. WithContext bilan yaratilgan bo'lsa, birinchi xatoda context bekor qilinadi va qolgan ishlar to'xtaydi; SetLimit(n) bilan parallellik cheklanadi","Xatolarni yutib yuboradi","WaitGroup bilan bir xil, farqi yo'q"],a:1,
 e:"Tipik ishlatish: bir nechta tashqi servisga parallel so'rov — biri yiqilsa qolganlarini bekor qilish. Diqqat: g.Wait() faqat BIRINCHI xatoni qaytaradi, hammasini yig'ish kerak bo'lsa o'zingiz to'plang (yoki Go 1.20+ errors.Join). Har goroutine ichida ctx.Err() ni tekshirish kerak, aks holda bekor qilish ta'sir qilmaydi.",src:"https://pkg.go.dev/golang.org/x/sync/errgroup"},
{l:"S",t:"code",tp:"Concurrency",q:"Fan-in: bu kodda nima bo'ladi?",c:"results := make(chan int)      // buffersiz\nvar wg sync.WaitGroup\nfor _, j := range jobs {\n    wg.Add(1)\n    go func(j Job) { defer wg.Done(); results <- run(j) }(j)\n}\nwg.Wait()\nclose(results)\nfor r := range results { fmt.Println(r) }",
 o:["To'g'ri ishlaydi","Deadlock: buffersiz kanalga hech kim o'qimayapti — goroutine'lar jo'natishda bloklanadi, wg.Wait() esa hech qachon qaytmaydi. Tuzatish: yig'ishni alohida goroutine'ga olish (go func(){ wg.Wait(); close(results) }()) va keyin range qilish","panic: close of closed channel","Natijalar tartibsiz chiqadi, xolos"],a:1,
 e:"Qoida: kanalni to'ldiruvchi va bo'shatuvchi bir vaqtda ishlashi kerak. To'g'ri shablon: goroutine'lar yozadi → alohida goroutine wg.Wait() dan keyin close qiladi → asosiy goroutine range bilan o'qiydi. Muqobil: results ni len(jobs) hajmda buferli qilish (lekin bu xotira va backpressure masalasi)."},
{l:"S",t:"mcq",tp:"Sync",q:"<code>sync/atomic</code> va <code>sync.Mutex</code> — qachon qaysi biri?",
 o:["Atomic doim yaxshi","Atomic — bitta o'zgaruvchi ustida oddiy amal (hisoblagich, flag, pointer almashtirish) uchun: lock'siz va tez. Mutex — bir nechta maydonni birga izchil o'zgartirish yoki murakkab kritik bo'lim uchun","Mutex doim tezroq","Atomic faqat 32-bit tizimlarda"],a:1,
 e:"Go 1.19 dan tipli atomiklar bor: atomic.Int64, atomic.Bool, atomic.Pointer[T] — eski atomic.AddInt64(&x, 1) shakliga nisbatan xavfsizroq (eski shaklda 32-bit platformalarda hizalanish talabi bor edi). Atomiklardan 'mini-lock' yasashga urinmang: bir nechta atomik amal birgalikda atomik emas."},
{l:"S",t:"mcq",tp:"Concurrency",q:"Go xotira modeli (memory model) bo'yicha qaysi to'g'ri?",
 o:["Bitta goroutine yozgan qiymatni boshqasi darhol ko'radi","Sinxronizatsiyasiz (kanal, mutex, atomic, WaitGroup) yozuvni boshqa goroutine hech qachon ko'rmasligi ham mumkin — kompilyator va protsessor qayta tartiblashi va keshda ushlab turishi mumkin","for sikli bilan kutish (busy wait) yetarli","volatile kalit so'zi kerak"],a:1,
 e:"Shuning uchun 'flag bool' ni sinxronizatsiyasiz tekshirib kutish — buzuq kod (cheksiz sikl bo'lishi mumkin). To'g'ri yo'llar: kanal, mutex, atomic.Bool, context. 'Bizda ishladi' — kafolat emas: xulq arxitektura va kompilyator versiyasiga qarab o'zgaradi.",src:"https://go.dev/ref/mem"},
{l:"St",t:"mcq",tp:"Concurrency",q:"HTTP handler'da foydalanuvchi so'rovi bekor qilinganda (client uzildi) fon ishini davom ettirish kerak bo'lsa nima qilasiz?",
 o:["r.Context() ni to'g'ridan-to'g'ri goroutine'ga uzatish","So'rov context'i client uzilganda bekor bo'ladi — fon ishi darhol to'xtaydi. Kerak bo'lsa: context.WithoutCancel(ctx) (Go 1.21+) yoki yangi context yaratib, faqat qiymatlarni (trace_id) ko'chirish va o'z timeout'ini qo'yish","context.Background() ni ishlatib, timeout qo'ymaslik","Goroutine'ni context'siz ishga tushirish"],a:1,
 e:"Ikki xato ham xavfli: birinchisi ishni yarimda to'xtatadi, ikkinchisi (timeout'siz) goroutine leak beradi. Yaxshiroq arxitektura: uzoq ishni HTTP so'rovidan butunlay ajratib, navbatga (outbox/Kafka/SQS) qo'yish — shunda qayta urinish va kuzatuv ham bo'ladi."}
];

{l:"J",t:"mcq",tp:"Arrays",q:"Two Sum (massivda yig'indisi target bo'lgan ikki indeks). Eng yaxshi vaqt murakkabligi va usul?",
 o:["O(n²) — ikki sikl, boshqa yo'l yo'q","O(n) — hash map'da 'target - x' ni qidirish (bitta o'tishda), xotira O(n)","O(log n) — binary search","O(n log n) — saralash shart"],a:1,

{l:"M",t:"mcq",tp:"Linked list",q:"Bog'langan ro'yxatda sikl (cycle) bor-yo'qligini O(1) qo'shimcha xotira bilan qanday aniqlaysiz?",
 o:["Hamma tugunlarni set'ga yig'ib (O(n) xotira)","Floyd's cycle detection: sekin (1 qadam) va tez (2 qadam) ko'rsatkichlar — uchrashsa sikl bor; vaqt O(n), xotira O(1)","Ro'yxatni saralab","Rekursiya bilan"],a:1,

{l:"M",t:"mcq",tp:"Sliding window",q:"Takrorlanmaydigan belgilardan iborat eng uzun substring uzunligi. Samarali yechim?",
 o:["Hamma substringlarni tekshirish — O(n³)","Sliding window: o'ng chegarani surib, takror uchrasa chap chegarani oxirgi uchrash joyidan keyingi pozitsiyaga ko'chirish; har belgi ko'pi bilan ikki marta ko'riladi — O(n)","Saralash — O(n log n)","Binary search — O(log n)"],a:1,

{l:"M",t:"mcq",tp:"Graphs",q:"Og'irliksiz grafda eng qisqa yo'lni topish uchun qaysi algoritm?",

 e:"DFS yo'l topadi, lekin eng qisqasini kafolatlamaydi. Og'irliklar bo'lsa: manfiy bo'lmasa — Dijkstra (O((V+E) log V)), manfiy og'irlik bo'lsa — Bellman-Ford (O(V·E), manfiy sikl ham aniqlaydi). Matritsadagi masalalar (orollar, eng qisqa yo'l) — grafning yashirin ko'rinishi.",src:"https://neetcode.io/practice/practice/neetcode150"},
{l:"M",t:"code",tp:"Binary search",q:"Bu binary search'da qanday nozik xatolar bor?",c:"lo, hi = 0, len(a)\nwhile lo < hi:\n    mid = (lo + hi) / 2      # 1\n    if a[mid] == target: return mid\n    elif a[mid] < target: lo = mid    # 2\n    else: hi = mid\nreturn -1",
 o:["Xato yo'q","(1) butun bo'lmagan bo'lish — mid = (lo + hi) // 2 bo'lishi kerak (ba'zi tillarda lo + (hi-lo)//2, overflow uchun); (2) lo = mid cheksiz siklga olib keladi — lo = mid + 1 bo'lishi kerak","Faqat return -1 noto'g'ri","while sharti > bo'lishi kerak"],a:1,
 e:"lo = mid bo'lsa, lo va hi qo'shni bo'lganda mid doim lo ga teng bo'lib, sikl to'xtamaydi. Chegara masalalari (birinchi/oxirgi uchrash, lower_bound) uchun bitta shablonni yodlab olish va unga sodiq qolish eng ishonchli yo'l. Java/Go'da (lo+hi)/2 katta massivda overflow berishi mumkin — mashhur JDK bug'i.",src:"https://neetcode.io/practice/practice/blind75"},
{l:"M",t:"mcq",tp:"DP",q:"Zinapoyaga chiqish (har qadamda 1 yoki 2 pog'ona) — n pog'ona uchun necha xil yo'l bor va qanday hisoblanadi?",

 e:"DP belgilari: optimal substructure va qayta-qayta takrorlanadigan qism masalalar. Naiv rekursiya O(2^n) — memoizatsiya uni O(n) ga tushiradi. Ko'p DP masalasi shu bosqichlar bilan yechiladi: rekursiya → memoizatsiya (top-down) → jadval (bottom-up) → xotirani siqish.",src:"https://neetcode.io/practice/practice/blind75"},
