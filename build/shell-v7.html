QI.forEach((q,i)=>{q.d="inf";q.id=2000+i;q.n="I"+(i+1);});
const QF=[
// ================= TARMOQ, REST/gRPC, OOP/SOLID =================
{l:"J",t:"mcq",tp:"TCP/IP",q:"TCP va UDP farqi?",
 o:["UDP ishonchliroq","TCP — ulanishga asoslangan: tartib, qayta yuborish, oqim va tirbandlik nazorati; UDP — datagram: kafolat yo'q, lekin yengil va kechikish kam","TCP tez, UDP sekin","Ikkalasi bir xil, faqat port raqami boshqa"],a:1,
 e:"UDP mos keladigan joylar: video/ovozli qo'ng'iroq (eski paket keraksiz), DNS, o'yin, QUIC (HTTP/3 ham UDP ustida — ishonchlilikni o'zi amalga oshiradi). TCP'da 'ishonchlilik' latency narxiga keladi: paket yo'qolsa qayta yuborish kutiladi va butun oqim to'xtaydi (head-of-line blocking)."},
{l:"J",t:"mcq",tp:"TCP/IP",q:"TCP ulanish qanday o'rnatiladi?",
 o:["Bitta paket yuborish bilan","Uch qadamli qo'l berish: SYN → SYN-ACK → ACK; yopilish esa FIN/ACK almashinuvi bilan (va TIME_WAIT holati bilan)","Faqat server boshlaydi","DNS orqali"],a:1,
 e:"Har yangi ulanish kamida bitta round-trip (RTT) — TLS bo'lsa yana qo'shiladi. Shuning uchun keep-alive va ulanish pool'i muhim: har so'rovga yangi ulanish ochish uzoq masofada juda qimmat. Serverda TIME_WAIT ko'payishi va ephemeral port tugashi — yuqori yukdagi klassik muammo."},
{l:"M",t:"mcq",tp:"HTTP",q:"HTTP/1.1, HTTP/2 va HTTP/3 farqi?",
 o:["Faqat tezlik raqami","HTTP/1.1 — bitta ulanishda navbat bilan (head-of-line blocking, brauzer 6 ta ulanish ochadi). HTTP/2 — bitta TCP ulanishda multiplekslash va header siqish, lekin TCP darajasidagi HOL saqlanadi. HTTP/3 — QUIC (UDP) ustida: oqimlar mustaqil, ulanish tezroq o'rnatiladi va IP o'zgarganda ham saqlanadi","HTTP/2 shifrlanmagan","HTTP/3 TCP ustida ishlaydi"],a:1,
 e:"Amaliy natija: HTTP/2'da ko'p kichik so'rov arzonlashadi (domain sharding va fayllarni birlashtirish kerakmas bo'lib qoldi). gRPC aynan HTTP/2 ustida qurilgan. HTTP/3 mobil tarmoqlarda (paket yo'qolishi ko'p) sezilarli yutuq beradi."},
{l:"M",t:"mcq",tp:"TLS",q:"TLS qo'l berishda (handshake) nima sodir bo'ladi?",
 o:["Parol almashinadi","Server sertifikatini beradi (client uni ishonchli CA zanjiri, muddati va domen nomi bo'yicha tekshiradi), tomonlar kalit almashinuvi (ECDHE) orqali seans kalitini hosil qiladi va keyin simmetrik shifrlashga o'tadi","Butun trafik ochiq matn qoladi","Faqat parol shifrlanadi"],a:1,
 e:"TLS 1.3 qo'l berishni 1-RTT ga qisqartirdi (0-RTT ham bor, lekin replay xavfi tufayli ehtiyotkorlik talab qiladi). Asimmetrik kriptografiya faqat kalit kelishuvi uchun — qolgani simmetrik (tez). Forward secrecy: ECDHE tufayli server kaliti keyin sizib chiqsa ham eski trafik ochilmaydi. mTLS'da client ham sertifikat beradi."},
{l:"M",t:"mcq",tp:"HTTP",q:"Load balancer ortidagi servis vaqti-vaqti bilan 502/504 beryapti, loglarda panic yo'q. Tipik sabab?",
 o:["Kod xatosi","Timeout va keep-alive mos emas: LB idle timeout serverning keep-alive timeout'idan uzun bo'lsa, server ulanishni yopgan paytda LB o'sha ulanishdan foydalanib 502 oladi. Server timeout'ini LB'nikidan biroz UZUN qilish kerak","Sertifikat eskirgan","DNS ishlamayapti"],a:1,
 e:"AWS ALB uchun klassik maslahat: server (Go'da http.Server.IdleTimeout) qiymati ALB idle timeout'idan katta bo'lsin. 504 — LB backend'dan javob kutib timeout bo'lgani. Bu turdagi nosozliklar 'tasodifiy' ko'rinadi, shuning uchun timeout zanjirini yozib chiqish kerak: client → LB → servis → DB."},
{l:"M",t:"mcq",tp:"gRPC",q:"gRPC nima ustiga qurilgan?",
 o:["HTTP/1.1 va JSON","HTTP/2 va Protocol Buffers: ikkilik (binary) format, kodni .proto dan generatsiya qilish, to'rt chaqiruv turi — unary, server-stream, client-stream, bidirectional","WebSocket va XML","TCP ustida o'z protokoli"],a:1,
 e:"Afzalliklar: kichik va tez serializatsiya, qat'iy kontrakt, kod generatsiyasi, streaming, deadline va cancel protokol ichida. Kamchiliklar: brauzerdan to'g'ridan-to'g'ri ishlamaydi (gRPC-Web yoki gateway kerak), inson o'qiy olmaydi (debug uchun grpcurl), oraliq proxy'lar HTTP/2 va trailers'ni qo'llashi shart.",src:"https://grpc.io/docs/what-is-grpc/core-concepts/"},
{l:"M",t:"mcq",tp:"API dizayn",q:"REST, gRPC va GraphQL — qachon qaysi biri?",
 o:["gRPC har doim yaxshi","REST — public API, brauzer, keshlash va soddalik kerak bo'lsa. gRPC — ichki servislararo aloqa: past latency, qat'iy kontrakt, streaming. GraphQL — client turli shakldagi ma'lumotni o'zi tanlashi kerak bo'lsa (mobil/frontend, ko'p manbani birlashtirish)","GraphQL faqat ma'lumotlar bazasi uchun","REST eskirgan"],a:1,
 e:"Ko'p kompaniyada aralash: tashqariga REST/GraphQL, ichkarida gRPC. GraphQL narxi: N+1 resolver muammosi (DataLoader), keshlash qiyin, so'rov murakkabligini cheklash kerak. Tanlovni 'moda' emas, iste'molchi va talab belgilaydi."},
{l:"S",t:"mcq",tp:"gRPC",q:"Protobuf'da orqaga moslikni (backward compatibility) saqlash qoidasi?",
 o:["Maydon nomini o'zgartirmaslik yetarli","Maydon RAQAMI (tag) kontraktning o'zi: raqamni qayta ishlatmaslik kerak, o'chirilgan maydonlar uchun reserved yozish; yangi maydon qo'shish xavfsiz, majburiy semantika qo'shish esa buzadi. Nomi esa (binar formatda) muhim emas","Har o'zgarishda yangi versiya kerak","Maydon tipini bemalol o'zgartirish mumkin"],a:1,
 e:"Bir raqamni boshqa maydonga berish — eski clientlar ma'lumotni noto'g'ri o'qiydi (jim buziladi, xato bermaydi). Shuning uchun: reserved 5, 7; reserved \"old_name\";. Enum'da ham 0 qiymati default bo'lishi shart. Kontrakt tekshiruvi CI'da avtomatlashtiriladi (buf breaking).",src:"https://protobuf.dev/programming-guides/proto3/"},
{l:"S",t:"mcq",tp:"gRPC",q:"gRPC'da timeout qanday ishlaydi?",
 o:["Har servis o'z timeout'ini mustaqil qo'yadi","Deadline chaqiruv bilan birga uzatiladi: A servis 2s deadline qo'ysa, B va undan keyingi chaqiruvlar qolgan vaqtni biladi va muddat tugaganda hamma zanjir DEADLINE_EXCEEDED bilan to'xtaydi","Timeout yo'q","Faqat client tomonda ishlaydi"],a:1,
 e:"Bu oddiy HTTP'dan katta afzallik: deadline tarqaladi va 'yetim' ish qolmaydi. Go'da context bilan tabiiy bog'lanadi: ctx, cancel := context.WithTimeout(...) va shu ctx chaqiruvga uzatiladi. Qoida: har chaqiruvda deadline bo'lsin va ichkariga kirgan sari kamaysin."},
{l:"S",t:"mcq",tp:"gRPC",q:"gRPC servis Kubernetes'da bitta podga yuk to'plab qolyapti, boshqalari bo'sh. Sabab?",
 o:["gRPC yomon masshtablanadi","gRPC HTTP/2 da uzoq yashaydigan bitta ulanishdan foydalanadi — L4 (TCP) balanslovchi ulanishni bir marta taqsimlaydi va keyingi hamma chaqiruv shu podga tushadi. Yechim: client-side load balancing (DNS/headless service bilan), L7 proxy (Envoy/mesh) yoki ulanishni davriy uzish (MAX_CONNECTION_AGE)","Pod resurslari kam","DNS kesh"],a:1,
 e:"Kubernetes Service — L4, shuning uchun gRPC va boshqa uzoq ulanishlar (WebSocket) uchun yetarli emas. Amaliy variantlar: grpc-go'da round_robin balanser + headless service, yoki service mesh sidecar'i. Serverda keepalive va MAX_CONNECTION_AGE_GRACE qo'yish yangi podlarga yuk kelishini ta'minlaydi."},
{l:"S",t:"open",tp:"HTTP",q:"'API sekin' degan shikoyat keldi. Tarmoq darajasida qanday diagnostika qilasiz?",
 m:["Bosqichlarni ajratish: DNS → TCP connect → TLS → so'rov yuborish → TTFB (birinchi bayt) → yuklab olish; curl -w '%{time_namelookup} %{time_connect} %{time_appconnect} %{time_starttransfer} %{time_total}'","TTFB katta bo'lsa — server tomonidagi ishlov (DB, tashqi chaqiruv); download uzoq bo'lsa — javob hajmi yoki kanal","Client va server metrikasini solishtirish: server p99 yaxshi, client yomon bo'lsa — tarmoq, LB, DNS yoki queueing","Ulanish qayta ishlatilyaptimi (keep-alive), pool hajmi, TLS handshake har so'rovda takrorlanmayaptimi","Geografiya: RTT va CDN; katta javoblar uchun siqish (gzip/br) va pagination","Chuqurroq: tcpdump/ss bilan retransmit va navbatlarni ko'rish, tracing bilan servis ichidagi qadamlar"],
 e:"Kuchli javob — 'qayerda vaqt ketyapti' savolini bosqichlarga bo'lib o'lchash. Ko'p hollarda sabab: keep-alive yo'qligi, N+1 chaqiruvlar yoki katta javob hajmi."},
// ---------- Software design & architecture (roadmap.sh) ----------
{l:"M",t:"mcq",tp:"Clean code",q:"Coupling (bog'lanish) va cohesion (yaxlitlik) haqida to'g'ri gap?",
 o:["Ikkalasi ham yuqori bo'lishi kerak","Maqsad: past coupling (modullar bir-biriga kam bog'liq) va yuqori cohesion (bitta modul ichidagi kod bitta maqsadga xizmat qiladi)","Ikkalasi ham past bo'lishi kerak","Bular bir xil narsa"],a:1,
 e:"Amaliy o'lchov: bitta biznes o'zgarishi uchun nechta modulga tegish kerak (kam bo'lsa yaxshi), va modul ichidagi narsalar birga o'zgaradimi. Yuqori coupling alomatlari: umumiy 'utils' paketi hamma narsani biladi, modullar bir-birining ichki tuzilmasiga tayanadi, aylanma bog'liqliklar. Go'da import grafigi buni ko'rsatib beradi."},
{l:"M",t:"mcq",tp:"Clean code",q:"KISS, DRY va YAGNI tamoyillari orasidagi ziddiyat qanday hal qilinadi?",
 o:["DRY har doim ustun","DRY'ni ko'r-ko'rona qo'llash noto'g'ri mavhumlik yaratadi: tasodifan o'xshash ikki kod bir xil sabab bilan o'zgarmasa, ularni birlashtirmaslik kerak. Qoida: takrorlanish bilimda (biznes qoidasida) bo'lsa yomon, shaklda bo'lsa bardoshli","YAGNI faqat startaplarda","KISS kod qisqa bo'lishini anglatadi"],a:1,
 e:"Mashhur formulalar: 'duplication is far cheaper than the wrong abstraction' (Sandi Metz) va rule of three — uchinchi takrorda umumlashtirish. YAGNI: kelajakda kerak bo'lishi mumkin degan funksiyani bugun yozmaslik. KISS — soddalik: o'qiydigan odam uchun tushunarli yechim, eng aqlli yechim emas."},
{l:"M",t:"mcq",tp:"Arxitektura",q:"Layered (qatlamli) va hexagonal (ports & adapters) arxitektura farqi?",
 o:["Bir xil narsa","Qatlamlida bog'liqlik yuqoridan pastga ketadi va domain ko'pincha DB qatlamiga tayanadi. Hexagonal'da domain markazda: u interfeys (port) e'lon qiladi, DB va HTTP esa tashqi adapterlar — bog'liqlik faqat ichkariga qaraydi","Hexagonal faqat oltita modul degani","Qatlamli arxitektura testlanmaydi"],a:1,
 e:"Clean/onion arxitektura ham shu g'oyaning variantlari: dependency inversion orqali domainni infratuzilmadan ajratish. Amaliy foyda: DB yoki transportni almashtirganda biznes qoidalar tegilmaydi va domain testlari infratuzilmasiz ishlaydi. Xavf: kichik CRUD servis uchun ortiqcha qatlam va mapping."},
{l:"S",t:"mcq",tp:"Arxitektura",q:"CQRS nima va qachon oqlanadi?",
 o:["Ma'lumotni shifrlash usuli","O'qish va yozish modellarini ajratish: yozish tomoni invariantlarni himoya qiladi, o'qish tomoni so'rovga moslangan (denormallashgan) model bilan ishlaydi. Oqlanadi: o'qish va yozish yuklari/modellari keskin farq qilganda","Har loyihada majburiy","Faqat event sourcing bilan ishlaydi"],a:1,
 e:"CQRS event sourcing'ni talab qilmaydi — eng sodda ko'rinishi: bir xil DB, lekin alohida read model (view yoki materialized view). To'liq ajratilgan read store bo'lsa — eventual consistency va sinxronizatsiya narxi paydo bo'ladi. Ko'p tizim uchun oddiy repository yetarli; CQRS'ni aniq muammo asoslashi kerak.",src:"https://martinfowler.com/bliki/CQRS.html"},
{l:"S",t:"mcq",tp:"Arxitektura",q:"Repository va Active Record patternlari farqi?",
 o:["Bir xil","Active Record: obyekt o'z saqlanishini biladi (user.Save()) — sodda va tez, lekin domain va DB aralashadi. Repository: domain obyekti sof qoladi, saqlash alohida interfeys ortida — testlash va DDD uchun qulay, lekin ko'proq kod","Repository faqat NoSQL uchun","Active Record ORM emas"],a:1,
 e:"Tanlov kontekstga bog'liq: CRUD ko'p bo'lgan ilovada Active Record (Rails, Django) tez natija beradi; murakkab domen qoidalari bo'lsa Repository + Unit of Work afzal. Go'da odatda Repository interfeysi va sqlc/pgx implementatsiyasi ishlatiladi."},
{l:"S",t:"open",tp:"ADR",q:"Arxitektura qarorini qanday hujjatlashtirasiz?",
 m:["ADR (Architecture Decision Record): kontekst, ko'rib chiqilgan variantlar, qaror, oqibatlar va status","Har ADR qisqa (1 sahifa) va kod bilan birga repo'da saqlanadi (docs/adr/0007-....md)","Muhimi — nima uchun rad etilganini yozish: keyin jamoa savolni qayta ochmaydi","Qaror o'zgarsa eski ADR o'chirilmaydi — 'superseded by 0012' deb belgilanadi","Qarashlarni oldindan kelishish uchun RFC/dizayn hujjati va jamoa review'i","Katta qarorlar uchun: xavflar, qaytarib olish narxi va o'lchanadigan mezonlar"],
 e:"Senior/Staff signal: qarorning o'zi emas, jarayon va oqibatlar. Intervyuda 'siz qabul qilgan katta qarorni va uning oqibatlarini ayting' savoliga ADR strukturasi bilan javob berish juda yaxshi ishlaydi.",src:"https://adr.github.io/"},
{l:"S",t:"mcq",tp:"Arxitektura",q:"Quality attribute'lar (performance, scalability, availability, maintainability, security) o'rtasida ziddiyat bo'lsa nima qilasiz?",
 o:["Hammasini maksimal darajada ta'minlash","Ular bir-biriga zid bo'lishi mumkin (masalan kuchli konsistentlik ↔ mavjudlik va latency): biznes talabiga qarab ustuvorlikni aniq belgilash, o'lchanadigan mezon qo'yish va trade-off'ni ADR'da yozish","Texnik jamoa o'zi hal qiladi, biznes bilmaydi","Doim performance ustun"],a:1,
 e:"Amaliy yondashuv: har atribut uchun raqam ('p99 < 300 ms', '99.9% availability', 'yangi feature 2 haftada') va shu raqamlarga arxitekturani moslash. 'Hammasi muhim' degan javob — yetuk bo'lmagan javob; intervyuchi aynan tanlov qila olishingizni ko'radi."},
{l:"S",t:"open",tp:"Refactoring",q:"Legacy kodga yangi feature qo'shish kerak, testlar yo'q. Qanday yondashasiz?",
 m:["Avval xulqni muzlatish: mavjud xulq uchun characterization test (hozirgi natijani qayd qiluvchi test) yozish","Seam topish: o'zgartirmoqchi bo'lgan joyni ajratib olish (interfeys kiritish, bog'liqlikni parametrga chiqarish)","Kichik, xavfsiz refactoring qadamlari — har qadamdan keyin testlar yashil","Yangi kodni yangi, toza modulda yozib, eskisiga minimal tegish (strangler)","Katta qayta yozishni taklif qilishdan oldin: risk, muddat va biznes qiymatini solishtirish","Monitoring va feature flag bilan bosqichli chiqarish"],
 e:"Senior signal: 'hammasini qayta yozamiz' emas, xavfni boshqarish. Michael Feathers'ning 'legacy code = testsiz kod' ta'rifini aytish ham yaxshi taassurot qoldiradi."},
{l:"M",t:"mcq",tp:"Clean code",q:"Technical debt (texnik qarz) haqida qaysi yondashuv to'g'ri?",
 o:["Texnik qarz — har doim yomon kod","Qarz ongli ham bo'lishi mumkin (muddatga yetish uchun soddalashtirilgan yechim) — muhimi uni ko'rinadigan qilish: backlog'da vazifa, sababi va to'lash rejasi bilan; foizi esa sekinlashuv va incidentlarda ko'rinadi","Qarzni faqat refactoring sprintida to'lash mumkin","Qarz haqida biznesga aytmaslik kerak"],a:1,
 e:"Amaliy usul: har sprintda ma'lum ulush (masalan 10–20%) qarzga ajratish va qarzni biznes tilida tushuntirish ('bu joy tufayli har feature 2 kun ko'p vaqt oladi'). Ko'rinmas qarz — eng qimmati: hech kim uni rejalashtirmaydi, lekin hamma unga to'laydi."},
{l:"M",t:"mcq",tp:"Arxitektura",q:"12-factor app tamoyillaridan qaysi biri to'g'ri?",
 o:["Konfiguratsiya kodga yoziladi","Konfiguratsiya muhitdan (env) olinadi, jarayonlar stateless va bo'lishadigan holatni backing service'da saqlaydi, loglar stdout'ga oqim sifatida yoziladi, dev va prod muhitlar iloji boricha yaqin","Har muhit uchun alohida build","Loglar fayllarga yozilib, o'zi boshqariladi"],a:1,
 e:"Bu tamoyillar konteyner va Kubernetes bilan tabiiy mos keladi: stateless jarayon — istalgancha nusxalash mumkin; env konfiguratsiya — bitta image hamma muhitda; stdout log — platforma yig'adi. Qo'shimcha muhim band: graceful shutdown (disposability) va admin vazifalarni bir martalik jarayon sifatida bajarish.",src:"https://12factor.net/"},
// ---------- OOP & SOLID ----------
{l:"J",t:"mcq",tp:"OOP",q:"OOP'ning to'rt asosiy tushunchasi nima?",
 o:["Sinf, funksiya, o'zgaruvchi, sikl","Inkapsulyatsiya (holatni yashirish va nazorat qilingan interfeys), abstraksiya (muhimini ko'rsatib, tafsilotni yashirish), meros (umumiy xulqni kengaytirish), polimorfizm (bir interfeys — turli implementatsiya)","Massiv, ro'yxat, jadval, daraxt","Kompilyatsiya, bajarilish, test, deploy"],a:1,
 e:"Go'da klassik meros yo'q — o'rniga embedding (kompozitsiya) va implicit interfeyslar bor; polimorfizm interfeys orqali ishlaydi. Shuning uchun intervyuda ta'rifni ayting va 'Go'da bu qanday ifodalanadi' deb davom eting — bu tilni tushunganingizni ko'rsatadi."},
{l:"J",t:"mcq",tp:"OOP",q:"'Composition over inheritance' nimani anglatadi?",
 o:["Meros umuman ishlatilmaydi","Xulqni chuqur meros iyerarxiyasi orqali emas, obyektlarni birlashtirib (has-a) qurish afzal: bog'liqlik zaifroq, o'zgartirish oson, 'mo'rt asosiy sinf' muammosi yo'q","Kompozitsiya tezroq ishlaydi","Faqat Go'da to'g'ri"],a:1,
 e:"Chuqur meros muammosi: ota sinfdagi kichik o'zgarish hamma avlodni buzadi; xulqni ishlatish uchun ortiqcha bog'liqlik ham meros bilan keladi. Kompozitsiya + kichik interfeyslar testni ham osonlashtiradi (bog'liqlikni almashtirish). Go bu yondashuvni tilga singdirgan."},
{l:"M",t:"mcq",tp:"SOLID",q:"Single Responsibility Principle (S) nimani talab qiladi?",
 o:["Har sinfda faqat bitta metod bo'lsin","Modul o'zgarishining faqat bitta sababi bo'lsin — ya'ni u bitta manfaatdor tomon/vazifaga xizmat qilsin (masalan hisob-kitob mantig'i, formatlash va DB'ga yozish bir joyda bo'lmasin)","Har fayl 100 qatordan oshmasin","Har funksiya bitta argument olsin"],a:1,
 e:"Amaliy mezon: 'bu kodni o'zgartirishni kim so'raydi?' Agar javob ikki xil (moliyachi va dizayner) bo'lsa — ajratish kerak. Buzilish alomati: bitta struct ichida validatsiya, SQL, HTTP javob formati va biznes qoidasi aralash. Haddan oshirish ham zarar: har narsani bitta metodli sinflarga bo'lib tashlash o'qishni qiyinlashtiradi."},
{l:"M",t:"mcq",tp:"SOLID",q:"Open/Closed Principle (O) misoli qaysi?",
 o:["Har yangi to'lov turi uchun switch/if zanjiriga yangi shart qo'shish","PaymentMethod interfeysi bo'lib, yangi to'lov turi yangi implementatsiya sifatida qo'shiladi — mavjud kod o'zgarmaydi","Hamma maydonlarni public qilish","Funksiyalarni doim o'zgartirib turish"],a:1,
 e:"Kengaytirishga ochiq, o'zgartirishga yopiq. Go'da bu interfeys + registry/strategiya bilan tabiiy chiqadi. Lekin mavhumlikni oldindan qurmang: ikki-uchinchi holat paydo bo'lganda ajratish (rule of three) — birinchi kundanoq 'kelajak uchun' interfeys yozish ko'pincha ortiqcha murakkablik."},
{l:"M",t:"mcq",tp:"SOLID",q:"Liskov Substitution Principle (L) buzilishiga misol?",
 o:["Interfeysda ko'p metod bo'lishi","Square sinfi Rectangle'dan meros olib, setWidth qilganda balandlikni ham o'zgartiradi — Rectangle kutayotgan kod (kenglikni o'zgartirsam balandlik saqlanadi) buziladi; ya'ni avlod ota kontraktini buzadi","Sinf nomining uzunligi","Ko'p konstruktor bo'lishi"],a:1,
 e:"Boshqa tipik buzilishlar: avlod metodi ota ruxsat bermagan xato (exception) tashlashi, shartlarni kuchaytirishi yoki 'not implemented' qaytarishi (masalan ReadOnlyList.Add). Mezon: ota tipini kutayotgan kod avlodni bilmasdan ishlatganda to'g'ri ishlashi kerak."},
{l:"M",t:"mcq",tp:"SOLID",q:"Interface Segregation (I) nimani aytadi?",
 o:["Interfeys ko'p metodli bo'lishi kerak","Client o'ziga keraksiz metodlarga bog'lanmasin — katta interfeysni kichik, maqsadli interfeyslarga bo'lish kerak","Interfeys faqat bitta bo'lsin","Har sinf interfeys implement qilsin"],a:1,
 e:"Go bu tamoyilning eng yaxshi namunasi: io.Reader, io.Writer — bittadan metod, va ular istalgancha birlashtiriladi (io.ReadWriter). Amaliy foyda: testda faqat kerakli metodni mock qilasiz. 'Accept interfaces, return structs' shiori ham shu bilan bog'liq."},
{l:"M",t:"mcq",tp:"SOLID",q:"Dependency Inversion (D) va Dependency Injection farqi?",
 o:["Bir xil narsa","DIP — tamoyil: yuqori darajadagi modul konkret implementatsiyaga emas, mavhumlikka (interfeys) bog'lansin va interfeys iste'molchiga tegishli bo'lsin. DI — shu bog'liqlikni tashqaridan (konstruktor/parametr orqali) uzatish texnikasi","DI faqat framework bilan mumkin","DIP faqat Java'da"],a:1,
 e:"Go'da: application qatlami OrderRepository interfeysini o'zi e'lon qiladi, postgres paketi uni implement qiladi, main esa ulaydi (qo'lda yoki wire bilan). Natija: domain kodni DB'siz test qilish mumkin va DB'ni almashtirish domainga tegmaydi. Framework shart emas — konstruktor yetarli."},
{l:"M",t:"open",tp:"SOLID",q:"SOLID'ni klasssiz tilda (Go) qanday qo'llaysiz?",
 m:["S: paket va struct bitta vazifaga; HTTP handler, biznes qoida va SQL alohida","O: yangi xulq yangi tip sifatida qo'shiladi (interfeys implementatsiyasi), mavjud funksiya o'zgarmaydi","L: interfeys kontraktini buzmaslik — 'not implemented' qaytaradigan implementatsiya alomat","I: kichik interfeyslar (1–3 metod), iste'molchi paketda e'lon qilinadi","D: konstruktorga interfeys uzatish, konkret tipni main'da ulash","Go'ga xos: embedding bilan xulqni birlashtirish, lekin meros iyerarxiyasi qurmaslik"],
 e:"Intervyuda kuchli javob — tamoyilni ta'riflash emas, kodda qanday ko'rinishini va qachon ortiqcha bo'lishini aytish."},
{l:"S",t:"mcq",tp:"Pattern",q:"Strategy pattern qachon kerak?",
 o:["Obyektni bitta nusxada saqlash uchun","Bir vazifani bajarishning bir nechta almashtiriladigan algoritmi bo'lsa (turli chegirma hisoblash, turli saralash, turli to'lov provayderi) — algoritm interfeys ortiga olinadi va ish vaqtida tanlanadi","Obyekt yaratishni yashirish uchun","Interfeysni moslashtirish uchun"],a:1,
 e:"Go'da strategiya ko'pincha oddiy funksiya tipi bilan ifodalanadi (type Discount func(Order) Money) — alohida struct shart emas. Alomat: uzun switch zanjiri har yangi holatda o'sib boryapti. Lekin ikki holat bo'lsa oddiy if ham yetarli — pattern o'zi maqsad emas."},
{l:"S",t:"mcq",tp:"Pattern",q:"Decorator pattern va HTTP middleware qanday bog'liq?",
 o:["Bog'liq emas","Middleware — decorator'ning aynan o'zi: mavjud handler'ni o'rab, uning oldidan/keyinidan xulq qo'shadi (log, auth, metrika) va asosiy interfeysni o'zgartirmaydi; ular zanjir bo'lib joylashadi","Middleware — bu singleton","Decorator faqat UI uchun"],a:1,
 e:"Go'da: func Logging(next http.Handler) http.Handler — kirish va chiqish bir xil tip, shuning uchun istalgancha zanjirlash mumkin. Tartib muhim: recover → request id → log → auth → rate limit → handler. Xuddi shu yondashuv gRPC interceptor va DB qatlamida ham ishlatiladi."},
{l:"S",t:"mcq",tp:"Pattern",q:"Singleton nega ko'pincha anti-pattern deb ataladi?",
 o:["Sekin ishlagani uchun","Global holat va yashirin bog'liqlik keltiradi: testda almashtirish qiyin, parallel testlar bir-biriga ta'sir qiladi, ishga tushish tartibi va konkurentlik muammolari paydo bo'ladi. Yaxshiroq: bitta nusxani main'da yaratib, bog'liqlik sifatida uzatish","Ko'p xotira olgani uchun","Faqat Java'da muammo"],a:1,
 e:"Go'da tipik ko'rinishi: paket darajasidagi global DB yoki logger. Kichik ilovada qulay, lekin o'sgan sari og'riq beradi. init() ichida ulanish ochish — ayniqsa yomon: xatoni boshqarib bo'lmaydi va test uchun boshqa konfiguratsiya berib bo'lmaydi."},
{l:"S",t:"open",tp:"Pattern",q:"Jamoada 'hamma joyda pattern ishlatamiz' degan kod paydo bo'ldi — 5 qatorlik mantiq uchun factory, builder va interfeys. Qanday yondashasiz?",
 m:["Pattern — muammoga javob, bezak emas: har mavhumlik uchun 'qanday real o'zgarish kutilyapti?' deb so'rash","YAGNI va rule of three: ikkinchi-uchinchi holat paydo bo'lgach umumlashtirish","O'lchov: kodni o'qib tushunish vaqti, o'zgartirish uchun nechta faylga tegish kerakligi","Review'da standart: yangi mavhumlik kiritilsa, uning sababini PR tavsifida yozish","Teskari tomon ham xavfli — takrorlanuvchi if zanjirlari; muvozanat konkret misollarda muhokama qilinadi","Jamoaviy kelishuv: kod uslubi hujjati va misollar"],
 e:"Senior/Staff signal: 'to'g'ri' javobni emas, jamoada qaror qabul qilish yo'lini ko'rsatish. Ortiqcha mavhumlik ham, uning yo'qligi ham bir xil zarar — muhimi, o'zgarish ehtimoli asosida qaror qilish."}
];
const QDS=[
// ================= DISTRIBUTED SYSTEMS =================
{l:"M",t:"mcq",tp:"Fundamentals",q:"'Fallacies of distributed computing' (taqsimlangan tizimlar haqidagi noto'g'ri farazlar) nimani ogohlantiradi?",
 o:["Tarmoq har doim ishonchli deb hisoblash mumkin","Ishlab chiquvchilar odatda noto'g'ri faraz qiladi: tarmoq ishonchli, latency nol, bandlik cheksiz, tarmoq xavfsiz, topologiya o'zgarmaydi, bitta administrator bor, transport narxi nol, tarmoq bir jinsli — har biri real tizimda buziladi","Tarmoq hech qachon ishlamaydi","Bu faqat eski tizimlarga tegishli"],a:1,
 e:"Amaliy natija: har tarmoq chaqiruvi uchta natijaga ega bo'lishi mumkin — muvaffaqiyat, xato va NOMA'LUM (timeout). Uchinchisi eng qiyin: so'rov bajarilgan bo'lishi ham, bajarilmagan bo'lishi ham mumkin. Shuning uchun idempotentlik, deadline va retry siyosati — arxitekturaning bir qismi.",src:"https://en.wikipedia.org/wiki/Fallacies_of_distributed_computing"},
{l:"M",t:"mcq",tp:"Failure",q:"Node'dan javob kelmayapti. Uni 'o'lgan' deb hisoblash mumkinmi?",
 o:["Ha, javob yo'q — demak o'lgan","Yo'q: asinxron tarmoqda sekin node va o'lgan node'ni ishonchli ajratib bo'lmaydi — javob kechikayotgan, tarmoq bo'lingan yoki node GC pauzasida bo'lishi mumkin. Shuning uchun timeout — taxmin, fakt emas","Faqat ping bilan aniqlanadi","Har doim aniq bilish mumkin"],a:1,
 e:"Shuning uchun failover xavfli: eski leader aslida tirik bo'lib, yozishda davom etishi mumkin (split-brain). Himoya: lease (muddatli egalik) + fencing token — resurs eski tokenli so'rovni rad etadi. Heartbeat timeout'ini tanlash — tez aniqlash va noto'g'ri failover orasidagi muvozanat."},
{l:"M",t:"mcq",tp:"Consistency",q:"N=3 nusxa, W=2 va R=2 (quorum). Bu nima beradi?",
 o:["Hech qanday kafolat","R + W > N bo'lgani uchun o'qish to'plami yozish to'plami bilan kamida bitta node'da kesishadi — eng so'nggi yozilgan qiymatni ko'rish kafolati kuchayadi","Faqat tezlik oshadi","Ma'lumot uch marta o'qiladi"],a:1,
 e:"Sozlash: W=1 (tez yozish, zaif o'qish kafolati), R=1 va W=N (tez o'qish, sekin yozish). Bu — Dynamo uslubidagi leaderless replikatsiya modeli (Cassandra, Riak). Diqqat: quorum ham hamma anomaliyani yopmaydi (konkurent yozishlar, sloppy quorum) — versiya (vector clock) yoki LWW bilan konflikt hal qilinadi."},
{l:"S",t:"mcq",tp:"Consensus",q:"Raft qanday ishlaydi?",
 o:["Hamma node teng, lider yo'q","Node'lar leader saylaydi (term va ovoz berish orqali); barcha yozuvlar leader log'iga tushadi va follower'larga replikatsiya qilinadi; yozuv ko'pchilik tasdiqlagach commit bo'ladi. Ko'pchilik yo'qolsa tizim yozishni to'xtatadi (konsistentlikni mavjudlikdan ustun qo'yadi)","Har node mustaqil qaror qiladi","Faqat ikki node kerak"],a:1,
 e:"Shuning uchun konsensus klasterlari toq sonda bo'ladi (3, 5): 3 node 1 ta yo'qotishga, 5 node 2 ta yo'qotishga chidaydi. Ishlatilishi: etcd (Kubernetes), Consul, CockroachDB, Kafka KRaft. Konsensus qimmat — uni har yozishga emas, metadata va liderlik kabi kam sonli qarorlarga qo'llash kerak.",src:"https://raft.github.io/"},
{l:"S",t:"mcq",tp:"Failure",q:"Split-brain nima va undan qanday himoyalanasiz?",
 o:["Ma'lumot bazasi buzilishi","Tarmoq bo'linganda ikki node ham o'zini leader deb hisoblab, ikkalasi ham yozishni qabul qiladi — ma'lumot ikkiga ajraladi. Himoya: ko'pchilik (quorum) talabi, lease va fencing token, STONITH","Disk to'lishi","Sekin so'rovlar"],a:1,
 e:"Fencing token — eng amaliy himoya: har yangi leaderga o'suvchi raqam beriladi; storage eski raqamli so'rovni rad etadi. Faqat TTL'ga tayanish yetarli emas — GC pauzasi yoki VM to'xtashi TTL'dan uzoq bo'lishi mumkin."},
{l:"S",t:"mcq",tp:"Clocks",q:"Taqsimlangan tizimda hodisalar tartibini aniqlash uchun nega oddiy timestamp yetarli emas?",
 o:["Timestamp juda katta joy oladi","Serverlar soati bir xil emas (clock skew, NTP sakrashlari, hatto orqaga siljish) — shuning uchun 'kechroq timestamp = kechroq hodisa' deb bo'lmaydi. Sabab-oqibat tartibi uchun Lamport yoki vector clock, aniqlik kerak bo'lsa TrueTime kabi cheklangan noaniqlik","Timestamp doim aniq","Faqat replikatsiyada muammo"],a:1,
 e:"Amaliy oqibatlar: LWW (last write wins) konflikt hal qilish soatga ishonadi va yozuv 'yo'qolishi' mumkin; TTL/token muddati soat siljishida noto'g'ri hisoblanadi. Monotonic clock (Go'da time.Since) — davomiylikni o'lchash uchun; wall clock — sana ko'rsatish uchun."},
{l:"S",t:"mcq",tp:"Consistency",q:"Eventual consistency amalda nimani anglatadi?",
 o:["Ma'lumot hech qachon mos kelmaydi","Yangi yozuv bo'lmasa, nusxalar oxir-oqibat bir xil qiymatga keladi — lekin 'oxir-oqibat' qancha ekani kafolatlanmagan va oraliqda turli client turli qiymat ko'rishi mumkin","Yozish sekin bo'ladi","Faqat NoSQL'da bo'ladi"],a:1,
 e:"Yaqinlashtiruvchi mexanizmlar: read repair, anti-entropy (Merkle tree bilan solishtirish), hinted handoff. Foydalanuvchi uchun yumshatish: o'z yozganini ko'rish (read-your-writes), monotonic reads (bir sessiya orqaga ketmasin) va UI'da optimistik ko'rsatish. Qaysi ma'lumot eventual bo'lishi mumkinligi — biznes qarori."},
{l:"S",t:"mcq",tp:"Replication",q:"Leader-based va leaderless replikatsiya farqi?",
 o:["Farqi yo'q","Leader-based: hamma yozuv bitta leader orqali — tartib sodda, failover kerak (Postgres, MySQL, Kafka partition). Leaderless: har node yozuvni qabul qiladi, quorum va konflikt hal qilish bilan (Dynamo, Cassandra) — yozish mavjudligi yuqori, lekin konflikt va versiyalash murakkab","Leaderless doim tezroq","Leader-based konsistent emas"],a:1,
 e:"Uchinchi model — multi-leader (region bo'yicha), offline-first ilovalar va multi-region yozish uchun; konflikt hal qilish (CRDT, LWW, qo'lda) majburiy. Tanlov: yozish qayerdan keladi, konflikt qanchalik ehtimoliy va uni biznes qanday hal qiladi."},
{l:"S",t:"mcq",tp:"Fundamentals",q:"Gossip protokoli nima uchun ishlatiladi?",
 o:["Ma'lumotni shifrlash uchun","Node'lar tasodifiy tanlangan qo'shnilar bilan holat ma'lumotini almashadi — klaster a'zoligi va nosozlik haqidagi xabar markaziy koordinatorsiz, epidemik tarzda tarqaladi (Cassandra, Consul, Redis Cluster)","Xabar navbati sifatida","Faqat monitoring uchun"],a:1,
 e:"Afzalligi: markazlashmagan, katta klasterda yaxshi masshtablanadi, qisman nosozlikka chidamli. Kamchiligi: ma'lumot darhol emas, ehtimollik bilan tarqaladi (eventual). Konsensus o'rnini bosmaydi — a'zolik va sog'liq ma'lumoti uchun, qat'iy kelishuv uchun emas."},
{l:"St",t:"mcq",tp:"Consensus",q:"FLP impossibility natijasi nimani aytadi?",
 o:["Taqsimlangan tizim umuman ishlamaydi","To'liq asinxron tarmoqda hatto bitta node ishdan chiqsa ham, har doim tugashi kafolatlangan deterministik konsensus algoritmi mavjud emas","Konsensus faqat ikki node bilan mumkin","Timeout ishlatish taqiqlangan"],a:1,
 e:"Amalda buni timeout va tasodifiylik bilan chetlab o'tiladi: Raft/Paxos xavfsizlikni (safety — noto'g'ri qaror bo'lmaydi) doim saqlaydi, lekin tirikligini (liveness — qaror qabul qilinadi) faqat tarmoq 'yetarlicha yaxshi' bo'lganda kafolatlaydi. Shuning uchun leader election timeout'lari va jitter muhim."},
{l:"St",t:"mcq",tp:"Fundamentals",q:"Mikroservislar orasida 'exactly-once' yetkazib berish mumkinmi?",
 o:["Ha, Kafka buni to'liq hal qilgan","Tarmoq darajasida yo'q (ikki general muammosi): amalda at-least-once yetkazish + iste'molchi tomonda idempotentlik = 'effectively once'. Kafka tranzaksiyalari faqat Kafka ichidagi oqim uchun","Ha, TCP buni kafolatlaydi","Yo'q, faqat at-most-once mumkin"],a:1,
 e:"Amaliy retsept: har xabarga barqaror ID, iste'molchida dedup jadvali yoki unique constraint, tashqi side effect uchun idempotency key. Bu savolga 'exactly-once yo'q, effectively-once bor' deb javob berish senior/staff signal."},
{l:"St",t:"open",tp:"Failure",q:"Gray failure (qisman nosozlik) nima va uni qanday aniqlaysiz?",
 m:["Servis 'tirik' ko'rinadi (health check yashil), lekin amalda sekin yoki so'rovlarning bir qismini yiqitmoqda","Sabablar: disk sekinlashuvi, bitta AZ'da tarmoq muammosi, GC pauzalari, issiq shard, bog'liqlik sekinligi","Aniqlash: sun'iy health check emas, real foydalanuvchi so'rovlari metrikasi (SLI), p99 va xato foizi; client tomonidan ko'rinadigan metrikalar","Node/AZ/shard bo'yicha kesimlar — 'o'rtacha yaxshi, lekin bitta instance yomon' holatini ko'rish","Chora: outlier detection bilan yomon instance'ni trafikdan chiqarish, circuit breaker, hedged request","Xaos testlari: sekinlik va paket yo'qotishni ataylab kiritib, tizim xulqini tekshirish"],
 e:"Staff signal: 'ishlayapti/ishlamayapti' ikkilik modelidan voz kechish. Eng yomon nosozlik — to'liq o'lim emas, yarim tirik holat: retry'lar ko'payadi va yuk zanjir bo'ylab tarqaladi."},
{l:"St",t:"mcq",tp:"Failure",q:"Cell-based (hujayrali) arxitektura nimani hal qiladi?",
 o:["Deploy tezligini","Blast radius'ni cheklaydi: tizim mustaqil 'hujayralar'ga bo'linadi (har biri to'liq stack va o'z resurslari), foydalanuvchilar hujayralarga taqsimlanadi — nosozlik yoki yomon deploy faqat bitta hujayrani ushlaydi","Ma'lumotni shifrlaydi","Narxni ikki barobar kamaytiradi"],a:1,
 e:"Bu AWS va boshqa yirik provayderlarda keng qo'llanadigan yondashuv. Bog'liq amaliyotlar: shuffle sharding (foydalanuvchilarni tasodifiy kombinatsiyalarga joylash), hujayra bo'yicha bosqichli deploy (birinchi bitta hujayraga), hujayra ichida umumiy bog'liqliklarni minimallashtirish. Narxi: operatsion murakkablik va resurs takrorlanishi."},
{l:"St",t:"open",tp:"Consensus",q:"Taqsimlangan tizimda leader election qachon kerak va qanday tuzoqlari bor?",
 m:["Kerak bo'ladigan holatlar: bitta joyda bajarilishi shart bo'lgan ish (cron, kompaksiya, shard egaligi, sxema migratsiyasi)","Amalga oshirish: etcd/Consul/ZooKeeper lease yoki Kubernetes Lease obyekti; Redis lock — faqat 'optimizatsiya' darajasida","Tuzoq 1: eski leader o'zini leader deb o'ylashda davom etadi (GC, tarmoq) — fencing token bilan himoya","Tuzoq 2: lease TTL juda qisqa bo'lsa tez-tez almashinuv (flapping), uzun bo'lsa failover sekin","Tuzoq 3: leader bo'lish bilan ish boshlanmaydi — avvalgi holatni tiklash va yarim bajarilgan ishni yakunlash kerak","Muqobil: ishni partition bo'yicha bo'lish (har node o'z bo'lagiga egalik qiladi) — leader umuman kerak bo'lmasligi mumkin"],
 e:"Staff signal: 'leader election kerakmi?' degan savoldan boshlash. Ko'p holatda idempotent ish + partitionlash liderlikdan sodda va ishonchli."}
];
QG.push(...QG2);
QG.forEach((q,i)=>{q.d="go";q.id=3000+i;q.n="G"+(i+1);});
QA.forEach((q,i)=>{q.d="alg";q.id=4000+i;q.n="A"+(i+1);});
QJ.forEach((q,i)=>{q.d="job";q.id=5000+i;q.n="V"+(i+1);});
QF.forEach((q,i)=>{q.d="fund";q.id=6000+i;q.n="F"+(i+1);});
QDS.forEach((q,i)=>{q.d="dist";q.id=7000+i;q.n="D"+(i+1);});
const Q=[...QD,...QB,...QI,...QG,...QA,...QJ,...QF,...QDS];
const DOM={db:"Database",be:"Backend",inf:"Mikroservis & infra",go:"Go",alg:"Algoritm & case",job:"Vakansiya stack",fund:"Tarmoq, API, OOP",dist:"Distributed systems"};
const SEC={
  sql:["SQL asoslari",["SQL","JOIN","NULL","GROUP BY","Subquery","Window","Pagination","Upsert"],"db"],
  model:["Modellash & kalitlar",["Keys","Design","Types"],"db"],
  perf:["Index & performance",["Index","Planner","ORM"],"db"],
  tx:["Tranzaksiya & isolation",["Transactions","Isolation","Locking","Concurrency","MVCC","Idempotency"],"db"],
  ops:["Operatsiya & ishonchlilik",["Migrations","Migration","Ops","Backup","Replication","Partitioning","Incident","Cost"],"db"],
  nosql:["MongoDB & NoSQL",["MongoDB"],"db"],
  search:["Qidiruv & real vaqt",["Elasticsearch","Realtime"],"db"],
  road:["Roadmap: backend asoslari",["Network","Auth","Security","Testing","OS","System design"],"db"],
  dist:["Distributed & arxitektura",["Distributed","Sharding","Integration","CDC","Architecture","Strategy","Org"],"db"],
  bapi:["API & HTTP",["HTTP","REST","API"],"be"],
  bcache:["Kesh",["Cache"],"be"],
  basync:["Navbat & resilience",["Queue","Resilience","Ops"],"be"],
  bsec:["Auth & xavfsizlik",["Auth","Security"],"be"],
  bsys:["System design & arxitektura",["System design","Microservices","SRE"],"be"],
  imsvc:["Mikroservis patternlari",["Patterns","Discovery","Mesh"],"inf"],
  icont:["Konteyner & Kubernetes",["Docker","Kubernetes"],"inf"],
  icicd:["CI/CD & deploy",["CI/CD","Deploy","Secrets"],"inf"],
  iobs:["Observability",["Logging","Metrics","Tracing","Alerting"],"inf"],
  inet:["Tarmoq & bulut",["Network","Cloud"],"inf"],
  gocore:["Go asoslari",["Basics","Interfaces","Errors","Testing"],"go"],
  goconc:["Go concurrency",["Concurrency","Channels","Context","Sync"],"go"],
  goperf:["Go xotira & performance",["Memory","Performance"],"go"],
  algpat:["Algoritm patternlari",["Arrays","Linked list","Sliding window","Intervals","Heap","Graphs","Binary search","DP","Sorting","Design","Approach"],"alg"],
  algcase:["System design case'lar",["Case"],"alg"],
  jkafka:["Kafka & RabbitMQ",["Kafka","RabbitMQ","EDA"],"job"],
  jdata:["PostgreSQL, Elasticsearch, Redis (Go)",["Elasticsearch","Go+DB","Redis"],"job"],
  jaws:["AWS",["AWS"],"job"],
  jpract:["TDD / BDD / DDD",["TDD","BDD","DDD"],"job"],
  jdomain:["E-commerce & subscription",["Domain"],"job"],
  jsoft:["Jamoa, review, ingliz tili",["Behavioral"],"job"],
  fnet:["Tarmoq & protokollar",["TCP/IP","HTTP","TLS"],"fund"],
  fapi:["REST & gRPC",["gRPC","API dizayn"],"fund"],
  foop:["OOP & SOLID",["OOP","SOLID"],"fund"],
  fpat:["Design patterns",["Pattern"],"fund"],
  farch:["Arxitektura & clean code",["Arxitektura","Clean code","ADR","Refactoring"],"fund"],
  dsth:["Nazariya: consensus & consistency",["Consensus","Consistency","Clocks","Replication"],"dist"],
  dspr:["Amaliyot: nosozlik & masshtab",["Failure","Fundamentals"],"dist"]
};
const secOf=q=>Object.keys(SEC).find(k=>SEC[k][2]===q.d&&SEC[k][1].includes(q.tp));

// ---------- state ----------
const KEY="dbdrill.v1";
let S={res:{},filt:{lvl:[],type:[],show:"all",dom:"",sec:"",tp:[]},cur:0};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.res)S={...S,...s,filt:{...S.filt,...(s.filt||{})}};}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inline=s=>esc(s).replace(/&lt;(\/?)b&gt;/g,"<$1b>").replace(/`([^`]+)`/g,"<code>$1</code>");
let draft={}; // unsent answers per question

function list(){
  const f=S.filt;
  return Q.filter(q=>(!f.dom||q.d===f.dom)&&(!f.sec||secOf(q)===f.sec)&&(!f.tp.length||f.tp.includes(q.tp))&&(!f.lvl.length||f.lvl.includes(q.l))&&(!f.type.length||f.type.includes(q.t))&&
    (f.show==="all"||(f.show==="todo"&&!S.res[q.id])||(f.show==="wrong"&&S.res[q.id]&&S.res[q.id].g!=="ok")));
}
function chips(el,items,isOn,onClick){
  el.innerHTML="";
  items.forEach(([v,label])=>{const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=label;
    b.setAttribute("aria-pressed",isOn(v));b.onclick=()=>onClick(v);el.appendChild(b);});
}
function toggle(arr,v){const i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1);}
function renderSide(){
  const acc=$("#acc");acc.innerHTML="";
  const all=document.createElement("button");all.type="button";all.className="acc-all";
  all.setAttribute("aria-pressed",!S.filt.dom&&!S.filt.sec);all.textContent="Hammasi ("+Q.length+")";
  all.onclick=()=>{S.filt.dom="";S.filt.sec="";S.filt.tp=[];S.cur=0;save();render();};acc.appendChild(all);
  const mk=(key,cls,on,title,done,total)=>{
    const d=document.createElement("details");d.className=cls+(on?" on":"");
    d.open=(S.open||[]).includes(key)||on;
    d.innerHTML=`<summary><span>${esc(title)}</span><b>${done}/${total}</b></summary><div class="acc-body"></div>`;
    d.addEventListener("toggle",()=>{S.open=S.open||[];const i=S.open.indexOf(key);if(d.open&&i<0)S.open.push(key);if(!d.open&&i>=0)S.open.splice(i,1);save();});
    return d;
  };
  const cnt=qs=>[qs.filter(q=>S.res[q.id]).length,qs.length];
  Object.entries(DOM).forEach(([dk,dn])=>{
    const dq=Q.filter(q=>q.d===dk);if(!dq.length)return;
    const dd=mk("d:"+dk,"acc-item acc-dom",S.filt.dom===dk&&!S.filt.sec,dn,...cnt(dq));
    const body=dd.querySelector(".acc-body");
    const allD=document.createElement("button");allD.type="button";allD.className="acc-all";
    allD.setAttribute("aria-pressed",S.filt.dom===dk&&!S.filt.sec);allD.textContent="Butun "+dn+" ("+dq.length+")";
    allD.onclick=()=>{S.filt.dom=dk;S.filt.sec="";S.filt.tp=[];S.cur=0;save();render();};body.appendChild(allD);
    Object.entries(SEC).filter(([,v])=>v[2]===dk).forEach(([k,[name,tps]])=>{
      const qs=Q.filter(q=>secOf(q)===k);if(!qs.length)return;
      const d=mk(k,"acc-item",S.filt.sec===k,name,...cnt(qs));
      const ch=document.createElement("div");ch.className="chips";d.querySelector(".acc-body").appendChild(ch);
      chips(ch,[["*","Hammasi"],...tps.filter(t=>qs.some(q=>q.tp===t)).map(t=>[t,t+" ("+qs.filter(q=>q.tp===t).length+")"])],
        v=>S.filt.sec===k&&(v==="*"?!S.filt.tp.length:S.filt.tp.includes(v)),
        v=>{if(S.filt.sec!==k){S.filt.sec=k;S.filt.dom=dk;S.filt.tp=[];}
            if(v==="*")S.filt.tp=[];else toggle(S.filt.tp,v);S.cur=0;save();render();});
      body.appendChild(d);
    });
    acc.appendChild(dd);
  });
  chips($("#f-lvl"),Object.entries(LV),v=>S.filt.lvl.includes(v),v=>{toggle(S.filt.lvl,v);S.cur=0;save();render();});
  chips($("#f-type"),Object.entries(TY),v=>S.filt.type.includes(v),v=>{toggle(S.filt.type,v);S.cur=0;save();render();});
  chips($("#f-show"),[["all","Hammasi"],["todo","Yechilmagan"],["wrong","Xato / qisman"]],v=>S.filt.show===v,v=>{S.filt.show=v;S.cur=0;save();render();});
  const st=$("#stats");st.innerHTML="";
  let tot=0,tp=0;
  Object.entries(LV).forEach(([k,n])=>{
    const qs=Q.filter(q=>q.l===k);let p=0,done=0;
    qs.forEach(q=>{const r=S.res[q.id];if(r){done++;p+=r.g==="ok"?1:r.g==="mid"?.5:0;}});
    tot+=qs.length;tp+=p;
    const pct=Math.round(p/qs.length*100);
    st.insertAdjacentHTML("beforeend",`<div class="srow"><span>${n}</span><div class="bar"><i style="width:${pct}%"></i></div><b>${done}/${qs.length}</b></div>`);
  });
  st.insertAdjacentHTML("beforeend",`<div class="srow"><span><b style="color:var(--ink)">Ball</b></span><div class="bar"><i style="width:${Math.round(tp/tot*100)}%"></i></div><b>${Math.round(tp/tot*100)}%</b></div>`);
  const L=list(),d=$("#dots");d.innerHTML="";
  L.forEach((q,i)=>{const b=document.createElement("button");b.type="button";const r=S.res[q.id];
    b.className="dot"+(r?" "+r.g:"")+(i===S.cur?" cur":"");b.textContent=q.n;b.title=LV[q.l]+" · "+TY[q.t];
    b.onclick=()=>{S.cur=i;save();render();};d.appendChild(b);});
}
function renderCard(){
  const L=list(),c=$("#card");
  if(!L.length){c.innerHTML=`<div class="empty">Bu filtrga mos savol yo'q. Filtrni o'zgartiring.</div>`;return;}
  if(S.cur>=L.length)S.cur=L.length-1;
  const q=L[S.cur],r=S.res[q.id],done=!!r;
  let h=`<div class="meta"><span class="tag lvl">${LV[q.l]}</span><span class="tag">${TY[q.t]}</span><span class="tag">${esc(SEC[secOf(q)][0])} › ${esc(q.tp)}</span><span class="pos">#${q.n} · ${S.cur+1}/${L.length}</span></div>
  <p class="q">${q.q}</p>`;
  if(q.c)h+=`<pre>${esc(q.c)}</pre>`;
  if(q.o){
    const sel=done?r.v:draft[q.id];
    h+=`<div class="opts" role="radiogroup">`+q.o.map((o,i)=>{
      let cls="opt";if(done){if(i===q.a)cls+=" right";else if(i===r.v)cls+=" wrong";}else if(sel===i)cls+=" sel";
      return `<button type="button" class="${cls}" data-i="${i}" ${done?"disabled":""} role="radio" aria-checked="${sel===i}"><span class="k">${"ABCD"[i]}</span><span>${inline(o)}</span></button>`;}).join("")+`</div>`;
  }else{
    const val=done?r.v:(draft[q.id]||"");
    h+=`<textarea id="ans-${q.id}" class="${q.t==="sql"?"sql":""}" placeholder="${q.t==="sql"?"SELECT ...":"Javobingizni o'zingizcha yozing — interviewda aytgandek."}" ${done?"readonly":""}>${esc(val)}</textarea>`;
  }
  h+=`<div class="actions"><button class="btn" id="prev" type="button" ${S.cur===0?"disabled":""}>← Oldingi</button>`;
  if(!done)h+=`<button class="btn primary" id="check" type="button">Tekshirish</button>`;
  else h+=`<button class="btn" id="redo" type="button">Qayta yechish</button>`;
  h+=`<span class="spacer"></span><button class="btn" id="next" type="button" ${S.cur===L.length-1?"disabled":""}>Keyingi →</button></div>`;
  if(done)h+=explain(q,r);
  c.innerHTML=h;
  c.querySelectorAll(".opt:not([disabled])").forEach(b=>b.onclick=()=>{draft[q.id]=+b.dataset.i;renderCard();});
  const ta=c.querySelector("textarea:not([readonly])");if(ta)ta.oninput=()=>draft[q.id]=ta.value;
  $("#prev").onclick=()=>go(-1);$("#next").onclick=()=>go(1);
  const ck=$("#check");if(ck)ck.onclick=()=>check(q);
  const rd=$("#redo");if(rd)rd.onclick=()=>{delete S.res[q.id];delete draft[q.id];save();render();};
  c.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{S.res[q.id].g=b.dataset.g;S.res[q.id].self=true;save();render();});
}
function hits(q,txt){const u=txt.toUpperCase().replace(/\s+/g," ");return q.k.map(k=>({k:k.split("|")[0],hit:k.split("|").some(p=>u.includes(p.toUpperCase()))}));}
function explain(q,r){
  let h="";
  if(q.o){
    h+=r.g==="ok"?`<div class="verdict ok">To'g'ri ✓</div>`:r.v==null?`<div class="verdict bad">Javob tanlanmadi. To'g'ri javob: ${"ABCD"[q.a]}</div>`:`<div class="verdict bad">Noto'g'ri. To'g'ri javob: ${"ABCD"[q.a]}</div>`;
  }else{
    const lab={ok:"Bildim",mid:"Qisman",bad:"Bilmadim"};
    h+=`<div class="verdict ${r.g}">O'z bahoyingiz: ${lab[r.g]}${r.self?"":" (avtomatik taxmin — pastda o'zgartiring)"}</div>`;
  }
  h+=`<div class="exp">`;
  if(q.t==="sql"){
    h+=`<h4>Kalit elementlar</h4><div class="keys">${hits(q,r.v||"").map(x=>`<span class="${x.hit?"hit":"miss"}">${esc(x.k)}</span>`).join("")}</div>`;
    h+=`<h4>Namuna yechim</h4><pre>${esc(q.m)}</pre>`;
  }
  if(q.t==="open")h+=`<h4>Kuchli javobda bo'lishi kerak</h4><ul>${q.m.map(x=>`<li>${inline(x)}</li>`).join("")}</ul>`;
  h+=`<h4>Izoh</h4><p>${inline(q.e)}</p>`;
  if(q.src)h+=`<p class="src">Manba: <a href="${esc(q.src)}" target="_blank" rel="noopener noreferrer">${esc(q.src.replace(/^https?:\/\//,"").split("/")[0])}</a> — <span>${esc(q.src)}</span></p>`;
  if(!q.o)h+=`<h4>O'zingizni baholang</h4><div class="self"><button class="btn" data-g="ok" type="button">Bildim</button><button class="btn" data-g="mid" type="button">Qisman</button><button class="btn" data-g="bad" type="button">Bilmadim</button></div>`;
  return h+`</div>`;
}
function check(q){
  if(q.o){const v=draft[q.id];S.res[q.id]={v:v??null,g:v===q.a?"ok":"bad"};}
  else{const v=(draft[q.id]||"").trim();let g="bad";
    if(q.t==="sql"&&v){const hs=hits(q,v),n=hs.filter(x=>x.hit).length;g=n===hs.length?"ok":n>=hs.length/2?"mid":"bad";}
    else if(v.length>40)g="mid";
    S.res[q.id]={v,g};}
  delete draft[q.id];save();render();
}
function go(d){const L=list();S.cur=Math.max(0,Math.min(L.length-1,S.cur+d));save();render();window.scrollTo({top:0});}
function render(){renderSide();renderCard();}
$("#reset").onclick=()=>{if(confirm("Barcha natijalar o'chirilsinmi?")){S.res={};draft={};S.cur=0;save();render();}};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="TEXTAREA"){if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){const b=$("#check");b&&b.click();}return;}
  if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);
  else if(/^[1-4]$/.test(e.key)){const b=document.querySelector(`.opt[data-i="${+e.key-1}"]:not([disabled])`);b&&b.click();}
  else if(e.key==="Enter"){const b=$("#check");if(b){e.preventDefault();b.click();}}
});
render();
</script>
