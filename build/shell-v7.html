{l:"St",t:"open",tp:"Case",q:"CASE: Chat ilovasi (WhatsApp) loyihalang — xabar yetkazib berish va 'o'qildi' statusi.",
 m:["Ulanish: WebSocket (yoki long polling fallback); millionlab ochiq ulanish uchun ulanish serverlari qatlami va discovery (qaysi server qaysi foydalanuvchini ushlab turadi)","Xabar oqimi: client → gateway → xabar servisi → saqlash → qabul qiluvchiga push; offline bo'lsa navbatda saqlanadi","ID va tartib: per-chat monoton ID (Snowflake yoki ketma-ket seq) — tartib va dedup uchun","Yetkazish kafolati: at-least-once + client tomonda dedup (message_id); ACK bosqichlari: sent → delivered → read","Saqlash: chat bo'yicha shardlangan, oxirgi xabarlar issiq saqlashda; guruh chat — fan-out","Push notification (offline), E2E shifrlash bo'lsa kalit almashinuvi"],
 e:"Diqqat qaratiladigan nuqtalar: ulanishlarni masshtablash, xabar tartibi va takrorlanmasligi. 'Xabar yo'qolmasligi' talabini qanday ta'minlashingiz asosiy savol.",src:"https://bytebytego.com/courses/system-design-interview/design-a-chat-system"},
{l:"St",t:"open",tp:"Case",q:"CASE: To'lov tizimi (payment service) loyihalang — pul ikki marta yechilmasligi va hisob-kitob (reconciliation) qanday?",
 m:["Idempotency key har to'lov so'roviga; unique constraint bilan takrorni DB darajasida to'sish","Ledger modeli: double-entry, append-only yozuvlar — balans hisoblanadi, ustiga yozilmaydi","Holat mashinasi: created → authorized → captured → settled / failed / refunded; har o'tish hodisa sifatida saqlanadi","Tashqi provayder (Stripe/PSP) bilan: timeout = noma'lum natija → status so'rovi (polling) va webhook bilan yarashtirish","Webhook: imzo tekshiruvi, takror yetkazishga chidamlilik (idempotent), tartibsiz kelishi mumkin","Kunlik reconciliation: provayder hisoboti va ichki ledger'ni solishtirish, farqlar uchun alert va qo'lda ko'rib chiqish oqimi","Pul — integer (minor units) + valyuta; PCI DSS: karta ma'lumotini saqlamaslik, tokenizatsiya"],
 e:"Bu case'da konsistentlik va audit birinchi o'rinda. Kuchli javob: 'eventual consistency bu yerda mumkin, lekin ledger va idempotentlik qat'iy bo'lishi kerak' va reconciliation'ni alohida aytish.",src:"https://bytebytego.com/courses/system-design-interview/design-a-payment-system"},
{l:"St",t:"open",tp:"Case",q:"CASE: Uber uslubidagi haydovchi-yo'lovchi moslashtirish (matching) tizimini loyihalang.",
 m:["Haydovchi joylashuvi har 4–5 soniyada yangilanadi — yozish juda ko'p; xotiradagi geo-index (Redis GEO, geohash/S2/H3 katak) ishlatiladi","Qidiruv: yo'lovchi atrofidagi kataklardan nomzodlar, keyin ETA va reyting bo'yicha saralash","Moslashtirish — konkurent muammo: bitta haydovchini ikki buyurtmaga bermaslik (atomik band qilish, TTL bilan taklif)","Holat: taklif → qabul/rad → safar; har bosqich hodisa (Kafka) bilan yoziladi","Shardlash geografiya bo'yicha (shahar/region) — hot region uchun alohida sig'im","Real vaqt kanali: haydovchi va yo'lovchi ilovalari uchun push/WebSocket; tarmoq uzilishiga chidamlilik","Talab yuqori bo'lganda: surge pricing, navbat, degradatsiya rejasi"],
 e:"Baholanadigan nuqtalar: geo-indekslash tanlovi, yozish yukini xotirada ushlash, va moslashtirishdagi poyga holatini qanday yopishingiz.",src:"https://www.hellointerview.com/learn/system-design/problem-breakdowns/uber"},
{l:"St",t:"open",tp:"Case",q:"CASE: Fayl saqlash va sinxronizatsiya (Dropbox/Google Drive) loyihalang.",
 m:["Fayl bo'laklarga (chunk, masalan 4MB) bo'linadi — faqat o'zgargan bo'lak yuklanadi (delta sync)","Deduplikatsiya: chunk hash (SHA-256) bo'yicha — bir xil bo'lak bir marta saqlanadi","Metadata servisi (fayl daraxti, versiyalar, egalik, ruxsatlar) — SQL; bo'laklar — obyekt saqlash (S3)","Yuklash: client to'g'ridan-to'g'ri S3'ga (pre-signed URL), metadata keyin yangilanadi","Sinxronizatsiya: uzun ulanish yoki polling orqali o'zgarish jurnalini (change log, cursor bilan) olish","Konflikt: bir faylni ikki qurilma o'zgartirsa — versiya saqlash va 'conflicted copy' yaratish","Ruxsat va ulashish: havola, muddat, kim ko'rgani (audit)"],
 e:"Asosiy g'oyalar: chunking, deduplikatsiya va metadata/ma'lumotni ajratish. Intervyuda 1 GB faylning bitta so'zi o'zgarsa nima bo'ladi degan savol albatta keladi.",src:"https://bytebytego.com/courses/system-design-interview/design-google-drive"},
{l:"St",t:"open",tp:"Case",q:"CASE: Avtoto'ldirish (search autocomplete / typeahead) tizimini loyihalang — 10 ms javob kerak.",
 m:["Ma'lumot tuzilmasi: trie (prefiks daraxti), har tugunda eng mashhur N ta yakuniy natija oldindan hisoblangan","Trie xotirada va shardlangan (prefiks bo'yicha); yangilanish — offline qurish va atomik almashtirish","Mashhurlikni hisoblash: qidiruv loglari → oqim ishlovi (Kafka + agregatsiya) → davriy qayta qurish (masalan soatlik)","Kesh: eng ko'p so'raladigan prefikslar uchun Redis/CDN; javob juda kichik","Yozuv xatolariga chidamlilik (fuzzy) va shaxsiylashtirish — narxi latency, ehtiyotkorlik bilan","Filtrlash: nomaqbul so'zlar, yangi trend'larni tezroq ko'rsatish uchun qisqa muddatli qatlam"],
 e:"Bu case'da asosiy urg'u — o'qish yo'li juda tez bo'lishi va og'ir hisob-kitob offline bajarilishi. 'Har so'rovda hisoblamaymiz, oldindan tayyorlaymiz' g'oyasi baholanadi.",src:"https://bytebytego.com/courses/system-design-interview/design-a-search-autocomplete-system"},
{l:"St",t:"open",tp:"Case",q:"CASE: Video platformasi (YouTube) loyihalang — yuklash, kodlash va ko'rish.",
 m:["Yuklash: client → pre-signed URL bilan obyekt saqlashga (katta fayl uchun multipart, qayta tiklanadigan)","Kodlash: yuklangach hodisa → transcoding pipeline (bir nechta sifat/bitrate, thumbnail, subtitr); og'ir CPU ishi, navbat va worker pool bilan","Yetkazish: HLS/DASH bo'laklari CDN orqali; adaptiv bitrate client tomonda","Metadata: video, kanal, ko'rishlar — SQL/NoSQL; ko'rishlar hisobi — async agregatsiya (aniq real vaqt shart emas)","Masshtab: o'qish juda ko'p — kesh va CDN birinchi; mashhur video uchun oldindan tarqatish (prefetch)","Qo'shimcha: moderatsiya, huquqlar (DRM), tavsiya tizimi alohida servis"],
 e:"Muhim g'oya: og'ir ish (kodlash) asinxron, ko'rish yo'li esa CDN bilan statik bo'lakka aylantirilgan. 'Videoni DB'da saqlamaymiz' — birinchi aytiladigan gap.",src:"https://bytebytego.com/courses/system-design-interview/design-youtube"},
{l:"St",t:"open",tp:"Case",q:"CASE: Taqsimlangan job scheduler (cron servisi) loyihalang — vazifalar o'z vaqtida va bir marta bajarilsin.",
 m:["Jadval saqlash: keyingi ishga tushish vaqti bilan (next_run_at) indekslangan jadval","Olish: SELECT ... WHERE next_run_at <= now() ORDER BY next_run_at FOR UPDATE SKIP LOCKED LIMIT N — parallel worker'lar bir-birini kutmaydi","Bir marta bajarilish: (job_id, scheduled_time) bo'yicha unique constraint — takror ishga tushirish rad etiladi","Bajarilish uzoq bo'lsa: lease va heartbeat, worker o'lsa vazifa qaytariladi (lekin idempotent bo'lishi kerak)","Nosozlik holatlari: retry siyosati, backoff, DLQ, o'tkazib yuborilgan oynalarni (missed run) qanday hal qilish — catch-up yoki tashlab ketish","Masshtab: partitionlash, vaqt zonalari va DST, monitoring (kechikish metrikasi)"],
 e:"Senior signal: 'at-least-once + idempotentlik' va SKIP LOCKED naqshi. DST va vaqt zonalari haqida savol berish ham yaxshi taassurot qoldiradi."},
{l:"St",t:"open",tp:"Case",q:"CASE: Multi-tenant SaaS uchun API platformasi loyihalang — kvota, izolyatsiya va hisob-kitob (billing).",
 m:["Autentifikatsiya: API key yoki OAuth2 client credentials; har so'rovda tenant konteksti majburiy","Kvota va rate limit tenant bo'yicha, tarif rejasiga bog'langan; oshganda 429 va aniq header'lar","Izolyatsiya: ma'lumot darajasida (RLS yoki majburiy tenant_id), resurs darajasida (alohida navbat/pool), kerak bo'lsa dedicated tier","Foydalanishni hisoblash (metering): har so'rov hodisa sifatida yoziladi → agregatsiya → billing; takrorlanmaslik va yo'qolmaslik muhim","Observability: tenant bo'yicha latency, xato va xarajat; 'noisy neighbor'ni aniqlash","Versiyalash va deprecation siyosati; sandbox muhit va hujjatlar"],
 e:"Staff signal: metering'ni to'lov bilan bog'lash (yo'qolgan hodisa = yo'qolgan pul), va izolyatsiyani bir necha qatlamda ko'rsatish."},
{l:"S",t:"open",tp:"Case",q:"CASE: Real vaqtda 'trend'dagi top-K' (eng ko'p qidirilgan 10 so'z) tizimini loyihalang.",
 m:["Oqim: hodisalar Kafka'ga → oqim ishlovi (Flink/Kafka Streams yoki o'z worker'laringiz)","Aniq hisob juda qimmat — taxminiy strukturalar: Count-Min Sketch (chastota) + heap (top-K), HyperLogLog (unikal sanoq)","Oyna: tumbling yoki sliding window (masalan oxirgi 5 daqiqa), kechikkan hodisalar uchun watermark","Yakuniy natija Redis'da saqlanadi va API undan o'qiydi — o'qish juda tez","Aniqlik va narx muvozanati: taxminiy natija odatda yetarli (trend ro'yxati uchun)","Nosozlik: qayta ishlov (replay) imkoniyati, idempotent yozish"],
 e:"Bu case'da intervyuchi 'aniqlikni biroz qurbon qilib, xotira va vaqtni yutish' g'oyasini bilishingizni tekshiradi. Count-Min Sketch nomini aytish kuchli signal."},
{l:"St",t:"open",tp:"Case",q:"CASE: Notification servisi (email, SMS, push) loyihalang.",
 m:["Ishlab chiqaruvchi servislar → navbat (Kafka/SQS) → notification worker → provayder (SES, Twilio, APNs/FCM)","Idempotentlik: notification_id bo'yicha dedup — bitta hodisadan ikki xabar ketmasin","Retry: provayder xatosi uchun exponential backoff + DLQ; provayder rate limitiga rioya","Foydalanuvchi sozlamalari: kanal tanlovi, unsubscribe, quiet hours, tilga moslash (template servisi)","Prioritet: OTP/xavfsizlik xabarlari alohida yuqori prioritetli navbat","Kuzatuv: yuborildi/yetkazildi/ochildi metrikalar, provayder failover"],
 e:"Bu case'da intervyuchi asinxron arxitektura, idempotentlik va provayder nosozliklarini qanday boshqarishingizni ko'radi. Shablon boshqaruvi va foydalanuvchi sozlamalari ham baholanadi.",src:"https://bytebytego.com/courses/system-design-interview/design-a-notification-system"}
];
const QJ=[
// ================= VAKANSIYA BO'YICHA (Go + Kafka + Postgres + AWS) =================
// ---------- Kafka & RabbitMQ ----------
{l:"M",t:"mcq",tp:"Kafka",q:"Kafka'da xabarlar tartibi qay darajada kafolatlanadi?",
 o:["Butun topic bo'yicha global tartib","Faqat bitta partition ichida tartib kafolatlanadi; bir xil key'li xabarlar bir partitionga tushgani uchun key bo'yicha tartib saqlanadi","Hech qanday tartib yo'q","Consumer group bo'yicha"],a:1,
 e:"Partition — parallellik va tartib birligi. Agar order_id ni key qilsangiz, o'sha buyurtmaning hamma hodisalari bitta partitionda va tartibda bo'ladi. Global tartib kerak bo'lsa — bitta partition, lekin u throughput'ni cheklaydi. Partition sonini keyin oshirish key→partition taqsimotini o'zgartiradi — tartib kafolati buziladi, shuning uchun oldindan rejalashtiriladi.",src:"https://kafka.apache.org/documentation/#intro_concepts"},
{l:"M",t:"mcq",tp:"Kafka",q:"Consumer group va partition munosabati?",
 o:["Har consumer hamma partitiondan o'qiydi","Bitta group ichida har partitionni faqat bitta consumer o'qiydi — shuning uchun parallellik partition soni bilan cheklangan (10 partition = maksimal 10 ta ishchi consumer)","Partition soni consumer sonidan kichik bo'lishi shart","Group'lar bir-birining offsetini bo'lishadi"],a:1,
 e:"Consumer qo'shsangiz ham partitiondan ko'p bo'lsa, ortiqchalari bo'sh turadi. Turli group'lar bir xil xabarlarni mustaqil o'qiydi (fan-out). Consumer qo'shilishi/chiqishi rebalance'ga olib keladi — bu paytda iste'mol to'xtaydi; uzoq ishlov (max.poll.interval.ms dan oshsa) consumer'ni group'dan chiqarib yuboradi va cheksiz rebalance sikli boshlanadi."},
{l:"S",t:"mcq",tp:"Kafka",q:"Producer'da <code>acks=1</code> va <code>acks=all</code> farqi?",
 o:["Farqi faqat tezlikda, ma'lumot yo'qolmaydi","acks=1 — faqat leader yozganini tasdiqlaydi: leader yiqilsa, replikaga yetmagan xabar yo'qoladi. acks=all + min.insync.replicas=2 — kamida ikki nusxa yozilgach tasdiq, ishonchli lekin sekinroq","acks=all xabarni ikki marta yuboradi","acks=0 eng ishonchli"],a:1,
 e:"To'lov/buyurtma hodisalari uchun: acks=all, min.insync.replicas=2, replication.factor=3, enable.idempotence=true (takror yozishni oldini oladi va retry xavfsiz bo'ladi). Analitika/telemetriya uchun acks=1 maqbul. Yana: retries + max.in.flight.requests.per.connection idempotence bilan birga tartibni saqlaydi.",src:"https://kafka.apache.org/documentation/#producerconfigs"},
{l:"S",t:"mcq",tp:"Kafka",q:"Consumer'da auto-commit yoqilgan (<code>enable.auto.commit=true</code>). Qanday xavf bor?",
 o:["Hech qanday","Offset ishlov tugashidan oldin commit bo'lishi mumkin — crash bo'lsa xabar qayta o'qilmaydi va yo'qoladi; to'g'ri yo'l: ishlov tugagach qo'lda commit qilish (at-least-once) va consumer'ni idempotent qilish","Xabarlar ikki marta commit bo'ladi","Offsetlar umuman saqlanmaydi"],a:1,
 e:"Tartib muhim: o'qish → ishlov → commit. Bu at-least-once beradi (crash bo'lsa takror), shuning uchun dedup kerak: message_id yoki biznes kaliti bo'yicha unique constraint. Teskarisi (avval commit) at-most-once — yo'qotishga yo'l qo'yadi. 'Exactly-once' faqat Kafka ichidagi tranzaksiyalarda, tashqi DB uchun idempotentlik zarur."},
{l:"S",t:"open",tp:"Kafka",q:"Consumer lag o'sib ketdi (millionlab xabar orqada). Sabablarni va yechimlarni ayting.",
 m:["O'lchash: lag qaysi partitionlarda? Hammasidami yoki bir nechtasidami (skew — issiq key)","Sabab 1: consumer sekin — tashqi API yoki DB kutish, N+1, batch'siz yozish; profil qilib tuzatish","Sabab 2: parallellik yetmaydi — partition soni cheklab qo'ygan; partition va consumer sonini oshirish","Sabab 3: rebalance sikli (uzoq ishlov, max.poll.interval.ms), yoki poyson xabar qayta-qayta retry bo'lyapti — DLQ kerak","Vaqtinchalik chora: og'ir ishni ajratib, faqat qabul qilib boshqa topicga yozish; keraksiz xabarlarni filtrlash","Oldini olish: lag bo'yicha alert (SLO), yuk testi, batch ishlov va ulanish pool'ini sozlash"],
 e:"Intervyuda kutiladi: avval o'lchash va sababni ajratish, keyin chora. 'Consumer sonini oshiraman' — partition soni yetmasa foyda bermaydi."},
{l:"S",t:"mcq",tp:"Kafka",q:"Log compaction (<code>cleanup.policy=compact</code>) nima qiladi?",
 o:["Xabarlarni siqib diskni tejaydi","Har key uchun oxirgi qiymatni saqlaydi, eskilarini o'chiradi — topic 'joriy holat jadvali' bo'lib qoladi (masalan user profili oxirgi holati)","Xabarlarni arxivga ko'chiradi","Faqat vaqt bo'yicha o'chiradi"],a:1,
 e:"Oddiy retention (delete) — vaqt yoki hajm bo'yicha o'chiradi. Compact — CDC/state uchun: yangi consumer topicni boshidan o'qib joriy holatni tiklay oladi. O'chirish uchun tombstone (key bilan null qiymat) yoziladi. Ikkalasini birga ishlatish ham mumkin (compact,delete)."},
{l:"St",t:"open",tp:"EDA",q:"Event'lar sxemasi vaqt o'tib o'zgaradi. Buni qanday boshqarasiz?",
 m:["Sxema registry (Avro/Protobuf/JSON Schema) va mosligi tekshiruvi CI'da","Backward compatible o'zgarishlar: ixtiyoriy maydon qo'shish, default bilan; maydon o'chirish/nomini o'zgartirish — buzadi","Consumer noma'lum maydonlarni e'tiborsiz qoldirsin (tolerant reader)","Buzuvchi o'zgarish kerak bo'lsa: yangi versiyali topic yoki event turi, ikkalasi parallel, migratsiya muddati bilan","Event — bu kontrakt: ichki DB modelini to'g'ridan-to'g'ri event qilib chiqarmaslik","Eventlar uzoq saqlanadi — eski versiyani o'qiy olish (upcasting) kerak"],
 e:"Staff signal: event'ni public API kabi ko'rish va compatibility'ni avtomatik tekshirish. Ko'p jamoa aynan shu yerda og'riq oladi."},
{l:"M",t:"mcq",tp:"RabbitMQ",q:"Kafka va RabbitMQ o'rtasidagi asosiy farq?",
 o:["Farqi yo'q, ikkalasi ham navbat","Kafka — saqlanadigan log: xabar o'qilgach ham qoladi, qayta o'qish (replay) va ko'p consumer group mumkin. RabbitMQ — klassik broker: xabar ack qilingach navbatdan o'chadi, kuchli routing (exchange, binding), per-message TTL va prioritet bor","RabbitMQ tezroq va replay qiladi","Kafka routing uchun mo'ljallangan"],a:1,
 e:"Tanlov: event streaming, replay, katta throughput, event sourcing → Kafka. Vazifa navbati (task queue), murakkab marshrutlash, per-message prioritet/TTL, kichik-o'rta yuk → RabbitMQ. Vakansiyada ikkalasi ham bor — farqni aniq aytish kutiladi."},
{l:"S",t:"mcq",tp:"RabbitMQ",q:"RabbitMQ'da <code>prefetch</code> (QoS) nima uchun kerak?",
 o:["Xabarlarni siqish uchun","Consumer bir vaqtda nechta ack qilinmagan xabar olishini cheklaydi — cheklanmasa bitta consumer hamma xabarni tortib olib, yukni notekis taqsimlaydi va xotirani to'ldiradi","Xabar tartibini kafolatlaydi","Navbatni o'chiradi"],a:1,
 e:"prefetch=1 — eng adolatli taqsimot (sekin ishlov uchun), lekin round-trip ko'p. Odatda 10–100 orasida sozlanadi. Bog'liq mavzular: manual ack (ishlov tugagach), nack/requeue va cheksiz retry sikli xavfi, Dead Letter Exchange (DLX) va TTL bilan kechiktirilgan retry."},
// ---------- PostgreSQL & Elasticsearch ----------
{l:"M",t:"mcq",tp:"Elasticsearch",q:"Elasticsearch'da <code>text</code> va <code>keyword</code> tiplari farqi?",
 o:["Bir xil, faqat nomi boshqa","text — analiz qilinadi (tokenlarga bo'linadi, lowercase): to'liq matnli qidiruv uchun. keyword — analiz qilinmaydi, to'liq qiymat: aniq moslik, filtr, agregatsiya va saralash uchun","keyword faqat raqamlar uchun","text saralash uchun ishlatiladi"],a:1,
 e:"Tipik dizayn: bitta maydonni ikkala tipda saqlash (title va title.keyword — multi-field). Xato mapping keyin tuzatilmaydi — reindex kerak, shuning uchun index shablonini oldindan aniq yozish muhim. Agregatsiya va saralashni text maydonda qilish xato beradi (fielddata)."},
{l:"M",t:"mcq",tp:"Elasticsearch",q:"Mahsulot katalogi PostgreSQL'da, qidiruv Elasticsearch'da. To'g'ri arxitektura?",
 o:["Ma'lumotni faqat Elasticsearch'da saqlash","PostgreSQL — source of truth; ES — hosila (derived) index: o'zgarishlar outbox/CDC (Debezium) yoki event orqali ES'ga sinxronlanadi, ES'ni istalgan paytda qayta qurish mumkin","ES'dan Postgres'ga yozish","Ikkalasiga ilovadan parallel yozish, sinxronizatsiyasiz"],a:1,
 e:"ES — qidiruv indeksi, tranzaksion DB emas (yaqin real vaqt, tranzaksiya yo'q). Ikkalasiga mustaqil yozish — dual write muammosi: biri yiqilsa ma'lumot farq qiladi. Reindex pipeline'i har doim tayyor turishi kerak: mapping o'zgarsa yoki ES buzilsa, Postgres'dan to'liq qayta qurish."},
{l:"S",t:"mcq",tp:"Elasticsearch",q:"Hujjat indekslangach darhol qidiruvda topilmadi. Sabab?",
 o:["Xato bo'lgan","ES — near real-time: hujjat refresh (default 1s) dan keyin qidiruvda ko'rinadi. Katta bulk yuklashda refresh_interval'ni vaqtincha oshirish/o'chirish tezlikni oshiradi","Indeks buzilgan","Faqat qayta ishga tushirgandan keyin ko'rinadi"],a:1,
 e:"Kerak bo'lsa ?refresh=wait_for (so'rov refresh'gacha kutadi) — lekin har yozishda refresh=true qilish juda qimmat. Bulk indekslash maslahatlari: bulk API, refresh_interval=-1, replica=0, tugagach qaytarish."},
{l:"S",t:"mcq",tp:"Elasticsearch",q:"Chuqur pagination (<code>from=100000&size=10</code>) nega yomon va o'rniga nima ishlatiladi?",
 o:["Yomon emas","Har shard from+size hujjatni yig'ib koordinatorga yuboradi — xotira va CPU portlaydi (default limit 10 000). O'rniga: search_after + Point In Time (PIT), yoki eksport uchun scroll/slice","size ni oshirish kerak","Faqat replica qo'shish kerak"],a:1,
 e:"Bu Postgres'dagi OFFSET muammosining aynan o'zi — yechim ham o'xshash: keyset (search_after) pagination, barqaror tartib uchun tie-breaker (_shard_doc yoki unikal id). Cheksiz scroll UI uchun search_after tabiiy mos."},
{l:"S",t:"open",tp:"Elasticsearch",q:"Qidiruv natijalari sifatini qanday yaxshilaysiz?",
 m:["query (ball beradi, relevance) va filter (ball bermaydi, keshlanadi) kontekstini ajratish — kategoriya/narx filtrlari filterda","Analyzer sozlash: til uchun stemming, synonym, edge n-gram (autocomplete), xato yozuvga fuzziness","Maydonlarga og'irlik (title^3, description^1), BM25 parametrlari, function_score bilan biznes signali (mashhurlik, mavjudlik)","O'lchash: click-through, zero-result so'rovlar ro'yxati, A/B test","Sekin so'rovlarni profil qilish (profile API), shard soni va mapping'ni qayta ko'rib chiqish"],
 e:"Senior signal: relevance'ni his-tuyg'u bilan emas, o'lchov bilan sozlash va filter/query farqini bilish (kesh va tezlik uchun muhim)."},
{l:"M",t:"mcq",tp:"Go+DB",q:"Go'da <code>database/sql</code> yoki <code>pgx</code> pool'ini sozlashda eng muhim parametr?",
 o:["Hech qanday sozlash kerak emas","SetMaxOpenConns — cheklanmasa yuk paytida Postgres max_connections tugaydi; shuningdek SetMaxIdleConns va SetConnMaxLifetime (uzoq yashagan ulanishlarni almashtirish uchun)","Faqat SetMaxIdleConns","Driver o'zi optimal sozlaydi"],a:1,
 e:"Default MaxOpenConns — cheksiz: 50 pod × cheksiz = DB yiqiladi. Hisob: hamma instance × pool ≤ max_connections minus zaxira. MaxIdleConns MaxOpenConns'dan kichik bo'lsa, ulanishlar doim yopilib-ochiladi (TLS handshake narxi). ConnMaxLifetime — LB va failover'dan keyin eski ulanishlarni tozalaydi.",src:"https://pkg.go.dev/database/sql#DB.SetMaxOpenConns"},
{l:"M",t:"mcq",tp:"Go+DB",q:"Go'da <code>rows, err := db.QueryContext(...)</code> dan keyin eng ko'p uchraydigan xato?",
 o:["err ni tekshirmaslik","defer rows.Close() ni unutish — ulanish pool'ga qaytmaydi va pool tugaydi; shuningdek sikl tugagach rows.Err() ni tekshirmaslik (yarim o'qilgan natija xatosi yashirin qoladi)","Context uzatish","QueryRow ishlatish"],a:1,
 e:"rows.Close() bitta qator qolib ketganda ham zarur (return yoki break bilan chiqilsa). QueryRow'da Close kerak emas — Scan o'zi yopadi. Context bekor bo'lsa so'rov ham bekor qilinadi (Postgres'ga cancel yuboriladi) — HTTP handler context'ini DB chaqiruviga uzating."},
{l:"S",t:"mcq",tp:"Go+DB",q:"PgBouncer transaction mode ortida Go ilovasi 'prepared statement does not exist' xatosi beryapti. Sabab?",
 o:["Driver eskirgan","Transaction mode'da har tranzaksiya boshqa serverdagi ulanishga tushishi mumkin — session'ga bog'langan prepared statement'lar yo'qoladi. Yechim: prepared statement keshini o'chirish (pgx'da QueryExecModeSimpleProtocol/exec) yoki PgBouncer 1.21+ dagi protokol darajasidagi qo'llab-quvvatlashdan foydalanish","Postgres versiyasi eski","Pool hajmi katta"],a:1,
 e:"Transaction mode'da yo'qoladigan boshqa narsalar: SET, LISTEN/NOTIFY, temp jadvallar, session-level advisory lock. Shuning uchun advisory lock kerak bo'lsa transaction-level (pg_advisory_xact_lock) variantini ishlating."},
// ---------- AWS ----------
{l:"M",t:"mcq",tp:"AWS",q:"Foydalanuvchi katta fayl (video) yuklashi kerak. To'g'ri yondashuv?",
 o:["Fayl backend orqali o'tib S3'ga yoziladi","Backend pre-signed URL beradi, client to'g'ridan-to'g'ri S3'ga yuklaydi (katta fayl uchun multipart), yuklangach backend'ga xabar qilinadi yoki S3 event ishga tushadi","Faylni DB'da saqlash","EC2 diskida saqlash"],a:1,
 e:"Backend orqali o'tkazish — trafik narxi, xotira va timeout muammosi. Pre-signed URL qisqa muddatli va cheklangan (metod, kalit, hajm shart bilan). Yuklangandan keyingi ishlov (thumbnail, virus scan) — S3 event → SQS/Lambda orqali asinxron.",src:"https://docs.aws.amazon.com/AmazonS3/latest/userguide/PresignedUrlUploadObject.html"},
{l:"M",t:"mcq",tp:"AWS",q:"SQS standard va FIFO navbat farqi?",
 o:["FIFO tezroq","Standard — juda katta throughput, kamida bir marta yetkazish va tartib kafolatlanmagan. FIFO — guruh (MessageGroupId) ichida tartib va takrorlanmaslik (deduplication), lekin throughput cheklangan","Standard tartibni kafolatlaydi","FIFO'da dedup yo'q"],a:1,
 e:"Ko'p holatda standard + idempotent consumer yetarli va arzonroq. Visibility timeout — xabar olingach boshqalarga ko'rinmaydigan vaqt: ishlov shu vaqtdan uzoq bo'lsa, xabar ikkinchi marta ishlanadi (shuning uchun timeoutni ishlov vaqtiga moslash yoki heartbeat bilan uzaytirish). Zaharli xabarlar uchun redrive policy → DLQ."},
{l:"S",t:"mcq",tp:"AWS",q:"EKS'dagi Go servisi S3'ga kirishi kerak. Eng xavfsiz usul?",
 o:["Access key va secret'ni env'ga yozish","IAM role: EKS uchun IRSA (service account'ga bog'langan rol) yoki EC2 instance profile — vaqtinchalik, avtomatik rotatsiyalanadigan credential; uzoq yashaydigan kalit yo'q","Kalitlarni ConfigMap'da saqlash","Root akkaunt kalitini ishlatish"],a:1,
 e:"Uzoq muddatli access key — sizib chiqish xavfi va rotatsiya og'rig'i. IRSA'da SDK avtomatik STS orqali token oladi. Qo'shimcha: eng kam huquq (faqat kerakli bucket va prefiks), bucket policy, shifrlash (SSE-KMS), CloudTrail audit.",src:"https://docs.aws.amazon.com/eks/latest/userguide/iam-roles-for-service-accounts.html"},
{l:"S",t:"mcq",tp:"AWS",q:"RDS'da Multi-AZ va read replica farqi?",
 o:["Bir xil narsa","Multi-AZ — standby nusxa, yozish/o'qish uchun ishlatilmaydi, faqat avtomatik failover (yuqori mavjudlik). Read replica — o'qish yukini taqsimlash uchun, asinxron (lag bor), avtomatik failover emas","Read replica yozishni ham qabul qiladi","Multi-AZ o'qishni tezlashtiradi"],a:1,
 e:"Ikkalasi turli muammoni yechadi: Multi-AZ — mavjudlik, read replica — masshtab. Replicadan o'qishda lag va read-your-writes muammosini hisobga olish kerak (kritik o'qishlar primary'dan). Aurora'da arxitektura boshqacha: umumiy storage, replicalar tez failover qila oladi."},
{l:"St",t:"open",tp:"AWS",q:"Go mikroservisini AWS'da ishga tushirish: ECS, EKS yoki Lambda? Qanday tanlaysiz?",
 m:["Lambda: hodisaga asoslangan, notekis yuk, operatsiya minimal; kamchilik — cold start, 15 daqiqa limit, uzoq ulanishlar (DB pool) muammosi (RDS Proxy kerak)","ECS Fargate: doimiy servis, serversiz konteyner, Kubernetes murakkabligisiz — ko'p jamoa uchun oltin o'rtalik","EKS: ko'p servis, murakkab tarmoq/mesh, ko'p jamoa va allaqachon Kubernetes ekspertizasi bo'lsa","Mezonlar: yuk profili, jamoa tajribasi, narx, migratsiya qilish osonligi, compliance","Go afzalligi: kichik image va tez start — har uchala variantda ham yaxshi ishlaydi"],
 e:"Staff signal: 'Kubernetes default emas' — operatsion narxni jamoa hajmi bilan solishtirish va qaytib chiqish (exit) narxini aytish."},
// ---------- TDD / BDD / DDD ----------
{l:"J",t:"mcq",tp:"TDD",q:"TDD sikli qanday?",
 o:["Kod yoz → test yoz → refactor","Red (yiqiladigan test yoz) → Green (o'tkazadigan eng sodda kodni yoz) → Refactor (testlar yashil turganda tozala)","Test yoz → deploy → tuzat","Faqat integratsiya testlari yozish"],a:1,
 e:"Maqsad — test yozish emas, dizaynni tashqaridan boshlash va har qadamda ishlaydigan kodga ega bo'lish. Qadamlar kichik bo'lishi shart. Test avval yozilganda kod tabiiy ravishda mock qilinadigan chegaralarga (interfeys) ega bo'ladi. Go'da: jadvalli testlar (table-driven), t.Run bilan subtest, testify ixtiyoriy."},
{l:"M",t:"mcq",tp:"TDD",q:"Nimani mock qilish kerak?",
 o:["Hamma narsani — har bog'liqlikni","Tashqi chegaralarni: tarmoq chaqiruvlari, to'lov provayderi, soat/tasodif. DB va navbat uchun ko'pincha real instance (testcontainers) yaxshiroq. O'z domain kodingizni mock qilish — testni implementatsiyaga bog'lab qo'yadi","Faqat DB ni","Hech narsani, doim real tizim"],a:1,
 e:"Ortiqcha mock alomati: refactor qilganda mantiq o'zgarmasa ham o'nlab test yiqiladi — testlar xulqni emas, ichki tuzilmani tekshiryapti. Amaliyot: domain sof funksiyalarda (mock kerak emas), adapterlar uchun kontrakt testlari, kritik oqim uchun testcontainers bilan integratsiya testi."},
{l:"M",t:"open",tp:"BDD",q:"BDD nima va TDD dan farqi nimada?",
 m:["BDD — xulqni biznes tilida tasvirlash: Given (boshlang'ich holat) / When (harakat) / Then (kutilgan natija)","Asosiy qiymat — hujjat va umumiy til: PO, QA va dasturchi bir xil ssenariyni o'qiydi","TDD — dasturchi uchun dizayn texnikasi (unit daraja); BDD — xulq va qabul mezoni (feature daraja)","Ssenariylar birgalikda yoziladi (three amigos), keyin avtomatlashtiriladi (Cucumber, Go'da godog)","Xavf: Gherkin'ni texnik qadamlar bilan to'ldirib yuborish — u biznes tilida qolishi kerak"],
 e:"Vakansiyada TDD/BDD/DDD birga turibdi — javobda uchalasi bir-birini qanday to'ldirishini ayting: DDD — til va model, BDD — xulq mezoni, TDD — implementatsiya ritmi."},
{l:"S",t:"mcq",tp:"DDD",q:"DDD'da aggregate uchun asosiy qoida?",
 o:["Har jadval — alohida aggregate","Aggregate — konsistentlik chegarasi: invariantlar uning ichida saqlanadi, tashqaridan faqat root orqali kirasiz, boshqa aggregate'ga faqat ID bilan ishora qilinadi va bitta tranzaksiyada bitta aggregate o'zgartiriladi","Aggregate'lar bir-birini to'g'ridan-to'g'ri o'zgartiradi","Aggregate — bu DTO"],a:1,
 e:"Bitta tranzaksiyada bitta aggregate qoidasi lock contention va masshtabni hal qiladi; aggregate'lar orasidagi konsistentlik — domain event orqali eventual. Order aggregate ichida OrderLine'lar bo'ladi, lekin Customer — ID bilan. Aggregate kattalashsa — tranzaksiya og'irlashadi; kichik bo'lsa — invariantni saqlash qiyin.",src:"https://martinfowler.com/bliki/DDD_Aggregate.html"},
{l:"S",t:"open",tp:"DDD",q:"Go loyihasini DDD/hexagonal (ports & adapters) uslubida qanday tashkil qilasiz?",
 m:["domain: entity, value object, domain servis, domain event — tashqi kutubxonalarsiz (sql, http, kafka importi yo'q)","application (use case): tranzaksiya chegarasi, repository interfeyslari shu yerda e'lon qilinadi (port)","adapters/infrastructure: postgres repository, kafka producer/consumer, http handler (driven va driving adapterlar)","Bog'liqlik yo'nalishi faqat ichkariga: domain hech kimni bilmaydi; wire/konstruktorda ulanadi","Go amaliyoti: interfeys iste'molchi paketda, kichik interfeyslar; /internal ostida bounded context bo'yicha papkalar (order/, billing/)","Test: domain — sof unit test, adapter — testcontainers bilan integratsiya"],
 e:"Vakansiyada DDD alohida ko'rsatilgan — bu javob to'g'ridan-to'g'ri baholanadi. Kuchli signal: 'papka nomi emas, bog'liqlik yo'nalishi muhim' va ubiquitous language (kod nomlari biznes atamalari bilan bir xil)."},
// ---------- E-commerce & subscription ----------
{l:"M",t:"open",tp:"Domain",q:"Obuna (subscription) billing tizimini modellashtiring: nimalarni hisobga olasiz?",
 m:["Model: Plan (narx, davr), Subscription (holat: trialing/active/past_due/canceled), Invoice, Payment, PaymentAttempt","Davriy hisob-kitob: keyingi billing sanasi, vaqt zonasi va oy oxiri holatlari (31-yanvar → fevral)","Plan o'zgarishi: proration (qolgan davr uchun qayta hisob), upgrade darhol / downgrade davr oxirida","Muvaffaqiyatsiz to'lov: dunning — retry jadvali, grace period, keyin to'xtatish; hodisalar bo'yicha email","Idempotentlik: har invoice/charge uchun idempotency key — takroriy yechishning oldini olish","Pul: butun son (tiyin/cent), valyuta bilan birga; hech qachon float; soliq va chegirmalar alohida qatlam","Audit: har holat o'zgarishi hodisa sifatida saqlanadi (moliyaviy tekshiruv uchun)"],
 e:"Vakansiyada 'subscription-based business' yozilgan — bu savol katta ehtimol bilan beriladi. Eng kuchli signal: pulni integer saqlash, idempotentlik va past_due oqimini aytish."},
{l:"S",t:"mcq",tp:"Domain",q:"Cheklangan qoldiqli mahsulotni sotishda oversell'ning oldini olish uchun eng to'g'ri yondashuv?",
 o:["Faqat kesh'dagi qoldiqqa ishonish","Qoldiqni DB'da atomik kamaytirish (UPDATE ... SET qty = qty - 1 WHERE id=? AND qty >= 1) va yangilangan qatorlar sonini tekshirish; savatga qo'yishda vaqtinchalik reservation (TTL bilan)","Yozishdan oldin SELECT qilib tekshirish yetarli","Har buyurtmani qo'lda tasdiqlash"],a:1,
 e:"SELECT-keyin-UPDATE — race condition. Kesh faqat ko'rsatish uchun; haqiqat DB'da. Reservation muddati tugasa avtomatik bo'shaydi (job yoki TTL). Yuqori yuk (flash sale) uchun: navbat orqali seriyalashtirish yoki Redis'da atomik dekrement + keyin DB bilan yarashtirish (reconciliation)."},
{l:"S",t:"mcq",tp:"Domain",q:"Pul miqdorini kodda va DB'da qanday saqlash kerak?",
 o:["float64 / double","Eng kichik birlikda butun son (masalan cent/tiyin) yoki DECIMAL/NUMERIC; valyuta kodi bilan birga; yaxlitlash qoidasi aniq belgilangan bo'lishi kerak","string sifatida","Har ikkalasi ham farq qilmaydi"],a:1,
 e:"float ikkilik kasr — 0.1 + 0.2 ≠ 0.3; moliyada bu xato jamlanadi va hisobot mos kelmaydi. Go'da: int64 (minor units) yoki shopspring/decimal. Postgres'da NUMERIC (float emas). Valyutani miqdordan ajratmaslik: Money{Amount int64, Currency string} — turli valyutani qo'shib yuborish xatosini kompilyatsiya/tip darajasida oldini oladi."},
// ---------- Jamoa, code review, ingliz tili ----------
{l:"J",t:"open",tp:"Behavioral",q:"'Tell me about yourself' — bu rol uchun javobni qanday tuzasiz (ingliz tilida)?",
 m:["2 daqiqa, uch qism: hozirgi rol va mas'uliyat → eng mos 1–2 yutuq (raqam bilan) → nega aynan shu vakansiya","Vakansiya tiliga moslash: Go, microservices, Kafka, PostgreSQL, AWS, event-driven","Yutuqni STAR bilan qisqa: Situation, Task, Action, Result (masalan 'p99 latency 800ms dan 120ms ga tushdi')","Butun karyerani boshidan sanamaslik; oxirgi 3–5 yilga fokus","Ingliz tilida oldindan ovoz chiqarib mashq qilish — bu yerda C1 talabi bor"],
 e:"Bu savol deyarli har intervyuda birinchi bo'ladi va ingliz tili darajangiz shu yerda baholanadi. Yodlab olingan matn emas, tayyorlangan struktura kerak."},
{l:"M",t:"open",tp:"Behavioral",q:"Junior muhandisga mentorlik va code review'ni qanday qilasiz?",
 m:["Review'da muammoni odamdan ajratish: 'bu funksiya...' deyish, 'sen...' emas","Kommentlarni darajalash: bloklovchi (bug, xavfsizlik) va ixtiyoriy (nit) — aniq belgilab qo'yish","Sabab tushuntirish va havola berish — shunda review o'rgatadi, faqat tuzatmaydi","Katta o'zgarishni oldin dizayn bo'yicha kelishish — 300 qatordan keyin arxitektura bahsi kech","Mentorlik: juftlikda ishlash, o'sib boruvchi murakkablikdagi vazifalar, muntazam 1:1 va aniq fikr-mulohaza","O'lchov: junior mustaqil yetkazadigan ish hajmi va review'dagi takroriy xatolar kamayishi"],
 e:"Vakansiyada 'mentorship' va 'code review' aniq yozilgan. Kuchli javob — konkret amaliyot va misol, umumiy gap emas."},
{l:"S",t:"open",tp:"Behavioral",q:"Product Owner muddati siqilgan feature so'rayapti, sizning texnik baholashingiz boshqacha. Qanday gaplashasiz?",
 m:["Avval maqsadni tushunish: nega shu sana, qanday biznes natija kutilyapti","Variantlarni narx bilan taqdim etish: to'liq yechim (X hafta), qisqartirilgan qamrov (Y hafta), vaqtinchalik yechim + texnik qarz (Z, keyin to'lash rejasi bilan)","Xavflarni aniq aytish: nima buziladi, qanday ehtimol, qanday yumshatish (feature flag, canary)","Qarorni PO qabul qiladi — lekin yozma qayd etiladi (ADR yoki ticket kommenti)","Kelishilgan qarzni backlog'ga aniq vazifa sifatida qo'yish va muddatini belgilash"],
 e:"Baholanadigan narsa — 'yo'q' deyish emas, tanlovni ko'rsatish. Ingliz tilida bu suhbatni mashq qiling: 'Here are three options with trade-offs...' — customer-facing kommunikatsiya talabi shu yerda tekshiriladi."},
// ---------- RabbitMQ (chuqurroq) ----------
{l:"J",t:"mcq",tp:"RabbitMQ",q:"RabbitMQ'da xabar qayerga yuboriladi?",
 o:["To'g'ridan-to'g'ri navbatga","Producer xabarni exchange'ga yuboradi; exchange binding qoidalari bo'yicha uni bir yoki bir nechta navbatga yo'naltiradi; consumer navbatdan o'qiydi","Consumer'ga to'g'ridan-to'g'ri","Broker o'zi tasodifiy tanlaydi"],a:1,
 e:"Exchange turlari: direct (routing key aynan mos kelsa), topic (order.*.created kabi shablon), fanout (hamma bog'langan navbatga nusxa), headers (header qiymatlari bo'yicha). Bu Kafka'dan asosiy farq: marshrutlash mantig'i brokerda, consumer'da emas. Hech qaysi navbatga tushmagan xabar yo'qoladi — agar alternate exchange yoki mandatory bayrog'i qo'yilmagan bo'lsa."},
{l:"M",t:"mcq",tp:"RabbitMQ",q:"Consumer xabarni oldi va ishlov paytida crash bo'ldi. Xabar nima bo'ladi?",
 o:["Yo'qoladi","Agar manual ack ishlatilsa (autoAck=false) va ack yuborilmagan bo'lsa — ulanish uzilganda xabar navbatga qaytadi (requeue) va boshqa consumer'ga beriladi. autoAck=true bo'lsa yetkazilishi bilan o'chgan bo'ladi — yo'qoladi","Broker uni o'chiradi","Producer'ga qaytadi"],a:1,
 e:"Qoida: ishlov tugagach ack. Lekin cheksiz sikl xavfi bor — xato xabar qayta-qayta requeue bo'lib aylanaveradi. Shuning uchun basic.nack(requeue=false) bilan Dead Letter Exchange'ga yuborish va urinishlar sonini header'da sanash kerak."},
{l:"M",t:"mcq",tp:"RabbitMQ",q:"Broker qayta ishga tushganda xabarlar saqlanib qolishi uchun nima kerak?",
 o:["Hech narsa, hammasi avtomatik saqlanadi","Uch shart birga: navbat durable, xabar persistent (delivery_mode=2) va ideal holda publisher confirms yoqilgan — aks holda xabar faqat xotirada bo'ladi","Faqat navbatni durable qilish yetarli","Faqat xabarni persistent qilish yetarli"],a:1,
 e:"Publisher confirms — broker xabarni qabul qilganini tasdiqlaydi; tasdiqsiz 'yubordim' degan ishonch yolg'on bo'lishi mumkin. Eslatma: persistent xabar ham diskka yozilgunga qadar qisqa oyna bor — mutlaq kafolat uchun quorum queue va confirms birga ishlatiladi. Persistence tezlikni pasaytiradi — ongli tanlov."},
{l:"S",t:"mcq",tp:"RabbitMQ",q:"Dead Letter Exchange (DLX) qachon ishga tushadi?",
 o:["Faqat broker yiqilganda","Xabar rad etilganda (nack/reject, requeue=false), TTL tugaganda yoki navbat uzunligi limitidan oshganda — xabar DLX orqali boshqa navbatga o'tadi","Har xabar uchun","Consumer sekin bo'lganda"],a:1,
 e:"DLX ikki ishda qo'llaniladi: 1) zaharli xabarlarni tekshirish uchun ajratish; 2) kechiktirilgan retry: xabarni TTL li 'retry' navbatga yuborib, TTL tugagach DLX orqali asosiy navbatga qaytarish (exponential backoff uchun bir nechta TTL navbati). Kuzatuv: DLQ o'lchami bo'yicha alert qo'yish shart."},
{l:"S",t:"mcq",tp:"RabbitMQ",q:"Klassik mirrored queue o'rniga hozir nima tavsiya etiladi?",
 o:["Hech narsa, mirrored queue standart","Quorum queue — Raft konsensusiga asoslangan, ko'pchilik tasdig'i bilan ishonchli replikatsiya; klassik mirrored queue eskirgan va RabbitMQ 4.0 da olib tashlangan","Faqat bitta node ishlatish","Stream queue faqat"],a:1,
 e:"Quorum queue: yuqori ishonchlilik, xabarni yo'qotmaslikka urg'u; narxi — ko'proq disk/xotira va biroz sekinroq. Stream — Kafka'ga o'xshash append-only log (replay va ko'p consumer uchun). Tanlov: vazifa navbati → quorum queue; hodisalar oqimi va qayta o'qish → stream yoki Kafka.",src:"https://www.rabbitmq.com/docs/quorum-queues"},
{l:"S",t:"open",tp:"RabbitMQ",q:"RabbitMQ'da navbat uzunligi doim o'sib boryapti. Nima qilasiz?",
 m:["O'lchash: qaysi navbat, publish va deliver tezligi (rate), unacked xabarlar soni","Consumer sekinmi (tashqi API, DB) yoki consumer soni kammi — prefetch va parallel consumer sonini sozlash","Xabarlar qayta-qayta requeue bo'lyaptimi (xato xabar sikli) — DLX va urinish limiti","Backpressure: max-length yoki max-length-bytes bilan navbatni cheklash — to'lganda eski xabar DLX'ga ketadi yoki publish rad etiladi","Broker tomoni: flow control (memory/disk alarm) yoqilganmi — publisher'lar sekinlashtirilgan bo'lishi mumkin","Arxitektura: og'ir ishni bo'lish, batch qilish, kerak bo'lsa Kafka'ga o'tish (juda katta oqim uchun)"],
 e:"Muhim tushuncha: RabbitMQ navbati uzoq saqlash uchun emas — u yetkazib berish uchun. Uzun navbat xotirani yeydi va butun brokerni sekinlashtiradi; shuning uchun cheklov va alert kerak."},
{l:"S",t:"mcq",tp:"RabbitMQ",q:"Bir nechta consumer bo'lsa, xabarlar tartibi kafolatlanadimi?",
 o:["Ha, doim","Bitta navbat va bitta consumer bo'lsa tartib saqlanadi; bir nechta consumer parallel ishlaganda tartib buziladi (requeue ham tartibni buzadi). Tartib kerak bo'lsa: kalit bo'yicha alohida navbat (consistent hash exchange) yoki bitta consumer","Faqat quorum queue'da","Xabar tartibi hech qachon saqlanmaydi"],a:1,
 e:"Bu Kafka bilan taqqoslash uchun muhim: Kafka'da tartib partition ichida kafolatlanadi va parallellik partition bo'yicha bo'ladi; RabbitMQ'da parallellik consumer bo'yicha — tartibni o'zingiz loyihalashingiz kerak. Ko'pincha to'g'ri yechim: tartibga tayanmaydigan, idempotent ishlov."},
// ---------- Redis ----------
{l:"J",t:"mcq",tp:"Redis",q:"Redis buyruqlari qanday bajariladi?",
 o:["Har ulanish uchun alohida thread, parallel","Buyruqlar bitta thread'da ketma-ket bajariladi — shuning uchun har buyruq atomik; tarmoq I/O uchun qo'shimcha threadlar bo'lishi mumkin (io-threads), lekin buyruq bajarilishi baribir bitta","Buyruqlar random tartibda","Har buyruq alohida jarayonda"],a:1,
 e:"Amaliy natijalar: INCR, SETNX, LPUSH kabi buyruqlarga lock kerak emas — ular allaqachon atomik. Lekin bitta sekin buyruq (KEYS *, katta ZRANGE, O(n) buyruq) butun serverni bloklaydi — barcha clientlar kutadi. Shuning uchun Redis'da 'sekin buyruq' = 'incident'. SLOWLOG bilan kuzatiladi.",src:"https://redis.io/docs/latest/develop/reference/eviction/"},
{l:"J",t:"mcq",tp:"Redis",q:"Reyting jadvali (leaderboard: ball bo'yicha top 10 va foydalanuvchi o'rni) uchun qaysi struktura?",
 o:["List","Sorted set (ZSET): ZADD bilan ball, ZREVRANGE bilan top N, ZREVRANK bilan o'rin — O(log n)","Hash","String"],a:1,
 e:"ZSET — skiplist + hash: tartib va tezkor kirish. Boshqa moslamalar: String — kesh/hisoblagich; Hash — obyekt maydonlari; Set — unikal to'plam va SINTER; List — oddiy navbat/stack; Stream — hodisalar loglari va consumer group; HyperLogLog — taxminiy unikal sanoq (kam xotira); Bitmap — kunlik faollik."},
{l:"M",t:"mcq",tp:"Redis",q:"Distributed lock uchun to'g'ri buyruq va bo'shatish usuli?",
 o:["SET key 1, keyin DEL key","SET key <tasodifiy_token> NX PX 30000 — atomik olish va muddat; bo'shatishda Lua skript bilan 'token mos kelsa DEL' qilish","SETNX, keyin alohida EXPIRE","GETSET bilan"],a:1,
 e:"Ikki nozik nuqta: 1) SETNX + EXPIRE alohida bo'lsa, orasida crash bo'lganda lock abadiy qoladi — shuning uchun bitta SET ... NX PX; 2) Oddiy DEL boshqa egasining lockini o'chirishi mumkin (sizning ishingiz TTL dan uzoq davom etsa) — shuning uchun token tekshiruvi Lua'da atomik qilinadi. Ish TTL dan uzoq cho'zilsa lock uzaytiriladi (watchdog).",src:"https://redis.io/docs/latest/develop/clients/patterns/distributed-locks/"},
{l:"S",t:"open",tp:"Redis",q:"Redlock (bir necha Redis node'da lock) ishonchlimi? Qanday yondashasiz?",
 m:["Redlock N node'ning ko'pchiligidan lock olishga asoslangan","Tanqid (Martin Kleppmann): soat siljishi, GC pauzasi va tarmoq kechikishi TTL tugagach ham client o'zini egaman deb o'ylashiga olib keladi — o'zaro istisno kafolatlanmaydi","Himoya: fencing token — har lockda o'suvchi raqam, resurs (DB) eski tokenli yozuvni rad etadi","Amaliy qoida: lock 'optimizatsiya' uchun bo'lsa (ikki marta ishlamaslik) — Redis lock yetarli; 'to'g'rilik' uchun bo'lsa (pul, unikal yozuv) — DB constraint/tranzaksiya yoki konsensus tizimi (etcd, ZooKeeper)","Ko'p holatda idempotentlik lockdan yaxshiroq yechim"],
 e:"Bu savol senior darajani ajratadi: 'Redlock ishlatamiz' emas, 'lock nima uchun kerak — tezlik uchunmi yoki to'g'rilik uchunmi' degan savoldan boshlash.",src:"https://martin.kleppmann.com/2016/02/08/how-to-do-distributed-locking.html"},
{l:"M",t:"mcq",tp:"Redis",q:"<code>maxmemory</code> ga yetganda nima bo'ladi?",
 o:["Redis eski kalitlarni doim o'zi o'chiradi","maxmemory-policy ga bog'liq: default noeviction — yozish buyruqlari OOM xatosi qaytaradi; allkeys-lru / allkeys-lfu — har qanday kalitni siqib chiqaradi; volatile-* — faqat TTL qo'yilgan kalitlarni","Redis qayta ishga tushadi","Ma'lumot diskka ko'chadi"],a:1,
 e:"Kesh sifatida ishlatsangiz: allkeys-lru yoki allkeys-lfu (takroriy murojaat ko'p bo'lsa LFU yaxshiroq). Navbat/lock/session saqlasangiz noeviction xavfsizroq — lekin unda xotira monitoringi va alert majburiy. LRU/LFU Redis'da taxminiy (sampling bilan) — aniq emas, bu ataylab qilingan.",src:"https://redis.io/docs/latest/develop/reference/eviction/"},
{l:"M",t:"mcq",tp:"Redis",q:"TTL tugagan kalit xotiradan qachon o'chadi?",
 o:["Aniq shu soniyada","Ikki mexanizm: lazy — kalitga murojaat qilinganda tekshiriladi; active — fon rejimida tasodifiy namuna olib o'chiriladi. Shuning uchun muddati o'tgan kalit biroz vaqt xotirada turishi mumkin","Faqat restartda","O'chmaydi, faqat ko'rinmaydi"],a:1,
 e:"Amaliy natija: 'TTL qo'ydim, demak xotira darhol bo'shaydi' degan hisob noto'g'ri — ayniqsa ko'p kalit bir vaqtda tugasa. Bir vaqtda ommaviy tugash yukni ham oshiradi, shuning uchun TTL'ga tasodifiy jitter qo'shiladi. Replicada kalitni faqat primary o'chiradi (DEL replikatsiya qilinadi)."},
{l:"M",t:"code",tp:"Redis",q:"Production'da bu buyruq nima uchun xavfli va o'rniga nima ishlatiladi?",c:"KEYS session:*",
 o:["Xavfli emas","KEYS butun keyspace'ni skanerlaydi va bitta threadli serverni millionlab kalitda bloklaydi — hamma so'rovlar kutadi. O'rniga SCAN (kursorli, bosqichma-bosqich) ishlatiladi","Faqat sekin, lekin xavfsiz","O'rniga FLUSHALL"],a:1,
 e:"Xuddi shunday xavfli buyruqlar: FLUSHALL, katta kalitda DEL (o'rniga UNLINK — asinxron), katta HGETALL/SMEMBERS/ZRANGE 0 -1. Redis'da 'big key' va 'hot key' — ikki klassik muammo: birinchisi bloklaydi, ikkinchisi bitta shardni qizdiradi. Kalitlarni ro'yxatlash kerak bo'lsa — alohida index (SET) yuriting."},
{l:"M",t:"mcq",tp:"Redis",q:"Pipeline, MULTI/EXEC va Lua skript farqi?",
 o:["Uchalasi bir xil","Pipeline — bir nechta buyruqni bitta round-tripda yuborish (atomiklik bermaydi). MULTI/EXEC — buyruqlar navbati ketma-ket va uzilmasdan bajariladi, lekin oraliq natijaga qarab qaror qilib bo'lmaydi. Lua (EVAL) — server tomonida mantiq: o'qib, tekshirib, yozish atomik","MULTI rollback qiladi","Lua sekinroq va atomik emas"],a:1,
 e:"MULTI/EXEC'da rollback yo'q: buyruq ishlash vaqtida xato bersa, qolganlari baribir bajariladi. Shartli mantiq kerak bo'lsa (lockni tokenga qarab o'chirish, rate limit hisoblash) — Lua. Lua skript ham bitta threadda ishlaydi, shuning uchun qisqa bo'lishi shart — uzun skript butun serverni bloklaydi. WATCH — optimistik variant."},
{l:"S",t:"mcq",tp:"Redis",q:"RDB va AOF persistence farqi?",
 o:["Bir xil, faqat fayl formati boshqa","RDB — davriy snapshot: kichik fayl, tez tiklanish, lekin oxirgi snapshotdan keyingi yozuvlar yo'qoladi. AOF — har yozish buyrug'i logga yoziladi (appendfsync everysec bo'lsa ≤1 soniya yo'qotish), fayl kattaroq va tiklanish sekinroq; AOF rewrite uni ixchamlashtiradi","AOF ma'lumot yo'qotmaydi va tezroq","RDB har buyruqni yozadi"],a:1,
 e:"Ko'pincha ikkalasi birga yoqiladi (Redis 7'da multi-part AOF + RDB preamble). Muhim tushuncha: Redis — birinchi navbatda xotiradagi tizim; appendfsync always bo'lsa ham disk kafolati klassik DB darajasida emas. Kritik ma'lumotni Redis'da yagona nusxada saqlamaslik kerak.",src:"https://redis.io/docs/latest/operate/oss_and_stack/management/persistence/"},
{l:"S",t:"mcq",tp:"Redis",q:"Redis replikatsiyasi va failover haqida qaysi to'g'ri?",
 o:["Replikatsiya sinxron, ma'lumot yo'qolmaydi","Replikatsiya asinxron: primary yiqilsa, replicaga yetmagan yozuvlar yo'qoladi. Sentinel (yoki Cluster) avtomatik failover qiladi; WAIT buyrug'i bilan N replica tasdig'ini kutish mumkin, lekin bu ham to'liq kafolat emas","Replica ham yozishni qabul qiladi","Failover uchun qo'lda aralashuv shart"],a:1,
 e:"Shuning uchun Redis'ni yagona haqiqat manbai sifatida ishlatish (to'lov, buyurtma) tavsiya etilmaydi — kesh, sessiya, rate limit, navbat uchun juda yaxshi. Sentinel — HA bitta master uchun; Cluster — sharding + HA. Split-brain holatlari uchun min-replicas-to-write sozlamasi bor."},
{l:"S",t:"mcq",tp:"Redis",q:"Redis Cluster'da <code>MGET user:1:name user:2:name</code> xato berdi (CROSSSLOT). Sabab va yechim?",
 o:["Cluster ko'p kalitli buyruqni umuman qo'llamaydi","Kalitlar 16384 hash slot bo'yicha taqsimlanadi; ko'p kalitli buyruq faqat bir slotdagi kalitlar bilan ishlaydi. Birga turishi kerak bo'lsa — hash tag: user:{1}:name va user:{1}:email bitta slotga tushadi","MGET o'rniga KEYS ishlatish kerak","Node sonini oshirish kerak"],a:1,
 e:"Hash tag {...} ichidagi qism bo'yicha slot hisoblanadi. Ehtiyot bo'ling: hammasini bitta tagga solsangiz, ma'lumot bitta shardga yig'iladi (hot shard). Tranzaksiya va Lua ham bitta slot talab qiladi. Ko'pincha oddiyroq yechim — pipeline bilan alohida GET'lar."},
{l:"S",t:"mcq",tp:"Redis",q:"Pub/Sub va Streams farqi?",
 o:["Bir xil","Pub/Sub — fire-and-forget: obuna bo'lmagan yoki uzilgan client xabarni umuman olmaydi, saqlanmaydi. Streams — saqlanadigan log: consumer group, offset, ACK, qayta o'qish (Kafka'ga o'xshash model)","Streams xabarni saqlamaydi","Pub/Sub ACK talab qiladi"],a:1,
 e:"Ishonchli yetkazish kerak bo'lsa Pub/Sub mos emas (deploy paytida uzilish = yo'qolgan xabarlar). Streams: XADD, XREADGROUP, XACK, pending entries list (XPENDING) bilan ishlanmagan xabarlarni ko'rish va XCLAIM bilan boshqa consumer'ga o'tkazish. Kichik hajmdagi ishonchli navbat uchun Streams — Kafka o'rniga arzon variant."},
{l:"St",t:"open",tp:"Redis",q:"'Redis bizga sekin' deyishdi: p99 latency sakraydi. Qanday tekshirasiz?",
 m:["SLOWLOG GET — sekin buyruqlar (KEYS, katta ZRANGE/HGETALL, uzun Lua)","Big key va hot key tahlili: redis-cli --bigkeys / --hotkeys, MEMORY USAGE","INFO: used_memory va maxmemory nisbati, evicted_keys, blocked_clients, instantaneous_ops_per_sec","Latency manbalari: fork paytida RDB/AOF rewrite (katta xotirada sezilarli), transparent huge pages, swap","Tarmoq va client tomoni: round-trip soni (pipeline'ga o'tish), ulanish pool sozlamalari, TLS narxi","Arxitektura: hot keyni lokal (in-process) kesh bilan yumshatish, shardlash, o'qishni replicaga bo'lish"],
 e:"Staff signal: Redis'da latency muammosi deyarli doim 'bitta og'ir operatsiya butun threadni bloklagan' yoki 'xotira/fork' bilan bog'liq. Tartib: o'lchash (SLOWLOG, INFO) → sabab → chora."}
];
