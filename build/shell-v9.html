<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Interview Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#f6f5f1; --bg-2:#efede7; --card:#ffffff; --ink:#1b1a22; --muted:#6b6878; --faint:#9a97a6; --line:#e7e4dc;
  --accent:#5b4ee0; --accent-2:#8b5cf6; --accent-ink:#ffffff; --accent-soft:#ecebff;
  --ok:#16a34a; --ok-soft:#e3f6e9; --mid:#d97706; --mid-soft:#fdf0dc; --bad:#dc2626; --bad-soft:#fde6e6;
  --code-bg:#17161f; --code-ink:#e4e2f0;
  --shadow:0 1px 2px rgba(27,26,34,.04),0 8px 28px rgba(27,26,34,.07);
  --shadow-lg:0 2px 4px rgba(27,26,34,.04),0 24px 60px rgba(27,26,34,.12);
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f0e14; --bg-2:#17161f; --card:#1a1923; --ink:#ecebf3; --muted:#a3a0b3; --faint:#716e82; --line:#2a2835;
  --accent:#8b80ff; --accent-2:#b18cff; --accent-ink:#12101c; --accent-soft:#25224a;
  --ok:#4ade80; --ok-soft:#12291b; --mid:#fbbf24; --mid-soft:#33260e; --bad:#f87171; --bad-soft:#361618;
  --code-bg:#0a0910; --code-ink:#dcdaea;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 28px rgba(0,0,0,.35);
  --shadow-lg:0 1px 0 rgba(255,255,255,.04) inset,0 24px 60px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#0f0e14; --bg-2:#17161f; --card:#1a1923; --ink:#ecebf3; --muted:#a3a0b3; --faint:#716e82; --line:#2a2835;
  --accent:#8b80ff; --accent-2:#b18cff; --accent-ink:#12101c; --accent-soft:#25224a;
  --ok:#4ade80; --ok-soft:#12291b; --mid:#fbbf24; --mid-soft:#33260e; --bad:#f87171; --bad-soft:#361618;
  --code-bg:#0a0910; --code-ink:#dcdaea;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 28px rgba(0,0,0,.35);
  --shadow-lg:0 1px 0 rgba(255,255,255,.04) inset,0 24px 60px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.page{max-width:1120px;margin:0 auto;padding:22px 16px 72px}
@media (min-width:700px){.page{padding:28px 28px 80px}}

/* top */
.top{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font:800 14px var(--mono);color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent);flex:none}
.brand{font-weight:800;font-size:18px;letter-spacing:-.02em;white-space:nowrap}
.brand small{display:block;font:600 11px var(--mono);color:var(--muted);letter-spacing:.02em}
.top .sp{flex:1}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;font-size:16px}
.icon-btn:hover{border-color:var(--faint)}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.h2{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:34px 0 12px;display:flex;align-items:center;gap:10px}
.h2 .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px;padding:10px 18px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover:not([disabled]){border-color:var(--faint)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.primary:hover:not([disabled]){filter:brightness(1.06)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--bg-2)}
.btn.sm{font-size:12.5px;padding:6px 11px;border-radius:9px}
.btn[disabled]{opacity:.4;cursor:default;box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);font-weight:700;font-size:13px;padding:6px 13px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.pbar{height:6px;border-radius:99px;background:var(--bg-2);overflow:hidden;display:flex}
.pbar i{display:block;height:100%}
.pbar .o{background:var(--ok)}.pbar .m{background:var(--mid)}.pbar .x{background:var(--bad)}.pbar .a{background:linear-gradient(90deg,var(--accent),var(--accent-2))}

/* search */
.search{position:relative;flex:1;max-width:420px}
.search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px 9px 36px;font:500 14px var(--sans);color:var(--ink);outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.search:before{content:"⌕";position:absolute;left:13px;top:50%;transform:translateY(-52%);color:var(--faint);font-size:16px}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:600 11px var(--mono);color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:0 5px}
@media (max-width:640px){.search kbd{display:none}.top{flex-wrap:wrap}.search{order:5;flex-basis:100%;max-width:none}}

/* hero */
.hello{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin:0 0 4px}
.hello-sub{margin:0 0 20px;color:var(--muted)}
.hero{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:14px}
@media (max-width:900px){.hero{grid-template-columns:1fr 1fr}.hero .due-card{grid-column:1/-1}}
@media (max-width:520px){.hero{grid-template-columns:1fr}}
.due-card{padding:22px 24px;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border:0;box-shadow:var(--shadow-lg)}
.due-card:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.due-card .lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;opacity:.8}
.due-card .num{font-size:52px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:8px 0 4px}
.due-card .num small{font-size:16px;font-weight:700;opacity:.8;letter-spacing:0;margin-left:6px}
.due-card .row{display:flex;align-items:flex-end;gap:18px;justify-content:space-between;flex-wrap:wrap;position:relative;z-index:1}
.due-card .btn{background:#fff;color:#2a2270;border:0}
.due-card .btn[disabled]{opacity:.55}
.fc{display:flex;gap:5px;align-items:flex-end;height:46px}
.fc div{display:grid;justify-items:center;gap:3px}
.fc i{width:16px;border-radius:4px;background:rgba(255,255,255,.35);display:block;min-height:3px}
.fc i.t{background:#fff}
.fc span{font:600 9.5px var(--mono);opacity:.75}
.stat{padding:20px 22px;display:flex;flex-direction:column;gap:6px}
.stat .lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.stat .big{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.stat .big small{font-size:14px;color:var(--muted);font-weight:700;margin-left:4px;letter-spacing:0}
.week{display:flex;gap:5px;margin-top:auto}
.week i{flex:1;height:8px;border-radius:3px;background:var(--bg-2)}
.week i.on{background:linear-gradient(90deg,#f59e0b,#ef4444)}
.resume{margin-top:14px;padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.resume .t{flex:1;min-width:180px}
.resume b{display:block}

/* directions */
.dirs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:900px){.dirs{grid-template-columns:repeat(2,1fr)}}
@media (max-width:460px){.dirs{grid-template-columns:1fr}}
.dir{padding:20px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:14px;transition:transform .15s,box-shadow .15s,border-color .15s}
.dir:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.dir .hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dir .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:var(--accent-soft)}
.dir h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
.dir .meta{font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.dir .meta b{color:var(--ink)}
.pill{font:700 11px var(--mono);padding:2px 8px;border-radius:99px;background:var(--mid-soft);color:var(--mid)}
.ring{flex:none}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:var(--bg-2)}
.ring .fgc{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring text{font:800 13px var(--sans);fill:var(--ink)}

/* direction view */
.crumbs{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.dhead{padding:24px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.dhead h1{margin:0;font-size:28px;letter-spacing:-.03em}
.dhead .t{flex:1;min-width:220px}
.dhead .acts{display:flex;gap:8px;flex-wrap:wrap}
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.sec{padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px}
.sec h4{margin:0;font-size:15px;font-weight:800;letter-spacing:-.01em;line-height:1.3}
.sec .nums{display:flex;justify-content:space-between;font:600 12px var(--mono);color:var(--muted)}
.sec .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.sec .acts .btn:first-child{flex:1;justify-content:center}

/* search results */
.results{display:grid;gap:8px}
.res{padding:12px 16px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left;width:100%}
.res:hover{border-color:var(--accent)}
.res .q{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* drill */
.dtop{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);margin:-22px -16px 22px;padding:14px 16px 12px}
@media (min-width:700px){.dtop{margin:-28px -28px 26px;padding:16px 28px 12px}}
.dtop-in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:12px}
.dtop .title{flex:1;min-width:0;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtop .cnt{font:600 13px var(--mono);color:var(--muted)}
.dtop .pbar{max-width:780px;margin:10px auto 0;height:5px}
.stage{max-width:780px;margin:0 auto}
.qcard{padding:30px 32px;box-shadow:var(--shadow-lg)}
@media (max-width:560px){.qcard{padding:20px 18px;border-radius:18px}}
@keyframes enter{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.qcard,.flip{animation:none!important}.dir{transition:none}}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:16px}
.tag{font:700 11px var(--mono);padding:3px 9px;border-radius:7px;background:var(--bg-2);color:var(--muted)}
.tag.lv{background:var(--ink);color:var(--bg)}
.tag.due{background:var(--mid-soft);color:var(--mid)}
.tags .n{margin-left:auto;font:600 12px var(--mono);color:var(--faint)}
.qtext{font-size:21px;font-weight:800;letter-spacing:-.015em;line-height:1.4;margin:0 0 18px;text-wrap:pretty}
@media (max-width:560px){.qtext{font-size:18px}}
.qtext code,.opt code,.exp code{font-family:var(--mono);font-size:.86em;background:var(--accent-soft);padding:1px 6px;border-radius:5px;font-weight:600}
pre{background:var(--code-bg);color:var(--code-ink);font:13px/1.65 var(--mono);padding:16px 18px;border-radius:14px;overflow-x:auto;margin:0 0 18px;white-space:pre}
.opts{display:grid;gap:10px}
.bar-act{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}
.bar-act .sp{flex:1}
.hint{font-size:12px;color:var(--faint)}
.hint b{font:600 11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted)}
.flip{margin-top:22px}
.glo{margin-top:12px;padding:10px 14px;border-radius:12px;border:1px solid var(--line,rgba(127,127,127,.25));font-size:14px;line-height:1.55}.glo summary{cursor:pointer;font-weight:600}.glo ul{margin:8px 0 0;padding-left:18px}.glo li{margin:4px 0}
.ans{padding:16px 18px;border-radius:14px;background:var(--ok-soft);border-left:4px solid var(--ok);line-height:1.6;font-size:15.5px}
.ans p{margin:0 0 8px}.ans p:first-child{font-size:16.5px}.ans ul,.ans ol{margin:6px 0 0;padding-left:20px}.ans li{margin:4px 0}.ans pre{margin:8px 0}.ans>:last-child{margin-bottom:0}
.verdict{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;font-weight:800;font-size:16px}
.verdict .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:16px;flex:none}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}.verdict.ok .ic{background:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}.verdict.bad .ic{background:var(--bad)}
.verdict.mid{background:var(--mid-soft);color:var(--mid)}.verdict.mid .ic{background:var(--mid)}
.exp{margin-top:18px}
.exp h5{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;font-weight:800}
.exp p{margin:0;white-space:pre-line;max-width:70ch}
.exp ul{margin:0;padding-left:20px;display:grid;gap:4px}
.src{margin-top:12px;font-size:12.5px;color:var(--muted);word-break:break-all}
.src a{color:var(--accent);font-weight:700}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.keys span{font:600 12px var(--mono);padding:2px 8px;border-radius:6px;border:1px solid var(--line)}
.keys .hit{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.keys .miss{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.grade button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 8px;cursor:pointer;display:grid;gap:2px;justify-items:center;font-weight:800}
.grade button small{font:600 11.5px var(--mono);color:var(--muted)}
.grade .g-bad:hover,.grade .g-bad.on{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.grade .g-mid:hover,.grade .g-mid.on{border-color:var(--mid);background:var(--mid-soft);color:var(--mid)}
.grade .g-ok:hover,.grade .g-ok.on{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.nextrev{margin-top:14px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.nextrev b{color:var(--ink)}
@media (max-width:560px){.bar-act.sticky{position:sticky;bottom:0;background:var(--card);margin:20px -18px -20px;padding:12px 18px;border-top:1px solid var(--line);border-radius:0 0 18px 18px}}

/* done */
.done{padding:40px 32px;text-align:center}
.done .em{font-size:46px;line-height:1}
.done h2{font-size:28px;letter-spacing:-.03em;margin:12px 0 4px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:26px auto;max-width:460px}
.tri div{padding:14px;border-radius:14px;background:var(--bg-2)}
.tri b{display:block;font-size:28px;font-weight:800;letter-spacing:-.03em}
.tri .o b{color:var(--ok)}.tri .m b{color:var(--mid)}.tri .x b{color:var(--bad)}
.done .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.empty{padding:40px;text-align:center;color:var(--muted)}
.foot{margin-top:40px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--faint);font-size:12.5px}
/* ===== Anki uslubi ===== */
:root{--new:#2563eb;--learn:#dc2626;--rev:#16a34a;--again:#ef4444;--hard:#78716c;--good:#22c55e;--easy:#3b82f6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--new:#60a5fa;--learn:#f87171;--rev:#4ade80;--hard:#a8a29e}}
:root[data-theme="dark"]{--new:#60a5fa;--learn:#f87171;--rev:#4ade80;--hard:#a8a29e}
.c-new{color:var(--new)}.c-learn{color:var(--learn)}.c-rev{color:var(--rev)}
.today{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.today .card{padding:12px 16px;display:flex;align-items:center;gap:12px;flex:1;min-width:150px;border-radius:16px}
.today .v{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1}
.today .l{font-size:12px;color:var(--muted);font-weight:700}
.today .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:var(--bg-2);flex:none}
.decks{overflow:hidden;padding:0}
.dk-head,.dk{display:grid;grid-template-columns:1fr 52px 52px 52px 40px;align-items:center;gap:4px;padding:0 10px 0 6px}
@media (max-width:520px){.dk-head,.dk{grid-template-columns:1fr 38px 38px 38px 34px;padding-right:4px}}
.dk-head{font:800 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:12px;padding-bottom:10px;border-bottom:1px solid var(--line);background:var(--bg-2)}
.dk-head span{text-align:center}
.dk-head span:first-child{text-align:left;padding-left:14px}
.dk{min-height:52px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.dk:last-child{border-bottom:0}
.dk:hover{background:var(--bg-2)}
.dk .nm{display:flex;align-items:center;gap:8px;min-width:0;padding:10px 0}
.dk .nm b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk .nm small{font:600 11px var(--mono);color:var(--faint);white-space:nowrap}
.dk .tw{width:26px;height:26px;border-radius:8px;border:0;background:none;cursor:pointer;color:var(--muted);flex:none;display:grid;place-items:center;transition:transform .15s}
.dk .tw.open{transform:rotate(90deg)}
.dk .tw.leaf{visibility:hidden}
.dk .n{text-align:center;font:700 14px var(--mono);font-variant-numeric:tabular-nums}
.dk .n.z{color:var(--faint);opacity:.45;font-weight:500}
.dk .more{border:0;background:none;color:var(--faint);cursor:pointer;font-size:18px;border-radius:8px;height:32px}
.dk .more:hover{background:var(--line);color:var(--ink)}
.dk.l0 .nm b{font-size:16px;font-weight:800}
.dk.l0 .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:14px;flex:none}
.dk.l1 .nm{padding-left:28px}.dk.l1 .nm b{font-size:14.5px}
.dk.l2 .nm{padding-left:58px}.dk.l2 .nm b{font-size:14px;font-weight:600}
.dk.l2{min-height:44px}
.dk.l3 .nm{padding-left:86px}.dk.l3 .nm b{font-size:13.5px;font-weight:600}.dk.l3{min-height:42px}
@media (max-width:520px){.dk.l1 .nm{padding-left:10px}.dk.l2 .nm{padding-left:26px}.dk.l3 .nm{padding-left:40px}.dk.l3 .nm b{white-space:normal;line-height:1.3}.dk .nm small{display:none}.dk.l2 .nm b{white-space:normal;line-height:1.3}}
.foot-line{margin-top:14px;text-align:center;color:var(--muted);font-size:13px}

/* overview */
.ov{max-width:560px;margin:4vh auto 0;padding:34px 30px;text-align:center}
.ov h1{margin:0 0 4px;font-size:26px;letter-spacing:-.03em}
.ov .path{color:var(--muted);font-size:13px;margin-bottom:24px}
.ov-counts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 24px}
.ov-counts div{padding:16px 8px;border-radius:16px;background:var(--bg-2)}
.ov-counts b{display:block;font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.ov-counts span{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.ov .big-btn{width:100%;justify-content:center;font-size:16px;padding:15px}
.ov .custom{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.ov .stats-line{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);display:grid;gap:8px;text-align:left}
.ov .stats-line .r{display:flex;justify-content:space-between;font-size:13.5px}
.ov .done-msg{padding:18px;border-radius:14px;background:var(--ok-soft);color:var(--ok);font-weight:700;margin-bottom:16px}

/* study (reviewer) */
.rv-top .cts{display:flex;gap:10px;font:800 15px var(--mono)}
.rv-top .cts span{position:relative}
.rv-top .cts span.cur{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.show-btn{width:100%;justify-content:center;padding:15px;font-size:16px;margin-top:22px}
.ease{position:sticky;bottom:0;z-index:5;margin-top:22px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.ease button{border:0;border-radius:14px;padding:10px 4px 12px;cursor:pointer;display:grid;gap:2px;justify-items:center;color:#fff;font-weight:800;font-size:15px;box-shadow:0 6px 16px rgba(0,0,0,.12);transition:transform .1s,filter .1s}
.ease button:hover{filter:brightness(1.08);transform:translateY(-1px)}
.ease button:active{transform:translateY(1px)}
.ease button small{font:600 11.5px var(--mono);opacity:.9}
.ease button kbd{font:600 10px var(--mono);opacity:.65}
.ease .e-again{background:var(--again)}.ease .e-hard{background:var(--hard)}.ease .e-good{background:var(--good)}.ease .e-easy{background:var(--easy)}
.ease button.sug{outline:3px solid color-mix(in srgb,var(--ink) 55%,transparent);outline-offset:2px}
.sheet{position:fixed;inset:0;z-index:50;display:grid;place-items:end center;background:rgba(0,0,0,.35);animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet .card{width:min(460px,100%);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:6px}
@media (min-width:600px){.sheet{place-items:center}.sheet .card{border-radius:22px}}
.sheet h3{margin:4px 8px 8px;font-size:17px}
.sheet button.it{text-align:left;border:0;background:none;padding:12px;border-radius:12px;cursor:pointer;font-weight:700;display:flex;justify-content:space-between;gap:10px}
.sheet button.it:hover{background:var(--bg-2)}
.sheet button.it small{color:var(--muted);font-weight:600}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px}
.set-row input{width:80px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg);color:var(--ink);font:600 14px var(--mono)}

/* ===== animatsiyalar ===== */
body:before,body:after{content:"";position:fixed;z-index:-1;width:46vmax;height:46vmax;border-radius:50%;filter:blur(80px);opacity:.16;pointer-events:none}
body:before{background:var(--accent);left:-14vmax;top:-16vmax;animation:blob 22s ease-in-out infinite alternate}
body:after{background:var(--accent-2);right:-16vmax;bottom:-18vmax;animation:blob 26s ease-in-out infinite alternate-reverse}
@keyframes blob{50%{transform:translate(8vmax,6vmax) scale(1.15)}to{transform:translate(-4vmax,10vmax) scale(.9)}}
.logo{background-size:200% 200%;animation:shine 6s ease-in-out infinite}
@keyframes shine{50%{background-position:100% 100%;transform:rotate(-6deg)}}
.logo:hover{animation:spin .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes spin{to{transform:rotate(360deg)}}
.btn,.opt,.chip,.ease button,.icon-btn,.show-btn{position:relative;overflow:hidden}
.btn,.icon-btn,.chip{transition:transform .15s cubic-bezier(.3,1.6,.5,1),border-color .15s,box-shadow .2s,background .15s,filter .15s}
.btn:active:not([disabled]),.icon-btn:active,.chip:active{transform:scale(.95)}
.btn.primary:hover:not([disabled]){transform:translateY(-1px);box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 45%,transparent)}
.icon-btn:hover{transform:rotate(60deg)}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(2.6);opacity:0}}
.today .card{transition:transform .2s cubic-bezier(.3,1.5,.5,1),box-shadow .2s}
.today .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.today .ic{transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
.today .card:hover .ic{transform:scale(1.18) rotate(-8deg)}
.dk{transition:background .15s,box-shadow .15s}
.dk:hover{box-shadow:inset 3px 0 0 var(--accent)}
.dk .tw{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.dk.fresh{animation:drop .32s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i,0)*35ms)}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}}
.pbar i{transition:width .5s cubic-bezier(.3,1.2,.5,1)}
.pbar i.a{background-size:200% 100%;background-image:linear-gradient(90deg,var(--accent),var(--accent-2),var(--accent));animation:flow 2.5s linear infinite}
@keyframes flow{to{background-position:-200% 0}}
.show-btn:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-100%);animation:sweep 3s ease-in-out 1s infinite}
@keyframes sweep{40%,to{transform:translateX(100%)}}
.sheet{animation:fade .2s}
.sheet .card{animation:up .32s cubic-bezier(.2,1,.3,1)}
@keyframes up{from{transform:translateY(40px) scale(.97);opacity:0}}
#toast{animation:up .3s cubic-bezier(.2,1.4,.4,1)}
/* faqat navigatsiyada */
.anim .today .card,.anim .dk-head,.anim .dk,.anim .ov,.anim .crumbs,.anim .results .res,.anim .h2{animation:rise .5s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.anim .top{animation:fadeDown .45s ease-out both}
@keyframes fadeDown{from{opacity:0;transform:translateY(-10px)}}
.anim .ov-counts div{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(150ms + var(--i,0)*70ms)}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.anim .qcard{animation:cardIn .45s cubic-bezier(.2,1,.3,1) both}
@keyframes cardIn{from{opacity:0;transform:translateX(40px) rotate(1.5deg) scale(.97)}}
.qcard.out{animation:cardOut .2s ease-in forwards!important}
@keyframes cardOut{to{opacity:0;transform:translateX(-60px) rotate(-2deg) scale(.96)}}
.anim .flip,.anim-rev .flip{animation:rise .4s ease-out both}
.anim-rev .verdict{animation:pop .45s cubic-bezier(.3,1.7,.5,1) both}
.anim-rev .verdict .ic{animation:spin .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes glow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}to{box-shadow:0 0 0 14px transparent}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.anim-rev .exp h5,.anim-rev .exp p,.anim-rev .exp ul,.anim-rev .exp pre,.anim-rev .keys{animation:rise .45s ease-out both;animation-delay:calc(200ms + var(--i,0)*60ms)}
.anim-rev .ease button,.anim .ease button{animation:bounceIn .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(250ms + var(--i,0)*60ms)}
@keyframes bounceIn{from{opacity:0;transform:translateY(24px) scale(.8)}}
.ease button.sug{animation-name:bounceIn,throb!important;animation-duration:.5s,1.6s!important;animation-delay:calc(250ms + var(--i,0)*60ms),1s!important;animation-iteration-count:1,infinite!important}
@keyframes throb{50%{transform:scale(1.05)}}
.anim .done .em{animation:party 1s cubic-bezier(.3,1.6,.5,1) both}
@keyframes party{0%{transform:scale(0) rotate(-40deg)}60%{transform:scale(1.4) rotate(10deg)}}
.anim .tri div{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(300ms + var(--i,0)*90ms)}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:60;pointer-events:none;border-radius:2px;animation:fall var(--d) cubic-bezier(.3,.6,.6,1) forwards}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(var(--r));opacity:.3}}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.confetti{display:none}}

/* ===== premium ===== */
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{--glass:color-mix(in srgb,var(--card) 72%,transparent);--hl:rgba(255,255,255,.7)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:color-mix(in srgb,var(--card) 62%,transparent);--hl:rgba(255,255,255,.06)}}
:root[data-theme="dark"]{--glass:color-mix(in srgb,var(--card) 62%,transparent);--hl:rgba(255,255,255,.06)}
body{background-image:radial-gradient(color-mix(in srgb,var(--ink) 7%,transparent) 1px,transparent 1px);background-size:22px 22px;background-attachment:fixed}
body:before,body:after{opacity:.22}
.card{background:var(--glass);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);box-shadow:inset 0 1px 0 var(--hl),var(--shadow);position:relative}
.card:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--accent) 12%,transparent),transparent 60%)}
.card:hover:before{opacity:1}
.today .card:after,.ov:after,.done:after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;background:conic-gradient(from var(--ang),transparent 0 60%,var(--accent) 75%,var(--accent-2) 85%,transparent 95%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .3s;animation:orbit 4s linear infinite}
.today .card:hover:after,.ov:after,.done:after{opacity:1}
@keyframes orbit{to{--ang:360deg}}
.qcard{transform:var(--tilt,none);transition:transform .25s ease-out}
.qcard:not(:hover){--tilt:none}
.dtop{background:color-mix(in srgb,var(--bg) 65%,transparent);backdrop-filter:blur(18px) saturate(1.6);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.ov h1,.done h2,.brand{background:linear-gradient(120deg,var(--ink) 30%,var(--accent) 70%,var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{-webkit-text-fill-color:var(--muted)}
.ov-counts b,.today .v{font-variant-numeric:tabular-nums}
.ov-counts div,.tri div{background:color-mix(in srgb,var(--bg-2) 70%,transparent);border:1px solid color-mix(in srgb,var(--line) 50%,transparent)}
.ease{background:linear-gradient(to top,var(--bg) 55%,transparent)}
.ease button{background-image:linear-gradient(180deg,rgba(255,255,255,.22),transparent 60%);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 20px -6px currentColor}
.ease .e-again{color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 24px -8px var(--again)}
.ease .e-hard{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 24px -8px var(--hard)}
.ease .e-good{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 24px -8px var(--good)}
.ease .e-easy{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 24px -8px var(--easy)}
.btn.primary{background-size:200% 100%;background-image:linear-gradient(110deg,var(--accent),var(--accent-2),var(--accent));transition:background-position .6s,transform .15s cubic-bezier(.3,1.6,.5,1),box-shadow .2s}
.btn.primary:hover:not([disabled]){background-position:100% 0}
.dk.l0 .ico{box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 40%,transparent)}
.sheet{backdrop-filter:blur(6px)}
@media (prefers-reduced-motion:reduce){.qcard{transform:none}}
.deep{margin-top:14px;border:1px solid var(--line,#8884);border-radius:12px;overflow:hidden}
.deep>summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none;user-select:none}
.deep>summary::before{content:"▸ ";display:inline-block;transition:transform .2s}
.deep[open]>summary::before{transform:rotate(90deg)}
.deep-in{padding:0 14px 12px;animation:dfade .25s ease}
.deep-in h6{font-size:.95em;margin:14px 0 6px}
.deep-in ul,.deep-in ol{padding-left:20px;margin:6px 0}
.deep-in .dsvg{margin:10px 0;overflow-x:auto}.deep-in .dsvg svg{max-width:100%;height:auto;display:block;margin:auto}
@keyframes dfade{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
/* qo'llanmalar */
.docs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.doc-tile{display:flex;gap:14px;padding:18px 20px;color:inherit;text-decoration:none;transition:transform .2s,border-color .2s,box-shadow .2s}
.doc-tile:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow-lg)}
.doc-ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:800 18px var(--mono);color:var(--accent);background:var(--accent-soft)}
.doc-tile b{font-size:15px;line-height:1.35}.doc-tile p{margin:6px 0 8px;color:var(--muted);font-size:13px;line-height:1.5}.doc-tile small{font:600 11px var(--mono);color:var(--faint)}
.doc-wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.doc-toc{position:sticky;top:16px;padding:14px 10px;max-height:calc(100vh - 32px);overflow:auto}
.doc-toc .tt{font:800 11px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:0 10px 8px}
.doc-toc a{display:block;padding:6px 10px;border-radius:8px;font-size:13px;color:var(--ink);text-decoration:none;line-height:1.35}
.doc-toc a:hover{background:var(--accent-soft);color:var(--accent)}
.doc{padding:34px 40px;line-height:1.7;font-size:15.5px;min-width:0}
.doc h1{font-size:28px;line-height:1.25;margin:0 0 18px;letter-spacing:-.01em}
.doc h2{font-size:21px;margin:38px 0 12px;padding-top:6px;scroll-margin-top:16px}
.doc h3{font-size:16.5px;margin:24px 0 8px;scroll-margin-top:16px}
.doc h4{font-size:15px;margin:18px 0 6px}
.doc p{margin:10px 0}.doc ul,.doc ol{padding-left:22px;margin:8px 0}.doc li{margin:4px 0}
.doc hr{border:0;border-top:1px solid var(--line);margin:30px 0}
.doc code{font:500 .88em var(--mono);background:var(--bg-2);border:1px solid var(--line);padding:1px 6px;border-radius:6px}
.doc blockquote{margin:14px 0;padding:12px 16px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0}
.dpre{position:relative;margin:14px 0}
.dpre pre{margin:0;padding:16px 18px;overflow-x:auto;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;font:500 13px/1.55 var(--mono);white-space:pre;tab-size:4}
.dpre .lang{position:absolute;top:6px;right:10px;font:700 10px var(--mono);color:var(--faint);text-transform:uppercase}
.dtbl{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:12px}
.dtbl table{border-collapse:collapse;width:100%;font-size:14px}
.dtbl th,.dtbl td{padding:9px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.dtbl th{background:var(--bg-2);font-weight:800;white-space:nowrap}
.dtbl tr:last-child td{border-bottom:0}
.tabs{position:relative;display:flex;gap:2px;padding:3px;border:1px solid var(--line);background:var(--bg-2);border-radius:12px;margin-left:8px}
.tabs>*{position:relative;z-index:1;display:flex;align-items:center;gap:6px;padding:7px 14px;border:0;background:none;border-radius:9px;cursor:pointer;font:700 13px var(--sans);color:var(--muted);text-decoration:none;transition:color .2s,background .25s,box-shadow .25s}
.tabs>*:hover{color:var(--ink)}.tabs>.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tab-ind{display:none}
.gtabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);margin:14px 0 18px;scrollbar-width:none}
.gtabs button{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px;border:0;background:none;cursor:pointer;font:700 14px var(--sans);color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .2s,border-color .25s}
.gtabs button:hover{color:var(--ink)}.gtabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.gtabs small{font:700 11px var(--mono);padding:1px 7px;border-radius:99px;background:var(--bg-2);color:var(--faint)}.gtabs .on small{background:var(--accent-soft);color:var(--accent)}
.gpane{animation:dfade .3s ease}
.docs-head h1{margin:6px 0 4px;font-size:28px}.docs-head p{margin:0 0 8px}
.doc-pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:40px}
.doc-pager a{padding:14px 16px;color:inherit;text-decoration:none;display:flex;flex-direction:column;gap:4px;transition:border-color .2s}.doc-pager a:hover{border-color:var(--accent)}
.doc-pager small{font:700 11px var(--mono);color:var(--faint)}.doc-pager b{font-size:14px;line-height:1.35}.doc-pager .nx{text-align:right}
.page{max-width:var(--pagew,1120px);transition:max-width .35s cubic-bezier(.2,1,.3,1)}
.rd-anim body,.rd-anim .card,.rd-anim .btn,.rd-anim .top *,.rd-anim .sheet *,.rd-anim .doc *{transition:background-color .35s ease,color .35s ease,border-color .35s ease,font-size .25s ease!important}
.tgl:active i{width:22px}.tgl[aria-checked="true"]:active i{transform:translateX(14px)}
.stepper b{transition:opacity .15s}
.doc,.ans,.exp,.deep-in,.doc-tile b{font-family:var(--read,var(--sans))}
body{font-family:var(--read,var(--sans));font-size:calc(15px*var(--rsize,1))}
.doc{font-size:calc(15.5px*var(--rsize,1))}.ans,.exp,.deep-in{font-size:calc(1em*var(--rsize,1))}
.rd-bold body{font-weight:600}.rd-bold .doc p,.rd-bold .doc li,.rd-bold .ans{font-weight:600}
.rd-bold b.bio,.rd-bold .doc strong{font-weight:800}
b.bio{font-weight:750}
.rd-focus .top,.rd-focus .doc-toc,.rd-focus .mock-cta{display:none}.rd-focus .doc-wrap{grid-template-columns:minmax(0,1fr)}
.focus-exit{position:fixed;top:12px;right:12px;z-index:40;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:99px;padding:6px 12px;font:700 12px var(--sans);cursor:pointer;opacity:.6;transition:opacity .2s}.focus-exit:hover{opacity:1}
.sheet .card{max-height:88vh;overflow:auto}
.set-h{font:800 11px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:12px 12px 2px;border-top:1px solid var(--line);margin-top:6px}
.set-row select{max-width:200px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg);color:var(--ink);font:600 13px var(--sans)}
.stepper{display:flex;align-items:center;gap:4px}.stepper b{min-width:72px;text-align:center;font:700 13px var(--mono)}
.stepper button{width:34px;height:30px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);cursor:pointer;font:700 13px var(--sans)}
.stepper button:hover{border-color:var(--accent);color:var(--accent)}
.tgl{width:42px;height:24px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer;transition:background .2s;flex:none}
.tgl i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.tgl[aria-checked="true"]{background:var(--accent)}.tgl[aria-checked="true"] i{transform:translateX(18px)}
.mock-cta{display:flex;align-items:center;gap:14px;width:100%;padding:16px 20px;margin:0 0 18px;text-align:left;cursor:pointer;color:inherit;font:inherit;transition:transform .2s,border-color .2s,box-shadow .2s}
.mock-cta:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow-lg)}
.mock-cta>div{flex:1;min-width:0}.mock-cta b{font-size:16px}.mock-cta p{margin:4px 0 0;color:var(--muted);font-size:13px}
.mock-cta .go{font-size:20px;color:var(--accent);transition:transform .2s}.mock-cta:hover .go{transform:translateX(4px)}

  });
}

// ---------- scheduler (FSRS-5, 4 tugma) ----------
const DAY=864e5,MIN=6e4,now=()=>Date.now();
const EASE=[["again","Qayta","again"],["hard","Qiyin","hard"],["good","Yaxshi","good"],["easy","Oson","easy"]];
const G2R={again:"bad",hard:"mid",good:"ok",easy:"ok"};
const GR={again:1,hard:2,good:3,easy:4};
// FSRS-5 default parametrlari
const W=[0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];
const DECAY=-0.5,FACTOR=19/81;
const clampD=d=>Math.min(10,Math.max(1,d));
const d0=g=>clampD(W[4]-Math.exp(W[5]*(g-1))+1);
const retr=(t,st)=>Math.pow(1+FACTOR*t/st,DECAY);
const ivDays=st=>{const r=S.cfg.ret||.9;return Math.min(36500,Math.max(1,Math.round(st/FACTOR*(Math.pow(r,1/DECAY)-1))));};
// eski SM-2 yozuvini FSRS holatiga aylantirish
function toF(p){if(!p)return null;if(p.s)return p;
  if(!p.iv)return null; // o'rganilayotgan edi — yangi kabi boshlanadi
  const d=clampD(11-((p.ef||2.5)-1.3)*5);return{s:p.iv,d,lr:p.due-p.iv*DAY,iv:p.iv,n:p.n||1,due:p.due};}
function fsrsCore(p,g,t){
  if(!p)return{s:W[g-1],d:d0(g)};
  const el=Math.max(0,(t-p.lr)/DAY);let st;
  if(el<1)st=p.s*Math.exp(W[17]*(g-3+W[18]));
  else{const R=retr(el,p.s);
    st=g===1?Math.min(p.s,W[11]*Math.pow(p.d,-W[12])*(Math.pow(p.s+1,W[13])-1)*Math.exp(W[14]*(1-R)))
      :p.s*(1+Math.exp(W[8])*(11-p.d)*Math.pow(p.s,-W[9])*(Math.exp(W[10]*(1-R))-1)*(g===2?W[15]:1)*(g===4?W[16]:1));}
  const dp=p.d-W[6]*(g-3)*(10-p.d)/9;
  return{s:Math.max(.01,st),d:clampD(W[7]*d0(4)+(1-W[7])*dp)};
}
function sched(p0,e){const t=now(),g=GR[e],p=toF(p0),lrn=!p||p.n===0;
  const c=fsrsCore(p,g,t),base={s:c.s,d:c.d,lr:t};
  if(g===1)return{...base,iv:0,n:0,due:t+(p&&p.n>0?10:1)*MIN};
  if(lrn&&g===2)return{...base,iv:0,n:0,due:t+6*MIN};
  // intervallar tartibi: qiyin <= yaxshi < oson
  const iv={};[2,3,4].forEach(x=>iv[x]=ivDays(fsrsCore(p,x,t).s));
  if(!lrn){iv[2]=Math.min(iv[2],iv[3]);iv[3]=Math.max(iv[3],iv[2]+1);}
  iv[4]=Math.max(iv[4],iv[3]+1);
  return{...base,iv:iv[g],n:(p?p.n:0)+1,due:t+iv[g]*DAY};
}

const inline=s=>esc(s).replace(/&lt;(\/?)b&gt;/g,"<$1b>").replace(/`([^`]+)`/g,"<code>$1</code>");
// deep izoh uchun mini markdown: ### sarlavha, ``` kod, - ro'yxat, **qalin**, `kod`, <svg> (o'zimizniki, ishonchli)
const mdi=s=>inline(s).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
function md(src){
  const L=src.split("\n");let h="",i=0;
  while(i<L.length){const l=L[i];
    if(l.startsWith("```")){let c=[];i++;while(i<L.length&&!L[i].startsWith("```"))c.push(L[i++]);i++;h+=`<pre>${esc(c.join("\n"))}</pre>`;continue;}
    if(/^\s*<svg/.test(l)){let c=[];while(i<L.length){c.push(L[i]);if(/<\/svg>/.test(L[i++]))break;}h+=`<div class="dsvg">${c.join("\n")}</div>`;continue;}
    if(/^#{1,4} /.test(l)){h+=`<h6>${mdi(l.replace(/^#+ /,""))}</h6>`;i++;continue;}
    if(/^\s*([-*]|\d+\.) /.test(l)){const ol=/^\s*\d/.test(l);let c=[];while(i<L.length&&/^\s*([-*]|\d+\.) /.test(L[i]))c.push(L[i++].replace(/^\s*([-*]|\d+\.) /,""));h+=`<${ol?"ol":"ul"}>${c.map(x=>`<li>${mdi(x)}</li>`).join("")}</${ol?"ol":"ul"}>`;continue;}
    if(!l.trim()){i++;continue;}
    let c=[];while(i<L.length&&L[i].trim()&&!/^(```|#{1,4} |\s*([-*]|\d+\.) |\s*<svg)/.test(L[i]))c.push(L[i++]);h+=`<p>${mdi(c.join(" "))}</p>`;
  }
  return h;
}

// ---------- decks: yo'nalish > (guruh) > domen > bo'lim ----------
const DECK={};
const addDeck=(id,name,lvl,qs,par)=>{DECK[id]={id,name,lvl,qs,kids:[],parent:par};DECK[par].kids.push(id);};
const addSecs=(dk,par,lv)=>Object.keys(SEC).filter(k=>SEC[k][2]===dk&&SECQ[k]).forEach(k=>addDeck("s:"+k,SEC[k][0],lv,SECQ[k],par));
// bitta jonli domenli ro'yxat (Algo, Architecture): domen qatlamini tashlab, bo'limlar to'g'ridan-to'g'ri
function addList(list,par,lv){
  const live=list.filter(x=>Q.some(q=>domsOf([x]).includes(q.d)));
  if(lv===1&&live.length===1&&!Array.isArray(live[0])){addSecs(live[0],par,lv);return;}
  live.forEach(x=>{
    if(Array.isArray(x)){const [gid,gnm,sub]=x,ds=domsOf(sub);addDeck("c:"+gid,gnm,lv,Q.filter(q=>ds.includes(q.d)),par);addList(sub,"c:"+gid,lv+1);}
    else{addDeck("d:"+x,DOM[x]||x,lv,Q.filter(q=>q.d===x),par);addSecs(x,"d:"+x,lv+1);}
  });
}
Object.entries(GRP).forEach(([g,[gn,ic,list]])=>{
  const ds=domsOf(list),gq=Q.filter(q=>ds.includes(q.d));if(!gq.length)return;
  DECK["g:"+g]={id:"g:"+g,name:gn,ic,lvl:0,qs:gq,kids:[]};
  addList(list,"g:"+g,1);
});
const pathOf=id=>{const r=[];let d=DECK[id];while(d){r.unshift(d.name);d=DECK[d.parent];}return r;};
function counts(qs){qs=qs.filter(lvlOk);let nw=0,ln=0,rv=0;const t=now();
  qs.forEach(q=>{const s=S.srs[q.id];if(!s)nw++;else if(s.due<=t){s.n===0?ln++:rv++;}});
  return{nw:Math.min(nw,newLeft()),nwAll:nw,ln,rv};}
function queue(qs){qs=qs.filter(lvlOk);const t=now();
  const ln=qs.filter(q=>{const s=S.srs[q.id];return s&&s.n===0&&s.due<=t;}).sort((a,b)=>S.srs[a.id].due-S.srs[b.id].due);
  const rv=qs.filter(q=>{const s=S.srs[q.id];return s&&s.n>0&&s.due<=t;}).sort((a,b)=>S.srs[a.id].due-S.srs[b.id].due);
  const nw=qs.filter(q=>!S.srs[q.id]).slice(0,newLeft());
  // yangi kartalarni takrorlar orasiga aralashtirish
  const out=[...ln];let r=0,n=0;const step=nw.length?Math.max(1,Math.floor(rv.length/nw.length)):1;
  while(r<rv.length||n<nw.length){for(let k=0;k<step&&r<rv.length;k++)out.push(rv[r++]);if(n<nw.length)out.push(nw[n++]);}
  return out.map(q=>q.id);}

// ---------- qo'llanmalar (docs/*.md) ----------
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function docMd(src){
  const L=src.split("\n"),toc=[];let h="",i=0;
  const isBlock=l=>/^(```|#{1,4} |>|\||---\s*$|\s*([-*]|\d+\.) )/.test(l);
  while(i<L.length){const l=L[i];
    if(l.startsWith("```")){const lang=l.slice(3).trim();let c=[];i++;while(i<L.length&&!L[i].startsWith("```"))c.push(L[i++]);i++;
      h+=`<div class="dpre">${lang?`<span class="lang">${esc(lang)}</span>`:""}<pre>${esc(c.join("\n"))}</pre></div>`;continue;}
    const hm=l.match(/^(#{1,4}) (.+)/);
    if(hm){const n=hm[1].length,t=hm[2];if(n===1){i++;continue;}const id=slug(t);if(n===2)toc.push([id,t.replace(/\*\*/g,"")]);
      h+=`<h${n} id="${id}">${mdi(t)}</h${n}>`;i++;continue;}
    if(/^---\s*$/.test(l)){h+="<hr>";i++;continue;}
    if(l.startsWith(">")){let c=[];while(i<L.length&&L[i].startsWith(">"))c.push(L[i++].replace(/^>\s?/,""));h+=`<blockquote>${mdi(c.join(" "))}</blockquote>`;continue;}
    if(l.startsWith("|")){let c=[];while(i<L.length&&L[i].startsWith("|"))c.push(L[i++]);
      const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(x=>x.trim());
      const body=c.filter((r,k)=>k!==1||!/^\|[\s:|-]+\|?$/.test(r.trim()));
      h+=`<div class="dtbl"><table><thead><tr>${cells(body[0]).map(x=>`<th>${mdi(x)}</th>`).join("")}</tr></thead><tbody>${body.slice(1).map(r=>`<tr>${cells(r).map(x=>`<td>${mdi(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;continue;}
    if(/^\s*([-*]|\d+\.) /.test(l)){const ol=/^\s*\d/.test(l);let c=[];
      while(i<L.length){const x=L[i];if(/^\s*([-*]|\d+\.) /.test(x)){c.push(x.replace(/^\s*([-*]|\d+\.) /,""));i++;}else if(/^\s{2,}\S/.test(x)&&c.length){c[c.length-1]+="<br>"+x.trim();i++;}else break;}
      h+=`<${ol?"ol":"ul"}>${c.map(x=>`<li>${x.split("<br>").map(mdi).join("<br>")}</li>`).join("")}</${ol?"ol":"ul"}>`;continue;}
    if(!l.trim()){i++;continue;}
    let c=[];while(i<L.length&&L[i].trim()&&!isBlock(L[i]))c.push(L[i++]);h+=`<p>${mdi(c.join(" "))}</p>`;
  }
  return{h,toc};
}

  const rest={new:0,learn:0,rev:0};new Set(s.ids.slice(s.i)).forEach(id=>rest[cat(QBY[id])]++);
  const cc=cat(q),back=s.deck&&DECK[s.deck]?()=>go("overview",{deck:s.deck}):()=>go("decks");

    ${S.undo?`<button class="btn ghost sm" ${act(undo)} title="Bekor qilish (Z)">↶</button>`:""}
    <span class="cts"><span class="c-new ${cc==="new"?"cur":""}">${rest.new}</span><span class="c-learn ${cc==="learn"?"cur":""}">${rest.learn}</span><span class="c-rev ${cc==="rev"?"cur":""}">${rest.rev}</span></span></div>
    <div class="pbar"><i class="a" style="width:${s.i/s.ids.length*100}%"></i></div></div><div class="stage">`;
  h+=`<div class="card qcard"><div class="tags"><span class="tag lv">${LV[q.l]}</span><span class="tag">${esc(SEC[secOf(q)][0])} · ${esc(q.tp)}</span><span class="n">#${esc(q.n)}</span></div>
    <p class="qtext">${q.f?inline(q.f):q.q}</p>${q.c?`<pre>${esc(q.c)}</pre>`:""}`;
  if(!rv)h+=`<button class="btn primary show-btn" id="show" ${act(()=>reveal(q))}>Javobni ko'rsatish <span class="hint" style="color:inherit;opacity:.7">Space</span></button></div>`;
  else h+=answerView(q,rv)+`</div>`+easeBar(q,rv);
  return h+`</div>`;
}
function answerView(q,rv){
  let h=`<div class="flip">`;
    h+=`<h5>Javob</h5><div class="ans">${md(q.b)}</div>`;
    if(q.g&&typeof GLO!=="undefined")h+=`<details class="glo" open><summary>📖 Atamalar</summary><ul>${q.g.map(i=>`<li><b>${esc(GLO[i][0])}</b> — ${inline(GLO[i][1])}</li>`).join("")}</ul></details>`;
    h+=`<div class="exp"><details class="deep"><summary>Batafsil tushuntirish</summary><div class="deep-in">${q.x?md(q.x):`<p>${inline(q.e)}</p>`}</div></details>`;
    if(q.src)h+=`<div class="src">Manba: <a href="${esc(q.src)}" target="_blank" rel="noopener noreferrer">${esc(q.src.replace(/^https?:\/\//,"").split("/")[0])}</a></div>`;
    return h+`</div></div>`;
}
function easeBar(q,rv){
  const p=S.srs[q.id]||null;
  return `<div class="ease" role="group" aria-label="Qanchalik esladingiz?">`+EASE.map(([e,l],i)=>`<button class="e-${e} ${rv.sug===e?"sug":""}" data-e="${e}" ${act(()=>answer(q,e))}><small>${ivLabel(sched(p,e).due-now())}</small>${l}<kbd>${i+1}</kbd></button>`).join("")+`</div>`;
}
function reveal(q){
  const s=S.sess;s.rev[s.i]={v:null,sug:""};save();render();
}
let busy=false;
function answer(q,e){
  if(busy)return;
  const s=S.sess,rv=s.rev[s.i]||{v:null};
  S.undo={i:s.i,id:q.id,srs:S.srs[q.id]||null,res:S.res[q.id]||null,ids:[...s.ids],nt:{...S.nt},rev:rv};
  if(!S.srs[q.id]){newLeft();S.nt.n++;}
  S.srs[q.id]=sched(S.srs[q.id]||null,e);
  S.res[q.id]={v:rv.v,g:G2R[e],t:now()};
  s.done[s.i]=e;
  // o'rganish bosqichidagi karta sessiya ichida qaytadi
  if(s.mode==="std"&&S.srs[q.id].due-now()<=20*MIN)s.ids.splice(Math.min(s.ids.length,s.i+4),0,q.id);
  const tk=dayKey();if(!S.days.includes(tk)){S.days.push(tk);S.days=S.days.slice(-400);}
  s.i++;save();
  const card=$(".qcard");
  if(card&&!RM()){busy=true;card.classList.add("out");$(".ease")&&($(".ease").style.cssText="transition:opacity .2s;opacity:0");
    setTimeout(()=>{busy=false;render();window.scrollTo({top:0});},190);}
  else{render();window.scrollTo({top:0});}
}
function undo(){const u=S.undo,s=S.sess;if(!u||!s)return;
  if(u.srs)S.srs[u.id]=u.srs;else delete S.srs[u.id];
  if(u.res)S.res[u.id]=u.res;else delete S.res[u.id];
  S.nt=u.nt;s.ids=u.ids;s.i=u.i;delete s.done[u.i];s.rev[u.i]=u.rev;S.undo=null;save();render();toast("Bekor qilindi");}
function finishView(){
  const s=S.sess,v=Object.values(s.done),c={again:0,hard:0,good:0,easy:0};v.forEach(e=>c[e]++);
  const back=s.deck&&DECK[s.deck]?()=>{S.sess=null;save();go("overview",{deck:s.deck});}:()=>{S.sess=null;save();go("decks");};
  return `<div class="stage" style="margin-top:6vh"><div class="card done qcard"><div class="em">🎉</div><h2>Tabriklaymiz!</h2><p class="muted">${esc(s.title)} — ${v.length} ta javob. Hozircha shu to'plam tugadi.</p>
    <div class="tri" style="grid-template-columns:repeat(4,1fr);max-width:520px"><div class="x"><b>${c.again}</b>qayta</div><div><b style="color:var(--hard)">${c.hard}</b>qiyin</div><div class="o"><b>${c.good}</b>yaxshi</div><div><b style="color:var(--easy)">${c.easy}</b>oson</div></div>
    <div class="acts"><button class="btn primary" ${act(back)}>Davom etish</button></div></div></div>`;
}

// ---------- animatsiya ----------
const RM=()=>!!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);
let lastNav="",lastRev="",lastPct=0;
function themeSwap(e){
  const set=()=>document.documentElement.dataset.theme=S.theme;
  if(!document.startViewTransition||RM())return set();
  const x=e?e.clientX:innerWidth/2,y=e?e.clientY:innerHeight/2,R=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  document.startViewTransition(set).ready.then(()=>document.documentElement.animate({clipPath:[`circle(0 at ${x}px ${y}px)`,`circle(${R}px at ${x}px ${y}px)`]},{duration:550,easing:"cubic-bezier(.4,0,.2,1)",pseudoElement:"::view-transition-new(root)"}));
}
function countUp(el){
  const t=el.textContent.trim();if(!/^\d+%?$/.test(t))return;
  const n=parseInt(t),suf=t.endsWith("%")?"%":"";if(n<2)return;
  const t0=performance.now(),D=700+Math.min(n,400);
  const f=ts=>{const k=Math.min(1,(ts-t0)/D),v=Math.round(n*(1-Math.pow(1-k,3)));el.textContent=v+suf;if(k<1)requestAnimationFrame(f);};
  el.textContent="0"+suf;requestAnimationFrame(f);
}
function confetti(){
  const C=["#5b4ee0","#8b5cf6","#22c55e","#f59e0b","#ef4444","#3b82f6","#ec4899"];
  for(let i=0;i<90;i++){const c=document.createElement("i");c.className="confetti";
    c.style.cssText=`left:${Math.random()*100}vw;background:${C[i%C.length]};--x:${(Math.random()-.5)*300}px;--r:${Math.random()*1080-540}deg;--d:${1.8+Math.random()*1.8}s;animation-delay:${Math.random()*.5}s;${Math.random()<.4?"border-radius:50%;width:8px;height:8px":""}`;
    document.body.appendChild(c);setTimeout(()=>c.remove(),4200);}
}
document.addEventListener("pointerdown",e=>{
  const b=e.target.closest(".btn,.opt,.chip,.ease button,.icon-btn");if(!b||b.disabled||RM())return;
  const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");
  s.className="rip";s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  b.appendChild(s);setTimeout(()=>s.remove(),600);
});
// kursor spotlight + qcard tilt
document.addEventListener("pointermove",e=>{
  const c=e.target.closest&&e.target.closest(".card");if(!c||RM())return;
  const r=c.getBoundingClientRect();c.style.setProperty("--mx",(e.clientX-r.left)+"px");c.style.setProperty("--my",(e.clientY-r.top)+"px");
  if(c.classList.contains("qcard")&&matchMedia("(hover:hover)").matches){const rx=((e.clientY-r.top)/r.height-.5)*-3,ry=((e.clientX-r.left)/r.width-.5)*3;c.style.setProperty("--tilt",`perspective(1400px) rotateX(${rx}deg) rotateY(${ry}deg)`);}
},{passive:true});

function render(){
  {const keep={};document.querySelectorAll("#sheet [data-a]").forEach(el=>{const k=el.dataset.a;if(ACT[k])keep[k]=ACT[k];});ACT=keep;}
  const app=$("#app"),ss=S.sess;
  const nav=[V.view,V.deck,!!V.search.trim(),V.view==="study"&&ss?ss.i+"/"+ss.title:""].join("|");
  const rev=V.view==="study"&&ss&&ss.rev[ss.i]?nav:"";
  const navAnim=nav!==lastNav,revAnim=!navAnim&&rev&&rev!==lastRev;
  lastNav=nav;lastRev=rev;
  app.innerHTML=V.view==="study"?studyView():V.view==="overview"?overview():V.view==="doc"?docView():V.view==="docs"?docsLib():decksView();
  app.classList.remove("anim","anim-rev");
  if(navAnim||revAnim){void app.offsetWidth;app.classList.add(navAnim?"anim":"anim-rev");}
  V.fresh="";
  [".today .card",".dk",".ov-counts div",".opt",".ease button",".tri div",".results .res",".exp>*"].forEach(sel=>app.querySelectorAll(sel).forEach((el,i)=>el.style.setProperty("--i",Math.min(i,14))));
  const bar=app.querySelector(".dtop .pbar i");
  if(bar&&window.requestAnimationFrame){const w=bar.style.width;if(!RM()){bar.style.width=lastPct+"%";requestAnimationFrame(()=>requestAnimationFrame(()=>bar.style.width=w));}lastPct=parseFloat(w)||0;}
  bionic(app);
  if(S.rd.focus&&!app.querySelector(".focus-exit"))app.insertAdjacentHTML("afterbegin",`<button class="focus-exit" ${act(()=>{S.rd.focus=false;applyRead();render();})}>✕ Fokusdan chiqish</button>`);
  if(navAnim&&!RM()){app.querySelectorAll(".today .v,.ov-counts b,.tri b").forEach(countUp);if(app.querySelector(".done"))confetti();}
  const sq=$("#sq");if(sq)sq.oninput=e=>{V.search=e.target.value;const pos=e.target.selectionStart;render();const n=$("#sq");n.focus();n.setSelectionRange(pos,pos);};
}
document.addEventListener("keydown",e=>{
  const tag=e.target.tagName;
  if(e.key==="Escape"&&$("#sheet")){closeSheet();return;}
  if(e.key==="Escape"&&S.rd.focus&&tag!=="INPUT"&&tag!=="TEXTAREA"){S.rd.focus=false;applyRead();render();return;}
  if(tag==="TEXTAREA"){if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();$("#show")&&$("#show").click();}if(e.key==="Escape")e.target.blur();return;}
  if(tag==="INPUT"){if(e.key==="Escape"){V.search="";render();}return;}
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(V.view!=="study"){if(e.key==="/"){e.preventDefault();$("#sq")&&$("#sq").focus();}if(e.key==="Escape"&&V.view==="overview")go("decks");if(e.key==="Escape"&&V.view==="doc")location.hash="docs";return;}
  if(e.key==="Escape"){const s=S.sess;s&&s.deck&&DECK[s.deck]?go("overview",{deck:s.deck}):go("decks");return;}
  if(e.key==="z"||e.key==="Z"){undo();return;}
  const show=$("#show");
  if(show){
    if(e.key===" "||e.key==="Enter"){e.preventDefault();show.click();return;}
    return;}
  if(/^[1-4]$/.test(e.key)){const b=document.querySelector(`.ease [data-e="${EASE[+e.key-1][0]}"]`);b&&b.click();}
  else if(e.key===" "||e.key==="Enter"){e.preventDefault();const b=document.querySelector(".ease .sug")||document.querySelector('.ease [data-e="good"]');b&&b.click();}
});
render();
route();
</script>
</body>
</html>
